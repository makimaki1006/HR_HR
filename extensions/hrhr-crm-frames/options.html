<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>HR_HR CRM Frames 設定</title>
<style>
body{font:14px system-ui,sans-serif;max-width:640px;margin:24px auto;padding:0 16px}
textarea{width:100%;height:280px;font:13px ui-monospace,monospace;box-sizing:border-box}
.err{color:#b00020;white-space:pre-wrap}.ok{color:#0a7a3d}.note{background:#fff4d6;padding:8px;border-radius:4px}
button{padding:6px 14px;margin-right:8px}
</style></head>
<body>
<h1>HR_HR CRM Frames</h1>
<p>CRM 画面 (/app/crm) の iframe では、ここに無いサイトのフレーム拒否 (X-Frame-Options / CSP) を外します。
下のドメイン (サブドメイン含む) は<strong>何も変えません</strong>。</p>
<p id="managed" class="note" hidden>管理者ポリシーで固定されているため編集できません。</p>
<textarea id="list" spellcheck="false" aria-label="ブロックリスト"></textarea>
<p>1 行に 1 ドメイン (例: example.com)。URL・パス・ポート・ワイルドカードは不可。# で始まる行はコメント。</p>
<p><button id="save">保存</button><button id="reset">既定に戻す</button></p>
<p id="msg" role="status"></p>
<script type="module" src="options.js"></script>
</body></html>
