# cargo-audit 設定 (CI: .github/workflows/ci.yml の security-audit ジョブが参照)
#
# 【方針】
#   新しく増えた脆弱性は必ず赤で気付ける状態を保ちたいので、ジョブ自体は毎回走らせる。
#   そのうえで「評価済みで当面許容する」ものだけをここに列挙し、理由を残す。
#   ここに書いていない脆弱性が出たら検出される (= 警報として機能する)。
#
# 【許容の判断根拠 (2026-08-02 評価)】
#   対象はいずれも求人票生成の PDF / Excel 取込で使う解析ライブラリの間接依存。
#   - アップロードできるのはログイン済みの社内利用者のみ (未認証は 303 でログインへ)
#   - 扱うファイルは自社で用意する求人票であり、外部から送り付けられる不審ファイルではない
#   - 最悪の結果はプロセス停止 (スタックオーバーフロー / メモリ枯渇) で、
#     情報漏洩やコード実行ではない。Render 側で自動再起動する
#   よって緊急の依存更新は行わず、上流 (pdf-extract / calamine) が新しい版を
#   取り込んだ時点で解消する方針とする。
#
# 【解除の目安】
#   pdf-extract が lopdf >= 0.42、calamine が quick-xml >= 0.41 を引くようになったら
#   該当行を削除して、実際に解消したことを cargo audit で確認する。

[advisories]
ignore = [
    # lopdf 0.34 (pdf-extract 0.7.12 経由): 深くネストした PDF オブジェクトでスタックオーバーフロー
    # 解消条件: lopdf >= 0.42
    "RUSTSEC-2026-0187",
    # quick-xml 0.31 (calamine 0.26.1 経由): 開始タグの重複属性チェックが二次時間になる
    # 解消条件: quick-xml >= 0.41
    "RUSTSEC-2026-0194",
    # quick-xml 0.31 (calamine 0.26.1 経由): 名前空間宣言の無制限確保によるメモリ枯渇
    # 解消条件: quick-xml >= 0.41
    "RUSTSEC-2026-0195",
    # rand 0.8.5: unsound 警告 (上流依存が 0.8 系を掴んでいるため単独では上げられない)
    "RUSTSEC-2026-0097",
]
