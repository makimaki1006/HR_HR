services:
  - type: web
    name: hellowork-dashboard
    runtime: docker
    region: oregon
    plan: free
    healthCheckPath: /health
    dockerArgs:
      GITHUB_TOKEN:
        sync: false
    envVars:
      - key: PORT
        value: "9216"
      - key: RUST_LOG
        value: info
      - key: AUTH_PASSWORD
        sync: false
      - key: ALLOWED_DOMAINS
        value: "f-a-c.co.jp"
      - key: HELLOWORK_DB_PATH
        value: "data/hellowork.db"
      # 架電クオリティ(/call-quality) と 営業KPI(/sales-kpi) が読む
      # スプレッドシート「リクロジ分析_Hubspot」。この2つが無いと
      # 両方のページが 503（not_configured）を返す。
      # 値は Render のダッシュボードで設定する（リポジトリに置かない）。
      - key: SPREADSHEET_ID
        sync: false
      # Google サービスアカウントの鍵を base64 にしたもの。
      # 手元の credentials/call_quality_sa.json と同じ鍵。
      #   base64 -w0 call_quality_sa.json
      - key: GOOGLE_SA_KEY_B64
        sync: false
      - key: TURSO_EXTERNAL_URL
        sync: false
      - key: TURSO_EXTERNAL_TOKEN
        sync: false
      # Scout(スカウト自動化) 中央バックエンド用。値は Render の環境変数で設定(リポジトリに置かない)。
      - key: SCOUT_TURSO_URL
        sync: false
      - key: SCOUT_TURSO_TOKEN
        sync: false
      - key: SCOUT_ADMIN_TOKEN
        sync: false
      # Base64-encoded 32-byte AES-256 key for workspace-scoped Scout credentials.
      - key: SCOUT_CREDENTIALS_KEY
        generateValue: true
