name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # -----------------------------------------------------------------------
  # Statistical-expression lint
  # Checks src/handlers/survey/report_html/**/*.rs for forbidden patterns:
  #   - causal / effect-promise language
  #   - hyperbolic words (劇的, 完璧)
  #   - absolute guarantees (必ず+outcome)
  #   - assertive labels (離職多発 without disclaimer, 流出継続)
  # Runs in parallel with rust-test (no dependency).
  # -----------------------------------------------------------------------
  lint-statistical-claims:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Statistical claims lint
        run: python scripts/lint_statistical_claims.py

  # -----------------------------------------------------------------------
  # CSS クラス存在検査 (段 1 / 静的)
  # 配っている CSS に無いクラスを書いても、この画面では何も起きず素通りする
  # (Tailwind は JIT ではなく static/css/tailwind-precompiled.css で配布)。
  # 2026-09-10 に sky-* / rose-* / z-20 / backdrop-blur が丸ごと無効だった。
  # 数秒で終わるので全 PR で回す。実 DOM を読む段 2 は regression.yml (nightly)。
  #
  # 注: cargo test --lib は tests/ 配下の統合テストを走らせない。
  #     この検査は tests/css_classes_exist.rs なので明示的に指定する。
  # -----------------------------------------------------------------------
  lint-css-classes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: 未定義クラスの静的検査 (段 1)
        run: cargo test --test css_classes_exist
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # 段 2 の照合ロジックが壊れていないことだけ、ブラウザ抜きで毎 PR 確認する。
      # 「未定義 0 件」は照合が壊れていても出るので、逆から押さえておく
      - name: 段 2 の照合が機能していることの確認
        run: node scripts/audit_css_classes.selftest.js

  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt -- --check
      - name: Clippy (errors only; warnings reported but non-blocking)
        run: cargo clippy --all-targets
      - name: Unit tests
        run: cargo test --lib
      - name: Build release
        run: cargo build --release

  security-audit:
    runs-on: ubuntu-latest
    # 既知の依存脆弱性（別途 .cargo/audit.toml で ignore 登録）。
    # 発見時は GitHub Issue が自動作成されるがジョブ失敗はCI全体の赤化を招くため許容。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/audit@v1

  # Slack 通知: CI 失敗時のみ送信（Secrets.SLACK_WEBHOOK_URL が未設定なら実行時にskip）
  notify:
    runs-on: ubuntu-latest
    needs: [rust-test, lint-statistical-claims, lint-css-classes]
    if: failure()
    steps:
      - name: Slack notification on failure
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"🚨 CI failure on ${{ github.repository }} @ ${{ github.sha }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}' \
            "$SLACK_WEBHOOK_URL"
