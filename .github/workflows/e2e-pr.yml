# PR ごとの E2E (共通基盤)。fixture SQLite + ビルド済み Rust + React ビルド + Playwright (chromium)。
# 各移行チームは tests/e2e/pr/ に spec を足す (使い方: tests/e2e/pr/playwright.pr.config.ts 冒頭)。
# nightly の本番 smoke (regression.yml) とは別物。ci.yml は変更しない。
#
# cargo build は debug を使う: release は LTO/最適化で ci.yml の rust-test ジョブの
# 「Build release」に相当する時間がかかる。E2E の fixture は 63 行で速度が要らないため。
# (Swatinem/rust-cache のキーは ci.yml の debug 系ジョブと共有されないので、初回は全ビルド。)
name: E2E (PR)

on:
  pull_request:
    branches: [main]

# 同じ PR / ブランチで新しい実行が始まったら、古い実行は止める。
# main への push は止めない (全コミットの結果を残す)。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # spec ファイルを 3 台のランナーに分けて並列に流す。各ランナーが自分のサーバと
    # fixture DB を持つので、workers: 1 (サーバ・DB 共有) の前提は変わらない。
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      # ci.yml の rust-test と同じ鍵を読む (main への push で保存される) ので、新しい PR でも
      # 依存のビルドが温まった状態で始まる。保存は main のときだけ (PR ごとの肥大を防ぐ)。
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build server (debug)
        run: cargo build --bin rust_dashboard

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          check-latest: true
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - name: Build frontend (static/app)
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Generate fixture DB
        run: python scripts/e2e/make_fixture_db.py "$RUNNER_TEMP/e2e-fixture/hellowork.db"

      - name: Install Playwright (chromium only)
        run: |
          npm ci
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Run PR E2E
        env:
          E2E_BIN: ${{ github.workspace }}/target/debug/rust_dashboard
          E2E_FIXTURE_DB: ${{ runner.temp }}/e2e-fixture/hellowork.db
          E2E_KEEP_WORKDIR: "1"
        run: |
          export PDF_CHROMIUM_PATH="$(node -e 'process.stdout.write(require("@playwright/test").chromium.executablePath())')"
          npx playwright test -c tests/e2e/pr/playwright.pr.config.ts --shard=${{ matrix.shard }}/3

      - name: Email tracking display and self-open protection (fake data only)
        if: matrix.shard == 1
        run: npx playwright test -c tests/e2e/crm-email-tracking.config.ts

      - name: Email thread display E2E (fake data only)
        if: matrix.shard == 1
        run: npx playwright test -c tests/e2e/crm-email-thread.config.ts

      - name: Email compose usability (fake data only)
        if: matrix.shard == 1
        run: npx playwright test -c tests/e2e/crm-email-compose.config.ts

      - name: Role property layout E2E
        if: matrix.shard == 1
        run: npx playwright test -c tests/e2e/crm-property-layout.config.ts

      - name: Saved queue views E2E (fictional data only)
        if: matrix.shard == 1
        run: npx playwright test -c tests/e2e/crm-saved-views.config.ts

      - name: Today's caller metrics E2E (fictional data only)
        if: matrix.shard == 1
        run: npx playwright test -c tests/e2e/crm-caller-metrics.config.ts

      - name: Upload traces and screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-pr-report-${{ matrix.shard }}
          path: |
            test-results-pr/
            test-results/email-tracking/
            test-results/email-compose/
            playwright-report-pr/
            /tmp/hp_e2e_*/server.log
          if-no-files-found: ignore
          retention-days: 7
