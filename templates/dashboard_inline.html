    <script>
    // Leaflet 遅延ローダー（地図タブ初回表示時にのみロード）
    window.ensureLeaflet=(function(){var p=null;return function(){if(window.L)return Promise.resolve();if(p)return p;p=new Promise(function(ok){var c=document.createElement('link');c.rel='stylesheet';c.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';c.integrity='sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H';c.crossOrigin='anonymous';document.head.appendChild(c);var s=document.createElement('script');s.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';s.integrity='sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH';s.crossOrigin='anonymous';s.onload=ok;document.head.appendChild(s)});return p}})();

<body class="bg-navy-900 text-slate-100 min-h-screen">
    <!-- 2026-05-15: 業種プルダウン(industry-panel)が overflow-x-hidden で切り取られる
         問題を修正。CSS 仕様で overflow-x: hidden + overflow-y 未指定だと暗黙的に
         overflow-y: auto になり Y 軸も clipping され、mt-1 で下に開く panel が
         header 下端で消える。overflow-x: clip は Y 軸への副作用が無く、現代
         ブラウザ (Chrome/Edge 90+, Firefox 81+, Safari 16+) で動作。
         未対応ブラウザは visible にフォールバックし、wrap で横スクロール抑止。 -->
    <!-- 2026-09-11: ヘッダで使っていたクラス 3 つが static/css/tailwind-precompiled.css に
         実在せず、無言で効いていなかった（precompiled は「実際に使った分だけ手で足す」
         方式なので、書いただけでは存在しない）。実在するものに寄せた。
           ・sm:gap-4  → md:gap-4   … sm 段は precompiled に gap が 1 つも無い。
                                      md:gap-4 は実在。広がる幅が 640px→768px に上がるが、
                                      640〜767px はヘッダが詰まる帯なので gap-2 のままで困らない。
           ・p-1.5     → p-2        … p-1.5 は無い。p-1(4px)/p-2(8px) が候補で、
                                      「?」は現状 padding 0 の極小クリック領域なので広い方を採った。
           ・self-center → 親に items-center
                                    … self-center は無い。親を items-center にすれば
                                      「よく使う:」が縦中央に来る。兄弟のプリセット
                                      ボタンは 4 つとも同じ高さなので見た目は変わらない。
         置換候補は必ず grep で tailwind-precompiled.css にあることを確認してから採用すること。 -->
    <header class="bg-navy-800 border-b border-slate-700 px-4 sm:px-6 py-3 flex items-center justify-between flex-wrap gap-2" style="overflow-x: clip;">
        <div class="flex items-center gap-2 md:gap-4 flex-wrap">
            <h1 class="text-lg font-bold text-white">求人ダッシュボード</h1>

                 気づかれない・選びにくいという指摘への対応。
                   ・「絞り込み」の枠で 3 つがひとまとまりの条件だと分かるようにした
                   ・絵文字だけでなく「何を選ぶ欄か」の文字ラベルを常時表示
                   ・クリック対象を拡大（高さ 36px 以上・パディング増）
                   ・未選択（全国 / すべて / 全産業）と選択済みで配色を変える
                     選択済みを示す .is-active は updateBreadcrumb() と
                     updateIndustryLabel() が付け外しする（下部 script 参照）

    <script>
    // タブ切替・フィルタ変更時のローディングフィードバック
    // 2026-06-05: 同タブ再クリックや afterSwap/afterSettle 不発火・通信エラー・
    //   タイムアウト時にオーバーレイが残留する問題に対応。
    //   開始は beforeRequest、終了は afterSettle に加え、必ず発火する
    //   afterRequest と error 系イベントでもフェイルセーフ解除する。
    (function() {
        function isContentReq(e) {
            var c = document.getElementById('content');
            return c && e && e.detail && e.detail.target === c;
        }
        function startLoading() {
            var c = document.getElementById('content');
            if (!c) return;
            c.classList.add('loading');
            var ov = document.getElementById('loading-overlay');
            if (ov) ov.classList.add('active');
        }
        function stopLoading(retriggerAnim) {
            var c = document.getElementById('content');
            if (!c) return;
            c.classList.remove('loading');
            c.style.opacity = '';
            var ov = document.getElementById('loading-overlay');
            if (ov) ov.classList.remove('active');
            if (retriggerAnim) {
                // コンテンツのフェードインアニメーションを再トリガー
                var children = c.children;
                for (var i = 0; i < children.length; i++) {
                    children[i].style.animation = 'none';
                    children[i].offsetHeight; // 強制リフロー
                    children[i].style.animation = '';
                }
            }
        }

        document.body.addEventListener('htmx:beforeRequest', function(e) {
            if (isContentReq(e)) startLoading();
        });
        document.body.addEventListener('htmx:afterSettle', function(e) {
            var c = document.getElementById('content');
            if (c) stopLoading(true);
        });
        // フェイルセーフ: afterRequest は成功・失敗いずれでも発火。
        // エラー/タイムアウトで afterSettle が来ないケースでもオーバーレイを解除する。
        document.body.addEventListener('htmx:afterRequest', function(e) {
            if (isContentReq(e)) stopLoading(false);
        });
        document.body.addEventListener('htmx:responseError', function() { stopLoading(false); });
        document.body.addEventListener('htmx:sendError', function() { stopLoading(false); });
        document.body.addEventListener('htmx:timeout', function() { stopLoading(false); });
    })();

    // 面を切り替えると画面が下にずれる問題への対応 (2026-09-10)
    //
    // 採用市場の面・並べ替え・ページ送りは hx-swap="innerHTML show:top" を持つ。
    // show:top は #content を必ず画面の先頭へ送るので、いちばん上にいる人が面を
    // 切り替えると、押しただけでヘッダの絞り込みが画面外に出る (#content の上端＝
    // 214px あたりまで下がる)。下の方から押したときに上へ戻るのは妥当なので、
    // 「もともと #content の上端より上にいた場合だけ」動かさないようにする。
    //
    // htmx は afterSettle を出したあとにスクロールする (htmx 2.0.4 の doSettle →
    // updateScrollState の順)。requestAnimationFrame でそのあとに戻せば、描画前に
    // 元の位置へ戻るのでちらつかない。
    (function() {
        var scrollBefore = null;
        document.body.addEventListener('htmx:beforeSwap', function(e) {
            var c = document.getElementById('content');
            if (c && e.detail && e.detail.target === c) scrollBefore = window.scrollY;
        });
        document.body.addEventListener('htmx:afterSettle', function() {
            if (scrollBefore === null) return;
            var y = scrollBefore;
            // afterSettle は差し込んだ要素の数だけ飛んでくるので、最初の 1 回で使い切る
            scrollBefore = null;
            var c = document.getElementById('content');
            if (!c) return;
            // ここはまだ htmx がスクロールする前。この時点の座標が「元の位置」での上端
            var contentTop = c.getBoundingClientRect().top + window.scrollY;
            // 中身の途中を見ていたのなら、従来どおり先頭に送ってよい
            if (y > contentTop) return;
            requestAnimationFrame(function() {
                if (Math.abs(window.scrollY - y) > 1) window.scrollTo(0, y);
            });
        });
    })();
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // ==== どのタブ・どの面を見ていたかの記憶 (2026-09-10) ====
            //
            // 覚えるものは 2 つある。
            //  1) タブごとの「最後に見ていた URL」(面 view・並べ替え sort 付き)
            //     これまでは 1 つしか覚えていなかったので、採用市場 → 企業検索 →
            //     採用市場 と往復すると面と並べ替えが消えた。タブ単位の連想配列にする。
            //  2) 「この URL のページで最後に開いていたタブ」
            //     ?tab= は履歴を汚さないよう replaceState で消しているため、
            //     再読込すると何を見ていたか分からず既定タブに落ちていた。
            //     URL は消したままにしたいので sessionStorage に置く。
            //     キーを location (pathname + search) 別にしてあるので、戻るで
            //     履歴の最初 (/) に着いたときも「そこで見ていたタブ」に戻せる。
            //
            // sessionStorage はプライベートモード等で例外を投げるので必ず包む。
            var TAB_MAP_KEY = 'hrdash:tabs';
            var ENTRY_KEY_PREFIX = 'hrdash:entry:';
            function ssGet(k) { try { return sessionStorage.getItem(k); } catch (e) { return null; } }
            function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { /* 保存できなくても画面は動かす */ } }
            function ssDel(k) { try { sessionStorage.removeItem(k); } catch (e) { /* 同上 */ } }
            function entryKey() { return ENTRY_KEY_PREFIX + location.pathname + location.search; }
            // '/tab/indeed?view=titles' → '/tab/indeed' (タブボタンの hx-get と同じ粒度)
            function tabKeyOf(url) {
                var pathOnly = (url || '').split('?')[0];
                return '/' + pathOnly.split('/').slice(1, 3).join('/');
            }
            // pref は覚えない (理由は下の htmx:configRequest のコメント参照)
            function stripPref(url) {
                var c = (url || '').split('?');
                if (!c[1]) return c[0];
                var keep = c[1].split('&').filter(function(p) { return p.indexOf('pref=') !== 0; });
                return keep.length ? c[0] + '?' + keep.join('&') : c[0];
            }
            var tabFullUrls = (function() {
                try { return JSON.parse(ssGet(TAB_MAP_KEY)) || {}; } catch (e) { return {}; }
            })();
            window._tabFullUrls = tabFullUrls;
            var entryFixup = null;
            function rememberTab(fullUrl) {
                if (!fullUrl || fullUrl.indexOf('/tab/') !== 0) return;
                tabFullUrls[tabKeyOf(fullUrl)] = fullUrl;
                // 1 つしか覚えていなかったころの名前。参照が残っていても壊れないよう維持する
                window._lastTabFullUrl = fullUrl;
                ssSet(TAB_MAP_KEY, JSON.stringify(tabFullUrls));
                var key = entryKey();
                entryFixup = { key: key, prev: ssGet(key), url: fullUrl };
                ssSet(key, fullUrl);
            }
            // 押した瞬間の URL をキーにすると、hx-push-url で URL が変わる遷移
            // (職種辞典 → 職種の詳細) のときに「/ で見ていたもの」を詳細で上書きして
            // しまい、戻ったときに詳細が出る。htmx は swap の前に pushState する
            // (htmx 2.0.4 の handleAjaxResponse) ので、swap 後に URL が変わって
            // いたら、元のキーの値を戻してから新しいキーに書き直す。
            document.body.addEventListener('htmx:afterSettle', function() {
                if (!entryFixup) return;
                var f = entryFixup;
                entryFixup = null;
                if (entryKey() === f.key) return;

                ssSet(entryKey(), f.url);
            });
            // 復元に使うのは「基底パス + クエリ」のときだけ。'/tab/driver/123' の
            // ような詳細ページまで復元すると、タブを押した人が一覧ではなく前回の
            // 詳細に飛ばされて驚く (従来 reloadActiveTab が使っていた条件と同じ)。
            function rememberedFor(base) {
                var v = tabFullUrls[tabKeyOf(base)];
                return (v && (v === base || v.indexOf(base + '?') === 0)) ? v : null;
            }

            // 上部タブの active を URL に合わせる。?tab= 復元と戻る/進むの両方で使う。
            //
            // クエリを外してから比べる。`/tab/indeed?view=titles` のような URL を
            // そのまま使うと basePath が `/tab/indeed?view=titles` になり、
            // ボタンの hx-get (`/tab/indeed`) と一致しない。すると active が
            // 0 個になり、2 段目のナビが畳まれたまま・県を変えても何も起きない、
            // という状態になる（共有された URL を開いた人がまさにこれを踏む）。
            function applyActiveTab(url) {
                var pathOnly = (url || '').split('?')[0];
                var basePath = '/' + pathOnly.split('/').slice(1, 3).join('/');
                document.querySelectorAll('.tab-btn').forEach(function(b) {
                    var hxGet = b.getAttribute('hx-get') || '';
                    // hx-get を持たないボタン（「調べる ▾」の開閉トグル）を除く。
                    // 除かないと hxGet が '' になり、pathOnly.startsWith('' + '/')
                    // が常に true になって一緒に active が付く。DOM 順で採用市場より
                    // 手前にあるため reloadActiveTab() がこちらを拾い、hx-get が null の
                    // まま htmx.ajax に渡って '/' へ全体遷移していた（＝県を変えると
                    // 媒体分析に戻る）。
                    var isMatch = !!hxGet && (hxGet === basePath || pathOnly === hxGet || pathOnly.startsWith(hxGet + '/'));
                    b.classList.toggle('active', isMatch);
                    if (isMatch) b.setAttribute('aria-selected', 'true');
                    else b.setAttribute('aria-selected', 'false');
                });
                // 復元でサブタブが選ばれた場合は「調べる」列を開く
                if (typeof syncExploreGroup === 'function') syncExploreGroup();
            }
            window._applyActiveTab = applyActiveTab;

            // パーシャル直接アクセス対応 (?tab= で復元):
            // /tab/driver 等を直接開くとパーシャル HTML だけが返って nav が消えるため、
            // パーシャル側がトップに ?tab=/tab/driver でリダイレクトしてくる。それを受けて
            // 対応するタブを active 化 + HTMX swap で復元する。
            // ?tab=/tab/xxx?...&pref=YY の YY を、ヘッダの県プルダウンに反映する。
            //
            // 外枠の HTML はサーバが「セッションの県」で描く。ところが ?tab= 経由では
            //   ① 外枠を描く（このときセッションはまだ前の県、または空）
            //   ② そのあと htmx が /tab/... を読み、サーバが URL の pref をセッションに書く
            // という順序なので、ヘッダは ① の時点で固定され、画面と食い違う。
            //
            // 実測（2026-09-11、セッション = 東京都 の状態で pref=北海道 の ?tab= を開いた）:
            //   タブ内の帯 = 北海道 / ヘッダ = 東京都 / パンくず = 東京都
            //   → その直後に素の / を開き直すと <option value="北海道" selected> が返る。
            // つまりサーバは既に北海道を持っていて、画面のヘッダだけが違う県を出している。
            // 空欄ではなく「別の県」を出すので、見た人は絞り込みを取り違える。
            //
            // サーバに値を送り直す必要は無いので、表示を合わせるだけにする。
            // change は発火させない。発火させると change ハンドラの reloadActiveTab() が走り、
            // すぐ下の htmx.ajax(targetUrl) と #content を取り合うことになる。
            function syncHeaderPrefFrom(url) {
                var q = (url || '').split('?')[1];
                if (!q) return;
                var raw = null;
                q.split('&').forEach(function(pair) {
                    if (pair.indexOf('pref=') === 0) raw = pair.slice(5);
                });
                if (!raw) return;
                var pref;
                try { pref = decodeURIComponent(raw); } catch (e) { return; }
                var sel = document.getElementById('pref-select');
                if (!sel || !pref || sel.value === pref) return;
                // 選択肢に無い値は入れない。入れても <select> の値は空に落ちるだけで、
                // 「ヘッダだけ全国」という別の食い違いに化ける。
                var exists = false;
                for (var i = 0; i < sel.options.length; i++) {
                    if (sel.options[i].value === pref) { exists = true; break; }
                }
                if (!exists) return;
                sel.value = pref;
                // パンくず (updateBreadcrumb) も産業ツリー (loadIndustryTree) も、
                // このファイルの下の初期化で呼ばれ、呼ばれた時点の pref-select.value を
                // 読む。ここで先に値を入れておけば、どちらも自動で揃う。
                //
                // 市区町村はここでは取り直さない。この環境で /api/municipalities_cascade を
                // 北海道・東京都・沖縄県で叩くと 3 県とも 0 バイトを返し、取り直しても
                // 増えるものが無いことを実測した。効果を確認できない追加リクエストを
                // 読み込み経路に足さない方を採る。県を選び直せば従来どおり change
                // ハンドラが取りに行くし、再読込すればサーバが外枠と一緒に描く。
            }
            var params = new URLSearchParams(location.search);
            var requestedTab = params.get('tab');
            // 2026-08-10: 既定タブを媒体分析に変更（地図は「調べる」内へ移動）
            var DEFAULT_TAB = '/tab/survey';
            var targetUrl = DEFAULT_TAB;
            if (requestedTab && requestedTab.startsWith('/tab/')) {
                targetUrl = requestedTab;
                applyActiveTab(targetUrl);
                // 上記 syncHeaderPrefFrom の説明を参照。
                // ヘッダの表示だけをサーバの現状に合わせる（リクエストは出さない）。
                syncHeaderPrefFrom(targetUrl);
                // ?tab= を URL から消す (履歴を汚さない、push でなく replace)
                // 消すのはここまでどおり。消したあとに迷子にならないよう、
                // 下の rememberTab() が「消したあとの URL」をキーにして控える。
                // state は htmx が付けた目印 ({htmx:true}) を落とさないよう引き継ぐ。
                var cleanUrl = location.pathname + location.hash;
                history.replaceState(history.state, '', cleanUrl);
            } else {
                // ?tab= 無しで来た (再読込・戻る・ブックマーク)。
                // 同じ URL で最後に開いていたタブがあれば、それを復元する。
                var savedTab = ssGet(entryKey());
                if (savedTab && savedTab.indexOf('/tab/') === 0) {
                    targetUrl = savedTab;
                    applyActiveTab(targetUrl);
                }
            }
            if (typeof syncExploreGroup === 'function') syncExploreGroup();
            // 最初の 1 回は下の htmx:configRequest リスナーより前に走るので、
            // ここで直接覚えておく（pref は除く。理由はリスナー側のコメント参照）。
            rememberTab(stripPref(targetUrl));
            htmx.ajax('GET', targetUrl, {target: '#content', swap: 'innerHTML'});

            // ==== 戻る / 進む で履歴の最初に着いたときの復帰 (2026-09-10) ====
            //
            // 履歴の最初 (?tab= の無い '/') まで戻ると #content が「読み込み中...」で
            // 止まっていた。原因は htmx の履歴復元の性質 2 つ。
            //  ・localStorage の履歴キャッシュに '/' の写しが無い (?tab= 付きで開いた
            //    回は '/?tab=...' 名で保存される) と、htmx は '/' をサーバから取り直す。
            //    返ってくるのは素のダッシュボードなので #content はテンプレートの
            //    「読み込み中...」のまま。
            //  ・キャッシュに当たっても、それが初回訪問時 (タブ読込前) の写しなら同じ。
            // どちらも「復元後に中身が空なら、そこで見ていたタブを読み直す」で拾える。
            var contentReqInFlight = 0;
            var contentReqStartedAt = 0;
            document.body.addEventListener('htmx:beforeRequest', function(e) {
                if (e.detail && e.detail.target === document.getElementById('content')) {
                    contentReqInFlight++;
                    contentReqStartedAt = Date.now();
                }
            });
            document.body.addEventListener('htmx:afterRequest', function(e) {
                if (e.detail && e.detail.target === document.getElementById('content')) {
                    contentReqInFlight = Math.max(0, contentReqInFlight - 1);
                }
            });
            // 数え違い（beforeRequest が来て afterRequest が来ない事態）で復帰が
            // 永久に止まらないよう、古い数えは無かったことにする。
            function contentReqIsRunning() {
                return contentReqInFlight > 0 && (Date.now() - contentReqStartedAt) < 20000;
            }
            function contentIsEmpty() {
                var c = document.getElementById('content');
                if (!c) return false;
                var t = (c.textContent || '').replace(/\s/g, '');
                return t === '' || t === '読み込み中...';
            }
            // いまの履歴エントリが指しているタブ URL。分からなければ null。
            function currentEntryTabUrl() {
                if (location.pathname.indexOf('/tab/') === 0) return location.pathname + location.search;
                var p = new URLSearchParams(location.search).get('tab');
                if (p && p.indexOf('/tab/') === 0) return p;
                var saved = ssGet(entryKey());
                if (saved && saved.indexOf('/tab/') === 0) return saved;
                return null;
            }
            function onHistoryNavigation() {
                var url = currentEntryTabUrl();
                var stuck = !contentReqIsRunning() && contentIsEmpty();
                if (!url) {
                    // どのタブだったか分からない (sessionStorage が使えない等)。
                    // 中身が残っているなら、当てずっぽうで active を付け替えない。
                    if (!stuck) return;
                    url = DEFAULT_TAB;
                }
                applyActiveTab(url);
                // 戻った先の面・並べ替えを覚え直す (この状態で県を変えても保たれるように)
                rememberTab(stripPref(url));
                // 復元済みの中身があるなら読み直さない。取得中なら二重に取りにいかない。
                if (!stuck) return;
                // tabcache.js の当たり判定は「保存キー = active なタブボタンの hx-get」
                // 「参照キー = リクエストの URL」で食い違っており、詳細ページを見たあとは
                // /tab/driver のキーに詳細の HTML が入っていることがある。ここで拾うと
                // 戻ったのに詳細が出るので、復帰のときだけキャッシュを捨てて取り直す。
                if (window.clearTabCache) window.clearTabCache();
                htmx.ajax('GET', url, {target: '#content', swap: 'innerHTML'});
            }
            // htmx は window.onpopstate (プロパティ代入) で履歴復元するので、
            // addEventListener のこちらとの前後関係は保証できない。0ms 遅らせて
            // 「復元されたあとの状態」を見てから判断する。キャッシュミスでサーバから
            // 取り直す場合は復元完了がさらに後になるため、htmx:historyRestore でも
            // もう一度見る (どちらから来ても contentIsEmpty で二重実行を防ぐ)。
            window.addEventListener('popstate', function() { setTimeout(onHistoryNavigation, 0); });
            document.body.addEventListener('htmx:historyRestore', function() { setTimeout(onHistoryNavigation, 0); });

            // ブレッドクラム更新
            window.updateBreadcrumb = function() {
                var prefSel = document.getElementById('pref-select');
                var muniSel = document.getElementById('muni-select');
                var bcJob = document.getElementById('bc-job');
                var bcPref = document.getElementById('bc-pref');
                var bcMuni = document.getElementById('bc-muni');
                var bcMuniSep = document.getElementById('bc-muni-sep');

                if (bcJob) {
                    var btnText = document.getElementById('industry-btn-text');
                    bcJob.textContent = btnText ? btnText.textContent : '全産業';
                }
                if (prefSel && bcPref) {
                    bcPref.textContent = prefSel.value ? prefSel.options[prefSel.selectedIndex].text : '全国';
                    bcPref.classList.toggle('bc-chip-area-active', !!prefSel.value);
                }
                // 2026-08-10: ヘッダーの選択欄自体にも「絞り込み中」の見た目を付ける
                // （未選択＝全国 / すべて のときは通常配色）
                if (prefSel) prefSel.classList.toggle('is-active', !!prefSel.value);
                if (muniSel) muniSel.classList.toggle('is-active', !!muniSel.value);
                if (muniSel && bcMuni && bcMuniSep) {
                    if (muniSel.value) {
                        bcMuni.textContent = muniSel.options[muniSel.selectedIndex].text;
                        bcMuni.classList.remove('hidden');
                        bcMuniSep.classList.remove('hidden');
                    } else {
                        bcMuni.classList.add('hidden');
                        bcMuniSep.classList.add('hidden');
                    }
                }
            }

            // 初回表示時にブレッドクラム更新
            updateBreadcrumb();

            // 地域フィルタに依存しないツールタブ (iframe ホスト)。
            // フィルタ変更で再読み込みすると、入力途中の求人票や診断結果が
            // 巻き添えで消えるため再読み込み対象から除外する (2026-08-04)。
            function isToolTab(url) {
                return url === '/tab/jobgen_tools' || url === '/tab/keyword_tools';
            }
            // タブの読み込み URL を、面 (view) や並べ替え (sort) のクエリごと覚えておく。
            //
            // タブボタンの hx-get は基底パス（`/tab/indeed`）しか持たないので、
            // それだけで取り直すと `?view=titles` のような面の指定が落ちて、
            // 県を変えるたびに「全体」に戻ってしまう。URL は書き換わらないので
            // URL と画面が食い違う。
            //
            // 2026-09-10: 同じ理由で、タブボタンを押して戻ってきたときも、その
            // タブで最後に見ていた面・並べ替えの URL に差し替える (下のキャプチャ
            // 段階のリスナー)。tabcache.js も同じ htmx:configRequest で path を見て
            // キャッシュを引くため、あちらより先に走るようキャプチャ段階で登録する
            // (tabcache.js は本ファイルより前に読まれ、バブル段階で待っている)。
            document.body.addEventListener('htmx:configRequest', function(e) {
                var raw = e.detail.path || '';
                // 既にクエリが付いているものは呼び出し側が決めた URL なので触らない
                if (raw.indexOf('/tab/') !== 0 || raw.indexOf('?') !== -1) return;
                var elt = e.detail.elt;
                if (!elt || !elt.classList || !elt.classList.contains('tab-btn')) return;
                // 上部ナビ (と「調べる」のサブタブ列) のボタンだけが対象。
                // タブの中にある絞り込み（採用市場の県・並べ替え）は hx-include で
                // view/sort を送ってくるので、ここで URL にも足すと二重に付く。
                if (!elt.closest || !elt.closest('nav, #explore-subnav')) return;
                var remembered = rememberedFor(raw);
                if (remembered && remembered !== raw) e.detail.path = remembered;
            }, true);
            document.body.addEventListener('htmx:configRequest', function(e) {
                var raw = e.detail.path || '';
                if (raw.indexOf('/tab/') !== 0) return;
                var cut = raw.split('?');
                var base = cut[0];
                var kv = {};
                // hx-get の URL に元から付いているクエリ
                if (cut[1]) {
                    cut[1].split('&').forEach(function(pair) {
                        var i = pair.indexOf('=');
                        if (i > 0) kv[decodeURIComponent(pair.slice(0, i))] = decodeURIComponent(pair.slice(i + 1));
                    });
                }
                // hx-include で足されるもの（並べ替えの select など）
                for (var k in e.detail.parameters) {
                    if (Object.prototype.hasOwnProperty.call(e.detail.parameters, k)) kv[k] = e.detail.parameters[k];
                }
                // pref は覚えない。ここで覚えると、県を変えたときの取り直しに
                // 古い pref が乗って、サーバ側でセッションの新しい県より優先され、
                // 「県を変えても何も変わらない」ことになる。
                delete kv.pref;
                var q = [];
                for (var k2 in kv) {
                    if (Object.prototype.hasOwnProperty.call(kv, k2) && kv[k2] !== '' && kv[k2] != null) {
                        q.push(encodeURIComponent(k2) + '=' + encodeURIComponent(kv[k2]));
                    }
                }
                rememberTab(q.length ? base + '?' + q.join('&') : base);
            });

            function reloadActiveTab() {
                // hx-get を持つものだけを見る。持たないボタンを拾うと url が null になり、
                // htmx.ajax('GET', null, ...) が '/' への全体遷移になって、
                // いま見ているタブが既定タブに置き換わる。
                var activeBtn = document.querySelector('.tab-btn.active[hx-get]');
                if (!activeBtn) return;
                var base = activeBtn.getAttribute('hx-get');
                if (!base || isToolTab(base)) return;
                // 同じタブを見ている間は、面や並べ替えを含む URL のほうを使う
                var url = rememberedFor(base) || base;
                htmx.ajax('GET', url, {target: '#content', swap: 'innerHTML'});
            }

            // セレクトボックスのオプション安全更新
            function safeSetOptions(selectEl, optionHtml, defaultOption) {
                while (selectEl.options.length > 0) { selectEl.remove(0); }
                var def = document.createElement('option');
                def.value = '';
                def.textContent = defaultOption;
                selectEl.appendChild(def);
                if (optionHtml) {
                    var tmp = document.createElement('select');
                    tmp.insertAdjacentHTML('afterbegin', optionHtml);
                    while (tmp.firstChild) { selectEl.appendChild(tmp.firstChild); }
                }
                selectEl.selectedIndex = 0;
            }

            // === 産業2階層ドロップダウン ===
            // 2026-05-15: `var _selectedIndustryRaws` は DOMContentLoaded コールバック内の
            //   ローカル変数で、他の <script> タグ (survey の openVariantReport 等) から

            function _consultQueryString(sid) {

            function createSvgArrow(gid, rotated) {
                var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('class', 'w-4 h-4 text-slate-400 ind-arrow');
                svg.setAttribute('id', 'arrow-' + gid);

                svg.setAttribute('stroke', 'currentColor');
                svg.setAttribute('viewBox', '0 0 24 24');
                svg.style.cursor = 'pointer';
                svg.style.transition = 'transform 0.2s';
                if (rotated) svg.style.transform = 'rotate(90deg)';
                var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                path.setAttribute('stroke-linecap', 'round');
                path.setAttribute('stroke-linejoin', 'round');
                path.setAttribute('stroke-width', '2');
                path.setAttribute('d', 'M9 5l7 7-7 7');
                svg.appendChild(path);
                svg.addEventListener('click', function() { toggleIndustrySubs(gid); });
                return svg;
            }

            function formatNum(n) {
                return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ',');

            function renderIndustryTree(tree) {
                var list = document.getElementById('industry-tree-list');
                while (list.firstChild) list.removeChild(list.firstChild);
                var frag = document.createDocumentFragment();

                for (var i = 0; i < tree.length; i++) {
                    var group = tree[i];
                    var gid = 'ig-' + i;
                    var majorChecked = _selectedJobTypes.indexOf(group.major) >= 0;
                    var hasSubSel = false;
                    for (var k = 0; k < group.subs.length; k++) {
                        if (_selectedIndustryRaws.indexOf(group.subs[k].name) >= 0) { hasSubSel = true; break; }
                    }

                    // 大分類行
                    var row = document.createElement('div');
                    row.className = 'flex items-center gap-2 py-2 px-1 hover:bg-slate-600/40 rounded cursor-pointer';

                    var cb = document.createElement('input');
                    cb.type = 'checkbox';
                    cb.id = 'ind-major-' + i;
                    cb.className = 'ind-major-cb accent-blue-500';
                    cb.value = group.major;
                    if (majorChecked) cb.checked = true;
                    // イベントデリゲーションで処理するため個別ハンドラ不要
                    var cbLabel = document.createElement('label');
                    cbLabel.className = 'flex items-center justify-center w-8 h-8 cursor-pointer flex-shrink-0';
                    cbLabel.setAttribute('for', 'ind-major-' + i);
                    cbLabel.appendChild(cb);
                    row.appendChild(cbLabel);

                    var label = document.createElement('span');
                    label.className = 'text-sm text-white flex-1 select-none';
                    label.textContent = group.major;
                    (function(id) { label.addEventListener('click', function() { toggleIndustrySubs(id); }); })(gid);
                    row.appendChild(label);

                    var cnt = document.createElement('span');
                    cnt.className = 'text-xs text-slate-400';
                    cnt.textContent = formatNum(group.major_count);
                    row.appendChild(cnt);

                    // 中分類がある場合のみ矢印表示
                    if (group.subs.length > 0) {
                        row.appendChild(createSvgArrow(gid, hasSubSel));
                    }
                    frag.appendChild(row);

                    // 中分類パネル（中分類がある場合のみ）
                    var subsDiv = document.createElement('div');
                    subsDiv.id = gid;
                    subsDiv.className = 'pl-6 ' + (hasSubSel ? '' : 'hidden');
                    for (var j = 0; j < group.subs.length; j++) {
                        var sub = group.subs[j];
                        var subChecked = _selectedIndustryRaws.indexOf(sub.name) >= 0;
                        var subRow = document.createElement('div');
                        subRow.className = 'flex items-center gap-2 py-1.5 px-1 hover:bg-slate-600/30 rounded';

                        var scb = document.createElement('input');
                        scb.type = 'checkbox';
                        scb.id = 'ind-sub-' + i + '-' + j;
                        scb.className = 'ind-sub-cb accent-blue-400';
                        scb.setAttribute('data-major', group.major);
                        scb.value = sub.name;
                        if (subChecked) scb.checked = true;
                        // イベントデリゲーションで処理するため個別ハンドラ不要
                        var scbLabel = document.createElement('label');
                        scbLabel.className = 'flex items-center justify-center w-7 h-7 cursor-pointer flex-shrink-0';
                        scbLabel.setAttribute('for', 'ind-sub-' + i + '-' + j);
                        scbLabel.appendChild(scb);
                        subRow.appendChild(scbLabel);

                        var slabel = document.createElement('span');
                        slabel.className = 'text-xs text-slate-300 flex-1 select-none';
                        slabel.textContent = sub.name;
                        subRow.appendChild(slabel);

                        var scnt = document.createElement('span');
                        scnt.className = 'text-xs text-slate-500';
                        scnt.textContent = formatNum(sub.count);
                        subRow.appendChild(scnt);

                        subsDiv.appendChild(subRow);
                    }
                    frag.appendChild(subsDiv);
                }

                // 適用ボタン
                var applyRow = document.createElement('div');
                applyRow.className = 'mt-2 pt-2 border-t border-slate-600 flex justify-end';
                applyRow.style.position = 'sticky';
                applyRow.style.bottom = '0';
                applyRow.style.backgroundColor = '#1e293b';
                applyRow.style.zIndex = '10';
                applyRow.style.paddingBottom = '4px';
                var applyBtn = document.createElement('button');
                applyBtn.type = 'button';
                applyBtn.className = 'bg-blue-600 hover:bg-blue-500 text-white text-xs px-4 py-1.5 rounded transition';
                applyBtn.textContent = '適用';
                applyBtn.addEventListener('click', applyIndustryFilter);
                applyRow.appendChild(applyBtn);
                frag.appendChild(applyRow);

                list.appendChild(frag);
            }

            window.toggleIndustrySubs = function(gid) {
                var el = document.getElementById(gid);
                var arrow = document.getElementById('arrow-' + gid);
                if (el) {
                    el.classList.toggle('hidden');
                    if (arrow) {
                        arrow.style.transform = el.classList.contains('hidden') ? '' : 'rotate(90deg)';
                    }
                }
            };

            window.onIndustryMajorToggle = function(cb) {
                var major = cb.value;
                document.querySelectorAll('.ind-sub-cb[data-major="' + major + '"]').forEach(function(sub) {
                    sub.checked = false;
                });
                updateIndustryLabel();
            };

            window.onIndustrySubToggle = function(cb) {
                var major = cb.getAttribute('data-major');
                var majorCb = document.querySelector('.ind-major-cb[value="' + major + '"]');
                if (majorCb && cb.checked) majorCb.checked = false;
                updateIndustryLabel();
            };

            window.clearIndustryFilter = function() {
                document.querySelectorAll('.ind-major-cb, .ind-sub-cb').forEach(function(cb) { cb.checked = false; });
                updateIndustryLabel();
            };

            // プリセット適用: 指定した大分類のみチェックしてフィルタ適用
            window.applyPreset = function(majors) {
                // 全チェック解除
                document.querySelectorAll('.ind-major-cb, .ind-sub-cb').forEach(function(cb) { cb.checked = false; });
                // 指定された大分類をチェック
                majors.forEach(function(name) {
                    var cb = document.querySelector('.ind-major-cb[value="' + name + '"]');
                    if (cb) cb.checked = true;
                });
                updateIndustryLabel();
                applyIndustryFilter();
            };

            function updateIndustryLabel() {
                var majors = [], subs = [];
                document.querySelectorAll('.ind-major-cb:checked').forEach(function(cb) { majors.push(cb.value); });
                document.querySelectorAll('.ind-sub-cb:checked').forEach(function(cb) { subs.push(cb.value); });
                var btn = document.getElementById('industry-btn-text');
                var btnEl = document.getElementById('industry-btn');
                if (!btn) return;

                var text = '全産業';
                var allNames = majors.concat(subs);

                if (allNames.length === 0) {
                    text = '全産業';
                } else if (allNames.length <= 2) {
                    text = allNames.join(', ');
                } else {
                    text = allNames[0] + ' 他' + (allNames.length - 1) + '件';
                }

                btn.textContent = text;
                // 2026-08-10: 産業を 1 つでも選んでいれば「絞り込み中」の見た目にする
                if (btnEl) btnEl.classList.toggle('is-active', allNames.length > 0);
                if (btnEl && allNames.length > 0) {
                    btnEl.title = allNames.join('\n');
                } else if (btnEl) {
                    btnEl.title = '';
                }
            }

            function applyIndustryFilter() {
                var majors = [], subs = [];
                document.querySelectorAll('.ind-major-cb:checked').forEach(function(cb) { majors.push(cb.value); });
                document.querySelectorAll('.ind-sub-cb:checked').forEach(function(cb) { subs.push(cb.value); });
                // 2026-05-15: window への代入も明示的に行う (別 script tag からの参照用)
                _selectedJobTypes = majors;
                _selectedIndustryRaws = subs;
                window._selectedJobTypes = majors;
                window._selectedIndustryRaws = subs;

                if (window.clearTabCache) window.clearTabCache();
                fetch('/api/set_industry_filter', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: 'job_types=' + encodeURIComponent(majors.join(',')) + '&industry_raws=' + encodeURIComponent(subs.join(','))
                }).then(function() {
                    document.getElementById('industry-panel').classList.add('hidden');
                    var btn = document.getElementById('industry-btn');
                    if (btn) btn.setAttribute('aria-expanded', 'false');
                    updateBreadcrumb();
                    reloadActiveTab();
                });
            }

            // 産業ツリーのイベントデリゲーション（1回だけセットアップ）
            document.getElementById('industry-tree-list').addEventListener('change', function(e) {
                var cb = e.target;
                if (cb.classList.contains('ind-major-cb')) {
                    onIndustryMajorToggle(cb);
                } else if (cb.classList.contains('ind-sub-cb')) {
                    onIndustrySubToggle(cb);
                }
            });

            // 産業ツリー初期読み込み
            loadIndustryTree();

            // 都道府県切り替え（最優先フィルタ）
            var prefSelect = document.getElementById('pref-select');
            if (prefSelect) {
                prefSelect.addEventListener('change', function() {
                    if (window.clearTabCache) window.clearTabCache();
                    var content = document.getElementById('content');
                    if (content) content.style.opacity = '0.4';
                    var pref = this.value;
                    fetch('/api/set_prefecture', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                        body: 'prefecture=' + encodeURIComponent(pref)
                    }).then(function() {
                        // 市区町村カスケード取得
                        if (pref) {
                            return fetch('/api/municipalities_cascade?prefecture=' + encodeURIComponent(pref));
                        } else {
                            return Promise.resolve({ text: function() { return ''; } });
                        }
                    }).then(function(r) { return r.text(); }).then(function(html) {
                        safeSetOptions(document.getElementById('muni-select'), html, 'すべて');
                        // 産業ツリーも再読み込み
                        _industryTreeData = null;
                        loadIndustryTree();
                    }).then(function() {
                        updateBreadcrumb();
                        reloadActiveTab();
                    });
                });
            }

            // 市区町村切り替え
            var muniSelect = document.getElementById('muni-select');
            if (muniSelect) {
                muniSelect.addEventListener('change', function() {
                    if (window.clearTabCache) window.clearTabCache();
                    var content = document.getElementById('content');
                    if (content) content.style.opacity = '0.4';
                    var muni = this.value;
                    var pref = document.getElementById('pref-select').value;
                    fetch('/api/set_municipality', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                        body: 'municipality=' + encodeURIComponent(muni)
                    }).then(function() {
                        // 産業ツリーも再読み込み
                        _industryTreeData = null;
                        loadIndustryTree();
                    }).then(function() {
                        updateBreadcrumb();
                        reloadActiveTab();
                    });
                });
            }

            // 初期ラベル更新
            updateIndustryLabel();
        });
        function setActiveTab(el) {
            document.querySelectorAll('.tab-btn').forEach(function(btn) {
                btn.classList.remove('active');
                btn.setAttribute('aria-selected', 'false');
            });
            el.classList.add('active');
            el.setAttribute('aria-selected', 'true');
            var url = el.getAttribute('hx-get');
            window._lastTab = url;
            if (typeof window.showTabSkeleton === 'function') window.showTabSkeleton(url);
            syncExploreGroup();
        }

        // ==== 「調べる」グループタブ (2026-08-10) ====
        // サブタブが選択されている間はグループボタンを active 表示にし、
        // サブタブ列を開いたままにする。グループボタン自体は .tab-btn を
        // 持たないので reloadActiveTab() の hx-get 参照を邪魔しない。
        function syncExploreGroup() {
            var subnav = document.getElementById('explore-subnav');
            var groupBtn = document.getElementById('explore-group-btn');
            if (!subnav || !groupBtn) return;
            var inGroup = !!subnav.querySelector('.tab-btn.active');
            groupBtn.classList.toggle('active', inGroup);
            if (inGroup) {
                subnav.classList.remove('hidden');
                groupBtn.setAttribute('aria-expanded', 'true');
            }
        }
        function toggleExploreGroup() {
            var subnav = document.getElementById('explore-subnav');
            var groupBtn = document.getElementById('explore-group-btn');
            if (!subnav || !groupBtn) return;
            // すでにグループ内のタブを表示中なら、開閉トグルのみ
            if (subnav.querySelector('.tab-btn.active')) {
                var willHide = !subnav.classList.contains('hidden');
                subnav.classList.toggle('hidden', willHide);
                groupBtn.setAttribute('aria-expanded', willHide ? 'false' : 'true');
                return;
            }
            subnav.classList.remove('hidden');
            groupBtn.setAttribute('aria-expanded', 'true');
            // 前回開いていたサブタブ、なければ先頭（地図）を開く
            var last = window._lastExploreTab;
            var btn = last ? subnav.querySelector('.tab-btn[hx-get="' + last + '"]') : null;
            (btn || subnav.querySelector('.tab-btn')).click();
        }
        document.addEventListener('click', function(e) {
            var b = e.target && e.target.closest ? e.target.closest('#explore-subnav .tab-btn') : null;
            if (b) window._lastExploreTab = b.getAttribute('hx-get');
        }, true);
        // クロスナビ: 他タブへのリンクからタブ遷移
        function navigateToTab(tabUrl) {
            var btn = document.querySelector('.tab-btn[hx-get="' + tabUrl + '"]');
            if (btn) {
                btn.click();
            } else {
                htmx.ajax('GET', tabUrl, {target: '#content', swap: 'innerHTML'});
            }
        }
        // アイドル時に次のタブをプリフェッチ
        if ('requestIdleCallback' in window) {
            requestIdleCallback(function() {
                fetch('/tab/survey', { priority: 'low' });
            });
        }

        // 地域クリックでプルダウンを切り替え
        function switchLocation(pref, muni) {
            if (!pref) return;

            fetch('/api/set_prefecture', {
                method: 'POST',
                headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                body: 'prefecture=' + encodeURIComponent(pref)
            }).then(function() {
                return fetch('/api/municipalities_cascade?prefecture=' + encodeURIComponent(pref));
            }).then(function(r) { return r.text(); }).then(function(html) {
                var prefSelect = document.getElementById('pref-select');
                for (var i = 0; i < prefSelect.options.length; i++) {
                    if (prefSelect.options[i].value === pref) {
                        prefSelect.selectedIndex = i;
                        break;
                    }
                }

                var muniSelect = document.getElementById('muni-select');
                while (muniSelect.options.length > 0) { muniSelect.remove(0); }
                var def = document.createElement('option');
                def.value = '';
                def.textContent = 'すべて';
                muniSelect.appendChild(def);
                if (html) {
                    var tmp = document.createElement('select');
                    tmp.insertAdjacentHTML('afterbegin', html);
                    while (tmp.firstChild) { muniSelect.appendChild(tmp.firstChild); }
                }
                muniSelect.selectedIndex = 0;

                if (muni) {
                    fetch('/api/set_municipality', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                        body: 'municipality=' + encodeURIComponent(muni)
                    }).then(function() {
                        for (var j = 0; j < muniSelect.options.length; j++) {
                            if (muniSelect.options[j].value === muni) {
                                muniSelect.selectedIndex = j;
                                break;
                            }
                        }
                        if (window.updateBreadcrumb) window.updateBreadcrumb();
                        var activeBtn = document.querySelector('.tab-btn.active[hx-get]');
                        if (activeBtn) {
                            var url = activeBtn.getAttribute('hx-get');
                            if (url && !isToolTab(url)) htmx.ajax('GET', url, {target: '#content', swap: 'innerHTML'});
                        }
                    });
                } else {
                    fetch('/api/set_municipality', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                        body: 'municipality='
                    }).then(function() {
                        if (window.updateBreadcrumb) window.updateBreadcrumb();
                        var activeBtn = document.querySelector('.tab-btn.active[hx-get]');
                        if (activeBtn) {
                            var url = activeBtn.getAttribute('hx-get');
                            if (url && !isToolTab(url)) htmx.ajax('GET', url, {target: '#content', swap: 'innerHTML'});
                        }
                    });
                }
            });
        }
        // カラム表示トグル（競合検索テーブル）
        function toggleCompColumns() {
            var btn = document.getElementById('comp-col-toggle');
            var hidden = document.querySelectorAll('.comp-col-extra');
            if (!hidden.length) return;
            var isHidden = hidden[0].style.display === 'none' || hidden[0].style.display === '';
            hidden.forEach(function(el) { el.style.display = isHidden ? '' : 'none'; });
            if (btn) btn.textContent = isHidden ? '主要カラムのみ表示' : '全カラム表示';
        }

        // 統合PDFレポートを新しいタブで開く（現在のフィルタ条件を引き継ぐ）
        function openIntegratedReport() {
            var prefSel = document.getElementById('pref-select');
            var muniSel = document.getElementById('muni-select');
            var pref = prefSel ? prefSel.value : '';
            var muni = muniSel ? muniSel.value : '';
            var qs = [];
            if (pref) qs.push('prefecture=' + encodeURIComponent(pref));
            if (muni) qs.push('municipality=' + encodeURIComponent(muni));
            var url = '/report/integrated' + (qs.length ? ('?' + qs.join('&')) : '');
            window.open(url, '_blank', 'noopener,noreferrer');
        }

        // 総合診断レポートJSON出力
        function downloadInsightReport() {
            fetch('/api/insight/report')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
                    var url = URL.createObjectURL(blob);
                    var a = document.createElement('a');
                    a.href = url;
                    a.download = 'insight_report_' + new Date().toISOString().slice(0,10) + '.json';
                    a.click();
                    URL.revokeObjectURL(url);
                })
                .catch(function(e) { alert('レポート生成に失敗しました'); });
        }
    </script>
</body>
</html>
