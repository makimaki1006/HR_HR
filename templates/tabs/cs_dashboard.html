/* ================================================================ データの鮮度 */
/* 🔴 この画面は毎朝見るもの。**古いデータを新しいものと誤認させないのは画面の責任**。
   meta.today は「計算に使った基準日」で、シートを作り直した日時とは**別物**。
   シートは今のところ手で作り直しているので、基準日だけ今日になっていて
   中身は何日も前、ということが実際に起きる。だから作成日時のほうを主に出す。
   取れないときは「分かりません」と書く。推測で埋めない。 */
function setFresh(meta) {
  const box = document.getElementById("cs-fresh");
  if (!box) return;
  const src = meta && meta.source_as_of;      /* HubSpot から落とした時刻 */
  const srcAge = meta && meta.source_age_days;
  const gen = meta && meta.generated_at;      /* シートを作り直した時刻 */
  const base = meta && meta.today;            /* 計算に使った今日 */

  /* 🔴 取れないときは「分かりません」と書く。推測で埋めない */
  if (!src && !gen) {
    box.className = "fresh bad";
    box.innerHTML = "<b>このデータがいつのものか分かりません。</b>" +
      "作成日時を記録したシート（CS_メタ）が読めていません。" +
      "画面の数字が今日のものだと思わないでください。" +
      (base ? '　<span class="muted">計算の基準日 ' + esc(base) + "</span>" : "");
    return;
  }

  /* 何日前かは**元データを落とした時刻**で数える。
     古いデータを詰め直すとシートの生成時刻だけ新しくなるため。 */
  const age = srcAge != null ? srcAge : null;
  let word, cls;
  if (age == null)    { word = "";           cls = "warn"; }
  else if (age <= 0)  { word = "今日";       cls = "ok"; }
  else if (age === 1) { word = "昨日";       cls = "ok"; }
  else if (age <= 3)  { word = age + "日前"; cls = "warn"; }
  else                { word = age + "日前"; cls = "bad"; }
  box.className = "fresh " + cls;

  let h = "このデータは <b>" + (word ? word + "　" : "") +
    (src ? esc(src) : esc(gen)) + "</b> 時点のものです";
  h += src ? "（HubSpot から落とした時刻）。" : "（シートを作った時刻）。";
  if (age != null && age >= 4) {
    h += "<b>" + age + "日分の動きが入っていません。</b>";
  }
  /* 🔴 1行目（何日前・いつ時点・何日分が抜けているか）は畳まない。毎朝まず読むもの。
     残りの時刻の内訳だけ畳む（V1: 全画面の頭で2行を使い、本題を下へ押していた） */
  h += '<details class="fold"><summary>ほかの時刻（シートの作成・計算の基準日）</summary>' +
    '<span class="muted">';
  if (gen && src && gen.slice(0, 10) !== src.slice(0, 10)) {
    /* 🔴 3つの時刻は別物。混ぜないで並べる */
    h += "シートを作り直したのは " + esc(gen) + "（元データはそれより前のもの）。";
  } else if (gen) {
    h += "シートを作り直したのは " + esc(gen) + "。";
  }
  if (base) h += "計算の基準日は " + esc(base) + "（データの新しさとは別物）。";
  h += "更新は手で回しています（自動ではありません）。</span></details>";
  box.innerHTML = h;
}

/* ================================================================ 画面の並び

   上で3つ（案件 / コンサルタント / 集計）を選び、左のサイドバーで中の項目を選ぶ。
   1画面に出す選択肢を減らして、いまどこを見ているかを分かりやすくするため。

   🔴 **開いた項目だけ取りに行く。** 並べ替えただけで全部読むと重くなる。
   🔴 **折りたたみは使わない。** 左に並べば一望できるので、箱に隠す理由が無い。
   🔴 中身（図・表・数字）は前のまま。置き場所だけ変えている。
*/
const MENUS = [
  /* 🔴 ①の中は**粒度で分けてある**。同じ「顧客」でも、
     取引1件で見るのか / 事業所の契約の連なりで見るのか / 法人で拠点をまたいで見るのか で
     数字の意味が変わる。取り違えると読み間違えるので、画面を分けて粒度を明示する。 */
  { key: "deal", no: "\u2460", label: "案件",
    lead: "案件そのものを見る画面です。",
    views: [
      { key: "today",    label: "今日動く先",       path: "/api/consulting/today",
        render: (D) => renderToday(D) },
      { key: "board",    label: "案件そのもの",     path: "/api/consulting/deals",
        render: (D) => renderBoard(D) },
      { key: "series",   label: "継続を追いかける", path: "/api/consulting/customer",
        render: (D) => renderSeries(D) },
      { key: "houjin",   label: "法人番号で見る",   path: "/api/consulting/customer",
        render: (D) => renderHoujin(D) },
    ] },
  { key: "consultant", no: "\u2461", label: "コンサルタント",
    lead: "人の側から見る画面です。担当者の評価ではありません。",
    views: [
      { key: "team",     label: "担当者の一覧",     path: "/api/consulting/consultants",
        render: (D) => renderTeam(D) },
      { key: "byowner",  label: "担当者ごとの案件", path: "/api/consulting/deals",
        render: (D) => renderBoard(D) },
      { key: "handover", label: "担当の交代",       path: "/api/consulting/handover",
        render: (D) => renderHandover(D) },
      /* 2026-09-24 藤巻さんの要望で足した。接触は検知専用（多いほど良い、ではない） */
      { key: "contact",  label: "担当者ごとの接触", path: "/api/consulting/contact-trend",
        render: (D) => renderContact(D) },
    ] },
  { key: "study", no: "\u2462", label: "集計",
    lead: "調べた結果と定義です。一度読めば済む話をここに置いています。",
    views: [
      { key: "renewal", label: "継続回数 × 成果", path: "/api/consulting/renewal",
        render: (D) => renderRenewal(D) },
      { key: "outcome", label: "成果とリスク",     path: "/api/consulting/outcome",
        render: (D) => renderOutcome(D) },
      { key: "focus",   label: "いま見るべき顧客", path: "/api/consulting/focus",
        render: (D) => renderFocus(D) },
      { key: "rampup",  label: "立ち上がり",       path: "/api/consulting/rampup",
        render: (D) => renderRampup(D) },
      { key: "phone",   label: "電話",             path: "/api/consulting/phone",
        render: (D) => renderPhone(D) },
      { key: "mtgq",    label: "MTG の品質",       path: "/api/consulting/mtg-quality",
        render: (D) => renderMtgQ(D) },
      { key: "dq",      label: "データ品質",       path: "/api/consulting/data-quality",
        render: (D) => renderDq(D) },
      { key: "defs",    label: "定義と検証",       path: null,
        render: () => renderDefs() },
    ] },
];

/* いま見ているところ。既定は「案件 → 今日動く先」。毎朝いちばん見るもの */
let cur = { menu: "deal", view: "today" };
const loaded = {};
/* いま出している項目のデータ。チェックや絞り込みで描き直すときに使う */
let lastPayload = null;

const menuOf = (k) => MENUS.find((m) => m.key === k);
/* 法人を選んで見る項目。🔴 2つあるので、片方だけ直して取りこぼさないよう1か所で判定する */
const isCustView = (k) => k === "series" || k === "houjin";
const viewOf = (m, v) => (menuOf(m) || MENUS[0]).views.find((x) => x.key === v);
/** 本文から別の画面を指すときの書き方。「集計 → 成果とリスク」のように名前で書き、押すとそこへ移る。
    🔴 2026-09-24 実機（第2弾の後）: 本文に「⑧成果」「NPS は①で」「③顧客詳細」と、画面を並べ替える前の
    番号が残っていた。左のメニューは上が ①案件 ②コンサルタント ③集計、中が 1〜8 で、どれとも合わない。
    番号は並べ替えのたびにずれるので本文には書かない。名前は MENUS から引く（名前を変えても本文が追従する）。
    押すとハッシュが変わり、followUrl → go() でその画面が開く（戻るで元の画面へ戻れる）。
    行き先が MENUS に無いときはリンクにしない（見張り consulting_view_rules.js が落とす） */
function goLink(menu, view) {
  const m = MENUS.find((x) => x.key === menu);
  const v = m && m.views.find((x) => x.key === view);
  /* 行き先が無いときはリンクにしない。内部の key（英字）は画面に出さない（2026-09-24 検証） */
  if (!v) return esc(m ? m.label : "別の画面");
  return '<a class="golink" href="#' + m.key + "/" + v.key + '">' +
    esc(m.label) + " → " + esc(v.label) + "</a>";
}

/* ---------------------------------------------------------------- 上のメニュー */
function drawMenu() {
  const nav = document.getElementById("cs-menu");
  nav.innerHTML = MENUS.map((m) =>
    '<button type="button" data-m="' + m.key + '"' +
    (m.key === cur.menu ? ' class="on" aria-current="page"' : "") + ">" +
    '<span class="no">' + m.no + "</span>" + esc(m.label) + "</button>").join("");
  nav.querySelectorAll("button").forEach((b) => {
    b.onclick = () => go(b.dataset.m, null);
  });
}

/* ---------------------------------------------------------------- 左のサイドバー */
function drawSide() {
  const m = menuOf(cur.menu);
  const box = document.getElementById("cs-side");
  box.innerHTML = "<h2>" + esc(m.label) + "の中</h2><ul>" +
    m.views.map((v, i) =>
      "<li><button type=\"button\" data-v=\"" + v.key + "\"" +
      (v.key === cur.view ? ' aria-current="page"' : "") + ">" +
      esc(v.label) + '<span class="n" aria-hidden="true">' + (i + 1) +
      "</span></button></li>").join("") +
    "</ul>";
  box.querySelectorAll("button").forEach((b) => {
    b.onclick = () => go(cur.menu, b.dataset.v);
  });
}

/* ---------------------------------------------------------------- 移動
   view を省いたら、そのメニューの先頭（＝既定）を開く */
function go(menu, view, refresh, how) {
  const m = menuOf(menu) || MENUS[0];
  const v = (view && viewOf(m.key, view)) || m.views[0];
  /* 🔴 ①「案件の立ち位置」は全件を見る場所。②から担当で絞った状態を
     持ち越すと、絞っていることに気づかないまま全件だと思い込む。
     ①へ入るときは担当の絞り込みだけ外す（名札・期間・検索は残す）。 */
  if (m.key === "deal" && v.key === "board") boardFilter.consultant = "";
  cur = { menu: m.key, view: v.key };
  /* URL に残す。共有と戻るボタンのため。
     🔴 画面の中の移動は履歴に**積む**（pushState）。replaceState だと何回移動しても
        履歴が増えず、戻るで画面そのものから出てしまっていた
        （2026-09-23 実機: 2回移動しても history.length が増えない, U5）。
        開いた直後の位置合わせと、戻る・進むで来たときだけは積まない（how = "replace"）。
        積むと「戻る」を押すたびに同じ場所が増えて、いつまでも戻れなくなる。 */
  const hash = "#" + m.key + "/" + v.key;
  if (location.hash !== hash) {
    if (how === "replace") history.replaceState(null, "", hash);
    else history.pushState(null, "", hash);
  }
  drawMenu();
  drawSide();
  window.scrollTo(0, 0);
  load(refresh);
}

/* 開いたときの位置を URL から決める。無ければ既定 */
function fromHash() {
  const p = (location.hash || "").replace(/^#/, "").split("/");
  const m = menuOf(p[0]);
  if (!m) return { menu: "deal", view: "today" };
  const v = viewOf(m.key, p[1]);
  return { menu: m.key, view: (v || m.views[0]).key };
}

/* ================================================================ 取得 */
function showError(e) {
  const box = document.getElementById("cs-error");
  box.style.display = "";
  box.innerHTML = e && e.loginExpired ? LOGIN_EXPIRED_HTML
    : '<div class="err">データを取得できませんでした。\n' + esc(e.message) + "</div>";
}

/* ログインが切れたときに出す文。
   🔴 セッションはサーバのメモリにしか無いので、**デプロイのたびに全員のログインが切れる**。
      切れた状態で API を叩くと 303 で /login の HTML が返り、それを JSON として読んで
      「Unexpected token '<' … is not valid JSON」がそのまま出ていた（U10）。
      何をすればよいかを書き、行き先のリンクを置く。 */
const LOGIN_EXPIRED_HTML = '<div class="err"><b>ログインが切れています。</b>' +
  '<a href="/login">ログインし直してください</a>。' +
  "サーバを入れ替えるたびに切れます（データが壊れたわけではありません）。" +
  "ログインした後、このページを開き直すと同じ場所が出ます。</div>";

/* 応答を JSON として読む。ログイン切れはここで見分ける。
   - 未ログインの API は 303 で /login に飛ばされ、fetch はそれを追って 200 の HTML を受け取る
     （res.redirected が立ち、res.url が /login になる）
   - JSON でないものを res.json() に渡すと、原因の分からない構文エラーになる */
async function readJson(res) {
  let path = "";
  try { path = new URL(res.url, location.href).pathname; } catch (_) { path = ""; }
  if (res.status === 401 || (res.redirected && /\/login$/.test(path))) {
    const e = new Error("ログインが切れています");
    e.loginExpired = true;
    throw e;
  }
  const ct = (res.headers && res.headers.get && res.headers.get("content-type")) || "";
  if (ct && ct.indexOf("json") < 0) {
    throw new Error("サーバが JSON 以外を返しました（HTTP " + res.status + " / " + ct + "）");
  }
  return res.json();
}

/* 右側打ち切りを外すかどうか。
   🔴 チェックボックスの状態は**ここに持つ**。前は描き直した後の DOM から読んでいたので、
      描き直すとチェックが外れた表示になり、もう一度押しても
      exclude_right_censored=1 で取り直して「含める」に戻せなかった（2026-09-23 実機, U1）。 */
let renewalExcludeCensored = false;

/* 取りに行った順番。🔴 画面を素早く切り替えると、前の画面の遅い応答が後から届いて
   いまの画面を上書きしていた（2026-09-23 実機: URL は byowner なのに中身が担当者の一覧, U3）。
   応答を描く前に「自分が最後の要求か」を番号で確かめ、古いものは捨てる。 */
let loadSeq = 0;

async function load(refresh) {
  const my = ++loadSeq;
  const v = viewOf(cur.menu, cur.view);
  const main = document.getElementById("cs-main");
  document.getElementById("cs-error").style.display = "none";

  /* API を持たない項目（定義と検証）はその場で描く。
     母集団の注記だけは直前に読んだ応答から出す（画面共通の値なので同じ数字になる） */
  if (!v.path) {
    paintFigs(main, () => ctlbar(v, lastPayload || {}) + v.render());
    wire(v);
    return;
  }

  const q = new URLSearchParams();
  if (refresh) q.set("refresh", "1");
  if (cur.view === "renewal" && renewalExcludeCensored) q.set("exclude_right_censored", "1");
  if (isCustView(cur.view) && customerHoujin) q.set("houjin", customerHoujin);

  /* 取り直しの間は本文が「読み込み中」に置き換わるので、触っていた部品を覚えておいて戻す（U9） */
  const fe = document.activeElement;
  const fk = focusKey(fe);
  main.innerHTML = '<div class="loading">読み込み中…</div>';
  try {
    const res = await fetch(v.path + "?" + q.toString(), { credentials: "same-origin" });
    const body = await readJson(res);
    if (my !== loadSeq) return;   /* 後から別の画面を頼んでいる。古い応答は描かない */
    /* サーバは失敗を空配列にすり替えない。error が立っていれば中身を出す */
    if (!res.ok || body.error) throw new Error(body.message || "HTTP " + res.status);
    if (cur.view === "team") teamCache = body;
    if (cur.view === "board" || cur.view === "byowner") boardCache = body;
    lastPayload = body;   /* 絞り込みで描き直すときに使う。取り直しはしない */
    setFresh(body.meta || {});
    paintFigs(main, () => ctlbar(v, body) + v.render(body));   /* 図の幅を枠に合わせる（2回描き） */
    wire(v);
    /* 🔴 待つ間に人が別の場所へフォーカスを動かしていたら戻さない。遅い応答が来た瞬間に
       前の部品へ引き戻すと、打っている途中の入力を奪う。描き直しで消えた部品は
       フォーカスを失って body になるので、「body か、覚えた部品のまま」のときだけ戻す */
    const now = document.activeElement;
    if (!now || now === document.body || now === fe) refocus(fk);
    loaded[cur.menu + "/" + cur.view] = true;
  } catch (e) {
    if (my !== loadSeq) return;   /* 古い要求の失敗で、いまの画面を消さない */
    main.innerHTML = "";
    showError(e);
  }
}

/* 母集団の注記。🔴 **どの項目でも同じ文言・同じ数字を出す。**
   タブによって母集団が違うと、同じ画面の中で数が合わなくなる
   （②593件・③703件と食い違っていた）。サーバが `population` を
   全部の応答に同じ値で載せているので、画面はそれをそのまま出す。

   🔴 **何をいくつ外したかも書く。** 黙って消さない。AirWork広告運用は
   実在する売上で、「無かったこと」にはしない。 */
function popline(D) {
  const p = D && D.population;
  if (!p) return "";
  /* 🔴 1行目（稼働中 N 件・オプション除く）は常に見せ、外した内訳は畳む（V1）。
     3行のボックスが全画面の頭に出て、本題を下へ押していた。黙って消してはいない */
  return '<details class="popnote fold"><summary>稼働中 <b>' + num(p.active) +
    "</b> 件（オプション契約 " + num(p.active_option) + " 件を除く）</summary>" +
    '<span class="muted">稼働中 ' + num(p.active_all) + " 件から、オプション契約 " +
    num(p.active_option) + " 件を除いた数です" +
    (p.option_amount ? "（外した契約の金額は " + man(p.option_amount) +
      "。契約が無くなったわけではありません）" : "") +
    "。オプション＝求人追加・AirWork広告運用・一次対応・エントリーフォーム・追加。" +
    "全取引 " + num(p.deals_all) + " 件のうち " + num(p.deals_option) +
    " 件がオプションで、この画面は残り " + num(p.deals) + " 件を見ています。</span></details>";
}

/* 項目ごとの操作列。「継続回数 × 成果」は右側打ち切りの切り替え、
   「顧客ごとに見る」は法人の選択 */
function ctlbar(v, D) {
  let h = popline(D) + '<div class="ctlbar">';
  if (v.key === "renewal") {
    h += '<label class="act"><input type="checkbox" id="cs-censor"' +
      (renewalExcludeCensored ? " checked" : "") + ">" +
      "右側打ち切りを代表値から外す（結果がまだ確定していない直近の契約）</label>";
  }
  /* 選択欄に名前が無く、読み上げでは何を選ぶ欄か分からなかった（V20） */
  if (isCustView(v.key)) h += '<select id="cs-houjin" class="act" aria-label="法人を選ぶ"></select>';
  /* 担当者ごとの接触: 月ごと / 週ごと。押している方は aria-pressed と太字・枠で示す（色だけにしない） */
  if (v.key === "contact") {
    h += '<span class="act" id="ct-unit" role="group" aria-label="期間の単位">期間:' +
      CONTACT_UNITS.map((u) => '<button type="button" class="act" id="ct-unit-' + u.k + '" data-u="' + u.k +
        '" aria-pressed="' + (contactUnit === u.k ? "true" : "false") + '">' + esc(u.t) + "</button>").join("") +
      "</span>";
  }
  if (v.path) h += '<button type="button" class="act" id="cs-reload">読み直す</button>';
  if (D && D.meta && D.meta.all_cached) h += '<span class="muted small">キャッシュから表示</span>';
  return h + "</div>";
}

function wire(v) {
  if (v.key === "team") wireTeam();
  if (v.key === "contact") wireContact();
  if (v.key === "today") wireToday();
  if (v.key === "board" || v.key === "byowner") wireBoard();
  if (v.key === "series") wireSeries();
  if (v.key === "houjin") wireHoujin();
  const rl = document.getElementById("cs-reload");
  if (rl) rl.onclick = () => load(true);
  const sel = document.getElementById("cs-houjin");
  if (sel && customerIndex) {
    /* 🔴 注力だけにしているときは、選択肢もそれに合わせる。
       図だけ絞って選択肢が全件のままだと、絞ったつもりで全件から選んでしまう。
       いま開いている法人は、注力でなくても選択肢に残す（選んだものが消えると戻れない）。
       🔴 絞るのは「法人番号で見る」だけ。注力の切り替えはそちらの画面にしか無いので、
          「継続を追いかける」まで絞ると、そちらでは解除できなくなる
          （2026-09-23 実機: 401 → 117 のまま引き継がれ、トグルは無い, U4）。 */
    const list = focusOnly && v.key === "houjin"
      ? customerIndex.filter((r) => r.focus || r.houjin === customerHoujin)
      : customerIndex;
    /* 🔴 件数で切らない。400件で切っていて、全517法人のうち117法人が選べなかった（U8）。
       選択欄は長くても文字を打てば飛べるので、全件を入れる */
    sel.innerHTML = '<option value="">法人を選ぶ…</option>' + list.map((r) =>
      '<option value="' + esc(r.houjin) + '">' + esc(r.name || r.houjin) +
      "（取引" + num(r.deals) + " / 拠点" + num(r.sites) + "）" +
      (r.focus ? "［注力］" : "") + "</option>").join("");
    /* 差し込み直しでも選んだ法人が残るようにする */
    if (customerHoujin) sel.value = customerHoujin;
  }
  const cz = document.getElementById("cs-censor");
  if (cz) cz.onchange = () => { renewalExcludeCensored = cz.checked; load(false); };
  const hj = document.getElementById("cs-houjin");
  /* 人が選び直したら「既定で開いています」の注記は外す。前は別の法人を選んだ後も残っていた（U12） */
  if (hj) hj.onchange = () => { customerHoujin = hj.value; customerReason = ""; load(false); };
  markScrollAll();   /* 表の枠の端の影（V12 の残り） */
}

/* 「継続を追いかける」の拠点選択 */
function wireSeries() {
  const st = document.getElementById("cs-site");
  if (st) st.onchange = () => { seriesSite = st.value; redrawMain(lastPayload); };
}

/* 「法人番号で見る」のチェックと、本部アプローチの遅延読み */
function wireHoujin() {
  const redraw = () => redrawMain(lastPayload);
  const fo = document.getElementById("hj-focus-only");
  if (fo) fo.onchange = () => { focusOnly = fo.checked; redraw(); };
  document.querySelectorAll("#hj-pick input[type=checkbox]").forEach((cb) => {
    cb.onchange = () => { houjinPick[cb.dataset.d] = cb.checked; redraw(); };
  });
  const setAll = (on) => {
    (lastPayload.deals || []).forEach((d) => { houjinPick[d.deal_id] = on; });
    redraw();
  };
  const a = document.getElementById("hj-all");
  if (a) a.onclick = () => setAll(true);
  const n = document.getElementById("hj-none");
  if (n) n.onclick = () => setAll(false);

  /* 本部アプローチは別のデータ。この項目を開いたときだけ取りに行く */
  const box = document.getElementById("hq-box");
  if (!box) return;
  const keep = hqKeep; hqKeep = null;   /* redrawMain が覚えた #hq-box の開いた details */
  if (hqCache) { paintFigs(box, () => renderHq(hqCache), keep); markScrollAll(); return; }
  fetch("/api/consulting/headquarters", { credentials: "same-origin" })
    .then(readJson)   /* ログイン切れを見分ける（U10）。r.json() だと構文エラーの文がそのまま出る */
    .then((body) => {
      if (body.error) throw new Error(body.message || "取得できません");
      hqCache = body;
      const b2 = document.getElementById("hq-box");
      if (b2) { paintFigs(b2, () => renderHq(body)); markScrollAll(); }
    })
    .catch((e) => {
      const b2 = document.getElementById("hq-box");
      if (b2) b2.innerHTML = e.loginExpired ? LOGIN_EXPIRED_HTML
        : '<div class="err">' + esc(e.message) + "</div>";
    });
}
let hqCache = null;
let hqKeep = null;

/* 戻る・進むでも同じところへ。
   🔴 pushState で積んだ履歴を戻るときは popstate が来る（hashchange はブラウザによって
      来ないことがある）。手で URL のハッシュを書き換えたときは hashchange が来る。
      両方で描き直す。どちらも位置が変わっていなければ何もしないので、2回来ても1回しか描かない。
   🔴 ここから go() するときは履歴に積まない（積むと「戻る」が効かなくなる）。 */
const followUrl = () => {
  const h = fromHash();
  if (h.menu !== cur.menu || h.view !== cur.view) go(h.menu, h.view, false, "replace");
};
window.addEventListener("popstate", followUrl);
window.addEventListener("hashchange", followUrl);
/* 表の枠を横に動かしたら影を付け直す。scroll は泡立たないので捕捉側で受ける */
window.addEventListener("scroll", (ev) => {
  const t = ev.target;
  if (t && t.classList && t.classList.contains("scroll") && t.parentNode) markScroll(t.parentNode);
}, true);
/* 窓の幅が変わったら、影を付け直し、図を新しい枠の幅で描き直す（paintFigs）。
   描き直すのは本文の幅が 24px 以上変わったときだけ（縦だけ変わる・スクロールバーの出入りでは描かない） */
let refitTimer = 0;
function refitSoon() {
  if (typeof setTimeout !== "function") return;
  clearTimeout(refitTimer);
  refitTimer = setTimeout(() => {
    const main = document.getElementById("cs-main");
    if (!main || !lastPayload || !main.querySelector || !main.querySelector("svg[data-fk]")) return;
    if (Math.abs((main.clientWidth || 0) - paintedW) >= 24) redrawMain(lastPayload, openDetails(main));
  }, 250);
}
window.addEventListener("resize", () => { markScrollAll(); refitSoon(); });
/** 畳んだ枠（details）を開いたとき、中に幅を測れずに描いた図（figAvail の data-unfit）があれば、
    開いた枠の幅で描き直す。開いている details は開いたまま描き直す（openDetails）。
    描き直した後は枠の幅が測れるので data-unfit は付かず、開き直しの toggle で繰り返さない */
function refitOpened(d) {
  if (!d || !d.open || !d.querySelector || !d.querySelector("svg[data-unfit]")) return;
  const main = document.getElementById("cs-main");
  if (!main || !lastPayload || (main.contains && !main.contains(d))) return;
  redrawMain(lastPayload, openDetails(main));
}
/* 畳んだ表（details の中）は開くまで幅が 0 なので、開いたときに影を付け直し、図を描き直す */
window.addEventListener("toggle", (ev) => { markScrollAll(); refitOpened(ev && ev.target); }, true);

/* 開いた時点で URL にも位置を残す。そのまま貼れば同じ場所が開く */
(() => { const h = fromHash(); go(h.menu, h.view, false, "replace"); })();
</script>
</body>
</html>
