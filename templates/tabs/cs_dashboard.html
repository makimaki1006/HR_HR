  h += fig("達成率 ＝ 承諾数 ÷ 採用目標数", "目標が入っている契約だけが母数",
    stackHatch(svgStack({ w: 680, parts: gparts }), gparts),
    stackLegend(gparts) +
    '<i class="full"><b>稼働中の契約なので、100% 未満はまだ伸びる途中の値です</b>' +
    "（中空・破線）。0% には始まったばかりの契約も入っています。「達成できなかった」とは読めません。</i>" +
    '<i class="full"><b>目標が入っているのは稼働中の ' + pct1(ga.fill_rate) + "（" +
    num(ga.has_goal) + " / " + num(ga.pop) + "）だけです。</b>全件では " + pct1(gl.fill_rate) +
    "。入っていない取引は「達成率0%」ではなく、母数に入っていません。" +
    (noSyo ? "目標はあるのに承諾数が空の " + num(noSyo) + " 件は、達成率が出せないので別の帯にしています。" : "") +
    "　中央値（稼働中）" + (ga.median == null ? DASH : pct1(ga.median * 100)) + "</i>");

  h += sec("図", "求人票あたりの応募効率");
  h += fig("応募数 ÷ 掲載数", "結果ごとのばらつき",
    svgBoxH({ w: 680, xFmt: F.d1,
      rows: ef.groups.filter((g) => g.box && g.box.n >= MIN_N).map((g) => ({
        label: g.label, med: g.box.median, q1: g.box.q1, q3: g.box.q3,
        min: g.box.min, max: g.box.max, mean: g.box.mean, n: g.box.n,
        /* 🔴 filter 後の並び順で SERIES を回していて、「解約した」が赤・「充足」が緑になり、
           グループが1つ落ちると色がずれていた（V9 検証）。充足は継続率では解約側の分子なので
           緑（良い）は誤読になる。群の名前は左に書いてあるので、色は1つにそろえる */
        color: C.ai })) }),
    lg("quart", C.ai, "四分位") + lg("line", C.ai, "中央値") +
    droppedNote(ef.groups, (g) => (g.box ? g.box.n : 0), (g) => g.label) +
    '<i class="full">' + esc(ef.caveat) + "　掲載数が入っているのは 稼働中 " +
    num(ef.has_keisaisu_act) + " / " + num(ef.n_act) + "。</i>" +
    /* 🔴 結果の決まっていない取引は「継続した」に混ぜない（fix/cs-rust N19）。外した件数を出す */
    (ef.n_pending_excluded
      ? '<i class="full">結果待ち（稼働中など）の ' + num(ef.n_pending_excluded) +
        " 件は、結果が決まっていないので3つの群のどれにも入れていません。</i>"
      : ""));
  /* 🔴 以前は結果待ちを「継続した」に混ぜていて差がほとんど無く見えた。
     決着の3群で比べ直すと向き（解約 ＜ 継続）は出る（fix/cs-rust N19）。ただし群の代表値を比べただけ */
  h += note("bad", "資料の「8.1 ≪ 14.5」は、そのままの値では再現しません",
    "向き（解約 ＜ 継続）は合っています。ただし群の代表値を比べただけで、平均は外れ値に引かれます。" +
    "<b>単独で解約を見分けられる指標かは、ここからは言えません</b>。");

  h += sec("図", "リスクは2軸だけで見る");
  h += note("info", "4軸のうち2軸を意図的に外しています。手抜きではありません",
    "<b>関係性の軸（NPS）</b>：稼働中の半分にしか値が無く、<b>構造的に発火しません</b>。" +
    "常に非赤の軸を並べると「問題ない」と読まれますが、実際は<b>測れていないだけ</b>です" +
    "（NPS は " + goLink("study", "focus") + " で独立した指標として出しています）。<br>" +
    /* 🔴 「churn予測」「StratifiedKFold」「AUC」と英語の用語のまま出していた（2026-09-23 実機）。
       意味は変えずに言い換える: StratifiedKFold ＝ 顧客で分けずに取引を無作為に分けた検証、
       AUC ＝ 解約する契約としない契約を見分ける力（0.5 で当て推量と同じ、1.0 で完全） */
    "<b>予測の軸（解約の予測モデル）</b>：本番の検証が、取引を顧客で分けずに無作為に" +
    "「作る側」と「確かめる側」に分けています。同じ顧客が継続契約で複数の取引を持つので、" +
    "確かめる側に作る側と同じ顧客が混ざり、<b>当たり具合が実際より良く出ます</b>。" +
    "説明できない順位を現場に出せません。");
  const rparts = R.bands.map((b) => ({
    label: b.label, v: b.n,
    color: b.label.startsWith("2") ? C.hi : b.label.startsWith("1") ? C.ki : C.midori }));
  h += fig("稼働中 " + num(R.n_act) + " 件の帯", "2軸とも赤 ＝ 最優先",
    svgStack({ w: 680, parts: rparts }),
    stackLegend(rparts) +
    '<i class="full">放置の軸: 赤 ' + num(R.ax3["赤"]) + " / 白 " + num(R.ax3["白"]) +
    " / 未測定 " + num(R.ax3["未測定"]) + "（" + esc(R.ax3.rule) + "）<br>" +
    "収益の軸: 赤 " + num(R.ax4["赤"]) + " / 白 " + num(R.ax4["白"]) +
    " / 未測定 " + num(R.ax4["未測定"]) + "（" + esc(R.ax4.rule) + "）<br>" +
    "接触の記録が1つも無い " + num(R.ax3["未測定"]) +
    " 件は<b>赤にせず「未測定」として分けています</b>。記録が無いことと放置は別です。" +
    "数えた接触: 60秒超の通話 " + num(cs.calls_over_threshold) + " / MTG " +
    num(cs.mtgs_linked) + " / 接触のある取引 " + num(cs.deals_with_contact) + "</i>");

  h += sec("図", "最優先の広がり（金額 × 満了まで）");
  h += fig("2軸とも赤の " + num(R.top.length) + " 件", "右上ほど金額が大きく満了が遠い",
    R.top.length
      ? svgScatter({ w: 680, h: 260,
          pts: R.top.filter((r) => r.amount != null && r.days_to_expiry != null)
            /* 🔴 2026-09-24 実機（ループ5）: 契約開始日が空の行（no_start）を灰（C.ghost）で描いていたが、
               灰はこの画面では「記録なし・未確定」の色。サーバ（routes.rs risk）はこの行を放置の軸の赤に数え、
               「2軸とも赤」の件数（見出しの N 件・上の帯の最優先）にも入れている。灰のままだと、赤に数えた点が
               赤に見えず、見た目と件数が食い違う。数え方（赤）に見た目を合わせ、赤の中空・実線の丸にして
               「開始日が空で、契約後を切り出せない」ことを塗りの点と見分けられるようにする
               （件数の側を灰に合わせると、サーバの判定と帯・見出しの件数まで変えることになる） */
            .map((r) => ({ x: r.days_to_expiry, y: r.amount,
                           color: r.never_after_start || r.no_start ? C.hi : C.ki,
                           open: !!r.no_start && !r.never_after_start,
                           note: r.no_start ? "契約開始日が空（赤に数えています）" : "",
                           label: r.name || r.deal_id })),
          xFmt: F.int, yFmt: F.man, xLab: "満了まで（日）", yLab: "金額（万円）",
          alt: "最優先の広がり" })
      : '<div class="empty">最優先に当たる取引がありません。</div>',
    lg("dot", C.hi, "契約後に一度も接触していない", PT_OP) + lg("dot", C.ki, "接触から30日超", PT_OP) +
    (R.top.some((r) => r.no_start) ? lg("openpt", C.hi, "契約開始日が空（契約後を切り出せない）。赤に数えています") : ""));
  /* 🔴 ここにも並びの注記（order_note）を出していて、下の表の頭と同じ文が2回出ていた
     （2026-09-23 実機, V21 の残り）。散布図には並びが無いので、表の側だけに出す */

  h += sec("表", "最優先（2軸とも赤・" + num(R.top.length) + " 件）");
  /* 🔴 放置の軸が「契約後に一度も接触していない」の行に「接触の記録 23件」と出て、矛盾して見えた
     （2026-09-24 実機）。接触の記録は契約前も含めた件数（routes.rs build_outcome の n_contact）。
     その行では「すべて契約前」と書き、列の意味も表の上で言う。
     🔴 契約開始日が空の行（no_start）は、接触が契約の前か後かが分からない。「すべて契約前」と
     言い切らない（2026-09-24 検証。サーバも never_after_start を立てない） */
  h += '<div class="lede">金額が大きい順。' + esc(R.order_note) +
    "「接触の記録」は契約の前も含めた件数です。</div>";
  h += scroll(table([{ t: "取引", w: "l" }, { t: "ステージ", w: "s" }, { t: "金額", n: 1 },
                     { t: "満了まで", n: 1 }, { t: "放置の軸", w: "s" }, { t: "接触の記録", n: 1 }],
    /* 案件名は案件の詳細へのリンク（S-4。前は文字だけで行き止まりだった） */
    R.top.map((r) => [dealLink(r.deal_id, r.name),
      '<span class="muted small">' + esc(r.stage) + "</span>", yen(r.amount),
      r.days_to_expiry == null ? DASH : num(r.days_to_expiry) + "日",
      (r.never_after_start ? '<b style="color:var(--hi)">' : "<span>") + esc(r.ax3w) +
        (r.never_after_start ? " &#9650;</b>" : "</span>"),
      r.n_contact
        ? num(r.n_contact) + "件" + (r.never_after_start ? '<br><span class="muted small">すべて契約前</span>' : "")
        : DASH])), 420);
  return h + foot(D.meta, true);   /* 数えていないものは頭の枠で書いた（V21: 上下で2回出ていた） */
}

/* ================================================================ 9 データ品質 */
function renderDq(D) {
  let h = sec("問い", "この画面の数字を、どこまで信じてよいか") +
    '<div class="lede">取引 ' + num(D.meta.n_deals) + " 件（稼働中 " +
    num(D.meta.n_active) + " 件）。</div>";

  /* ---- 法人番号の出どころ ---- */
  h += sec("図", "法人番号の出どころ");
  /* 判定はサーバのキー（deal / company）のまま、出す名前だけ置き換える（V3）。
     🔴 山吹は「読むのに注意が要る」の色。会社由来は注意の印ではないので紫にする（V9） */
  const hp = D.houjin_source.rows.map((r, i) => ({
    label: dispName(r.label), v: r.n,
    color: r.label === "deal" ? C.ai : r.label === "company" ? C.murasaki : C.ghost,
    faint: r.label.indexOf("無") >= 0 || r.label === "none" }));
  h += fig("どこから取れたか", "",
    svgStack({ w: 680, parts: hp }), stackLegend(hp) +
    '<i class="full">' + esc(D.houjin_source.note) + "</i>");

  /* ---- 記入率の偏り（面で見る）---- */
  h += sec("図", "成果系の記入率が結果で偏っている");
  const groups = ["継続済", "解約", "充足", "結果待ち"];
  const fields = [...new Set(D.outcome_bias.rows.map((r) => r.field))];
  h += fig("結果ごとの記入率", "色が濃いほど埋まっている",
    svgMatrix({ padL: 150, cw: 120,
      cols: groups,
      rows: fields.map((f) => ({
        label: dispName(f),
        cells: groups.map((g) => {
          const r = D.outcome_bias.rows.find((x) => x.group === g && x.field === f);
          if (!r || r.fill_rate == null) return { v: null, txt: "—", n: 0 };
          return { v: r.fill_rate / 100, txt: pct1(r.fill_rate),
                   n: r.filled, color: C.ai };
        }),
      })) }));
  /* 🔴 図の下の注記（サーバの outcome_bias.note）と、すぐ下の「まずい」の箱が同じ話を2回言っていた
     （2026-09-24 実機）。箱の1回にし、文の正本はサーバの note にする。
     箱の見出しは本文と同じ文にしない（本文の末尾が「押し上げる方向に効きます」） */
  h += note("bad", "この偏りは結論を甘く見せます",
    D.outcome_bias.note ? esc(String(D.outcome_bias.note).replace(/。$/, "")) + "。"
      : "うまくいかなかった契約ほど数字が残っていないので、「継続するほど成果が良い」という見え方が強く出ます。");

  /* ---- 欠測 ---- */
  h += sec("図", "何がどれだけ欠けているか");
  h += fig("欠測の件数", "0 で埋めていません",
    svgBarH({ w: 700, fmt: F.int, rh: 26,
      rows: D.missing.map((m) => ({
        label: tail(m.label, 30), full: m.label, v: m.n, txt: num(m.n) + "件",
        note: pct1(m.rate), color: m.rate >= 20 ? C.ki : C.ai })) }),
    /* 図に出ていない色は凡例に出さない（2026-09-24 実機: 20%以上の項目が無いのに山吹の「20%以上」が出ていた） */
    (D.missing.some((m) => m.rate >= 20) ? lg("box", C.ki, "20%以上") : "") +
    (D.missing.some((m) => !(m.rate >= 20)) ? lg("box", C.ai, "20%未満") : "") +
    '<i class="full">' + D.missing.map((m) => esc(m.label) + "：" + esc(m.note)).join(" ／ ") +
    "</i>");

  /* ---- 読んでいるシート ---- */
  h += sec("表", "読んでいるシート");
  h += '<div class="lede">スプレッドシートを直接読んでいます。件数はいま読めた行数です。</div>';
  h += scroll(table([{ t: "シート" }, { t: "行数", n: 1 }],
    D.sheets.map((x) => [esc(x.name), num(x.rows)])));
  return h + foot(D.meta);
}


/* ================================================================ 案件の立ち位置 / 今日動く先 */

/* 名札。🔴 これの本数で並べる。スコアは出さない */
/* 枡の色は図の分類（flagGroup）と同じ決め方にする。
   🔴 前はここに別の判定があり、「MTGが90日以上途絶」が図では緋（関係が危ない）なのに表の枡では紫（成果が出ていない）、
   「満了90日前でMTGが30日以上途絶」が図では緋なのに枡では山吹だった（2026-09-28 段2 A で気づいた。fixture 1440px の実機）。
   分類の言葉（word）は title に添える（色だけで伝えない） */
const tagColor = (f) => flagGroup(f).color === C.hi ? "hi" : flagGroup(f).color === C.ki ? "ki" : "murasaki";
function tags(fs) {
  if (!fs || !fs.length) return '<span class="n0">—</span>';
  return fs.map((f) => {
    const col = tagColor(f);
    return '<span class="tag" style="border-color:var(--' + col +
      ');color:var(--' + col + ')" title="' + esc(flagGroup(f).word) + '">' + esc(f) + "</span>";
  }).join(" ");
}
/* 今日動く先の名札の短い書き方（段2 A）。名札の文の正本はサーバ（routes.rs build_deal_rows の flags.push と mod.rs MtgBand::label）で、
   ここは表示を詰めるだけ。表に無い名札はそのまま出す（黙って落とさない・略さない）。正式な名札は <abbr> の title と、
   表の決まりごとの畳み（todayFlagLegend）に書く。サーバが名札を足したら、ここにも足す（tests/consulting_view_rules.js が
   Rust の文字列と突き合わせる）。
   🔴 詰めるのは「が」「で」「まで」などの助詞と送り仮名だけ。条件の範囲を決める数（90日前・30日）と「以上・以下・以内」は落とさない。
   前は「満了90日前でMTGが30日以上途絶」を「満了前MTG30日途絶」にしていて、表の上では何日前・何日以上かが読めなかった
   （2026-09-29 検証。見張りは tests/consulting_view_rules.js の段2 A） */
const FLAG_SHORT = {
  "NPSが4以下": "NPS4以下",
  "満了まで60日以内": "満了60日以内",
  "接触の記録が無い": "接触記録なし",
  "接触が30日以上空いている": "接触30日以上空き",
  "採用単価が同じ進捗帯の1.5倍以上": "採用単価1.5倍以上",
  "担当が退職者のまま": "担当が退職者",
  "満了90日前でMTGが30日以上途絶": "満了90日前MTG30日以上途絶",
  "採用目標の半分に届いていない": "採用目標の半分未満",
  "MTGが90日以上途絶": "MTG90日以上途絶",
  "MTGが60〜89日途絶": "MTG60〜89日途絶",
  "MTGが30〜59日途絶": "MTG30〜59日途絶",
};
function tagsShort(fs) {
  if (!fs || !fs.length) return '<span class="n0">—</span>';
  return fs.map((f) => {
    const col = tagColor(f), s = FLAG_SHORT[f];
    const style = ' style="border-color:var(--' + col + ');color:var(--' + col + ')"';
    return s
      ? '<abbr class="tag c"' + style + ' title="' + esc(f) + "（" + esc(flagGroup(f).word) + '）">' + esc(s) + "</abbr>"
      : '<span class="tag c"' + style + ' title="' + esc(flagGroup(f).word) + '">' + esc(f) + "</span>";
  }).join(" ");
}
/** 今日動く先の決まりごとに置く「名札の略し方」。3 表に出ている名札のうち短くしたものだけを並べる（無ければ空） */
function todayFlagLegend(rowsList) {
  const seen = new Set();
  rowsList.forEach((rs) => (rs || []).forEach((r) => (r.flags || []).forEach((f) => { if (FLAG_SHORT[f]) seen.add(f); })));
  if (!seen.size) return "";
  return note("def", "名札の略し方",
    "表では名札を短く書いています（正式な名札は枡に重ねても出ます）。<b>短い名札 ＝ 正式な名札</b>: " +
    Array.from(seen).map((f) => esc(FLAG_SHORT[f]) + " ＝ " + esc(f)).join(" ／ ") + "。" +
    /* 🔴 前は「言葉でも書いているので、色が見分けられなくても読めます」と書いていたが、分類の言葉を書いているのは下の図で、
       表の枡では title（マウスを重ねたとき）にしか無く、タッチでは出ない（2026-09-29 検証）。どこに何を書いているかをそのまま言う */
    "枡の色は下の図「何で上がってきたか」の分類（関係が危ない・時間が迫っている・成果が出ていない）と同じです。" +
    "分類の言葉は下の図の棒の右に書いています。表の枡に書いているのは名札の言葉だけなので、" +
    "色が見分けられなくても読めますが、分類は図で確かめてください。");
}
/* 履歴から取った値。🔴 その月に書き換えが無ければ「持越」と出す */
function numCarry(v, carry) {
  if (v == null) return DASH;
  return num(v) + (carry
    ? ' <span class="n0" title="その月に書き換えが無く、前の値を引き継いだ">持越</span>' : "");
}

/* 何ヶ月目か。分母は契約期間 */
function pos(r) {
  /* 🔴 契約開始がまだ先のものは「-1 か月目」ではなく「開始前」と出す */
  if (r.not_started)
    return '<span class="muted">開始前</span>' +
      (r.start ? '<span class="muted small"> ' + esc(r.start) + " から</span>" : "");
  /* 🔴 満了日を過ぎてもまだ稼働中のものは「15 / 6 か月目」と出さない。数え間違いに見える。
     何日過ぎたかは隣の「満了まで」の列に出ている */
  if (r.past_expiry)
    return '<b style="color:var(--hi)">満了後</b>' +
      (r.period ? '<span class="muted small"> 契約 ' + num(r.period) + " か月</span>" : "");
  if (r.months == null) return DASH;
  /* 🔴 満了日がまだ先なのに契約期間を超えるのは、満了日が「開始＋契約期間」より後ろに
     ずれている取引だけ（月末の開始はサーバの contract_month が満了日に合わせて数える）。
     fixture 稼働中603件のうち、満了日の当日で数えて期間を超えるのは1件
     （1ヶ月契約 2026-06-01〜2026-07-31。7/1〜7/31 に「2 / 1」と出ていた）。「2 / 1 か月目」は数え間違いに見えるので、
     分母を付けずに、満了日がずれていると書く */
  if (r.period && r.months > r.period)
    return num(r.months) + '<span class="muted small"> か月目（契約 ' + num(r.period) +
      " か月。満了日が後ろにずれています）</span>";
  /* 🔴 ここの序盤／中盤／終盤は契約長の 0.34 / 0.67 で区切った「立ち位置」。
     採用単価を比べる帯（cpa_band、0.5 / 0.75）とは別の区切りなので、同じ言葉に見せない */
  return num(r.months) + (r.period ? " / " + num(r.period) : "") +
    '<span class="muted small"> か月目</span>' +
    (r.band ? ' <span class="muted small" title="契約長の 0.34 / 0.67 で区切った立ち位置">立ち位置 ' +
      esc(r.band) + "</span>" : "");
}
function npsCell(r) {
  if (r.nps == null) return '<span class="n0">未回答</span>';
  const col = r.nps <= 4 ? "hi" : r.nps >= 9 ? "midori" : "ink-2";
  return '<b style="color:var(--' + col + ')">' + num(r.nps) + "</b>" +
    '<span class="muted small"> ' + esc(r.nps_month || "") + "</span>";
}
function touchCell(r) {
  if (r.n_contact === 0) return '<b style="color:var(--hi)">記録なし</b>';
  if (r.days_since_contact == null) return DASH;
  const col = r.days_since_contact > 30 ? "hi" : r.days_since_contact > 14 ? "ki" : "ink-2";
  return '<b style="color:var(--' + col + ')">' + num(r.days_since_contact) +
    "日</b>" + '<span class="muted small"> 前</span>';
}
function goalCell(r) {
  if (r.saiyomokuhyou == null || r.saiyomokuhyou <= 0)
    return '<span class="n0">目標なし</span>';
  if (r.rate_tassei == null) return DASH;
  /* 🔴 案件の表は稼働中の契約なので、達成率は**まだ伸びる途中の値**（右側打ち切り）。
     以前は 0〜50% を赤（■まずい）、50〜100% を山吹で塗り、途中の値を確定した悪さに見せていた。
     成果とリスクの目標の帯（goalBandColor）と同じく、確定するのは 100% に届いたものだけ。
     稼働中で 100% 未満のものは判定の色を使わず「途中」と添える */
  /* 行は deal_rows の稼働中（act）だけなので、100% 未満はすべて途中 */
  const done = r.rate_tassei >= 1;
  const col = done ? "midori" : "ink-2";
  return '<b style="color:var(--' + col + ')">' + pct1(r.rate_tassei * 100, 0) + "</b>" +
    '<span class="muted small"> ' + nz(r.syoudaku) + "/" + nz(r.saiyomokuhyou) +
    (done ? "" : "（途中）") + "</span>";
}
function cpaCell(r) {
  /* 🔴 金額が入っていない（0を含む）と採用単価は出せない。0万 と書かない */
  if (r.amount == null) return '<span class="n0">金額なし</span>';
  if (r.cpa == null) return '<span class="n0">採用0</span>';
  const col = r.cpa_vs_band != null && r.cpa_vs_band >= 1.5 ? "hi" : "ink-2";
  /* 🔴 比べた帯は cpa_band（契約の進み具合 0.5 / 0.75 で区切った帯）。「何ヶ月目」の横の
     立ち位置（0.34 / 0.67）とは別物なので、どの帯の中央と比べたかを帯の名前で出す */
  return '<b style="color:var(--' + col + ')">' + yen(r.cpa) + "</b>" +
    (r.cpa_band_median == null
      ? (r.cpa_band ? '<span class="muted small"> ' + esc(r.cpa_band) +
          " は件数が足りず比べていない</span>" : "")
      : '<span class="muted small"> ' + esc(r.cpa_band || "同じ進み具合の帯") + " の中央 " +
          yen(r.cpa_band_median) + "</span>");
}

/* 採用単価の比べ方。サーバの cpa_band_rule に、「何ヶ月目」の立ち位置とは区切りが違うことを添える */
function cpaBandNote(meta) {
  if (!meta || !meta.cpa_band_rule) return "";
  return note("def", "採用単価の比べ方", esc(meta.cpa_band_rule) + "。<br>" +
    "<b>「何ヶ月目」の横の立ち位置（序盤／中盤／終盤。契約長の 0.34 / 0.67 で区切る）とは別の区切りです。</b>" +
    "採用単価の欄には、比べた帯の名前をそのまま出しています。");
}

const BOARD_COLS = [
  /* 案件名から「案件の詳細」へ（戻るでこの表へ戻る）。取引名が空なら dealLink が「取引名なし」と書く（取引IDを出さない） */
  { k: "name",       t: "案件",        n: 0, fmt: (r) => dealLink(r.deal_id, r.name) +
      (r.focus ? ' <span class="tag">注力</span>' : "") },
  /* 🔴 名札は並びの根拠（既定は本数順）なのに 15 列目にあり、1440px でも横スクロールの外で
     「何で上がってきたか」が行を見ても分からなかった（2026-09-28 診断、08 の S-3）。案件名の隣に置く。
     並べ替え（sv）は変えていない。
     🔴 折り返す列（w:"l"、td.wl は最大 22em）にする。2026-09-28 検証（fixture 1440px）: 2 列目に移した名札を
     折り返さないままにしたら列の幅が 799px になり、枠（1,149px）に最初から見える列が 8 列 → 3 列
     （案件・名札・担当）に減っていた。満了まで・定期NPS・最後の接触・最後のMTG が横スクロールの外 */
  { k: "n_flags",    t: "名札",        n: 0, w: "l", fmt: (r) => tags(r.flags) },
  { k: "consultant", t: "担当",        n: 0, fmt: (r) => esc(r.consultant) || DASH },
  /* 🔴 並べ替えは画面に出ている順に合わせる（sv）。「満了後」の行は数字を出していないのに、
     内部の months（15 など）で他の行の間に並んでいた（fixture 20件）。
     満了後は稼働中の月より後ろに置き、その中は満了を過ぎた日数の順 */
  { k: "months",     t: "何ヶ月目",    n: 1, fmt: pos,
    sv: (r) => r.past_expiry ? 1e6 + Math.max(0, -(r.days_left || 0)) : r.months },
  /* 🔴 マイナスは「満了を過ぎている」。そのまま -329日 と出すと読めない */
  { k: "days_left",  t: "満了まで",    n: 1, fmt: (r) => {
      if (r.days_left == null) return DASH;
      if (r.days_left < 0)
        return '<b style="color:var(--hi)">満了を' + num(-r.days_left) + "日過ぎている</b>";
      return r.days_left <= 60
        ? '<b style="color:var(--ki)">' + num(r.days_left) + "日</b>"
        : num(r.days_left) + "日";
    } },
  { k: "nps",        t: "定期NPS",     n: 1, fmt: npsCell },
  { k: "days_since_contact", t: "最後の接触", n: 1, fmt: touchCell },
  /* 🔴 「最後の接触」（MTG＋60秒超の通話）とは別の列。こちらは MTG だけ。
     2つ並べているのは、電話でつないでいるだけで MTG が落ちている先を見つけるため */
  { k: "mtg_days",   t: "最後のMTG",   n: 1, fmt: mtgCell },
  /* 🔴 応募 → 面接 → 採用 を横に並べる。どこで詰まっているかが1行で読めるように */
  { k: "oubo",       t: "応募",        n: 1, fmt: (r) => numCarry(r.oubo, r.oubo_carry) },
  { k: "mensetu",    t: "面接",        n: 1, fmt: (r) => numCarry(r.mensetu, r.mensetu_carry) },
  { k: "syoudaku",   t: "採用",        n: 1, fmt: (r) => numCarry(r.syoudaku, r.syoudaku_carry) },
  { k: "rate_tassei", t: "採用目標に対して", n: 1, fmt: goalCell },
  /* 🔴 接触率は②コンサルタント一覧と同じ定義。必ず分母つき */
  { k: "contact_rate", t: "接触率",    n: 1, fmt: (r) => {
      /* 開始前は分母（経過月）が0。「0%」ではなく理由を出す */
      if (r.not_started) return '<span class="muted small">開始前</span>';
      if (r.contact_rate == null) return DASH;
      const col = r.contact_rate < 40 ? "hi" : r.contact_rate < 70 ? "ki" : "midori";
      return '<b style="color:var(--' + col + ')">' + pct1(r.contact_rate, 0) + "</b>" +
        '<span class="muted small"> ' + num(r.contact_touched) + "/" +
        num(r.contact_months) + " か月</span>";
    } },
  { k: "cpa",        t: "採用単価",    n: 1, fmt: cpaCell },
  { k: "amount",     t: "金額",        n: 1, fmt: (r) => yen(r.amount) },
];

/* 今日動く先の3表（今日・今週満了・今週始まった）の列。
   🔴 2026-09-28 診断（08 の S-3、fixture 1440px）: 15 列の BOARD_COLS を3表で共用していて、名札が横スクロールの外、
   表の幅は本文の約 2.6 倍だった。毎朝の表に要るのは「何で上がってきたか（名札）」「誰の」「いつまで」
   「最後にいつ触ったか（接触・MTG）」「NPS（0 と 4 で緊急度が違う）」「金額（並びの第2キー。見えないと順が読めない）」の8列。
   応募・面接・採用・採用目標・接触率・採用単価・何ヶ月目は案件そのもの（BOARD_COLS）に残す。
   案件名は折り返す（w:"l"、td.wl は 12〜22 字）。8列で 1440px の本文幅（約 1,150px）に入る。
   🔴 名札は短い書き方（tagsShort）を 25.5em の列（w:"f"、td.wf）に詰める（段2 A）。wl の 22em に正式な名札のままだと
   1 本ずつ折れて 1 行が 79〜100px で、1440×900 の 1 画面目に完全な行が 0 行だった（2026-09-28 fixture 実測） */
const TODAY_COLS = ["name", "n_flags", "consultant", "days_left", "days_since_contact", "mtg_days", "nps", "amount"]
  .map((k) => {
    const c = BOARD_COLS.find((x) => x.k === k);
    if (k === "name") return Object.assign({}, c, { w: "l" });
    if (k === "n_flags") return Object.assign({}, c, { w: "f", fmt: (r) => tagsShort(r.flags) });
    return c;
  });

let boardSort = { key: "n_flags", asc: false };

/* ③の絞り込み。②から担当者を押して来たときも、ここに入る。
   🔴 絞ったら必ず「◯件中 N件を表示」を出す（全件を見ていると誤認させない）。 */
let boardFilter = { consultant: "", flag: "", expiry: "", q: "", band: "" };

/* 満了までの帯。値は days_left（null は「満了日が入っていない」） */
const EXPIRY_BANDS = [
  { k: "over", t: "満了を過ぎている",     hit: (d) => d != null && d < 0 },
  { k: "d30",  t: "30日以内",             hit: (d) => d != null && d >= 0 && d <= 30 },
  { k: "d60",  t: "60日以内",             hit: (d) => d != null && d >= 0 && d <= 60 },
  { k: "d90",  t: "90日以内",             hit: (d) => d != null && d >= 0 && d <= 90 },
  { k: "far",  t: "90日より先",           hit: (d) => d != null && d > 90 },
  { k: "none", t: "満了日が入っていない", hit: (d) => d == null },
];

/* 絞り込みを当てる。**行を落とすのはここだけ** */
/* 🔴 同じ応答（rows の同一性）・同じ条件なら同じ配列を返す（段2 M-8）。paintFigs は図の幅を枠に合わせるために本文を 2 回組むので、
   ここが毎回新しい配列を返すと boardTable の覚え書き（配列の同一性で「同じ行の並び」を見る）が効かない */
const boardApplyMemo = { src: null, key: "", out: null };
function boardApply(rows) {
  const f = boardFilter;
  const key = JSON.stringify(f);
  if (boardApplyMemo.src === rows && boardApplyMemo.key === key) return boardApplyMemo.out;
  const band = EXPIRY_BANDS.find((b) => b.k === f.expiry);
  const q = f.q.trim().toLowerCase();
  const out = rows.filter((r) => {
    if (f.consultant && (r.consultant || "") !== f.consultant) return false;
    if (f.flag && !(r.flags || []).some((x) => x === f.flag)) return false;
    /* MTG 途絶の帯（行の mtg_band）。今日動く先の KPI「MTGが90日以上途絶 N 件」から来る（S-2） */
    if (f.band && (r.mtg_band || "") !== f.band) return false;
    if (band && !band.hit(r.days_left)) return false;
    if (q && String(r.name || r.deal_id || "").toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
  boardApplyMemo.src = rows; boardApplyMemo.key = key; boardApplyMemo.out = out;
  return out;
}

function boardFilterOn() {
  const f = boardFilter;
  return !!(f.consultant || f.flag || f.band || f.expiry || f.q.trim());
}

/* いま何で絞っているかを日本語で並べる。D は帯の名前（meta.mtg_gap.bands の label）を引くため */
function boardFilterWords(D) {
  const f = boardFilter, w = [];
  if (f.consultant) w.push("担当 " + f.consultant);
  if (f.flag) w.push("名札 " + f.flag);
  if (f.band) {
    /* 🔴 帯の内部の鍵（critical など）は画面に出さない。名前が引けないときは「MTG途絶の帯」だけ */
    const b = (((D || {}).meta || {}).mtg_gap || {}).bands;
    const hit = (b || []).find((x) => x.band === f.band);
    w.push("MTG途絶 " + (hit ? hit.label : "の帯"));
  }
  if (f.expiry) {
    const b = EXPIRY_BANDS.find((x) => x.k === f.expiry);
    if (b) w.push("満了まで " + b.t);
  }
  if (f.q.trim()) w.push("案件名に " + f.q.trim());
  return w.join(" / ");
}

/* 絞り込みの操作列。
   onlyOwner: 担当者ごとの案件で、まだ担当を選んでいないとき。担当の選択欄だけを出す。
   🔴 選ぶ前の画面には件数の表しか無いのに、名札・満了まで・案件名の欄と
      「604 件中 604 件を表示（絞り込みなし）」が出ていて、担当を選ぶ前から
      表を絞り込めるように見えていた（2026-09-23 実機） */
function boardFilterBar(D, onlyOwner) {
  const names = Array.from(new Set(D.rows.map((r) => r.consultant).filter(Boolean)))
    .sort((a, b) => a.localeCompare(b, "ja"));
  const flags = (D.meta.flag_counts || []).slice().sort((a, b) => b.n - a.n);
  const opt = (v, t, cur) =>
    '<option value="' + esc(v) + '"' + (cur === v ? " selected" : "") + ">" + esc(t) + "</option>";
  let h = '<div class="ctlbar" id="board-filter">';
  h += '<label class="act">担当 <select id="bf-consultant">' +
    opt("", "すべて", boardFilter.consultant) +
    names.map((n) => opt(n, n, boardFilter.consultant)).join("") + "</select></label>";
  if (onlyOwner) return h + "</div>";
  h += '<label class="act">名札 <select id="bf-flag">' +
    opt("", "すべて", boardFilter.flag) +
    flags.map((x) => opt(x.label, x.label + "（" + num(x.n) + "）", boardFilter.flag)).join("") +
    "</select></label>";
  /* MTG 途絶の帯（S-2、2026-09-28）。今日動く先の KPI「MTGが90日以上途絶 N 件」の N 件は名札 2 種（fixture 56+46）に
     割れていて名札の欄では 1 つの条件にならないので、行の帯（mtg_band）で絞る欄を置く。選択肢はサーバの帯そのまま */
  const bands = ((D.meta.mtg_gap || {}).bands || []).filter((b) => b.n > 0 || b.band === boardFilter.band);
  h += '<label class="act">MTG途絶 <select id="bf-band">' +
    opt("", "すべて", boardFilter.band) +
    bands.map((b) => opt(b.band, b.label + "（" + num(b.n) + "）", boardFilter.band)).join("") +
    "</select></label>";
  h += '<label class="act">満了まで <select id="bf-expiry">' +
    opt("", "すべて", boardFilter.expiry) +
    EXPIRY_BANDS.map((b) => opt(b.k, b.t, boardFilter.expiry)).join("") + "</select></label>";
  /* 幅は CSS の min-width / max-width で決める。ここに px を書かない */
  h += '<label class="act">案件名 <input type="search" id="bf-q" placeholder="部分一致" ' +
    'value="' + esc(boardFilter.q) + '"></label>';
  h += '<button type="button" class="act" id="bf-clear">絞り込みを外す</button>';
  return h + "</div>";
}

/* ②のコンサルタント名から③へ飛ぶ。担当で絞った状態で開く */
function drillToBoard(name) {
  boardFilter = { consultant: name, flag: "", expiry: "", q: "", band: "" };
  go("consultant", "byowner", false, undefined, "keep");   /* 絞り込みはここで入れた。go() に既定へ戻させない（M-2） */
}
/* ①今日動く先の KPI から③へ。MTG 途絶の帯で絞った状態で開く（S-2。裁定: KPI を押したら案件そのものを絞って開く）。
   go() が①に入るときに担当の絞り込みを外すので、全社のその帯が出る。
   consultant: 今日動く先で担当を選んでいるとき。札の数字はその担当の実数（critical_by_consultant）なので、行き先も
   その担当のその帯にする。案件そのものは入るときに担当を外すので、「担当者ごとの案件」で開く（同じ表・同じ絞り込み欄） */
function drillToBand(band, consultant) {
  boardFilter = { consultant: consultant || "", flag: "", expiry: "", q: "", band: band };
  /* 絞り込みはここで入れた。go() に既定へ戻させない（M-2）。URL には #deal/board?band=critical の形で残る */
  if (consultant) go("consultant", "byowner", false, undefined, "keep"); else go("deal", "board", false, undefined, "keep");
}

/* いま開いている項目を描き直す（並び替え・絞り込みのたびに使う）。
   取り直しはしない。手元のデータで組み直すだけ */
/** keep = 開いたままにする details の番号（幅の描き直しだけで使う。絞り込みの描き直しでは渡さない。
    行が変わると番号が別の行を指すため） */
function redrawMain(D, keep) {
  const v = viewOf(cur.menu, cur.view);
  const main = document.getElementById("cs-main");
  const fk = focusKey(document.activeElement);
  /* 本部アプローチの枠（#hq-box）の中は本文と別に描くので、開いている details も別に覚えて、
     wireHoujin が描き直すときに開き直す（幅の描き直しのときだけ。絞り込みでは覚えない） */
  const hq = keep ? document.getElementById("hq-box") : null;
  hqKeep = hq && hq.querySelectorAll ? openDetails(hq) : null;
  paintFigs(main, () => ctlbar(v, D) + v.render(D), keep);   /* 図の幅を枠に合わせる（2回描き） */
  wire(v);
  refocus(fk);
  syncUrl();   /* 絞り込み・並び替え・担当・拠点の変更を URL に写す（M-2。履歴は積まない） */
}

/* 描き直しの前後でフォーカスを保つ。
   🔴 本文を innerHTML で入れ替えると、いま触っていた選択欄・ボタンが消えて
      フォーカスが body に飛ぶ。キーボードで選択欄を↓で動かすと1回ごとに
      change が来て描き直すので、2つ目から先へ進めなくなっていた
      （2026-09-23 実機: 案件そのものの担当の選択欄, U9）。
      描き直した後に、同じ役目の部品を探してフォーカスを戻す。 */
function focusKey(a) {
  if (!a || a === document.body || !a.getAttribute) return null;
  if (a.id) return "#" + a.id;
  const tbl = a.closest && a.closest("table[id]");
  if (tbl && a.dataset && a.dataset.k != null)
    return "#" + tbl.id + ' button.sort[data-k="' + a.dataset.k + '"]';
  if (a.dataset && a.dataset.d != null) return '#hj-pick input[data-d="' + a.dataset.d + '"]';
  if (a.dataset && a.dataset.v != null) return '#cs-side button[data-v="' + a.dataset.v + '"]';
  return null;
}
function refocus(k) {
  if (!k) return;
  let e = null;
  try { e = document.querySelector(k); } catch (_) { e = null; }
  if (e && e.focus) e.focus({ preventScroll: true });
}

/* cols: 列の定義。省くと BOARD_COLS（案件そのもの・担当者ごとの案件）。今日動く先は TODAY_COLS を渡す
   limit: 並べた後に出す行数の上限（案件そのものの上位 BOARD_KEEP 行。省くか 0 なら全件）。切ったことは呼び出し側が
   scroll() の total（「N 行を出しています（全 T 件のうち）」）と boardMoreBar で言う
   🔴 同じ行の配列（同一性）・同じ並び・同じ上限・同じ列なら、組んだ HTML をそのまま返す（段2 M-8）。paintFigs が図の幅を
   枠に合わせるために本文を 2 回組むが、表は枠の幅と無関係。604 行 × 15 列の案件そのものは 1 回組むのに約 0.5 秒かかる
   （2026-09-28 fixture 1440px 実測: 2 回組みの描き直し 1,197ms）。表ごと（id）に 1 つだけ覚える */
const boardTblMemo = {};
let BOARD_TBL_BUILDS = 0;   /* 組んだ回数。見張り（tests/consulting_view_rules.js「段2 M-8」）と描画時間の計測で読む */
function boardTable(rows, sort, id, cols, limit) {
  cols = cols || BOARD_COLS;
  const key = sort.key + "|" + (sort.asc ? 1 : 0) + "|" + (limit || 0) + "|" + cols.map((c) => c.k).join(",");
  const m = boardTblMemo[id];
  if (m && m.rows === rows && m.key === key) return m.html;
  BOARD_TBL_BUILDS++;
  const rs = rows.slice();
  const k = sort.key, asc = sort.asc;
  const col = cols.find((c) => c.k === k);
  const val = col && col.sv ? col.sv : (r) => r[k];
  rs.sort((a, b) => {
    const x = val(a), y = val(b);
    if (x == null && y == null) return 0;
    if (x == null) return 1;   // 値が無いものは常に末尾。0 として並べない
    if (y == null) return -1;
    const c = typeof x === "string" ? x.localeCompare(y, "ja") : x - y;
    return asc ? c : -c;
  });
  const shown = limit > 0 && rs.length > limit ? rs.slice(0, limit) : rs;
  let t = '<table id="' + id + '"><thead><tr>';
  for (const c of cols) t += sortTh(c, k, asc);
  t += "</tr></thead><tbody>";
  for (const r of shown) {
    t += "<tr>";
    for (const c of cols) t += '<td' + (colClass(c) ? ' class="' + colClass(c) + '"' : "") + ">" + c.fmt(r) + "</td>";
    t += "</tr>";
  }
  t += "</tbody></table>";
  boardTblMemo[id] = { rows, key, html: t };
  return t;
}

/* 案件そのもの・担当者ごとの案件の表は既定で上位 BOARD_KEEP 行（段2 M-8）。604 行を一度に描くと本番で Chrome の画面キャプチャが
   30 秒応答しなかった（00 項目68）。400px では全行を出すページが 35,142px になっていた（2026-09-28 fixture 実測）。
   切っていることは枠の案内（scrollCap の「N 行を出しています（全 T 件のうち）」）と、表の下の boardMoreBar で言う。
   全件は「残りも出す」で出る（黙って隠さない） */
const BOARD_KEEP = 100;
/* 「残りも出す」の状態。絞り込みを変えたとき・外したとき・画面に入り直したとき（load）に既定へ戻す。
   並び替えでは戻さない（全件を出して並べ替えて見る使い方を、押すたびに 100 行へ戻して邪魔しない） */
let boardShowAll = false;
function boardMoreBar(n) {
  if (n <= BOARD_KEEP) return "";
  return '<div class="ctlbar board-more">' +
    (boardShowAll
      ? '<button type="button" class="act" id="board-more" data-all="0">上位 ' + num(BOARD_KEEP) + " 行だけにする</button>" +
        '<span class="muted small">全 ' + num(n) + " 行を出しています。</span>"
      : '<button type="button" class="act" id="board-more" data-all="1">残りの ' + num(n - BOARD_KEEP) + " 行も出す</button>" +
        '<span class="muted small">いまの並びで上位 ' + num(BOARD_KEEP) + " 行だけ出しています（全 " + num(n) +
        " 行）。全件を一度に描くと重いためです。絞り込むか、表の見出しで並びを変えると上位が入れ替わります。</span>") +
    "</div>";
}

/* 案件そのもの・担当者ごとの案件のうち、絞り込み・並び替えで変わる部分（件数の行 → 表 → 決まりごと → 名札の図）。
   renderBoard が <div id="board-body"> に入れ、boardRepaint はここだけ描き直す（段2 M-8）。
   絞り込みの欄（boardFilterBar）はこの外にあるので、打っている途中の検索欄が作り直されない */
function boardBody(D, shown, on) {
  const byOwner = cur.view === "byowner";
  /* 🔴 絞り込んだら、何件中の何件を見ているのかを必ず出す。
     絞ったことを忘れて「全件がこう見える」と読み違えるのを防ぐ。 */
  let h = '<div class="count-line' + (on ? " on" : "") + '" id="board-count">' +
    "<b>" + num(D.rows.length) + " 件中 " + num(shown.length) + " 件</b>を表示" +
    (on ? "（絞り込み中: " + esc(boardFilterWords(D)) + "）" : "（絞り込みなし）") + "</div>";
  /* 表が主役の画面なので表を先に、図はその下（08 の S-8）。
     🔴 見出しは画面名（左の「案件そのもの」）と重ならない語にする。前は「案件の立ち位置」で、
     画面名が3つ（左・見出し・サーバの文）あり、初見の人が別画面と誤認していた（S-6） */
  h += sec("表", byOwner ? "この担当者の案件" : "稼働中の案件（1行が取引1件）");
  /* 🔴 14列あるので、枠に入れないと**ページ全体が横に流れる**
     （2026-09-22 実測: 1440px幅で document が 2640px になっていた）。
     表は枠の中だけで横スクロールさせる。上位 BOARD_KEEP 行に切るので、切る前の件数（shown.length）を渡す（V12） */
  h += shown.length
    ? scroll(boardTable(shown, boardSort, "board-tbl", BOARD_COLS, boardShowAll ? 0 : BOARD_KEEP), 640, shown.length) +
      boardMoreBar(shown.length)
    : '<div class="empty">この条件に当てはまる案件はありません。' +
      "「絞り込みを外す」で戻せます。</div>";
  /* M-5: 並びと採用単価の比べ方は取り決めなので 1 つの畳みに */
  h += foldNote("def", "この並びについて", esc(D.meta.order_rule), "", "", cpaBandNote(D.meta));
  h += sec("図", "名札の分布");
  h += flagFig(D, on ? shown : null);
  return h;
}

/* 並び替え・絞り込み・「残りも出す」で、#board-body だけ描き直す（段2 M-8）。
   🔴 前は redrawMain で本文全体（操作列・絞り込みの欄・604 行の表 × 2 回）を作り直していて、検索欄の 1 文字ごとに
   約 1 秒かかり、欄そのものが新しい要素になるのでフォーカスと IME の窓を戻す手当てが要った。
   #board-body が無い形（担当者ごとの案件で担当を選ぶ前の持ち件数の表）や、担当を外して持ち件数の表に戻るときは、
   形が変わるので本文全体を描き直す */
function boardRepaint() {
  const box = document.getElementById("board-body");
  if (!box || !boardCache || (cur.view === "byowner" && !boardFilter.consultant)) { redrawMain(boardCache); return; }
  const fk = focusKey(document.activeElement);
  const D = boardCache, shown = boardApply(D.rows);
  paintFigs(box, () => boardBody(D, shown, boardFilterOn()));   /* 名札の図の幅を枠に合わせる（2回描き。表は覚え書きで 1 回） */
  wireBoardBody();
  markScrollAll();
  refocus(fk);
  /* 絞り込み・並び替えを URL に写す（段2 M-2）。🔴 2026-09-29 統合: M-2 は redrawMain の最後で syncUrl していたが、
     M-8 でここは redrawMain を通らなくなり、案件そのものの絞り込み・並び替えが URL に載らなくなっていた */
  syncUrl();
}
/* #board-body の中の部品（表の見出しの並び替え・残りも出す）。描き直すたびに付け直す */
function wireBoardBody() {
  document.querySelectorAll("#board-tbl th.sortable button.sort").forEach((th) => {
    th.onclick = () => {
      boardSort = nextSort(boardSort, th.dataset.k);
      boardRepaint();
    };
  });
  const more = document.getElementById("board-more");
  if (more) more.onclick = () => { boardShowAll = more.dataset.all === "1"; boardRepaint(); };
}

/* 名札を3つの意味に分ける。
   🔴 **色だけで分類を伝えない。** 色覚によっては緋・山吹・紫が見分けられない。
      棒の右に分類の言葉も書くので、白黒に印刷しても読める。
   分類の規則をここ1か所に置いているのは、①と③で食い違わないようにするため。 */
function flagGroup(label) {
  /* 🔴 「満了90日前でMTGが30日以上途絶」は満了の話でもあるので、
     先に MTG を見る。順番を入れ替えると分類が変わる */
  if (label.indexOf("MTG") >= 0) return { color: C.hi, word: "関係が危ない" };
  if (label.indexOf("NPS") >= 0 || label.indexOf("退職") >= 0)
    return { color: C.hi, word: "関係が危ない" };
  if (label.indexOf("満了") >= 0 || label.indexOf("接触") >= 0)
    return { color: C.ki, word: "時間が迫っている" };
  return { color: C.murasaki, word: "成果が出ていない" };
}

/* MTG途絶の帯の色。🔴 **色だけで意味を伝えない。**
   棒には帯の名前（日数入り）がそのまま出るので、白黒でも読める。
   🔴 2026-09-24 実機: 注意（30〜59日）を紫で塗っていて、同じ画面の名札の図では紫が
   「成果が出ていない」だった（1つの画面で紫が2つの意味）。注意は警告（山吹）の一段手前なので、
   同じ山吹を薄く塗る（MTG_BAND_FAINT）。紫は名札の「成果が出ていない」だけにする */
const MTG_BAND_COLOR = {
  critical: C.hi, red: C.ki, yellow: C.ki,
  recent: C.midori, no_record: C.ghost, onboarding: C.ghost,
};
const MTG_BAND_FAINT = { yellow: true };

/* 1行ぶんの「最後のMTG」。
   🔴 日数だけでなく**どこから取った日付か**を必ず添える。
      録画は事実、メール由来は推定（±1日で83.3%）。同じ顔で並べない。 */
function mtgCell(r) {
  if (r.mtg_band === "onboarding")
    return '<span class="muted small">立ち上がり期</span>';
  if (r.mtg_days == null)
    return '<span class="muted small">記録なし</span>';
  /* 注意（30〜59日）は警告と同じ山吹で、太字にしない（帯の図の薄い山吹と同じ扱い。紫は使わない） */
  const col = r.mtg_band === "critical" ? "hi"
            : r.mtg_band === "red" || r.mtg_band === "yellow" ? "ki" : "midori";
  const tagB = r.mtg_band === "yellow" ? "span" : "b";
  const src = r.mtg_source === "recording" ? "録画"
            : r.mtg_source === "mail" ? "メール（推定）"
            : r.mtg_source === "both" ? "録画" : "";
  return "<" + tagB + ' style="color:var(--' + col + ')">' + num(r.mtg_days) + "日前</" + tagB + ">" +
    (src ? '<span class="muted small"> ' + esc(src) + "</span>" : "") +
    (r.mtg_forced_by_expiry ? '<span class="muted small"> 満了前</span>' : "");
}

function flagFig(D, subset) {
  /* subset を渡すと、絞り込んだ後の件数で数え直す。
     🔴 絞り込み中に全件の図を出すと、表と図で件数が食い違って読めなくなる。 */
  let fc = D.meta.flag_counts || [];
  if (subset) {
    const m = {};
    for (const r of subset) for (const f of (r.flags || [])) m[f] = (m[f] || 0) + 1;
    fc = Object.entries(m).map((e) => ({ label: e[0], n: e[1] }));
  }
  return fig("名札ごとの件数" + (subset ? "（絞り込んだ " + num(subset.length) + " 件）" : ""),
    "1つの案件に複数つきます",
    fc.length
      ? svgBarH({ w: 700, fmt: F.int, rh: 24,
          rows: fc.slice().sort((a, b) => b.n - a.n).map((x) => ({
            label: tail(x.label, 26), full: x.label, v: x.n, txt: num(x.n) + "件",
            note: flagGroup(x.label).word, color: flagGroup(x.label).color })) })
      : '<div class="empty">名札の付いた案件がありません。</div>',
    lg("box", C.hi, "関係が危ない") + lg("box", C.ki, "時間が迫っている") +
    lg("box", C.murasaki, "成果が出ていない") +
    '<i class="full">棒の右に分類の言葉も書いています。' +
    "<b>色が見分けられなくても読めます。</b></i>");
  /* 🔴 ここに並びの決まり（order_rule）も書いていて、案件そのものでは頭の「この並びについて」と
     同じ文が2回出ていた（2026-09-23 実機, V21 の残り）。並びは表の話なので、表の側に1回だけ出す */
}

/* ---------------------------------------------------------------- 3 今日動く先 */
/* 今日動く先で選んだ担当（D-1a、2026-09-28 藤巻さんの判断）。空は全員。
   端末（localStorage）に覚える。覚えられない端末（私的モード・保存の禁止）では全員表示に戻るだけで、画面は動く。
   🔴 サーバには送らない。担当の絞り込みは画面の中だけ。URL（?c=）にも載る（M-2）。URL の c ＞ 端末の記憶で、
      URL から入れた担当では端末の記憶を書き換えない（URL_STATE.today.c） */
const TODAY_OWNER_KEY = "cs.today.consultant";
function loadTodayConsultant() {
  try { return String(localStorage.getItem(TODAY_OWNER_KEY) || ""); } catch (_) { return ""; }
}
function saveTodayConsultant(v) {
  try {
    if (v) localStorage.setItem(TODAY_OWNER_KEY, v); else localStorage.removeItem(TODAY_OWNER_KEY);
  } catch (_) { /* 覚えられない端末。全員表示で動く（todayOwnerBar が「覚えられません」と出す） */ }
}
let todayConsultant = loadTodayConsultant();
/* いまの担当が URL（?c=）から入ったものか。todayOwnerBar が「端末の記憶とずれている理由」を書き分けるのに使う。
   🔴 前はずれていれば一律「この端末では覚えられません。開き直すと全員に戻ります」と出していた。URL から入れたときは
      端末の記憶をわざと書き換えないのでずれるのが正しく、保存できる端末でも・同じ URL を開き直しても同じ担当なのに
      事実と違う文が出た（2026-09-29 検証 Playwright: #deal/today?c=… を再読込、localStorage は書ける端末） */
let todayFromUrl = false;
/* 「今週始まった契約」の畳みを開いているか。描き直し（並び替え・担当の切り替え）で閉じないように覚える */
let todayStartedOpen = false;
/** 「絞った条件」の文。サーバの文（routes.rs filter_rule）には画面名を入れず、全件への行き先はここで
    goLink（MENUS の名前）で添える（2026-09-28 UI/UX 改善 S-6）。
    🔴 前はサーバの文が「全件は「案件」の中の「案件の立ち位置」で見られます」と、メニューに無い名前を
    案内していた（左は「案件そのもの」、表の見出しは「案件の立ち位置」、サーバの文が3つ目の名前）。
    名前を変えるときの追従先を MENUS の1か所にする */
function todayFilterRule(meta) {
  /* サーバの文が無い・空のときは句点から始めない（前は「。全件は …」と出た。サーバは必ず載せるが、応答の形に頼らない） */
  const rule = esc((meta && meta.filter_rule) || "");
  return (rule ? rule + "。" : "") + "全件は " + goLink("deal", "board") + " で見られます。";
}

/* 選んだ担当で応答を絞った写し。サーバは名札2本以上の全候補（candidates、fixture 243 件）と、その上位 keep 件
   （rows、24 件）を返す（routes.rs build_today_board）。
   - 担当が未選択: rows をそのまま（マネージャーの見え方は今までと同じ。24 件に切る）
   - 担当を選んだ: candidates からその人の候補を**全件**（fixture で 1 人あたり 2〜20 件。「動ける長さ」なので切らない）
   今週満了・今週始まった契約も同じ担当で絞る。meta は変えない（全社の件数は meta から読む）。
   古い応答（candidates が無い）では rows から絞る */
function todayScope(D) {
  const c = todayConsultant;
  if (!c) return D;
  const mine = (rs) => (rs || []).filter((r) => (r.consultant || "") === c);
  return Object.assign({}, D, {
    rows: mine(D.candidates || D.rows),
    expiring_this_week: mine(D.expiring_this_week),
    started_this_week: mine(D.started_this_week),
  });
}

/* 担当の選択欄（D-1a）。名前はサーバの consultants（稼働中の全件の担当。fixture 27 名）から。
   🔴 D0 = 担当で絞る前の応答を渡す。2026-09-28 検証（fixture）: 絞った後の D を渡していたため、候補（candidates）には
   居らず今週満了・今週始まった にだけ居る担当（habc7b05f19ea）が、別の担当を選んだ瞬間に欄から消えた
   （全員で 25 択 → 1 名選ぶと 24 択。その人へ切り替えるには一度「全員」に戻すしかない）。
   古い応答（consultants が無い）では候補・今週満了・今週始まった から集める（24 件に切った後の rows だけだと
   fixture で 27 名中 11 名しか出ない。08 の M-4）。ただし候補が 0 件の担当（fixture で 3 名）はこの集め方では出ない。
   覚えている担当が欄に無くても選択肢に残す（消えると、なぜ 0 件なのかが分からない） */
function todayOwnerBar(D0) {
  const D = D0;
  const src = (D.candidates || D.rows || []).concat(D.expiring_this_week || [], D.started_this_week || []);
  const names = Array.isArray(D.consultants) && D.consultants.length
    ? D.consultants.filter(Boolean).slice()
    : Array.from(new Set(src.map((r) => r.consultant).filter(Boolean)));
  if (todayConsultant && names.indexOf(todayConsultant) < 0) names.push(todayConsultant);
  names.sort((a, b) => a.localeCompare(b, "ja"));
  const opt = (v, t) => '<option value="' + esc(v) + '"' + (todayConsultant === v ? " selected" : "") + ">" + esc(t) + "</option>";
  /* 覚えられたかは読み返して確かめる（書けたつもりで「覚えます」と言わない）。URL から入った担当は端末に書いていないので、
     ずれていても「覚えられない」ではない（todayFromUrl の注記） */
  const kept = !todayConsultant || loadTodayConsultant() === todayConsultant;
  const fromUrl = !kept && todayFromUrl;
  return '<div class="ctlbar" id="today-filter"><label class="act">担当 <select id="td-consultant">' +
    opt("", "全員") + names.map((n) => opt(n, n)).join("") + "</select></label>" +
    '<span class="muted small">' +
    (todayConsultant
      ? "この担当の候補を全件出しています" +
        (kept ? "（この端末が覚えます。次に開いても同じ担当）"
          : fromUrl ? "（リンクの担当で開いています。この端末が覚えている担当は変えていません。欄で選び直すと、この端末が覚えます）"
          : "（この端末では覚えられません。開き直すと全員に戻ります）")
      : "全社の上位 " + num(D.meta.n_shown) + " 件。担当を選ぶと、その人の候補を全件出します") +
    "</span></div>";
}

/* KPI の札（button.kpi[data-jump]）から同じ画面の行き先へ（段2 S-2 の残り。今日動く先だけだったのを全画面に）。
   行き先が畳み（details）なら開いてから summary に止まる。今日動く先の札は wireToday（todayJump）が先に結んでいるので、
   結んであるものには触らない（wire() の順は画面ごとの wire* → wireKpiJumps） */
function kpiJump(id) {
  const el = document.getElementById(id);
  if (!el) return;
  const isDetails = typeof el.open === "boolean";
  if (isDetails) el.open = true;
  if (el.scrollIntoView) el.scrollIntoView({ block: "start" });
  const f = isDetails && el.querySelector ? (el.querySelector("summary") || el) : el;
  if (f && f.focus) f.focus({ preventScroll: true });
}
function wireKpiJumps() {
  document.querySelectorAll("#cs-main button.kpi[data-jump]").forEach((b) => {
    if (!b.onclick) b.onclick = () => kpiJump(b.dataset.jump);
  });
}

/* KPI から同じ画面の表へ（S-2）。畳んだ枠（今週始まった契約）は開いてから */
function todayJump(id) {
  const el = document.getElementById(id);
  if (!el) return;
  if (id === "td-started") { el.open = true; todayStartedOpen = true; }
  if (el.scrollIntoView) el.scrollIntoView({ block: "start" });
  const f = id === "td-started" && el.querySelector ? el.querySelector("summary") : el;
  if (f && f.focus) f.focus({ preventScroll: true });
}

function renderToday(D0) {
  const D = todayScope(D0);
  const c = todayConsultant;
  const soon = D.expiring_this_week || [];
  const started = D.started_this_week || [];
  const G = D.meta.mtg_gap || {};
  const bandN = (k) => ((G.bands || []).find((b) => b.band === k) || {}).n || 0;
  let h = sec("問い", "今日・今週、どこに連絡するか") +

    "上から順に潰していってください。" +
    /* 案件名は通常の <a href> なので、別タブに開ける。戻ると先頭へ戻される（M-2 まで）ので、その回避策を1文（S-13）。
       Ctrl+クリックはタッチ端末には当てはまらない案内で、400px では1画面目の2行を使っていた（2026-09-28 実測）。
       ≤600px では出さない（.pconly）。スマホは長押しで開けるので、失うものは無い */
    '<span class="pconly">案件名は Ctrl+クリック（Mac は &#8984;+クリック）で別のタブに開けます。</span></div>';
  /* 欄の顔ぶれは絞る前の応答（D0）から。絞った後の D を渡すと、選んだ担当以外が欄から消える（todayOwnerBar） */
  h += todayOwnerBar(D0);

  /* ---------------- 今日の数字（KPI）。押せる札は表へ（S-2） ----------------
     🔴 2026-09-28 診断（08 の S-1・S-2）: 赤の札が 2 枚（今日出す先・MTG 途絶）あって「増えるとまずい件数」が
     どちらか読めなかった。赤は MTG 途絶だけにする。
     担当を選んでいるときの MTG 途絶は、サーバが稼働中の全件から担当ごとに数えた実数（critical_by_consultant）。

  const CB = G.critical_by_consultant;

          : "うち " + num(G.forced_by_expiry) + " 件は満了90日前の途絶で引き上げたもの",
        crit ? "bad" : "", { band: "critical", consultant: c && CB ? c : "", text: c && CB ? "この担当の一覧を見る" : "全社の一覧を見る" }) +

        (c ? "（全社では " + num((D0.expiring_this_week || []).length) + " 件）" : ""),
        soon.length ? "warn" : "", { jump: "td-soon-h", text: "表へ" }) +

    kpi("稼働中の全件", num(D.meta.n_active) + '<span class="u">件</span>',
        "全件は " + goLink("deal", "board") + " で") + "</div>";

  /* ---------------- 表 今日動く先（本題。1 画面目に入れる。08 の S-1） ----------------
     🔴 2026-09-28 診断（fixture 1440px）: この表が y=2,795（全高 4,014）で、「毎朝ここだけ見れば動ける」と書いた画面の
     答えに着くのに 3 画面スクロールしていた（400px では y≈3,960）。問い → KPI → この表 の順にする。
     決まりごと（絞った条件・並び・採用単価の比べ方）は取り決めなので、見出しの直下の 1 行に畳む（開けば全文）。

  h += sec("表", "今日動く先（" + num(D.rows.length) + " 件）", "td-today-h");
  /* 決まりごとの畳み。母数（n_hit 件から n_shown 件）は枠の案内（scroll-cap の「N 行を出しています（全 T 件のうち）」）が
     言うので、summary では繰り返さない。🔴 2026-09-28 検証（fixture 1440×900）: summary と scroll-cap が同じ
     「243 件から 24 件」を 40px の間に 2 回言い、表の見出し行が 772 で 1 画面目に完全な行が 0 行だった。
     畳みと案内は scroll() の side で同じ 1 行（.caprow）に並べる。
     担当を選んでいるときは、絞った条件（サーバの filter_rule は全社の説明）の前に、この表が何かを 1 文書く */
  const rule = '<details class="fold" id="td-rule"><summary>' +

      todayFilterRule(D.meta)) +

    todayFlagLegend([D.rows, soon, started]) + "</details>";
  if (c && !D.rows.length)

      num(D.meta.n_shown) + " 件が出ます。</div>";
  /* サーバが n_hit 件から keep 件に絞っている（routes.rs KEEP）。絞る前の件数を渡す（V12）。
     担当で絞ったときは切っていないので渡さない。並びは表ごとに持つ todaySort（U6）。
     8 列の TODAY_COLS。高さの制限は外す（24 行を一望する。08 の S-3）。決まりごとの畳みは案内と同じ行に（side） */
  h += scroll(boardTable(D.rows, todaySort["today-tbl"], "today-tbl", TODAY_COLS), "none", c ? null : D.meta.n_hit, rule);

  /* ---------------- 今週満了（行動。名札に関わらず出す。開いたまま） ---------------- */
  h += sec("表", "今週満了（" + num(soon.length) + " 件）", "td-soon-h");
  h += '<div class="lede">残り7日以内。名札の本数に関わらず出しています。</div>';

  /* ---------------- 今週始まった契約（立ち上がりの確認。畳む。件数は summary に） ---------------- */
  h += '<details class="fold" id="td-started"' + (todayStartedOpen ? " open" : "") + "><summary>今週始まった契約（" +
    num(started.length) + " 件）" +
    (started.length ? '　<span class="when-closed">表を開く</span><span class="when-open">表を閉じる</span>' : "") + "</summary>";
  h += '<div class="muted small">' + esc(D.meta.new_deal_rule || "") + "</div>";
  h += started.length
    ? scroll(boardTable(started, todaySort["new-tbl"], "new-tbl", TODAY_COLS), 320)

  h += "</details>";

  /* ---------------- 図 2 つ（名札の内訳・MTG 途絶の帯）は外した（2026-09-29 組み替え 段A、handover 09 の 3章 1） ----------------
     どちらも案件一覧の名札の分布・帯の絞り込みと同じ中身で、毎朝の画面の表の下に 2 つの図が続いていた。
     🔴 図にしか書いていなかったこと（帯を付けていない件数・帯の線引き・最終MTG日が分かった割合）は黙って消さず、
        下の畳み「MTG 途絶の数え方と母数」に文で残す（件数は応答のまま。数え直さない） */
  h += todayMtgNote(D);

  /* ---------------- 自分の接触（担当を選んだときだけ。09 の 3章 1 の 6、N5） ----------------
     /api/consulting/contact-trend を担当で絞る（API の変更なし）。他の人とは並べない（評価と誤読させない）。
     応答は描いた後に wireToday → fillTodayContact が取りに行く（今日の表を待たせない） */
  if (c) {
    h += sec("図", "持ち案件1件あたりの接触（" + c + "、直近6か月）", "td-contact-h");
    h += '<div id="td-contact"><div class="loading">接触の推移を読み込み中…</div></div>';
  } else {
    h += '<p class="muted small">担当を選ぶと、その人の持ち案件1件あたりの接触（直近6か月）がここに出ます。</p>';
  }

  return h + foot(D.meta);
}

/** 今日の畳み「MTG 途絶の数え方と母数」。前は図「MTG が途絶えている先（全社）」の注記に書いていた（2026-09-29 に図を外した）。

  return foldNote("def", "MTG 途絶の数え方と母数", body, "線引きは、毎朝 Slack に届く MTG 途絶の警告と同じ", "td-mtg-note");

/* 今日の「自分の接触」（N5）。contact-trend の応答は画面をまたいで 10 分だけ覚える（担当の切り替え・並び替えの描き直しで取り直さない）。
   「読み直す」を押したら捨てる（load の refresh） */
let todayContactCache = null;
function fillTodayContact() {
  const box = document.getElementById("td-contact");
  if (!box || !todayConsultant) return;
  const draw = (body) => {
    const b = document.getElementById("td-contact");
    if (!b || !todayConsultant) return;
    paintFigs(b, () => renderMyContact(body, todayConsultant));
    markScrollAll();
  };
  if (todayContactCache && Date.now() - todayContactCache.at < PAGE_CACHE_MS) { draw(todayContactCache.body); return; }
  fetch("/api/consulting/contact-trend", { credentials: "same-origin" })
    .then(readJson)   /* ログイン切れを見分ける（U10） */
    .then((body) => {
      if (body.error) throw new Error(body.message || "取得できません");
      todayContactCache = { at: Date.now(), body: body };
      draw(body);
    })
    .catch((e) => {
      const b = document.getElementById("td-contact");
      if (b) b.innerHTML = e.loginExpired ? LOGIN_EXPIRED_HTML
        : '<div class="err">接触の推移を読み込めませんでした。' + esc(e.message) + "</div>";
    });
}
/** 選んだ担当の持ち案件1件あたりの接触（月ごと、通話の記録がある月の直近 6 か月）。🔴 本人の線だけ。他の人・全体と並べない
    （09 の 3章 1「他の人と並べない」。順位や評価と読ませない）。定義は担当者ごとの接触と同じ（名前もそちらに揃える。09 の 10章③:
    人ごとの接触の 2 つの定義は名前で区別する。担当者の一覧の「接触率」とは別のもの） */
function renderMyContact(CT, name) {
  const U = (CT && CT.month) || { periods: [], rows: [] };
  const periods = U.periods || [];
  const idx = periods.map((p, i) => i).filter((i) => !periods[i].calls_missing).slice(-6);
  const row = (U.rows || []).find((r) => r.consultant === name);
  const ncCt = firstSentence(esc((CT && CT.meta && CT.meta.not_counted) || "").replace("※ ", ""), "評価ではありません");
  const more = "全員の推移と決まりごとは " + goLink("research", "team") + " にあります。";
  if (!row || !idx.some((i) => row.cells[i] && row.cells[i].deals > 0))
    return '<div class="empty">' + esc(name) + " には、直近 " + num(idx.length) + " か月に持ち案件がありません（接触を数える月の中で）。" + more + "</div>";
  /* 縦軸の上端は確定した月の最大（途中の月の値で伸ばさない。担当者ごとの接触と同じ決まり） */
  const topOf = (withProv) => idx.reduce((t, i) => {
    const c = row.cells[i];
    return c && c.avg != null && !c.small_n && (withProv || !periods[i].provisional) && c.avg > t ? c.avg : t;
  }, 0);
  const top = topOf(false) || topOf(true);
  const pts = contactPts(row.cells, idx, periods, top);
  const minDeals = (CT.meta && CT.meta.min_deals) || 3;
  const svg = pts.some((p) => p)
    ? svgLine({ w: 320, h: 160, x: idx.map((i) => contactX(periods[i], "month")), yFmt: F.d2, yTickAuto: true, fit: true,
        pad: { l: 34 }, yMax: top, yTicks: 3, alt: name + "の持ち案件1件あたりの接触（月ごと）", series: [{ pts: pts, color: C.ai }] })
    : '<div class="empty">どの月も持ち案件が ' + num(minDeals) + " 件未満なので、点を打っていません（値は下の表）。</div>";
  const tbl = table([{ t: "月", w: "s" }].concat(idx.map((i) => ({ t: periods[i].label + (periods[i].provisional ? "（途中）" : ""), n: 1 }))),
    [["1件あたり（接触/持ち案件）"].concat(idx.map((i) => contactCell(row.cells[i])))], "", "td-contact-tbl");
  return '<p class="muted small"><b>' + ncCt[0] + "</b></p>" +
    fig("月ごと", "本人の分だけ。他の人とは並べていません", svg,
      lg("line", C.ai, "確定した月") + lg("ring", C.ai, "未確定（いまの月。途中なので低く出ます）") +
      (pts.some((p) => p == null) ? '<i class="full">線が切れている月は、持ち案件が 0 件か ' + num(minDeals) + " 件未満です（値は下の表）。</i>" : "") +
      '<i class="full">値は下の表にあります（マウスなら点に重ねても出ます）。</i>') +
    scroll(tbl, "none") +
    '<p class="muted small">1件あたりの接触 ＝ その月の接触の回数 ÷ その月に持っていた案件の数（担当者の一覧の「接触率」とは別の数え方）。' +
    /* サーバの文は句点で終わらないことがある（fixture: 「…接触だけです」）。次の文とつながらないよう句点を補う */
    esc(((CT && CT.contact_rule) || "").replace(/([^。])$/, "$1。")) + more + "</p>";
}

/* ---------------------------------------------------------------- 2 案件の立ち位置 */
function renderBoard(D) {
  const shown = boardApply(D.rows);
  const on = boardFilterOn();
  /* 同じ表を①と②の両方で使う。問いだけ変える */
  const byOwner = cur.view === "byowner";
  if (byOwner) {
    let h = sec("問い", "この担当者は、どの案件を持っているか") +
      /* 🔴 前はここに「下の『担当』で選ぶか、持ち件数の表で名前を押すと…」と書いていて、
         すぐ下の枠（担当者を選んでください）の1文目と同じ話が2回続いていた（2026-09-24 実機）。
         選び方は枠の側に1回だけ書き、ここは画面が何を並べるかと、ほかの入口だけにする */
      '<div class="lede">1人の担当者が持っている稼働中の案件を並べます。' +
      goLink("consultant", "team") + " で名前を押しても、ここに来ます。</div>";
    h += boardFilterBar(D, !boardFilter.consultant);
    if (!boardFilter.consultant) {
      /* 🔴 担当を選ぶ前は「案件そのもの」と同じ 604 行の表がそのまま出ていて、
         2つの画面がほぼ同じ中身になっていた（V21）。選ぶ前は**担当者ごとの件数**だけを出し、
         案件の表は担当を選んでから出す。全件の表は「案件そのもの」にある。 */
      /* 数えるのは稼働中の全件（D.rows）。名札・満了まで・案件名の欄はここでは出していないので、
         見えない条件で件数を減らさない（案件そのもので絞ってから来たときも同じ） */
      const per = {};
      for (const r of D.rows) {
        const k = r.consultant || "";
        const p = per[k] || (per[k] = { n: 0, flagged: 0, focus: 0 });
        p.n++;
        if ((r.flags || []).length) p.flagged++;
        if (r.focus) p.focus++;
      }
      const ks = Object.keys(per).sort((a, b) => per[b].n - per[a].n || a.localeCompare(b, "ja"));
      h += note("info", "担当者を選んでください",
        "上の「担当」で選ぶか、下の表で名前を押すと、その人の案件の表が出ます。" +
        "名札・満了まで・案件名での絞り込みは、担当を選んだ後に出ます。" +
        "選ぶまでは担当者ごとの件数だけを出しています（稼働中の全件の表は " + goLink("deal", "board") + " にあります）。");
      /* 🔴 「稼働中 604 件」が画面の頭の1行・この見出し・末尾の枠の3か所に出ていた（2026-09-24 実機）。
         ただし担当を選ぶ前の頭の1行（上の lede）には件数が無く、見出しと末尾から消すと0か所になった
         （2026-09-24 検証）。見出しは担当者の人数だけにし、稼働中の件数は末尾の1か所に出す */
      h += sec("表", "担当者ごとの持ち件数（" + num(ks.length) + " 名）");
      /* 名前を押すと担当で絞る。②担当者の一覧の表（TEAM_COLS）と同じ作り（a.drill）。
         担当が空の行は選択欄にも無いので押せるようにしない */
      h += scroll(table([{ t: "担当" }, { t: "案件", n: 1 }, { t: "名札のある案件", n: 1 },
                         { t: "注力案件", n: 1 }],
        ks.map((k) => [k
          ? '<a href="#" class="drill" data-c="' + esc(k) + '" title="この担当の案件だけを見る">' + esc(k) + "</a>"
          : DASH,
          num(per[k].n), num(per[k].flagged), num(per[k].focus)]), "", "owner-tbl"), 640);
      return h + foot(D.meta, false, "担当者 " + num(ks.length) + " 名・稼働中 " + num(D.rows.length) + " 件");
    }
    /* 件数の行 → 表 → 決まりごと → 図 は boardBody（S-8 の順。絞り込みで描き直す部分。段2 M-8） */
    h += '<div id="board-body">' + boardBody(D, shown, on) + "</div>";
    /* 稼働中の件数は頭の1行と「N 件中 M 件を表示」にあるので、末尾では繰り返さない */
    return h + foot(D.meta, false, "");
  }
  let h = sec("問い", "いま、それぞれの案件はどこにいるか") +
    '<div class="lede">稼働中 ' + num(D.rows.length) +
    " 件。<b>列の見出しを押すと並び替わります。</b>既定は名札の本数が多い順。" +
    "<b>担当・名札・MTG途絶の帯・満了までの期間・案件名で絞り込めます。</b></div>";

  h += boardFilterBar(D);
  /* 🔴 2026-09-28 診断（08 の S-8、fixture 1440px）: 表が図「名札の分布」の下（y=1,391）で、行を特定する画面なのに
     1 画面目に表が無かった。絞り込み → 件数行 → 表 → 図 の順にする（boardBody）。決まりごと（並び・採用単価の比べ方）は表の直下に。
     絞り込み・並び替えは boardRepaint が #board-body だけ描き直す（段2 M-8） */
  h += '<div id="board-body">' + boardBody(D, shown, on) + "</div>";
  return h + foot(D.meta);
}

function wireBoard() {
  /* 絞り込みは #board-body だけ描き直す（段2 M-8）。形が変わるとき（担当者ごとの案件で担当を外す）は boardRepaint が本文全体に戻す */
  const redraw = boardRepaint;
  const pick = (id, key) => {
    const e = document.getElementById(id);
    if (e) e.onchange = () => { boardFilter[key] = e.value; boardShowAll = false; redraw(); };
  };
  pick("bf-consultant", "consultant");
  /* 担当を選ぶ前の持ち件数の表。名前を押したらその担当で絞る（②の表と同じ作り）。
     🔴 押したリンクは描き直しで消えるので、フォーカスが body に飛んでいた（2026-09-23 検証、
     Playwright 400px で Enter → activeElement が BODY）。focusKey では戻す先が作れないので、
     いま選ばれた担当が出ている選択欄（#bf-consultant）へ移す */
  document.querySelectorAll("#owner-tbl a.drill").forEach((a) => {
    a.onclick = (ev) => {
      /* 持ち件数の表 → 案件の表は形が変わるので本文全体を描き直す */
      ev.preventDefault(); boardFilter.consultant = a.dataset.c; boardShowAll = false; redrawMain(boardCache); refocus("#bf-consultant");
    };
  });
  pick("bf-flag", "flag");
  pick("bf-band", "band");
  pick("bf-expiry", "expiry");
  const q = document.getElementById("bf-q");
  if (q) {
    /* 1文字ごとに組み直すと重い。打ち終わってから当てる。
       🔴 検索欄は #board-body の外にあり、boardRepaint では作り直されない（段2 M-8）。前は本文全体を作り直していたので、
       新しい欄を探してフォーカスと入力位置を戻す手当てがここにあった。要素がそのまま残るので要らない */
    let t = null;
    const apply = () => {
      clearTimeout(t);
      t = setTimeout(() => {
        boardFilter.q = q.value;
        boardShowAll = false;
        redraw();
      }, 260);
    };
    /* 🔴 IME の変換中（isComposing）は当てない。変換の途中で本文を作り直すと入力欄が消えて候補の窓が閉じる。
       確定（compositionend）で当て直す（2026-09-28 UI/UX 改善 S-13。前は isComposing の判定が 0 件）。
       🔴 compositionend は addEventListener で付ける。`q.oncompositionend = …` は HTML の GlobalEventHandlers に無く
       （Chromium で 'oncompositionend' in input → false）ただの変数になって一度も呼ばれない。Chromium の IME は
       input(isComposing=true)… → compositionend で終わり、その後に isComposing=false の input は来ないので、
       確定しても絞り込みが当たらなかった（2026-09-28 CDP で実測: 確定後も 604 行のまま）。Firefox は確定後に
       input(isComposing=false) も来るが、260ms の予約が二重を1回にまとめる。
       compositionend を addEventListener で付けても二重にならないのは、wireBoard が本文全体を描いたとき
       （redrawMain・load → wire）にしか呼ばれず、そのたびに検索欄が新しい要素になるため。
       boardRepaint（絞り込み・並び替え）は wireBoardBody だけを付け直し、検索欄には触らない（段2 M-8） */
    q.oninput = (ev) => { if (ev && ev.isComposing) return; apply(); };
    q.addEventListener("compositionend", apply);
  }
  const cl = document.getElementById("bf-clear");
  /* 🔴 絞り込みを外すときは本文全体を描き直す（redrawMain）。絞り込みの欄（#board-filter）は #board-body の外にあり、
     boardRepaint では作り直されない。前は boardRepaint だけで、件数の行は「絞り込みなし」なのに
     名札・案件名の欄に前の値が残り、次に別の欄を変えると見えない条件で絞られた（2026-09-29 検証、fixture 1440px:
     名札＋案件名「株式」で 0 件 → 押すと件数の行は 604 件、#bf-flag・#bf-q は前の値のまま）。
     欄だけ値を戻す手もあるが、選択肢の件数・既定値の組み立ては boardFilterBar 1 か所に置いておく。押す頻度は低い */
  if (cl) cl.onclick = () => {
    boardFilter = { consultant: "", flag: "", expiry: "", q: "", band: "" };
    boardShowAll = false;
    redrawMain(boardCache);
  };
  wireBoardBody();   /* 表の見出しの並び替え・残りも出す（段2 M-8） */
}
let boardCache = null;

/* 同じ列を押したら向きを反転、別の列なら既定の向き（名前・残り日数は小さい順、他は大きい順） */
function nextSort(s, kk) {
  if (s.key === kk) return { key: kk, asc: !s.asc };
  return { key: kk, asc: kk === "name" || kk === "consultant" ||
                         kk === "days_left" || kk === "days_since_contact" };
}

/* ①今日動く先の3つの表の並び。表ごとに持つ（1つ並べ替えても他の表は動かさない）。

let todaySort = {

  document.querySelectorAll("#cs-main button.kpi[data-jump]").forEach((b) => {

  document.querySelectorAll("#cs-main button.kpi[data-band]").forEach((b) => {

  /* 担当の選択欄（D-1a）。選んだら端末に覚えて、手元のデータで描き直す（取り直さない）。
     欄は描き直しで作り直されるが、redrawMain が同じ id の欄へフォーカスを戻す（U9） */
  const sel = document.getElementById("td-consultant");
  if (sel) sel.onchange = () => {

  /* 今週始まった契約の畳みを開閉したら覚える（並び替え・担当の切り替えの描き直しで閉じない） */
  const ds = document.getElementById("td-started");
  if (ds) ds.ontoggle = () => { todayStartedOpen = !!ds.open; };
  fillTodayContact();   /* 担当を選んでいるときだけ、自分の接触を取りに行く（手元にあれば取らない） */
}

/* ---------------------------------------------------------------- 5 調査と定義 */
/* 🔴 調査の成果は一度読めば済む。毎朝の動線から外して、ここに畳む。消さない。 */
/* ---------------------------------------------------------------- 担当の交代 */
/* 🔴 交代が良かったか悪かったかは判定しない。記録を並べるだけ。
   🔴 「誰から誰へ」でまとめない（`from`/`to` は読めば分かる列で、
      テスト用データでは1行1人に伏せてある。まとめると処理が素通りする）。 */
/** 交代の行の状態。state_label（稼働中／決着済／取引が見つからない）をそのまま出す */
function stateTag(r) {
  const lab = r.state_label || (r.is_active ? "稼働中" : "決着済");
  if (lab === "稼働中") return '<span class="tag e">稼働中</span>';
  if (lab === "決着済") return '<span class="tag d">決着済</span>';
  return '<span class="n0">' + esc(lab) + "</span>";
}

/** 担当の交代の表の「前の担当」「次の担当」。
    🔴 2026-09-24 実機: 担当者一覧に無い人の名前（サーバの person_label）が
    「氏名が分からない担当（HubSpotの担当者一覧に無い）」と長く、その行だけ3〜4行に折れて高くなっていた。
    表では「氏名不明」と短く出し、意味は title と表の上の1文で補う（*_unresolved はサーバの判定） */
const UNRESOLVED_TITLE = "HubSpot の担当者一覧に無い担当です（元の記録にはメールアドレスしか残っていません）";
/* 🔴 2026-09-24 検証の指摘: 氏名の分からない担当が何人かいるとき、交代の表は番号なし、まとめは側ごとに
   並びの順で番号を振っていて、表どうしで同じ人か突き合わせられなかった。番号はサーバが交代の記録全体で
   1回だけ振る（routes.rs unresolved_numbers）。ここでは受け取った番号をそのまま出す。
   many = 番号を出すか（氏名不明が2人以上いるとき。1人なら番号は要らない） */
function whoCell(label, unresolved, no, many) {
  if (unresolved)
    return '<span class="n0" title="' + esc(UNRESOLVED_TITLE) + '">氏名不明' + (many && no != null ? " " + num(no) : "") + "</span>";
  return esc(label) || DASH;
}
/** 氏名不明の番号を出すか。サーバの人数（meta.n_unresolved_people）で決め、無い応答では表の中の人数で決める */
function hoManyUnresolved(D, rows) {
  const n = D && D.meta && D.meta.n_unresolved_people;
  if (n != null) return n > 1;
  return (rows || []).filter((r) => r.unresolved).length > 1;
}
/* ---------------------------------------------------------------- 交代の前後の接触
   2026-09-24 藤巻さんの要望「担当が変わったときに接触率が落ちたのか減ったのか、担当ごとに」。
   数えるのはサーバ（handover_contact.rs）。ここは並べるだけ。
   2026-09-24 藤巻さんの判断で、窓を前後60日から「それぞれの担当期間の全体（通期）」に変えた
   （前 ＝ 一つ前の交代〜交代日の前日、後 ＝ 交代日〜次の交代の前日。まだ担当中なら締め日まで）。まとめは平均と中央値。
   🔴 交代が接触を増減させた証拠ではない（06 の失敗9）。断りを図より前に出す。
   🔴 接触は検知専用。「減った＝赤・増えた＝緑」と良し悪しで塗らない。棒は1色（主系列の藍）で、
      向きは符号（＋ / −）と言葉（増えた / 減った）で書く。▲▼ は画面の決まりで「まずい / 良い」の印なので使わない */
const HO_DIR = { up: "増えた", down: "減った", same: "変わらない" };
/** 変化（後−前）。符号を必ず付ける（色で向きを伝えない） */
function hoDelta(v) {
  if (v == null) return DASH;
  return (v > 0 ? "+" : v < 0 ? "−" : "±") + num(Math.abs(v), 2);
}
const hoPer = (w) => (w && w.per30 != null ? num(w.per30, 2) : "—");
/** 比べられなかった理由（サーバの why） */
const HO_WHY = {
  gap: "同じ拠点の交代どうしの間が短い（次の交代まで、または一つ前の交代からが 30 日に届かない）",
  calls: "担当期間の多くが、通話の記録が始まる前の日",
  before: "前の担当期間に、同じ拠点で動いていた案件が短い（初めての契約の直後など）",
  after: "後の担当期間に、同じ拠点で動いていた案件が短い（満了・解約など）",
  overlap: "同じ拠点で本体案件が重なる日が多い（付け先を決められず、その日を外した）",
};
/** 担当期間（数えた最初の日〜最後の日） */
const hoSpan = (w) => (w && w.start ? w.start + "〜" + w.end : "数えた日なし");
const HO_ONGOING = "後の担当はまだ担当中（締め日までの通期）";
/** 図の注記に付ける担当中の短い印（全文 HO_ONGOING は棒の説明と凡例に出す） */
const HO_ONGOING_SHORT = "後は担当中";
/** 交代の表の「接触の前後」のます */
function hoCmpCell(c) {
  if (!c) return '<span class="n0" title="取引・契約期間・交代日のどれかが読めず、数えていません">数えていない</span>';
  const days = ' <span class="muted small" title="' + esc("前 " + hoSpan(c.before) + " / 後 " + hoSpan(c.after)) + '">前 ' +
    num(c.before.days) + "日 / 後 " + num(c.after.days) + "日</span>";
  const vals = hoPer(c.before) + " → " + hoPer(c.after) + days;
  /* 後の担当がまだ担当中（通期なので締め日までで比べている） */
  const now = c.ongoing ? ' <span class="tag" title="' + esc(HO_ONGOING) + '">担当中</span>' : "";
  if (c.status === "ok") return vals + " " + esc(HO_DIR[c.dir] || "") + " " + hoDelta(c.change) + now;
  if (c.status === "provisional")
    return vals + ' <span class="tag d" title="後の担当はまだ担当中で、後の担当期間がまだ 30 日に届いていません（締め日まで）">途中</span>';
  return vals + ' <span class="tag" title="' + esc(HO_WHY[c.why] || "") + '">短い</span>';
}
/** 担当者のまとめの名前。氏名の分からない担当が何人かいるときは番号で分ける（交代の表と同じ番号） */
function hoWho(r, many) {
  return whoCell(r.label, r.unresolved, r.unresolved_no, many);
}
/** 担当者のまとめ（引き継いだ側 / 引き継がれた側）。表＋横棒（母数が足りる人だけ）。
    many = 氏名不明を番号で分けるか（hoManyUnresolved。両側と交代の表で同じ判断にする） */
function hoPeople(title, rows, minN, many) {
  if (many == null) many = rows.filter((r) => r.unresolved).length > 1;
  const who = (r) => (r.unresolved ? "氏名不明" + (many && r.unresolved_no != null ? " " + r.unresolved_no : "") : r.label || "");
  const big = rows.filter((r) => !r.small && r.median_change != null);
  let h = sec("図", title + "（変化の中央値）");
  h += fig(title + "ごとの変化の中央値", "比べられた交代が " + num(minN) + " 件以上の人だけ",
    big.length
      ? svgBarH({ w: 680, fmt: F.d1, rh: 24, diverging: true, xLab: "変化（後−前、30日あたりの接触）",
          alt: title + "ごとの変化の中央値",
          rows: big.map((r) => ({ label: who(r), full: who(r), v: r.median_change,
            txt: hoDelta(r.median_change),
            note: "減った " + r.n_down + " / 増えた " + r.n_up + " / 変わらない " + r.n_same + "（" + r.n_ok + "件）",
            color: C.ai })) })
      : '<div class="empty">比べられた交代が ' + num(minN) + " 件以上ある人がいません。下の表には全員を出しています。</div>",
    lg("box", C.ai, "1人（棒の長さ＝変化の中央値。右が増えた・左が減った）", BAR_OP) +
    '<i class="full">色で良し悪しを付けていません。向きは符号（＋ / −）で書いています。平均は下の表にあります。</i>');
  h += scroll(table(
    [{ t: "担当", w: "s" }, { t: "比べられた交代", n: 1 }, { t: "減った", n: 1 }, { t: "増えた", n: 1 },
     { t: "変わらない", n: 1 }, { t: "変化の平均（30日あたり）", n: 1 }, { t: "変化の中央値（30日あたり）", n: 1 },
     { t: "外した交代（短い / 途中）", n: 1 }],
    rows.map((r) => [
      hoWho(r, many) + (r.small ? ' <span class="tag" title="比べられた交代が ' + esc(String(minN)) + ' 件未満です。たまたまで大きく振れるので図には出していません">少</span>' : ""),
      num(r.n_ok) + ' <span class="muted small">/ ' + num(r.n_events) + "件</span>",
      num(r.n_down), num(r.n_up), num(r.n_same),
      r.mean_change == null ? DASH : hoDelta(r.mean_change),
      r.median_change == null ? DASH : hoDelta(r.median_change),
      num(r.n_short) + " / " + num(r.n_provisional),
    ])), 420);
  return h;
}
function renderHandoverContact(D) {
  const X = D.contact_cmp;
  if (!X) return "";
  const M = X.meta || {};
  const minN = M.min_person_n || 5;
  let h = sec("問い", "交代の前後で、接触は増えたか減ったか") +

    " 日あたりに直して比べています。前は同じ拠点の一つ前の交代から交代日の前日まで、後は交代日から次の交代の前日まで" +
    "（次の交代が無く、後の担当がまだ担当中なら " + esc(M.last_day || "") + " まで）。<b>同じ拠点・同じ交代日の行は1件の交代</b>と数えています。</div>";
  /* 🔴 図より前に断る（交代が接触を増減させた証拠ではない・向きは決まらない） */
  h += note("warn", "交代の効果ではありません", esc(X.not_causal));
  const sw = X.short_why || {};
  h += '<div class="kpis">' +
    kpi("比べられた交代", num(X.n_ok) + '<span class="u">件</span>',
        "交代 " + num(X.n_events) + " 件のうち。比べるには短い " + num(X.n_short) + " 件・途中 " + num(X.n_provisional) + " 件は外しています" +
        (X.n_ongoing ? "。うち " + num(X.n_ongoing) + " 件は" + HO_ONGOING : "")) +
    kpi("減った / 増えた", num(X.n_down) + " / " + num(X.n_up) + '<span class="u">件</span>',
        "変わらない " + num(X.n_same) + " 件（比べられた " + num(X.n_ok) + " 件のうち）") +
    kpi("変化の平均 / 中央値", hoDelta(X.mean_change) + " / " + hoDelta(X.median_change) + '<span class="u">回</span>',
        "後−前、" + num(M.per_days) + "日あたり（比べられた " + num(X.n_ok) + " 件で。最頻値は出していません）") +
    "</div>";

  /* ---- 交代ごと（比べられたものだけ）。同じ交代の行は1本にする ---- */
  const seen = new Set();

  h += sec("図", "交代ごとの変化（比べられた " + num(evs.length) + " 件）");
  h += fig("交代ごとの接触の変化", "後の担当期間 − 前の担当期間（" + num(M.per_days) + "日あたり）。新しい順",
    evs.length
      ? svgBarH({ w: 680, fmt: F.d1, rh: 24, diverging: true, xLab: "変化（後−前、30日あたりの接触）",
          alt: "交代ごとの接触の変化",
          rows: evs.map((e) => ({
            label: (e.r.date || "") + " " + shortName(e.r.name || "", 12),
            full: (e.r.date || "") + " " + (e.r.name || ""), v: e.c.change,
            txt: hoDelta(e.c.change) + " " + (HO_DIR[e.c.dir] || ""),
            /* 🔴 2026-09-25 本番実測: 注記に期間（開始〜終了）と担当中の断りまで入れると長すぎ、SVG の右端から
               はみ出して日付の終わりが切れていた。注記は「前 → 後（日数 / 日数）」と担当中の短い印だけにし、

        '<span class="via">要約: ' + esc(s.model || "") + (s.generated_at ? "（" + esc(s.generated_at) + " 作成）" : "") +
        "。話された内容の要約で、評価ではありません</span>";
    } else {
      what += '<span class="via"><span class="tag d">要約なし</span></span>';
    }
  } else if (e.kind === "handover") {
    what = '<span class="mark">交代</span><span class="muted small">' + esc(e.source_label) + "</span>" +
      '<span class="via">' + (esc(e.from) || "（不明）") + " &#8594; " + (esc(e.to) || "（不明）") +
      (e.to_retired ? ' <span class="tag" style="color:var(--hi)">退職者</span>' : "") +
      (e.reflected ? "　HubSpot への反映: " + esc(e.reflected) : "") +
      (e.record_gap_days != null ? "（担当欄の書き換えとのずれ " + num(e.record_gap_days) + "日）" : "") +
      "</span>";
  }
  return '<li class="' + cls + '"><div class="when">' + when + '</div><div class="what">' +
    what + attachNote(e.attach, e) + "</div></li>";
}

  const d = D.deal, c = D.counts, ch = D.chain;

  /* ---- 契約の連なり ---- */

      (ch.prev || ch.next ? "（" + (ch.prev ? "前の契約あり" : "前の契約なし") + "・" +
        (ch.next ? "次の契約あり" : "次の契約なし") + "）" : "") + "。</div>";
    h += scroll(table([{ t: "案件", w: "l" }, { t: "ステージ", w: "s" }, { t: "開始〜満了" },
                       { t: "継続", n: 1 }, { t: "金額", n: 1 }, { t: "状態" }],
      rows.map((r) => [r.current ? "<b>" + esc(r.name) + '</b> <span class="tag e">いま見ている</span>'
          : dealLink(r.deal_id, r.name),
        '<span class="muted small">' + esc(r.stage) + "</span>",
        (esc(r.start) || DASH) + "<br>〜" + (esc(r.expiration) || DASH),
        nz(r.renewal_no), yen(r.amount), r.is_active ? '<span class="tag e">稼働中</span>' : ""])), 320);
  } else if (ch && !ch.has_site) {

      (D.meta.summary_sheet === "missing"

          "（まだ作られていないか、一時的に読めません。「読み直す」で取り直します）"

  const filtered = shown.length < all.length;
  h += '<div class="count-line' + (filtered ? " on" : "") + '" id="dd-count"><b>' + num(all.length) + " 件中 " +
    num(shown.length) + " 件</b>を表示" + (filtered ? "（絞り込み中）" : "（全部出しています）") +
    '<span class="muted">　MTG 録画 ' + num(c.mtg) + " 件（抽出済み " + num(c.mtg_extracted) +
    (c.mtg_link_not_high ? "・結び付けの確度が中 " + num(c.mtg_link_not_high) : "") + "）／ MTG 推定 " +
    num(c.mail_mtg) + " 件（うち契約期間の外 " + num(c.mail_outside || 0) + "）／ 電話 " + num(c.call) +
    " 件（60秒超 " + num(c.call_contact) + "・要約あり " +
    num(c.call_summarized) + "）／ 交代 " + num(c.handover) + " 件</span></div>";
  h += '<div class="legend"><i>&#9679; 事実（録画・通話記録・交代の記録）</i>' +
    "<i>&#9671; 推定（メール由来の MTG。印の枠は破線）</i></div>";
  h += shown.length ? '<ol class="tl" id="dd-tl">' + shown.map(detailItem).join("") + "</ol>"
    : '<div class="empty">この条件で出せる出来事はありません。' +
      (all.length ? "上の絞り込みを変えると出ます。" : "この案件には MTG・電話・交代の記録がありません。") + "</div>";
  /* 付け直して来たもの・契約期間の外のもの（種類ごと）。元は継続の取引とは限らない（オプション契約・前の契約もある） */
  const mv = [["電話", c.call_moved_in, c.call_outside], ["録画 MTG", c.mtg_moved_in, c.mtg_outside],
    ["MTG 推定", c.mail_moved_in, c.mail_outside]].filter((x) => x[1] || x[2]);
  if (mv.length) {
    h += '<div class="lede">' + mv.map((x) => esc(x[0]) + "は " + num(x[1] || 0) + " 件が同じ拠点の別の取引から付け直したもの、" +
      num(x[2] || 0) + " 件がこの取引に付いているが契約期間の外のもの").join("。") +
      "です（行ごとに印を付けています）。</div>";

  if (nh.length) {
    h += '<div class="lede">メール由来のうち、実施ではないもの（' +
      nh.map((x) => esc(x.kind) + " " + num(x.n) + " 件").join("・") + "）は並べていません。</div>";
  }

  const R = D.rules || {};
  h += note("def", "並べ方の決まり", [R.fact, R.link, R.attach, R.contact, R.summary, R.extracted, R.handler, R.handover]
    .filter(Boolean).map(esc).join("<br>"));
  return h + foot(D.meta, true, "");
}

function wireDetail() {

  };

  if (qi) qi.onkeydown = (ev) => { if (ev && ev.key === "Enter" && !ev.isComposing) run(); };
  const b = document.getElementById("dd-go");
  if (b) b.onclick = run;
  DETAIL_KINDS.forEach((k) => {
    const cb = document.getElementById("dd-k-" + k.k);

  const ca = document.getElementById("dd-c-all");

  const cc = document.getElementById("dd-c-contact");
  if (cc) cc.onclick = () => { detailAllCalls = false; redrawMain(lastPayload); };
}
