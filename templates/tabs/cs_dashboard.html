         `<rect x="${padL}" y="${y + 6}" width="${bw.toFixed(1)}" height="${rh - 16}" rx="3" style="fill:${col}" opacity=".8"><title>${esc(s.label)}: ${F.int(s.v)}</title></rect>` +
         `<text class="vl" x="${(padL + bw + 7).toFixed(1)}" y="${y + 21}">${F.int(s.v)}</text>`;
    if (i) {
      /* 🔴 前段比は**両方の値がある取引だけ**で割る（s.pair = {num, den, n}）。
         棒の合計どうしで割ると、応募だけ入っていて面接が空の取引が分母にだけ乗り、
         逆に面接だけ入っている取引は分子にだけ乗る。取引の集合が揃わないので
         100% を超えることがある。pair が無い呼び出しだけ、前の段の合計で割る。 */
      const pr = s.pair;
      const den = pr ? pr.den : st[i - 1].v, nu = pr ? pr.num : s.v;
      // 🔴 分母0のときは率を書かない
      const txt = den ? (nu / den * 100).toFixed(1) + "%" : "—";
      const why = pr ? `両方の値がある ${pr.n} 件で ${F.int(nu)} ÷ ${F.int(den)}` : "";
      g += `<text class="ax" x="${(padL + bw + valW + 4).toFixed(1)}" y="${y + 21}" style="fill:${den ? "var(--ink-2)" : "var(--ghost)"}">前段の ${txt}${why ? `<title>${esc(why)}</title>` : ""}</text>`;
    }
  });
  return svgHead(w, h, o.alt || "ファネル") + `${g}</svg>`;
}

/* ------------------------------------------------------------ 積み上げ縦棒 */
/** 合計と、その内訳（拠点ごと）を同時に見せる。
    🔴 拠点をまたいで足した値を**1本の線でつながない**ための道具。線にすると
       拠点間のばらつきが「時間の変化」に見える（規律: 事業所をまたいで1本にしない）。
       柱ごとに拠点の色で積むので、合計が動いたときにどの拠点のぶんかが見える。
    🔴 carry（その月に書き換えが無く前の値を引き継いだ）の区間は中空・破線。
    🔴 その月に値が1つも無い柱は 0 の柱にせず、無いと分かる印だけ置く。 */
function svgColStack(o) {
  const n = (o.x || []).length;
  const ser = o.series || [];
  const tot = o.x.map((_, i) => ser.reduce((s, S) => {
    const p = S.vals[i]; return p && p.v != null ? (s == null ? 0 : s) + p.v : s; }, null));
  const vs = tot.filter((v) => v != null);
  if (!n || !vs.length) return `<div class="empty">この図に出せる値がありません（値が無いものは 0 として描きません）。</div>`;
  const w = o.w || 660, h = o.h || 230;
  /* 軸の題名がある図は上を空ける（svgLine と同じ。「採用数（累計）」と最上段の目盛りが重なっていた） */
  const pad = { l: 58, r: 16, t: o.yLab ? 30 : 18, b: 34 };
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const fmt = o.yFmt || F.int;
  /* 最小の刻みは他の図と同じく minStepOf で渡す。渡さないと採用数 0〜2 の軸が
     刻み 0.5 になり、整数に丸めて「0,1,1,2,2」と重複していた（V10 の残り） */
  const tk = ticks(0, Math.max(...vs), 4, minStepOf(fmt));
  const hi = Math.max(Math.max(...vs), tk[tk.length - 1]) || 1;
  const slot = iw / n, bw = Math.max(3, Math.min(34, slot * 0.64));
  const X = (i) => pad.l + slot * (i + 0.5);
  const Y = (v) => pad.t + ih - ih * v / hi;
  let g = "";
  tk.forEach((t) => {
    g += `<line class="gridline" x1="${pad.l}" y1="${Y(t).toFixed(1)}" x2="${w - pad.r}" y2="${Y(t).toFixed(1)}"/>` +
         `<text class="ax" x="${pad.l - 7}" y="${(Y(t) + 3.5).toFixed(1)}" text-anchor="end">${esc(fmt(t))}</text>`;
  });
  g += `<line class="axisline" x1="${pad.l}" y1="${pad.t + ih}" x2="${w - pad.r}" y2="${pad.t + ih}"/>`;
  const every = Math.ceil(n / Math.max(1, Math.floor(iw / 50)));
  const xOn = xPick(n, every, X, [o.x]);   // LTV の「26-07」「26-09」がくっついていた
  o.x.forEach((lab, i) => {
    if (!xOn[i]) return;
    g += `<text class="axl" x="${X(i).toFixed(1)}" y="${pad.t + ih + 15}" text-anchor="middle">${esc(lab)}</text>`;
  });
  if (o.yLab) g += `<text class="ax" x="2" y="${pad.t - 16}">${esc(o.yLab)}</text>`;
  o.x.forEach((lab, i) => {
    if (tot[i] == null) {
      g += `<line x1="${(X(i) - 4).toFixed(1)}" y1="${(pad.t + ih - 3).toFixed(1)}" x2="${(X(i) + 4).toFixed(1)}" y2="${(pad.t + ih - 3).toFixed(1)}" style="stroke:var(--ghost)" stroke-width="2"><title>${esc(lab)}: 値が無い（0 ではない）</title></line>`;
      return;
    }
    let acc = 0;
    ser.forEach((S) => {
      const p = S.vals[i];
      if (!p || p.v == null || p.v <= 0) return;
      const y0 = Y(acc), y1 = Y(acc + p.v);
      const t = `<title>${esc(lab)} ${esc(S.label)}: ${esc(fmt(p.v))}${p.carry ? " / 引き継ぎ（この月は書き換えなし）" : ""}</title>`;
      g += p.carry
        ? `<rect x="${(X(i) - bw / 2 + 0.7).toFixed(1)}" y="${y1.toFixed(1)}" width="${(bw - 1.4).toFixed(1)}" height="${Math.max(1, y0 - y1).toFixed(1)}" style="fill:var(--panel);stroke:${S.color}" stroke-width="1.4" stroke-dasharray="3 2">${t}</rect>`
        : `<rect x="${(X(i) - bw / 2).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, y0 - y1).toFixed(1)}" style="fill:${S.color}" opacity=".85">${t}</rect>`;
      acc += p.v;
    });
    if (n <= 16)
      g += `<text class="vl" x="${X(i).toFixed(1)}" y="${(Y(tot[i]) - 5).toFixed(1)}" text-anchor="middle">${esc(fmt(tot[i]))}</text>`;
  });
  return svgHead(w, h, o.alt || "積み上げ縦棒") + `${g}</svg>`;
}

function cpaLine(st, w, h) {
  const pts = st.pts;
  return svgLine({
    w: w || 700, h: h || 240, labelPts: pts.length <= 10,
    x: pts.map(p => (p.no === 0 ? "初回" : "継続" + p.no)),
    xSub: pts.map(p => (p.d || "").slice(0, 7)),
    series: [{ color: C.hi, pts: pts.map(p =>
      ({ v: p.v, censored: p.cen, note: "採用" + num(p.syo) + "名" })) }],
    yFmt: F.man, yLab: "万円/人",
    censorFrom: pts.findIndex(p => p.cen) >= 0 ? pts.findIndex(p => p.cen) : null,
    alt: st.name + " の採用単価の推移",
  });
}
/* MTG の抽出カバレッジ。画面のあちこちで使うので1回だけ数える。
   🔴 _src は「実データ」/「未抽出」の2値。ダミーは入っていない。 */

function monthsBetween(a, b) {
  if (!a || !b) return 0;
  const x = String(a).slice(0, 10).split("-"), y = String(b).slice(0, 10).split("-");
  return Math.max(0, (+y[0] - +x[0]) * 12 + (+y[1] - +x[1]));
}

/** 履歴（[日付, 値] の配列）を「契約の N ヶ月目」に畳む。
    🔴 10倍以上の落差は下がる前の値を捨てる（桁の打ち間違いの訂正）。
    🔴 その月の最後の書き換え値を採る。同じ月に何度書き換えても1点。
    ③の推移と、系列を縦に積む図の両方がこれを使う（畳み方を2つ作らない）。 */
function foldMonthly(series, startDate, lastM) {
  const byKey = {}; let fixed = 0; const wMonths = new Set();
  Object.keys(series || {}).forEach(k => {
    const raw = series[k] || [];
    if (!raw.length) return;
    const pts = raw.slice();
    for (let i = pts.length - 1; i >= 1; i--) {
      const a = pts[i - 1][1], b = pts[i][1];
      const big = (b <= 0) ? a >= 10 : (a / b) >= 10;
      if (b < a && big) { pts.splice(i - 1, 1); fixed++; }
    }
    const m = new Map();
    pts.forEach(([t, v]) => {
      const mi = monthsBetween(startDate, t) + 1;
      if (mi >= 1 && mi <= lastM) m.set(mi, v);
    });
    if (m.size) { byKey[k] = m; m.forEach((_, mi) => wMonths.add(mi)); }
  });
  return { byKey, fixed, written: wMonths.size };
}

/* ================================================================
   ここから下は本番用。モックは payload を埋め込んでいるが、こちらは
   タブを開いたときに API から取る。**図の道具は上のものをそのまま使う**。
   ================================================================ */

/* 値が無いときの印。0 と混ぜない */
const DASH = '<span class="n0">&#8212;</span>';
const pct1 = (v, d) => v == null ? DASH : Number(v).toFixed(d === undefined ? 1 : d) + "%";
const yen = (v) => v == null ? DASH : man(v);
const nz = (v, d) => v == null ? DASH : num(v, d || 0);

function kpi(label, big, fine, kind) {
  return '<div class="kpi' + (kind ? " is-" + kind : "") + '">' +
    '<span class="lbl">' + esc(label) + "</span>" +
    '<span class="big">' + big + "</span>" +
    (fine ? '<span class="fine">' + fine + "</span>" : "") + "</div>";
}
function sec(no, title) {
  return '<h2 class="sec mincho"><span class="no">' + esc(no) + "</span>" + esc(title) + "</h2>";
}
function note(kind, head, body) {
  return '<div class="note ' + kind + '"><span class="hd">' + esc(head) + "</span><p>" +
    body + "</p></div>";
}
/* 表は最後の手段。個別の行を特定したいときだけ使う */
function table(cols, rows, cls) {
  let h = '<table' + (cls ? ' class="' + cls + '"' : "") + "><thead><tr>";
  for (const c of cols) h += '<th' + (c.n ? ' class="n"' : "") + ">" + esc(c.t || c) + "</th>";
  h += "</tr></thead><tbody>";
  for (const r of rows) {
    h += "<tr>";
    r.forEach((v, i) => { h += '<td' + (cols[i] && cols[i].n ? ' class="n"' : "") + ">" + v + "</td>"; });
    h += "</tr>";
  }
  return h + "</tbody></table>";
}
/* 並び替えできる見出し。
   🔴 押せるものは button にする。th の onclick だけだと**キーボードで一切さわれない**
      （2026-09-22 の実測で tabIndex -1・focus 不可だった）。
   🔴 矢印（▲▼↕）は色ではなく**形**で向きを示している。
      いま並んでいる列には aria-sort も付けるので、読み上げでも向きが分かる。 */
function sortTh(c, key, asc) {
  const on = c.k === key;
  const arrow = on
    ? (asc ? ' <span aria-hidden="true">&#9650;</span>' : ' <span aria-hidden="true">&#9660;</span>')
    : '<span class="n0" aria-hidden="true"> &#8597;</span>';
  const say = on
    ? "（いまこの列で" + (asc ? "小さい順" : "大きい順") + "。押すと逆になります）"
    : "（押すとこの列で並び替わります）";
  return '<th class="' + (c.n ? "n " : "") + 'sortable"' +
    (on ? ' aria-sort="' + (asc ? "ascending" : "descending") + '"' : "") + ">" +
    '<button type="button" class="sort" data-k="' + c.k + '">' +
    esc(c.t) + arrow + '<span class="sr">' + esc(say) + "</span>" +
    "</button></th>";
}

/* 表を枠に入れる。
   🔴 枠の上に「全 N 行 × M 列・枠の中でスクロール」を必ず出す（V12）。
   2026-09-23 実測: 枠は縦 624px で、「案件そのもの」は表の幅 2,944px ÷ 枠 1,119px。
   残りがあることを示すものが無く、右端の列が切れて見えていた。
   行と列は渡された HTML から数える（本文の行だけ。見出しは数えない）。
   total: 表に出す前に切った元の件数。
   🔴 数えられるのは画面に出した行だけなので、200 件で切った表にも「全 200 行」と出て、
   切った後の件数が全件のように読めていた（V12 検証。NPS低・法人の一覧・今日動く先は
   n_hit 件から 24 件だけ）。切っている表は total を渡し、「N 行を出しています（全 T 件のうち）」にする。 */
function scroll(inner, max, total) {
  return scrollCap(inner, total) +
    '<div class="scroll"' + (max ? ' style="max-height:' + max + 'px"' : "") + ">" + inner + "</div>";
}
function scrollCap(inner, total) {
  const s = String(inner);
  const body = s.split("<tbody>").slice(1).join("");
  const rows = (body.match(/<tr[\s>]/g) || []).length;
  const head = (s.split("</thead>")[0] || "");
  const cols = (head.match(/<th[\s>]/g) || []).length;
  /* 表が1つでない（details の中に表が並ぶ等）ときは件数を言わず、スクロールだけ伝える */
  const one = (s.match(/<table[\s>]/g) || []).length === 1;
  const cut = one && total != null && total > rows;
  return '<div class="scroll-cap">' +
    (cut ? "<b>" + num(rows) + "</b> 行を出しています（全 " + num(total) + " 件のうち）× " +
           num(cols) + " 列。"
     : one ? "全 <b>" + num(rows) + "</b> 行 × " + num(cols) + " 列。" : "") +
    "入り切らない分は枠の中で縦・横にスクロールします（見出しは上に残ります）。</div>";
}
/* n が小さい図は出さない。出さない理由は図の直下に書く */
const MIN_N = 30;
function tooFew(n, what) {
  return '<div class="empty">' + esc(what) + 'は n=' + num(n) + ' で、図にするには足りません（' +
    MIN_N + '件未満）。件数だけ出しています。</div>';
}
/* 図から n<30 で外した群を、件数と理由つきで書く。🔴 黙って落とさない（V6）。
   外した群が無ければ空文字。凡例（figlegend）の中に置く前提で <i class="full"> を返す */
function droppedNote(rows, nOf, labelOf) {
  const out = rows.filter((r) => nOf(r) < MIN_N);
  if (!out.length) return "";
  return '<i class="full"><b>n が ' + MIN_N + " 件未満の " + num(out.length) +
    " 群を図から外しています</b>（" +
    out.map((r) => esc(labelOf(r)) + " n=" + num(nOf(r))).join(" / ") +
    "）。少ない件数の率は、たまたまでも大きく振れるためです。</i>";
}


/* ================================================================ 1 コンサルタント一覧

   🔴 毎朝これを見て、**手が回っていない場所**を探す画面。
      担当者の評価ではない。
   🔴 接触「数」ではなく接触「率」で見る。件数だと持ち案件が多い人ほど
      大きく出て、手が回っているかが分からなくなる。
   🔴 ここは一覧そのものが目的なので、表が正しい形。
   ================================================================ */
let teamSort = { key: "contact_rate", asc: true };

/** 接触率の帯。表・図・KPI で同じ切り方を使う */
const contactKind = (v) => (v == null ? "" : v < 40 ? "bad" : v < 70 ? "warn" : "");
/** KPI「接触率がいちばん低い」の候補選び。
    母数が小さい（small_n）人は図に載せていないので、ここでも候補にしない。
    返り値 skipped は外した人数（率が出ている人のうち）。 */
function pickWorstContact(rows) {
  const has = (rows || []).filter((r) => r.contact_rate != null);
  const ok = has.filter((r) => !r.small_n)
    .sort((a, b) => a.contact_rate - b.contact_rate);
  return { worst: ok[0] || null, skipped: has.length - ok.length };
}

const TEAM_COLS = [
  /* 🔴 名前を押すと③へ飛んで、その担当の案件だけに絞る */
  { k: "consultant",     t: "担当者",        n: 0, fmt: (r) =>
      '<a href="#" class="drill" data-c="' + esc(r.consultant) +
      '" title="この担当の案件だけを「案件の立ち位置」で見る">' +
      (esc(r.consultant) || DASH) + "</a>" +
      (r.retired ? ' <span class="tag" style="color:var(--hi)">退職者のまま</span>' : "") +
      /* 🔴 図から外した人が表では見えるので、その理由が分かる印を添える */
      (r.small_n ? ' <span class="tag" title="分母が小さいので上の図からは外しています">母数が小さい</span>' : "") },
  { k: "n_active",       t: "持ち案件",      n: 1, fmt: (r) => num(r.n_active) },
  { k: "contact_rate",   t: "接触率",        n: 1,
    fmt: (r) => (r.contact_rate == null
        ? DASH
        : '<b style="color:' + (r.contact_rate < 40 ? "var(--hi)" :
             r.contact_rate < 70 ? "var(--ki)" : "var(--midori)") + '">' +
          pct1(r.contact_rate) + "</b>") +
      ' <span class="muted small">' + num(r.contact_touched) + "/" +
      num(r.contact_months) + " か月</span>" },
  { k: "atv_max",        t: "ATV 最大",      n: 1, fmt: (r) => yen(r.atv_max) },
  { k: "focus",          t: "注力案件",      n: 1, fmt: (r) => num(r.focus) },
  { k: "expiring",       t: "満了60日以内",  n: 1,
    fmt: (r) => r.expiring ? '<b style="color:var(--ki)">' + num(r.expiring) + "</b>" : num(r.expiring) },
  { k: "nps_low",        t: "NPS4以下",      n: 1,
    fmt: (r) => r.nps_low ? '<b style="color:var(--hi)">' + num(r.nps_low) + "</b>" : num(r.nps_low) },
  { k: "no_contact",     t: "接触の記録なし", n: 1,
    fmt: (r) => r.no_contact ? '<span class="n0">' + num(r.no_contact) + "</span>" : num(r.no_contact) },
];

function renderTeam(D) {
  const rows = D.rows.slice();
  const k = teamSort.key, asc = teamSort.asc;
  rows.sort((a, b) => {
    const x = a[k], y = b[k];
    // 🔴 値が無いものは常に末尾。0 として並べない
    if (x == null && y == null) return 0;
    if (x == null) return 1;
    if (y == null) return -1;
    const c = typeof x === "string" ? x.localeCompare(y, "ja") : x - y;
    return asc ? c : -c;
  });

  let h = sec("問い", "いま、どこに手が回っていないか") +
    '<div class="lede">1行1担当者。<b>列の見出しを押すと並び替わります。</b>' +
    "既定は<b>接触率の低い順</b>（手が回っていない人が上）。" +
    "<b>担当者名を押すと</b>、左の「担当者ごとの案件」がその人だけに絞られます。</div>";

  h += note("info", "これは担当者の評価ではありません",
    esc(D.meta.not_counted).replace("※ ", "") + "<br>" +
    "<b>接触率で見ています。件数では見ていません。</b>" + esc(D.contact_rule));

  /* 🔴 「いちばん低い」は**図と同じ母数の人から**選ぶ（V2）。
     2026-09-23 実測: 母数が小さいとして図から外した人（0.0%・0/11か月）を拾い、
     赤の大きな文字で個人名を出していた。図では「分母が小さいので載せない」と
     言っているのに、KPI では最下位として名指しする、という食い違い。
     外した人数は KPI の下に書く（黙って落とさない）。 */
  const worstPick = pickWorstContact(rows);
  const worst = worstPick.worst;
  const focusTop = D.rows.slice().sort((a, b) => b.focus - a.focus)[0];
  h += '<div class="kpis">' +
    kpi("担当者", num(D.meta.n_consultant) + '<span class="u">名</span>',
        /* 🔴 上の数字と下の表の合計が合うように、外した分をここに書く。
           「稼働中604件」と言いながら表が593件しかない、という見え方を作らない */
        "稼働中 " + num(D.meta.n_active) + " 件（オプション契約を除く）" +
        (D.meta.unknown_owner ? "　うち担当が取れない " + num(D.meta.unknown_owner) +
          " 件は下の表に出していません" : "")) +
    kpi("接触率がいちばん低い", worst ? esc(worst.consultant) : DASH,
        (worst ? pct1(worst.contact_rate) + "（" + num(worst.contact_touched) + "/" +
                 num(worst.contact_months) + " か月）" : "") +
        (worstPick.skipped
          ? "<br>母数が小さい " + num(worstPick.skipped) + " 名は候補から外しています（下の図と同じ扱い）"
          : ""),
        /* 色は表・図と同じ帯で付ける（40%未満=赤 / 70%未満=山吹）。最下位だから赤、にはしない */
        worst ? contactKind(worst.contact_rate) : "") +
    kpi("注力案件をいちばん持っている", focusTop ? esc(focusTop.consultant) : DASH,
        focusTop ? num(focusTop.focus) + " 件" : "") +
    kpi("退職者のまま", num(D.meta.retired_deals) + '<span class="u">件</span>',
        "担当 " + num(D.meta.retired_people) + " 名 ／ 同じ日に複数行あって担当が割れる取引 " +
        num(D.meta.owner_ties) + " 件", D.meta.retired_deals ? "warn" : "") +
    "</div>";

  /* ---- 接触率の横棒（低い順）---- */
  h += sec("図", "接触率（低い順）");
  /* 🔴 図からは母数の小さい担当者を外す。表には残す。扱いを変える理由は下に書く */
  const all = rows.filter((r) => r.contact_rate != null);
  const bar = all.filter((r) => !r.small_n)
    .slice().sort((a, b) => a.contact_rate - b.contact_rate);
  const dropped = all.filter((r) => r.small_n);
  h += fig("接触があった月 ÷（案件 × 経過月）",
    "棒の右は「接触した月 / 経過月」。持ち案件数は注記",
    bar.length
      ? svgBarH({ w: 720, fmt: F.pp, rh: 24,
          rows: bar.map((r) => ({
            label: shortName(r.consultant, 14), v: r.contact_rate,
            txt: pct1(r.contact_rate),
            note: num(r.contact_touched) + "/" + num(r.contact_months) +
                  " か月　案件" + num(r.n_active),
            color: r.contact_rate < 40 ? C.hi : r.contact_rate < 70 ? C.ki : C.midori })) })
      : '<div class="empty">接触率を出せる担当者がいません。</div>',
    lg("box", C.hi, "40%未満") + lg("box", C.ki, "40〜70%") + lg("box", C.midori, "70%以上") +
    '<i class="full">棒の右に率そのものを書いているので、' +
    "<b>色が見分けられなくても帯は読めます。</b></i>" +
    '<i class="full"><b>件数ではなく率で見ています。</b>' +
    "件数だと持ち案件が多い人ほど大きく出て、手が回っているかが分かりません。" +
    "帯の切り方（40% / 70%）は機械が決めたものです。" +
    "<b>どこから要注意とするかは取り決め</b>で、事実ではありません。</i>" +
    (dropped.length
      ? '<i class="full"><b>この図から ' + num(dropped.length) +
        " 名を外しています</b>（" +
        dropped.map((r) => esc(r.consultant) + " " + num(r.contact_months) + "か月").join(" / ") +
        "）。" + esc(D.small_n_rule || "") + "</i>"
      : ""));

  /* ---- 一覧（本題）---- */
  h += sec("表", "コンサルタント一覧");
  /* 列が増えたときにページ全体が流れないよう、③と同じく枠の中で収める */
  let t = '<table id="team-tbl"><thead><tr>';
  for (const c of TEAM_COLS) t += sortTh(c, k, asc);
  t += "</tr></thead><tbody>";
  for (const r of rows) {
    t += "<tr>";
    for (const c of TEAM_COLS) t += '<td' + (c.n ? ' class="n"' : "") + ">" + c.fmt(r) + "</td>";
    t += "</tr>";
  }
  t += "</tbody></table>";
  h += scroll(t, 680);

  h += note("def", "この一覧の決まりごと",
    esc(dispText(D.owner_rule)) + "<br>" + esc(D.focus_rule) +
    (D.meta.unknown_owner ? "<br>担当が取れない取引が " + num(D.meta.unknown_owner) +
      " 件あります。<b>「その他」に混ぜていません</b>（件数だけ出しています）。" : ""));
  return h + foot(D.meta, true);   /* not_counted は頭の枠で出している */
}

/* 見出しを押したら並び替える。同じ列を押したら向きが反転する */
function wireTeam() {
  document.querySelectorAll("#team-tbl a.drill").forEach((a) => {
    a.onclick = (ev) => { ev.preventDefault(); drillToBoard(a.dataset.c); };
  });
  document.querySelectorAll("#team-tbl th.sortable button.sort").forEach((th) => {
    th.onclick = () => {
      const kk = th.dataset.k;
      if (teamSort.key === kk) teamSort.asc = !teamSort.asc;
      else teamSort = { key: kk, asc: kk === "consultant" || kk === "contact_rate" };
      redrawMain(teamCache);
    };
  });
}
let teamCache = null;

  /* ---- 図 MTG の記録（事実と推定） ---- */

  /* ---- 図 顧客ぜんたいの形 ---- */
  h += sec("図", "顧客ぜんたいの形");

/* 画面の末尾。said=true は「数えていないもの」を画面の頭で既に書いた画面。
   🔴 2026-09-23 目視: 成果とリスク・立ち上がり等で、頭の枠と末尾の枠に
   **同じ文が2回**出ていた。データ品質では not_counted が無く、見出しだけで
   本文が空の枠になっていた（V21）。書くものが無い見出しは出さない。 */
/** 頭の「決まりごと」の枠に出す、サーバの not_counted（※ は落とす）。
    🔴 foot(meta, true) の画面で頭の枠が直書きの文だけだと、サーバの not_counted を
    変えても画面のどこにも出なくなる（V21 検証: 本部アプローチ・MTGの品質・電話）。
    文の正本はサーバに置き、頭の枠はそれを出して、画面だけの補足を後ろに足す */
const notCounted = (meta) => {
  const t = esc((meta && meta.not_counted) || "").replace(/^※\s*/, "").replace(/。$/, "");
  return t ? t + "。<br>" : "";
};
function foot(meta, said) {
  const nc = said ? "" : (meta.not_counted || "");
  return '<div class="note def"><span class="hd">' +
    (nc ? "この画面で数えていないもの" : "集計の基準日と件数") + "</span><p>" +
    esc(nc) +
    (meta.today ? (nc ? "<br>" : "") + "基準日 " + esc(meta.today) : "") +
    (meta.n_deals ? "　取引 " + num(meta.n_deals) + " 件" : "") +
    (meta.n_active ? "（稼働中 " + num(meta.n_active) + " 件）" : "") + "</p></div>";
}

/* ================================================================ 2 継続回数 × 成果 */
function renderRenewal(D) {
  const mr = D.monthly_retention, br = D.by_renewal;
  const label = (r) => (r.renewal_no === 0 ? "初回" : "継続" + r.renewal_no);
  // 解約率の母数は決着済み（継続＋解約＋充足）。n<30 の足切りも母数で見る（全件の n ではない）
  const big = br.filter((r) => r.denom >= MIN_N);
  let h = sec("問い", "継続を重ねると、成果は落ちるのか");

  h += sec("図", "月次の継続率（満了月ベース・本体契約のみ）");
  /* 🔴 実線・塗りの点は「結果が出そろっていて、n が 30 以上」の月だけ。
     - 結果待ちが1件でもある月は率がまだ動く（右側打ち切り）。前は `pending > 5` という
       独自の線で切っていて、結果待ち1〜5件の月が確定値と同じ顔で出ていた（N5）
     - n<30 の月は、たまたまでも大きく振れる。確定値と同じ顔で描かない
     - 決着が0件（n=0）の月は率が無い。**点を作らない**。末尾に続く n=0 の月
       （満了がまだ先の契約しかない月）は横軸からも外し、外した月数を下に書く */
  const mrRows = mr.rows.slice();
  const cutTail = [];
  while (mrRows.length && !mrRows[mrRows.length - 1].denom) cutTail.unshift(mrRows.pop());
  const shaky = (r) => r.pending > 0 || r.denom < MIN_N;
  h += fig("継続率 ＝ 継続済 ÷（継続済 ＋ 解約 ＋ 充足）",
    "<b>充足も分母に入れています</b>",
    svgLine({ w: 680, h: 240, labelPts: true,
      x: mrRows.map((r) => r.month.slice(2)),
      xSub: mrRows.map((r) => "n=" + r.denom),
      series: [{ color: C.ai, pts: mrRows.map((r) => (!r.denom || r.rate == null)
        ? null
        : { v: r.rate / 100, censored: shaky(r),
            note: [r.pending > 0 ? "結果待ち" + r.pending : "",
                   r.denom < MIN_N ? "n<" + MIN_N : ""].filter(Boolean).join(" ") }) }],
      yFmt: F.pct, yLab: "継続率", alt: "月次の継続率" }),
    lg("dot", C.ai, "確定した月（結果待ち0件・n " + MIN_N + " 以上）") +
    lg("ring", C.ai, "未確定（結果待ちがある月・n " + MIN_N + " 未満の月）") +
    '<i class="full">中空・破線の月は、結果待ちがまだ残っているか、決着した件数が ' + MIN_N +
    " 件に届いていない月です。<b>確定値と同じには読まないでください。</b>" +
    "点の下の n は決着した件数です。" +
    (cutTail.length
      ? "決着が1件も無い " + num(cutTail.length) + " か月（" + esc(cutTail[0].month) +
        (cutTail.length > 1 ? "〜" + esc(cutTail[cutTail.length - 1].month) : "") +
        "、結果待ち " + num(cutTail.reduce((s, r) => s + r.pending, 0)) +
        " 件）は率が出せないので図に入れていません（下の表には出しています）。"
      : "") + "</i>" +
    '<i class="full">充足（採れて終わった契約）も分母に入れます。採用できて終わったのも' +
    "「継続しなかった」という結果だからです。オプション契約 " +
    num((D.population || {}).deals_option) +
    " 件は母数から外しています（月ごとの偏りが大きく、含めると月次比較が歪むため）。</i>");

  h += sec("表", "満了月ごとの内訳");
  /* 🔴 約60行あるので畳む（V15）。消してはいない。
     🔴 summary に「上の折れ線と同じ数字」と書いていたが、継続・解約・充足・結果待ちの
     月ごとの件数は折れ線に出ていない（折れ線は率と n=母数だけ）。**結果待ちは分母に入れない**
     ことを確かめられるのはこの表だけなので、そう書き、結果待ちの合計を summary に出す（V15 検証）。
     🔴 7列あり 400px 幅では入らない。scroll() の枠に入れないと、開いたときにページが
     横に広がる（V17 検証）。
     🔴 表も図と同じ線で分ける。図の注記は「下の表には出しています」と表へ誘うので、
     表で未確定の率を確定と同じ太字にすると、図で中空にした意味が無くなる
     （前は結果待ち1〜5件の月も n=1 の月も、確定月と同じ太字だった, N5）。
     - 太字は確定（結果待ち0・n 30 以上）だけ
     - 未確定は太字にせず「未確定」と理由を添える
     - n=0 の月は率が無い。0% にも見せず — にする */
  const pendAll = mr.rows.reduce((a, r) => a + (r.pending || 0), 0);
  h += '<details class="fold"><summary>満了月ごとの内訳を開く（' + num(mr.rows.length) +
    " か月ぶん。折れ線に無い継続・解約・充足の件数と、分母に入れていない結果待ち " +
    num(pendAll) + " 件の月ごとの内訳）</summary>" +
    '<div class="lede">継続率の<b>太字は確定した月</b>（結果待ち0件・n ' + MIN_N +
    " 以上）だけです。「未確定」の月は、結果待ちが決着すると率が動くか、件数が少なくて振れやすい月です。</div>" +
    scroll(table([{ t: "満了月" }, { t: "継続", n: 1 }, { t: "解約", n: 1 }, { t: "充足", n: 1 },
              { t: "母数", n: 1 }, { t: "継続率", n: 1 }, { t: "結果待ち", n: 1 }],
    mr.rows.map((r) => [esc(r.month), num(r.keep), num(r.cancel), num(r.fill),
      num(r.denom),
      (!r.denom || r.rate == null)
        ? DASH
        : shaky(r)
          ? pct1(r.rate) + '<br><span class="muted small">未確定（' +
            [r.pending > 0 ? "結果待ち " + num(r.pending) + " 件" : "",
             r.denom < MIN_N ? "n&lt;" + MIN_N : ""].filter(Boolean).join("・") + "）</span>"
          : "<b>" + pct1(r.rate) + "</b>",
      num(r.pending)])), 520) + "</details>";

  h += sec("図", "継続回数ごとの解約率");
  h += fig("分子は「解約 ＋ 充足」", "初回を乗り切れれば、あとは残ります",
    svgBarH({ w: 660, fmt: F.pp, rh: 26,
      rows: big.map((r) => ({
        label: label(r), v: r.cancel_rate, v0: r.cancel_rate_excl_fill,
        txt: pct1(r.cancel_rate), note: "n=" + num(r.denom),
        color: r.cancel_rate >= 40 ? C.hi : C.ai })) }),
    lg("box", C.hi, "40%以上") + lg("box", C.ai, "40%未満") +
    lg("dash", C.ghost, "充足を外すと") +
    '<i class="full">n は決着済み（継続＋解約＋充足）の件数で、解約率の分母です。' +
    "結果待ち（稼働中）は分母に入れていません。n が " + MIN_N +
    " 件未満の継続回数は図に載せていません（下の表には出しています）。" +
    "上の「月次の継続率」も決着済みが分母ですが、あちらは満了月で、こちらは継続回数で分けています。</i>");

  h += sec("図", "継続回数ごとの成果のばらつき");
  for (const [key, name, fmt] of [["oubo", "応募数", F.int], ["syoudaku", "採用数", F.int],
                                  ["oubo_per_posting", "求人票あたり応募", F.d1]]) {
    const rows = big.filter((r) => r[key] && r[key].n >= MIN_N).map((r, i) => ({
      label: label(r), med: r[key].median, q1: r[key].q1, q3: r[key].q3,
      min: r[key].min, max: r[key].max, mean: r[key].mean, n: r[key].n,
      /* 🔴 行ごとに SERIES を回すと2行目（継続1）だけが赤になり、「継続1がまずい」と
         読めてしまう（V9）。行は左のラベルで分かれているので、色は1つでよい */
      color: C.ai }));
    h += fig(name + "の散らばり（継続回数ごと）",
      "中央値だけでは分からない「幅」を出す",
      rows.length ? svgBoxH({ w: 680, xFmt: fmt, rows: rows })
                  : tooFew(0, name),
      lg("line", C.ink, "中央値") +
      '<i class="full">n は値が入っている契約の数で、件数そのものではありません。' +
      (D.meta.exclude_right_censored
        ? "右側打ち切りを外しています。"
        : "右側打ち切り " + num(D.meta.right_censored_n) +
          " 件を含んでいます（直近の契約は結果が確定しておらず、成果が低く出ます）。") + "</i>");
  }

  h += sec("表", "継続回数ごとの代表値");
  /* 11列あり、枠に入れないと 400px幅でページが 1,015px に広がっていた（V17 実測） */
  h += scroll(table([{ t: "継続回数" }, { t: "件数", n: 1 }, { t: "稼働中", n: 1 },
              { t: "決着済み（母数）", n: 1 },
              { t: "解約率", n: 1 }, { t: "（充足を外すと）", n: 1 },
              { t: "応募数", n: 1 }, { t: "面接数", n: 1 }, { t: "承諾数", n: 1 },
              { t: "求人票あたり応募", n: 1 }, { t: "契約額", n: 1 }],
    /* 🔴 n<30 の行（継続9〜14回は n=1〜6）に 0.0% / 50.0% が印なしで並んでいた（V15）。
       行は消さずに印を付け、率を一段落とす。
       🔴 解約率の分母は決着済み（r.denom, fix/cs-rust N1）。印も図の足切りと同じく denom で判定する */
    br.map((r) => [label(r) + (r.denom < MIN_N ? ' <span class="tag few">n&lt;' + MIN_N + "</span>" : ""),
      num(r.n), num(r.n_active), num(r.denom),
      r.denom < MIN_N ? '<span class="muted">' + pct1(r.cancel_rate) + "</span>"
                      : "<b>" + pct1(r.cancel_rate) + "</b>",
      '<span class="muted">' + pct1(r.cancel_rate_excl_fill) + "</span>",
      med(r.oubo), med(r.mensetu), med(r.syoudaku), med(r.oubo_per_posting, 1),
      med(r.amount, 0, 1)])));

  /* 🔴 「結果ごとの記入率」の図と「まずい」の枠は、データ品質の画面と**まったく同じ**だった（V16）。
     同じ数字を2か所で出さない（立ち上がりの「継続率はこの画面にありません」と同じ扱い）。
     ここには読み方への影響だけを残し、図はデータ品質に1つだけ置く。 */
  h += note("warn", "上の図は「継続するほど成果が良い」側に強く出ます",
    "うまくいかなかった契約ほど応募数・採用数が記録されていません。" +
    "結果ごとの記入率は「集計」の中の「データ品質」にあります。");
  return h + foot(D.meta);
}

function med(o, d, isMan) {
  if (!o || !o.n) return DASH;
  return (isMan ? yen(o.median) : num(o.median, d || 0)) +
    ' <span class="muted small">(n=' + num(o.n) + ")</span>";
}

/* ================================================================ 3 顧客詳細 */
/* 🔴 描画中に DOM を触らない。返した HTML が差し込まれるのは render の**後**なので、
   ここで $("#cs-houjin") を引いても null になる（実際にそれで③が落ちた）。
   一覧は持っておいて、差し込んだ後の wire() で流し込む。 */
let customerIndex = null;
let customerHoujin = "";
let customerReason = "";
/* 法人を選んでいないときの入口。①の「継続を追いかける」「法人番号で見る」で共通 */
function custIndex(D, question, lede) {
  customerIndex = D.index;
  /* 🔴 開いた瞬間に空の画面を出さない。既定の法人を1社開く */
  if (D.default_houjin && !customerHoujin) {
    customerHoujin = D.default_houjin;
    customerReason = D.default_reason || "";
    setTimeout(() => load(false), 0);
    return '<div class="loading">既定の顧客を開いています…</div>';
  }
  return sec("問い", question) +
    '<div class="lede">' + lede + " LTV の大きい順に " + num(D.index.length) +
    " 法人。上の選択から選ぶと明細が出ます。</div>" +
    scroll(table([{ t: "法人" }, { t: "取引", n: 1 }, { t: "拠点", n: 1 },
                  { t: "稼働中", n: 1 }, { t: "LTV", n: 1 }, { t: "最終満了" }],
      D.index.slice(0, 200).map((r) => [esc(r.name || r.houjin), num(r.deals),
        num(r.sites), num(r.active), yen(r.ltv), esc(r.last_expiration)])), 460,
      D.index.length);   /* 200 法人で切るので元の件数を渡す（V12） */
}

/* 注力の内訳と、注力だけに絞る操作。
   🔴 **置き場所は法人の画面。** 注力は法人単位の性質なので、案件単位の画面に置くと
      「この案件が注力」と読まれる。
   🔴 条件は重なる（1社が2つ3つに当たる）ので、内訳を足しても社数にはならない。
      足し算が合わないように見えるので、その旨を必ず書く。 */
function focusSection(D) {
  const f = D.focus;
  if (!f) return "";
  const me = D.customer || {};
  const why = me.focus_why || [];

  let h = sec("図", "注力の内訳");
  /* いま開いている法人が注力かどうか。理由まで出さないと確かめようがない */
  h += note(me.focus ? "warn" : "info",
    me.focus ? "いま見ている法人は注力です" : "いま見ている法人は注力ではありません",
    (me.focus
      ? "当てはまっている条件: <b>" + why.map(esc).join(" ／ ") + "</b>"
      : "3つの条件のどれにも当てはまっていません。") +
    "<br>" + esc(f.rule) + "<br>" + esc(f.not_layer));

  h += '<div class="ctlbar"><label class="act">' +
    '<input type="checkbox" id="hj-focus-only"' + (focusOnly ? " checked" : "") + ">" +
    "上の「法人を選ぶ」を注力だけにする（" + num(f.n_focus) + " / " +
    num(f.n_display) + " 社）</label></div>";

  const rest = f.n_display - f.n_focus;
  h += fig("1点が1社（" + esc(f.display_label) + " " + num(f.n_display) + " 社）",
    "色が付いているのが注力",
    svgDots({ total: f.n_display, per: 37, restLabel: "注力の条件に当たらない",
      groups: [{ v: f.n_focus, color: C.ai, label: "注力（いずれか該当）" }],
      alt: "注力の割合" }),
    lg("dot", C.ai, "注力 " + num(f.n_focus) + " 社") +
    lg("dot", "var(--rule-strong)", "それ以外 " + num(rest) + " 社") +
    '<i class="full">内訳（<b>重なります</b>。足しても ' + num(f.n_focus) +
    " 社にはなりません）: 月額30万以上 " + num(f.monthly_over_300k) +
    " ／ 従業員1,000名以上 " + num(f.enterprise) +
    " ／ 拠点3つ以上 " + num(f.multi_site) + "</i>" +
    '<i class="full">図は' + esc(f.display_label) + "だけで描いています。" +
    "全 " + num(f.n_all) + " 法人まで広げると注力は " + num(f.n_focus_all) +
    " 社です。</i>");
  return h;
}

/* 選んだ案件だけの D を作る。
   🔴 **画面の全部が選択に追従する**ようにするため、図・表・KPI・合計を
      ここで一度に絞る。どこか1つでも全件のまま残ると画面の中で数字が食い違う。 */
function custFilter(D, ids) {
  const keep = (x) => ids.has(x.deal_id);
  const ds = (D.deals || []).filter(keep);
  const sum = (f) => {
    let s = null;
    for (const d of ds) if (d[f] != null) s = (s || 0) + d[f];
    /* 🔴 1件も値が無ければ null。0 と「値が無い」を分ける */
    return s;
  };
  /* 前段比の分子・分母。🔴 **両方の値がある取引だけ**で足す（svgFunnel の pair）。
     段ごとの合計どうしで割ると、片方しか入っていない取引で集合がずれて 100% を超える */
  const pair = (a, b) => {
    const both = ds.filter((d) => d[a] != null && d[b] != null);
    return { num: both.reduce((s, d) => s + d[b], 0),
             den: both.reduce((s, d) => s + d[a], 0), n: both.length };
  };
  /* 最終満了は選んだ契約から取り直す。サーバの値はオプション契約も含めた全取引の最大で、
     チェックを外しても動かなかった（U11） */
  const lastExp = ds.reduce((m, d) => (d.expiration && d.expiration > m ? d.expiration : m), "");
  return Object.assign({}, D, {
    deals: ds,
    monthly: (D.monthly || []).filter(keep),
    contacts: (D.contacts || []).filter(keep),
    /* 🔴 MTG の履歴も絞る。ここが漏れると「40件中1件」に絞っても
       MTG の履歴だけ全拠点の 33件のまま出ていた（2026-09-23 実機, U7） */
    mtgs: (D.mtgs || []).filter(keep),
    cpa3: (D.cpa3 || []).filter(keep),
    handover: (D.handover || []).filter(keep),
    cpa_by_site: (D.cpa_by_site || [])
      .map((st) => ({ site: st.site, points: (st.points || []).filter(keep) }))
      .filter((st) => st.points.length),
    funnel: { oubo: sum("oubo"), mensetu: sum("mensetu"), syoudaku: sum("syoudaku"),
              pair_mensetu: pair("oubo", "mensetu"), pair_syoudaku: pair("mensetu", "syoudaku") },
    customer: D.customer && Object.assign({}, D.customer, {
      deals: ds.length,
      active: ds.filter((d) => d.is_active).length,
      ltv: sum("amount"),
      /* 一覧（CS_顧客）の LTV はオプション契約も足した値で、この画面の取引は
         オプションを外している。全部にチェックが入っていても一致しないので、
         元の値も持っておいて KPI に並べる（fixture 実測: 表示対象 517法人のうち
         一覧の LTV が全取引の合計と一致 517、本体契約だけの合計と一致 409） */
      ltv_index: D.customer.ltv,
      last_expiration: lastExp || null,
      /* 一覧の「最終満了」もオプション契約込みの値。LTV と同じく元の値も持っておき、
         食い違うときは理由を書く（U11） */
      last_expiration_index: D.customer.last_expiration,
      sites: new Set(ds.map((d) => d.site)).size,
      max_renewal_no: ds.reduce((m, d) => Math.max(m, d.renewal_no || 0), 0),
    }),
  });
}

/* 顧客1件の中身。`want` に入れた節だけを出す。
   節の中身はいままでのまま。粒度ごとに要る節が違うので、出し分けだけを足した。 */
function custBlocks(D, want) {
  if (!D.meta.found) return note("warn", "見つかりません", "この法人の取引がありません。");
  const c = D.customer;
  let h = "";
  if (want.has("head")) h += sec("顧客", c && c.name ? c.name : D.meta.houjin) +
    (customerReason
      ? note("info", "この顧客を既定で開いています", esc(customerReason) +
             "　上の選択から別の法人に切り替えられます。")
      : "") +
    '<div class="kpis">' +
    kpi("取引", num(c.deals) + '<span class="u">件</span>', "稼働中 " + num(c.active)) +
    kpi("拠点", num(c.sites) + '<span class="u">拠点</span>', "") +
    kpi("LTV", yen(c.ltv),
        /* 🔴 一覧の LTV と食い違う理由を書く。黙って別の値を出すと「どちらが正しいか」になる */
        c.ltv_index != null && c.ltv_index !== c.ltv
          ? "選んだ契約の金額の合計（オプション契約を除く）。法人一覧の LTV " +
            yen(c.ltv_index) + " はオプション契約も含みます"
          : "選んだ契約の金額の合計") +
    kpi("継続回数（最大）", num(c.max_renewal_no), "") +
    kpi("最終満了", esc(c.last_expiration || "—"),
        /* 🔴 LTV と同じ理由で食い違う。オプション契約の満了日が本体より遅い法人だけ */
        c.last_expiration_index && c.last_expiration_index !== c.last_expiration
          ? "選んだ契約の満了日の最大（オプション契約を除く）。法人一覧の最終満了 " +
            esc(c.last_expiration_index) + " は全取引（オプション契約を含む）の最大です"
          : "") + "</div>";

  /* ---- 顧客に説明する数字 ---- */
  if (want.has("funnel")) {
  h += sec("図", "顧客に説明する数字");
  const fn_ = D.funnel;
  h += fig("応募 → 面接 → 採用 の落ち方", "取引をまたいだ合計",
    svgFunnel({ steps: [
      { label: "応募", v: fn_.oubo, color: C.ai },
      { label: "面接", v: fn_.mensetu, color: C.ki, pair: fn_.pair_mensetu },
      { label: "採用", v: fn_.syoudaku, color: C.midori, pair: fn_.pair_syoudaku },
    ], alt: "応募から採用までの落ち方" }),
    '<i class="full">値が入っている契約だけを足しています。' +
    "<b>入っていないものを 0 として足していません</b>（母数が変わるため）。</i>" +
    '<i class="full">「前段の N%」は<b>前の段と両方の値が入っている契約だけ</b>で割っています' +
    (fn_.pair_mensetu
      ? "（面接÷応募は " + num(fn_.pair_mensetu.n) + " 件、採用÷面接は " +
        num(fn_.pair_syoudaku.n) + " 件）"
      : "") +
    "。棒の合計どうしで割ると、片方しか入っていない契約のぶん集合がずれます。</i>");
  }

  /* ---- 採用単価を3つの出し方で ---- */
  if (want.has("cpa3")) {
  h += sec("図", "採用単価を3つの出し方で見る");
  const c3 = D.cpa3.filter((x) => x.total != null);
  h += fig("同じ契約でも、出し方で値が変わります",
    "顧客が見ているのは「1人採るのにいくらかかったか」",
    c3.length
      ? svgBarH({ w: 700, fmt: F.man, rh: 26,
          rows: c3.map((x) => ({
            label: shortName(x.name || x.deal_id, 20),
            v: x.total, v0: x.monthly,
            txt: yen(x.total),
            note: (x.band ? "進捗帯「" + x.band + "」の中央値 " +
                    (x.band_median == null ? "なし（n<" + MIN_N + "）" : yen(x.band_median)) : "") +
                  (x.syoudaku != null ? "　" + num(x.syoudaku) + "人" : ""),
            /* 採用単価は量なので赤を使わない（V9）。確定は藍、未確定は薄い灰 */
            color: x.censored ? C.ghost : C.ai,
            faint: !!x.censored,
          })) })
      : '<div class="empty">採用数が入っている契約がありません（0で割っていません）。</div>',
    lg("box", C.ai, "総額 ÷ 採用数（確定）") + lg("box", C.ghost, "同（未確定・稼働中）") +
    lg("dash", C.ghost, "月割り") +
    '<i class="full">稼働中の契約は<b>金額が丸ごと乗っているのに採用がまだ伸びていない</b>ので、' +
    "総額での単価は必ず高く出ます。月割り（金額 ÷ 契約期間 × 経過月数 ÷ 採用数）と、" +
    "<b>同じ進捗帯の契約の中央値</b>を並べています。3つが食い違うときは、進捗帯の中央値を見てください。</i>");
  }

  /* ---- 拠点ごとの推移 ---- */
  if (want.has("cpasite")) {
  h += sec("図", "採用単価の推移（拠点ごと）");
  h += note("info", "1本の線にまとめない理由",
    "決裁は<b>事業所単位</b>です。拠点をまたいで1本につなぐと、拠点間のばらつきが" +
    "「時間の悪化」に見えてしまいます。");
  /* 🔴 点が1つの拠点ごとに「線にしていません」の空の枠を1つずつ出していて、
     空の枠が縦に何十も続いていた（V11 目視: ページが約 28,000px）。
     線にできない拠点は最後に1つの枠へまとめる（値は残す）。 */
  const oneCpa = [];
  for (const st of D.cpa_by_site) {
    const pts = st.points.map((p) => ({ v: p.cpa, censored: !!p.censored }));
    if (pts.length < 2) { oneCpa.push(st); continue; }
    h += fig("採用単価の推移 — " + shortName(st.site, 28), "点の下は採れた人数",
      svgLine({ w: 660, h: 200,
            x: st.points.map((p) => (p.start || "").slice(2, 7)),
            xSub: st.points.map((p) => (p.syoudaku == null ? "" : num(p.syoudaku) + "人")),
            /* 採用単価は量なので赤を使わない（V9）。未確定は中空・破線で分かる */
            series: [{ color: C.ai, pts: pts }],
            yFmt: F.man, yLab: "採用単価", alt: "採用単価の推移" }),
      lg("dot", C.ai, "確定した契約") + lg("ring", C.ai, "未確定（右側打ち切り）"));
  }
  if (oneCpa.length) {
    /* 🔴 未確定（稼働中）の値は総額が丸ごと乗っていて高く出る。確定値と同じ見た目で
       並べていた（V11 検証）。図の中空＋破線と同じ意味を、文字で「未確定」と添えて分ける */
    const anyOpen = oneCpa.some((st) => st.points.some((p) => p.censored));
    h += note("info", "点が1つしかない拠点（" + num(oneCpa.length) + "）は線にしていません",
      oneCpa.map((st) => esc(shortName(st.site, 28)) + " " +
        st.points.map((p) => (p.censored
          ? '<span class="muted">' + yen(p.cpa) + "（未確定・稼働中）</span>"
          : yen(p.cpa))).join(" / ")).join("<br>") +
      (anyOpen ? "<br>「未確定」は稼働中の契約で、総額が丸ごと乗っているので単価が高く出ます。" : ""));
  }
  }

  /* ---- 応募・面接・採用の推移 ---- */
  if (want.has("monthly")) {
  h += sec("図", "応募・面接・採用の推移");
  h += note("info", "現在値ではなく、プロパティの変更履歴を使っています",
    "HubSpot のプロパティは上書きで履歴が残らないため、現在値を時系列に並べると" +
    "<b>決着後に入力された値が契約中に伸びたように見えます</b>" +
    "（実測で応募数の変更の 30.4%・採用数の 35.2% が決着日より後）。<br>" +
    "値が変わらなかった月は<b>前の値を持ち越し</b>、中空・破線で描いています。" +
    "実線・塗りつぶしはその月に書き換えがあった印です。");
  /* 🔴 変更履歴が無い契約ごとに「変更履歴がありません」の空の枠を出していて、
     空の枠が大量に続いていた（V11 目視）。まとめて1つの枠にし、どの契約かは名前で残す */
  const noHist = [];
  for (const mm of D.monthly) {
    const ser = mm.series || {};
    const any = ["oubo", "mensetu", "syoudaku"].some((k) => (ser[k] || []).length);
    if (!any) { noHist.push(mm); continue; }
    const months = [...new Set([].concat(...["oubo", "mensetu", "syoudaku"]
      .map((k) => (ser[k] || []).map((x) => x.m))))].sort((a, b) => a - b);
    const mk = (k) => months.map((mi) => {
      const f = (ser[k] || []).find((x) => x.m === mi);
      return f ? { v: f.v, carry: f.carry } : { v: null };
    });
    h += fig(shortName(mm.name || mm.deal_id, 28) + " の推移",
      "横軸は契約の何ヶ月目か" + (mm.period ? "（契約 " + num(mm.period) + "ヶ月）" : ""),
      svgLine({ w: 680, h: 220,
        x: months.map((m) => m + "ヶ月"),
        series: [
          { color: C.ai, pts: mk("oubo") },
          { color: C.ki, pts: mk("mensetu") },
          { color: C.midori, pts: mk("syoudaku") },
        ], yFmt: F.int, yLab: "件", alt: "応募・面接・採用の推移" }),
      lg("line", C.ai, "応募") + lg("line", C.ki, "面接") + lg("line", C.midori, "採用") +
      lg("dash", C.ghost, "持ち越し（その月に書き換えが無い）"));

    /* ---- 系列を縦に積む ---- */
    const npsSer = mm.nps || {};
    // 🔴 何回目の定期かを点に載せる。載せないと図の文字が「定期undefined」になる。
    //    キーは nps / nps2 … nps11 で、末尾の数字が回数（nps だけ 1 回目）。
    const npsRound = (k) => (k === "nps" ? 1 : parseInt(k.slice(3), 10) || null);
    const npsPts = months.map((mi) => {
      let hit = null;
      for (const k of Object.keys(npsSer)) {
        const f = (npsSer[k] || []).find((x) => x.m === mi);
        if (f && (hit == null || !f.carry)) hit = { v: f.v, carry: f.carry, round: npsRound(k) };
      }
      return hit || { v: null };
    });
    const ct = (D.contacts || []).find((x) => x.deal_id === mm.deal_id);
    /* 🔴 棒の帯（bars）は p.fill / p.out を読む。{v:n} だけ返すと棒が1本も立たず、
       上限も「1」のまま空の帯になっていた（2026-09-23 実機, U2）。
       接触は「MTG・60秒超の通話」の1種類なので塗り（fill）に入れる。
       v は帯が空かどうかの判定に使う（取引に接触の記録が無ければ null）。 */
    const ctPts = months.map((mi) => {
      if (!ct) return { v: null };
      const n = ct.dates.filter((d) => monthIdx(mm.start, d.slice(0, 7)) === mi).length;
      return { v: n, fill: n };
    });
    const lane = (label, color, pts, type, noneLabel, fillLabel) => {
      const has = pts.some((p) => p.v != null);
      return { label: label, color: color, type: type || "line",
               pts: pts, empty: !has, noneLabel: noneLabel || "記録がありません",
               fillLabel: fillLabel || label };
    };
    /* 🔴 「NPS が落ちた月に…が読めます」は、NPS と接触の両方に記録がある契約でしか言えない。
       NPS の記録が無い契約にもこの文が出ていた（V11 目視） */
    const hasNps = npsPts.some((p) => p.v != null);
    const hasCt = ctPts.some((p) => p.v != null);
    h += fig(shortName(mm.name || mm.deal_id, 28) + " — 系列を縦に並べる",
      hasNps && hasCt
        ? "縦に目を落とすと「NPS が落ちた月に接触が切れていて、応募も止まっていた」が読めます"
        : "縦に目を落とすと、同じ月に何が起きていたかが読めます" +
          (hasNps ? "" : "（この契約には定期NPS の回答がありません）"),
      svgStackLanes({ w: 940, months: months.map((m) => m + "ヶ月"), lanes: [
        lane("応募", C.ai, mk("oubo")),
        lane("面接", C.ki, mk("mensetu")),
        lane("採用", C.midori, mk("syoudaku")),
        lane("定期NPS", C.murasaki, npsPts, "dots", "回答がありません"),
        /* 接触は「あった」印なので赤（まずい）で塗らない（V9）。fillLabel は U2 */
        lane("接触（MTG・60秒超の通話）", C.ink2, ctPts, "bars", "接触の記録がありません", "接触"),
      ] }),
      '<i class="full"><b>1つの縦軸に重ねていません。二軸も使っていません。</b>' +
      "値の幅が違いすぎる（応募 0〜200 / NPS 0〜10 / 接触 0〜数十）ので、" +
      "重ねると応募だけが動いて NPS が底に張り付きます。" +
      "目盛りの取り方しだいで「相関して見える絵」を作れてしまうため、" +
      "<b>横軸だけを共有して、系列ごとに自分の縦軸を持たせています</b>。</i>");
  }
  if (noHist.length) {
    h += note("info", "応募・面接・採用の変更履歴が無い契約（" + num(noHist.length) + " 件）",
      "記録が無いだけで、0 ではありません。図にしていないのは次の契約です: " +
      noHist.map((mm) => esc(shortName(mm.name || mm.deal_id, 28))).join(" ／ "));
  }
  }

  /* ---- 接触と担当交代 ---- */
  if (want.has("timeline") &&
      ((D.handover || []).length || (D.contacts || []).some((x) => x.dates.length))) {
    h += sec("図", "こちらの動き（接触と担当交代）");
    const lanes = [];
    for (const ct of (D.contacts || [])) {
      if (!ct.dates.length) continue;
      const d = D.deals.find((x) => x.deal_id === ct.deal_id);
      lanes.push({ label: shortName((d && d.name) || ct.deal_id, 16), color: C.ai,
        marks: ct.dates.map((x) => ({ d: x })) });
    }
    if ((D.handover || []).length) {
      lanes.push({ label: "担当交代", color: C.hi,
        marks: D.handover.map((x) => ({ d: x.date, thick: true })),
        note: D.handover.length + "件" });
    }
    h += fig("接触と担当交代の時系列", "交代の前後で間隔が開いたかを目で見る",
      svgTimeline({ w: 940, lanes: lanes, alt: "接触と担当交代" }),
      lg("dot", C.ai, "接触（MTG・60秒超の通話）") + lg("dot", C.hi, "担当交代") +
      '<i class="full">交代の「反映なし」には、新しい担当の MTG が1回しか無く' +
      "<b>引き継ぎか代理出席か区別が付かないもの</b>が混ざります。未反映と決めつけていません。</i>");
  }

  /* ---- 表（個別の行を特定したいときだけ）---- */
  if (want.has("deals")) {
  h += sec("表", "契約の系列（" + num(D.deals.length) + " 件）");
  h += scroll(table([{ t: "取引" }, { t: "ステージ" }, { t: "拠点" }, { t: "種別" },
                     { t: "開始" }, { t: "満了" }, { t: "継続", n: 1 }, { t: "金額", n: 1 },
                     { t: "応募", n: 1 }, { t: "面接", n: 1 }, { t: "承諾", n: 1 }, { t: "状態" }],
    D.deals.map((d) => [esc(d.name || d.deal_id),
      '<span class="muted small">' + esc(d.stage) + "</span>",
      '<span class="muted small">' + esc(d.site) + "</span>",
      '<span class="muted small">' + esc(d.kind) + "</span>",
      esc(d.start), esc(d.expiration), nz(d.renewal_no), yen(d.amount),
      nz(d.oubo), nz(d.mensetu), nz(d.syoudaku),
      (d.is_active ? "稼働中" : "") +
      (d.right_censored ? ' <span class="tag">未確定</span>' : "")])), 420);
  }

  if (want.has("mtgs")) {
  h += sec("表", "MTG の履歴（" + num(D.mtgs.length) + " 件）");
  h += note("info", "中身が空なのは「まだ抽出していない」です",
    "記録が無いのとは違います。抽出は日次の枠で止まっており、全件には届いていません。");
  h += scroll(table([{ t: "開催日" }, { t: "リスク" }, { t: "やること" },
                     { t: "顧客の懸念" }, { t: "抽出" }],
    D.mtgs.map((m) => [esc(m.date), esc(m.risk) || DASH, esc(m.todo) || DASH,
      esc(m.concern) || DASH, m.extracted ? "済" : '<span class="n0">未</span>'])), 420);
  }
  return h;
}

/* ================================================================ 継続を追いかける（事業所）

   🔴 粒度は**事業所（拠点）**。決裁は事業所単位なので、ふだん見るのはこちら。
      同じ事業所が契約を重ねてきた流れ（サブスク継続①②③…）を時系列で追う。
*/
let seriesSite = "";          /* 選んでいる拠点。空なら全部 */
/* 拠点が空の取引の選択肢の値。🔴 空文字のままだと「すべての拠点」と同じ value になり、
   選んでも全部が出る（2026-09-23 実機: value が空の選択肢が1つあった, U13）。
   拠点キーには出てこない文字列にしておく（NUL は HTML の属性値で U+FFFD に化けるので使わない）。 */
const NO_SITE = "__no_site__";
const siteOf = (d) => d.site || NO_SITE;

function siteLabel(D, key) {
  if (!key) return "すべての拠点";
  const n = (D.deals || []).filter((d) => siteOf(d) === key).length;
  return (key === NO_SITE ? "拠点が入っていない" : shortName(key, 28)) +
    "（契約 " + num(n) + " 件）";
}

function renderSeries(D) {
  if (D.index) {
    return custIndex(D, "この事業所は契約を重ねてこられたか",
      "<b>粒度は事業所です。</b>決裁は事業所単位なので、ふだん見るのはこちらです。");
  }
  const sites = [...new Set((D.deals || []).map(siteOf))].sort();
  if (seriesSite && !sites.includes(seriesSite)) seriesSite = "";
  const ids = new Set((D.deals || [])
    .filter((d) => !seriesSite || siteOf(d) === seriesSite)
    .map((d) => d.deal_id));
  const F2 = custFilter(D, ids);

  let h = sec("問い", "この事業所は契約を重ねてこられたか");
  h += note("info", "いま見ている粒度は「事業所」です",
    "<b>拠点をまたいでいません。</b>決裁は事業所単位なので、" +
    "同じ法人でも拠点が違えば別の契約の流れとして見ます。" +
    "拠点をまたいで比べたいときは、左の「法人番号で見る」を使ってください。");

  /* 拠点の選択。件数が多いので選択式にする */
  h += '<div class="ctlbar"><label class="act">拠点 <select id="cs-site">' +
    '<option value=""' + (seriesSite ? "" : " selected") + ">" +
    esc(siteLabel(D, "")) + "（" + num((D.deals || []).length) + " 件）</option>" +
    sites.map((k) => '<option value="' + esc(k) + '"' +
      (k === seriesSite ? " selected" : "") + ">" + esc(siteLabel(D, k)) +
      "</option>").join("") + "</select></label></div>";
  h += '<div class="count-line' + (seriesSite ? " on" : "") + '">' +
    "<b>" + num((D.deals || []).length) + " 件中 " + num(F2.deals.length) +
    " 件</b>を表示" + (seriesSite ? "（" + (seriesSite === NO_SITE ? "拠点が入っていない契約"
                                  : "拠点 " + esc(shortName(seriesSite, 28))) + "）"
                                  : "（拠点で絞っていません）") + "</div>";

  /* 契約の連なり。何回目か・間が空いていないか */
  h += sec("図", "契約の連なり");
  const ordered = F2.deals.slice().sort((a, b) =>
    String(a.start || "").localeCompare(String(b.start || "")));
  h += fig("契約を古い順に並べる", "横は開始日。空きがあれば間が空いている",
    ordered.length
      ? svgTimeline({ w: 940, alt: "契約の連なり", lanes: ordered.map((d) => ({
          label: shortName(d.name || d.deal_id, 18),
          color: d.is_active ? C.ai : C.ghost,
          note: (d.renewal_no ? num(d.renewal_no) + "回目" : "初回") +
                (d.amount != null ? "　" + yen(d.amount) : ""),
          marks: [d.start, d.expiration].filter(Boolean).map((x) => ({ d: x, thick: true })),
        })) })
      : '<div class="empty">この拠点に契約がありません。</div>',
    lg("dot", C.ai, "稼働中") + lg("dot", C.ghost, "決着済") +
    '<i class="full">印は契約の開始日と満了日です。' +
    "<b>間が空いていれば、その分だけ契約が途切れています。</b></i>");

  h += custBlocks(F2, new Set(["monthly", "timeline", "deals", "mtgs"]));
  return h + foot(D.meta);
}

/* ================================================================ 法人番号で見る（法人）

   🔴 粒度は**法人**。拠点をまたいで並べる。本部に持っていく話のとき用。
   🔴 案件はチェックで出し入れできる。**既定は全表示**。
      チェックを外したら図・表・KPI・合計の**全部**が追従する。
*/
let houjinPick = null;        /* deal_id -> true。null なら「まだ決めていない＝全部」 */
/* 上の「法人を選ぶ」を注力だけにするか。
   🔴 注力は**法人の大きさ**で決まる性質（日々変わらない）。
      日々変わる状態は「今日動く先」の MTG途絶の帯のほう。混ぜない。 */
let focusOnly = false;
let houjinFor = "";           /* どの法人ぶんの選択か */

function houjinIds(D) {
  const all = (D.deals || []).map((d) => d.deal_id);
  if (houjinFor !== customerHoujin || !houjinPick) {
    houjinFor = customerHoujin;
    houjinPick = {};
    all.forEach((id) => { houjinPick[id] = true; });   /* 既定は全部 */
  }
  return new Set(all.filter((id) => houjinPick[id]));
}

/* 1案件の暦月 mo（"YYYY-MM"）時点の採用数。{ v, carry } を返す。
   🔴 記録は**書き換えのあった月だけ**。間の月は前の値を持ち越す
      （サーバ側の fill_forward と同じ読み方）。持ち越した点は carry を立てる。
   🔴 **契約期間の外は null。** サーバの月次はその契約の満了後も今月まで持ち越して
      返してくるので、そのまま足すと満了した契約の累計が毎月乗り続け、
      「毎月採れている」ように見えていた（N8）。満了月で止める。
   案件ごとの線と、拠点ごとに積んだ合計の両方がこれを使う（止め方を2つ作らない）。 */
function syoudakuAt(mm, dl, mo) {
  const st = String(mm.start || "").slice(0, 7);
  const en = String((dl && dl.expiration) || "9999-12").slice(0, 7);
  if (!st || mo < st || mo > en) return { v: null };
  let last = null;
  for (const x of ((mm.series || {}).syoudaku || [])) {
    const xm = monthAdd(mm.start, x.m);
    if (xm && xm <= mo) last = { mo: xm, v: x.v, carry: !!x.carry };
  }
  if (!last || last.v == null) return { v: null };
  /* 🔴 サーバは書き換えの無い月にも点を置き、carry を立てて返す（routes の月次）。
     点がある＝その月に書かれた、ではない。前は点の有無だけで決めていたので、
     実データでは持ち越しの月もすべて「書き換えあり」の塗りで描かれていた（N8） */
  return { v: last.v, carry: last.mo !== mo || last.carry };
}

/* "YYYY-MM" の a から b まで、1か月ずつ全部。柱の間隔を暦どおりに保つため */
function monthRange(a, b) {
  const out = [];
  if (!a || !b) return out;
  let y = +a.slice(0, 4), m = +a.slice(5, 7);
  for (let k = 0; k < 600; k++) {
    const s = y + "-" + String(m).padStart(2, "0");
    if (s > b) break;
    out.push(s);
    if (++m > 12) { m = 1; y++; }
  }
  return out;
}

/* 拠点ごとに積む図の系列。色は5つなので、6拠点目からは「その他」に束ねる。
   🔴 束ねたことは凡例に拠点数で出す（黙って落とさない）。
   🔴 拠点の見分けだけなので、判定の色（赤＝まずい・山吹＝注意・緑＝良い）を使わない。
   以前は [藍, 赤, 山吹, 緑, 紫] で、2番目の拠点がいつも赤に見えていた。
   案件ごとの線（CASE_LINE）と同じ、意味を持たない色の並びにする */
const SITE_COLORS = [C.ai, C.murasaki, C.ink, C.ink3, C.ink2];
function siteSeries(sites, valsOf, order) {
  /* 並べ替えの基準は拠点ごとに1回だけ計算する。比較のたびに order() を呼ぶと
     O(n log n) 回の計算し直しになり、合成データの 200案件・100拠点で 272ms かかった（N8） */
  const key = new Map(sites.map((s) => [s, order(s)]));
  const sorted = sites.slice().sort((a, b) => key.get(b) - key.get(a));
  const head = sorted.slice(0, SITE_COLORS.length);
  const rest = sorted.slice(SITE_COLORS.length);
  const out = head.map((s, i) => ({ label: s === NO_SITE ? "拠点が入っていない" : shortName(s, 16),
                                    color: SITE_COLORS[i], vals: valsOf([s]) }));
  if (rest.length)
    out.push({ label: "その他の拠点（" + rest.length + " か所）", color: C.ghost, vals: valsOf(rest) });
  return out;
}

function renderHoujin(D) {
  if (D.index) {
    return custIndex(D, "この法人は拠点ごとにどう違うか",
      "<b>粒度は法人です。</b>拠点をまたいで並べます。本部に持っていく話のとき用です。");
  }
  const ids = houjinIds(D);
  const F2 = custFilter(D, ids);
  const all = D.deals || [];

  let h = sec("問い", "この法人は拠点ごとにどう違うか");
  h += note("info", "いま見ている粒度は「法人」です",
    "<b>拠点をまたいで並べています。</b>ふだんの判断は事業所単位なので、" +
    "1つの事業所の流れを追うときは左の「継続を追いかける」を使ってください。" +
    "<b>拠点をまたいで1本の線にはしていません</b>（拠点差が時間の悪化に見えるため）。");
  h += focusSection(D);

  /* ---- 案件のチェック ---- */
  h += sec("表", "見る案件を選ぶ");
  h += '<div class="ctlbar" id="hj-ctl">' +
    '<button type="button" class="act" id="hj-all">全部選ぶ</button>' +
    '<button type="button" class="act" id="hj-none">全部外す</button></div>';
  h += '<div class="pickbox" id="hj-pick">' + all.map((d) =>
    '<label class="pick"><input type="checkbox" data-d="' + esc(d.deal_id) + '"' +
    (houjinPick[d.deal_id] ? " checked" : "") + ">" +
    "<span>" + esc(shortName(d.name || d.deal_id, 34)) +
    '<span class="muted small">　' + esc(shortName(d.site, 14)) +
    (d.amount != null ? "　" + yen(d.amount) : "") +
    (d.is_active ? '　<span class="tag e">稼働中</span>' : "") +
    "</span></span></label>").join("") + "</div>";
  /* 🔴 絞ったことを忘れて全体だと読むのが、この種の画面でいちばん起きる事故 */
  /* class の中に式を書かない（CSS の静的検査がクラス名と読み違える） */
  const picked = ids.size < all.length;
  h += '<div class="count-line' + (picked ? " on" : "") + '" id="hj-count">' +
    "<b>" + num(all.length) + " 件中 " + num(ids.size) + " 件</b>を表示" +
    (picked ? "（チェックを外している案件があります）" : "（全部出しています）") +
    "</div>";

  if (!ids.size) {
    h += note("warn", "案件が1つも選ばれていません",
      "上のチェックを1つ以上入れてください。「全部選ぶ」で戻せます。");
    return h + foot(D.meta);
  }

  h += custBlocks(F2, new Set(["head", "funnel", "cpa3"]));

  /* ---- 案件ごとの推移 ---- */
  /* 案件ごとに契約開始日が違うので、月番号を暦の月に直してから横軸をそろえる */
  const mkMonths = () => {
    const set = new Set();
    for (const mm of F2.monthly) {
      const ser = (mm.series || {}).syoudaku || [];
      for (const x of ser) {
        const mi = monthAdd(mm.start, x.m);
        if (mi) set.add(mi);
      }
    }
    return [...set].sort();
  };
  const ms = mkMonths();

  h += sec("図", "案件ごとの採用数の推移");
  /* 🔴 **記録が無い契約は線にしない。** 0 として描くと「採れていない」に見えるが、
     実際は「プロパティの変更履歴が残っていない」だけ（古い契約ほど残っていない）。
     新しい順に、記録のあるものだけを最大12本描く。 */
  const withSer = F2.monthly
    .filter((mm) => (((mm.series || {}).syoudaku) || []).length)
    .sort((a, b) => String(b.start || "").localeCompare(String(a.start || "")));
  /* 🔴 **色は4役＋紫の5つしかない。** 6本目からは色を使い回すことになり、
     凡例を見ても線が見分けられなくなる（色だけで意味を伝えないという規律に反する）。
     線は5本までにして、それ以上見たいときは**チェックで案件を絞ってもらう**。
     チェックはそのために付けてある。 */
  const MAX_LINE = 5;
  /* 🔴 以前は [藍, 赤, …] で、2本目の案件がいつも赤（■まずい）になっていた（V9 検証）。
     案件の見分けだけなので、判定の色（赤・山吹・緑）を使わない。名前は凡例で必ず出す */
  const CASE_LINE = [C.ai, C.murasaki, C.ink, C.ink3, C.ink2];
  const drawn = withSer.slice(0, MAX_LINE);
  h += fig("選んだ案件それぞれの線", "横は暦の月。1本＝1案件",
    ms.length >= 2 && drawn.length
      ? svgLine({ w: 940, h: 260, x: ms.map((m) => m.slice(2)),
          series: drawn.map((mm, i) => ({
            color: CASE_LINE[i],
            /* 持ち越した点は carry を立てて中空・破線で描く。
               契約期間の外までは伸ばさない（読み方は syoudakuAt の1か所） */
            pts: ms.map((mo) => syoudakuAt(mm,
              F2.deals.find((d) => d.deal_id === mm.deal_id), mo)),
          })), yFmt: F.int, yLab: "採用数", alt: "案件ごとの採用数の推移" })
      : '<div class="empty">線にできる月次の記録がありません（記録が無いだけで 0 ではありません）。</div>',
    /* 🔴 lg() のラベルは HTML としてそのまま入る（凡例に <strong> を使う呼び出しがあるため）。
       取引名は HubSpot で誰でも書ける文字列なので、ここで必ずエスケープする（V18） */
    drawn.map((mm, i) =>
      lg("line", CASE_LINE[i],
         esc(shortName(mm.name || mm.deal_id, 18)))).join("") +
    '<i class="full"><b>拠点をまたいで1本にしていません。</b>1本が1案件です。' +
    "選んだ " + num(F2.monthly.length) + " 件のうち、採用数の変更履歴があるのは " +
    num(withSer.length) + " 件です。" +
    "<b>履歴が無いのは「採れていない」ではなく「記録が残っていない」です</b>" +
    "（古い契約ほど残っていません）。</i>" +
    (withSer.length > MAX_LINE
      ? '<i class="full"><b>線は新しい ' + MAX_LINE + " 本だけです。</b>" +
        "色は4役＋紫の5つしかなく、6本目から色を使い回すと線が見分けられなくなるためです。" +
        "<b>見たい案件だけチェックを残すと、その案件が線になります。</b></i>"
      : ""));

  /* ---- 全体（合算）---- */
  h += sec("図", "全体（選んだ案件の合算）");
  /* 🔴 **拠点をまたいで1本の線にしない**（規律）。合算は見せるが、柱を拠点の色で積む。
     線でつなぐと拠点間のばらつきが「時間の変化」に見える。柱なら合計の高さと、
     どの拠点のぶんかが同時に読める（N8）。 */
  const dealOf = {};
  F2.deals.forEach((d) => { dealOf[d.deal_id] = d; });
  const synDeals = F2.monthly.filter((mm) => (((mm.series || {}).syoudaku) || []).length);
  const synHit = ms.filter((mo) => synDeals.some((mm) => syoudakuAt(mm, dealOf[mm.deal_id], mo).v != null));
  const synAxis = synHit.length ? monthRange(synHit[0], synHit[synHit.length - 1]) : [];
  const synSites = [...new Set(synDeals.map((mm) => siteOf(dealOf[mm.deal_id] || {})))];
  /* 🔴 書き換えのあった契約（fresh）と持ち越した契約（carry）を**分けて足す**。
     まとめて1つにすると、1件でも書き換えがあった拠点は区分全体が確定の塗りになり、
     持ち越した値まで「その月に書かれた値」の顔で描かれていた（N8）。 */
  const synVals = (sites) => synAxis.map((mo) => {
    let fresh = null, carried = null;
    for (const mm of synDeals) {
      if (!sites.includes(siteOf(dealOf[mm.deal_id] || {}))) continue;
      const r = syoudakuAt(mm, dealOf[mm.deal_id], mo);
      if (r.v == null) continue;
      if (r.carry) carried = (carried || 0) + r.v;
      else fresh = (fresh || 0) + r.v;
    }
    if (fresh == null && carried == null) return { v: null };
    return { v: (fresh || 0) + (carried || 0), fresh: fresh, carried: carried };
  });
  /* 色を付ける拠点は「契約ごとの最終的な累計」の合計が大きい順（LTV の図が合計金額で
     並べるのと同じ考え方）。前は横軸の最後の月の値で並べていて、満了で止めた（N8）後は
     満了済みの拠点が過去に何人採っていても 0 扱いで「その他」に回っていた。 */
  const synOrder = (s) => synDeals
    .filter((mm) => siteOf(dealOf[mm.deal_id] || {}) === s)
    .reduce((a, mm) => a + synAxis.reduce((mx, mo) => {
      const r = syoudakuAt(mm, dealOf[mm.deal_id], mo);
      return r.v != null && r.v > mx ? r.v : mx;
    }, 0), 0);
  const synSer = siteSeries(synSites, synVals, synOrder);
  /* 柱は拠点ごとに2段: 下が書き換えのあった契約（塗り）、上が持ち越し（中空・破線）。
     凡例は拠点ごとに1つ（synSer から作る） */
  const synBars = [];
  synSer.forEach((S) => {
    synBars.push({ label: S.label, color: S.color,
                   vals: S.vals.map((p) => ({ v: p.fresh == null ? null : p.fresh })) });
    synBars.push({ label: S.label, color: S.color,
                   vals: S.vals.map((p) => (p.carried == null ? { v: null } : { v: p.carried, carry: true })) });
  });
  /* 🔴 題名に「累計」と入れる。柱の高さは**その月に新しく採れた数ではなく**、
     契約期間中の各契約の累計（ストック）を足したもの。「月ごとの合計」だけだと
     月々の採用数（フロー）に読める。満了で柱が下がっても採用が減ったわけではない（N8） */
  h += fig("契約中の案件の採用数（累計）の月ごとの合計",
    "その月に契約期間中だった案件の、契約ごとの採用数の累計を拠点ごとに積んだもの。その月に新しく採れた数ではありません",
    synAxis.length >= 2
      ? svgColStack({ w: 940, h: 230, x: synAxis.map((m) => m.slice(2)), series: synBars,
          yFmt: F.int, yLab: "採用数（累計）", alt: "契約中の案件の採用数の累計を拠点ごとに積んだ推移" })
      : '<div class="empty">合算できる月次の記録がありません。</div>',
    synSer.map((S) => lg("box", S.color, esc(S.label))).join("") +
    /* 「その他の拠点」は C.ghost の塗り。引き継ぎを C.ghost の線にすると同じ色で2つの意味になる */
    lg("hollow", C.ink, "引き継ぎ（その月に書き換えが無い契約のぶん）") +
    '<i class="full"><b>柱の高さは累計です。</b>その月に新しく採れた人数ではありません。' +
    "契約ごとの採用数の累計を、契約期間中の月に積んでいます。" +
    "<b>柱が下がるのは契約が満了したからで、採用が減ったからではありません。</b></i>" +
    '<i class="full"><b>これは合算です。</b>拠点をまたいで足しています。' +
    "<b>線でつながず、柱を拠点ごとの色で積んでいます</b>（拠点をまたいで1本の線にすると、" +
    "拠点の違いが時間の変化に見えるため）。" +
    "<b>満了した契約は満了月で止めています。</b>満了後も累計を足し続けると、" +
    "採れていない月まで採れているように見えるためです。" +
    "拠点ごとの違いを見るときは1つ上の図か、下の「採用単価の推移（拠点ごと）」を見てください。</i>");

  /* LTV の累計。金額の入っている案件を開始日の順に足していく。
     🔴 これも拠点ごとに積む（同じ理由）。柱は契約が始まった月だけに立てる */
  const lt = F2.deals.filter((d) => d.amount != null && d.start)
    .sort((a, b) => String(a.start).localeCompare(String(b.start)));
  const ltAxis = [...new Set(lt.map((d) => String(d.start).slice(0, 7)))];
  const ltVals = (sites) => ltAxis.map((mo) => {
    const got = lt.filter((d) => sites.includes(siteOf(d)) && String(d.start).slice(0, 7) <= mo);
    return got.length ? { v: got.reduce((s, d) => s + d.amount, 0) } : { v: null };
  });
  const ltSer = siteSeries([...new Set(lt.map(siteOf))], ltVals,
    (s) => lt.filter((d) => siteOf(d) === s).reduce((a, d) => a + d.amount, 0));
  h += fig("LTV の推移（契約金額の累計）", "契約が増えるたびに積み上がる。拠点ごとに積んでいます",
    ltAxis.length >= 2
      ? svgColStack({ w: 940, h: 230, x: ltAxis.map((m) => m.slice(2)), series: ltSer,
          yFmt: F.man, yLab: "累計金額（万円）", alt: "LTV を拠点ごとに積んだ推移" })
      : '<div class="empty">金額が入っている契約の開始月が ' + num(ltAxis.length) +
        " つしかないので図にしていません。</div>",
    ltSer.map((S) => lg("box", S.color, esc(S.label))).join("") +
    '<i class="full"><b>これも合算です。</b>拠点ごとの色で積んでいます。' +
    "金額が入っていない契約は足していません" +
    "（0 として足すと母数が変わるため）。横軸は契約の開始月です。</i>");

  h += custBlocks(F2, new Set(["cpasite", "deals"]));

  /* ---- 他の法人と比べる（本部アプローチ）---- */
  h += sec("図", "他の法人と比べる");
  h += '<div id="hq-box"><span class="loading">読み込み中…</span></div>';
  return h + foot(D.meta);
}

/** 契約開始からの月番号 `m` を暦の "YYYY-MM" に直す。
    🔴 サーバ側と同じ数え方（始月を1ヶ月目とする）。 */
function monthAdd(start, m) {
  if (!start || String(start).length < 7 || m == null) return null;
  const y = +String(start).slice(0, 4);
  const mo = +String(start).slice(5, 7);
  const t = (y * 12 + (mo - 1)) + (m - 1);
  const yy = Math.floor(t / 12);
  const mm = (t % 12) + 1;
  return yy + "-" + String(mm).padStart(2, "0");
}

/** 契約開始からの「何ヶ月目か」。🔴 始月は含めない（サーバ側と同じ数え方） */
function monthIdx(start, month) {
  if (!start || start.length < 7 || !month || month.length < 7) return null;
  return (+month.slice(0, 4) - +start.slice(0, 4)) * 12 +
         (+month.slice(5, 7) - +start.slice(5, 7)) + 1;
}

/* ================================================================ 4 本部アプローチ */
/** 拠点の表示名。🔴 site_name が null のときに照合用のキー（kyoten_key）へ戻さない
    （Rust 側「キーで埋めない」）。1つの図・表に名前の無い拠点が2つ以上あるときは
    見分けられるように番号を振る */
function siteLabels(rows) {
  const unnamed = rows.filter((x) => !x.site_name).length;
  let k = 0;
  return rows.map((x) => x.site_name ? x.site_name
    : "拠点名が無い" + (unnamed > 1 ? "（" + (++k) + "）" : ""));
}

      rows.length
        ? svgBarH({ w: 680, fmt: F.man, rh: 24,

              /* 🔴 率だけで母数が無かった（V20 検証）。分母を添える。

        r.rows.map((x, i) => [esc(names[i]), num(x.deals), num(x.active), num(x.cancel),
          num(x.fill), num(x.denom), pct1(x.cancel_rate), yen(x.amount), nz(x.syoudaku),

/* 月次の件数で「まだ締まっていない月」。
   🔴 元データを落とした時刻（source_as_of）の月から先は、その月の途中までしか入っていない。
      計算の基準日（today）ではなく元データの時刻で決める。シートを作り直さずに日付だけ
      進むと、前の月まで途中のまま確定に見えてしまうため。取れなければ基準日で代える。 */
function openMonth(meta) {
  const s = (meta && (meta.source_as_of || meta.today)) || "";
  return s.length >= 7 ? s.slice(0, 7) : null;
}
/* 月次の件数の点。締まっていない月は中空・破線にする（V5） */
const monthPt = (month, v, open) =>
  ({ v: v, censored: !!open && month >= open, note: open && month >= open ? "途中" : "" });

  const hasOpenM = !!openM && D.monthly.some((m) => m.month >= openM);
  h += fig("MTG の実施回数", "",
    svgLine({ w: 680, h: 220,
      x: D.monthly.map((m) => m.month.slice(2)),

      "<b>ほかの月と同じには比べられません</b>（必ず低く出ます）。</i>" : ""));
  return h + foot(D.meta, true);   /* 数えていないものは頭の枠で書いた（V21: 上下で2回出ていた） */
}

          label: "経過日数", med: D.days_since.median, q1: D.days_since.q1,
          q3: D.days_since.q3, min: D.days_since.min, max: D.days_since.max,
          mean: D.days_since.mean, n: D.days_since.n, color: C.ai }] })
      : tooFew(D.days_since ? D.days_since.n : 0, "経過日数"),
    lg("box", C.ai, "四分位") + lg("line", C.ink, "中央値") +
    '<i class="full">接触が1本も無い ' + num(r.no_contact) +
    " 件は<b>0日として混ぜていません</b>。0日にすると「昨日話した」ように見えます。</i>");

  h += sec("図", "月ごとの本数");
  const openP = openMonth(D.meta);
  const hasOpenP = !!openP && D.monthly.some((m) => m.month >= openP);   /* MTG と同じ（V5） */

      series: [
        { color: C.ai, pts: D.monthly.map((m) => monthPt(m.month, m.calls, openP)) },

  h += note("warn", "電話の中身はまだ読めていません", esc(D.transcript.note));

  h += sec("表", "沈黙している取引（" + num(D.silent.n) + " 件）");
  h += '<div class="lede">' + esc(D.silent.rule) +

      x.days_since == null ? DASH : num(x.days_since) + "日"])), 420);
  return h + foot(D.meta, true);   /* 数えていないものは頭の枠で書いた（V21: 上下で2回出ていた） */
}

/* ================================================================ 7 立ち上がり */
function renderRampup(D) {
  const ph = D.phase, f = D.first_mtg, nm = D.no_mtg;
  let h = sec("問い", "最初の契約を乗り切れているか") +
    note("def", "この画面で数えていないもの",
      "成約率・売上・担当者の評価ではありません。<b>契約が始まってから最初の MTG までに" +
      "何日かかったか</b>だけを見ています。良し悪しの判断は人がします。<br>" +
      "ここの「初回MTG」は<b>MTG だけ</b>で、電話は入っていません" +
      "（MTGと電話を束ねた最終接触は⑧成果にあります）。");

  h += sec("図", "いま、どのフェーズにいるか");
  /* 🔴 SERIES を並び順で回していたので「序盤」が緑（＝良い）、別の日には赤にもなり得た（V9）。
     フェーズは良し悪しではないので、赤と緑は使わない。名前で色を決める */
  const PHASE_COLOR = { "序盤": C.ai, "中盤": C.murasaki, "終盤": C.ink2,
                        "満了超過": C.ki, "出せない": C.ghost };
  const pparts = ph.rows.map((r) => ({
    label: r.label, v: r.n,
    color: PHASE_COLOR[r.label] || C.ghost,
    faint: r.label === "出せない" }));
  h += fig("契約長に対する割合で見る", esc(ph.rule),
    svgStack({ w: 680, parts: pparts }), stackLegend(pparts) +
    '<i class="full">同じ「3ヶ月目」でも、3ヶ月契約なら満了、12ヶ月契約なら序盤です。' +
    "契約期間が入っていないものは「出せない」に置いています（0として満了超過に落としていません）。</i>");

  h += sec("図", "立ち上がりの速さ（契約開始 → 初回MTG）");
  h += fig("初回MTGまでの日数の散らばり",
    "母数 " + num(f.n) + " 件。契約前のMTG " + num(f.pre_contract) + " 件は混ぜていません",
    f.stats && f.stats.n >= MIN_N
      ? svgBoxH({ w: 680, xFmt: F.int, rows: [{
          label: "初回MTGまで", med: f.stats.median, q1: f.stats.q1, q3: f.stats.q3,
          min: f.stats.min, max: f.stats.max, mean: f.stats.mean, n: f.stats.n, color: C.ai }] })
      : tooFew(f.stats ? f.stats.n : 0, "初回MTGまでの日数"),
    lg("box", C.ai, "四分位") + lg("line", C.ink, "中央値"));

  h += fig("帯ごとの、その後の解約率", "立ち上がりの速さと解約の向きは読めません",
    svgBarH({ w: 660, fmt: F.pp, rh: 26,
      // 解約率の母数は決着済み（b.denom）。足切りも母数で見る（結果待ちを含む b.n ではない）
      rows: f.buckets.filter((b) => b.denom >= MIN_N).map((b) => ({
        label: b.label, v: b.cancel_rate, txt: pct1(b.cancel_rate),
        note: "n=" + num(b.denom),
        /* 🔴 以前は「61日超」だけ赤（■まずい）にしていた。決着済みで割り直すと向きは
           読めないので、特定の帯を判定の色で強調しない。全帯を同じ色にする */
        color: C.ai })) }),
    lg("box", C.ai, "解約率") +
    // 足切りは決着済みの件数（b.denom）で見る。図の filter と同じ基準にする（rust N3 + ui V6）
    droppedNote(f.buckets, (b) => b.denom || 0, (b) => b.label) +
    '<i class="full">n は決着済み（継続＋解約＋充足）の件数で、解約率の分母です。結果待ちは入れていません。' +
    "<b>単調ではありません。</b>14日以内も解約しています。" +
    "「早ければ良い」とも「遅いほど悪い」とも言えません（決着済みで割ると、遅い群が悪いという差は読めなくなりました）。" +
    "61日超には関係が薄い顧客が混じっている可能性があり、" +
    "<b>遅れが原因とは決められません（相関であって因果ではない）</b>。</i>");

  h += sec("表", "まだ MTG が結べていない初回契約（" + num(nm.n) + " 件）");
  h += '<div class="lede">稼働中の初回契約 ' + num(nm.first_active) + " 件のうち " +
    pct1(nm.rate) + "。" + esc(nm.note) +
    (nm.excluded_marketing ? "。「マーケ関連」の " + num(nm.excluded_marketing) +
      " 件は MTG をしないのが普通なので、この表と母数から外しています" : "") + "</div>";
  h += scroll(table([{ t: "取引" }, { t: "ステージ" }, { t: "金額", n: 1 }, { t: "契約開始から", n: 1 }],
    nm.rows.map((r) => [esc(r.name || r.deal_id),
      '<span class="muted small">' + esc(r.stage) + "</span>", yen(r.amount),
      r.days_since_start == null ? DASH : num(r.days_since_start) + "日"])), 420);
  h += note("info", "継続率はこの画面にありません",
    "「集計」の中の「継続回数 × 成果」にあります。<b>同じ数字を2か所で作らない</b>ためです。");
  return h + foot(D.meta, true);   /* 数えていないものは頭の枠で書いた（V21: 上下で2回出ていた） */
}

/* ================================================================ 8 成果とリスク */
/** 目標に対する進捗の帯の色。帯の名前で決める（並び順に依存しない）。
    🔴 母集団は稼働中の契約（goal_act）なので、達成率は**まだ伸びる途中の値**（右側打ち切り）。
    100% に届いたものだけが「達成」で確定する（承諾数は減らない）。それ以外は未確定なので、
    0% を赤（■まずい）・1〜50% を山吹（▲注意）で塗ると、途中の値を確定した悪い結果として
    読ませてしまう（V9 検証。fixture では目標のある 345 件のうち 198 件が 0% で、
    始まったばかりの契約も入っている）。未確定の帯は判定の色を使わず、goalBandOpen で
    中空＋破線にする。濃さの違う藍〜灰で段を分け、名前と件数は凡例に必ず出す */
function goalBandColor(label) {
  const s = String(label || "");
  if (s.startsWith("未記入") || s.startsWith("承諾数が空")) return C.ghost;   /* 値が無い。0% ではない */
  if (s === "100%以上") return C.midori;
  if (s.startsWith("50")) return C.ai;
  if (s.startsWith("1〜")) return C.ink2;
  if (s.startsWith("0%")) return C.ink3;
  return C.ghost;
}
/** 未確定（途中の値）の帯か。100%以上と値が無い帯以外 */
const goalBandOpen = (label) => /^(50|1〜|0%)/.test(String(label || ""));
function renderOutcome(D) {
  const ga = D.goal_act, gl = D.goal_all, ef = D.efficiency, R = D.risk, cs = D.contact_source;
  let h = sec("問い", "成果は出ているか、どこが危ないか") +
    note("def", "この画面で数えていないもの",
      "成約率・継続率・MTG件数・メール件数ではありません。<b>接触 ＝ MTG または60秒超の通話</b>で、" +
      "メールは数えていません。<b>接触は検知にだけ使っています。処方には使いません。</b>" +
      "中盤に接触が増えるのは「火消し」で、結果が原因より後に来ています。");

  h += sec("図", "目標に対する進捗");
  /* 🔴 真ん中の帯を SERIES で順に塗っていたので、「50〜100%」が赤・「1〜50%」が緑になり、
     色の意味（赤＝まずい・緑＝良い）が逆転していた（V9 目視）。帯の名前で決める。
     🔴 さらに稼働中の達成率は途中の値なので、100% 未満は中空＋破線（V9 検証。goalBandColor） */
  const gparts = ga.bands.map((b) => ({
    label: b.label, v: b.n,
    color: goalBandColor(b.label),
    open: goalBandOpen(b.label),
    faint: goalBandColor(b.label) === C.ghost }));
  const noSyo = ga.bands.filter((b) => b.label.startsWith("承諾数が空"))
    .reduce((a, b) => a + b.n, 0);
  h += fig("達成率 ＝ 承諾数 ÷ 採用目標数", "目標が入っている契約だけが母数",
    svgStack({ w: 680, parts: gparts }),
    stackLegend(gparts) +
    '<i class="full"><b>稼働中の契約なので、100% 未満はまだ伸びる途中の値です</b>' +
    "（中空・破線）。0% には始まったばかりの契約も入っています。「達成できなかった」とは読めません。</i>" +
    '<i class="full"><b>目標が入っているのは稼働中の ' + pct1(ga.fill_rate) + "（" +
    num(ga.has_goal) + " / " + num(ga.pop) + "）だけです。</b>全件では " + pct1(gl.fill_rate) +
    "。入っていない取引は「達成率0%」ではなく、母数に入っていません。" +
    (noSyo ? "目標はあるのに承諾数が空の " + num(noSyo) + " 件は、達成率が出せないので別の帯にしています。" : "") +
    "　中央値（稼働中）" + (ga.median == null ? DASH : pct1(ga.median * 100)) + "</i>");

  h += sec("図", "求人票あたりの応募効率");
  h += fig("応募数 ÷ 掲載数", "結果ごとのばらつき",
    svgBoxH({ w: 680, xFmt: F.d1,
      rows: ef.groups.filter((g) => g.box && g.box.n >= MIN_N).map((g) => ({
        label: g.label, med: g.box.median, q1: g.box.q1, q3: g.box.q3,
        min: g.box.min, max: g.box.max, mean: g.box.mean, n: g.box.n,
        /* 🔴 filter 後の並び順で SERIES を回していて、「解約した」が赤・「充足」が緑になり、
           グループが1つ落ちると色がずれていた（V9 検証）。充足は継続率では解約側の分子なので
           緑（良い）は誤読になる。群の名前は左に書いてあるので、色は1つにそろえる */
        color: C.ai })) }),
    lg("line", C.ink, "中央値") +
    droppedNote(ef.groups, (g) => (g.box ? g.box.n : 0), (g) => g.label) +
    '<i class="full">' + esc(ef.caveat) + "　掲載数が入っているのは 稼働中 " +
    num(ef.has_keisaisu_act) + " / " + num(ef.n_act) + "。</i>" +
    /* 🔴 結果の決まっていない取引は「継続した」に混ぜない（fix/cs-rust N19）。外した件数を出す */
    (ef.n_pending_excluded
      ? '<i class="full">結果待ち（稼働中など）の ' + num(ef.n_pending_excluded) +
        " 件は、結果が決まっていないので3つの群のどれにも入れていません。</i>"
      : ""));
  /* 🔴 以前は結果待ちを「継続した」に混ぜていて差がほとんど無く見えた。
     決着の3群で比べ直すと向き（解約 ＜ 継続）は出る（fix/cs-rust N19）。ただし群の代表値を比べただけ */
  h += note("bad", "資料の「8.1 ≪ 14.5」は、そのままの値では再現しません",
    "向き（解約 ＜ 継続）は合っています。ただし群の代表値を比べただけで、平均は外れ値に引かれます。" +
    "<b>単独で解約を見分けられる指標かは、ここからは言えません</b>。");

  h += sec("図", "リスクは2軸だけで見る");
  h += note("info", "4軸のうち2軸を意図的に外しています。手抜きではありません",
    "<b>関係性の軸（NPS）</b>：稼働中の半分にしか値が無く、<b>構造的に発火しません</b>。" +
    "常に非赤の軸を並べると「問題ない」と読まれますが、実際は<b>測れていないだけ</b>です" +
    "（NPS は①で独立した指標として出しています）。<br>" +
    "<b>モデルの軸（churn予測）</b>：本番が StratifiedKFold のままで、同じ顧客が継続契約で" +
    "複数の取引を持つため <b>AUC が上振れします</b>。説明できない順位を現場に出せません。");
  const rparts = R.bands.map((b) => ({
    label: b.label, v: b.n,
    color: b.label.startsWith("2") ? C.hi : b.label.startsWith("1") ? C.ki : C.midori }));
  h += fig("稼働中 " + num(R.n_act) + " 件の帯", "2軸とも赤 ＝ 最優先",
    svgStack({ w: 680, parts: rparts }),
    stackLegend(rparts) +
    '<i class="full">③放置: 赤 ' + num(R.ax3["赤"]) + " / 白 " + num(R.ax3["白"]) +
    " / 未測定 " + num(R.ax3["未測定"]) + "（" + esc(R.ax3.rule) + "）<br>" +
    "④収益: 赤 " + num(R.ax4["赤"]) + " / 白 " + num(R.ax4["白"]) +
    " / 未測定 " + num(R.ax4["未測定"]) + "（" + esc(R.ax4.rule) + "）<br>" +
    "接触の記録が1つも無い " + num(R.ax3["未測定"]) +
    " 件は<b>赤にせず「未測定」として分けています</b>。記録が無いことと放置は別です。" +

    '<i class="full">' + esc(R.order_note) + "</i>");

  h += sec("表", "最優先（2軸とも赤・" + num(R.top.length) + " 件）");
  h += '<div class="lede">金額が大きい順。' + esc(R.order_note) + "</div>";
  h += scroll(table([{ t: "取引" }, { t: "ステージ" }, { t: "金額", n: 1 },
                     { t: "満了まで", n: 1 }, { t: "③ 放置" }, { t: "接触の記録", n: 1 }],
    R.top.map((r) => [esc(r.name || r.deal_id),

        (r.never_after_start ? " &#9650;</b>" : "</span>"),
      r.n_contact ? num(r.n_contact) + "件" : DASH])), 420);
  return h + foot(D.meta, true);   /* 数えていないものは頭の枠で書いた（V21: 上下で2回出ていた） */
}

/* ================================================================ 9 データ品質 */
function renderDq(D) {
  let h = sec("問い", "この画面の数字を、どこまで信じてよいか") +

  /* ---- 法人番号の出どころ ---- */
  h += sec("図", "法人番号の出どころ");
  /* 判定はサーバのキー（deal / company）のまま、出す名前だけ置き換える（V3）。
     🔴 山吹は「読むのに注意が要る」の色。会社由来は注意の印ではないので紫にする（V9） */

  h += fig("結果ごとの記入率", "色が濃いほど埋まっている",

      cols: groups,
      rows: fields.map((f) => ({
        label: dispName(f),
        cells: groups.map((g) => {
          const r = D.outcome_bias.rows.find((x) => x.group === g && x.field === f);

        }),

    "うまくいかなかった契約ほど数字が残っていないので、" +
    "「継続するほど成果が良い」という見え方が強く出ます。");
