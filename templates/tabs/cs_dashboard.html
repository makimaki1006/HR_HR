/* 選んだ案件だけの D を作る。
   🔴 **画面の全部が選択に追従する**ようにするため、図・表・KPI・合計を
      ここで一度に絞る。どこか1つでも全件のまま残ると画面の中で数字が食い違う。 */
function custFilter(D, ids) {
  const keep = (x) => ids.has(x.deal_id);
  const ds = (D.deals || []).filter(keep);
  const sum = (f) => {
    let s = null;
    for (const d of ds) if (d[f] != null) s = (s || 0) + d[f];
    /* 🔴 1件も値が無ければ null。0 と「値が無い」を分ける */
    return s;
  };
  /* 前段比の分子・分母。🔴 **両方の値がある取引だけ**で足す（svgFunnel の pair）。
     段ごとの合計どうしで割ると、片方しか入っていない取引で集合がずれて 100% を超える */
  const pair = (a, b) => {
    const both = ds.filter((d) => d[a] != null && d[b] != null);
    return { num: both.reduce((s, d) => s + d[b], 0),
             den: both.reduce((s, d) => s + d[a], 0), n: both.length };
  };
  /* 最終満了は選んだ契約から取り直す。サーバの値はオプション契約も含めた全取引の最大で、
     チェックを外しても動かなかった（U11） */
  const lastExp = ds.reduce((m, d) => (d.expiration && d.expiration > m ? d.expiration : m), "");
  return Object.assign({}, D, {
    deals: ds,
    monthly: (D.monthly || []).filter(keep),
    contacts: (D.contacts || []).filter(keep),
    /* 🔴 MTG の履歴も絞る。ここが漏れると「40件中1件」に絞っても
       MTG の履歴だけ全拠点の 33件のまま出ていた（2026-09-23 実機, U7） */
    mtgs: (D.mtgs || []).filter(keep),
    cpa3: (D.cpa3 || []).filter(keep),
    handover: (D.handover || []).filter(keep),
    cpa_by_site: (D.cpa_by_site || [])
      .map((st) => ({ site: st.site, points: (st.points || []).filter(keep) }))
      .filter((st) => st.points.length),
    funnel: { oubo: sum("oubo"), mensetu: sum("mensetu"), syoudaku: sum("syoudaku"),
              pair_mensetu: pair("oubo", "mensetu"), pair_syoudaku: pair("mensetu", "syoudaku") },
    customer: D.customer && Object.assign({}, D.customer, {
      deals: ds.length,
      active: ds.filter((d) => d.is_active).length,
      ltv: sum("amount"),
      /* 一覧（CS_顧客）の LTV はオプション契約も足した値で、この画面の取引は
         オプションを外している。全部にチェックが入っていても一致しないので、
         元の値も持っておいて KPI に並べる（fixture 実測: 表示対象 517法人のうち
         一覧の LTV が全取引の合計と一致 517、本体契約だけの合計と一致 409） */
      ltv_index: D.customer.ltv,
      last_expiration: lastExp || null,
      /* 一覧の「最終満了」もオプション契約込みの値。LTV と同じく元の値も持っておき、
         食い違うときは理由を書く（U11） */
      last_expiration_index: D.customer.last_expiration,
      sites: new Set(ds.map((d) => d.site)).size,
      max_renewal_no: ds.reduce((m, d) => Math.max(m, d.renewal_no || 0), 0),
    }),
  });
}

/* 顧客1件の中身。`want` に入れた節だけを出す。
   節の中身はいままでのまま。粒度ごとに要る節が違うので、出し分けだけを足した。 */
/** 横棒の図に、行ごとの比べる値（中央値など）を印で重ねる。
    🔴 svgBarH には印を置く口が無い（部品は「図の部品チーム」の持ち物で、ここでは変えない）。
    描かれた SVG の目盛り（gridline の x と、目盛りの値）から尺度を読み取り、行の y は左のラベルから取る。
    尺度は svgBarH と同じ ticks(0, 最大値, 4, 最小刻み) で目盛りの値を作って対応させる。
    🔴 比べる中央値は稼働中の契約どうしから出した値（routes.rs の band_median は is_active のときだけ）で、
       未確定。中まで塗った丸で描いていて、規律「未確定は中空の印と破線」と合わなかった
       （2026-09-23 検証）。中空・破線の丸にする（凡例は lg("ring")）。
    🔴 印の値が軸の最大を超えるときは右端に寄せるしかない。前は「軸の外」を title
       （マウスを乗せたときだけ出る）にしか書いておらず、スマホでは右端の値と読まれるおそれがあった。
       右端には丸ではなく右向きの三角を置き、見える文字（行の注記）にも「軸の外」と書く（custBlocks）。
    marks: 行と同じ並びの値（null は印を置かない） */
function barMarks(svg, rows, marks, fmt) {
  const s = String(svg);
  if (!marks.some((m) => m != null) || s.indexOf("<svg") !== 0) return s;
  /* 🔴 svgBarH は最大値を覆う目盛りを1段足す（coverTicks）。軸の端はその目盛りなので、
     同じ計算で目盛りと軸の端を出す（図の部品と文言の統合, 2026-09-23） */
  const tv = coverTicks(ticks(0, barHi(rows), 4, minStepOf(fmt)), barHi(rows));
  const hi = barHi(rows, fmt);
  const gx = [...s.matchAll(/<line class="gridline" x1="([0-9.]+)"/g)].map((m) => +m[1]);
  const ly = [...s.matchAll(/<text class="axl" x="[0-9.]+" y="([0-9.]+)"/g)].map((m) => +m[1] - 4);
  if (gx.length !== tv.length || tv.length < 2 || ly.length !== rows.length) return s;
  const k = (gx[gx.length - 1] - gx[0]) / (tv[tv.length - 1] - tv[0]);
  const X = (v) => gx[0] + (Math.min(v, hi) - tv[0]) * k;
  const open = `style="fill:var(--panel);stroke:${C.ink}" stroke-width="1.6" stroke-dasharray="2 1.6"`;
  let g = "";
  marks.forEach((m, i) => {
    if (m == null) return;
    const out = m > hi, x = X(m), y = ly[i];
    const t = `<title>${esc(rows[i].label)}: 比べる中央値 ${esc(fmt(m))}${out ? "（軸の外）" : ""}</title>`;
    g += out
      ? `<path d="M${(x - 7).toFixed(1)} ${(y - 5).toFixed(1)}L${x.toFixed(1)} ${y.toFixed(1)}L${(x - 7).toFixed(1)} ${(y + 5).toFixed(1)}Z" data-mark="band-out" ${open}>${t}</path>`
      : `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.5" data-mark="band" ${open}>${t}</circle>`;
  });
  return s.replace(/<\/svg>$/, g + "</svg>");
}
/** svgBarH の軸の最大（v と v0 の最大）。fmt を渡すと、目盛りを1段足した後の軸の端
    （svgBarH の中の計算と同じ。diverging でない図だけ） */
function barHi(rows, fmt) {
  const vs = rows.filter((r) => r.v != null).map((r) => r.v)
    .concat(rows.filter((r) => r.v0 != null).map((r) => r.v0));
  const hi = Math.max(...vs, 0);
  if (!fmt) return hi;
  const tk = coverTicks(ticks(0, hi, 4, minStepOf(fmt)), hi);
  return Math.max(hi, tk[tk.length - 1]);
}
/** 採用単価の図の棒を、規律どおりの見た目に描き替える（svgBarH の出力を後から直す。部品は変えない）。
    🔴 稼働中の契約（採用がまだ伸びる途中）を「薄く塗った棒」で描いていた。形は確定と同じで、
       色の濃さでしか区別できなかった（色だけで伝えている）。規律と「定義と検証」の表は
       「未確定は中空の印と破線」なので、open の行の棒を中空・破線にする（svgStack の open と同じ描き方）。
    🔴 月割りは svgBarH の v0（点線の枠）で描いていて、破線が「未確定」と「月割り」の2つの意味を
       持っていた。さらに枠は行の色で描かれるので、稼働中の行を灰にしたら凡例（藍）と色も合わなかった
       （2026-09-23 検証）。月割りは棒の上の縦の線（墨・実線）にして、破線を未確定だけに使う。
    rows: svgBarH に渡した行（open: 未確定か）。形が読めないときは何もしない（見張りが落ちる） */
function cpa3Bars(svg, rows) {
  const s = String(svg);
  const withV = rows.filter((r) => r.v != null);
  const barRe = /<rect x="([0-9.]+)" y="([0-9.]+)" width="([0-9.]+)" height="([0-9.]+)" rx="2" style="fill:([^"]+)" opacity="[.0-9]+">(<title>[^<]*<\/title>)<\/rect>/g;
  if ((s.match(barRe) || []).length !== withV.length) return s;
  let i = 0;
  const f1 = (v) => (+v).toFixed(1);
  return s.replace(barRe, (all, x, y, w, h, col, t) => {
    const r = withV[i++];
    if (!r || !r.open) return all;
    return `<rect x="${f1(+x + 0.8)}" y="${f1(+y + 0.8)}" width="${f1(Math.max(0.5, +w - 1.6))}" height="${f1(+h - 1.6)}" rx="2" ` +
      `style="fill:var(--panel);stroke:${col}" stroke-width="1.6" stroke-dasharray="4 3" data-open="1">` +
      t.replace("</title>", "（未確定・稼働中）</title>") + "</rect>";
  }).replace(/<rect x="([0-9.]+)" y="([0-9.]+)" width="([0-9.]+)" height="([0-9.]+)" rx="2" fill="none" style="stroke:[^"]+" stroke-width="1.2" stroke-dasharray="3 2.4" opacity=".75"><title>前回: ([^<]*)<\/title><\/rect>/g,
    (all, x, y, w, h, t) => {
      const xe = f1(+x + +w);
      return `<line x1="${xe}" y1="${f1(y)}" x2="${xe}" y2="${f1(+y + +h)}" style="stroke:${C.ink}" stroke-width="2.4" data-mark="monthly">` +
        `<title>月割り: ${t}</title></line>`;
    })
    /* 月割りが 0 付近で枠を描かなかった行（svgBarH は縦の破線だけ置く）も、同じ月割りの縦の線にする */
    .replace(/<line data-v0tick="1" x1="([0-9.]+)" y1="([0-9.]+)" x2="[0-9.]+" y2="([0-9.]+)" style="stroke:[^"]+" stroke-width="2" stroke-dasharray="2.4 1.6"><title>前回: ([^<]*)<\/title><\/line>/g,
      (all, x, y1, y2, t) =>
        `<line x1="${x}" y1="${f1(+y1 + 2)}" x2="${x}" y2="${f1(+y2 - 2)}" style="stroke:${C.ink}" stroke-width="2.4" data-mark="monthly">` +
        `<title>月割り: ${t}</title></line>`);
}
function custBlocks(D, want) {
  if (!D.meta.found) return note("warn", "見つかりません", "この法人の取引がありません。");
  const c = D.customer;
  let h = "";
  if (want.has("head")) h += sec("顧客", c && c.name ? c.name : D.meta.houjin) +
    (customerReason
      ? note("info", "この顧客を既定で開いています", esc(customerReason) +
             "　上の選択から別の法人に切り替えられます。")
      : "") +
    '<div class="kpis">' +
    kpi("取引", num(c.deals) + '<span class="u">件</span>', "稼働中 " + num(c.active)) +
    kpi("拠点", num(c.sites) + '<span class="u">拠点</span>', "") +
    kpi("LTV", yen(c.ltv),
        /* 🔴 一覧の LTV と食い違う理由を書く。黙って別の値を出すと「どちらが正しいか」になる */
        c.ltv_index != null && c.ltv_index !== c.ltv
          ? "選んだ契約の金額の合計（オプション契約を除く）。法人一覧の LTV " +
            yen(c.ltv_index) + " はオプション契約も含みます"
          : "選んだ契約の金額の合計") +
    kpi("継続回数（最大）", num(c.max_renewal_no), "") +
    /* 🔴 29px の数字の大きさのままだと「2027-02-」「28」で折り返していた（2026-09-23 実機、
       1440px でも 400px でも）。日付は小さめの字で1行に収める（.kpi.is-date） */
    kpi("最終満了", esc(c.last_expiration || "—"),
        /* 🔴 LTV と同じ理由で食い違う。オプション契約の満了日が本体より遅い法人だけ */
        c.last_expiration_index && c.last_expiration_index !== c.last_expiration
          ? "選んだ契約の満了日の最大（オプション契約を除く）。法人一覧の最終満了 " +
            esc(c.last_expiration_index) + " は全取引（オプション契約を含む）の最大です"
          : "", "date") + "</div>";

  /* ---- 顧客に説明する数字 ---- */
  if (want.has("funnel")) {
  h += sec("図", "顧客に説明する数字");
  const fn_ = D.funnel;
  h += fig("応募 → 面接 → 採用 の落ち方", "取引をまたいだ合計",
    svgFunnel({ steps: [
      { label: "応募", v: fn_.oubo, color: C.ai },
      { label: "面接", v: fn_.mensetu, color: C.ki, pair: fn_.pair_mensetu },
      { label: "採用", v: fn_.syoudaku, color: C.midori, pair: fn_.pair_syoudaku },
    ], alt: "応募から採用までの落ち方" }),
    '<i class="full">値が入っている契約だけを足しています。' +
    "<b>入っていないものを 0 として足していません</b>（母数が変わるため）。</i>" +
    '<i class="full">「前段の N%」は<b>前の段と両方の値が入っている契約だけ</b>で割っています' +
    (fn_.pair_mensetu
      ? "（面接÷応募は " + num(fn_.pair_mensetu.n) + " 件、採用÷面接は " +
        num(fn_.pair_syoudaku.n) + " 件）"
      : "") +
    "。棒の合計どうしで割ると、片方しか入っていない契約のぶん集合がずれます。</i>");
  }

  /* ---- 採用単価を3つの出し方で ---- */
  if (want.has("cpa3")) {
  h += sec("図", "採用単価を3つの出し方で見る");
  const c3 = D.cpa3.filter((x) => x.total != null);
  /* 🔴 未確定の見た目を right_censored だけで決めていて、稼働中の契約（採用がまだ伸びる途中）も
     確定と同じ藍で塗っていた。凡例には「同（未確定・稼働中）」の灰があるのに、棒は全部藍
     （2026-09-23 実機。fixture の h00f31a786bac では稼働中 2 件のうち censored は 1 件だけで、
     総額が出ている稼働中の 1 件が藍だった）。稼働中も未確定にする。
     🔴 その未確定を「薄く塗った灰の棒」で描いていたのは規律と違った（形が確定と同じで、濃さでしか
     分からない）。未確定は中空・破線の棒（cpa3Bars）、月割りは縦の線、中央値は中空・破線の丸 */
  const open3 = (x) => !!(x.censored || x.active);
  const c3rows = c3.map((x) => ({
    label: shortName(x.name || x.deal_id, 20), full: x.name || x.deal_id,
    v: x.total, v0: x.monthly,
    /* 🔴 採れた人数は値の横に括弧で付ける。前は注記の頭（「　2人」）に置いていて、
       値の文字が長い行で「162万2人」とくっついて読めた（2026-09-24 実機・柏原）。
       値の文字に入れておけば、図の部品が値の幅を取ってから注記を置く */
    txt: yen(x.total) + (x.syoudaku != null ? "（" + num(x.syoudaku) + "人）" : ""),
    note: "",
    /* 採用単価は量なので赤を使わない（V9）。確定も未確定も藍で、塗りか中空かで分ける */
    color: C.ai,
    open: open3(x),
  }));
  /* 中央値が軸の最大（総額・月割りの最大）を超える行は、図の右端に寄せて描くしかない。
     見える文字にも「軸の外」と書く（title だけだとスマホで見えない） */
  const hi3 = barHi(c3rows, F.man);
  c3rows.forEach((r, i) => {
    const x = c3[i];
    r.note = (x.band ? "進捗帯「" + x.band + "」の中央値 " +
               (x.band_median == null ? "なし（n<" + MIN_N + "）"
                 : yen(x.band_median) + (x.band_median > hi3 ? "（軸の外）" : "")) : "");
  });
  const hasMed = c3.some((x) => x.band_median != null);
  /* 🔴 横軸の目盛り（0 50 100…）に単位が無かった（2026-09-24 実機）。軸の題名を渡し、副題でも単位を言う */
  h += fig("同じ契約でも、出し方で値が変わります",
    "顧客が見ているのは「1人採るのにいくらかかったか」。横軸は採用単価（万円）",
    c3.length
      ? barMarks(cpa3Bars(svgBarH({ w: 700, fmt: F.man, rh: 26, xLab: "採用単価（万円）", rows: c3rows }), c3rows), c3rows,
          c3.map((x) => x.band_median), F.man)
      : '<div class="empty">採用数が入っている契約がありません（0で割っていません）。</div>',
    /* 凡例の粒は図と同じ描き方（塗りの濃さは BAR_OP、未確定は中空・破線、月割りは墨の縦の線） */
    lg("box", C.ai, "総額 ÷ 採用数（確定）", BAR_OP) +
    lg("openbox", C.ai, "同（未確定・稼働中。中空・破線）") +
    lg("tick", C.ink, "月割り（縦の線）") +
    (hasMed ? lg("ring", C.ink, "同じ進捗帯の中央値（稼働中の契約どうしなので未確定）") : "") +
    '<i class="full">稼働中の契約は<b>金額が丸ごと乗っているのに採用がまだ伸びていない</b>ので、' +
    "総額での単価は必ず高く出ます。月割り（金額 ÷ 契約期間 × 経過月数 ÷ 採用数）と、" +
    "<b>同じ進捗帯の契約の中央値</b>を並べています。3つが食い違うときは、進捗帯の中央値を見てください。</i>");
  }

  /* ---- 拠点ごとの推移 ---- */
  if (want.has("cpasite")) {
  h += sec("図", "採用単価の推移（拠点ごと）");
  /* 「1本の線にまとめない理由」の枠は、法人番号で見るの頭の枠と同じ話なので出さない（2026-09-24 実機） */
  /* 🔴 点が1つの拠点ごとに「線にしていません」の空の枠を1つずつ出していて、
     空の枠が縦に何十も続いていた（V11 目視: ページが約 28,000px）。
     線にできない拠点は最後に1つの枠へまとめる（値は残す）。 */
  const oneCpa = [];
  for (const st of D.cpa_by_site) {
    const pts = st.points.map((p) => ({ v: p.cpa, censored: !!p.censored }));
    if (pts.length < 2) { oneCpa.push(st); continue; }
    h += fig("採用単価の推移 — " + shortName(st.site, 28), "点の下は採れた人数",
      svgLine({ w: 660, h: 200,
            x: st.points.map((p) => (p.start || "").slice(2, 7)),
            xSub: st.points.map((p) => (p.syoudaku == null ? "" : num(p.syoudaku) + "人")),
            /* 採用単価は量なので赤を使わない（V9）。未確定は中空・破線で分かる */
            series: [{ color: C.ai, pts: pts }],
            yFmt: F.man, yLab: "採用単価（万円）", alt: "採用単価の推移" }),
      lg("dot", C.ai, "確定した契約") + lg("ring", C.ai, "未確定（右側打ち切り）"));
  }
  if (oneCpa.length) {
    /* 🔴 未確定（稼働中）の値は総額が丸ごと乗っていて高く出る。確定値と同じ見た目で
       並べていた（V11 検証）。図の中空＋破線と同じ意味を、文字で「未確定」と添えて分ける */
    const anyOpen = oneCpa.some((st) => st.points.some((p) => p.censored));
    h += note("info", "点が1つしかない拠点（" + num(oneCpa.length) + "）は線にしていません",
      oneCpa.map((st) => esc(shortName(st.site, 28)) + " " +
        st.points.map((p) => (p.censored
          ? '<span class="muted">' + yen(p.cpa) + "（未確定・稼働中）</span>"
          : yen(p.cpa))).join(" / ")).join("<br>") +
      (anyOpen ? "<br>「未確定」は稼働中の契約で、総額が丸ごと乗っているので単価が高く出ます。" : ""));
  }
  }

  /* ---- 応募・面接・採用の推移 ---- */
  if (want.has("monthly")) {
  h += sec("図", "応募・面接・採用の推移");
  h += note("info", "現在値ではなく、プロパティの変更履歴を使っています",
    "HubSpot のプロパティは上書きで履歴が残らないため、現在値を時系列に並べると" +
    "<b>決着後に入力された値が契約中に伸びたように見えます</b>" +
    "（実測で応募数の変更の 30.4%・採用数の 35.2% が決着日より後）。<br>" +
    "値が変わらなかった月は<b>前の値を持ち越し</b>、中空・破線で描いています。" +
    "実線・塗りつぶしはその月に書き換えがあった印です。");
  /* 🔴 変更履歴が無い契約ごとに「変更履歴がありません」の空の枠を出していて、
     空の枠が大量に続いていた（V11 目視）。まとめて1つの枠にし、どの契約かは名前で残す */
  const noHist = [];
  let laneWhy = false;   /* 「1つの縦軸に重ねていません」をもう出したか */
  let laneEx = false;    /* 読み方の例（NPS と接触）をもう出したか */
  /* 系列の図を描く契約の数。「下に続く契約の図も同じです」は2つ以上のときだけ言う */
  const nLaneFig = D.monthly.filter((mm) =>
    ["oubo", "mensetu", "syoudaku"].some((k) => ((mm.series || {})[k] || []).length)).length;
  for (const mm of D.monthly) {
    const ser = mm.series || {};
    const any = ["oubo", "mensetu", "syoudaku"].some((k) => (ser[k] || []).length);
    if (!any) { noHist.push(mm); continue; }
    const months = [...new Set([].concat(...["oubo", "mensetu", "syoudaku"]
      .map((k) => (ser[k] || []).map((x) => x.m))))].sort((a, b) => a - b);
    const mk = (k) => months.map((mi) => {
      const f = (ser[k] || []).find((x) => x.m === mi);
      return f ? { v: f.v, carry: f.carry } : { v: null };
    });
    /* 🔴 横軸は**暦の月**。変更履歴が月単位なので、契約の「何ヶ月目」では並べられない。
       以前は「1ヶ月」「2ヶ月」…と出していて、月の途中に始まった6ヶ月契約（3/19〜9/18）の
       横軸が「7ヶ月」まであり、「契約 6ヶ月」と食い違って見えた（案件一覧の稼働中604件のうち553件がこの形）。
       暦の月で出し、期間より多い月にまたがる理由を横に書く（span_months はサーバ） */
    const xCal = months.map((m) => calMonth(mm.start, m));
    const gap = histGap(mm, months);
    h += fig(shortName(mm.name || mm.deal_id, 28) + " の推移",
      spanHint(mm) + (gap ? "。" + gap : ""),
      svgLine({ w: 680, h: 220,
        x: xCal,
        series: [
          { color: C.ai, pts: mk("oubo") },
          { color: C.ki, pts: mk("mensetu") },
          { color: C.midori, pts: mk("syoudaku") },
        ], yFmt: F.int, yLab: "件", alt: "応募・面接・採用の推移" }),
      lg("line", C.ai, "応募") + lg("line", C.ki, "面接") + lg("line", C.midori, "採用") +
      lg("dash", C.ghost, "持ち越し（その月に書き換えが無い）"));

    /* ---- 系列を縦に積む ---- */
    const npsSer = mm.nps || {};
    // 🔴 何回目の定期かを点に載せる。載せないと図の文字が「定期undefined」になる。
    //    キーは nps / nps2 … nps11 で、末尾の数字が回数（nps だけ 1 回目）。
    const npsRound = (k) => (k === "nps" ? 1 : parseInt(k.slice(3), 10) || null);
    const npsPts = months.map((mi) => {
      let hit = null;
      for (const k of Object.keys(npsSer)) {
        const f = (npsSer[k] || []).find((x) => x.m === mi);
        if (f && (hit == null || !f.carry)) hit = { v: f.v, carry: f.carry, round: npsRound(k) };
      }
      return hit || { v: null };
    });
    const ct = (D.contacts || []).find((x) => x.deal_id === mm.deal_id);
    /* 🔴 棒の帯（bars）は p.fill / p.out を読む。{v:n} だけ返すと棒が1本も立たず、
       上限も「1」のまま空の帯になっていた（2026-09-23 実機, U2）。
       接触は「MTG・60秒超の通話」の1種類なので塗り（fill）に入れる。
       v は帯が空かどうかの判定に使う（取引に接触の記録が無ければ null）。 */
    const ctPts = months.map((mi) => {
      if (!ct) return { v: null };
      const n = ct.dates.filter((d) => monthIdx(mm.start, d.slice(0, 7)) === mi).length;
      return { v: n, fill: n };
    });
    const lane = (label, color, pts, type, noneLabel, fillLabel) => {
      const has = pts.some((p) => p.v != null);
      return { label: label, color: color, type: type || "line",
               pts: pts, empty: !has, noneLabel: noneLabel || "記録がありません",
               fillLabel: fillLabel || label };
    };
    /* 🔴 「NPS が落ちた月に…が読めます」は、NPS と接触の両方に記録がある契約でしか言えない。
       NPS の記録が無い契約にもこの文が出ていた（V11 目視） */
    const hasNps = npsPts.some((p) => p.v != null);
    const hasCt = ctPts.some((p) => p.v != null);
    /* 🔴 NPS が上がった契約にも「NPS が落ちた月に接触が切れていて…が読めます」と出て、
       例文が結論のように読めた（2026-09-24 実機）。例であることを文の中で言う */
    /* 🔴 読み方の例を契約ごとの図の副題に毎回出していて、既定の事業所で17回並んでいた
       （2026-09-24 検証）。例はどの契約でも同じなので、NPS と接触の両方がある最初の図だけに出す */
    const ex = hasNps && hasCt && !laneEx;
    if (ex) laneEx = true;
    h += fig(shortName(mm.name || mm.deal_id, 28) + " — 系列を縦に並べる",
      ex
        ? "縦に目を落とすと、同じ月に何が起きていたかが読めます" +
          "（読み方の例:「NPS が落ちた月に接触が切れていたか」。この契約がそうだという意味ではありません）"
        : "縦に目を落とすと、同じ月に何が起きていたかが読めます" +
          (hasNps ? "" : "（この契約には定期NPS の回答がありません）"),
      svgStackLanes({ w: 940, months: xCal, lanes: [
        lane("応募", C.ai, mk("oubo")),
        lane("面接", C.ki, mk("mensetu")),
        lane("採用", C.midori, mk("syoudaku")),
        lane("定期NPS", C.murasaki, npsPts, "dots", "回答がありません"),
        /* 接触は「あった」印なので赤（まずい）で塗らない（V9）。fillLabel は U2 */
        lane("接触（MTG・60秒超の通話）", C.ink2, ctPts, "bars", "接触の記録がありません", "接触"),
      ] }),
      /* 🔴 histGap の断り書きは上の図の副題に1回だけ出す。ここにも出していて、
         1つの契約で同じ文が2回（既定の法人では1画面に28回）並んでいた（2026-09-24 検証）。
         この図の横軸は上の図と同じ月なので、読む人は上の副題で分かる */
      /* 🔴 この段落を契約ごとの図の下に毎回出していて、既定の事業所で約20回並んでいた
         （2026-09-24 実機）。どの図でも同じ決まりなので、最初の図の下の1回だけにする */
      (laneWhy ? "" :
      '<i class="full"><b>1つの縦軸に重ねていません。二軸も使っていません。</b>' +
      "値の幅が違いすぎる（応募 0〜200 / NPS 0〜10 / 接触 0〜数十）ので、" +
      "重ねると応募だけが動いて NPS が底に張り付きます。" +
      "目盛りの取り方しだいで「相関して見える絵」を作れてしまうため、" +
      "<b>横軸だけを共有して、系列ごとに自分の縦軸を持たせています</b>。" +
      /* 🔴 契約の図が1つしかない事業所でも「下に続く…」と出ていた（2026-09-24 検証） */
      (nLaneFig > 1 ? "下に続く契約の図も同じです。" : "") + "</i>"));
    laneWhy = true;
  }
  if (noHist.length) {
    h += note("info", "応募・面接・採用の変更履歴が無い契約（" + num(noHist.length) + " 件）",
      "記録が無いだけで、0 ではありません。図にしていないのは次の契約です: " +
      noHist.map((mm) => esc(shortName(mm.name || mm.deal_id, 28))).join(" ／ "));
  }
  }

  /* ---- 接触と担当交代 ---- */
  if (want.has("timeline") &&
      ((D.handover || []).length || (D.contacts || []).some((x) => x.dates.length))) {
    h += sec("図", "こちらの動き（接触と担当交代）");
    const lanes = [];
    for (const ct of (D.contacts || [])) {
      if (!ct.dates.length) continue;
      const d = D.deals.find((x) => x.deal_id === ct.deal_id);
      lanes.push({ label: shortName((d && d.name) || ct.deal_id, 16), full: (d && d.name) || ct.deal_id, color: C.ai,
        marks: ct.dates.map((x) => ({ d: x })) });
    }
    if ((D.handover || []).length) {
      lanes.push({ label: "担当交代", color: C.hi,
        marks: D.handover.map((x) => ({ d: x.date, thick: true })),
        note: D.handover.length + "件" });
    }
    h += fig("接触と担当交代の時系列", "交代の前後で間隔が開いたかを目で見る",
      svgTimeline({ w: 940, lanes: lanes, alt: "接触と担当交代" }),
      lg("dot", C.ai, "接触（MTG・60秒超の通話）") + lg("dot", C.hi, "担当交代") +
      '<i class="full">交代の「反映なし」には、新しい担当の MTG が1回しか無く' +
      "<b>引き継ぎか代理出席か区別が付かないもの</b>が混ざります。未反映と決めつけていません。</i>");
  }

  /* ---- 表（個別の行を特定したいときだけ）---- */
  if (want.has("deals")) {
  h += sec("表", "契約の系列（" + num(D.deals.length) + " 件）");
  /* 🔴 2026-09-24 実機（1440px）: 取引・ステージ・拠点が折り返さず、12列のうち右の4列（金額から先）が切れていた。
     長い文字の列だけを折り、開始と満了は1つの列に2段で出す（取引名が2行に折れるので行の高さは変わらない。
     折るだけでは本文の幅 1,117px に 35px 足りなかった） */
  h += scroll(table([{ t: "取引", w: "l" }, { t: "ステージ", w: "s" }, { t: "拠点", w: "s" }, { t: "種別" },
                     { t: "開始〜満了" }, { t: "継続", n: 1 }, { t: "金額", n: 1 },
                     { t: "応募", n: 1 }, { t: "面接", n: 1 }, { t: "承諾", n: 1 }, { t: "状態" }],
    D.deals.map((d) => [esc(d.name || d.deal_id),
      '<span class="muted small">' + esc(d.stage) + "</span>",
      '<span class="muted small">' + esc(d.site) + "</span>",
      '<span class="muted small">' + esc(d.kind) + "</span>",
      (esc(d.start) || DASH) + "<br>〜" + (esc(d.expiration) || DASH), nz(d.renewal_no), yen(d.amount),
      nz(d.oubo), nz(d.mensetu), nz(d.syoudaku),
      (d.is_active ? "稼働中" : "") +
      (d.right_censored ? ' <span class="tag">未確定</span>' : "")]), "ser"), 420);
  }

  if (want.has("mtgs")) {
  h += sec("表", "MTG の履歴（" + num(D.mtgs.length) + " 件）");
  h += note("info", "中身が空なのは「まだ抽出していない」です",
    "記録が無いのとは違います。抽出は日次の枠で止まっており、全件には届いていません。");
  h += scroll(table([{ t: "開催日" }, { t: "リスク" }, { t: "やること", w: "l" },
                     { t: "顧客の懸念", w: "l" }, { t: "抽出" }],
    D.mtgs.map((m) => [esc(m.date), esc(m.risk) || DASH, esc(m.todo) || DASH,
      esc(m.concern) || DASH, m.extracted ? "済" : '<span class="n0">未</span>'])), 420);
  }
  return h;
}

/* ================================================================ 継続を追いかける（事業所）

   🔴 粒度は**事業所（拠点）**。決裁は事業所単位なので、ふだん見るのはこちら。
      同じ事業所が契約を重ねてきた流れ（サブスク継続①②③…）を時系列で追う。
*/
let seriesSite = "";          /* 選んでいる拠点。空なら全部 */
/* 拠点が空の取引の選択肢の値。🔴 空文字のままだと「すべての拠点」と同じ value になり、
   選んでも全部が出る（2026-09-23 実機: value が空の選択肢が1つあった, U13）。
   拠点キーには出てこない文字列にしておく（NUL は HTML の属性値で U+FFFD に化けるので使わない）。 */
const NO_SITE = "__no_site__";
const siteOf = (d) => d.site || NO_SITE;

function siteLabel(D, key) {
  if (!key) return "すべての拠点";
  const n = (D.deals || []).filter((d) => siteOf(d) === key).length;
  return (key === NO_SITE ? "拠点が入っていない" : shortName(key, 28)) +
    "（契約 " + num(n) + " 件）";
}

function renderSeries(D) {
  if (D.index) {
    return custIndex(D, "この事業所は契約を重ねてこられたか",
      "<b>粒度は事業所です。</b>決裁は事業所単位なので、ふだん見るのはこちらです。");
  }
  const sites = [...new Set((D.deals || []).map(siteOf))].sort();
  if (seriesSite && !sites.includes(seriesSite)) seriesSite = "";
  const ids = new Set((D.deals || [])
    .filter((d) => !seriesSite || siteOf(d) === seriesSite)
    .map((d) => d.deal_id));
  const F2 = custFilter(D, ids);

  let h = sec("問い", "この事業所は契約を重ねてこられたか");
  h += note("info", "いま見ている粒度は「事業所」です",
    "<b>拠点をまたいでいません。</b>決裁は事業所単位なので、" +
    "同じ法人でも拠点が違えば別の契約の流れとして見ます。" +
    "拠点をまたいで比べたいときは " + goLink("deal", "houjin") + " を使ってください。");

  /* 拠点の選択。件数が多いので選択式にする */
  h += '<div class="ctlbar"><label class="act">拠点 <select id="cs-site">' +
    '<option value=""' + (seriesSite ? "" : " selected") + ">" +
    esc(siteLabel(D, "")) + "（" + num((D.deals || []).length) + " 件）</option>" +
    sites.map((k) => '<option value="' + esc(k) + '"' +
      (k === seriesSite ? " selected" : "") + ">" + esc(siteLabel(D, k)) +
      "</option>").join("") + "</select></label></div>";
  h += '<div class="count-line' + (seriesSite ? " on" : "") + '">' +
    "<b>" + num((D.deals || []).length) + " 件中 " + num(F2.deals.length) +
    " 件</b>を表示" + (seriesSite ? "（" + (seriesSite === NO_SITE ? "拠点が入っていない契約"
                                  : "拠点 " + esc(shortName(seriesSite, 28))) + "）"
                                  : "（拠点で絞っていません）") + "</div>";

  /* 契約の連なり。何回目か・間が空いていないか */
  h += sec("図", "契約の連なり");
  const ordered = F2.deals.slice().sort((a, b) =>
    String(a.start || "").localeCompare(String(b.start || "")));
  h += fig("契約を古い順に並べる", "横は開始日。空きがあれば間が空いている",
    ordered.length
      ? svgTimeline({ w: 940, alt: "契約の連なり", lanes: ordered.map((d) => ({
          label: shortName(d.name || d.deal_id, 18), full: d.name || d.deal_id,
          color: d.is_active ? C.ai : C.ghost,
          /* 🔴 金額が空の契約は「3回目」だけになり、ほかの行と並べると書き漏れに見えた（2026-09-24 実機）。
             空であることを文字で書く（0 円として描かない） */
          note: (d.renewal_no ? num(d.renewal_no) + "回目" : "初回") +
                "　" + (d.amount != null ? yen(d.amount) : "金額なし"),
          marks: [d.start, d.expiration].filter(Boolean).map((x) => ({ d: x, thick: true })),
        })) })
      : '<div class="empty">この拠点に契約がありません。</div>',
    lg("dot", C.ai, "稼働中") + lg("dot", C.ghost, "決着済") +
    '<i class="full">印は契約の開始日と満了日です。' +
    "<b>間が空いていれば、その分だけ契約が途切れています。</b></i>");

  h += custBlocks(F2, new Set(["monthly", "timeline", "deals", "mtgs"]));
  return h + foot(D.meta);
}

/* ================================================================ 法人番号で見る（法人）

   🔴 粒度は**法人**。拠点をまたいで並べる。本部に持っていく話のとき用。
   🔴 案件はチェックで出し入れできる。**既定は全表示**。
      チェックを外したら図・表・KPI・合計の**全部**が追従する。
*/
let houjinPick = null;        /* deal_id -> true。null なら「まだ決めていない＝全部」 */
/* 上の「法人を選ぶ」を注力だけにするか。
   🔴 注力は**法人の大きさ**で決まる性質（日々変わらない）。
      日々変わる状態は「今日動く先」の MTG途絶の帯のほう。混ぜない。 */
let focusOnly = false;
let houjinFor = "";           /* どの法人ぶんの選択か */

function houjinIds(D) {
  const all = (D.deals || []).map((d) => d.deal_id);
  if (houjinFor !== customerHoujin || !houjinPick) {
    houjinFor = customerHoujin;
    houjinPick = {};
    all.forEach((id) => { houjinPick[id] = true; });   /* 既定は全部 */
  }
  return new Set(all.filter((id) => houjinPick[id]));
}

/* 1案件の暦月 mo（"YYYY-MM"）時点の採用数。{ v, carry } を返す。
   🔴 記録は**書き換えのあった月だけ**。間の月は前の値を持ち越す
      （サーバ側の fill_forward と同じ読み方）。持ち越した点は carry を立てる。
   🔴 **契約期間の外は null。** サーバの月次はその契約の満了後も今月まで持ち越して
      返してくるので、そのまま足すと満了した契約の累計が毎月乗り続け、
      「毎月採れている」ように見えていた（N8）。満了月で止める。
   案件ごとの線と、拠点ごとに積んだ合計の両方がこれを使う（止め方を2つ作らない）。 */
function syoudakuAt(mm, dl, mo) {
  const st = String(mm.start || "").slice(0, 7);
  const en = String((dl && dl.expiration) || "9999-12").slice(0, 7);
  if (!st || mo < st || mo > en) return { v: null };
  let last = null;
  for (const x of ((mm.series || {}).syoudaku || [])) {
    const xm = monthAdd(mm.start, x.m);
    if (xm && xm <= mo) last = { mo: xm, v: x.v, carry: !!x.carry };
  }
  if (!last || last.v == null) return { v: null };
  /* 🔴 サーバは書き換えの無い月にも点を置き、carry を立てて返す（routes の月次）。
     点がある＝その月に書かれた、ではない。前は点の有無だけで決めていたので、
     実データでは持ち越しの月もすべて「書き換えあり」の塗りで描かれていた（N8） */
  return { v: last.v, carry: last.mo !== mo || last.carry };
}

/* "YYYY-MM" の a から b まで、1か月ずつ全部。柱の間隔を暦どおりに保つため */
function monthRange(a, b) {
  const out = [];
  if (!a || !b) return out;
  let y = +a.slice(0, 4), m = +a.slice(5, 7);
  for (let k = 0; k < 600; k++) {
    const s = y + "-" + String(m).padStart(2, "0");
    if (s > b) break;
    out.push(s);
    if (++m > 12) { m = 1; y++; }
  }
  return out;
}

/* 拠点ごとに積む図の系列。色は5つなので、6拠点目からは「その他」に束ねる。
   🔴 束ねたことは凡例に拠点数で出す（黙って落とさない）。
   🔴 拠点の見分けだけなので、判定の色（赤＝まずい・山吹＝注意・緑＝良い）を使わない。
   以前は [藍, 赤, 山吹, 緑, 紫] で、2番目の拠点がいつも赤に見えていた。
   🔴 2026-09-24 実機: その後の [藍, 紫, 墨, 灰(ink-3), 灰(ink-2)] は灰色が2つ並び、
   「その他の拠点」（ghost の灰）とも見分けられなかった。灰色は「その他」だけにする。
   案件ごとの線（CASE_LINE）と同じ並び（CASE_COLORS）を使う */
const CASE_COLORS = [C.ai, C.murasaki, C.ink, C.botan, C.sora];
const SITE_COLORS = CASE_COLORS;
function siteSeries(sites, valsOf, order) {
  /* 並べ替えの基準は拠点ごとに1回だけ計算する。比較のたびに order() を呼ぶと
     O(n log n) 回の計算し直しになり、合成データの 200案件・100拠点で 272ms かかった（N8） */
  const key = new Map(sites.map((s) => [s, order(s)]));
  const sorted = sites.slice().sort((a, b) => key.get(b) - key.get(a));
  const head = sorted.slice(0, SITE_COLORS.length);
  const rest = sorted.slice(SITE_COLORS.length);
  const out = head.map((s, i) => ({ label: s === NO_SITE ? "拠点が入っていない" : shortName(s, 16),
                                    color: SITE_COLORS[i], vals: valsOf([s]) }));
  if (rest.length)
    out.push({ label: "その他の拠点（" + rest.length + " か所）", color: C.ghost, vals: valsOf(rest) });
  return out;
}

function renderHoujin(D) {
  if (D.index) {
    return custIndex(D, "この法人は拠点ごとにどう違うか",
      "<b>粒度は法人です。</b>拠点をまたいで並べます。本部に持っていく話のとき用です。");
  }
  const ids = houjinIds(D);
  const F2 = custFilter(D, ids);
  const all = D.deals || [];

  let h = sec("問い", "この法人は拠点ごとにどう違うか");
  /* 🔴 「拠点をまたいで1本の線にしない」を、この枠・採用単価の推移の前の「1本の線にまとめない理由」・
     末尾の「読むときの注意」（サーバの not_counted）の3か所で言っていた（2026-09-24 実機）。
     この枠の1回にし、文の正本はサーバの not_counted にする（末尾は foot(…, true) で基準日と件数だけ） */
  h += note("info", "いま見ている粒度は「法人」です",
    "<b>拠点をまたいで並べています。</b>ふだんの判断は事業所単位なので、" +
    "1つの事業所の流れを追うときは " + goLink("deal", "series") + " を使ってください。<br>" +
    notCounted(D.meta).replace(/<br>$/, ""));
  h += focusSection(D);

  /* ---- 案件のチェック ---- */
  h += sec("表", "見る案件を選ぶ");
  h += '<div class="ctlbar" id="hj-ctl">' +
    '<button type="button" class="act" id="hj-all">全部選ぶ</button>' +
    '<button type="button" class="act" id="hj-none">全部外す</button></div>';
  h += '<div class="pickbox" id="hj-pick">' + all.map((d) =>
    '<label class="pick"><input type="checkbox" data-d="' + esc(d.deal_id) + '"' +
    (houjinPick[d.deal_id] ? " checked" : "") + ">" +
    "<span>" + esc(shortName(d.name || d.deal_id, 34)) +
    '<span class="muted small">　' + esc(shortName(d.site, 14)) +
    (d.amount != null ? "　" + yen(d.amount) : "") +
    (d.is_active ? '　<span class="tag e">稼働中</span>' : "") +
    "</span></span></label>").join("") + "</div>";
  /* 🔴 絞ったことを忘れて全体だと読むのが、この種の画面でいちばん起きる事故 */
  /* class の中に式を書かない（CSS の静的検査がクラス名と読み違える） */
  const picked = ids.size < all.length;
  h += '<div class="count-line' + (picked ? " on" : "") + '" id="hj-count">' +
    "<b>" + num(all.length) + " 件中 " + num(ids.size) + " 件</b>を表示" +
    (picked ? "（チェックを外している案件があります）" : "（全部出しています）") +
    "</div>";

  if (!ids.size) {
    h += note("warn", "案件が1つも選ばれていません",
      "上のチェックを1つ以上入れてください。「全部選ぶ」で戻せます。");
    return h + foot(D.meta, true, houjinCounts(all, ids));
  }

  h += custBlocks(F2, new Set(["head", "funnel", "cpa3"]));

  /* ---- 案件ごとの推移 ---- */
  /* 案件ごとに契約開始日が違うので、月番号を暦の月に直してから横軸をそろえる */
  const mkMonths = () => {
    const set = new Set();
    for (const mm of F2.monthly) {
      const ser = (mm.series || {}).syoudaku || [];
      for (const x of ser) {
        const mi = monthAdd(mm.start, x.m);
        if (mi) set.add(mi);
      }
    }
    return [...set].sort();
  };
  const ms = mkMonths();

  h += sec("図", "案件ごとの採用数の推移");
  /* 🔴 **記録が無い契約は線にしない。** 0 として描くと「採れていない」に見えるが、
     実際は「プロパティの変更履歴が残っていない」だけ（古い契約ほど残っていない）。
     新しい順に、記録のあるものだけを最大12本描く。 */
  const withSer = F2.monthly
    .filter((mm) => (((mm.series || {}).syoudaku) || []).length)
    .sort((a, b) => String(b.start || "").localeCompare(String(a.start || "")));
  /* 🔴 **色は4役＋紫の5つしかない。** 6本目からは色を使い回すことになり、
     凡例を見ても線が見分けられなくなる（色だけで意味を伝えないという規律に反する）。
     線は5本までにして、それ以上見たいときは**チェックで案件を絞ってもらう**。
     チェックはそのために付けてある。 */
  const MAX_LINE = 5;
  /* 🔴 以前は [藍, 赤, …] で、2本目の案件がいつも赤（■まずい）になっていた（V9 検証）。
     案件の見分けだけなので、判定の色（赤・山吹・緑）を使わない。名前は凡例で必ず出す */
  const CASE_LINE = CASE_COLORS;   /* 灰色どうしを並べない（SITE_COLORS の注記） */
  const drawn = withSer.slice(0, MAX_LINE);
  h += fig("選んだ案件それぞれの線", "横は暦の月。1本＝1案件",
    ms.length >= 2 && drawn.length
      ? svgLine({ w: 940, h: 260, x: ms.map((m) => m.slice(2)),
          series: drawn.map((mm, i) => ({
            color: CASE_LINE[i],
            /* 持ち越した点は carry を立てて中空・破線で描く。
               契約期間の外までは伸ばさない（読み方は syoudakuAt の1か所） */
            pts: ms.map((mo) => syoudakuAt(mm,
              F2.deals.find((d) => d.deal_id === mm.deal_id), mo)),
          })), yFmt: F.int, yLab: "採用数", alt: "案件ごとの採用数の推移" })
      : '<div class="empty">線にできる月次の記録がありません（記録が無いだけで 0 ではありません）。</div>',
    /* 🔴 lg() のラベルは HTML としてそのまま入る（凡例に <strong> を使う呼び出しがあるため）。
       取引名は HubSpot で誰でも書ける文字列なので、ここで必ずエスケープする（V18） */
    drawn.map((mm, i) =>
      lg("line", CASE_LINE[i],
         esc(shortName(mm.name || mm.deal_id, 18)))).join("") +
    '<i class="full"><b>拠点をまたいで1本にしていません。</b>1本が1案件です。' +
    "選んだ " + num(F2.monthly.length) + " 件のうち、採用数の変更履歴があるのは " +
    num(withSer.length) + " 件です。" +
    "<b>履歴が無いのは「採れていない」ではなく「記録が残っていない」です</b>" +
    "（古い契約ほど残っていません）。</i>" +
    (withSer.length > MAX_LINE
      ? '<i class="full"><b>線は新しい ' + MAX_LINE + " 本だけです。</b>" +
        "色は4役＋紫の5つしかなく、6本目から色を使い回すと線が見分けられなくなるためです。" +
        "<b>見たい案件だけチェックを残すと、その案件が線になります。</b></i>"
      : ""));

  /* ---- 全体（合算）---- */
  h += sec("図", "全体（選んだ案件の合算）");
  /* 🔴 **拠点をまたいで1本の線にしない**（規律）。合算は見せるが、柱を拠点の色で積む。
     線でつなぐと拠点間のばらつきが「時間の変化」に見える。柱なら合計の高さと、
     どの拠点のぶんかが同時に読める（N8）。 */
  const dealOf = {};
  F2.deals.forEach((d) => { dealOf[d.deal_id] = d; });
  const synDeals = F2.monthly.filter((mm) => (((mm.series || {}).syoudaku) || []).length);
  const synHit = ms.filter((mo) => synDeals.some((mm) => syoudakuAt(mm, dealOf[mm.deal_id], mo).v != null));
  const synAxis = synHit.length ? monthRange(synHit[0], synHit[synHit.length - 1]) : [];
  const synSites = [...new Set(synDeals.map((mm) => siteOf(dealOf[mm.deal_id] || {})))];
  /* 🔴 書き換えのあった契約（fresh）と持ち越した契約（carry）を**分けて足す**。
     まとめて1つにすると、1件でも書き換えがあった拠点は区分全体が確定の塗りになり、
     持ち越した値まで「その月に書かれた値」の顔で描かれていた（N8）。 */
  const synVals = (sites) => synAxis.map((mo) => {
    let fresh = null, carried = null;
    for (const mm of synDeals) {
      if (!sites.includes(siteOf(dealOf[mm.deal_id] || {}))) continue;
      const r = syoudakuAt(mm, dealOf[mm.deal_id], mo);
      if (r.v == null) continue;
      if (r.carry) carried = (carried || 0) + r.v;
      else fresh = (fresh || 0) + r.v;
    }
    if (fresh == null && carried == null) return { v: null };
    return { v: (fresh || 0) + (carried || 0), fresh: fresh, carried: carried };
  });
  /* 色を付ける拠点は「契約ごとの最終的な累計」の合計が大きい順（LTV の図が合計金額で
     並べるのと同じ考え方）。前は横軸の最後の月の値で並べていて、満了で止めた（N8）後は
     満了済みの拠点が過去に何人採っていても 0 扱いで「その他」に回っていた。 */
  const synOrder = (s) => synDeals
    .filter((mm) => siteOf(dealOf[mm.deal_id] || {}) === s)
    .reduce((a, mm) => a + synAxis.reduce((mx, mo) => {
      const r = syoudakuAt(mm, dealOf[mm.deal_id], mo);
      return r.v != null && r.v > mx ? r.v : mx;
    }, 0), 0);
  const synSer = siteSeries(synSites, synVals, synOrder);
  /* 柱は拠点ごとに2段: 下が書き換えのあった契約（塗り）、上が持ち越し（中空・破線）。
     凡例は拠点ごとに1つ（synSer から作る） */
  const synBars = [];
  synSer.forEach((S) => {
    synBars.push({ label: S.label, color: S.color,
                   vals: S.vals.map((p) => ({ v: p.fresh == null ? null : p.fresh })) });
    synBars.push({ label: S.label, color: S.color,
                   vals: S.vals.map((p) => (p.carried == null ? { v: null } : { v: p.carried, carry: true })) });
  });
  /* 🔴 題名に「累計」と入れる。柱の高さは**その月に新しく採れた数ではなく**、
     契約期間中の各契約の累計（ストック）を足したもの。「月ごとの合計」だけだと
     月々の採用数（フロー）に読める。満了で柱が下がっても採用が減ったわけではない（N8） */
  h += fig("契約中の案件の採用数（累計）の月ごとの合計",
    "その月に契約期間中だった案件の、契約ごとの採用数の累計を拠点ごとに積んだもの。その月に新しく採れた数ではありません",
    synAxis.length >= 2
      ? svgColStack({ w: 940, h: 230, x: synAxis.map((m) => m.slice(2)), series: synBars,
          yFmt: F.int, yLab: "採用数（累計）", alt: "契約中の案件の採用数の累計を拠点ごとに積んだ推移" })
      : '<div class="empty">合算できる月次の記録がありません。</div>',
    synSer.map((S) => lg("box", S.color, esc(S.label))).join("") +
    /* 「その他の拠点」は C.ghost の塗り。引き継ぎを C.ghost の線にすると同じ色で2つの意味になる */
    lg("hollow", C.ink, "引き継ぎ（その月に書き換えが無い契約のぶん）") +
    '<i class="full"><b>柱の高さは累計です。</b>その月に新しく採れた人数ではありません。' +
    "契約ごとの採用数の累計を、契約期間中の月に積んでいます。" +
    "<b>柱が下がるのは契約が満了したからで、採用が減ったからではありません。</b></i>" +
    '<i class="full"><b>これは合算です。</b>拠点をまたいで足しています。' +
    "<b>線でつながず、柱を拠点ごとの色で積んでいます</b>（拠点をまたいで1本の線にすると、" +
    "拠点の違いが時間の変化に見えるため）。" +
    "<b>満了した契約は満了月で止めています。</b>満了後も累計を足し続けると、" +
    "採れていない月まで採れているように見えるためです。" +
    "拠点ごとの違いを見るときは1つ上の図か、下の「採用単価の推移（拠点ごと）」を見てください。</i>");

  /* LTV の累計。金額の入っている案件を開始日の順に足していく。
     🔴 これも拠点ごとに積む（同じ理由）。柱は契約が始まった月だけに立てる */
  const lt = F2.deals.filter((d) => d.amount != null && d.start)
    .sort((a, b) => String(a.start).localeCompare(String(b.start)));
  const ltAxis = [...new Set(lt.map((d) => String(d.start).slice(0, 7)))];
  const ltVals = (sites) => ltAxis.map((mo) => {
    const got = lt.filter((d) => sites.includes(siteOf(d)) && String(d.start).slice(0, 7) <= mo);
    return got.length ? { v: got.reduce((s, d) => s + d.amount, 0) } : { v: null };
  });
  const ltSer = siteSeries([...new Set(lt.map(siteOf))], ltVals,
    (s) => lt.filter((d) => siteOf(d) === s).reduce((a, d) => a + d.amount, 0));
  h += fig("LTV の推移（契約金額の累計）", "契約が増えるたびに積み上がる。拠点ごとに積んでいます",
    ltAxis.length >= 2
      ? svgColStack({ w: 940, h: 230, x: ltAxis.map((m) => m.slice(2)), series: ltSer,
          yFmt: F.man, yLab: "累計金額（万円）", alt: "LTV を拠点ごとに積んだ推移" })
      : '<div class="empty">金額が入っている契約の開始月が ' + num(ltAxis.length) +
        " つしかないので図にしていません。</div>",
    ltSer.map((S) => lg("box", S.color, esc(S.label))).join("") +
    '<i class="full"><b>これも合算です。</b>拠点ごとの色で積んでいます。' +
    "金額が入っていない契約は足していません" +
    "（0 として足すと母数が変わるため）。横軸は契約の開始月です。</i>");

  h += custBlocks(F2, new Set(["cpasite", "deals"]));

  /* ---- 他の法人と比べる（本部アプローチ）---- */
  /* 🔴 「図 他の法人と比べる」の見出しのすぐ下に renderHq の「問い」の見出しが続き、
     図の見出しの下が空に見えた（2026-09-24 実機）。見出しはここの1つにし、renderHq は見出しを出さない */
  h += sec("問い", "他の法人と比べる — 本部に何を持っていくか");
  /* data-paint-own: 中身は wireHoujin が後から描く。本文の描き直しで開いた details を数えない（ownDetails） */
  h += '<div id="hq-box" data-paint-own="1"><span class="loading">読み込み中…</span></div>';
  return h + foot(D.meta, true, houjinCounts(all, ids));
}
/** 法人番号で見るの末尾の件数。🔴 応答の meta には全体の件数が無く、末尾の枠が
    「集計の基準日と件数」なのに件数が出ていなかった（2026-09-23 実機）。この法人の件数を書く */
function houjinCounts(all, ids) {
  return "この法人の取引 " + num(all.length) + " 件（稼働中 " +
    num(all.filter((d) => d.is_active).length) + " 件）のうち、" + num(ids.size) + " 件を選んでいます";
}

/** 契約開始からの月番号 `m` を暦の "YYYY-MM" に直す。
    🔴 サーバ側と同じ数え方（始月を1ヶ月目とする）。 */
function monthAdd(start, m) {
  if (!start || String(start).length < 7 || m == null) return null;
  const y = +String(start).slice(0, 4);
  const mo = +String(start).slice(5, 7);
  const t = (y * 12 + (mo - 1)) + (m - 1);
  const yy = Math.floor(t / 12);
  const mm = (t % 12) + 1;
  return yy + "-" + String(mm).padStart(2, "0");
}

/** 暦の月の番号 m（始月を1）を横軸の文字「26-03」にする。開始日が読めなければ「m月目」 */
function calMonth(start, m) {
  const ym = monthAdd(start, m);
  return ym ? ym.slice(2) : m + "月目";
}

/** 推移の図の横に添える文。契約期間と、暦で何か月にまたがるかが違うときはその理由を書く */
function spanHint(mm) {
  let t = "横軸は暦の月";
  if (!mm.period) return t;
  t += "（契約 " + num(mm.period) + "ヶ月" +
    (mm.start && mm.expiration ? "・" + esc(mm.start) + "〜" + esc(mm.expiration) : "") + "）";
  const sp = mm.span_months;
  if (sp == null) return t;
  /* 🔴 理由は**満了日を比べて**選ぶ。span_months だけで「期間 + 1 なら月の途中の開始」と
     決めていたので、1日に始まって満了日が1か月後ろにずれた取引（fixture 2件。
     2026-06-01〜2026-07-31 の1ヶ月契約など）にも「月の途中に始まったので」と出ていた。
     満了日が期間より前にある取引（fixture 12件。12ヶ月契約なのに 2025-12-18〜2026-06-17 など。
     ほかに月の途中の開始で、またがる月数がちょうど期間になる6件）には何も書いていなかった。
     std_expiration はサーバが contract_month と同じ区切りで出す */
  /* 🔴 2026-09-23 レビュー F3: 満了日が「開始＋契約期間」から数日ずれただけの取引
     （2025-12-18 開始の12ヶ月契約で満了 2026-12-14 など）にも「より前にあり、暦では 13 か月に
     またがります」と出ていた。数日のずれでは、またがる月の数は変わらない（13 か月の理由は月の途中の開始）。
     満了日のずれを理由にするのは、**ずれで月の数が変わったとき**（標準の満了日でまたがる月の数
     spStd と実際の sp が違うとき）だけにする */
  const ex = String(mm.expiration || "").slice(0, 10);
  const st = mm.std_expiration;
  const span = "暦では " + num(sp) + " か月にまたがります";
  const spStd = st ? monthIdx(String(mm.start || ""), String(st)) : null;
  const moved = st && ex.length === 10 && spStd != null && sp !== spStd;
  if (moved && ex > st)
    t += "。満了日が「開始＋契約期間」（" + esc(st) + "）より後ろにあり、" + span;
  else if (moved && ex < st)
    t += "。満了日が「開始＋契約期間」（" + esc(st) + "）より前にあり、" + span;
  else if (sp === mm.period)
    return t;
  else if (st)
    t += "。月の途中に始まったので、" + span + "（最初と最後の月は一部だけ）";
  else
    t += "。" + span;
  return t;
}

/** 推移の図で、契約の頭に変更履歴が無い月があるときの断り書き。無ければ空文字。
    months は図に描く月の番号（始月を1）の並び。
    🔴 2026-09-24 実機: 見出しは「契約 6ヶ月・2025-03-09〜2025-09-08」なのに横軸は 25-07 から始まり、
    期間と横軸が合っていなかった（fixture でも 2025-03-09 開始の契約は変更履歴が 25-07 からの1点だけ）。
    黙って欠けさせず、何月から記録があるか・どこが無いかを書く。
    🔴 理由は決めつけない。「変更履歴は X からしかありません」と書いていたが、データ全体の履歴の
    始まり（2025-07）より後から始まる図のほうが多く（fixture 474枚中390枚）、その契約の値が
    その月まで入っていなかった・変わらなかっただけのこともある。**この契約で最初に記録がある月**だけを書く */
function histGap(mm, months) {
  if (!mm || !mm.start || !months.length || months[0] <= 1) return "";
  const from = monthAdd(mm.start, months[0]);
  const s0 = String(mm.start).slice(0, 7), s1 = monthAdd(mm.start, months[0] - 1);
  if (!from || !s1) return "";
  return "<b>この契約の応募・面接・採用の記録は " + esc(from) + " からです</b>（" + esc(s0) +
    (s1 !== s0 ? "〜" + esc(s1) : "") + " は記録が無いので描いていません。0 ではありません）";
}

/** 暦の月の番号（始月を1）。🔴 サーバの month_index と同じ数え方（以前の「始月は含めない」は誤り）。
    契約の「何ヶ月目」ではない（あちらはサーバの contract_month、案件一覧の months） */
function monthIdx(start, month) {
  if (!start || start.length < 7 || !month || month.length < 7) return null;
  return (+month.slice(0, 4) - +start.slice(0, 4)) * 12 +
         (+month.slice(5, 7) - +start.slice(5, 7)) + 1;
}

/* ================================================================ 4 本部アプローチ */
/** 拠点の表示名。🔴 site_name が null のときに照合用のキー（kyoten_key）へ戻さない
    （Rust 側「キーで埋めない」）。1つの図・表に名前の無い拠点が2つ以上あるときは
    見分けられるように番号を振る */
function siteLabels(rows) {
  const unnamed = rows.filter((x) => !x.site_name).length;
  let k = 0;
  return rows.map((x) => x.site_name ? x.site_name
    : "拠点名が無い" + (unnamed > 1 ? "（" + (++k) + "）" : ""));
}

/* 月次の件数で「まだ締まっていない月」。

  h += sec("図", "誰がどれだけ MTG をしているか");
  /* 🔴 V14: ホスト名は Zoom の登録名そのまま（空白なし）で、人によって「名＋姓」の順で
     登録されている（元データ nouhin_relink.jsonl の先頭 3MB の実測: 33名のうち少なくとも「桜小林」「詩央里田野」
     「愛理沙安友」「萌衣藤中」）。ほかの画面の担当名（HubSpot の「姓 名」）とは一致しない。
     空白が無いので画面の側では姓と名の境目が分からず、並べ替えは推測になる。
     正しく揃えるにはサーバ側で担当名に突き合わせる必要がある */
  h += fig("ホスト別の件数", "これは行動量です。良し悪しではありません",
    svgBarH({ w: 680, fmt: F.int, rh: 22,
      rows: D.hosts.slice(0, 25).map((r) => ({
        label: shortName(r.host, 16), full: r.host, v: r.n, txt: num(r.n) + "回", color: C.ai })) }),
    '<i class="full">上位25名だけ出しています（全 ' + num(D.hosts.length) + " 名）。" +
    "件数が多い＝良い、ではありません。担当している契約の数が違います。</i>" +
    /* V14: 並び替えは推測になるので、画面では直さずに断る（理由は上のコメント） */
    '<i class="full">名前は <b>Zoom に登録された名前のまま</b>です。人によって「名＋姓」の順で' +
    "登録されているため、ほかの画面の担当名（姓 名）と並びが違うことがあります。</i>");

  h += sec("図", "月ごとの件数");
  const openM = openMonth(D.meta);
  /* 途中の月が横軸に無いときは凡例にも出さない（図に無い印を凡例に残さない, V5） */
  const hasOpenM = !!openM && D.monthly.some((m) => m.month >= openM);
  h += fig("MTG の実施回数", "",
    svgLine({ w: 680, h: 220,
      x: D.monthly.map((m) => m.month.slice(2)),
      series: [{ color: C.ai, pts: D.monthly.map((m) => monthPt(m.month, m.n, openM)) }],
      yFmt: F.int, yLab: "回", alt: "月ごとの MTG 件数" }),
    lg("line", C.ai, "MTG") + (hasOpenM ? lg("ring", C.ai, "途中の月（まだ締まっていない）") : "") +
    (hasOpenM ? '<i class="full">' + esc(openM) + " は元データを落とした時点までの途中の値です。" +
      "<b>ほかの月と同じには比べられません</b>（必ず低く出ます）。</i>" : ""));
  return h + foot(D.meta, true);   /* 数えていないものは頭の枠で書いた（V21: 上下で2回出ていた） */
}

/* ================================================================ 6 電話 */

  h += '<div class="kpis">' +

  h += sec("図", "電話は届いているか");

  h += sec("図", "最後に話してから何日たったか");

      : tooFew(D.days_since ? D.days_since.n : 0, "経過日数"),

    svgLine({ w: 700, h: 230,
      x: D.monthly.map((m) => m.month.slice(2)),
      series: [
        { color: C.ai, pts: D.monthly.map((m) => monthPt(m.month, m.calls, openP)) },

      "<b>ほかの月と同じには比べられません</b>（必ず低く出ます）。</i>" : ""));
  /* 🔴 「1本の通話が複数の取引に結び付いて…取引ごとに数えています」を、上の内訳の図（サーバの reach.note）と
     この図の下で2回出していた（2026-09-24 実機）。内訳の図の注記の1回にする */

  h += note("warn", "文字起こしの状況", esc(D.transcript.note));

  h += '<div class="lede">' + esc(D.silent.rule) +

  h += scroll(table([{ t: "取引", w: "l" }, { t: "ステージ", w: "s" }, { t: "金額", n: 1 },

      x.last_contact == null ? '<b style="color:var(--hi)">一度も無い</b>' : esc(x.last_contact),
      x.days_since == null ? DASH : num(x.days_since) + "日"])), 420);
  return h + foot(D.meta, true);   /* 数えていないものは頭の枠で書いた（V21: 上下で2回出ていた） */
}

/* ================================================================ 7 立ち上がり */
function renderRampup(D) {
  const ph = D.phase, f = D.first_mtg, nm = D.no_mtg;

      "ここの「初回MTG」は<b>MTG だけ</b>で、電話は入っていません" +
      "（MTGと電話を束ねた最終接触は " + goLink("study", "outcome") + " にあります）。");

  h += sec("図", "いま、どのフェーズにいるか");
  /* 🔴 SERIES を並び順で回していたので「序盤」が緑（＝良い）、別の日には赤にもなり得た（V9）。
     フェーズは良し悪しではないので、赤と緑は使わない。名前で色を決める */
  const PHASE_COLOR = { "序盤": C.ai, "中盤": C.murasaki, "終盤": C.ink2,

  h += fig("契約長に対する割合で見る", esc(ph.rule),
    svgStack({ w: 680, parts: pparts }), stackLegend(pparts) +
    /* 🔴 「同じ3ヶ月目でも…」は図の見出しの横（サーバの phase.rule）にも出ていて、
       同じ文が2回だった（2026-09-23 実機, V21 の残り）。ここでは「出せない」の説明だけにする */
    '<i class="full">契約期間が入っていないものは「出せない」に置いています（0として満了超過に落としていません）。</i>');

  h += sec("図", "立ち上がりの速さ（契約開始 → 初回MTG）");
  h += fig("初回MTGまでの日数の散らばり",
    "母数 " + num(f.n) + " 件。契約前のMTG " + num(f.pre_contract) + " 件は混ぜていません",
    f.stats && f.stats.n >= MIN_N
      ? svgBoxH({ w: 680, xFmt: F.int, rows: [{
          label: "初回MTGまで", med: f.stats.median, q1: f.stats.q1, q3: f.stats.q3,
          min: f.stats.min, max: f.stats.max, mean: f.stats.mean, n: f.stats.n, color: C.ai }] })
      : tooFew(f.stats ? f.stats.n : 0, "初回MTGまでの日数"),
    lg("quart", C.ai, "四分位") + lg("line", C.ai, "中央値"));

  h += fig("帯ごとの、その後の解約率", "立ち上がりの速さと解約の向きは読めません",
    svgBarH({ w: 660, fmt: F.pp, rh: 26,
      // 解約率の母数は決着済み（b.denom）。足切りも母数で見る（結果待ちを含む b.n ではない）
      rows: f.buckets.filter((b) => b.denom >= MIN_N).map((b) => ({
        label: b.label, v: b.cancel_rate, txt: pct1(b.cancel_rate),
        note: "n=" + num(b.denom),
        /* 🔴 以前は「61日超」だけ赤（■まずい）にしていた。決着済みで割り直すと向きは
           読めないので、特定の帯を判定の色で強調しない。全帯を同じ色にする（5f11d15）。
           2026-09-24 に一度、全画面共通の線（CANCEL_HI）で値ごとに緋にしたが、fixture で
           4帯中3帯（14日以内 49.7% を含む）が緋になり「早い立ち上がりがまずい」と読めて、
           副題「向きは読めません」と食い違った。この図は帯どうしを比べる図なので判定の色は使わず、
           線の話は凡例に文で書く。緋にするかどうかは線引き（40%）と合わせて藤巻さんの確認待ち */
        color: C.ai })) }),
    lg("box", C.ai, "解約率") +
    '<i class="full">この図は帯どうしを比べるための図なので、' + goLink("study", "renewal") +

    droppedNote(f.buckets, (b) => b.denom || 0, (b) => b.label) +
    '<i class="full">n は決着済み（継続＋解約＋充足）の件数で、解約率の分母です。結果待ちは入れていません。' +
    "<b>単調ではありません。</b>14日以内も解約しています。" +
    "「早ければ良い」とも「遅いほど悪い」とも言えません（決着済みで割ると、遅い群が悪いという差は読めなくなりました）。" +
    "61日超には関係が薄い顧客が混じっている可能性があり、" +
    "<b>遅れが原因とは決められません（相関であって因果ではない）</b>。</i>");

  h += sec("表", "契約開始から MTG の記録がまだ無い初回契約（" + num(nm.n) + " 件）");
  h += '<div class="lede">稼働中の初回契約 ' + num(nm.first_active) + " 件のうち " +
    pct1(nm.rate) + "。" + esc(nm.note) +
    (nm.excluded_marketing ? "。「マーケ関連」の " + num(nm.excluded_marketing) +
      " 件は MTG をしないのが普通なので、この表と母数から外しています" : "") + "</div>";
  h += scroll(table([{ t: "取引", w: "l" }, { t: "ステージ", w: "s" }, { t: "金額", n: 1 }, { t: "契約開始から", n: 1 }],
    nm.rows.map((r) => [esc(r.name || r.deal_id),
      '<span class="muted small">' + esc(r.stage) + "</span>", yen(r.amount),
      r.days_since_start == null ? DASH : num(r.days_since_start) + "日"])), 420);
  h += note("info", "継続率はこの画面にありません",
    goLink("study", "renewal") + " にあります。<b>同じ数字を2か所で作らない</b>ためです。");
  return h + foot(D.meta, true);   /* 数えていないものは頭の枠で書いた（V21: 上下で2回出ていた） */
}

/* ================================================================ 8 成果とリスク */
/** 目標に対する進捗の帯の色。帯の名前で決める（並び順に依存しない）。
    🔴 母集団は稼働中の契約（goal_act）なので、達成率は**まだ伸びる途中の値**（右側打ち切り）。
    100% に届いたものだけが「達成」で確定する（承諾数は減らない）。それ以外は未確定なので、
    0% を赤（■まずい）・1〜50% を山吹（▲注意）で塗ると、途中の値を確定した悪い結果として
    読ませてしまう（V9 検証。fixture では目標のある 345 件のうち 198 件が 0% で、
    始まったばかりの契約も入っている）。未確定の帯は判定の色を使わず、goalBandOpen で
    中空＋破線にする。濃さの違う藍〜灰で段を分け、名前と件数は凡例に必ず出す */
function goalBandColor(label) {
  const s = String(label || "");
  if (s.startsWith("未記入") || s.startsWith("承諾数が空")) return C.ghost;   /* 値が無い。0% ではない */
  if (s === "100%以上") return C.midori;
  if (s.startsWith("50")) return C.ai;
  if (s.startsWith("1〜")) return C.ink2;
  if (s.startsWith("0%")) return C.ink3;
  return C.ghost;
}
/** 未確定（途中の値）の帯か。100%以上と値が無い帯以外 */
const goalBandOpen = (label) => /^(50|1〜|0%)/.test(String(label || ""));
function renderOutcome(D) {
  const ga = D.goal_act, gl = D.goal_all, ef = D.efficiency, R = D.risk, cs = D.contact_source;
  let h = sec("問い", "成果は出ているか、どこが危ないか") +
    note("def", "この画面で数えていないもの",
      "成約率・継続率・MTG件数・メール件数ではありません。<b>接触 ＝ MTG または60秒超の通話</b>で、" +
      "メールは数えていません。<b>接触は検知にだけ使っています。処方には使いません。</b>" +
      "中盤に接触が増えるのは「火消し」で、結果が原因より後に来ています。");

  h += sec("図", "目標に対する進捗");
  /* 🔴 真ん中の帯を SERIES で順に塗っていたので、「50〜100%」が赤・「1〜50%」が緑になり、
     色の意味（赤＝まずい・緑＝良い）が逆転していた（V9 目視）。帯の名前で決める。
     🔴 さらに稼働中の達成率は途中の値なので、100% 未満は中空＋破線（V9 検証。goalBandColor） */
  const gparts = ga.bands.map((b) => ({
    label: b.label, v: b.n,
    color: goalBandColor(b.label),
    open: goalBandOpen(b.label),
    /* 🔴 「承諾数が空」と「未記入」を同じ薄い灰で塗っていて、1.0%（6件）の細い帯が隣の
       「未記入」と見分けられなかった（2026-09-23 実機）。
       🔴 そこで承諾数が空を中まで濃く塗ったら、値が無い帯のほうが中空・破線（未確定）の
       50%〜 / 1〜 / 0% より確かなものに見えた（2026-09-23 検証）。値が無いので斜線にする
       （stackHatch）。未記入は薄い塗りのまま。どちらも灰で、塗り方で分ける */
    hatch: String(b.label).startsWith("承諾数が空"),
    faint: String(b.label).startsWith("未記入") }));
  const noSyo = ga.bands.filter((b) => b.label.startsWith("承諾数が空"))
    .reduce((a, b) => a + b.n, 0);
  h += fig("達成率 ＝ 承諾数 ÷ 採用目標数", "目標が入っている契約だけが母数",
    stackHatch(svgStack({ w: 680, parts: gparts }), gparts),
    stackLegend(gparts) +
    '<i class="full"><b>稼働中の契約なので、100% 未満はまだ伸びる途中の値です</b>' +
    "（中空・破線）。0% には始まったばかりの契約も入っています。「達成できなかった」とは読めません。</i>" +
    '<i class="full"><b>目標が入っているのは稼働中の ' + pct1(ga.fill_rate) + "（" +
    num(ga.has_goal) + " / " + num(ga.pop) + "）だけです。</b>全件では " + pct1(gl.fill_rate) +
    "。入っていない取引は「達成率0%」ではなく、母数に入っていません。" +
    (noSyo ? "目標はあるのに承諾数が空の " + num(noSyo) + " 件は、達成率が出せないので別の帯にしています。" : "") +
    "　中央値（稼働中）" + (ga.median == null ? DASH : pct1(ga.median * 100)) + "</i>");

  h += sec("図", "求人票あたりの応募効率");
  h += fig("応募数 ÷ 掲載数", "結果ごとのばらつき",
    svgBoxH({ w: 680, xFmt: F.d1,
      rows: ef.groups.filter((g) => g.box && g.box.n >= MIN_N).map((g) => ({
        label: g.label, med: g.box.median, q1: g.box.q1, q3: g.box.q3,
        min: g.box.min, max: g.box.max, mean: g.box.mean, n: g.box.n,
        /* 🔴 filter 後の並び順で SERIES を回していて、「解約した」が赤・「充足」が緑になり、
           グループが1つ落ちると色がずれていた（V9 検証）。充足は継続率では解約側の分子なので
           緑（良い）は誤読になる。群の名前は左に書いてあるので、色は1つにそろえる */
        color: C.ai })) }),
    lg("quart", C.ai, "四分位") + lg("line", C.ai, "中央値") +
    droppedNote(ef.groups, (g) => (g.box ? g.box.n : 0), (g) => g.label) +
    '<i class="full">' + esc(ef.caveat) + "　掲載数が入っているのは 稼働中 " +
    num(ef.has_keisaisu_act) + " / " + num(ef.n_act) + "。</i>" +
    /* 🔴 結果の決まっていない取引は「継続した」に混ぜない（fix/cs-rust N19）。外した件数を出す */
    (ef.n_pending_excluded
      ? '<i class="full">結果待ち（稼働中など）の ' + num(ef.n_pending_excluded) +
        " 件は、結果が決まっていないので3つの群のどれにも入れていません。</i>"
      : ""));
  /* 🔴 以前は結果待ちを「継続した」に混ぜていて差がほとんど無く見えた。
     決着の3群で比べ直すと向き（解約 ＜ 継続）は出る（fix/cs-rust N19）。ただし群の代表値を比べただけ */
  h += note("bad", "資料の「8.1 ≪ 14.5」は、そのままの値では再現しません",
    "向き（解約 ＜ 継続）は合っています。ただし群の代表値を比べただけで、平均は外れ値に引かれます。" +
    "<b>単独で解約を見分けられる指標かは、ここからは言えません</b>。");

  h += sec("図", "リスクは2軸だけで見る");
  h += note("info", "4軸のうち2軸を意図的に外しています。手抜きではありません",
    "<b>関係性の軸（NPS）</b>：稼働中の半分にしか値が無く、<b>構造的に発火しません</b>。" +
    "常に非赤の軸を並べると「問題ない」と読まれますが、実際は<b>測れていないだけ</b>です" +
    "（NPS は " + goLink("study", "focus") + " で独立した指標として出しています）。<br>" +
    /* 🔴 「churn予測」「StratifiedKFold」「AUC」と英語の用語のまま出していた（2026-09-23 実機）。
       意味は変えずに言い換える: StratifiedKFold ＝ 顧客で分けずに取引を無作為に分けた検証、
       AUC ＝ 解約する契約としない契約を見分ける力（0.5 で当て推量と同じ、1.0 で完全） */
    "<b>予測の軸（解約の予測モデル）</b>：本番の検証が、取引を顧客で分けずに無作為に" +
    "「作る側」と「確かめる側」に分けています。同じ顧客が継続契約で複数の取引を持つので、" +
    "確かめる側に作る側と同じ顧客が混ざり、<b>当たり具合が実際より良く出ます</b>。" +
    "説明できない順位を現場に出せません。");
  const rparts = R.bands.map((b) => ({
    label: b.label, v: b.n,
    color: b.label.startsWith("2") ? C.hi : b.label.startsWith("1") ? C.ki : C.midori }));
  h += fig("稼働中 " + num(R.n_act) + " 件の帯", "2軸とも赤 ＝ 最優先",
    svgStack({ w: 680, parts: rparts }),
    stackLegend(rparts) +
    '<i class="full">放置の軸: 赤 ' + num(R.ax3["赤"]) + " / 白 " + num(R.ax3["白"]) +
    " / 未測定 " + num(R.ax3["未測定"]) + "（" + esc(R.ax3.rule) + "）<br>" +
    "収益の軸: 赤 " + num(R.ax4["赤"]) + " / 白 " + num(R.ax4["白"]) +
    " / 未測定 " + num(R.ax4["未測定"]) + "（" + esc(R.ax4.rule) + "）<br>" +
    "接触の記録が1つも無い " + num(R.ax3["未測定"]) +
    " 件は<b>赤にせず「未測定」として分けています</b>。記録が無いことと放置は別です。" +
    "数えた接触: 60秒超の通話 " + num(cs.calls_over_threshold) + " / MTG " +
    num(cs.mtgs_linked) + " / 接触のある取引 " + num(cs.deals_with_contact) + "</i>");

  h += sec("図", "最優先の広がり（金額 × 満了まで）");
  h += fig("2軸とも赤の " + num(R.top.length) + " 件", "右上ほど金額が大きく満了が遠い",
    R.top.length
      ? svgScatter({ w: 680, h: 260,
          pts: R.top.filter((r) => r.amount != null && r.days_to_expiry != null)
            /* 🔴 2026-09-24 実機（ループ5）: 契約開始日が空の行（no_start）を灰（C.ghost）で描いていたが、
               灰はこの画面では「記録なし・未確定」の色。サーバ（routes.rs risk）はこの行を放置の軸の赤に数え、
               「2軸とも赤」の件数（見出しの N 件・上の帯の最優先）にも入れている。灰のままだと、赤に数えた点が
               赤に見えず、見た目と件数が食い違う。数え方（赤）に見た目を合わせ、赤の中空・実線の丸にして
               「開始日が空で、契約後を切り出せない」ことを塗りの点と見分けられるようにする
               （件数の側を灰に合わせると、サーバの判定と帯・見出しの件数まで変えることになる） */
            .map((r) => ({ x: r.days_to_expiry, y: r.amount,
                           color: r.never_after_start || r.no_start ? C.hi : C.ki,
                           open: !!r.no_start && !r.never_after_start,
                           note: r.no_start ? "契約開始日が空（赤に数えています）" : "",
                           label: r.name || r.deal_id })),
          xFmt: F.int, yFmt: F.man, xLab: "満了まで（日）", yLab: "金額（万円）",
          alt: "最優先の広がり" })
      : '<div class="empty">最優先に当たる取引がありません。</div>',
    lg("dot", C.hi, "契約後に一度も接触していない", PT_OP) + lg("dot", C.ki, "接触から30日超", PT_OP) +
    (R.top.some((r) => r.no_start) ? lg("openpt", C.hi, "契約開始日が空（契約後を切り出せない）。赤に数えています") : ""));
  /* 🔴 ここにも並びの注記（order_note）を出していて、下の表の頭と同じ文が2回出ていた
     （2026-09-23 実機, V21 の残り）。散布図には並びが無いので、表の側だけに出す */

  h += sec("表", "最優先（2軸とも赤・" + num(R.top.length) + " 件）");
  /* 🔴 放置の軸が「契約後に一度も接触していない」の行に「接触の記録 23件」と出て、矛盾して見えた
     （2026-09-24 実機）。接触の記録は契約前も含めた件数（routes.rs build_outcome の n_contact）。
     その行では「すべて契約前」と書き、列の意味も表の上で言う。
     🔴 契約開始日が空の行（no_start）は、接触が契約の前か後かが分からない。「すべて契約前」と
     言い切らない（2026-09-24 検証。サーバも never_after_start を立てない） */
  h += '<div class="lede">金額が大きい順。' + esc(R.order_note) +
    "「接触の記録」は契約の前も含めた件数です。</div>";
  h += scroll(table([{ t: "取引", w: "l" }, { t: "ステージ", w: "s" }, { t: "金額", n: 1 },
                     { t: "満了まで", n: 1 }, { t: "放置の軸", w: "s" }, { t: "接触の記録", n: 1 }],
    R.top.map((r) => [esc(r.name || r.deal_id),
      '<span class="muted small">' + esc(r.stage) + "</span>", yen(r.amount),
      r.days_to_expiry == null ? DASH : num(r.days_to_expiry) + "日",
      (r.never_after_start ? '<b style="color:var(--hi)">' : "<span>") + esc(r.ax3w) +
        (r.never_after_start ? " &#9650;</b>" : "</span>"),
      r.n_contact
        ? num(r.n_contact) + "件" + (r.never_after_start ? '<br><span class="muted small">すべて契約前</span>' : "")
        : DASH])), 420);
  return h + foot(D.meta, true);   /* 数えていないものは頭の枠で書いた（V21: 上下で2回出ていた） */
}

/* ================================================================ 9 データ品質 */
function renderDq(D) {
  let h = sec("問い", "この画面の数字を、どこまで信じてよいか") +
    '<div class="lede">取引 ' + num(D.meta.n_deals) + " 件（稼働中 " +
    num(D.meta.n_active) + " 件）。</div>";

  /* ---- 法人番号の出どころ ---- */
  h += sec("図", "法人番号の出どころ");
  /* 判定はサーバのキー（deal / company）のまま、出す名前だけ置き換える（V3）。
     🔴 山吹は「読むのに注意が要る」の色。会社由来は注意の印ではないので紫にする（V9） */
  const hp = D.houjin_source.rows.map((r, i) => ({
    label: dispName(r.label), v: r.n,
    color: r.label === "deal" ? C.ai : r.label === "company" ? C.murasaki : C.ghost,
    faint: r.label.indexOf("無") >= 0 || r.label === "none" }));
  h += fig("どこから取れたか", "",
    svgStack({ w: 680, parts: hp }), stackLegend(hp) +
    '<i class="full">' + esc(D.houjin_source.note) + "</i>");

  /* ---- 記入率の偏り（面で見る）---- */
  h += sec("図", "成果系の記入率が結果で偏っている");
  const groups = ["継続済", "解約", "充足", "結果待ち"];
  const fields = [...new Set(D.outcome_bias.rows.map((r) => r.field))];
  h += fig("結果ごとの記入率", "色が濃いほど埋まっている",
    svgMatrix({ padL: 150, cw: 120,
      cols: groups,
      rows: fields.map((f) => ({
        label: dispName(f),
        cells: groups.map((g) => {
          const r = D.outcome_bias.rows.find((x) => x.group === g && x.field === f);
          if (!r || r.fill_rate == null) return { v: null, txt: "—", n: 0 };
          return { v: r.fill_rate / 100, txt: pct1(r.fill_rate),
                   n: r.filled, color: C.ai };
        }),
      })) }));
  /* 🔴 図の下の注記（サーバの outcome_bias.note）と、すぐ下の「まずい」の箱が同じ話を2回言っていた
     （2026-09-24 実機）。箱の1回にし、文の正本はサーバの note にする。
     箱の見出しは本文と同じ文にしない（本文の末尾が「押し上げる方向に効きます」） */
  h += note("bad", "この偏りは結論を甘く見せます",
    D.outcome_bias.note ? esc(String(D.outcome_bias.note).replace(/。$/, "")) + "。"
      : "うまくいかなかった契約ほど数字が残っていないので、「継続するほど成果が良い」という見え方が強く出ます。");

  /* ---- 欠測 ---- */
  h += sec("図", "何がどれだけ欠けているか");
  h += fig("欠測の件数", "0 で埋めていません",
    svgBarH({ w: 700, fmt: F.int, rh: 26,
      rows: D.missing.map((m) => ({
        label: tail(m.label, 30), full: m.label, v: m.n, txt: num(m.n) + "件",
        note: pct1(m.rate), color: m.rate >= 20 ? C.ki : C.ai })) }),
    /* 図に出ていない色は凡例に出さない（2026-09-24 実機: 20%以上の項目が無いのに山吹の「20%以上」が出ていた） */
    (D.missing.some((m) => m.rate >= 20) ? lg("box", C.ki, "20%以上") : "") +
    (D.missing.some((m) => !(m.rate >= 20)) ? lg("box", C.ai, "20%未満") : "") +
    '<i class="full">' + D.missing.map((m) => esc(m.label) + "：" + esc(m.note)).join(" ／ ") +
    "</i>");

  /* ---- 読んでいるシート ---- */
  h += sec("表", "読んでいるシート");
  h += '<div class="lede">スプレッドシートを直接読んでいます。件数はいま読めた行数です。</div>';
  h += scroll(table([{ t: "シート" }, { t: "行数", n: 1 }],
    D.sheets.map((x) => [esc(x.name), num(x.rows)])));
  return h + foot(D.meta);
}


/* ================================================================ 案件の立ち位置 / 今日動く先 */

/* 名札。🔴 これの本数で並べる。スコアは出さない */
function tags(fs) {
  if (!fs || !fs.length) return '<span class="n0">—</span>';
  return fs.map((f) => {
    const col = f.indexOf("NPS") >= 0 || f.indexOf("退職") >= 0 ? "hi" :
                f.indexOf("満了") >= 0 || f.indexOf("接触") >= 0 ? "ki" : "murasaki";
    return '<span class="tag" style="border-color:var(--' + col +
      ');color:var(--' + col + ')">' + esc(f) + "</span>";
  }).join(" ");
}
/* 履歴から取った値。🔴 その月に書き換えが無ければ「持越」と出す */
function numCarry(v, carry) {
  if (v == null) return DASH;
  return num(v) + (carry
    ? ' <span class="n0" title="その月に書き換えが無く、前の値を引き継いだ">持越</span>' : "");
}

/* 何ヶ月目か。分母は契約期間 */
function pos(r) {
  /* 🔴 契約開始がまだ先のものは「-1 か月目」ではなく「開始前」と出す */
  if (r.not_started)
    return '<span class="muted">開始前</span>' +
      (r.start ? '<span class="muted small"> ' + esc(r.start) + " から</span>" : "");
  /* 🔴 満了日を過ぎてもまだ稼働中のものは「15 / 6 か月目」と出さない。数え間違いに見える。
     何日過ぎたかは隣の「満了まで」の列に出ている */
  if (r.past_expiry)
    return '<b style="color:var(--hi)">満了後</b>' +
      (r.period ? '<span class="muted small"> 契約 ' + num(r.period) + " か月</span>" : "");
  if (r.months == null) return DASH;
  /* 🔴 満了日がまだ先なのに契約期間を超えるのは、満了日が「開始＋契約期間」より後ろに
     ずれている取引だけ（月末の開始はサーバの contract_month が満了日に合わせて数える）。
     fixture 稼働中603件のうち、満了日の当日で数えて期間を超えるのは1件
     （1ヶ月契約 2026-06-01〜2026-07-31。7/1〜7/31 に「2 / 1」と出ていた）。「2 / 1 か月目」は数え間違いに見えるので、
     分母を付けずに、満了日がずれていると書く */
  if (r.period && r.months > r.period)
    return num(r.months) + '<span class="muted small"> か月目（契約 ' + num(r.period) +
      " か月。満了日が後ろにずれています）</span>";
  /* 🔴 ここの序盤／中盤／終盤は契約長の 0.34 / 0.67 で区切った「立ち位置」。
     採用単価を比べる帯（cpa_band、0.5 / 0.75）とは別の区切りなので、同じ言葉に見せない */
  return num(r.months) + (r.period ? " / " + num(r.period) : "") +
    '<span class="muted small"> か月目</span>' +
    (r.band ? ' <span class="muted small" title="契約長の 0.34 / 0.67 で区切った立ち位置">立ち位置 ' +
      esc(r.band) + "</span>" : "");
}
function npsCell(r) {
  if (r.nps == null) return '<span class="n0">未回答</span>';
  const col = r.nps <= 4 ? "hi" : r.nps >= 9 ? "midori" : "ink-2";
  return '<b style="color:var(--' + col + ')">' + num(r.nps) + "</b>" +
    '<span class="muted small"> ' + esc(r.nps_month || "") + "</span>";
}
function touchCell(r) {
  if (r.n_contact === 0) return '<b style="color:var(--hi)">記録なし</b>';
  if (r.days_since_contact == null) return DASH;
  const col = r.days_since_contact > 30 ? "hi" : r.days_since_contact > 14 ? "ki" : "ink-2";
  return '<b style="color:var(--' + col + ')">' + num(r.days_since_contact) +
    "日</b>" + '<span class="muted small"> 前</span>';
}
function goalCell(r) {
  if (r.saiyomokuhyou == null || r.saiyomokuhyou <= 0)
    return '<span class="n0">目標なし</span>';
  if (r.rate_tassei == null) return DASH;
  /* 🔴 案件の表は稼働中の契約なので、達成率は**まだ伸びる途中の値**（右側打ち切り）。
     以前は 0〜50% を赤（■まずい）、50〜100% を山吹で塗り、途中の値を確定した悪さに見せていた。
     成果とリスクの目標の帯（goalBandColor）と同じく、確定するのは 100% に届いたものだけ。
     稼働中で 100% 未満のものは判定の色を使わず「途中」と添える */
  /* 行は deal_rows の稼働中（act）だけなので、100% 未満はすべて途中 */
  const done = r.rate_tassei >= 1;
  const col = done ? "midori" : "ink-2";
  return '<b style="color:var(--' + col + ')">' + pct1(r.rate_tassei * 100, 0) + "</b>" +
    '<span class="muted small"> ' + nz(r.syoudaku) + "/" + nz(r.saiyomokuhyou) +
    (done ? "" : "（途中）") + "</span>";
}
function cpaCell(r) {
  /* 🔴 金額が入っていない（0を含む）と採用単価は出せない。0万 と書かない */
  if (r.amount == null) return '<span class="n0">金額なし</span>';
  if (r.cpa == null) return '<span class="n0">採用0</span>';
  const col = r.cpa_vs_band != null && r.cpa_vs_band >= 1.5 ? "hi" : "ink-2";
  /* 🔴 比べた帯は cpa_band（契約の進み具合 0.5 / 0.75 で区切った帯）。「何ヶ月目」の横の
     立ち位置（0.34 / 0.67）とは別物なので、どの帯の中央と比べたかを帯の名前で出す */
  return '<b style="color:var(--' + col + ')">' + yen(r.cpa) + "</b>" +
    (r.cpa_band_median == null
      ? (r.cpa_band ? '<span class="muted small"> ' + esc(r.cpa_band) +
          " は件数が足りず比べていない</span>" : "")
      : '<span class="muted small"> ' + esc(r.cpa_band || "同じ進み具合の帯") + " の中央 " +
          yen(r.cpa_band_median) + "</span>");
}

/* 採用単価の比べ方。サーバの cpa_band_rule に、「何ヶ月目」の立ち位置とは区切りが違うことを添える */
function cpaBandNote(meta) {
  if (!meta || !meta.cpa_band_rule) return "";
  return note("def", "採用単価の比べ方", esc(meta.cpa_band_rule) + "。<br>" +
    "<b>「何ヶ月目」の横の立ち位置（序盤／中盤／終盤。契約長の 0.34 / 0.67 で区切る）とは別の区切りです。</b>" +
    "採用単価の欄には、比べた帯の名前をそのまま出しています。");
}

const BOARD_COLS = [
  { k: "name",       t: "案件",        n: 0, fmt: (r) => esc(r.name || r.deal_id) +
      (r.focus ? ' <span class="tag">注力</span>' : "") },
  { k: "consultant", t: "担当",        n: 0, fmt: (r) => esc(r.consultant) || DASH },
  /* 🔴 並べ替えは画面に出ている順に合わせる（sv）。「満了後」の行は数字を出していないのに、
     内部の months（15 など）で他の行の間に並んでいた（fixture 20件）。
     満了後は稼働中の月より後ろに置き、その中は満了を過ぎた日数の順 */
  { k: "months",     t: "何ヶ月目",    n: 1, fmt: pos,
    sv: (r) => r.past_expiry ? 1e6 + Math.max(0, -(r.days_left || 0)) : r.months },
  /* 🔴 マイナスは「満了を過ぎている」。そのまま -329日 と出すと読めない */
  { k: "days_left",  t: "満了まで",    n: 1, fmt: (r) => {
      if (r.days_left == null) return DASH;
      if (r.days_left < 0)
        return '<b style="color:var(--hi)">満了を' + num(-r.days_left) + "日過ぎている</b>";
      return r.days_left <= 60
        ? '<b style="color:var(--ki)">' + num(r.days_left) + "日</b>"
        : num(r.days_left) + "日";
    } },
  { k: "nps",        t: "定期NPS",     n: 1, fmt: npsCell },
  { k: "days_since_contact", t: "最後の接触", n: 1, fmt: touchCell },
  /* 🔴 「最後の接触」（MTG＋60秒超の通話）とは別の列。こちらは MTG だけ。
     2つ並べているのは、電話でつないでいるだけで MTG が落ちている先を見つけるため */
  { k: "mtg_days",   t: "最後のMTG",   n: 1, fmt: mtgCell },
  /* 🔴 応募 → 面接 → 採用 を横に並べる。どこで詰まっているかが1行で読めるように */
  { k: "oubo",       t: "応募",        n: 1, fmt: (r) => numCarry(r.oubo, r.oubo_carry) },
  { k: "mensetu",    t: "面接",        n: 1, fmt: (r) => numCarry(r.mensetu, r.mensetu_carry) },
  { k: "syoudaku",   t: "採用",        n: 1, fmt: (r) => numCarry(r.syoudaku, r.syoudaku_carry) },
  { k: "rate_tassei", t: "採用目標に対して", n: 1, fmt: goalCell },
  /* 🔴 接触率は②コンサルタント一覧と同じ定義。必ず分母つき */
  { k: "contact_rate", t: "接触率",    n: 1, fmt: (r) => {
      /* 開始前は分母（経過月）が0。「0%」ではなく理由を出す */
      if (r.not_started) return '<span class="muted small">開始前</span>';
      if (r.contact_rate == null) return DASH;
      const col = r.contact_rate < 40 ? "hi" : r.contact_rate < 70 ? "ki" : "midori";
      return '<b style="color:var(--' + col + ')">' + pct1(r.contact_rate, 0) + "</b>" +
        '<span class="muted small"> ' + num(r.contact_touched) + "/" +
        num(r.contact_months) + " か月</span>";
    } },
  { k: "cpa",        t: "採用単価",    n: 1, fmt: cpaCell },
  { k: "amount",     t: "金額",        n: 1, fmt: (r) => yen(r.amount) },
  { k: "n_flags",    t: "名札",        n: 0, fmt: (r) => tags(r.flags) },
];

let boardSort = { key: "n_flags", asc: false };

/* ③の絞り込み。②から担当者を押して来たときも、ここに入る。
   🔴 絞ったら必ず「◯件中 N件を表示」を出す（全件を見ていると誤認させない）。 */
let boardFilter = { consultant: "", flag: "", expiry: "", q: "" };

/* 満了までの帯。値は days_left（null は「満了日が入っていない」） */
const EXPIRY_BANDS = [
  { k: "over", t: "満了を過ぎている",     hit: (d) => d != null && d < 0 },
  { k: "d30",  t: "30日以内",             hit: (d) => d != null && d >= 0 && d <= 30 },
  { k: "d60",  t: "60日以内",             hit: (d) => d != null && d >= 0 && d <= 60 },
  { k: "d90",  t: "90日以内",             hit: (d) => d != null && d >= 0 && d <= 90 },
  { k: "far",  t: "90日より先",           hit: (d) => d != null && d > 90 },
  { k: "none", t: "満了日が入っていない", hit: (d) => d == null },
];

/* 絞り込みを当てる。**行を落とすのはここだけ** */
function boardApply(rows) {
  const f = boardFilter;
  const band = EXPIRY_BANDS.find((b) => b.k === f.expiry);
  const q = f.q.trim().toLowerCase();
  return rows.filter((r) => {
    if (f.consultant && (r.consultant || "") !== f.consultant) return false;
    if (f.flag && !(r.flags || []).some((x) => x === f.flag)) return false;
    if (band && !band.hit(r.days_left)) return false;
    if (q && String(r.name || r.deal_id || "").toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}

function boardFilterOn() {
  const f = boardFilter;
  return !!(f.consultant || f.flag || f.expiry || f.q.trim());
}

/* いま何で絞っているかを日本語で並べる */
function boardFilterWords() {
  const f = boardFilter, w = [];
  if (f.consultant) w.push("担当 " + f.consultant);
  if (f.flag) w.push("名札 " + f.flag);
  if (f.expiry) {
    const b = EXPIRY_BANDS.find((x) => x.k === f.expiry);
    if (b) w.push("満了まで " + b.t);
  }
  if (f.q.trim()) w.push("案件名に " + f.q.trim());
  return w.join(" / ");
}

/* 絞り込みの操作列。
   onlyOwner: 担当者ごとの案件で、まだ担当を選んでいないとき。担当の選択欄だけを出す。
   🔴 選ぶ前の画面には件数の表しか無いのに、名札・満了まで・案件名の欄と
      「604 件中 604 件を表示（絞り込みなし）」が出ていて、担当を選ぶ前から
      表を絞り込めるように見えていた（2026-09-23 実機） */
function boardFilterBar(D, onlyOwner) {
  const names = Array.from(new Set(D.rows.map((r) => r.consultant).filter(Boolean)))
    .sort((a, b) => a.localeCompare(b, "ja"));
  const flags = (D.meta.flag_counts || []).slice().sort((a, b) => b.n - a.n);
  const opt = (v, t, cur) =>
    '<option value="' + esc(v) + '"' + (cur === v ? " selected" : "") + ">" + esc(t) + "</option>";
  let h = '<div class="ctlbar" id="board-filter">';
  h += '<label class="act">担当 <select id="bf-consultant">' +
    opt("", "すべて", boardFilter.consultant) +
    names.map((n) => opt(n, n, boardFilter.consultant)).join("") + "</select></label>";
  if (onlyOwner) return h + "</div>";
  h += '<label class="act">名札 <select id="bf-flag">' +
    opt("", "すべて", boardFilter.flag) +
    flags.map((x) => opt(x.label, x.label + "（" + num(x.n) + "）", boardFilter.flag)).join("") +
    "</select></label>";
  h += '<label class="act">満了まで <select id="bf-expiry">' +
    opt("", "すべて", boardFilter.expiry) +
    EXPIRY_BANDS.map((b) => opt(b.k, b.t, boardFilter.expiry)).join("") + "</select></label>";
  /* 幅は CSS の min-width / max-width で決める。ここに px を書かない */
  h += '<label class="act">案件名 <input type="search" id="bf-q" placeholder="部分一致" ' +
    'value="' + esc(boardFilter.q) + '"></label>';
  h += '<button type="button" class="act" id="bf-clear">絞り込みを外す</button>';
  return h + "</div>";
}

/* ②のコンサルタント名から③へ飛ぶ。担当で絞った状態で開く */
function drillToBoard(name) {
  boardFilter = { consultant: name, flag: "", expiry: "", q: "" };
  go("consultant", "byowner");
}

/* いま開いている項目を描き直す（並び替え・絞り込みのたびに使う）。
   取り直しはしない。手元のデータで組み直すだけ */
/** keep = 開いたままにする details の番号（幅の描き直しだけで使う。絞り込みの描き直しでは渡さない。
    行が変わると番号が別の行を指すため） */
function redrawMain(D, keep) {
  const v = viewOf(cur.menu, cur.view);
  const main = document.getElementById("cs-main");
  const fk = focusKey(document.activeElement);
  /* 本部アプローチの枠（#hq-box）の中は本文と別に描くので、開いている details も別に覚えて、
     wireHoujin が描き直すときに開き直す（幅の描き直しのときだけ。絞り込みでは覚えない） */
  const hq = keep ? document.getElementById("hq-box") : null;
  hqKeep = hq && hq.querySelectorAll ? openDetails(hq) : null;
  paintFigs(main, () => ctlbar(v, D) + v.render(D), keep);   /* 図の幅を枠に合わせる（2回描き） */
  wire(v);
  refocus(fk);
}

/* 描き直しの前後でフォーカスを保つ。
   🔴 本文を innerHTML で入れ替えると、いま触っていた選択欄・ボタンが消えて
      フォーカスが body に飛ぶ。キーボードで選択欄を↓で動かすと1回ごとに
      change が来て描き直すので、2つ目から先へ進めなくなっていた
      （2026-09-23 実機: 案件そのものの担当の選択欄, U9）。
      描き直した後に、同じ役目の部品を探してフォーカスを戻す。 */
function focusKey(a) {
  if (!a || a === document.body || !a.getAttribute) return null;
  if (a.id) return "#" + a.id;
  const tbl = a.closest && a.closest("table[id]");
  if (tbl && a.dataset && a.dataset.k != null)
    return "#" + tbl.id + ' button.sort[data-k="' + a.dataset.k + '"]';
  if (a.dataset && a.dataset.d != null) return '#hj-pick input[data-d="' + a.dataset.d + '"]';
  if (a.dataset && a.dataset.v != null) return '#cs-side button[data-v="' + a.dataset.v + '"]';
  return null;
}
function refocus(k) {
  if (!k) return;
  let e = null;
  try { e = document.querySelector(k); } catch (_) { e = null; }
  if (e && e.focus) e.focus({ preventScroll: true });
}

function boardTable(rows, sort, id) {
  const rs = rows.slice();
  const k = sort.key, asc = sort.asc;
  const col = BOARD_COLS.find((c) => c.k === k);
  const val = col && col.sv ? col.sv : (r) => r[k];
  rs.sort((a, b) => {
    const x = val(a), y = val(b);
    if (x == null && y == null) return 0;
    if (x == null) return 1;   // 値が無いものは常に末尾。0 として並べない
    if (y == null) return -1;
    const c = typeof x === "string" ? x.localeCompare(y, "ja") : x - y;
    return asc ? c : -c;
  });
  let t = '<table id="' + id + '"><thead><tr>';
  for (const c of BOARD_COLS) t += sortTh(c, k, asc);
  t += "</tr></thead><tbody>";
  for (const r of rs) {
    t += "<tr>";
    for (const c of BOARD_COLS) t += '<td' + (c.n ? ' class="n"' : "") + ">" + c.fmt(r) + "</td>";
    t += "</tr>";
  }
  return t + "</tbody></table>";
}

/* 名札を3つの意味に分ける。
   🔴 **色だけで分類を伝えない。** 色覚によっては緋・山吹・紫が見分けられない。
      棒の右に分類の言葉も書くので、白黒に印刷しても読める。
   分類の規則をここ1か所に置いているのは、①と③で食い違わないようにするため。 */
function flagGroup(label) {
  /* 🔴 「満了90日前でMTGが30日以上途絶」は満了の話でもあるので、
     先に MTG を見る。順番を入れ替えると分類が変わる */
  if (label.indexOf("MTG") >= 0) return { color: C.hi, word: "関係が危ない" };
  if (label.indexOf("NPS") >= 0 || label.indexOf("退職") >= 0)
    return { color: C.hi, word: "関係が危ない" };
  if (label.indexOf("満了") >= 0 || label.indexOf("接触") >= 0)
    return { color: C.ki, word: "時間が迫っている" };
  return { color: C.murasaki, word: "成果が出ていない" };
}

/* MTG途絶の帯の色。🔴 **色だけで意味を伝えない。**
   棒には帯の名前（日数入り）がそのまま出るので、白黒でも読める。
   🔴 2026-09-24 実機: 注意（30〜59日）を紫で塗っていて、同じ画面の名札の図では紫が
   「成果が出ていない」だった（1つの画面で紫が2つの意味）。注意は警告（山吹）の一段手前なので、
   同じ山吹を薄く塗る（MTG_BAND_FAINT）。紫は名札の「成果が出ていない」だけにする */
const MTG_BAND_COLOR = {
  critical: C.hi, red: C.ki, yellow: C.ki,
  recent: C.midori, no_record: C.ghost, onboarding: C.ghost,
};
const MTG_BAND_FAINT = { yellow: true };

/* 1行ぶんの「最後のMTG」。
   🔴 日数だけでなく**どこから取った日付か**を必ず添える。
      録画は事実、メール由来は推定（±1日で83.3%）。同じ顔で並べない。 */
function mtgCell(r) {
  if (r.mtg_band === "onboarding")
    return '<span class="muted small">立ち上がり期</span>';
  if (r.mtg_days == null)
    return '<span class="muted small">記録なし</span>';
  /* 注意（30〜59日）は警告と同じ山吹で、太字にしない（帯の図の薄い山吹と同じ扱い。紫は使わない） */
  const col = r.mtg_band === "critical" ? "hi"
            : r.mtg_band === "red" || r.mtg_band === "yellow" ? "ki" : "midori";
  const tagB = r.mtg_band === "yellow" ? "span" : "b";
  const src = r.mtg_source === "recording" ? "録画"
            : r.mtg_source === "mail" ? "メール（推定）"
            : r.mtg_source === "both" ? "録画" : "";
  return "<" + tagB + ' style="color:var(--' + col + ')">' + num(r.mtg_days) + "日前</" + tagB + ">" +
    (src ? '<span class="muted small"> ' + esc(src) + "</span>" : "") +
    (r.mtg_forced_by_expiry ? '<span class="muted small"> 満了前</span>' : "");
}

function flagFig(D, subset) {
  /* subset を渡すと、絞り込んだ後の件数で数え直す。
     🔴 絞り込み中に全件の図を出すと、表と図で件数が食い違って読めなくなる。 */
  let fc = D.meta.flag_counts || [];
  if (subset) {
    const m = {};
    for (const r of subset) for (const f of (r.flags || [])) m[f] = (m[f] || 0) + 1;
    fc = Object.entries(m).map((e) => ({ label: e[0], n: e[1] }));
  }
  return fig("名札ごとの件数" + (subset ? "（絞り込んだ " + num(subset.length) + " 件）" : ""),
    "1つの案件に複数つきます",
    fc.length
      ? svgBarH({ w: 700, fmt: F.int, rh: 24,
          rows: fc.slice().sort((a, b) => b.n - a.n).map((x) => ({
            label: tail(x.label, 26), full: x.label, v: x.n, txt: num(x.n) + "件",
            note: flagGroup(x.label).word, color: flagGroup(x.label).color })) })
      : '<div class="empty">名札の付いた案件がありません。</div>',
    lg("box", C.hi, "関係が危ない") + lg("box", C.ki, "時間が迫っている") +
    lg("box", C.murasaki, "成果が出ていない") +
    '<i class="full">棒の右に分類の言葉も書いています。' +
    "<b>色が見分けられなくても読めます。</b></i>");
  /* 🔴 ここに並びの決まり（order_rule）も書いていて、案件そのものでは頭の「この並びについて」と
     同じ文が2回出ていた（2026-09-23 実機, V21 の残り）。並びは表の話なので、表の側に1回だけ出す */
}

      : '<div class="empty">帯を出せる案件がありません。</div>',

     並びは表ごとに持つ todaySort（U6） */

  h += note("def", "この並びについて", esc(D.meta.order_rule));

/* ---------------------------------------------------------------- 2 案件の立ち位置 */
function renderBoard(D) {
  const shown = boardApply(D.rows);
  const on = boardFilterOn();

      h += sec("表", "担当者ごとの持ち件数（" + num(ks.length) + " 名）");

    h += note("def", "この並びについて", esc(D.meta.order_rule));

  h += '<div class="count-line' + (on ? " on" : "") + '" id="board-count">' +
    "<b>" + num(D.rows.length) + " 件中 " + num(shown.length) + " 件</b>を表示" +

  h += shown.length
    ? scroll(boardTable(shown, boardSort, "board-tbl"), 640)
    : '<div class="empty">この条件に当てはまる案件はありません。' +
      "「絞り込みを外す」で戻せます。</div>";
  return h + foot(D.meta);

function wireBoard() {
  const redraw = () => {
    redrawMain(boardCache);
  };
  const pick = (id, key) => {
    const e = document.getElementById(id);
    if (e) e.onchange = () => { boardFilter[key] = e.value; redraw(); };
  };
  pick("bf-consultant", "consultant");
  /* 担当を選ぶ前の持ち件数の表。名前を押したらその担当で絞る（②の表と同じ作り）。
     🔴 押したリンクは描き直しで消えるので、フォーカスが body に飛んでいた（2026-09-23 検証、
     Playwright 400px で Enter → activeElement が BODY）。focusKey では戻す先が作れないので、
     いま選ばれた担当が出ている選択欄（#bf-consultant）へ移す */
  document.querySelectorAll("#owner-tbl a.drill").forEach((a) => {
    a.onclick = (ev) => {
      ev.preventDefault(); boardFilter.consultant = a.dataset.c; redraw(); refocus("#bf-consultant");
    };
  });
  pick("bf-flag", "flag");
  pick("bf-expiry", "expiry");
  const q = document.getElementById("bf-q");
  if (q) {
    /* 1文字ごとに 703 行を組み直すと重い。打ち終わってから当てる */
    let t = null;
    q.oninput = () => {
      clearTimeout(t);
      t = setTimeout(() => {
        boardFilter.q = q.value;
        redraw();
        const e = document.getElementById("bf-q");
        if (e) { e.focus(); e.setSelectionRange(e.value.length, e.value.length); }
      }, 260);
    };
  }
  const cl = document.getElementById("bf-clear");
  if (cl) cl.onclick = () => {
    boardFilter = { consultant: "", flag: "", expiry: "", q: "" };
    redraw();
  };
  document.querySelectorAll("#board-tbl th.sortable button.sort").forEach((th) => {
    th.onclick = () => {
      boardSort = nextSort(boardSort, th.dataset.k);
      redrawMain(boardCache);
    };
  });
}
let boardCache = null;

/* 同じ列を押したら向きを反転、別の列なら既定の向き（名前・残り日数は小さい順、他は大きい順） */
function nextSort(s, kk) {
  if (s.key === kk) return { key: kk, asc: !s.asc };
  return { key: kk, asc: kk === "name" || kk === "consultant" ||
                         kk === "days_left" || kk === "days_since_contact" };
}

/* ①今日動く先の3つの表の並び。表ごとに持つ（1つ並べ替えても他の表は動かさない）。
   🔴 見出しは button で「押すと並び替わります」と読み上げるのに、ここだけ押しても
      何も起きなかった（2026-09-23 実機: 3表とも並びが変わらない, U6）。 */
let todaySort = {
  "today-tbl": { key: "n_flags", asc: false },
  "new-tbl": { key: "start", asc: false },
  "soon-tbl": { key: "days_left", asc: true },
};
function wireToday() {
  Object.keys(todaySort).forEach((id) => {
    document.querySelectorAll("#" + id + " th.sortable button.sort").forEach((th) => {
      th.onclick = () => {
        todaySort[id] = nextSort(todaySort[id], th.dataset.k);
        redrawMain(lastPayload);
      };
    });
  });
}

/* ---------------------------------------------------------------- 5 調査と定義 */
/* 🔴 調査の成果は一度読めば済む。毎朝の動線から外して、ここに畳む。消さない。 */
/* ---------------------------------------------------------------- 担当の交代 */
/* 🔴 交代が良かったか悪かったかは判定しない。記録を並べるだけ。
   🔴 「誰から誰へ」でまとめない（`from`/`to` は読めば分かる列で、
      テスト用データでは1行1人に伏せてある。まとめると処理が素通りする）。 */
/** 交代の行の状態。state_label（稼働中／決着済／取引が見つからない）をそのまま出す */
function stateTag(r) {
  const lab = r.state_label || (r.is_active ? "稼働中" : "決着済");
  if (lab === "稼働中") return '<span class="tag e">稼働中</span>';
  if (lab === "決着済") return '<span class="tag d">決着済</span>';
  return '<span class="n0">' + esc(lab) + "</span>";
}

/** 担当の交代の表の「前の担当」「次の担当」。
    🔴 2026-09-24 実機: 担当者一覧に無い人の名前（サーバの person_label）が
    「氏名が分からない担当（HubSpotの担当者一覧に無い）」と長く、その行だけ3〜4行に折れて高くなっていた。
    表では「氏名不明」と短く出し、意味は title と表の上の1文で補う（*_unresolved はサーバの判定） */
const UNRESOLVED_TITLE = "HubSpot の担当者一覧に無い担当です（元の記録にはメールアドレスしか残っていません）";
function whoCell(label, unresolved) {
  if (unresolved) return '<span class="n0" title="' + esc(UNRESOLVED_TITLE) + '">氏名不明</span>';
  return esc(label) || DASH;
}
