/* ================================================================ データの鮮度 */
/* 🔴 この画面は毎朝見るもの。**古いデータを新しいものと誤認させないのは画面の責任**。
   meta.today は「計算に使った基準日」で、シートを作り直した日時とは**別物**。
   日次更新が止まると（2026-09-23〜28 に実際に5日止まった。00 の項目68）、基準日だけ今日になっていて
   中身は何日も前、ということが起きる。だから作成日時のほうを主に出す。
   取れないときは「分かりません」と書く。推測で埋めない。
   🔴 S-9（2026-09-28）: 更新は毎晩タスクスケジューラで回るようになった。帯の文言をそれに合わせ、
   予定の時刻は meta.update_schedule（CS_メタ か環境変数。無ければ null）から出す。直書きしない。
   緑（今日／昨日）のときは1行に畳む（帯が毎画面の頭で2行＝約65px を使っていた）。
   黄・赤のときは今までどおり2行で、抜けている日数を太字で出す。 */
/** 「yyyy-MM-dd HH:mm:ss」を「MM-dd HH:mm」に。緑の1行目だけで使う（年は「今日／昨日」で決まる。
    全文は畳んだ内訳に残す）。形が違えばそのまま返す */
function shortWhen(s) {
  return /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(s || "") ? s.slice(5, 16) : (s || "");
}
function setFresh(meta) {
  const box = document.getElementById("cs-fresh");
  if (!box) return;
  const src = meta && meta.source_as_of;      /* HubSpot から落とした時刻 */
  const srcAge = meta && meta.source_age_days;
  const gen = meta && meta.generated_at;      /* シートを作り直した時刻 */
  const base = meta && meta.today;            /* 計算に使った今日 */
  const sched = meta && meta.update_schedule; /* 自動更新の予定（例「毎日 21:30」）。無ければ時刻を言わない */

  /* 🔴 取れないときは「分かりません」と書く。推測で埋めない */
  if (!src && !gen) {
    box.className = "fresh bad";
    box.innerHTML = "<b>このデータがいつのものか分かりません。</b>" +
      "作成日時を記録したシート（CS_メタ）が読めていません。" +
      "画面の数字が今日のものだと思わないでください。" +
      (base ? '　<span class="muted">計算の基準日 ' + esc(base) + "</span>" : "");
    return;
  }

  /* 何日前かは**元データを落とした時刻**で数える。
     古いデータを詰め直すとシートの生成時刻だけ新しくなるため。 */
  const age = srcAge != null ? srcAge : null;
  let word, cls;
  if (age == null)    { word = "";           cls = "warn"; }
  else if (age <= 0)  { word = "今日";       cls = "ok"; }
  else if (age === 1) { word = "昨日";       cls = "ok"; }
  else if (age <= 3)  { word = age + "日前"; cls = "warn"; }
  else                { word = age + "日前"; cls = "bad"; }
  box.className = "fresh " + cls;

  const when = src || gen;
  const oneLine = cls === "ok";   /* 緑は1行。内訳（details）を行の続きに置く */
  let h;
  if (oneLine) {
    /* 「（HubSpot から落とした時刻）」は span.src に入れ、600px 以下では出さない（畳んだ内訳の1文目が同じことを言う。
       400px では帯が2行（58px）になっていた。2026-09-28 検証） */
    h = "<b>" + word + "　" + esc(shortWhen(when)) + "</b> 時点のデータ" +
      '<span class="src">' + (src ? "（HubSpot から落とした時刻）" : "（シートを作った時刻）") + "</span>";
  } else {
    h = "このデータは <b>" + (word ? word + "　" : "") + esc(when) + "</b> 時点のものです" +
      (src ? "（HubSpot から落とした時刻）。" : "（シートを作った時刻）。");
    if (age != null && age >= 4) {
      h += "<b>" + age + "日分の動きが入っていません。</b>";
    }
  }
  /* 🔴 1行目（何日前・いつ時点・何日分が抜けているか）は畳まない。毎朝まず読むもの。
     残りの時刻の内訳だけ畳む（V1: 全画面の頭で2行を使い、本題を下へ押していた）。
     緑のときは畳みを行の続き（inl）に置いて、帯を1行にする */
  h += '<details class="fold' + (oneLine ? " inl" : "") + '"><summary>ほかの時刻' +
    (oneLine ? "" : "（シートの作成・計算の基準日）") + "</summary>" +
    '<span class="muted">';
  /* 1行目を短くしたときだけ、元の全文をここに残す（黙って削らない） */
  if (oneLine && when) h += (src ? "元データを落としたのは " : "シートを作ったのは ") + esc(when) + "。";
  if (gen && src && gen.slice(0, 10) !== src.slice(0, 10)) {
    /* 🔴 3つの時刻は別物。混ぜないで並べる */
    h += "シートを作り直したのは " + esc(gen) + "（元データはそれより前のもの）。";
  } else if (gen && (!oneLine || src)) {
    h += "シートを作り直したのは " + esc(gen) + "。";
  }
  if (base) h += "計算の基準日は " + esc(base) + "（データの新しさとは別物）。";
  /* 🔴 予定は meta から。無ければ自動更新のことは何も言わない（推測で 21:30 と書かない。
     「自動で回しています」を HTML に直書きすると、スケジューラを外した日から帯が嘘を言う。S-9「無ければ文言を出さない」）。
     赤の線引き（4日以上前）はこの関数の上の判定と同じ値。すでに赤いときは「止まると赤くなります」ではなく、いま赤い理由を言う */
  if (sched) h += "自動更新: " + esc(sched) + "（タスクスケジューラ）。";
  h += (cls === "bad"
    ? "元データが4日以上前なので、この帯を赤くしています（" +
      (sched ? "予定「" + esc(sched) + "」の更新が入っていません" : "更新が止まっている可能性があります") + "）。"
    : "更新が止まると、この帯が赤くなります（元データが4日以上前）。") + "</span></details>";
  box.innerHTML = h;
}

/* ================================================================ 複数の画面を 1 つにした画面（段A、2026-09-29）
   前の画面の描画（render*）を「節」として並べる。節の見出しは前の画面の問いを 1 段下げたもの（h2.sec.mid）で、
   左の小さな字（.no）に前の画面の名前を出す（どこから移ってきたかが分かる。旧ハッシュの転送は ?at=<節の id> でここへ飛ぶ）。 */

/** 前の画面の描画を節にする。先頭の問い（h2.sec.mincho）に id と前の画面の名前を付け、問いを 1 段下げる（h2.sec.mid）。
    2 つ目以降の問い（担当の交代の「交代の前後で…」など）も同じ段に下げる（画面の問いは 1 つ）。
    問いが無い描画には、節の見出しを頭に足す */
function partSec(html, name, id) {
  const Q = '<h2 class="sec mincho"><span class="no">問い</span>';
  const s = String(html || "");
  const i = s.indexOf(Q);
  const head = '<h2 class="sec mincho mid" id="' + esc(id) + '" tabindex="-1"><span class="no">' + esc(name) + "</span>";
  if (i < 0) return head + esc(name) + "</h2>" + s;
  return s.slice(0, i) + head + s.slice(i + Q.length).split(Q).join('<h2 class="sec mincho mid"><span class="no">問い</span>');
}
/** 画面の頭の目次。押すと同じ画面の節へ（jumpTo）。🔴 <a href="#節"> にしない（ハッシュは画面の場所に使っている。
    押すと URL が画面でないハッシュに変わり、再読込で既定の画面へ落ちる）。wire → wireToc が結ぶ */
function toc(items) {
  return '<nav class="toc" aria-label="この画面の中の節">この画面の中: ' +
    items.map((x) => '<button type="button" class="act link" data-jump="' + esc(x[0]) + '">' + esc(x[1]) + "</button>").join("") +
    "</nav>";
}
function wireToc() {
  document.querySelectorAll("#cs-main .toc button[data-jump]").forEach((b) => {
    if (!b.onclick) b.onclick = () => jumpTo(b.dataset.jump, true);
  });
}
/** more で取った応答（load が _more に付ける）。無い（古いキャッシュ・テストの偽の応答）ときは null */
const moreOf = (D, k) => (D && D._more && D._more[k]) || null;
/** more が無いときの節（load は more の失敗で画面ごと失敗にするので、ここに来るのは応答の形が違うときだけ） */
const missingPart = (name) => '<div class="err">' + esc(name) + " のデータがありません。「読み直す」を押してください。</div>";

/* ---------------------------------------------------------------- 8 記録と数字の信頼度（09 の 3章 8）
   前の「データ品質」「MTG の品質」「定義と検証」を 1 画面に。🔴 中身は全部残す（どの節も前の描画そのまま）。
   順は 09 のとおり: データの欠け・偏り（法人番号の出どころ・記入率の偏り）→ MTG の記録の埋まり具合・リスク判定の分布 →
   色と印の意味・守っていること・定義。題字の行の「色と印の意味 →」は ?at=trust-defs で最後の節へ飛ぶ */
function renderTrust(D) {
  const Q = moreOf(D, "mtgq");
  /* 問いは節（データ品質の問い「この画面の数字を、どこまで信じてよいか」）と同じ文にしない（続けて 2 回読ませない） */
  let h = sec("問い", "どの記録が欠け・偏っていて、数字はどう作っているか") +
    '<div class="lede">データの欠けと偏り、MTG の記録の埋まり具合、色と印・定義をこの 1 画面にまとめています' +
    "（前の「データ品質」「MTG の品質」「定義と検証」。中身は前のまま）。</div>" +
    toc([["trust-dq", "データの欠けと偏り"], ["trust-mtgq", "MTG の記録"], ["trust-defs", "色と印・定義"]]);
  h += partSec(renderDq(D), "データ品質", "trust-dq");
  h += Q ? partSec(renderMtgQ(Q), "MTG の品質", "trust-mtgq") : partSec(missingPart("MTG の品質"), "MTG の品質", "trust-mtgq");
  h += partSec(renderDefs(), "定義と検証", "trust-defs");
  return h;
}

/* ---------------------------------------------------------------- 仮のつなぎ（他のチームの描画が入るまで）
   🔴 中身を黙って消さないため、前の画面の描画を節として並べる。問いは 09 の新しい画面のもの。
   他のチームの関数（renderCustomer / renderRenewalPipe / renderResults / renderTeamPage）が入れば MENUS がそちらを呼ぶ */
function customerInterim(D) {
  return sec("問い", "この法人は拠点ごとにどう違うか。この事業所は契約を重ねてこられたか") +
    '<div class="lede">前の「法人番号で見る」（法人の層）と「継続を追いかける」（事業所の層）を順に並べています。' +
    "法人を選ぶと両方が切り替わります。</div>" +
    toc([["cust-houjin", "法人番号で見る"], ["cust-series", "継続を追いかける"]]) +
    partSec(renderHoujin(D), "法人番号で見る", "cust-houjin") +
    partSec(renderSeries(D), "継続を追いかける", "cust-series");
}
function teamInterim(D) {
  const C = moreOf(D, "contact"), H = moreOf(D, "handover");
  return sec("問い", "どこに手が回っていないか。接触はどう動いているか。担当はどう替わったか") +
    /* 09 の 6: 問いの直下に畳まない 1 行 */
    '<div class="lede"><b>仕事量の一覧で、担当者の評価ではありません。</b>' +
    "前の「担当者の一覧」「担当者ごとの接触」「担当の交代」を順に並べています。</div>" +
    toc([["team-list", "担当者の一覧"], ["team-contact", "接触の推移"], ["team-handover", "担当の交代"]]) +
    partSec(renderTeam(D), "担当者の一覧", "team-list") +
    partSec(C ? renderContact(C) : missingPart("担当者ごとの接触"), "担当者ごとの接触", "team-contact") +
    partSec(H ? renderHandover(H) : missingPart("担当の交代"), "担当の交代", "team-handover");
}
function resultsInterim(D) {
  const O = moreOf(D, "outcome"), R = moreOf(D, "rampup");
  return sec("問い", "継続を重ねると成果は落ちるか。成果は出ているか") +
    '<div class="lede">月に 1 回見る集計です。前の「継続回数 × 成果」「成果とリスク」「立ち上がり」を順に並べています。</div>' +
    toc([["results-renewal", "継続回数 × 成果"], ["results-outcome", "成果とリスク"], ["results-rampup", "立ち上がり"]]) +
    partSec(renderRenewal(D), "継続回数 × 成果", "results-renewal") +
    partSec(O ? renderOutcome(O) : missingPart("成果とリスク"), "成果とリスク", "results-outcome") +
    partSec(R ? renderRampup(R) : missingPart("立ち上がり"), "立ち上がり", "results-rampup");
}
/** 満了と継続（新しい画面）は前の画面に当たるものが無い。🔴 件数・金額を仮に数えて出さない（amount が月額か契約総額かを
    確かめるまで金額は出さない。09 の 10章④）。案件一覧を満了までの日数で絞った行き先を置く */
function renewalPipeInterim(D) {
  return sec("問い", "今月・来月・再来月に満了するのはどれか") +
    note("info", "この画面は作っている途中です",
      "満了月ごとの件数・金額・ステージは、金額（amount）が月額か契約総額かをデータで確かめてから出します。" +
      "それまでは案件一覧を満了までの日数で絞って見てください: " +
      EXPIRY_BANDS.filter((b) => b.k !== "far" && b.k !== "none").map((b) =>
        '<a class="golink" href="' + hashFor("board", { expiry: b.k }) + '">' + esc(b.t) + "</a>").join(" ／ ") + "。") +
    (D && D.meta ? foot(D.meta) : "");
}

/* ================================================================ 画面の並び

   メニューは左に 1 列、使う間隔で 3 つに区切る（毎日 / 調べる / 月1・確かめる）。計 11 画面。
   2026-09-29 画面の組み替え 段A（handover 09 の 3章・10章「藤巻さんの判断」）。
   🔴 前は上のメニュー（案件 / コンサルタント / 集計）＋左のサイドバーの 2 段で、17 画面あった。
      同じ API・同じ表が 2 か所にある、答えが 1 画面目に無い、毎日使う表が「集計」の奥にある（09 の 2章）。
      8 画面の骨組みに、藤巻さんの判断で残す 3 画面（担当者ごとの案件・いま見るべき顧客・電話）を足して 11。
      11 項目なら 1 列で一望できるので、2 段にしない（上のメニューは無くした）。

   ---- 画面キー（他のチームはこの鍵で hashFor / goLink / go を呼ぶ） ----
   ハッシュは #<区切りの鍵>/<画面の鍵>?<状態>（形は今までと同じ）。
   画面の鍵は全区切りで一意なので、hashFor("team") / goLink(任意, "team") / go(任意, "team") は区切りを省いてよい。
     区切り deal     「毎日」         today 今日 ／ board 案件一覧 ／ byowner 担当者ごとの案件 ／ detail 案件の詳細
     区切り research 「調べる」       customer 顧客 ／ focus いま見るべき顧客 ／ renewalpipe 満了と継続 ／ team チームと担当 ／ phone 電話
     区切り monthly  「月1・確かめる」 results 成果と継続 ／ trust 記録と数字の信頼度
   🔴 区切り「毎日」の鍵を deal のままにするのは、#deal/detail?id=… と #deal/board・#deal/today を
      変えないため（表の案件名のリンク・貼られた URL・見張りがこの形を持っている）。
   消える画面の鍵（旧ハッシュ。LEGACY で転送する）: series・houjin → customer ／ contact・handover → team ／
     renewal・outcome・rampup → results ／ mtgq・dq・defs → trust。区切りだけ変わるもの: team・byowner・focus・phone

   ---- 1 つの画面が複数の API を読むとき（more） ----
   { path: 主の API, more: { 名前: API, … } }。load() が全部を並べて取りに行き、主の応答に _more.名前 で付けて render に渡す。
   どれか 1 つでも失敗したら画面ごと失敗にする（サーバの失敗を空の図にすり替えない、と同じ）。

   ---- 他のチームの描画がまだ無い画面（仮のつなぎ） ----
   顧客（renderCustomer）・満了と継続（renderRenewalPipe）・成果と継続（renderResults）は、関数が無ければ
   前の画面の描画を節として並べる（中身を黙って消さない）。チームと担当は renderTeamPage があればそれ、無ければ
   前の「担当者の一覧」「担当者ごとの接触」「担当の交代」を並べる。節には移ってきた元の画面の名前と id を付ける
   （旧ハッシュからの転送はその節へ飛ぶ。?at=<節の id>）。

   🔴 **開いた項目だけ取りに行く。** 並べ替えただけで全部読むと重くなる。
   🔴 **折りたたみは使わない。** 左に並べば一望できるので、箱に隠す理由が無い。
*/
const MENUS = [
  { key: "deal", label: "毎日",
    views: [
      /* 既定。毎朝いちばん見るもの */
      { key: "today",    label: "今日",             path: "/api/consulting/today",
        render: (D) => renderToday(D) },
      { key: "board",    label: "案件一覧",         path: "/api/consulting/deals",
        render: (D) => renderBoard(D) },
      /* 10章⑤: 削除せず残す。置き場所は案件一覧の次 */
      { key: "byowner",  label: "担当者ごとの案件", path: "/api/consulting/deals",
        render: (D) => renderBoard(D) },
      /* 2026-09-26 藤巻さんの要望で足した。取引1件の MTG・電話（要約つき）・交代を時系列で。
         取引はハッシュの後ろ（#deal/detail?id=…）で指定する。表の案件名から来る */
      { key: "detail",   label: "案件の詳細",       path: "/api/consulting/deal-detail",
        render: (D) => renderDetail(D) },
    ] },
  { key: "research", label: "調べる",
    views: [
      /* 前の「継続を追いかける」と「法人番号で見る」を 1 つに（09 の 4 顧客） */
      { key: "customer", label: "顧客",             path: "/api/consulting/customer",
        render: (D) => (typeof renderCustomer === "function" ? renderCustomer(D) : customerInterim(D)) },
      /* 10章⑤: 削除せず残す。置き場所は顧客の次 */
      { key: "focus",    label: "いま見るべき顧客", path: "/api/consulting/focus",
        render: (D) => renderFocus(D) },
      /* 新しい画面（09 の 5）。材料は案件の行（amount・stage・days_left） */
      { key: "renewalpipe", label: "満了と継続",    path: "/api/consulting/deals",
        render: (D) => (typeof renderRenewalPipe === "function" ? renderRenewalPipe(D) : renewalPipeInterim(D)) },
      /* 前の「担当者の一覧」「担当者ごとの接触」「担当の交代」を 1 つに（09 の 6） */
      { key: "team",     label: "チームと担当",     path: "/api/consulting/consultants",
        more: { contact: "/api/consulting/contact-trend", handover: "/api/consulting/handover" },
        render: (D) => (typeof renderTeamPage === "function" ? renderTeamPage(D) : teamInterim(D)) },
      /* 10章⑤: 削除せず残す。置き場所はチームと担当の次 */
      { key: "phone",    label: "電話",             path: "/api/consulting/phone",
        render: (D) => renderPhone(D) },
    ] },
  { key: "monthly", label: "月1・確かめる",
    views: [
      /* 前の「継続回数 × 成果」「成果とリスク」「立ち上がり」を 1 つに（09 の 7） */
      { key: "results",  label: "成果と継続",       path: "/api/consulting/renewal",
        more: { outcome: "/api/consulting/outcome", rampup: "/api/consulting/rampup" },
        render: (D) => (typeof renderResults === "function" ? renderResults(D) : resultsInterim(D)) },
      /* 前の「データ品質」「MTG の品質」「定義と検証」を 1 つに（09 の 8。中身は全部残す） */
      { key: "trust",    label: "記録と数字の信頼度", path: "/api/consulting/data-quality",
        more: { mtgq: "/api/consulting/mtg-quality" },
        render: (D) => renderTrust(D) },
    ] },
];

/* いま見ているところ。既定は「毎日 → 今日」。毎朝いちばん見るもの */
let cur = { menu: "deal", view: "today" };
const loaded = {};
/* いま出している項目のデータ。チェックや絞り込みで描き直すときに使う */
let lastPayload = null;

const menuOf = (k) => MENUS.find((m) => m.key === k);
/* 法人を選んで見る項目。🔴 前は 2 つ（継続を追いかける・法人番号で見る）あった。1 か所で判定する */
const isCustView = (k) => k === "customer";
const viewOf = (m, v) => (menuOf(m) || MENUS[0]).views.find((x) => x.key === v);
/** 画面の鍵から、それを持つ区切り（鍵は全区切りで一意） */
const menuHaving = (vk) => MENUS.find((m) => m.views.some((x) => x.key === vk));

/* ================================================================ 旧ハッシュの転送（N8、handover 09 の 5章）
   組み替え前の 17 画面のハッシュ（ブックマーク・貼られた URL・前の版の本文のリンク）を新しい画面へ送る。
   鍵は「区切り/画面」（区切りだけのものは区切りの鍵）。to は新しい画面の鍵、at は移り先の中の節の id（あれば飛ぶ）、
   was は前の画面の名前（「この画面は○○に移りました」の帯に出す）。
   今日・案件そのもの（→ 案件一覧）・案件の詳細はハッシュが変わらないので載せない（#deal/today・#deal/board・#deal/detail）。
   ? 以降の状態（法人・拠点・担当・並び・単位）はそのまま渡す。受ける画面の URL_STATE に無い名前は読まれない */
const LEGACY = {
  "deal/series":         { to: "customer", at: "cust-series",     was: "継続を追いかける" },
  "deal/houjin":         { to: "customer", at: "cust-houjin",     was: "法人番号で見る" },
  "consultant":          { to: "team",                            was: "担当者の一覧" },
  "consultant/team":     { to: "team",                            was: "担当者の一覧" },
  "consultant/byowner":  { to: "byowner",                         was: "担当者ごとの案件" },
  "consultant/handover": { to: "team",     at: "team-handover",   was: "担当の交代" },
  "consultant/contact":  { to: "team",     at: "team-contact",    was: "担当者ごとの接触" },
  "study":               { to: "results",                         was: "継続回数 × 成果" },
  "study/renewal":       { to: "results",  at: "results-renewal", was: "継続回数 × 成果" },
  "study/outcome":       { to: "results",  at: "results-outcome", was: "成果とリスク" },
  "study/focus":         { to: "focus",                           was: "いま見るべき顧客" },
  "study/rampup":        { to: "results",  at: "results-rampup",  was: "立ち上がり" },
  "study/phone":         { to: "phone",                           was: "電話" },
  "study/mtgq":          { to: "trust",    at: "trust-mtgq",      was: "MTG の品質" },
  "study/dq":            { to: "trust",    at: "trust-dq",        was: "データ品質" },
  "study/defs":          { to: "trust",    at: "trust-defs",      was: "定義と検証" },
};
/* 消えた画面の鍵だけで呼ばれたとき（hashFor("dq")・go(任意, "contact") など、前の版の本文・他のチームのコード）の行き先 */
const LEGACY_VIEW = {};
Object.keys(LEGACY).forEach((k) => {
  const vk = k.indexOf("/") >= 0 ? k.split("/")[1] : "";
  if (vk && !menuHaving(vk)) LEGACY_VIEW[vk] = LEGACY[k];
});
/* 「この画面は○○に移りました」の帯を出す最後の日（N8「2週間」）。🔴 本番に入れた日から 2 週間にする。
   入れる日が決まったらここを直す（過ぎた後も転送は続け、帯だけ出さない） */
const MOVED_NOTICE_UNTIL = "2026-10-13";

/** 区切りの鍵と画面の鍵から、開く画面を決める（go・hashFor・goLink・fromHash が共通で使う）。
    返り値 { m: 区切り, v: 画面, moved: 旧ハッシュの転送（LEGACY の 1 行）か null, exact: 鍵が見つかったか }。
    - 区切りと画面がいまの MENUS にあればそのまま
    - 旧ハッシュ（LEGACY の「区切り/画面」か区切りだけ）なら新しい画面へ
    - 画面の鍵だけ合っていれば、その鍵を持つ区切りへ（区切りは省いてよい）
    - 消えた画面の鍵（LEGACY_VIEW）なら新しい画面へ
    - どれでもなければ、区切りの中で最後に開いた項目、まだ無ければ先頭（区切りも無ければ既定＝毎日の先頭） */
function resolveView(menu, view) {
  const mk = menu == null ? "" : String(menu), vk = view == null ? "" : String(view);
  if (menuOf(mk) && vk && viewOf(mk, vk)) return { m: menuOf(mk), v: viewOf(mk, vk), moved: null, exact: true };
  const lg = LEGACY[vk ? mk + "/" + vk : mk] || (vk && !menuHaving(vk) ? LEGACY_VIEW[vk] : null);
  const key = lg ? lg.to : vk;
  const hit = key ? menuHaving(key) : null;
  if (hit) return { m: hit, v: viewOf(hit.key, key), moved: lg || null, exact: true };
  const m = menuOf(mk) || MENUS[0];
  return { m: m, v: viewOf(m.key, lastView[m.key]) || m.views[0], moved: null, exact: false };
}

/** 本文から別の画面を指すときの書き方。画面の名前で書き、押すとそこへ移る。
    🔴 2026-09-24 実機（第2弾の後）: 本文に「⑧成果」「NPS は①で」「③顧客詳細」と、画面を並べ替える前の
    番号が残っていた。番号は並べ替えのたびにずれるので本文には書かない。名前は MENUS から引く（名前を変えても本文が追従する）。
    押すとハッシュが変わり、followUrl → go() でその画面が開く（戻るで元の画面へ戻れる）。
    消えた画面の鍵（"dq" など）は移り先の画面へ、節があればその節へ（?at=）。
    🔴 1 列のメニューになったので、区切りの名前（「毎日 →」）は付けない（メニューに出ているのは画面の名前だけ）。
    行き先が MENUS に無いときはリンクにしない（見張り consulting_view_rules.js が落とす） */
function goLink(menu, view) {
  const r = resolveView(menu, view);
  /* 行き先が無いときはリンクにしない。内部の key（英字）は画面に出さない（2026-09-24 検証） */
  if (!r.exact) return esc(menuOf(menu) ? menuOf(menu).label : "別の画面");
  /* 消えた画面の鍵で、移り先の中の節があるときは「顧客 → 法人番号で見る」の形で節まで書く（同じ画面へのリンクが
     2 つ並んだとき「顧客 か 顧客」にならないように） */
  const at = r.moved && r.moved.at;
  return '<a class="golink" href="' + hashFor(r.v.key, at ? { at: at } : null) + '">' +
    esc(r.v.label) + (at ? " → " + esc(r.moved.was) : "") + "</a>";
}

/* いま見ている項目の印（class / aria-current）を付け替える。
   🔴 要素を作り直さない（M-6、2026-09-28 UI/UX 改善 段2）: 前は go() のたびに nav の innerHTML を組み直していたので、
      Enter で押したボタンそのものが消えてフォーカスが body に落ち、Tab が文書の頭からやり直しになっていた
      （本題まで Tab 10〜15 回）。印だけ付け替えれば、押したボタンにフォーカスが残る。
   偽の DOM（テスト）は querySelectorAll が空を返すので、そのときは前のとおり組み直す（drawSide の分岐） */
function markCurrent(b, on, cls) {
  b.className = on ? cls : "";
  if (on) { if (b.setAttribute) b.setAttribute("aria-current", "page"); }
  else if (b.removeAttribute) b.removeAttribute("aria-current");
}

/* ---------------------------------------------------------------- 左のメニュー（1 列・3 区切り）
   区切りの名前は見出し（h2）、画面はボタン。区切りの見出しは押せない（押して何も開かないものをボタンにしない） */
function drawSide() {
  const box = document.getElementById("cs-side");
  const btns = box.querySelectorAll ? Array.from(box.querySelectorAll("button")) : [];
  const total = MENUS.reduce((a, m) => a + m.views.length, 0);
  /* すでに並んでいれば印だけ付け替える（M-6） */
  if (btns.length === total) { btns.forEach((b) => markCurrent(b, b.dataset.v === cur.view, "")); return; }
  box.innerHTML = MENUS.map((m) =>
    '<div class="sidegrp"><h2 id="side-' + m.key + '">' + esc(m.label) + '</h2><ul role="list" aria-labelledby="side-' + m.key + '">' +
    m.views.map((v) =>
      "<li><button type=\"button\" data-v=\"" + v.key + "\"" +
      (v.key === cur.view ? ' aria-current="page"' : "") + ">" +
      /* 🔴 名前の後ろの番号（「今日動く先 1」）は出さない。件数に見え、400px では次の項目とくっついていた
         （2026-09-28 UI/UX 改善 S-7、診断 ①②③）。項目は名前で参照する（goLink） */
      esc(v.label) + "</button></li>").join("") +
    "</ul></div>").join("");
  box.querySelectorAll("button").forEach((b) => {
    b.onclick = () => go(null, b.dataset.v);
  });
}

/* 区切りごとに「最後に開いた項目」を覚える（メモリ上。開き直せば消える）。
   区切りだけのハッシュ（#research）で来たときに、その区切りで最後に見ていた項目へ戻す */
const lastView = {};

/* ================================================================ URL に載せる状態（M-2、2026-09-28 UI/UX 改善 段2）
   画面の状態（絞り込み・担当・法人・拠点・帯・並べ替え）をハッシュの ? 以降に載せる。
   🔴 前は URL に残るのが画面名と詳細の取引ID（#deal/detail?id=）だけで、法人・拠点・担当・名札・満了・案件名・
      月/週・打ち切りの切替は JS の変数だけだった。貼れない・再読込で消える・戻るで復元されない（2026-09-28 診断、08 の M-2）。
   形: #<menu>/<view>?<名前>=<値>&…   値は名前ではなく鍵（法人番号・帯の鍵・列の鍵）。既定の値は載せない。名前は ABC 順。
   古い形（#deal/board、#deal/detail?id=…、#study）はそのまま開ける（? の前で画面を決め、? の後ろは名前ごとに読む）。
   名前:
     c       担当（今日・案件一覧・担当者ごとの案件）。今日では URL の c が端末の記憶（localStorage）より優先。
             無ければ端末の記憶（D-1、段1レビュー D の裁定）
     flag    名札 ／ band  MTG途絶の帯の鍵（critical など。画面には名前で出す） ／ expiry  満了までの帯の鍵（EXPIRY_BANDS.k）
     q       案件名の部分一致（案件一覧・担当者ごとの案件）、探す言葉（案件の詳細）
     houjin  法人番号（顧客） ／ site  拠点の鍵（顧客） ／ focus=1  法人の選択欄を注力だけに（顧客）
     id      取引（案件の詳細。前からある形）
     unit    week（チームと担当の接触の推移。month は既定なので載せない） ／ excl=1  右側打ち切りを代表値から外す（成果と継続）
     sort    並び替え。列の鍵、先頭に - で大きい順（案件一覧・担当者ごとの案件・チームと担当の担当者の表・今日の表）
     at      画面の中の節の id（旧ハッシュの転送・本文のリンクで、移り先の節へ飛ぶ）。一度飛んだら URL から外す（状態ではない）
   kind:
     filter  その画面だけの絞り込み。左の項目・上のメニュー・本文のリンクから入り直すと既定に戻る
             （段1レビュー D: KPI で帯を絞った後、側柱で案件そのものへ戻っても帯の絞り込みが残っていた）
     ctx     画面をまたいで持ち越すもの（法人・担当・期間の単位・打ち切りの扱い・並び）。戻る・進むでは URL のとおりに戻す
   他のチームへ: 別の画面へのリンクは hashFor(view, params) で作る（例 hashFor("board", { c: "担当A", band: "critical" })）。
   画面の鍵は MENUS の上の一覧。消えた画面の鍵（"dq" など）を渡しても移り先の画面になる（resolveView）。
   名前は上の一覧のとおり。空・null・false・既定の値は載せない */
const sortState = (get, set, cols, def) => ({
  kind: "ctx",
  get: () => { const s = get(); return s.key === def.key && s.asc === def.asc ? "" : (s.asc ? "" : "-") + s.key; },
  set: (v) => {
    const desc = v.charAt(0) === "-", k = desc ? v.slice(1) : v;
    /* 列に無い鍵は無視して既定へ（貼られた URL の値をそのまま並びの鍵にしない） */
    set(cols.some((c) => c.k === k) ? { key: k, asc: !desc } : { key: def.key, asc: def.asc });
  },
  reset: () => set({ key: def.key, asc: def.asc }),
});
const boardState = (k) => ({ kind: "filter", get: () => boardFilter[k] || "", set: (v) => { boardFilter[k] = v; },
                             reset: () => { boardFilter[k] = ""; } });
const flagState = (get, set) => ({ kind: "ctx", get: () => (get() ? "1" : ""), set: (v) => set(v === "1"), reset: () => set(false) });
const BOARD_URL_STATE = {
  c: boardState("consultant"), flag: boardState("flag"), band: boardState("band"),
  expiry: { kind: "filter", get: () => boardFilter.expiry || "",
            set: (v) => { boardFilter.expiry = EXPIRY_BANDS.some((b) => b.k === v) ? v : ""; },
            reset: () => { boardFilter.expiry = ""; } },
  q: boardState("q"),
  sort: sortState(() => boardSort, (s) => { boardSort = s; }, BOARD_COLS, { key: "n_flags", asc: false }),
};
/* 法人は顧客の画面（前は 2 画面: 継続を追いかける・法人番号で見る。isCustView）。URL から入れたときは「既定で開いています」の注記を外す。
   🔴 既定で開いた法人（customerReason が立っている）は URL に載せない（既定の値は載せない、と同じ）。前は初回の描画の後に
      syncUrl が ?houjin=… と書き、戻る・再読込でその値が「人が選んだ法人」として入って注記が消えていた
      （2026-09-29 検証 Playwright 1440px: 注記の位置 初回 98948 → 戻る -1・再読込 -1。選んでいない法人を選んだように見せる）。
      載せなければ、戻る・再読込は URL に法人が無い ＝ reset → custIndex がもう一度既定を開き、注記も出る */
const HOUJIN_URL_STATE = { kind: "ctx", get: () => (customerReason ? "" : customerHoujin),
  set: (v) => { customerHoujin = v; customerReason = ""; }, reset: () => { customerHoujin = ""; customerReason = ""; } };
const URL_STATE = {
  today: {
    /* URL の c ＞ 端末の記憶。URL に無いときだけ端末の記憶へ戻す（reset）。URL から入れても端末の記憶は書き換えない
       （書き換えるのは人が欄で選んだとき＝wireToday。貼られた「あなたの分」のリンクを開いた人の端末を、他人の担当で上書きしない） */
    c: { kind: "ctx", get: () => todayConsultant, set: (v) => { todayConsultant = v; todayFromUrl = true; },
         reset: () => { todayConsultant = loadTodayConsultant(); todayFromUrl = false; } },
    sort: sortState(() => todaySort["today-tbl"], (s) => { todaySort["today-tbl"] = s; }, TODAY_COLS, { key: "n_flags", asc: false }),
  },
  board: BOARD_URL_STATE,
  byowner: BOARD_URL_STATE,
  /* 顧客: 前の「継続を追いかける」（site）と「法人番号で見る」（focus）の両方の状態を持つ */
  customer: { houjin: HOUJIN_URL_STATE,
              site: { kind: "filter", get: () => seriesSite, set: (v) => { seriesSite = v; }, reset: () => { seriesSite = ""; } },
              focus: flagState(() => focusOnly, (b) => { focusOnly = b; }) },
  detail: { id: { kind: "filter", get: () => detailId, set: (v) => { detailId = v; }, reset: () => { detailId = ""; } },
            q:  { kind: "filter", get: () => detailQ,  set: (v) => { detailQ = v; },  reset: () => { detailQ = ""; } } },
  /* チームと担当: 前の「担当者の一覧」（sort）と「担当者ごとの接触」（unit）の両方 */
  team: { sort: sortState(() => teamSort, (s) => { teamSort = s; }, TEAM_COLS, { key: "contact_rate", asc: true }),
          unit: { kind: "ctx", get: () => (contactUnit === "month" ? "" : contactUnit),
                  set: (v) => { contactUnit = CONTACT_UNITS.some((u) => u.k === v) ? v : "month"; },
                  reset: () => { contactUnit = "month"; } } },
  results: { excl: flagState(() => renewalExcludeCensored, (b) => { renewalExcludeCensored = b; }) },
};

/** 別の画面へのリンク、いまの状態の URL を作る（M-2。他のチームもこれで作る）。
    view: "deal/board" か、view の key だけ（"board"。key は全区切りで一意）。旧ハッシュの形・消えた鍵は移り先へ（resolveView）。
    無い名前は既定（毎日 → 今日）。
    params: { c: "担当A", band: "critical" } のような名前と値。空・null・false・既定は載せない。true は "1"。名前は ABC 順に並べる
    （同じ状態は同じ文字列になる。followUrl が「同じ場所か」を文字列で比べるため）。
    例: hashFor("board", { c: "担当A", band: "critical" }) → "#deal/board?band=critical&c=%E6%8B%85%E5%BD%93A"
        hashFor("detail", { id: "70000000001" })          → "#deal/detail?id=70000000001"（前からある形と同じ） */
function hashFor(view, params) {
  const s = String(view || ""), sl = s.indexOf("/");
  /* 斜線が無ければ画面の鍵（消えた鍵も）か、区切りの鍵（旧 "study" も）。区切りだけなら、その区切りの最後に開いた項目か先頭 */
  const grp = sl < 0 && (menuOf(s) || LEGACY[s]);
  const r = sl >= 0 ? resolveView(s.slice(0, sl), s.slice(sl + 1)) : grp ? resolveView(s, "") : resolveView(null, s);
  const m = r.m, v = r.v;
  const sp = new URLSearchParams();
  Object.keys(params || {}).sort().forEach((k) => {
    const val = params[k];
    if (val == null || val === "" || val === false) return;
    sp.set(k, val === true ? "1" : String(val));
  });
  const q = sp.toString();
  return "#" + m.key + "/" + v.key + (q ? "?" + q : "");
}
/** いまの画面の、URL に載せる状態（既定の値は入れない） */
function stateParams(vk) {
  const spec = URL_STATE[vk] || {}, out = {};
  Object.keys(spec).forEach((k) => { const v = spec[k].get(); if (v != null && v !== "") out[k] = v; });
  return out;
}
/** いまの画面と状態のハッシュ */
const hashHere = () => hashFor(cur.menu + "/" + cur.view, stateParams(cur.view));
/** URLSearchParams → { 名前: 値 }（hashFor に渡す形） */
function paramsObj(sp) {
  const o = {};
  if (sp && sp.forEach) sp.forEach((v, k) => { o[k] = v; });
  return o;
}
/** URL の状態を変数に入れる。sp が null なら左の項目・上のメニューから入り直したとき（URL に何も無い）。
    strict（戻る・進む）: URL に無い名前は既定へ戻す（URL がそのときの状態の全部）。
    それ以外（リンク・貼った URL・入り直し）: filter だけ既定へ戻し、ctx（法人・担当・単位・並び）は持ち越す
    （本文の「法人番号で見る」へのリンク（goLink）で、見ていた法人が既定の法人に戻らないように） */
function applyState(vk, sp, strict) {
  const spec = URL_STATE[vk] || {};
  Object.keys(spec).forEach((k) => {
    const s = spec[k];
    if (sp && sp.has(k)) s.set(String(sp.get(k) || ""));
    else if (strict || s.kind === "filter") s.reset();
  });
}
/** いまの状態を URL に写す（履歴は積まない）。絞り込み・並び替え・法人の選び直しの後（redrawMain・load の描いた後）に呼ぶ */
function syncUrl() {
  const h = hashHere();
  if (location.hash === h) return;
  history.replaceState({ k: curKey, s: SESSION }, "", h);
}

/* 履歴の 1 件ごとの札（history.state = { k, s }）。戻る・進むで来たとき、離れる前の位置に戻し、同じ応答を取り直さないための鍵。
   🔴 リンク（<a href="#deal/detail?id=…">）で移ったときはブラウザが札の無い履歴を作るので、着いたときに replaceState で札を付ける。
   s はこの読み込みの印。再読込（F5）の後は前の札が history に残っているが、位置もデータも手元に無いので使わない */
const SESSION = String(Date.now().toString(36)) + Math.floor(Math.random() * 1e6).toString(36);
let keySeq = 0;
let curKey = null;
/* 開いた直後（最初の go）か。🔴 最初の読み込みでは本文へフォーカスを移さない。移すと読み上げが鮮度の帯
   （赤の「N日分の動きが入っていません」）を飛ばして本文から始まる（黙って隠さないの規律）。移すのは画面の中の移動だけ */
let booted = false;
const posByKey = {};   /* 札 → 離れたときの位置（ページの scrollY、表の枠の scrollTop / scrollLeft、押していた案件名） */
/** いまの位置。表の枠（.scroll）は本文の中の順番で覚える（同じ応答から描き直せば順番は同じ） */
function capturePos() {
  const boxes = [];
  try {
    document.querySelectorAll("#cs-main .scroll").forEach((s) => { boxes.push([s.scrollTop || 0, s.scrollLeft || 0]); });
  } catch (_) { /* 偽の DOM。位置は無い */ }
  const a = document.activeElement;
  const href = a && a !== document.body && a.getAttribute ? a.getAttribute("href") || "" : "";
  return {
    y: typeof window.scrollY === "number" ? window.scrollY : 0,
    x: typeof window.scrollX === "number" ? window.scrollX : 0,
    boxes,
    /* 押した案件名（詳細へのリンク）だけ覚える。戻ったとき同じ行にフォーカスを戻す（「元の行に戻す」）。
       側柱・上のメニューのボタンは覚えない（覚えると、戻ったときに「離れるために押したボタン」へ戻ってしまう。本文へ移すのが正しい） */
    fk: href.indexOf("#deal/detail?") === 0 ? '#cs-main a.deallink[href="' + href.replace(/"/g, "") + '"]' : null,
  };
}
function restorePos(p) {
  if (!p) return;
  try {
    document.querySelectorAll("#cs-main .scroll").forEach((s, i) => {
      if (p.boxes[i]) { s.scrollTop = p.boxes[i][0]; s.scrollLeft = p.boxes[i][1]; }
    });
  } catch (_) { /* 偽の DOM */ }
  window.scrollTo(p.x, p.y);
}

/* ---------------------------------------------------------------- 移動
   view を省いたら、その区切りで最後に開いた項目、まだ無ければ先頭（＝既定）を開く。
   menu は省いてよい（画面の鍵は全区切りで一意）。旧ハッシュの形・消えた画面の鍵は移り先へ（resolveView）。
   state（M-2）: 省く ＝ 左のメニューから入り直す（その画面の絞り込みは既定に戻す。法人・担当などの持ち越すものは残す）
                "keep" ＝ 呼ぶ側が変数を入れてある（KPI・担当者名から絞って開く drillTo*、案件の詳細の探す欄）
                URLSearchParams ＝ URL から（貼った・戻る・進む・本文のリンク）。無い名前は既定（今日動く先の担当だけ端末の記憶）
   trav: 戻る・進むで来たときの履歴の札（history.state.k）。同じ応答があれば取り直さず、離れたときの位置に戻す（load の opts）
   moved: 旧ハッシュから転送して来たとき（fromHash の moved）。「この画面は○○に移りました」の帯を出す（N8） */
function go(menu, view, refresh, how, state, trav, moved) {
  const r = resolveView(menu, view);
  const m = r.m, v = r.v;
  lastView[m.key] = v.key;
  atPin = null;   /* 前の画面で送った節に留めるのはやめる（holdAt） */
  /* 節へ飛ぶ（?at= か、消えた画面の鍵で呼ばれたときの移り先の節）。描いた後に load の settle が飛ぶ。戻る・進むでは飛ばない
     （離れたときの位置へ戻すのが先） */
  pendingAt = trav != null ? "" :
    (state instanceof URLSearchParams && state.get("at")) || (moved && moved.at) || (r.moved && r.moved.at) || "";
  showMoved(moved || null, v);
  /* 離れる前に、いまの位置を履歴の札ごとに覚える（戻ってきたときに戻す） */
  if (curKey != null) posByKey[curKey] = capturePos();
  /* 🔴 前はここで「案件そのものへ入るときは担当の絞り込みだけ外す」としていた（②から担当で絞った状態を持ち越すと、
     絞っていることに気づかないまま全件だと思い込む）。いまは入り直しで絞り込み（filter）を全部既定に戻すので、
     その決まりも含む（段1レビュー D: 帯の絞り込みも同じ理由で残っていた）。URL に c= が書いてあるときだけ、そのとおり絞る
     （絞っていることは件数の行「N 件中 M 件を表示（絞り込み中: 担当 …）」に出る） */
  if (state !== "keep") applyState(v.key, state instanceof URLSearchParams ? state : null, trav != null);
  cur = { menu: m.key, view: v.key };
  /* URL に残す。共有と戻るボタンのため。
     🔴 画面の中の移動は履歴に**積む**（pushState）。replaceState だと何回移動しても
        履歴が増えず、戻るで画面そのものから出てしまっていた
        （2026-09-23 実機: 2回移動しても history.length が増えない, U5）。
        開いた直後の位置合わせと、戻る・進むで来たときだけは積まない（how = "replace"）。
        積むと「戻る」を押すたびに同じ場所が増えて、いつまでも戻れなくなる。
     🔴 ハッシュが同じでも札（history.state）を付けるために replaceState する（リンクで来た履歴には札が無い） */
  const hash = hashHere();
  if (trav != null) {
    curKey = trav;
    if (location.hash !== hash) history.replaceState({ k: curKey, s: SESSION }, "", hash);
  } else {
    curKey = ++keySeq;
    if (how === "replace" || location.hash === hash) history.replaceState({ k: curKey, s: SESSION }, "", hash);
    else history.pushState({ k: curKey, s: SESSION }, "", hash);

  /* タブの名前に画面名を（M-6）。前は全画面「コンサルダッシュボード」で、タブを並べても・読み上げでも区別がつかなかった */
  document.title = v.label + " — コンサルダッシュボード";
  drawSide();
  /* 戻る・進むは離れたときの位置へ戻す（描いた後、load が restorePos）。それ以外は頭から */
  if (trav == null) window.scrollTo(0, 0);
  const focusMain = booted;   /* 開いた直後は移さない（上の booted の注記） */
  booted = true;
  load(refresh, { pos: trav != null ? posByKey[trav] || null : null, focusMain: focusMain, trav: trav });
}

/* 開いたときの位置を URL から決める。無ければ既定。
   params: ? から後ろ（画面ごとの状態。URL_STATE）。id は前からの呼び出しのために残している（params.get("id") と同じ）。
   known: 画面のハッシュか（"" と #<menu>… は true。#cs-main のような画面でないものは false。followUrl はそれを無視する）
   moved: 旧ハッシュ（組み替え前の 17 画面。LEGACY）から転送したとき、その 1 行。帯「この画面は○○に移りました」に使う */
function fromHash() {

  const qi = raw.indexOf("?");
  const p = (qi >= 0 ? raw.slice(0, qi) : raw).split("/");
  let params;
  try { params = new URLSearchParams(qi >= 0 ? raw.slice(qi + 1) : ""); } catch (_) { params = new URLSearchParams(); }
  const m = menuOf(p[0]);
  const lg = !(m && viewOf(m.key, p[1])) ? LEGACY[p[1] ? p[0] + "/" + p[1] : p[0]] : null;
  if (lg) {
    const hit = menuHaving(lg.to);
    return { menu: hit.key, view: lg.to, id: params.get("id") || "", params: params, known: true, moved: lg };
  }
  if (!m) return Object.assign(defaultPlace(), { id: "", params: params, known: !raw, moved: null });
  const v = viewOf(m.key, p[1]);
  return { menu: m.key, view: (v || m.views[0]).key, id: params.get("id") || "", params: params, known: true, moved: null };
}
/* ---------------------------------------------------------------- 移ったことの帯と節への移動（N8）
   旧ハッシュから来たときだけ、本文の上に「この画面は○○に移りました」を出す（MOVED_NOTICE_UNTIL まで）。
   次に別の画面へ移ったら消す（go が毎回 showMoved を呼ぶ）。🔴 帯を出さなくなった後も転送は続ける（ブックマークを壊さない） */
let pendingAt = "";
function localDay() {
  const d = new Date();

}
function showMoved(moved, v) {
  const box = document.getElementById("cs-moved");
  if (!box) return;
  if (!moved || localDay() > MOVED_NOTICE_UNTIL) { box.innerHTML = ""; box.hidden = true; return; }
  box.hidden = false;
  box.innerHTML = note("info", "この画面は「" + v.label + "」に移りました",
    "開いたアドレス（ブックマークなど）は、画面を組み替える前の「" + esc(moved.was) + "」のものです。" +
    "いまは「" + esc(v.label) + "」" + (moved.at ? "の中にあり、その場所まで送っています" : "で見られます") +
    "。ブックマークを付け直してください（この案内は " + esc(MOVED_NOTICE_UNTIL) + " まで出します）。");

/** 画面の中の節（id）へ送る。focus: フォーカスも移す（開いた直後は移さない。読み上げが鮮度の帯を飛ばさないように） */
function jumpTo(id, focus) {

/* 送った節に留める（N8 の検証 2026-09-29）。
   🔴 顧客の画面は描いた後にも中身が伸びる（既定の法人を取り直す 2 回目の load、本部アプローチ #hq-box の後読み）。
      飛ぶのは最初の描画の 1 回だけなので、上の節が伸びると行き先が押し出されていた
      （fixture 実測: #deal/series で cust-series の画面上の top 1440px +6481〜+11165・400px +19099。本文のリンク ?at=cust-series も +11165）。
   送った後しばらくは、本文の大きさが変わるたび（ResizeObserver）と同じ画面の描き直しのたび（settle）に、同じ節へ送り直す。
   人が動かしたら（ホイール・タッチ・キー・押す）やめる。別の画面へ移ったとき（go）と 30 秒後もやめる
   （本部アプローチは読み直しの直後で 20 秒ほどかかる。人の操作を奪い続けない上限） */

["wheel", "touchstart", "keydown", "pointerdown"].forEach((k) =>
  window.addEventListener(k, () => { atPin = null; }, { passive: true, capture: true }));
if (typeof ResizeObserver === "function") {
  const mainEl = document.getElementById("cs-main");
  if (mainEl) new ResizeObserver(() => holdAt()).observe(mainEl);
}

/** URL が空・画面でないときの行き先。毎朝いちばん見る「毎日 → 今日」（見張り app_routes_no_conflict.rs） */
function defaultPlace() {
  return { menu: "deal", view: "today" };
}

/* ================================================================ 取得 */
/* retry: 「もう一度読み込む」で呼ぶもの（M-7）。ログイン切れには出さない（ログインし直す以外に手が無い）。

/** 読み込み中の骨組み（M-7）。画面名の見出し・状態の 1 行・KPI と表の空箱。数字は入れない（0 と読まれる） */
function skeleton(v, refresh) {
  const m = menuOf(cur.menu) || MENUS[0];

    '<div class="loading" id="cs-loading">' + (refresh
      /* 「読み直す」で来たときは、待つ理由と長さを書く（S-11。20 秒は実測 18.7〜24.4 秒） */
      ? "取り直し中…　HubSpot のシートを読み直しています（20 秒ほどかかります）"

/** 本文へフォーカスを移す（M-6）。移動の直後と「本文へ飛ぶ」 */
function focusMainEl() {
  const main = document.getElementById("cs-main");
  if (main && main.focus) main.focus({ preventScroll: true });

/* ログインが切れたときに出す文。
   🔴 セッションはサーバのメモリにしか無いので、**デプロイのたびに全員のログインが切れる**。
      切れた状態で API を叩くと 303 で /login の HTML が返り、それを JSON として読んで
      「Unexpected token '<' … is not valid JSON」がそのまま出ていた（U10）。
      何をすればよいかを書き、行き先のリンクを置く。 */
const LOGIN_EXPIRED_HTML = '<div class="err"><b>ログインが切れています。</b>' +
  '<a href="/login">ログインし直してください</a>。' +
  "サーバを入れ替えるたびに切れます（データが壊れたわけではありません）。" +
  "ログインした後、このページを開き直すと同じ場所が出ます。</div>";

/* 応答を JSON として読む。ログイン切れはここで見分ける。
   - 未ログインの API は 303 で /login に飛ばされ、fetch はそれを追って 200 の HTML を受け取る
     （res.redirected が立ち、res.url が /login になる）

async function readJson(res) {
  let path = "";
  try { path = new URL(res.url, location.href).pathname; } catch (_) { path = ""; }
  if (res.status === 401 || (res.redirected && /\/login$/.test(path))) {
    const e = new Error("ログインが切れています");
    e.loginExpired = true;
    throw e;

  const ct = (res.headers && res.headers.get && res.headers.get("content-type")) || "";
  if (ct && ct.indexOf("json") < 0) {
    throw new Error("サーバが JSON 以外を返しました（HTTP " + res.status + " / " + ct + "）");
  }
  return res.json();
}

/* 右側打ち切りを外すかどうか。
   🔴 チェックボックスの状態は**ここに持つ**。前は描き直した後の DOM から読んでいたので、
      描き直すとチェックが外れた表示になり、もう一度押しても
      exclude_right_censored=1 で取り直して「含める」に戻せなかった（2026-09-23 実機, U1）。 */
let renewalExcludeCensored = false;

/* 取りに行った順番。🔴 画面を素早く切り替えると、前の画面の遅い応答が後から届いて
   いまの画面を上書きしていた（2026-09-23 実機: URL は byowner なのに中身が担当者の一覧, U3）。
   応答を描く前に「自分が最後の要求か」を番号で確かめ、古いものは捨てる。 */
let loadSeq = 0;
/* 取りに行っている fetch の打ち切り（M-7）。新しい要求を出すときと、60 秒で打ち切る（前は打ち切りが無く、待ち続けた） */
let loadCtl = null;
const LOAD_TIMEOUT_MS = 60000;
/* 「もう一度読み込む」（待ちの 30 秒・失敗の枠）で取り直すときの opts。描けたら本文へフォーカスを移す（M-6）。
   🔴 前は load(refresh) と opts なしで呼んでいた。押した釦は消える（失敗の枠は display:none、待ちの枠は骨組みで上書き）ので
      フォーカスが body に落ち、focusMain も立たないので描けた後も body のまま、次の Tab は側柱の先頭からだった
      （2026-09-29 検証 Playwright: #cs-retry を Enter → 描けた後 activeElement = BODY、次の Tab は data-v="team"）。
      pos は渡さない（同じ画面の取り直しとして、いまの位置を保つ） */
const RETRY_OPTS = { focusMain: true };
/* 待ち時間の案内の予約（M-7）。3 秒で「20 秒ほどかかります」、30 秒で「もう一度読み込む」。描けたら消す */

  /* 3 秒: 見込み。「読み直す」で来たときは最初から 20 秒と書いてあるので重ねない */
  if (!refresh) at(3000, () => {
    const e = document.getElementById("cs-loading");
    if (e) e.innerHTML += '<span class="waitmore">初めて開くとき・更新の直後は 20 秒ほどかかります（HubSpot のシートを読んでいます）。</span>';

  at(30000, () => {
    const e = document.getElementById("cs-loading");
    if (e) e.innerHTML += '<span class="waitmore">30 秒たっても届いていません。' +
      '<button type="button" class="act" id="cs-retry-wait">もう一度読み込む</button></span>';
    const b = document.getElementById("cs-retry-wait");
    if (b) b.onclick = () => load(refresh, RETRY_OPTS);

/* 戻る・進むで来たときに使う、画面ごとの直前の応答（M-2）。鍵は API の道と引数（refresh を除く）。
   🔴 前は戻るのたびに取り直して「読み込み中」になり、ページと枠の位置が消えていた（24 件を上から潰すたび 3 画面戻る）。
   使うのは戻る・進むのときだけ（左の項目・リンクからの移動は今までどおり取りに行く）。「読み直す」は必ず取り直す。
   10 分より古いものは使わない（取り決め。データの時刻は鮮度の帯が応答の meta から出すので、古いものを新しいとは言わない） */
const pageCache = {};

function queryFor(path) {

  if (path === "/api/consulting/deal-detail") {

/** opts（省くと「同じ画面の取り直し」＝ 読み直す・法人の選び直し・打ち切りの切替。いまの位置を保つ）
    pos:       描いた後に戻す位置（go が渡す。戻る・進むなら離れたときの位置、それ以外は null ＝ 頭。go が先に scrollTo(0,0) している）
    focusMain: 描いた後に本文へフォーカスを移す（移動のとき。M-6）。取り直しでは触っていた部品へ戻す（U9）

async function load(refresh, opts) {

    setBusy(main, false);

       フォーカスを失って body になるので、「body か、覚えた部品のまま」のときだけ戻す */

      if (opts.focusMain) {

        if (pos && pos.fk) refocus(pos.fk);

    else holdAt();   /* 既定の法人を取り直した 2 回目の描画など。送った節に留める（atPin） */

    let n = null;

  if (!v.path) {

  const parts = [["", v.path]].concat(Object.keys(v.more || {}).map((k) => [k, v.more[k]]));

  if (refresh) todayContactCache = null;

  /* 応答を描く（取ってきたもの・手元のもの共通） */
  const show = (body, fromCache) => {
    if (cur.view === "team") teamCache = body;

       前は一度押すと、画面を移っても担当を替えても全件描画のままだった） */
    if (cur.view === "board" || cur.view === "byowner") { boardCache = body; boardShowAll = false; }
    lastPayload = body;   /* 絞り込みで描き直すときに使う。取り直しはしない */
    /* HubSpot の portal_id は全 API の meta に同じ値で載る（routes.rs freshen）。最初の応答で覚える */
    if (body.meta && body.meta.hubspot_portal_id) hsPortal = String(body.meta.hubspot_portal_id);
    setFresh(body.meta || {});
    paintFigs(main, () => ctlbar(v, body) + v.render(body));   /* 図の幅を枠に合わせる（2回描き） */
    wire(v);
    loaded[cur.menu + "/" + cur.view] = true;
    settle(fromCache);
  };

  /* 戻る・進む: 離れる前と同じ応答が手元にあれば取り直さない（M-2） */
  const hit = opts.trav != null && !refresh ? pageCache[cacheKey] : null;
  if (hit && Date.now() - hit.at < PAGE_CACHE_MS) { show(hit.body, true); return; }

  /* 読み込み中（M-6 / M-7）: aria-busy、読み上げ、骨組み。同じ画面の取り直しでは本文の高さを保って、ページが縮んで
     位置が消えないようにする（描いた後に元の位置へ戻す） */
  setBusy(main, true);
  say(v.label + " を読み込み中");
  if (sameView && typeof main.offsetHeight === "number" && main.offsetHeight > 0) main.style.minHeight = main.offsetHeight + "px";
  main.innerHTML = skeleton(v, refresh);
  startWait(my, refresh);
  try {
    const ctl = typeof AbortController === "function" ? new AbortController() : null;
    loadCtl = ctl;
    /* 60 秒で打ち切る（M-7）。前は打ち切りが無く、応答が来ないと「読み込み中」のまま何もできなかった */
    const killer = ctl && typeof setTimeout === "function" ? setTimeout(() => ctl.abort(), LOAD_TIMEOUT_MS) : 0;
    let res, more = null;
    try {
      /* 主と more を並べて取りに行く。🔴 「読み直す」（refresh=1）は主の 1 本だけに付け、more は主が返ってから取る。
         サーバの読み直しは共有キャッシュを全部捨てるので（routes.rs）、more にも付けると同じ読み直しを 2〜3 回重ねて待ちが延び、
         同時に出すと more が読み直す前の古いキャッシュを読む。読み直さないときは同時に出す */
      const opt = { credentials: "same-origin", signal: ctl ? ctl.signal : undefined };
      const rest = parts.slice(1);
      if (refresh || !rest.length) {
        res = await fetch(urlOf(v.path, refresh), opt);
        if (rest.length) more = await Promise.all(rest.map((p) => fetch(urlOf(p[1], false), opt)));
      } else {
        const all = await Promise.all(parts.map((p) => fetch(urlOf(p[1], false), opt)));
        res = all[0];
        more = all.slice(1);
      }
    } catch (e) {
      /* 打ち切り（60 秒か、新しい要求が出た）。新しい要求が出たときは下の loadSeq の確かめで抜ける */
      if (e && e.name === "AbortError") throw new Error("60 秒待っても応答がありませんでした。サーバが混んでいるか、HubSpot のシートの読み直しに時間がかかっています。");
      throw e;
    } finally { if (killer) clearTimeout(killer); if (loadCtl === ctl) loadCtl = null; }
    let body = await readJson(res);
    if (my !== loadSeq) return;   /* 後から別の画面を頼んでいる。古い応答は描かない */
    /* サーバは失敗を空配列にすり替えない。error が立っていれば中身を出す */
    if (!res.ok || body.error) throw new Error(body.message || "HTTP " + res.status);
    if (more) {
      /* more のどれかが失敗したら画面ごと失敗にする（空の節にすり替えない）。どの API かを文に書く */
      const got = {};
      for (let i = 0; i < more.length; i++) {
        const b = await readJson(more[i]);
        if (my !== loadSeq) return;
        if (!more[i].ok || b.error) throw new Error("（" + parts[i + 1][1] + "）" + (b.message || "HTTP " + more[i].status));
        got[parts[i + 1][0]] = b;
      }
      body = Object.assign({}, body, { _more: got });
    }
    pageCache[cacheKey] = { body: body, at: Date.now() };
    show(body, false);
  } catch (e) {
    if (my !== loadSeq) return;   /* 古い要求の失敗で、いまの画面を消さない */
    clearWait();
    setBusy(main, false);
    main.style.minHeight = "";
    main.innerHTML = "";
    say(v.label + " を読み込めませんでした");
    showError(e, () => load(refresh, RETRY_OPTS));
  }
}

/* 母集団の注記。🔴 **どの項目でも同じ文言・同じ数字を出す。**
   タブによって母集団が違うと、同じ画面の中で数が合わなくなる
   （②593件・③703件と食い違っていた）。サーバが `population` を
   全部の応答に同じ値で載せているので、画面はそれをそのまま出す。

   🔴 **何をいくつ外したかも書く。** 黙って消さない。AirWork広告運用は
   実在する売上で、「無かったこと」にはしない。 */
function popline(D) {
  const p = D && D.population;
  if (!p) return "";
  /* 🔴 1行目（稼働中 N 件・オプション除く）は常に見せ、外した内訳は畳む（V1）。
     3行のボックスが全画面の頭に出て、本題を下へ押していた。黙って消してはいない */
  return '<details class="popnote fold"><summary>稼働中 <b>' + num(p.active) +
    "</b> 件（オプション契約 " + num(p.active_option) + " 件を除く）</summary>" +
    '<span class="muted">稼働中 ' + num(p.active_all) + " 件から、オプション契約 " +
    num(p.active_option) + " 件を除いた数です" +
    (p.option_amount ? "（外した契約の金額は " + man(p.option_amount) +
      "。契約が無くなったわけではありません）" : "") +
    "。オプション＝求人追加・AirWork広告運用・一次対応・エントリーフォーム・追加。" +
    "全取引 " + num(p.deals_all) + " 件のうち " + num(p.deals_option) +
    " 件がオプションで、この画面は残り " + num(p.deals) + " 件を見ています。</span></details>";
}

/* 項目ごとの操作列。「継続回数 × 成果」は右側打ち切りの切り替え、
   「顧客ごとに見る」は法人の選択 */
function ctlbar(v, D) {
  /* 母集団の 1 行は操作列の中（先頭）に置いて同じ行にする（M-1。前は操作列の上の別の行で、共通枠を 40px 使っていた） */
  let h = '<div class="ctlbar">' + popline(D);
  if (usesApi(v, "/api/consulting/renewal")) {
    h += '<label class="act"><input type="checkbox" id="cs-censor"' +
      (renewalExcludeCensored ? " checked" : "") + ">" +
      "右側打ち切りを代表値から外す（結果がまだ確定していない直近の契約）</label>";
  }
  /* 選択欄に名前が無く、読み上げでは何を選ぶ欄か分からなかった（V20） */
  if (isCustView(v.key)) h += '<select id="cs-houjin" class="act" aria-label="法人を選ぶ"></select>';
  /* 担当者ごとの接触（チームと担当）: 月ごと / 週ごと。押している方は aria-pressed と太字・枠で示す（色だけにしない）。
     今日も接触の API を読むが、そちらは本人の月ごとだけなので切り替えを出さない */
  if (v.key === "team") {
    h += '<span class="act" id="ct-unit" role="group" aria-label="期間の単位">期間:' +
      CONTACT_UNITS.map((u) => '<button type="button" class="act" id="ct-unit-' + u.k + '" data-u="' + u.k +
        '" aria-pressed="' + (contactUnit === u.k ? "true" : "false") + '">' + esc(u.t) + "</button>").join("") +
      "</span>";
  }
  /* 案件の詳細: 案件名・拠点名で探す。取引を開いているときも出す（別の案件へ移るため） */
  if (v.key === "detail") {
    h += '<input type="search" id="dd-q" class="act" aria-label="案件名か拠点名で探す" placeholder="案件名か拠点名で探す" value="' +
      esc(detailQ) + '"><button type="button" class="act" id="dd-go">探す</button>';
  }
  /* 「読み直す」は操作列の右端に文字リンク程度で置く（2026-09-28 UI/UX 改善 S-11）。
     🔴 押すと ?refresh=1 で共有キャッシュを全部捨てる（routes.rs）。押した本人は 20 秒ほど待ち（実測 18.7〜24.4 秒）、
        その間は他の人の画面も止まる（mod.rs の読み直し）。代償が書かれておらず、本文の頭にあったので毎朝の作業で押されていた。
        代償を title と隣の小さな文に書き、鮮度の帯が緑（今日・昨日）でないときだけ目立たせる（.urge） */
  if (v.path) {
    h += '<span class="reload' + (staleData(D) ? " urge" : "") + '">' +
      '<button type="button" class="act link" id="cs-reload"' +
      ' title="HubSpot のシートを読み直します。取り直しに 20 秒ほどかかり、その間は他の人の画面も一時的に止まります">読み直す</button>' +
      /* 隣の文は 400px で読み直すと同じ行に収まる長さにする（前の 31 字は必ず次の行に折れ、操作列が 28px → 58px になった。
         2026-09-28 実測。「一時的に」は title に残す） */
      '<span class="muted small">取り直しに 20 秒ほど。他の人の画面も止まります</span></span>';
  }
  if (D && D.meta && D.meta.all_cached) h += '<span class="muted small">キャッシュから表示</span>';
  return h + "</div>";
}
/** 鮮度の帯が緑（今日・昨日）でないか。線引きは setFresh と同じ（元データを落とした時刻から 2 日以上、
    または何日前か分からない）。応答が無い（meta 自体が無い。定義と検証を最初に開いた）ときは目立たせない。
    🔴 meta はあるのに source_as_of も generated_at も無いのは、帯が赤（「いつのものか分かりません」= CS_メタ が
       読めていない）のときで、読み直す理由がいちばん強い。前はこの分岐を「応答が無い」と一緒に false にしていて、
       赤い帯のときだけ読み直すが目立たなかった（2026-09-28 検証の指摘） */
function staleData(D) {
  const m = D && D.meta;
  if (!m) return false;
  if (!m.source_as_of && !m.generated_at) return true;
  const age = m.source_age_days;
  return age == null || age >= 2;
}

function wire(v) {
  /* チームと担当・顧客は前の 2〜3 画面の部品を並べているので、それぞれの wire を呼ぶ（他のチームの描画に替わったら、その wire を足す） */
  if (v.key === "team") { wireTeam(); wireContact(); }
  if (v.key === "today") wireToday();
  if (v.key === "board" || v.key === "byowner") wireBoard();
  if (v.key === "customer") { wireSeries(); wireHoujin(); }
  if (v.key === "detail") wireDetail();
  wireToc();        /* 画面の頭の目次（.toc の data-jump）→ 同じ画面の節へ */
  wireKpiJumps();   /* KPI の札 → 同じ画面の行き先（段2 S-2 の残り。画面ごとの wire* の後） */
  const rl = document.getElementById("cs-reload");
  /* 押したら終わるまで押せない（S-11）。load() は同期で本文を「取り直し中…」に置き換えるので、押した直後には
     このボタン自体が画面から消えている（2026-09-28 実測: 押した直後 button_exists=false）。連打はそれで防がれる。
     🔴 disabled にするのは load(true) の**後**。Chromium は disabled になった要素からフォーカスを外すので、先に
        disabled にすると load() が覚える activeElement（U9 の focusKey）が body になり、描き直した後に
        読み直すへフォーカスが戻らなかった（2026-09-28 実測: Enter で押すと before=cs-reload → after=BODY）。
        後ろに残す disabled と文言は、同じ要素への二度目の onclick を止める保険 */
  if (rl) rl.onclick = () => {
    if (rl.disabled) return;
    load(true);
    rl.disabled = true;
    rl.textContent = "取り直し中…";
  };
  const sel = document.getElementById("cs-houjin");
  if (sel && customerIndex) {
    /* 🔴 注力だけにしているときは、選択肢もそれに合わせる。
       図だけ絞って選択肢が全件のままだと、絞ったつもりで全件から選んでしまう。
       いま開いている法人は、注力でなくても選択肢に残す（選んだものが消えると戻れない）。
       🔴 絞るのは「法人番号で見る」だけ。注力の切り替えはそちらの画面にしか無いので、
          「継続を追いかける」まで絞ると、そちらでは解除できなくなる
          （2026-09-23 実機: 401 → 117 のまま引き継がれ、トグルは無い, U4）。 */
    const list = focusOnly && v.key === "customer"
      ? customerIndex.filter((r) => r.focus || r.houjin === customerHoujin)
      : customerIndex;
    /* 🔴 件数で切らない。400件で切っていて、全517法人のうち117法人が選べなかった（U8）。
       選択欄は長くても文字を打てば飛べるので、全件を入れる */
    sel.innerHTML = '<option value="">法人を選ぶ…</option>' + list.map((r) =>
      '<option value="' + esc(r.houjin) + '">' + esc(r.name || r.houjin) +
      "（取引" + num(r.deals) + " / 拠点" + num(r.sites) + "）" +
      (r.focus ? "［注力］" : "") + "</option>").join("");
    /* 差し込み直しでも選んだ法人が残るようにする */
    if (customerHoujin) sel.value = customerHoujin;
  }
  const cz = document.getElementById("cs-censor");
  if (cz) cz.onchange = () => { renewalExcludeCensored = cz.checked; load(false); };
  const hj = document.getElementById("cs-houjin");
  /* 人が選び直したら「既定で開いています」の注記は外す。前は別の法人を選んだ後も残っていた（U12） */
  if (hj) hj.onchange = () => { customerHoujin = hj.value; customerReason = ""; load(false); };
  markScrollAll();   /* 表の枠の端の影（V12 の残り） */
}

/* 「継続を追いかける」の拠点選択 */
function wireSeries() {
  const st = document.getElementById("cs-site");
  if (st) st.onchange = () => { seriesSite = st.value; redrawMain(lastPayload); };
}

/* 「法人番号で見る」のチェックと、本部アプローチの遅延読み */
function wireHoujin() {
  const redraw = () => redrawMain(lastPayload);
  const fo = document.getElementById("hj-focus-only");
  if (fo) fo.onchange = () => { focusOnly = fo.checked; redraw(); };
  document.querySelectorAll("#hj-pick input[type=checkbox]").forEach((cb) => {
    cb.onchange = () => { houjinPick[cb.dataset.d] = cb.checked; redraw(); };
  });
  const setAll = (on) => {
    (lastPayload.deals || []).forEach((d) => { houjinPick[d.deal_id] = on; });
    redraw();
  };
  const a = document.getElementById("hj-all");
  if (a) a.onclick = () => setAll(true);
  const n = document.getElementById("hj-none");
  if (n) n.onclick = () => setAll(false);

  /* 本部アプローチは別のデータ。この項目を開いたときだけ取りに行く */
  const box = document.getElementById("hq-box");
  if (!box) return;
  const keep = hqKeep; hqKeep = null;   /* redrawMain が覚えた #hq-box の開いた details */
  if (hqCache) { paintFigs(box, () => renderHq(hqCache), keep); markScrollAll(); return; }
  fetch("/api/consulting/headquarters", { credentials: "same-origin" })
    .then(readJson)   /* ログイン切れを見分ける（U10）。r.json() だと構文エラーの文がそのまま出る */
    .then((body) => {
      if (body.error) throw new Error(body.message || "取得できません");
      hqCache = body;
      const b2 = document.getElementById("hq-box");
      if (b2) { paintFigs(b2, () => renderHq(body)); markScrollAll(); }
    })
    .catch((e) => {
      const b2 = document.getElementById("hq-box");
      if (b2) b2.innerHTML = e.loginExpired ? LOGIN_EXPIRED_HTML
        : '<div class="err">' + esc(e.message) + "</div>";
    });
}
let hqCache = null;
let hqKeep = null;

/* 戻る・進むでも同じところへ。
   🔴 pushState で積んだ履歴を戻るときは popstate が来る（hashchange はブラウザによって
      来ないことがある）。手で URL のハッシュを書き換えたときは hashchange が来る。
      両方で描き直す。どちらも位置が変わっていなければ何もしないので、2回来ても1回しか描かない。
   🔴 ここから go() するときは履歴に積まない（積むと「戻る」が効かなくなる）。 */
const followUrl = (ev) => {
  const h = fromHash();
  /* 画面でないハッシュ（「本文へ飛ぶ」の #cs-main など）では動かない */
  if (!h.known) return;
  /* 戻る・進むで来た（履歴に自分が付けた札がある）か、リンク・手打ちで来た（札が無い）か。
     🔴 リンク（<a href="#…">）を押したときも Chromium は popstate を送るが、その履歴はブラウザが作ったもので札が無い。
        札の有無で見分ける（型ではなく中身で見る）。s が違う札は前の読み込み（F5 の前）のもので、位置も応答も手元に無い */
  const st = ev && ev.type === "popstate" ? ev.state : null;
  const trav = st && st.s === SESSION && typeof st.k === "number" ? st.k : null;
  /* 同じ場所（画面も状態も同じ）なら何もしない。popstate と hashchange が両方来ても 1 回しか描かない。
     案件の詳細どうしの移動（連なりの前後の契約・付け直し元へのリンク）は画面が同じで取引（?id=）だけ違うので、ここで拾う */
  /* 旧ハッシュ（h.moved）は同じ画面でも描き直す（URL を新しい形に書き直し、移ったことの帯を出す） */
  if (!h.moved && hashFor(h.menu + "/" + h.view, paramsObj(h.params)) === hashHere()) return;
  go(h.menu, h.view, false, "replace", h.params, trav, h.moved);
};
window.addEventListener("popstate", followUrl);
window.addEventListener("hashchange", followUrl);
/* 表の枠を横に動かしたら影を付け直す。scroll は泡立たないので捕捉側で受ける */
window.addEventListener("scroll", (ev) => {
  const t = ev.target;
  if (t && t.classList && t.classList.contains("scroll") && t.parentNode) markScroll(t.parentNode);
}, true);
/* 「残り N 行を出す」（600px 以下の表。rowCap）。描き直しで作り直されるので window で捕捉して受ける */
window.addEventListener("click", rcMoreClick, true);
/* 900px 以下の側柱（段1レビュー C）: ページを下へ送っている間は上へ引き上げて隠し、上へ戻したら出す。
   側柱の高さ＋80px より上（開いた直後の 1 画面目）では隠さない。PC（>900px）では印を外すだけ。
   🔴 ページのスクロールは document で受ける（window の捕捉リスナーは表の枠の scroll 用で、見張りが 1 本だけを期待している） */
let sideLastY = 0;
function sideAwayOnScroll() {
  const side = document.getElementById("cs-side");
  if (!side || !side.classList) return;
  const narrow = typeof matchMedia === "function" && matchMedia("(max-width:900px)").matches;
  const y = window.scrollY || 0;
  if (!narrow) { side.classList.remove("side-away"); sideLastY = y; return; }
  if (y > sideLastY + 8 && y > (side.offsetHeight || 0) + 80) side.classList.add("side-away");
  else if (y < sideLastY - 8 || y <= 0) side.classList.remove("side-away");
  if (Math.abs(y - sideLastY) > 8 || y <= 0) sideLastY = y;
}
if (document.addEventListener) document.addEventListener("scroll", sideAwayOnScroll, { passive: true });
/* 窓の幅が変わったら、影を付け直し、図を新しい枠の幅で描き直す（paintFigs）。
   描き直すのは本文の幅が 24px 以上変わったときだけ（縦だけ変わる・スクロールバーの出入りでは描かない） */
let refitTimer = 0;
function refitSoon() {
  if (typeof setTimeout !== "function") return;
  clearTimeout(refitTimer);
  refitTimer = setTimeout(() => {
    const main = document.getElementById("cs-main");
    if (!main || !lastPayload || !main.querySelector || !main.querySelector("svg[data-fk]")) return;
    if (Math.abs((main.clientWidth || 0) - paintedW) >= 24) redrawMain(lastPayload, openDetails(main));
  }, 250);
}
window.addEventListener("resize", () => { markScrollAll(); refitSoon(); });
/** 畳んだ枠（details）を開いたとき、中に幅を測れずに描いた図（figAvail の data-unfit）があれば、
    開いた枠の幅で描き直す。開いている details は開いたまま描き直す（openDetails）。
    描き直した後は枠の幅が測れるので data-unfit は付かず、開き直しの toggle で繰り返さない */
function refitOpened(d) {
  if (!d || !d.open || !d.querySelector || !d.querySelector("svg[data-unfit]")) return;
  const main = document.getElementById("cs-main");
  if (!main || !lastPayload || (main.contains && !main.contains(d))) return;
  redrawMain(lastPayload, openDetails(main));
}
/* 畳んだ表（details の中）は開くまで幅が 0 なので、開いたときに影を付け直し、図を描き直す */
window.addEventListener("toggle", (ev) => { markScrollAll(); refitOpened(ev && ev.target); }, true);

/* 開いた時点で URL にも位置を残す。そのまま貼れば同じ場所が開く。? 以降の状態（担当・法人・絞り込み）も変数に入る（M-2） */
(() => {
  /* 戻る・進むの位置はこちらで戻す（restorePos）。ブラウザ側の復元は、本文が「読み込み中」で短い間に走って届かず、
     描いた後にもう一度ずれることがあるので止める */
  try { if (typeof history !== "undefined" && "scrollRestoration" in history) history.scrollRestoration = "manual"; } catch (_) { /* 対応していないブラウザ */ }
  /* 「本文へ飛ぶ」（M-6）。href の #cs-main はハッシュを画面の場所に使っているので、押したときは移動を止めて focus() だけ */
  const sk = document.getElementById("cs-skip");
  if (sk) sk.onclick = (ev) => { if (ev && ev.preventDefault) ev.preventDefault(); focusMainEl(); };
  const h = fromHash();
  go(h.menu, h.view, false, "replace", h.params, undefined, h.moved);
})();
</script>
</body>
