      if (vs.length < L.pts.length) marks.gap = true;   // 値が無い月は線が切れる（凡例で説明）
      let lo = Math.min(...vs), hi = Math.max(...vs);
      if (hi === lo) { hi = lo + 1; }
      const Y = v => bot - 8 - (lh - 18) * (v - lo) / (hi - lo);
      /* null で切れた区間ごとに線を引く（落差で切った箇所） */
      let run = [];
      const flush = () => {
        for (let k = 1; k < run.length; k++) {
          const a = run[k - 1], b = run[k];
          // 破線は持ち越した点へ向かう線だけ（svgLine と同じ。値が変わった月へ向かう線は実線）
          const dash = b.p.carry ? ` stroke-dasharray="5 4"` : "";
          g += `<path d="M${X(a.i).toFixed(1)} ${Y(a.p.v).toFixed(1)}` +
               `L${X(b.i).toFixed(1)} ${Y(b.p.v).toFixed(1)}" fill="none" ` +
               `style="stroke:${L.color}" stroke-width="2.2" stroke-linecap="round"${dash}/>`;
        }
        run = [];
      };
      /* 🔴 切れ目は p.cut で表す。「その点の手前で線を切る」意味なので、
         null を挟んで点ごと消したりしない（値は読めるまま残す）。 */
      L.pts.forEach((p, i) => {
        if (!p || p.v == null) { flush(); return; }
        if (p.cut) flush();
        run.push({ i, p });
      });
      flush();
      L.pts.forEach((p, i) => {
        if (!p || p.v == null) return;
        const t = `<title>${esc(String(months[i]))}: ${F.int(p.v)}` +
                  `${p.carry ? " / 引き継ぎ（この月は書き換えなし）" : ""}</title>`;
        g += p.carry
          ? `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.8" ` +
            `style="fill:var(--panel);stroke:${L.color}" stroke-width="1.8" stroke-dasharray="2.2 1.8">${t}</circle>`
          : `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3.6" ` +
            `style="fill:${L.color}">${t}</circle>`;
      });
      /* 右端に最小と最大だけ添える（帯ごとに縦軸が違うことを明示する）。
         🔴 値が1つしか無い帯は hi を lo+1 に広げて描いているので、その hi（実在しない値）を
         目盛りに書かない。右端の点に文字が重なっていたので、点の外まで離す（V10 目視） */
      const flat = Math.max(...vs) === Math.min(...vs);
      g += (flat ? "" : `<text class="ax" x="${(w - padR + 12)}" y="${(Y(hi) + 4).toFixed(1)}">${F.int(hi)}</text>`) +
           `<text class="ax" x="${(w - padR + 12)}" y="${(Y(lo) + 4).toFixed(1)}">${F.int(lo)}</text>`;
    }

    if (L.type === "dots") {
      // 0〜10 固定。上に値・下に「定期N」を書くぶん、上下 18px ずつ内側に描く
      const Y = v => bot - 18 - (lh - 36) * (v - 0) / 10;
      let prev = null;
      L.pts.forEach((p, i) => {
        if (!p || p.v == null) return;
        const col = p.v <= 4 ? C.hi : C.ai;
        if (prev) g += `<path d="M${X(prev.i).toFixed(1)} ${Y(prev.v).toFixed(1)}` +
                       `L${X(i).toFixed(1)} ${Y(p.v).toFixed(1)}" fill="none" ` +
                       `style="stroke:var(--ink-3)" stroke-width="1.4" stroke-dasharray="3 3"/>`;
        g += `<circle cx="${X(i).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="5" style="fill:${col}">` +
             `<title>${esc(String(months[i]))}: 定期${p.round} の回答 ${F.int(p.v)}</title></circle>` +
             `<text class="vl" x="${ancX(i).toFixed(1)}" y="${(Y(p.v) - 8).toFixed(1)}" ` +
             `text-anchor="${anc(i)}">${F.int(p.v)}</text>` +
             `<text class="ax" x="${ancX(i).toFixed(1)}" y="${(Y(p.v) + 16).toFixed(1)}" ` +
             `text-anchor="${anc(i)}">定期${p.round}</text>`;
        prev = { i, v: p.v };
      });
      g += `<text class="ax" x="${(w - padR + 12)}" y="${(Y(10) + 4).toFixed(1)}">10</text>` +
           `<text class="ax" x="${(w - padR + 12)}" y="${(Y(0) + 4).toFixed(1)}">0</text>`;
    }

    if (L.type === "bars") {
      /* 🔴 目盛りは「塗り」と「中空」の大きいほうで決めるが、
         1回でも見えるように最低の高さを持たせる（あったか無かったかを優先）。
         中空 = 広いほう（MTG は実施の事実・電話は通話の全体）
         塗り = 狭いほう（MTG は中身が読める録画・電話は60秒超の接触） */
      const vals = L.pts.flatMap(p => p ? [p.fill || 0, p.out || 0] : []);
      const hi = Math.max(1, ...vals);
      const any = Math.max(0, ...vals) > 0;
      const bw = Math.max(4, Math.min(11, iw / Math.max(1, n) / 2.4));
      L.pts.forEach((p, i) => {
        if (!p) return;
        const base = bot - 3, full = lh - 12;
        const sc = v => v > 0 ? Math.max(4, Math.min(full, full * v / hi)) : 0;
        if (p.out) {
          const hh = sc(p.out);
          g += `<rect x="${(X(i) - bw / 2).toFixed(1)}" y="${(base - hh).toFixed(1)}" ` +
               `width="${bw.toFixed(1)}" height="${hh.toFixed(1)}" fill="none" ` +
               `style="stroke:${L.color}" stroke-width="1.3" opacity=".9">` +
               `<title>${esc(String(months[i]))}: ${esc(L.outLabel)} ${p.out}</title></rect>`;
        }
        if (p.fill) {
          const hh = sc(p.fill);
          g += `<rect x="${(X(i) - bw / 2 + 1.3).toFixed(1)}" y="${(base - hh).toFixed(1)}" ` +
               `width="${(bw - 2.6).toFixed(1)}" height="${hh.toFixed(1)}" rx="1" ` +
               `style="fill:${L.color}" opacity=".9">` +
               `<title>${esc(String(months[i]))}: ${esc(L.fillLabel)} ${p.fill}</title></rect>`;
        }
        /* 🔴 何も無い月は 0 の棒ではなく、無いと分かる印だけ置く */
        if (!p.out && !p.fill) {
          marks.none = true;
          g += `<line x1="${(X(i) - 4).toFixed(1)}" y1="${(base - 1).toFixed(1)}" ` +
               `x2="${(X(i) + 4).toFixed(1)}" y2="${(base - 1).toFixed(1)}" ` +
               `style="stroke:var(--ghost)" stroke-width="2">` +
               `<title>${esc(String(months[i]))}: ${esc(L.noneLabel || "記録なし")}</title></line>`;
        }
      });
      /* 🔴 棒が1本も無い帯（全部の月が記録なし）に、目盛り「1」だけが出ていた（2026-09-24 実機）。
         描いていない高さの目盛りは書かない */
      if (any) g += `<text class="ax" x="${(w - padR + 12)}" y="${(top + 12).toFixed(1)}">${F.int(hi)}</text>`;
    }
    y = bot + gap;
  });
  /* 横にスクロールするとき、開いた直後の位置を最初にデータがある月に合わせる（figToData）。
     左のラベル欄は貼り付いて残るので、そのぶん手前にする */
  const has = (p) => p && (p.v != null || p.fill > 0 || p.out > 0);
  const first = Math.min(n, ...lanes.filter((L) => !L.empty).map((L) => {
    const k = (L.pts || []).findIndex(has); return k < 0 ? n : k; }));
  marks.fk = slot.k;
  /* 月が1つだけの図は、その点が真ん中（右の奥）に来るので、最初の月でも合わせる。
     枠の幅で描いた図（narrow）は横にスクロールしないので合わせない */
  if (first < n && !narrow) marks.x0 = X(first) - padL - 20;
  /* 開いた直後は最新の側（値がある最後の月と、右の目盛りの欄）を右端に見せる（figToData の data-xr。x0 より優先）。
     🔴 2026-09-24 実機（ループ5, 400px, series「サブスク継続①＿日本梱包運輸倉庫 筑…」）: 他の推移の図は
     ループ4 で新しい側から開くようにしたが、この図だけ x0 のままで、開いた直後が古い側（scrollLeft=0/543）だった。
     左のラベルは stickyLabels で貼り付いたまま残る */
  let last = -1;
  lanes.forEach((L) => { if (!L.empty) (L.pts || []).forEach((p, i) => { if (has(p) && i > last) last = i; }); });
  if (last >= 0 && !narrow) marks.xr = Math.min(w, X(last) + padR);
  return stickyLabels(w, padL, Math.round(h - padB), labs,
    svgHead(w, h.toFixed(0), o.alt || "系列を縦に積んだ図", marks) + `${g}</svg>`);
}

/* -------------------------------------------------------------- 100%帯 */
/** 構成比。面積で大小を見せる。ラベルは帯の中か下に必ず書く */
function svgStack(o) {
  const parts = (o.parts || []).filter(p => p.v > 0);
  if (!parts.length) return `<div class="empty">出せる値がありません。</div>`;
  const total = parts.reduce((a, b) => a + b.v, 0);
  /* 🔴 帯は枠の幅にそのまま収める（横スクロールにしない）。paintFigs が測った枠の幅で描き直す。
     2026-09-24 実機（400px）: 680px で描いた帯が枠（約 334px）の中で横スクロールになり、
     右端の「2＝最優先 4.3%」（赤）が開いた直後に見えなかった。帯の中の文字は入る区間だけに書き、
     名前・件数・率は凡例（stackLegend）に全部出しているので、狭く描いても読めなくなるものは無い */
  const slot = figSlot();
  const w = slot.avail ? Math.min(slot.avail, FIT_MAX) : (o.w || 660), bh = o.bh || 36, h = bh + 12;
  let x = 0, g = "";
  parts.forEach((p, i) => {
    /* 細い区間も 2px は残す（最優先の 26 件が 0.5px の線に潰れて見えなくならないように） */
    const pw = w * p.v / total;
    const col = p.color || SERIES[i % SERIES.length];
    /* open: 未確定（右側打ち切り）の区間。規律どおり中空＋破線で描き、確定した塗りと混ぜない */
    g += (p.open
      ? `<rect x="${(x + 1).toFixed(1)}" y="7" width="${Math.max(0.5, pw - 3).toFixed(1)}" height="${bh - 2}" rx="2" style="fill:var(--panel);stroke:${col}" stroke-width="1.6" stroke-dasharray="4 3">`
      : `<rect x="${x.toFixed(1)}" y="6" width="${Math.max(2, pw - 1).toFixed(1)}" height="${bh}" rx="2" style="fill:${col}" opacity="${p.faint ? ".3" : ".85"}">`) +
         `<title>${esc(p.label)}: ${F.int(p.v)} (${(p.v / total * 100).toFixed(1)}%)</title></rect>`;
    // 🔴 細い区間に文字を置くと必ず隣と重なる。帯の中は「入るときだけ」。
    //    ラベルと件数は下の凡例(stackLegend)で全件そろえる
    // 🔴 薄く塗った区間に白文字を載せると読めない。文字色を地の濃さで切り替える
    if (pw > 46)
      g += `<text x="${(x + pw / 2).toFixed(1)}" y="${(6 + bh / 2 + 4).toFixed(1)}" text-anchor="middle" style="fill:${p.faint || p.open ? "var(--ink-2)" : "var(--panel)"};font-size:11.5px;font-weight:700">${(p.v / total * 100).toFixed(1)}%</text>`;
    x += pw;
  });
  return svgHead(w, h, o.alt || "構成比", { fk: slot.k }) + `${g}</svg>`;
}
/** 100%帯の凡例。区間の幅に関係なく、全部の名前・件数・率を必ず出す */
function stackLegend(parts) {
  const total = parts.reduce((a, b) => a + b.v, 0);
  /* 粒の濃さは帯と同じにする（faint の帯を不透明の粒で示すと、別の色に見える） */
  return parts.map((p, i) => lg(p.hatch ? "hatch" : p.open ? "openbox" : "box", p.color || SERIES[i % SERIES.length],
    `${esc(p.label)} <strong>${F.int(p.v)}</strong> 件 / ${(p.v / total * 100).toFixed(1)}%`,
    p.open || p.hatch ? null : p.faint ? STACK_FAINT_OP : STACK_OP)).join("");
}
/** 100%帯のうち hatch の区間を斜線で描き替える（svgStack の出力を後から直す。部品は変えない）。
    値が無い区間に使う。中まで塗ると、中空・破線（未確定）の区間より確かなものに見えてしまう。
    形が読めないときは何もしない（見張りが落ちる） */
function stackHatch(svg, parts) {
  const hs = parts.filter((p) => p.hatch && p.v > 0);
  if (!hs.length) return svg;
  const col = hs[0].color || C.ghost;
  const id = "cs-hatch-nodata";
  let n = 0;
  const out = String(svg)
    .replace(/<rect x="([0-9.]+)" y="6" width="([0-9.]+)" height="([0-9.]+)" rx="2" style="fill:[^"]+" opacity="[.0-9]+">(<title>([^<:]*):[^<]*<\/title>)<\/rect>(<text [^>]*style="fill:var\(--panel\))?/g,
      (all, x, w, h, t, label, tx) => {
        if (!hs.some((p) => p.label === label)) return all;
        n++;
        return `<rect x="${x}" y="6" width="${w}" height="${h}" rx="2" style="fill:url(#${id});stroke:${col}" stroke-width="1" data-fill="hatch">${t}</rect>` +
          (tx ? tx.replace("var(--panel)", "var(--ink-2)") : "");
      });
  if (n !== hs.length) return svg;
  const defs = `<defs><pattern id="${id}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">` +
    `<rect width="6" height="6" style="fill:var(--panel)"/><line x1="0" y1="0" x2="0" y2="6" style="stroke:${col}" stroke-width="1.6"/></pattern></defs>`;
  return out.replace(/(<svg [^>]*>)/, "$1" + defs);
}

/* ------------------------------------------------------------ 充足率の面 */
/** 何が埋まっていて何が空かを面で見る。色の濃さ＋数字の二重表示 */
function svgMatrix(o) {
  const cols = o.cols, rows = o.rows;
  const cw = o.cw || 108, rh = 28, padL = o.padL || 190, padT = 34;
  const w = padL + cols.length * cw + 8, h = padT + rows.length * rh + 6;
  let g = "";
  cols.forEach((c, j) =>
    g += `<text class="axl" x="${(padL + j * cw + cw / 2).toFixed(1)}" y="${padT - 12}" text-anchor="middle">${esc(c)}</text>`);
  rows.forEach((r, i) => {
    const y = padT + i * rh;
    g += labText(padL - 10, y + 18, r.label, padL - 14, "", r.full);
    r.cells.forEach((cell, j) => {
      const x = padL + j * cw;
      if (cell.v == null) {
        g += `<rect x="${x}" y="${y + 3}" width="${cw - 6}" height="${rh - 7}" rx="3" fill="none" style="stroke:var(--ghost)" stroke-width="1" stroke-dasharray="3 3"/>` +
             `<text class="ax" x="${(x + (cw - 6) / 2).toFixed(1)}" y="${y + 18}" text-anchor="middle" style="fill:var(--ghost)">—</text>`;
        return;
      }
      const col = cell.color || (cell.v >= .8 ? C.midori : cell.v >= .5 ? C.ki : C.hi);
      g += `<rect x="${x}" y="${y + 3}" width="${cw - 6}" height="${rh - 7}" rx="3" style="fill:${col}" opacity="${(0.1 + cell.v * 0.55).toFixed(3)}"/>` +
           `<rect x="${x}" y="${y + 3}" width="${cw - 6}" height="${rh - 7}" rx="3" fill="none" style="stroke:${col}" stroke-width="1" opacity=".5"/>` +
           `<text class="vl" x="${(x + (cw - 6) / 2).toFixed(1)}" y="${y + 18}" text-anchor="middle">${esc(cell.txt != null ? cell.txt : F.pct1(cell.v))}</text>` +
           `<title>${esc(r.label)} / ${esc(cols[j])}: ${esc(cell.txt != null ? cell.txt : F.pct1(cell.v))}${cell.n != null ? " (n=" + cell.n + ")" : ""}</title>`;
    });
  });
  return svgHead(w, h, o.alt || "充足率") + `${g}</svg>`;
}

/* ------------------------------------------------------------ ヒストグラム */
function svgHist(o) {
  const vs = (o.values || []).filter(v => v != null && isFinite(v));
  if (!vs.length) return `<div class="empty">出せる値がありません。</div>`;
  const slot = figSlot();
  /* 分布は狭めても棒の並びが読める（点の数・月の数に左右されない）。枠が 280px 以上なら枠に合わせる */
  const w = fitTo(o.w || 660, slot, 280), h = o.h || 200;
  const pad = { l: 46, r: 16, t: o.yLab ? 28 : 14, b: 40 };   // 題名と最上段の目盛りを重ねない
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const lo = o.min != null ? o.min : Math.min(...vs);
  const hi = o.max != null ? o.max : Math.max(...vs);
  const nb = o.bins || 18, step = (hi - lo) / nb || 1;
  const cnt = new Array(nb).fill(0);
  vs.forEach(v => { let k = Math.floor((v - lo) / step); if (k >= nb) k = nb - 1; if (k < 0) k = 0; cnt[k]++; });
  const cmax0 = Math.max(...cnt, 1);
  // 最大の度数を覆うところまで目盛りを足し、縦軸の上端をその目盛りにする（coverTicks）
  const ytk = coverTicks(ticks(0, cmax0, 3, 1), cmax0);
  const cmax = Math.max(cmax0, ytk[ytk.length - 1]);
  const X = v => pad.l + iw * (v - lo) / (hi - lo || 1);
  const Y = c => pad.t + ih - ih * c / cmax;
  let g = "";
  ytk.forEach(t =>
    g += `<line class="gridline" x1="${pad.l}" y1="${Y(t).toFixed(1)}" x2="${w - pad.r}" y2="${Y(t).toFixed(1)}"/>` +
         `<text class="ax" x="${pad.l - 6}" y="${(Y(t) + 3.5).toFixed(1)}" text-anchor="end">${F.int(t)}</text>`);
  cnt.forEach((c, i) => {
    if (!c) return;
    const x = X(lo + i * step), bw = Math.max(1, iw / nb - 1.5);
    const col = (o.colorAt && o.colorAt(lo + (i + .5) * step)) || C.ai;
    g += `<rect x="${x.toFixed(1)}" y="${Y(c).toFixed(1)}" width="${bw.toFixed(1)}" height="${(pad.t + ih - Y(c)).toFixed(1)}" rx="1.5" style="fill:${col}" opacity=".8">` +
         `<title>${esc((o.xFmt || F.int)(lo + i * step))} 〜 ${esc((o.xFmt || F.int)(lo + (i + 1) * step))}: ${c} 件</title></rect>`;
  });
  g += `<line class="axisline" x1="${pad.l}" y1="${pad.t + ih}" x2="${w - pad.r}" y2="${pad.t + ih}"/>`;
  ticks(lo, hi, 5).forEach(t => {
    if (t < lo - 1e-9 || t > hi + 1e-9) return;
    g += `<text class="ax" x="${X(t).toFixed(1)}" y="${pad.t + ih + 15}" text-anchor="middle">${esc((o.xFmt || F.int)(t))}</text>`;
  });
  /* 🔴 代表値の印が近いと文字がぶつかる。段をずらして必ず両方読めるようにする */
  (o.marks || []).forEach((m, mi) => {
    if (m.v < lo || m.v > hi) return;
    const ly = pad.t + 7 + mi * 13;
    g += `<line x1="${X(m.v).toFixed(1)}" y1="${pad.t - 4}" x2="${X(m.v).toFixed(1)}" y2="${pad.t + ih}" style="stroke:${m.color || C.hi}" stroke-width="1.6" stroke-dasharray="4 3"/>` +
         `<text class="ax" x="${(X(m.v) + 5).toFixed(1)}" y="${ly}" style="fill:${m.color || C.hi}">${esc(m.label)}</text>`;
  });
  if (o.xLab) g += `<text class="ax" x="${w - pad.r}" y="${h - 6}" text-anchor="end">${esc(o.xLab)}</text>`;
  if (o.yLab) g += `<text class="ax" x="2" y="${pad.t - 14}">${esc(o.yLab)}</text>`;
  return svgHead(w, h, o.alt || "分布", { fk: slot.k }) + `${g}</svg>`;
}

/* ---------------------------------------------------------------- 散布図 */
function svgScatter(o) {
  const pts = (o.pts || []).filter(p => p.x != null && p.y != null);
  if (!pts.length) return `<div class="empty">両方そろう点がありません。</div>`;
  const slot = figSlot();
  /* 散布図も狭めて読める。🔴 400px で右上（金額が大きく満了が遠い点）が横スクロールの奥にあった（2026-09-24 実機） */
  const w = fitTo(o.w || 660, slot, 280), h = o.h || 300;
  const pad = { l: 56, r: 18, t: o.yLab ? 28 : 16, b: 42 };   // 題名と最上段の目盛りを重ねない
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  /* 🔴 2026-09-24 実機（ループ4, outcome の最優先の広がり）: 横軸を点の最小〜最大で取っていて、
     0 が無く（「満了まで」の日数なのに起点が読めない）、いちばん右の点が枠の右端にかかっていた。
     値がすべて 0 以上なら 0 から始め、右端は最大値を覆う目盛りまで伸ばす（縦軸と同じ coverTicks） */
  const xmin0 = Math.min(...xs), xmax0 = Math.max(...xs);
  const xlo = o.xMin != null ? o.xMin : xmin0 >= 0 ? 0 : xmin0;
  const xtk = coverTicks(ticks(xlo, xmax0, 5, minStepOf(o.xFmt || F.int)), xmax0);
  const xhi = o.xMax != null ? o.xMax : Math.max(xmax0, xtk[xtk.length - 1]);
  const yf = o.yFmt || F.int, xf = o.xFmt || F.int;
  const ylo = 0, yhi0 = o.yMax != null ? o.yMax : Math.max(...ys);
  // 最大値を覆うところまで目盛りを足し、縦軸の上端をその目盛りにする（coverTicks）
  const ytk = coverTicks(ticks(ylo, yhi0, 4, minStepOf(yf)), yhi0);
  const yhi = Math.max(yhi0, ytk[ytk.length - 1]);
  const X = v => pad.l + iw * (v - xlo) / (xhi - xlo || 1);
  const Y = v => pad.t + ih - ih * (v - ylo) / (yhi - ylo || 1);
  let g = "";
  ytk.forEach(t =>
    g += `<line class="gridline" x1="${pad.l}" y1="${Y(t).toFixed(1)}" x2="${w - pad.r}" y2="${Y(t).toFixed(1)}"/>` +
         `<text class="ax" x="${pad.l - 6}" y="${(Y(t) + 3.5).toFixed(1)}" text-anchor="end">${esc(yf(t))}</text>`);
  (o.xMax != null || o.xMin != null ? ticks(xlo, xhi, 5) : xtk).forEach(t => {
    if (t < xlo - 1e-9 || t > xhi + 1e-9) return;
    /* 右端の目盛りは右ぞろえにする（中央ぞろえだと字の半分が枠の外に出る） */
    const end = X(t) + textW(xf(t)) / 2 > w - 2;
    g += `<text class="ax" x="${(end ? w - 2 : X(t)).toFixed(1)}" y="${pad.t + ih + 15}" text-anchor="${end ? "end" : "middle"}">${esc(xf(t))}</text>`;
  });
  g += `<line class="axisline" x1="${pad.l}" y1="${pad.t + ih}" x2="${w - pad.r}" y2="${pad.t + ih}"/>`;
  // 点が重なるので少しだけ横に散らす。縦はそのまま
  let seed = 7;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648 - .5;
  pts.forEach(p => {
    const jx = (o.jitter || 0) * rnd();
    const col = p.color || C.ai;
    /* p.open: 中空・実線の丸（値は確かだが、塗りの点と分けて見せたいもの。outcome の「契約開始日が空」）。
       破線の中空（censored ＝ 未確定）とは別の印にする */
    g += p.censored
      ? `<circle cx="${X(p.x + jx).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.4" fill="none" style="stroke:${col}" stroke-width="1.3" stroke-dasharray="2 1.6" opacity=".8"><title>${esc(p.label)} / 未確定</title></circle>`
      : p.open
      ? `<circle data-open="1" cx="${X(p.x + jx).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.4" style="fill:var(--panel);stroke:${col}" stroke-width="1.6"><title>${esc(p.label)}${p.note ? " / " + esc(p.note) : ""}</title></circle>`
      : `<circle cx="${X(p.x + jx).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="3.2" style="fill:${col}" opacity=".5"><title>${esc(p.label)}</title></circle>`;
  });
  (o.line || []).forEach((p, i, arr) => {
    if (!i) return;
    const a = arr[i - 1];
    g += `<path d="M${X(a.x).toFixed(1)} ${Y(a.y).toFixed(1)}L${X(p.x).toFixed(1)} ${Y(p.y).toFixed(1)}" fill="none" style="stroke:${C.hi}" stroke-width="2.4"/>`;
  });
  if (o.xLab) g += `<text class="ax" x="${w - pad.r}" y="${h - 6}" text-anchor="end">${esc(o.xLab)}</text>`;
  if (o.yLab) g += `<text class="ax" x="2" y="${pad.t - 14}">${esc(o.yLab)}</text>`;
  return svgHead(w, h, o.alt || "散布図", { fk: slot.k }) + `${g}</svg>`;
}

/* -------------------------------------------------------------- 接触の帯 */
/** MTG・架電・担当交代を1本の時間軸に載せる。交代の前後で間隔が開いたかを目で見る */
const DAYMS = 86400000;
const dnum = s => { const t = Date.parse(String(s).slice(0, 10)); return isFinite(t) ? t / DAYMS : null; };
function svgTimeline(o) {
  const lanes = (o.lanes || []).filter(l => (l.marks || []).length || (l.spans || []).length);
  if (!lanes.length) return `<div class="empty">時間軸に載せられる出来事がありません。</div>`;
  let lo = Infinity, hi = -Infinity;
  const push = d => { if (d != null) { lo = Math.min(lo, d); hi = Math.max(hi, d); } };
  lanes.forEach(l => { (l.marks || []).forEach(m => push(dnum(m.d)));
    (l.spans || []).forEach(s => { push(dnum(s.from)); push(dnum(s.to)); }); });
  (o.rules || []).forEach(r => push(dnum(r.d)));
  if (!isFinite(lo)) return `<div class="empty">日付が読めませんでした。</div>`;
  if (hi === lo) { hi = lo + 30; lo = lo - 30; }
  const padDays = (hi - lo) * .04 + 2; lo -= padDays; hi += padDays;
  /* 注記がある図は、その文字数ぶん右を空ける。空けないと帯の上に重なって読めない */
  const noteW = Math.max(0, ...lanes.map(l => String(l.note || "").length)) * 10.4;
  /* 🔴 ラベル欄は文字数から決める。128px 固定だと契約名の頭が切れ、
     「ク継続①」のように読めなくなっていた（V10 実測） */
  const slot = figSlot();
  const w = widen(o.w || 680, slot), rh = 34, padL = o.padL || Math.max(128, labW(lanes, 230)), padT = 26,
        padR = noteW ? Math.min(300, Math.ceil(noteW + 12)) : 16;
  const h = padT + lanes.length * rh + 34;
  const iw = w - padL - padR;
  const X = d => padL + iw * (d - lo) / (hi - lo || 1);
  let g = "";
  // 年月の目盛り
  const months = [];
  const d0 = new Date(lo * DAYMS), d1 = new Date(hi * DAYMS);
  let cur = new Date(Date.UTC(d0.getUTCFullYear(), d0.getUTCMonth(), 1));
  const stepM = Math.max(1, Math.ceil((hi - lo) / 30.5 / 9));
  while (cur <= d1) {
    months.push(new Date(cur));
    cur = new Date(Date.UTC(cur.getUTCFullYear(), cur.getUTCMonth() + stepM, 1));
  }
  months.forEach(m => {
    const x = X(m.getTime() / DAYMS);
    if (x < padL - 1 || x > w - padR + 1) return;
    const ml = `${m.getUTCFullYear()}-${String(m.getUTCMonth() + 1).padStart(2, "0")}`;
    g += `<line class="gridline" x1="${x.toFixed(1)}" y1="${padT - 8}" x2="${x.toFixed(1)}" y2="${padT + lanes.length * rh}"/>`;
    // 🔴 右端の月は文字の半分が SVG の外に出て「2026-1」と切れていた。入らないときは文字を出さない（線は残す）
    if (x + textW(ml) / 2 <= w - 1)
      g += `<text class="ax" x="${x.toFixed(1)}" y="${padT + lanes.length * rh + 15}" text-anchor="middle">${ml}</text>`;
  });
  // 担当交代などの縦線。全レーンを貫く
  (o.rules || []).forEach(r => {
    const d = dnum(r.d); if (d == null) return;
    const x = X(d), col = r.color || C.hi;
    g += `<line x1="${x.toFixed(1)}" y1="${padT - 10}" x2="${x.toFixed(1)}" y2="${padT + lanes.length * rh + 2}" style="stroke:${col}" stroke-width="1.6" stroke-dasharray="4 3"/>` +
         `<path d="M${(x - 4).toFixed(1)} ${padT - 10}l4-6 4 6z" style="fill:${col}"><title>${esc(r.label || "")} ${esc(r.d)}</title></path>`;
  });
  let labs = "";
  lanes.forEach((l, i) => {
    const y = padT + i * rh + rh / 2;
    const lab = labText(padL - 9, (y + 4).toFixed(1), l.label, padL - 12, "", l.full);
    labs += lab;
    g += lab +
         `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w - padR}" y2="${y.toFixed(1)}" style="stroke:var(--rule)" stroke-width="1"/>`;
    (l.spans || []).forEach(s => {
      const a = dnum(s.from), b = dnum(s.to);
      if (a == null || b == null) return;
      g += `<rect x="${X(a).toFixed(1)}" y="${(y - 7).toFixed(1)}" width="${Math.max(1.5, X(b) - X(a)).toFixed(1)}" height="14" rx="3" style="fill:${s.color || C.ai}" opacity="${s.faint ? ".18" : ".3"}">` +
           `<title>${esc(s.label || "")} ${esc(s.from)}〜${esc(s.to)}</title></rect>`;
    });
    (l.marks || []).forEach(m => {
      const d = dnum(m.d); if (d == null) return;
      const x = X(d), col = m.color || l.color || C.ai;
      /* 🔴 thick は真偽で渡される（呼ぶ側は `thick: true`）。そのまま属性に流すと
         stroke-width="true" になり、ブラウザが無効値として既定の 1 で描く。
         太くしたい印がいちばん細く出ていた。数値のときだけその値を使う。 */
      const sw = typeof m.thick === "number" ? m.thick : m.thick ? 3.6 : 2.4;
      g += m.hollow
        ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="none" style="stroke:${col}" stroke-width="1.6" stroke-dasharray="2 1.6"><title>${esc(m.t || "")} ${esc(m.d)}</title></circle>`
        : `<line x1="${x.toFixed(1)}" y1="${(y - 6).toFixed(1)}" x2="${x.toFixed(1)}" y2="${(y + 6).toFixed(1)}" style="stroke:${col}" stroke-width="${sw}" stroke-linecap="round"><title>${esc(m.t || "")} ${esc(m.d)}</title></line>`;
    });
    if (l.note)
      g += `<text class="ax" x="${(w - 2).toFixed(1)}" y="${(y + 4).toFixed(1)}" text-anchor="end" style="fill:${l.noteColor || "var(--ink-3)"}">${esc(l.note)}</text>`;
  });
  // 左のラベルは横にスクロールしても残す（帯を縦に積む図と同じ）。下の年月の軸は重ねない
  /* 横にスクロールするときは、開いた直後をいちばん新しい側（右端。最後の印と右の注記「3回目 108万」）に
     合わせる（figToData の data-xr）。🔴 2026-09-24 実機（ループ4, series「契約の連なり」）: 開いた直後が
     古い側で、新しい契約の行（下の行）が空に見え、右の注記も奥にあった */
  return stickyLabels(w, padL, padT + lanes.length * rh, labs,
    svgHead(w, h, o.alt || "接触の時系列", { fk: slot.k, xr: w }) + `${g}</svg>`);
}

/* ------------------------------------------------------------ 小さな折れ線 */
/** 表の行に埋め込む。傾きだけ分かればよい */
function svgSpark(vals, o) {
  o = o || {};
  const w = o.w || 74, h = o.h || 20;
  const ok = vals.filter(v => v != null);
  if (ok.length < 2) return `<span class="n0" title="2点そろわないため線が引けません">—</span>`;
  const lo = Math.min(...ok), hi = Math.max(...ok);
  const X = i => 1 + (w - 2) * i / (vals.length - 1);
  const Y = v => h - 3 - (h - 6) * (v - lo) / (hi - lo || 1);
  let d = "", pen = false, g = "";
  vals.forEach((v, i) => {
    if (v == null) { pen = false; return; }
    d += (pen ? "L" : "M") + X(i).toFixed(1) + " " + Y(v).toFixed(1);
    pen = true;
  });
  const col = o.color || C.ai;
  g += `<path d="${d}" fill="none" style="stroke:${col}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`;
  const li = vals.length - 1 - [...vals].reverse().findIndex(v => v != null);
  if (vals[li] != null)
    g += `<circle cx="${X(li).toFixed(1)}" cy="${Y(vals[li]).toFixed(1)}" r="2.4" style="fill:${o.lastColor || col}"/>`;
  return `<svg ${SVGNS} width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(o.alt || "推移")}" style="vertical-align:-5px">${g}</svg>`;
}

/* -------------------------------------------------------------- ドット図 */
/** 「517社のうち116社」のような割合を、数えられる形で見せる */
function svgDots(o) {
  /* 枠に合わせる（paintFigs）。1行の点の数を枠の幅から決める（5 の倍数にして数えやすくする）。
     🔴 2026-09-24 実機（ループ4, houjin の注力の点）: 1行 37 点（432px）のまま描いていたので、1440px では
     カードの左半分で終わり、400px（枠 319px）では右の点が横スクロールの奥にあった */
  const slot = figSlot();
  const r = o.r || 4.2, gap = o.gap || 11.5;
  const fitPer = slot.avail ? Math.max(5, Math.floor((slot.avail - 8) / gap / 5) * 5) : 0;
  const per = fitPer ? Math.min(fitPer, Math.max(5, Math.ceil(o.total / 5) * 5)) : (o.per || 25);
  const total = o.total, rows = Math.ceil(total / per);
  const w = per * gap + 6, h = rows * gap + 6;
  let g = "", i = 0;
  const seq = [];
  (o.groups || []).forEach(gr => { for (let k = 0; k < gr.v; k++) seq.push(gr); });
  /* 🔴 --rule は地の上で 1.20:1 しかなく、注力でない点が見えなかった（V20）。
     図形の境界に要る 3:1 を満たす --rule-strong にする */
  while (seq.length < total) seq.push({ color: "var(--rule-strong)", label: o.restLabel || "その他" });
  seq.slice(0, total).forEach(gr => {
    const cx = 4 + (i % per) * gap, cy = 4 + Math.floor(i / per) * gap;
    g += `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r}" style="fill:${gr.color}" opacity="${gr.faint ? ".3" : ".85"}"><title>${esc(gr.label)}</title></circle>`;
    i++;
  });
  return svgHead(w, h, o.alt || "割合", { fk: slot.k }) + `${g}</svg>`;
}

/* -------------------------------------------------------------- ファネル */
/** 狭い枠で描くときに、棒を描く欄として最低限残す幅（これより狭くなるなら狭めずに横スクロール） */
const FUNNEL_MIN_IW = 80;
/** 応募 → 面接 → 採用。段の落ち方を幅で見る */
function svgFunnel(o) {
  const st = (o.steps || []).filter(s => s.v != null);
  if (!st.length) return `<div class="empty">段の値がありません（値が無いものは 0 として描きません）。</div>`;
  const rh = 40, h = st.length * rh + 12;
  const top = Math.max(...st.map(s => s.v), 1);
  /* 🔴 値ラベルと「前段の N%」の位置を固定値で決めると、桁が増えたときに重なる。
     いちばん長い値ラベルの幅を測ってから、その先に注記を置く。 */
  const valW = Math.max(...st.map(s => String(F.int(s.v)).length)) * 7.4 + 10;
  const noteW = 84;
  const padL = o.padL || 62;
  /* 枠に合わせる（paintFigs）。🔴 2026-09-24 実機（ループ5, 400px, houjin「応募 → 面接 → 採用 の落ち方」）:
     幅 420px 固定で描いていたので、枠（約 319px）から 64px はみ出し、「前段の N%」が横スクロールの奥にあった。
     枠が描いた幅より狭く、棒の欄が FUNNEL_MIN_IW 残るなら枠の幅で描く（chromium 実測: 枠 319px・285px とも
     応募 5 桁で収まる。下限 100 だと 285px の枠で届かず 420px のままだった）。広げはしない
     （段が3つだけの図で、棒が 1,000px を超えても読みやすくならない） */
  const slot = figSlot();
  let w = o.w || 420;
  if (slot.avail && slot.avail < w && slot.avail - padL - valW - noteW >= FUNNEL_MIN_IW) w = slot.avail;
  const iw = Math.max(40, w - padL - valW - noteW);
  let g = "";
  st.forEach((s, i) => {
    const y = 6 + i * rh, bw = Math.max(2, iw * s.v / top);
    const col = s.color || SERIES[i % SERIES.length];
    g += labText(padL - 8, y + 21, s.label, padL - 10, "", s.full) +
         `<rect x="${padL}" y="${y + 6}" width="${bw.toFixed(1)}" height="${rh - 16}" rx="3" style="fill:${col}" opacity=".8"><title>${esc(s.label)}: ${F.int(s.v)}</title></rect>` +
         `<text class="vl" x="${(padL + bw + 7).toFixed(1)}" y="${y + 21}">${F.int(s.v)}</text>`;
    if (i) {
      /* 🔴 前段比は**両方の値がある取引だけ**で割る（s.pair = {num, den, n}）。
         棒の合計どうしで割ると、応募だけ入っていて面接が空の取引が分母にだけ乗り、
         逆に面接だけ入っている取引は分子にだけ乗る。取引の集合が揃わないので
         100% を超えることがある。pair が無い呼び出しだけ、前の段の合計で割る。 */
      const pr = s.pair;
      const den = pr ? pr.den : st[i - 1].v, nu = pr ? pr.num : s.v;
      // 🔴 分母0のときは率を書かない
      const txt = den ? (nu / den * 100).toFixed(1) + "%" : "—";
      const why = pr ? `両方の値がある ${pr.n} 件で ${F.int(nu)} ÷ ${F.int(den)}` : "";
      g += `<text class="ax" x="${(padL + bw + valW + 4).toFixed(1)}" y="${y + 21}" style="fill:${den ? "var(--ink-2)" : "var(--ghost)"}">前段の ${txt}${why ? `<title>${esc(why)}</title>` : ""}</text>`;
    }
  });
  return svgHead(w, h, o.alt || "ファネル", { fk: slot.k }) + `${g}</svg>`;
}

/* ------------------------------------------------------------ 積み上げ縦棒 */
/** 合計と、その内訳（拠点ごと）を同時に見せる。
    🔴 拠点をまたいで足した値を**1本の線でつながない**ための道具。線にすると
       拠点間のばらつきが「時間の変化」に見える（規律: 事業所をまたいで1本にしない）。
       柱ごとに拠点の色で積むので、合計が動いたときにどの拠点のぶんかが見える。
    🔴 carry（その月に書き換えが無く前の値を引き継いだ）の区間は中空・破線。
    🔴 その月に値が1つも無い柱は 0 の柱にせず、無いと分かる印だけ置く。 */
function svgColStack(o) {
  const n = (o.x || []).length;
  const ser = o.series || [];
  const tot = o.x.map((_, i) => ser.reduce((s, S) => {
    const p = S.vals[i]; return p && p.v != null ? (s == null ? 0 : s) + p.v : s; }, null));
  const vs = tot.filter((v) => v != null);
  if (!n || !vs.length) return `<div class="empty">この図に出せる値がありません（値が無いものは 0 として描きません）。</div>`;
  const fs = figSlot();
  const w0 = o.w || 660, h = o.h || 230;
  /* 軸の題名がある図は上を空ける（svgLine と同じ。「採用数（累計）」と最上段の目盛りが重なっていた） */
  const pad = { l: 58, r: 16, t: o.yLab ? 30 : 18, b: 34 };
  /* 枠に合わせる（paintFigs。svgLine と同じ考え方）。狭めるのは、柱1本の幅が 22px と
     柱の上の合計の字の幅がとれるときだけ。とれない図は横スクロール（開いた直後の位置はデータのある側） */
  const fmt0 = o.yFmt || F.int;
  const topW = n <= 16 ? Math.max(0, ...tot.filter((v) => v != null).map((v) => textW(fmt0(v)) * 1.06)) + 6 : 0;
  const w = fs.avail > w0 ? widen(w0, fs) : fitTo(w0, fs, pad.l + pad.r + n * Math.max(22, topW));
  const iw = w - pad.l - pad.r, ih = h - pad.t - pad.b;
  const fmt = o.yFmt || F.int;
  /* 最小の刻みは他の図と同じく minStepOf で渡す。渡さないと採用数 0〜2 の軸が
     刻み 0.5 になり、整数に丸めて「0,1,1,2,2」と重複していた（V10 の残り） */
  const tk = coverTicks(ticks(0, Math.max(...vs), 4, minStepOf(fmt)), Math.max(...vs));
  const hi = Math.max(Math.max(...vs), tk[tk.length - 1]) || 1;
  const slot = iw / n, bw = Math.max(3, Math.min(34, slot * 0.64));
  const X = (i) => pad.l + slot * (i + 0.5);
  const Y = (v) => pad.t + ih - ih * v / hi;
  let g = "", yl = "";   // yl = 縦軸の目盛りの字だけ（左に貼り付けるときに使う。svgLine と同じ）
  tk.forEach((t) => {
    const tt = `<text class="ax" x="${pad.l - 7}" y="${(Y(t) + 3.5).toFixed(1)}" text-anchor="end">${esc(fmt(t))}</text>`;
    g += `<line class="gridline" x1="${pad.l}" y1="${Y(t).toFixed(1)}" x2="${w - pad.r}" y2="${Y(t).toFixed(1)}"/>` + tt;
    yl += tt;
  });
  g += `<line class="axisline" x1="${pad.l}" y1="${pad.t + ih}" x2="${w - pad.r}" y2="${pad.t + ih}"/>`;
  const every = Math.ceil(n / Math.max(1, Math.floor(iw / 50)));
  const xOn = xPick(n, every, X, [o.x]);   // LTV の「26-07」「26-09」がくっついていた
  o.x.forEach((lab, i) => {
    if (!xOn[i]) return;
    g += `<text class="axl" x="${X(i).toFixed(1)}" y="${pad.t + ih + 15}" text-anchor="middle">${esc(lab)}</text>`;
  });
  if (o.yLab) { const t = `<text class="ax" x="2" y="${pad.t - 16}">${esc(o.yLab)}</text>`; g += t; yl += t; }
  const marks = {};
  o.x.forEach((lab, i) => {
    if (tot[i] == null) {
      marks.none = true;
      g += `<line x1="${(X(i) - 4).toFixed(1)}" y1="${(pad.t + ih - 3).toFixed(1)}" x2="${(X(i) + 4).toFixed(1)}" y2="${(pad.t + ih - 3).toFixed(1)}" style="stroke:var(--ghost)" stroke-width="2"><title>${esc(lab)}: 値が無い（0 ではない）</title></line>`;
      return;
    }
    let acc = 0;
    ser.forEach((S) => {
      const p = S.vals[i];
      if (!p || p.v == null || p.v <= 0) return;
      const y0 = Y(acc), y1 = Y(acc + p.v);
      const t = `<title>${esc(lab)} ${esc(S.label)}: ${esc(fmt(p.v))}${p.carry ? " / 引き継ぎ（この月は書き換えなし）" : ""}</title>`;
      g += p.carry
        ? `<rect x="${(X(i) - bw / 2 + 0.7).toFixed(1)}" y="${y1.toFixed(1)}" width="${(bw - 1.4).toFixed(1)}" height="${Math.max(1, y0 - y1).toFixed(1)}" style="fill:var(--panel);stroke:${S.color}" stroke-width="1.4" stroke-dasharray="3 2">${t}</rect>`
        : `<rect x="${(X(i) - bw / 2).toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1, y0 - y1).toFixed(1)}" style="fill:${S.color}" opacity=".85">${t}</rect>`;
      acc += p.v;
    });
    if (n <= 16)
      g += `<text class="vl" x="${X(i).toFixed(1)}" y="${(Y(tot[i]) - 5).toFixed(1)}" text-anchor="middle">${esc(fmt(tot[i]))}</text>`;
  });
  marks.fk = fs.k;
  const first = tot.findIndex((v) => v != null);
  if (first >= 0) marks.x0 = X(first) - slot / 2 - 30;
  /* 開いた直後は最新の側（値がある最後の柱）を右端に見せる（figToData の data-xr）。
     🔴 2026-09-24 実機（ループ4, houjin の LTV の推移）: 開いた直後が古い側で、最新の累計が奥にあった。
     このとき縦軸の目盛りも一緒に流れて見えなくなるので、目盛りを左に貼り付ける（svgLine と同じ） */
  let last = -1;
  tot.forEach((v, i) => { if (v != null) last = i; });
  if (last >= 0) marks.xr = Math.min(w, X(last) + slot / 2 + pad.r);
  const svg = svgHead(w, h, o.alt || "積み上げ縦棒", marks) + `${g}</svg>`;
  if (fs.avail && fs.avail < w * .92 && marks.xr * .92 > fs.avail)
    return stickyLabels(w, stickW(pad.l, o.yLab), pad.t + ih + 4, yl,
      svg.replace(/ data-x0="(\d+)"/, (m, v) => ` data-x0="${Math.max(1, +v - pad.l)}"`), pad.l - 2);
  return svg;
}

function cpaLine(st, w, h) {
  const pts = st.pts;
  return svgLine({

    xSub: pts.map(p => (p.d || "").slice(0, 7)),
    series: [{ color: C.hi, pts: pts.map(p =>
      ({ v: p.v, censored: p.cen, note: "採用" + num(p.syo) + "名" })) }],
    yFmt: F.man, yLab: "万円/人",
    censorFrom: pts.findIndex(p => p.cen) >= 0 ? pts.findIndex(p => p.cen) : null,

/* MTG の抽出カバレッジ。画面のあちこちで使うので1回だけ数える。
   🔴 _src は「実データ」/「未抽出」の2値。ダミーは入っていない。 */

function monthsBetween(a, b) {
  if (!a || !b) return 0;
  const x = String(a).slice(0, 10).split("-"), y = String(b).slice(0, 10).split("-");
  return Math.max(0, (+y[0] - +x[0]) * 12 + (+y[1] - +x[1]));
}

/** 履歴（[日付, 値] の配列）を「契約の N ヶ月目」に畳む。
    🔴 10倍以上の落差は下がる前の値を捨てる（桁の打ち間違いの訂正）。
    🔴 その月の最後の書き換え値を採る。同じ月に何度書き換えても1点。
    ③の推移と、系列を縦に積む図の両方がこれを使う（畳み方を2つ作らない）。 */
function foldMonthly(series, startDate, lastM) {
  const byKey = {}; let fixed = 0; const wMonths = new Set();
  Object.keys(series || {}).forEach(k => {
    const raw = series[k] || [];
    if (!raw.length) return;
    const pts = raw.slice();
    for (let i = pts.length - 1; i >= 1; i--) {
      const a = pts[i - 1][1], b = pts[i][1];
      const big = (b <= 0) ? a >= 10 : (a / b) >= 10;
      if (b < a && big) { pts.splice(i - 1, 1); fixed++; }
    }
    const m = new Map();
    pts.forEach(([t, v]) => {
      const mi = monthsBetween(startDate, t) + 1;
      if (mi >= 1 && mi <= lastM) m.set(mi, v);
    });
    if (m.size) { byKey[k] = m; m.forEach((_, mi) => wMonths.add(mi)); }
  });
  return { byKey, fixed, written: wMonths.size };
}

/* 値が無いときの印。0 と混ぜない */

const pct1 = (v, d) => v == null ? DASH : Number(v).toFixed(d === undefined ? 1 : d) + "%";
const yen = (v) => v == null ? DASH : man(v);
const nz = (v, d) => v == null ? DASH : num(v, d || 0);

function kpi(label, big, fine, kind) {

/* 表は最後の手段。個別の行を特定したいときだけ使う。
   列の w: 折り返す列。"l" は案件名・自由記述（12〜22字で折る）、"s" は人名・ステージ・短い説明（6〜11字）。
   🔴 2026-09-24 実機（1440px）: td は既定で折り返さないので、いちばん長い案件名（約40字）や
   「氏名が分からない担当（HubSpotの担当者一覧に無い）」の幅がそのまま列の幅になり、

   長い文字の列だけを折り返し、数字・日付の列は1行のまま残す（400px は横スクロールのまま） */
function table(cols, rows, cls, id) {
  const cc = (c) => [c && c.n ? "n" : "", c && c.w ? "w" + c.w : ""].filter(Boolean).join(" ");
  let h = '<table' + (id ? ' id="' + id + '"' : "") + (cls ? ' class="' + cls + '"' : "") + "><thead><tr>";
  for (const c of cols) h += '<th' + (cc(c) ? ' class="' + cc(c) + '"' : "") + ">" + esc(c.t || c) + "</th>";
  h += "</tr></thead><tbody>";
  for (const r of rows) {
    h += "<tr>";
    r.forEach((v, i) => { h += '<td' + (cc(cols[i]) ? ' class="' + cc(cols[i]) + '"' : "") + ">" + v + "</td>"; });
    h += "</tr>";
  }
  return h + "</tbody></table>";
}
/* 並び替えできる見出し。
   🔴 押せるものは button にする。th の onclick だけだと**キーボードで一切さわれない**

   🔴 矢印（▲▼↕）は色ではなく**形**で向きを示している。
      いま並んでいる列には aria-sort も付けるので、読み上げでも向きが分かる。 */
function sortTh(c, key, asc) {
  const on = c.k === key;
  const arrow = on
    ? (asc ? ' <span aria-hidden="true">&#9650;</span>' : ' <span aria-hidden="true">&#9660;</span>')
    : '<span class="n0" aria-hidden="true"> &#8597;</span>';
  const say = on
    ? "（いまこの列で" + (asc ? "小さい順" : "大きい順") + "。押すと逆になります）"
    : "（押すとこの列で並び替わります）";
  return '<th class="' + (c.n ? "n " : "") + 'sortable"' +
    (on ? ' aria-sort="' + (asc ? "ascending" : "descending") + '"' : "") + ">" +
    '<button type="button" class="sort" data-k="' + c.k + '">' +
    esc(c.t) + arrow + '<span class="sr">' + esc(say) + "</span>" +
    "</button></th>";
}

/* 表を枠に入れる。
   🔴 枠の上に「全 N 行 × M 列・枠の中でスクロール」を必ず出す（V12）。
   2026-09-23 実測: 枠は縦 624px で、「案件そのもの」は表の幅 2,944px ÷ 枠 1,119px。
   残りがあることを示すものが無く、右端の列が切れて見えていた。
   行と列は渡された HTML から数える（本文の行だけ。見出しは数えない）。
   total: 表に出す前に切った元の件数。
   🔴 数えられるのは画面に出した行だけなので、200 件で切った表にも「全 200 行」と出て、
   切った後の件数が全件のように読めていた（V12 検証。NPS低・法人の一覧・今日動く先は
   n_hit 件から 24 件だけ）。切っている表は total を渡し、「N 行を出しています（全 T 件のうち）」にする。 */
function scroll(inner, max, total) {
  return scrollCap(inner, total) + '<div class="scroll-wrap">' +
    '<div class="scroll"' + (max ? ' style="max-height:' + max + 'px"' : "") + ">" + inner + "</div></div>";
}
/** 枠の左右に続きがあるかを見て、影の印（more-l / more-r）を付け外しする。
    描いた直後（wire）・枠を横に動かしたとき・窓の幅が変わったときに呼ぶ */
function markScroll(w) {
  const s = w && w.querySelector && w.querySelector(".scroll");
  if (!s || !w.classList) return;
  const max = s.scrollWidth - s.clientWidth;
  w.classList.toggle("more-r", max > 1 && s.scrollLeft < max - 1);
  w.classList.toggle("more-l", max > 1 && s.scrollLeft > 1);
}
/** 図の枠（fig の .figbody[data-cap]）が実際に横へはみ出しているときだけ、Tab で止まれるようにし
    （tabindex）、「横にスクロールできる枠」の読み上げ名を付ける。文の案内（.figscroll）も同じ条件で出す。
    🔴 2026-09-23 レビュー F1: 図の最小幅だけで決めていて、1440px で動かない図まで Tab で止まっていた */
function markFig(b) {
  if (!b || !b.setAttribute) return;
  const over = b.scrollWidth - b.clientWidth > 1;
  if (over) {
    b.setAttribute("tabindex", "0");
    b.setAttribute("role", "group");
    b.setAttribute("aria-label", (b.getAttribute("data-cap") || "") + "（横にスクロールできる枠）");
  } else {
    b.removeAttribute("tabindex"); b.removeAttribute("role"); b.removeAttribute("aria-label");
  }
  const f = b.parentNode;
  if (f && f.classList) { f.classList.add("fig-measured"); f.classList.toggle("fig-over", over); }
}
function markScrollAll() {
  document.querySelectorAll(".scroll-wrap").forEach(markScroll);
  document.querySelectorAll("figure.fig .figbody[data-cap]").forEach(markFig);
}
function scrollCap(inner, total) {
  const s = String(inner);
  const body = s.split("<tbody>").slice(1).join("");
  const rows = (body.match(/<tr[\s>]/g) || []).length;
  const head = (s.split("</thead>")[0] || "");
  const cols = (head.match(/<th[\s>]/g) || []).length;
  /* 表が1つでない（details の中に表が並ぶ等）ときは件数を言わず、スクロールだけ伝える */
  const one = (s.match(/<table[\s>]/g) || []).length === 1;
  const cut = one && total != null && total > rows;
  return '<div class="scroll-cap">' +
    (cut ? "<b>" + num(rows) + "</b> 行を出しています（全 " + num(total) + " 件のうち）× " +
           num(cols) + " 列。"
     : one ? "全 <b>" + num(rows) + "</b> 行 × " + num(cols) + " 列。" : "") +
    "入り切らない分は枠の中で縦・横にスクロールします（見出しは上に残ります）。</div>";
}
/* n が小さい図は出さない。出さない理由は図の直下に書く */
const MIN_N = 30;
/* 解約率（分子は解約＋充足、分母は決着済み）の色の決まり。**ここ1か所で決める。**
   🔴 2026-09-24 実機: 継続回数×成果は 40%以上を緋、本部アプローチは 50%以上を緋、立ち上がりは全部藍で、
   立ち上がりの 49.7% が藍なのに継続回数×成果では同じ値が緋になる、と画面ごとに決まりが違っていた。
   線は 40%。継続回数×成果（継続率を見る中心の画面）がモックの移植（facae9c）から使ってきた線で、
   その見た目を変えないためにこちらへ揃えた。40% にも 50% にも、根拠はコメント・コミット・資料
   （call-quality-metrics の SKILL・build_mock.py）のどこにも書かれていない。
   **取り決めであって事実ではない。線引きは藤巻さんの確認待ち**（変えるときはこの1行だけ直す）。
   本番（2026-09-23）では初回 58.1%・継続1 45.1% が緋のまま、
   本部アプローチで 40〜49% の拠点の注記（あれば）が新たに緋になる。
   立ち上がりの帯ごとの図だけは判定の色を使わない（帯どうしの比較で、向きが読めないため。
   renderRampup のコメント）。そこを緋にするかも藤巻さんの確認待ち。
   判定の色で出す図は、棒の色でも注記の色でも、この関数を通す */
const CANCEL_HI = 40;
const cancelHi = (v) => v != null && v >= CANCEL_HI;
const cancelColor = (v) => (cancelHi(v) ? C.hi : C.ai);
/** 解約率の図の凡例。図に出ている色だけを出す（使っていない色を凡例に残さない） */

function tooFew(n, what) {

/* 図から n<30 で外した群を、件数と理由つきで書く。🔴 黙って落とさない（V6）。

     赤の大きな文字で個人名を出していた。図では「分母が小さいので載せない」と
     言っているのに、KPI では最下位として名指しする、という食い違い。
     外した人数は KPI の下に書く（黙って落とさない）。 */
  const worstPick = pickWorstContact(rows);
  const worst = worstPick.worst;
  const focusTop = D.rows.slice().sort((a, b) => b.focus - a.focus)[0];
  h += '<div class="kpis">' +
    kpi("担当者", num(D.meta.n_consultant) + '<span class="u">名</span>',
        /* 🔴 上の数字と下の表の合計が合うように、外した分をここに書く。
           「稼働中604件」と言いながら表が593件しかない、という見え方を作らない。
           🔴 2026-09-24 実機: 「稼働中 604 件（オプション契約を除く）」は画面の頭の1行・ここ・末尾の枠の
           3か所に同じ数が出ていた。件数は頭の1行に任せ、ここは表に出していない分だけを書く */
        D.meta.unknown_owner
          ? "稼働中のうち担当が取れない " + num(D.meta.unknown_owner) + " 件は下の表に出していません"
          : "稼働中の案件を持っている担当者") +
    /* 🔴 母数が小さい人を外した結果なので、見出しにそう書く。書かないと、表の先頭（0.0%）と
       食い違って見えた（2026-09-24 実機） */
    kpi("接触率がいちばん低い（母数が小さい人を除く）", worst ? esc(worst.consultant) : DASH,
        (worst ? pct1(worst.contact_rate) + "（" + num(worst.contact_touched) + "/" +
                 num(worst.contact_months) + " か月）" : "") +
        (worstPick.skipped
          ? "<br>母数が小さい " + num(worstPick.skipped) + " 名は候補から外しています（下の図と同じ扱い）"
          : ""),
        /* 色は表・図と同じ帯で付ける（40%未満=赤 / 70%未満=山吹）。最下位だから赤、にはしない */
        worst ? contactKind(worst.contact_rate) : "") +
    kpi("注力案件をいちばん持っている", focusTop ? esc(focusTop.consultant) : DASH,
        focusTop ? num(focusTop.focus) + " 件" : "") +
    /* 🔴 補足に「同じ日に複数行あって担当が割れる取引 38 件」（退職者とは別の話）が混ざっていた
       （2026-09-23 実機）。担当の割れは下の「この一覧の決まりごと」に移した */
    kpi("退職者のまま", num(D.meta.retired_deals) + '<span class="u">件</span>',
        "担当が退職者のままの稼働中の案件（その担当 " + num(D.meta.retired_people) + " 名）",
        D.meta.retired_deals ? "warn" : "") +
    "</div>";

  /* ---- 接触率の横棒（低い順）---- */
  h += sec("図", "接触率（低い順）");
  /* 🔴 図からは母数の小さい担当者を外す。表には残す。扱いを変える理由は下に書く */
  const all = rows.filter((r) => r.contact_rate != null);
  const bar = all.filter((r) => !r.small_n)
    .slice().sort((a, b) => a.contact_rate - b.contact_rate);
  const dropped = all.filter((r) => r.small_n);
  h += fig("接触があった月 ÷（案件 × 経過月）",
    "棒の右は「接触した月 / 経過月」。持ち案件数は注記",
    bar.length
      ? svgBarH({ w: 720, fmt: F.pp, rh: 24,
          rows: bar.map((r) => ({
            label: shortName(r.consultant, 14), full: r.consultant, v: r.contact_rate,
            txt: pct1(r.contact_rate),
            note: num(r.contact_touched) + "/" + num(r.contact_months) +
                  " か月　案件" + num(r.n_active),
            color: r.contact_rate < 40 ? C.hi : r.contact_rate < 70 ? C.ki : C.midori })) })
      : '<div class="empty">接触率を出せる担当者がいません。</div>',
    lg("box", C.hi, "40%未満") + lg("box", C.ki, "40〜70%") + lg("box", C.midori, "70%以上") +
    '<i class="full">棒の右に率そのものを書いているので、' +
    "<b>色が見分けられなくても帯は読めます。</b></i>" +
    '<i class="full">帯の切り方（40% / 70%）は機械が決めたものです。' +
    "<b>どこから要注意とするかは取り決め</b>で、事実ではありません。</i>" +
    (dropped.length
      ? '<i class="full"><b>この図から ' + num(dropped.length) +
        " 名を外しています</b>（" +
        dropped.map((r) => esc(r.consultant) + " " + num(r.contact_months) + "か月").join(" / ") +
        "）。" + esc(D.small_n_rule || "") + "</i>"
      : ""));

  /* ---- 一覧（本題）---- */
  h += sec("表", "コンサルタント一覧");
  /* 列が増えたときにページ全体が流れないよう、③と同じく枠の中で収める */
  let t = '<table id="team-tbl"><thead><tr>';
  for (const c of TEAM_COLS) t += sortTh(c, k, asc);
  t += "</tr></thead><tbody>";
  for (const r of rows) {
    t += "<tr>";
    for (const c of TEAM_COLS) t += '<td' + (c.n ? ' class="n"' : "") + ">" + c.fmt(r) + "</td>";
    t += "</tr>";
  }
  t += "</tbody></table>";
  h += scroll(t, 680);

  h += note("def", "この一覧の決まりごと",
    esc(dispText(D.owner_rule)) + "<br>" + esc(D.focus_rule) +
    /* 担当の割れ（mod.rs consultant_ties）。ここでは件数だけ書く。
       🔴 2026-09-23 レビュー F2: どちらを採ったか（シートで後に来る行）は owner_rule（routes.rs）が
       すでに書いていて、同じ文が2回出ていた。採り方の説明は owner_rule の1か所にする */
    (D.meta.owner_ties ? "<br>同じ日に担当の記録が複数あって担当が割れている稼働中の案件が " +
      num(D.meta.owner_ties) + " 件あります（どちらを採ったかは上のとおり）。" : "") +
    (D.meta.unknown_owner ? "<br>担当が取れない取引が " + num(D.meta.unknown_owner) +
      " 件あります。<b>「その他」に混ぜていません</b>（件数だけ出しています）。" : ""));
  /* not_counted は頭の枠で出している。稼働中の件数は画面の頭の1行にあるので、末尾では繰り返さず
     この画面の数（担当者の人数）を書く */
  return h + foot(D.meta, true, "担当者 " + num(D.meta.n_consultant) + " 名");
}

let teamCache = null;

/* ================================================================ 担当者ごとの接触

   2026-09-24 藤巻さん「各担当者の平均接触数を週か月で比較したい」。
   担当者ごとに**持ち案件1件あたりの接触回数**を期間ごとに並べる（routes の contact_trend.rs）。
   🔴 接触は検知専用。多いほど良いという評価ではない（担当者の評価ではない）。頭の枠で必ず言う。
   🔴 1人1本の線を全員重ねると読めないので、**1人1枚の小さな図**を並べる（small multiples）。
      縦軸の目盛りは全員そろえる（そろえないと、枠ごとに目盛りが違って高さで比べられない）。
   🔴 持ち案件が少ない期間（small_n。3件未満）は**点を打たない**。表には残して印を付ける。
      分母0の期間は空（— ）。0 と書かない。
   🔴 いまの週・月は途中なので未確定（中空＋破線）。
   🔴 通話の記録が始まる前の期間（calls_missing）は MTG しか数えられないので、図にも表にも出さない。
      出すと、データの範囲が変わっただけなのに接触が増えたように見える（fixture で月 0.4 回 → 2.3 回以上）。
   🔴 通話は継続先・オプションの取引に付いていることが多いので、サーバが「その日に動いていた同じ拠点の
      本体案件」に付け直して数えている（attach_rule）。画面の決まりごとに必ず書く（接触率と数が違うため）。
   🔴 縦軸の上端は**確定した期間の値だけ**で決める。未確定（途中）の値1つで全員の縦軸が伸びると、
      ふだんの線が下に押し込まれて読めない（2026-09-24 検証: 途中の 9.00 で 0〜10 の軸になっていた）。
      上端を超える未確定の値は上端に置き、その図に実際の値を書く。
   ================================================================ */
let contactUnit = "month";
const CONTACT_UNITS = [{ k: "month", t: "月ごと" }, { k: "week", t: "週ごと" }];

/** 期間の短い名前（横軸）。月は「26-04」、週は始まりの日「9/14」 */
const contactX = (p, unit) => (unit === "month" ? String(p.key).slice(2) : String(p.label).split("〜")[0]);

/** 1人（または全体）の点。出さない期間（分母0・小さい）は null で線を切る。未確定は中空（censored）。
    縦軸の上端（top）を超える未確定の値は上端に置き（clipped）、note に実際の値を書く */
function contactPts(cells, idx, periods, top) {
  return idx.map((i) => {
    const c = cells[i], p = periods[i];
    if (!c || c.avg == null || c.small_n) return null;
    const over = !!p.provisional && top > 0 && c.avg > top;
    return { v: over ? top : c.avg, censored: !!p.provisional, clipped: over, real: c.avg,
             note: "持ち案件 " + num(c.deals) + " 件・接触 " + num(c.contacts) + " 回" +
               (over ? "（1件あたり " + num(c.avg, 2) + " 回。縦軸の上端より大きいので上端に置いています）" : "") };
  });
}

/** 表のひとます。1件あたり（2桁）と、分子/分母。分母0は —、小さい分母は印 */
function contactCell(c) {
  if (!c || !c.deals) return DASH;
  return num(c.avg, 2) + ' <span class="muted small">' + num(c.contacts) + "/" + num(c.deals) + "件</span>" +
    (c.small_n ? ' <span class="tag" title="持ち案件が少ないので図には点を打っていません">少</span>' : "");
}

function renderContact(D) {
  const unit = contactUnit === "week" ? "week" : "month";
  const U = D[unit] || { periods: [], rows: [], team: [], undetermined: [], shared: [] };
  const periods = U.periods || [];
  const minDeals = (D.meta && D.meta.min_deals) || 3;
  /* 通話の記録がある期間だけを使う（図も表も） */
  const idx = periods.map((p, i) => i).filter((i) => !periods[i].calls_missing);
  const hidden = periods.length - idx.length;
  /* 出す期間に1件も持っていない人（出さない期間にだけ持っていた人）は、図にも表にも出さない */
  const rows = (U.rows || []).filter((r) => idx.some((i) => r.cells[i] && r.cells[i].deals > 0));
  const X = idx.map((i) => contactX(periods[i], unit));
  const what = unit === "month" ? "月" : "週";

  let h = sec("問い", "担当者ごとに、持ち案件1件あたりの接触はどう動いているか") +
    '<div class="lede">1件あたりの接触 ＝ その' + what + "の接触の回数 ÷ その" + what +
    "に持っていた案件の数。件数そのままではなく1件あたりで見るのは、持ち案件が多い人ほど件数が大きく出るためです。" +
    "<b>上の「" + what + "ごと / " + (unit === "month" ? "週" : "月") + "ごと」で切り替わります。</b>" +
    "1人1枚の図で、縦軸の目盛りは全員そろえてあります。</div>";

  /* 見出しは本文と別のことを言う（担当者の一覧と同じ作り） */
  h += note("info", "何のための画面か",
    esc(D.meta.not_counted || "").replace("※ ", "") + "<br>" + esc(D.contact_rule || ""));

  /* ---- 図（1人1枚）---- */
  h += sec("図", "持ち案件1件あたりの接触（" + what + "ごと）");
  if (!idx.length) {
    h += '<div class="empty">通話の記録がある' + what + "がありません。</div>";
  } else {
    /* 出す期間のどこかに点を打てる人だけ図にする（全部が 0 件か小さい人は名前だけ書く） */
    const drawable = rows.filter((r) =>
      idx.some((i) => r.cells[i] && r.cells[i].avg != null && !r.cells[i].small_n));
    const dropped = rows.filter((r) => drawable.indexOf(r) < 0);
    /* 縦軸の上端は全員（と全体）の最大でそろえる。点を打たない値（small_n）と、
       未確定（途中）の値は上端を決めない。確定した値が1つも無いときだけ、未確定の値で決める */
    const topOf = (withProv) => {
      let t = 0;
      const seen = (cells) => idx.forEach((i) => {
        const c = cells[i];
        if (c && c.avg != null && !c.small_n && (withProv || !periods[i].provisional) && c.avg > t) t = c.avg;
      });
      seen(U.team || []);
      drawable.forEach((r) => seen(r.cells));
      return t;
    };
    const top = topOf(false) || topOf(true);
    const gapWhy = '<i class="full" data-gapwhy="1">線が切れているところは、持ち案件が 0 件か ' + num(minDeals) +
      " 件未満の" + what + "です（点を打っていません。値は下の表）。</i>";
    const small = (title, hint, cells, legend) => {
      const pts = contactPts(cells, idx, periods, top);
      /* 1回目（枠の幅が分からない）は 320px。.92 倍が 330px 以下なので「横にスクロールできます」を出さない。
         2回目は枠の幅で描く（fit）。目盛りの字の欄は「10」が入る 34px で足りる */
      const svg = svgLine({ w: 320, h: 180, x: X, yFmt: F.d2, yTickAuto: true, fit: true, pad: { l: 34 },
        yMax: top, yTicks: 3,
        alt: title + "の持ち案件1件あたりの接触",
        series: [{ pts: pts, color: C.ai }] });
      const gap = pts.some((p) => p == null) ? gapWhy : "";
      const clip = pts.filter((p) => p && p.clipped).map((p) => num(p.real, 2)).join("・");
      const clipWhy = clip ? '<i class="full" data-clip="1">いまの' + what + "（未確定）の " + clip +
        " 回は縦軸の上端より大きいので、上端に置いています（途中の値で全員の縦軸を伸ばさないため）。</i>" : "";
      return fig(title, hint, svg, (legend || "") + gap + clipWhy);
    };
    const lastFixed = (() => { for (let k = idx.length - 1; k >= 0; k--) if (!periods[idx[k]].provisional) return idx[k]; return -1; })();
    /* 見出しの2行目（CSS の .multi … .hint）。1行目の名前と分けて「持ち案件 N 件」から書く。
       🔴 2026-09-24 ループ5（藤巻さん「タイトルが意味わからなくなってる」）: 「hd26f422ffda0 / 直近の確定した週（…）:
       持ち案件 34 件」と1行に続き、伏字の名前が何か分からなかった */
    const hintOf = (cells) => (lastFixed >= 0 && cells[lastFixed]
      ? "持ち案件 " + num(cells[lastFixed].deals) + " 件（直近の確定した" + what + " " + esc(periods[lastFixed].label) + "）"
      : "");
    h += '<div class="multi">' +
      small("全体（担当が決まった案件の合計）", hintOf(U.team || []), U.team || [],
        lg("line", C.ai, "確定した" + what) + lg("ring", C.ai, "未確定（いまの" + what + "。途中なので低く出ます）") +
        '<i class="full">点にマウスを重ねると、持ち案件と接触の回数が出ます。</i>') +
      /* 見出しは「担当者: 名前」。本番は実名、fixture は伏字（ハッシュ）なので、語を添えて何の名前か分かるようにする */
      drawable.map((r) => small("担当者: " + (r.consultant || "（名前なし）") + (r.retired ? "（退職者のまま）" : ""),
        hintOf(r.cells), r.cells, "")).join("") +
      "</div>";
    if (dropped.length) {
      h += '<p class="muted small"><b>図にしていない担当者が ' + num(dropped.length) + " 名います</b>（" +
        dropped.map((r) => esc(r.consultant) + " 最大 " + num(Math.max(...idx.map((i) => r.cells[i].deals))) + " 件").join(" / ") +
        "）。どの" + what + "も持ち案件が " + num(minDeals) + " 件未満で、1件あたりの値がたまたまで大きく振れるためです。下の表には出しています。</p>";
    }
  }
  if (hidden) {
    h += '<p class="muted small">通話の記録は ' + esc(D.meta.call_from || "（不明）") + " からです。それより前に始まる " +
      num(hidden) + " つの" + what + "は出していません。" + esc(D.calls_missing_rule || "") + "</p>";
  }

  /* ---- 表（期間 × 担当者）---- */
  h += sec("表", what + " × 担当者");
  const cols = [{ t: "担当者", w: "s" }].concat(idx.map((i) => ({
    t: periods[i].label + (periods[i].provisional ? "（途中）" : ""), n: 1 })));
  const trs = rows.map((r) => [
    (esc(r.consultant) || DASH) + (r.retired ? ' <span class="tag" style="color:var(--hi)">退職者のまま</span>' : "")]
    .concat(idx.map((i) => contactCell(r.cells[i]))));
  trs.push(["<b>全体</b>（担当が決まった案件）"].concat(idx.map((i) => contactCell((U.team || [])[i]))));
  trs.push(['<span class="muted">担当が決められない</span>'].concat(idx.map((i) => {
    const u = (U.undetermined || [])[i];
    return u && (u.deals || u.contacts)
      ? '<span class="muted small">案件 ' + num(u.deals) + " 件・接触 " + num(u.contacts) + " 回</span>" : DASH;
  })));
  h += scroll(table(cols, trs, "", "ct-tbl"), 680);
  h += '<p class="muted small">ひとますは「1件あたりの接触　接触の回数/持ち案件」。<b>—</b> はその' + what +
    "に持ち案件が無い（0 ではありません）。<b>少</b> は持ち案件が " + num(minDeals) +
    " 件未満で、図には点を打っていません。（途中）の列は未確定です。</p>";

  /* ---- 決まりごと ---- */
  const sharedN = idx.reduce((a, i) => a + ((U.shared || [])[i] || 0), 0);
  const movedN = idx.reduce((a, i) => a + ((U.moved || [])[i] || 0), 0);
  h += note("def", "この画面の決まりごと",
    esc(D.denom_rule || "") +
    "<br>" + esc(D.attach_rule || "") +
    (movedN ? "（この表の" + what + "で、付け直して数えた接触はのべ " + num(movedN) + " 回）" : "") +
    (D.meta.n_ambiguous ? "（付け先を決められず数えなかった接触 " + num(D.meta.n_ambiguous) + " 回）" : "") +
    "<br>" + esc(dispText(D.owner_rule || "")) +
    (sharedN ? "（この表の" + what + "で、途中で担当が替わり両方に数えた案件はのべ " + num(sharedN) + " 件。" +
      "担当者の持ち案件を足すと、全体の持ち案件よりその分多くなります）" : "") +
    "<br>" + esc(D.undetermined_rule || "") +
    (D.meta.n_no_history ? "担当履歴が1行も無い案件は " + num(D.meta.n_no_history) + " 件です。" : "") +
    (D.meta.n_no_span ? "<br>契約の開始日か満了日が読めない案件 " + num(D.meta.n_no_span) + " 件は、どの" + what + "にも数えていません。" : "") +
    "<br>" + esc(D.provisional_rule || "") +
    "<br>実際の引き継ぎ日と記録のずれは " + goLink("consultant", "handover") + " で見られます。");
  return h + foot(D.meta, true, "担当者 " + num(rows.length) + " 名");
}

/* ================================================================ 2 いま見るべき顧客 */
function renderFocus(D) {
  const n = D.nps_low, c = D.cpa, m = D.mtg_layers, sh = D.shape;
  let h = sec("問い", "いま、どの顧客に手を打つべきか");
  h += '<div class="lede">予測モデルは使っていません。<b>既にあるデータを数えただけ</b>です。' +
    '当たった顧客に手を打つかどうかは、' + goLink("deal", "series") + " か " +
    goLink("deal", "houjin") + " で中身を読んでから決めてください。</div>";

  h += '<div class="kpis">' +
    /* 🔴 数えているのは取引（契約）。「社」と書くと法人数に読める（V20） */
    kpi("定期NPS が " + n.threshold + " 以下", num(n.n) + '<span class="u">件</span>',
        "NPSの回答がある " + num(n.n_have_nps) + " 件のうち", "bad") +
    kpi("採用単価が悪化した拠点", num(c.worse) + '<span class="u">拠点</span>',
        "確定した点どうしで比べられた " + num(c.judged) + " 拠点のうち", "bad") +
    /* 🔴 同じ「どちらも無い 115件」が、ここでは山吹（warn）、下の MTG の記録の帯では灰だった
       （2026-09-24 実機）。山吹は帯の「メールだけ（推定）」の色なので、帯に合わせて色を付けない（灰） */
    kpi("MTG の記録がどちらも無い", num(m.neither) + '<span class="u">件</span>',
        "稼働中 " + num(m.n_act) + " 件のうち") +
    kpi("NPS が入っている", pct1(n.coverage),
        num(n.n_have_nps) + " / " + num(n.n_act) + " 件") +
    kpi("LTV 中央値", sh.ltv ? yen(sh.ltv.median) : DASH,
        /* 「Q3」と英字の略号のままだった（2026-09-24）。上位4分の1の境 */
        sh.ltv ? "上位4分の1の境 " + yen(sh.ltv.q3) + " / 最大 " + yen(sh.ltv.max) : "") +
    "</div>";

  h += note("info", "この4つをシグナルにした理由",
    "顧客が実際に見ているのは応募数ではなく<b>1人採るのにいくらかかったか</b>です（採用単価）。" +
    "残りは、成果とは別に<b>こちらの体制が崩れている合図</b>で、いずれも HubSpot の記録だけでは気づけません。<br>" +
    "採用単価の悪化は<b>確定した契約どうし</b>で比べています。稼働中の契約は「金額は丸ごと乗っているのに" +
    "採用はまだ 0〜1 人」という状態を必ず通るため、最新の点に稼働中を置くと不当に悪化と出ます。" +
    "判定を見送った拠点が " + num(c.skipped_censored) + " あります。" +
    /* 🔴 拠点キーが空の取引は判定から外している（法人で1本にまとめると別々の拠点を
       1本の線で比べてしまうため）。外した件数を黙って消さない */
    (c.skipped_no_site
      ? "<br>拠点が入っていない取引 " + num(c.skipped_no_site) +
        " 件は、どの拠点の点か分からないので判定から外しています" +
        "（法人でまとめると別々の拠点を1本の線で比べてしまうため）。"
      : ""));

  /* ---- 図 定期NPSの分布 ---- */
  h += sec("図", "定期NPS の散らばり（4以下がどれだけあるか）");
  const dist = (n.dist || []).map((d) => ({
    label: "NPS " + d.v, v: d.n, txt: num(d.n) + "件",
    color: d.v <= n.threshold ? C.hi : (d.v >= 9 ? C.midori : C.ai),
  }));
  h += fig("定期NPS の最新回答", "回ごとに別プロパティなので、月が新しい方を採っています",
    dist.length ? svgBarH({ rows: dist, w: 660, fmt: F.int }) : tooFew(0, "NPS"),
    lg("box", C.hi, n.threshold + " 以下") + lg("box", C.ai, "5〜8") +
    lg("box", C.midori, "9以上") +
    '<i class="full">' + esc(n.note) + "</i>");

  /* ---- 表 NPSが低い顧客 ---- */
  h += sec("表", "定期NPS が " + n.threshold + " 以下の顧客（" + num(n.n) + " 件）");
  h += '<div class="lede">NPS の低い順、同じなら金額の大きい順。' +
    /* 🔴 200件で切っているのに書いていなかった（V20） */
    (n.rows.length > 200 ? "<b>上位200件だけ出しています（全 " + num(n.rows.length) + " 件）。</b>" : "") +
    "</div>";
  h += scroll(table(
    [{ t: "取引", w: "l" }, { t: "ステージ", w: "s" }, { t: "NPS", n: 1 }, { t: "回答月" },
     { t: "金額", n: 1 }, { t: "満了まで", n: 1 }, { t: "接触の記録", n: 1 }],
    n.rows.slice(0, 200).map((r) => [
      esc(r.name || r.deal_id),
      '<span class="muted small">' + esc(r.stage) + "</span>",
      /* 🔴 この表は全行が「4以下」なので、全行を同じ印で出す。2026-09-24 実機で「0 は赤・1 は黒」に
         見えた（同じ緋の太字でも、細い「1」は字の面が小さく黒に見える）。色だけに頼らず ▲ を添える */
      '<b style="color:var(--hi)">&#9650; ' + num(r.nps) + "</b>",
      '<span class="muted">' + esc(r.nps_month) + "</span>",
      yen(r.amount),
      r.days_to_expiry == null ? DASH : num(r.days_to_expiry) + "日",
      r.no_contact_record ? '<span class="n0">記録なし</span>' : num(r.n_contact) + "件",
    ])), 420, n.rows.length);   /* 200 件で切るので元の件数を渡す（V12） */

  /* ---- 図 採用単価の悪化 ---- */
  h += sec("図", "採用単価の悪化（拠点ごと・確定した直近2点）");
  /* 表示名が無い拠点をキー（r.site）で埋めない（siteLabels） */
  const crows = (c.rows || []).slice(0, 20), cnames = siteLabels(crows);
  const cr = crows.map((r, i) => ({
    label: shortName(cnames[i], 18), full: cnames[i],
    v: r.last, v0: r.prev,
    txt: yen(r.last),
    note: r.ratio == null ? "" : num(r.ratio, 2) + "倍",
    noteColor: r.ratio != null && r.ratio >= 1.5 ? C.hi : C.ink3,
    /* 🔴 棒は採用単価そのもの（量）。赤は「まずい」の色なので量には使わない（V9）。
       悪化の判定（1.5倍以上）は右の注記の赤が受け持つ */
    color: C.ai,
  }));
  /* 🔴 横軸の目盛り（0 200 400…）に単位が無かった（2026-09-24 実機）。軸の題名と凡例で万円と書く */
  h += fig("採用単価 ＝ 契約総額 ÷ 採用数", "破線は前回の値。棒が長いほど1人あたりが高い。横軸は万円",
    cr.length ? svgBarH({ rows: cr, w: 680, fmt: F.man, xLab: "採用単価（万円）" }) :
      '<div class="empty">悪化した拠点はありません。</div>',
    lg("box", C.ai, "今回（万円）") + lg("dash", C.ghost, "前回") +
    '<i class="full">右の「N倍」が 1.5倍以上のものは赤で出しています。</i>' +
    '<i class="full">' + esc(c.note) + "</i>" +
    /* 🔴 図は20拠点で切る。サーバの truncated は「60件で切ったか」なので、
       21〜60拠点の日は切っているのに注記が出ていなかった（V7）。
       切ったかどうかは画面側の件数で決める */
    (c.worse > cr.length
      ? '<i class="full">倍率の大きい上位 ' + num(cr.length) + " 拠点だけ出しています（悪化した拠点は全 " +
        num(c.worse) + " 拠点）。</i>"
      : ""));

  /* ---- 図 MTG の記録（事実と推定） ---- */
  h += sec("図", "MTG を実施した記録（事実と推定を分ける）");
  const mparts = [
    { label: "録画もメールもある", v: m.both, color: C.midori },
    { label: "録画だけ（事実）", v: m.only_recording, color: C.ai },
    { label: "メールだけ（推定）", v: m.only_mail, color: C.ki, faint: true },
    { label: "どちらも無い", v: m.neither, color: C.ghost, faint: true },
  ];
  h += fig("稼働中 " + num(m.n_act) + " 件の内訳",
    "Zoom録画は事実、メール由来は推定（&plusmn;1日で83.3%）",
    svgStack({ parts: mparts, w: 680 }),
    stackLegend(mparts) +
    '<i class="full">' + esc(m.note) + "　録画がある " + num(m.fact_recording.n) +
    " 件（" + pct1(m.fact_recording.rate) + "）／ メール由来 " + num(m.estimated_mail.n) +
    " 件（" + pct1(m.estimated_mail.rate) + "）</i>");

  /* ---- 図 顧客ぜんたいの形 ---- */
  h += sec("図", "顧客ぜんたいの形");
  const lt = sh.ltv;
  h += fig("LTV の散らばり（" + esc(sh.display_label) + "）",
    "跡地（解約済・契約終了）も含めた全件",
    lt && lt.n >= MIN_N
      ? svgBoxH({
          rows: [{ label: "LTV", med: lt.median, q1: lt.q1, q3: lt.q3,
                   min: lt.min, max: lt.max, mean: lt.mean, n: lt.n, color: C.ai }],
          w: 680, xFmt: F.man, xLab: "LTV（万円）",   /* 目盛りは万円の数字だけなので単位を書く */
        })
      : tooFew(lt ? lt.n : 0, "LTV"),
    lg("quart", C.ai, "四分位") + lg("line", C.ai, "中央値") +
    /* 🔴 2026-09-23 レビュー F4: 「法人 N」は CS_顧客 の行数（n_all = 1,649）を出していて、
       法人番号で見る・本部アプローチの「全 1,646 法人」（houjin_population。オプション契約しか
       持たない3法人を外す）と合わなかった。同じ母数（n_houjin）にし、外した数も書く */
    '<i class="full">法人 ' + num(sh.n_houjin) +
    (sh.n_houjin_option_only ? "（オプション契約しか持たない " + num(sh.n_houjin_option_only) +
      " 法人を除く）" : "") + "（表示対象 " + num(sh.n_display) +
    /* 🔴 サーバの multi_site_note が「拠点が2つ以上ある法人。決裁は…」で始まるので、
       「拠点が2つ以上ある法人 136。拠点が2つ以上ある法人。」と同じ語が続いていた（2026-09-23 実機）。
       言葉の頭が同じなら重ねない */
    "）／ 拠点が2つ以上ある法人 " + num(sh.multi_site) + "。" +
    esc(String(sh.multi_site_note || "").replace(/^拠点が2つ以上ある法人。?/, "")) + "</i>");

  return h + foot(D.meta);
}

/* 画面の末尾。said=true は「数えていないもの」を画面の頭で既に書いた画面。
   🔴 2026-09-23 目視: 成果とリスク・立ち上がり等で、頭の枠と末尾の枠に
   **同じ文が2回**出ていた。データ品質では not_counted が無く、見出しだけで
   本文が空の枠になっていた（V21）。書くものが無い見出しは出さない。 */
/** 頭の「決まりごと」の枠に出す、サーバの not_counted（※ は落とす）。
    🔴 foot(meta, true) の画面で頭の枠が直書きの文だけだと、サーバの not_counted を
    変えても画面のどこにも出なくなる（V21 検証: 本部アプローチ・MTGの品質・電話）。
    文の正本はサーバに置き、頭の枠はそれを出して、画面だけの補足を後ろに足す */
const notCounted = (meta) => {
  const t = esc((meta && meta.not_counted) || "").replace(/^※\s*/, "").replace(/。$/, "");
  return t ? t + "。<br>" : "";
};
/* counts: 件数の書き方を画面の側で決めるとき（HTML）。省くと meta.n_deals / n_active から作る。
   🔴 見出しは中身に合わせる（V21 の残り、2026-09-23 実機）:
     - not_counted の中身は「予測ではありません」「交代の良し悪しは判定していません」のような
       読むときの断り書きで、「数えていないもの」の一覧ではなかった（today・board・byowner・handover）
     - 件数が無いのに「集計の基準日と件数」と出ていた（houjin） */
function foot(meta, said, counts) {
  const nc = said ? "" : (meta.not_counted || "");
  const cnt = counts != null ? counts
    : (meta.n_deals ? "取引 " + num(meta.n_deals) + " 件" : "") +
      (meta.n_active ? "（稼働中 " + num(meta.n_active) + " 件）" : "");
  return '<div class="note def"><span class="hd">' +
    (nc ? "読むときの注意" : cnt ? "集計の基準日と件数" : "集計の基準日") + "</span><p>" +
    esc(nc) +
    (meta.today ? (nc ? "<br>" : "") + "基準日 " + esc(meta.today) : "") +
    (cnt ? "　" + cnt : "") + "</p></div>";
}

/* ================================================================ 2 継続回数 × 成果 */
function renderRenewal(D) {
  const mr = D.monthly_retention, br = D.by_renewal;
  const label = (r) => (r.renewal_no === 0 ? "初回" : "継続" + r.renewal_no);
  // 解約率の母数は決着済み（継続＋解約＋充足）。n<30 の足切りも母数で見る（全件の n ではない）
  const big = br.filter((r) => r.denom >= MIN_N);
  let h = sec("問い", "継続を重ねると、成果は落ちるのか");

  h += sec("図", "月次の継続率（満了月ベース・本体契約のみ）");
  /* 🔴 実線・塗りの点は「結果が出そろっていて、n が 30 以上」の月だけ。
     - 結果待ちが1件でもある月は率がまだ動く（右側打ち切り）。前は `pending > 5` という
       独自の線で切っていて、結果待ち1〜5件の月が確定値と同じ顔で出ていた（N5）
     - n<30 の月は、たまたまでも大きく振れる。確定値と同じ顔で描かない
     - 決着が0件（n=0）の月は率が無い。**点を作らない**。末尾に続く n=0 の月
       （満了がまだ先の契約しかない月）は横軸からも外し、外した月数を下に書く */
  const mrRows = mr.rows.slice();
  const cutTail = [];
  while (mrRows.length && !mrRows[mrRows.length - 1].denom) cutTail.unshift(mrRows.pop());
  const shaky = (r) => r.pending > 0 || r.denom < MIN_N;
  /* 🔴 n<30 の月は点を打たない（規律「n<30 は図に載せず、載せない理由を書く」）。
     2026-09-24 実機: 右端の 27-01（n=1）の 0% が中空の点で描かれ、継続率が急落したように見えた。
     中空・破線は「結果待ちが残っていて率がまだ動く」の意味で、件数が少なくて振れる月とは別の話。
     横軸の月と n= は残すので、その月があること・件数が少ないことは読める。率は下の表に出す */
  const fewN = mrRows.filter((r) => r.denom > 0 && r.denom < MIN_N);
  h += fig("継続率 ＝ 継続済 ÷（継続済 ＋ 解約 ＋ 充足）",
    "<b>充足も分母に入れています</b>",
    svgLine({ w: 680, h: 240, labelPts: true,
      x: mrRows.map((r) => r.month.slice(2)),
      xSub: mrRows.map((r) => "n=" + r.denom),
      series: [{ color: C.ai, pts: mrRows.map((r) => (!r.denom || r.rate == null || r.denom < MIN_N)
        ? null
        : { v: r.rate / 100, censored: shaky(r),
            note: r.pending > 0 ? "結果待ち" + r.pending : "" }) }],
      yFmt: F.pct, yLab: "継続率", alt: "月次の継続率" }),
    lg("dot", C.ai, "確定した月（結果待ち0件・n " + MIN_N + " 以上）") +
    lg("ring", C.ai, "未確定（結果待ちがある月）") +
    (fewN.length
      ? '<i class="full" data-gapwhy="1">線が途切れているところは、点を打っていない月（決着が ' + MIN_N +
        " 件に届かない月）か、率が出せない月です（0 ではありません）。</i>"
      : "") +
    '<i class="full">中空・破線の月は、結果待ちがまだ残っていて率が動く月です。' +
    "<b>確定値と同じには読まないでください。</b>" +
    "点の下の n は決着した件数です。" +
    (fewN.length
      ? "<b>決着した件数が " + MIN_N + " 件に届かない " + num(fewN.length) +
        " か月は点を打っていません</b>（" + fewN.slice(0, 3).map((r) => esc(r.month) + " n=" + num(r.denom)).join("、") +
        (fewN.length > 3 ? " ほか" : "") + "）。件数が少ない月の率はたまたまで大きく振れるためです" +
        "（率は下の表に出しています）。"
      : "") +
    (cutTail.length
      ? "決着が1件も無い " + num(cutTail.length) + " か月（" + esc(cutTail[0].month) +
        (cutTail.length > 1 ? "〜" + esc(cutTail[cutTail.length - 1].month) : "") +
        "、結果待ち " + num(cutTail.reduce((s, r) => s + r.pending, 0)) +
        " 件）は率が出せないので図に入れていません（下の表には出しています）。"
      : "") + "</i>" +
    '<i class="full">充足（採れて終わった契約）も分母に入れます。採用できて終わったのも' +
    "「継続しなかった」という結果だからです。オプション契約 " +
    num((D.population || {}).deals_option) +
    " 件は母数から外しています（月ごとの偏りが大きく、含めると月次比較が歪むため）。</i>");

  h += sec("表", "満了月ごとの内訳");
  /* 🔴 約60行あるので畳む（V15）。消してはいない。
     🔴 summary に「上の折れ線と同じ数字」と書いていたが、継続・解約・充足・結果待ちの
     月ごとの件数は折れ線に出ていない（折れ線は率と n=母数だけ）。**結果待ちは分母に入れない**
     ことを確かめられるのはこの表だけなので、そう書き、結果待ちの合計を summary に出す（V15 検証）。
     🔴 7列あり 400px 幅では入らない。scroll() の枠に入れないと、開いたときにページが
     横に広がる（V17 検証）。
     🔴 表も図と同じ線で分ける。図の注記は「下の表には出しています」と表へ誘うので、
     表で未確定の率を確定と同じ太字にすると、図で中空にした意味が無くなる
     （前は結果待ち1〜5件の月も n=1 の月も、確定月と同じ太字だった, N5）。
     - 太字は確定（結果待ち0・n 30 以上）だけ
     - 未確定は太字にせず「未確定」と理由を添える
     - n=0 の月は率が無い。0% にも見せず — にする */
  const pendAll = mr.rows.reduce((a, r) => a + (r.pending || 0), 0);
  h += '<details class="fold"><summary>満了月ごとの内訳を開く（' + num(mr.rows.length) +
    " か月ぶん。折れ線に無い継続・解約・充足の件数と、分母に入れていない結果待ち " +
    num(pendAll) + " 件の月ごとの内訳）</summary>" +
    '<div class="lede">継続率の<b>太字は確定した月</b>（結果待ち0件・n ' + MIN_N +
    " 以上）だけです。「未確定」の月は、結果待ちが決着すると率が動くか、件数が少なくて振れやすい月です。</div>" +
    scroll(table([{ t: "満了月" }, { t: "継続", n: 1 }, { t: "解約", n: 1 }, { t: "充足", n: 1 },
              { t: "母数", n: 1 }, { t: "継続率", n: 1 }, { t: "結果待ち", n: 1 }],
    mr.rows.map((r) => [esc(r.month), num(r.keep), num(r.cancel), num(r.fill),
      num(r.denom),
      (!r.denom || r.rate == null)
        ? DASH
        : shaky(r)
          ? pct1(r.rate) + '<br><span class="muted small">未確定（' +
            [r.pending > 0 ? "結果待ち " + num(r.pending) + " 件" : "",
             r.denom < MIN_N ? "n&lt;" + MIN_N : ""].filter(Boolean).join("・") + "）</span>"
          : "<b>" + pct1(r.rate) + "</b>",
      num(r.pending)])), 520) + "</details>";

  h += sec("図", "継続回数ごとの解約率");
  h += fig("分子は「解約 ＋ 充足」", "初回を乗り切れれば、あとは残ります",
    svgBarH({ w: 660, fmt: F.pp, rh: 26,
      rows: big.map((r) => ({
        label: label(r), v: r.cancel_rate, v0: r.cancel_rate_excl_fill,
        txt: pct1(r.cancel_rate), note: "n=" + num(r.denom),
        color: cancelColor(r.cancel_rate) })) }),   /* 色の線は全画面共通（CANCEL_HI） */
    cancelLegend(big.map((r) => r.cancel_rate)) +
    lg("dash", C.ghost, "充足を外すと") +
    '<i class="full">n は決着済み（継続＋解約＋充足）の件数で、解約率の分母です。' +
    "結果待ち（稼働中）は分母に入れていません。n が " + MIN_N +
    " 件未満の継続回数は図に載せていません（下の表には出しています）。" +
    "上の「月次の継続率」も決着済みが分母ですが、あちらは満了月で、こちらは継続回数で分けています。</i>");

  h += sec("図", "継続回数ごとの成果のばらつき");
  for (const [key, name, fmt] of [["oubo", "応募数", F.int], ["syoudaku", "採用数", F.int],
                                  ["oubo_per_posting", "求人票あたり応募", F.d1]]) {
    const rows = big.filter((r) => r[key] && r[key].n >= MIN_N).map((r, i) => ({
      label: label(r), med: r[key].median, q1: r[key].q1, q3: r[key].q3,
      min: r[key].min, max: r[key].max, mean: r[key].mean, n: r[key].n,
      /* 🔴 行ごとに SERIES を回すと2行目（継続1）だけが赤になり、「継続1がまずい」と
         読めてしまう（V9）。行は左のラベルで分かれているので、色は1つでよい */
      color: C.ai }));
    h += fig(name + "の散らばり（継続回数ごと）",
      "中央値だけでは分からない「幅」を出す",
      rows.length ? svgBoxH({ w: 680, xFmt: fmt, rows: rows })
                  : tooFew(0, name),
      lg("quart", C.ai, "四分位") + lg("line", C.ai, "中央値") +
      '<i class="full">n は値が入っている契約の数で、件数そのものではありません。' +
      (D.meta.exclude_right_censored
        ? "右側打ち切りを外しています。"
        : "右側打ち切り " + num(D.meta.right_censored_n) +
          " 件を含んでいます（直近の契約は結果が確定しておらず、成果が低く出ます）。") + "</i>");
  }

  h += sec("表", "継続回数ごとの代表値");
  /* 11列あり、枠に入れないと 400px幅でページが 1,015px に広がっていた（V17 実測） */
  h += scroll(table([{ t: "継続回数" }, { t: "件数", n: 1 }, { t: "稼働中", n: 1 },
              { t: "決着済み（母数）", n: 1 },
              { t: "解約率", n: 1 }, { t: "（充足を外すと）", n: 1 },
              { t: "応募数", n: 1 }, { t: "面接数", n: 1 }, { t: "承諾数", n: 1 },
              { t: "求人票あたり応募", n: 1 }, { t: "契約額", n: 1 }],
    /* 🔴 n<30 の行（継続9〜14回は n=1〜6）に 0.0% / 50.0% が印なしで並んでいた（V15）。
       行は消さずに印を付け、率を一段落とす。
       🔴 解約率の分母は決着済み（r.denom, fix/cs-rust N1）。印も図の足切りと同じく denom で判定する */
    br.map((r) => [label(r) + (r.denom < MIN_N ? ' <span class="tag few">n&lt;' + MIN_N + "</span>" : ""),
      num(r.n), num(r.n_active), num(r.denom),
      r.denom < MIN_N ? '<span class="muted">' + pct1(r.cancel_rate) + "</span>"
                      : "<b>" + pct1(r.cancel_rate) + "</b>",
      '<span class="muted">' + pct1(r.cancel_rate_excl_fill) + "</span>",
      med(r.oubo), med(r.mensetu), med(r.syoudaku), med(r.oubo_per_posting, 1),
      med(r.amount, 0, 1)])));

  /* 🔴 「結果ごとの記入率」の図と「まずい」の枠は、データ品質の画面と**まったく同じ**だった（V16）。
     同じ数字を2か所で出さない（立ち上がりの「継続率はこの画面にありません」と同じ扱い）。
     ここには読み方への影響だけを残し、図はデータ品質に1つだけ置く。 */
  h += note("warn", "上の図は「継続するほど成果が良い」側に強く出ます",
    "うまくいかなかった契約ほど応募数・採用数が記録されていません。" +
    "結果ごとの記入率は " + goLink("study", "dq") + " にあります。");
  return h + foot(D.meta);
}

function med(o, d, isMan) {
  if (!o || !o.n) return DASH;
  return (isMan ? yen(o.median) : num(o.median, d || 0)) +
    ' <span class="muted small">(n=' + num(o.n) + ")</span>";
}

/* ================================================================ 3 顧客詳細 */

/* 注力の内訳と、注力だけに絞る操作。
   🔴 **置き場所は法人の画面。** 注力は法人単位の性質なので、案件単位の画面に置くと
      「この案件が注力」と読まれる。
   🔴 条件は重なる（1社が2つ3つに当たる）ので、内訳を足しても社数にはならない。

function focusSection(D) {

    num(f.n_display) + " 社）</label></div>";

  const rest = f.n_display - f.n_focus;
  h += fig("1点が1社（" + esc(f.display_label) + " " + num(f.n_display) + " 社）",
    "色が付いているのが注力",

    lg("dot", C.ai, "注力 " + num(f.n_focus) + " 社") +
    lg("dot", "var(--rule-strong)", "それ以外 " + num(rest) + " 社") +

    " 社にはなりません）: 月額30万以上 " + num(f.monthly_over_300k) +
    " ／ 従業員1,000名以上 " + num(f.enterprise) +

    '<i class="full">図は' + esc(f.display_label) + "だけで描いています" +
    /* 🔴 図の母数（n_display）は選択肢と同じ集合で、オプション契約しか持たない法人も入る
       （fixture 1社）。それを書かずに下の「オプション契約しか持たない法人は数えていません」を
       並べると、図の側からも外したように読めた。どちらの母数に掛かる話かを文の中で分ける */
    (f.n_display_option_only
      ? "（この " + num(f.n_display) + " 社には、オプション契約しか持たない法人 " +
        num(f.n_display_option_only) + " 社も入っています）" : "") + "。" +
    /* 🔴 母数は本部アプローチの「全 N 法人」と同じ n_houjin（オプション契約しか持たない法人を除く）。
       以前は CS_顧客 の行数（n_all）で、同じ画面に「全 1,649」と「全 1,646」が並んでいた */
    (f.n_houjin_option_only ? "オプション契約しか持たない " + num(f.n_houjin_option_only) +
      " 法人を除いた" : "") +
    "全 " + num(f.n_houjin) + " 法人まで広げると注力は " + num(f.n_focus_all) + " 社です。</i>");
