<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>コンサルダッシュボード</title>
<style>
:root{
    --paper:#f4f6f8; --panel:#ffffff; --panel-2:#fafbfc; --panel-3:#edf0f3;
    --ink:#191a1c; --ink-2:#5b6168;
    /* 🔴 2026-09-22 実測: #8d939a は paper の上で 2.86:1 しかなく、4.5:1 に届いていなかった
       （節番号12px・図の軸ラベル10px・読み込み中の表示に使っている）。
       色相と彩度はそのままに明度だけ落とした。実測 4.55:1
       （4つの地のうち一番きつい --panel-3 #edf0f3 の上での値）。 */
    --ink-3:#686d75;
    --rule:#dde2e8; --rule-2:#eaeef2;
    /* 操作できる部品（select / input / button）の枠**だけ**に使う。
       部品の境界には 3:1 が要る（WCAG 1.4.11）が、--rule は実測 1.20:1 しかなく
       「押せる場所がどこまでか」が見えなかった。表の罫線までこれにすると
       画面が重くなって承認された見た目が変わるので、部品の枠に限る。実測 3.01:1（表の見出しの地 --panel-3 の上で測った。ここが一番きつい）*/
    --rule-strong:#798ca4;
    --ai:#1f4f8f;      --ai-soft:#e8eefa;
    --hi:#ab2f26;      --hi-soft:#fbecea;
    --ki:#8a5f06;      --ki-soft:#fbf3e1;
    --midori:#0f6b51;  --midori-soft:#e5f3ed;
    --murasaki:#5b4b8a;
    /* 案件・拠点を見分けるだけの色（意味を持たない）。CASE_COLORS で使う。
       🔴 2026-09-24 実機（第2弾後）: 5本目・4本目を --ink-3 / --ink-2 の灰色どうしにしていて
       （#686d75 と #5b6168）、houjin の案件の線と拠点の積み上げで見分けられなかった。
       赤＝まずい・緑＝良い・山吹＝注意の色は使わない。牡丹（赤紫）と空（明るい青）を足す。
       白地で 牡丹 6.2:1 / 空 3.6:1（図形の境界に要る 3:1 以上）
       🔴 M-12（08）: 帯の中の白文字（svgStack、11.5px 太字）は空の上で 3.57:1（塗りの .85 を掛けると 2.89:1）で 4.5:1 に届かない。
       空の上の文字だけ --sora-text にする（明るい表示は墨で 6.02:1、暗い表示は地の色で 6.62:1。どちらも塗り .85 込みの計算値）。
       空そのものは変えない（藍 --ai と見分けるための明るい青。#1f7fb8 に落としても白文字は 4.39:1 で届かない）。
       2026-09-29 時点で空を svgStack に渡している画面は無い（CASE_COLORS は線と積み上げ縦棒だけで、文字を載せない） */
    --botan:#9b3f82;   --sora:#2d8fc9; --sora-text:var(--ink);
    --grid:#e3e8ee;
    /* 🔴 2026-09-22 実測: #a9b2bc は 1.98:1 しかなかった。ghost は「値が無い（0 ではない）」を
       示す — や「記録なし」に使っていて、**読ませる文字**なので 4.5:1 が要る。4.54:1 にした。
       実測 4.55:1。
       それでも ink(17.41:1) よりはっきり弱いので、「データより一段落とす」役割は保つ。 */
    --ghost:#616e7d;
    --shadow-card:0 1px 2px rgba(25,26,28,.05), 0 6px 18px -12px rgba(25,26,28,.22);
    --edge-shade:rgba(0,0,0,.2);   /* 表の枠の端の影（.scroll-wrap）。暗い表示では明るい側に振る */
    /* 間隔。数列の5段と、用途で名付けた1つ。
       space-gap は「カードや図の間」。実測で最多(9箇所)だったので段ではなく用途名にした。
       数列に見せかけて実は7段、という状態が一番読めないため。 */
    --space-1:4px; --space-2:8px; --space-3:12px;
    --space-4:16px; --space-6:40px;
    --space-gap:14px;
    /* 角丸。radius-lg が既定（カード・図の枠）。
       radius-pill はタグ専用で、高さ18pxの半分。「丸角」ではなく「ピル形」なので名前を分ける。 */
    --radius-md:7px; --radius-lg:10px; --radius-pill:11px;

    /* ---- ここから下の px はトークンにしていない。理由を残す ----
       1〜3px … 光学調整。数字のベースラインを合わせる margin-top:2px、
                4px幅の帯を「ほんの少し」丸める border-radius:1px など。
                段として持つと「2px は space-0 だから使ってよい」と読まれて、
                意味のない微調整が増える。意図的にトークンの外に置く。
       5〜9px … 行の中の隙間（凡例の粒とラベル、チェックボックスと文字）。
                文字サイズに紐づく値で、カードの余白とは別系統。
       10〜11px… タブ・入力欄・summary の上下。押せる範囲の高さを決めている値で、
                余白ではなく当たり判定に近い。
       18〜30px… 見出し前後の間合い。space-4(16) と space-6(40) の間。
                ここを段にするなら実測で決め直す必要があるので、今は残す。
       120px  … .wrap の下。ページ末尾の余白で一点物。
       ---------------------------------------------------------------- */
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#15171b; --panel:#1d2026; --panel-2:#1a1d22; --panel-3:#242830;
      --ink:#e9e6e0; --ink-2:#a3a9b1; --ink-3:#898f96;   /* 3.88:1 → 4.53:1 */
      --rule:#31353c; --rule-2:#24272d; --rule-strong:#697180;  /* 3.01:1 */
      --ai:#7fadf0;      --ai-soft:#17243a;
      --hi:#f18c7f;      --hi-soft:#311d1a;
      --ki:#e0b063;      --ki-soft:#2c2214;
      --midori:#5fc79c;  --midori-soft:#112c24;
      --murasaki:#a294d8;
      --botan:#e59ad2;   --sora:#5ccbe8; --sora-text:var(--panel);   /* 空の上の文字（svgStack）。6.62:1 */
      --grid:#2d3138; --ghost:#888f99;   /* 2.69:1 → 4.53:1 */
      --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 8px 22px -14px rgba(0,0,0,.7);
      --edge-shade:rgba(255,255,255,.14);   /* 表の枠の端の影。下の .scroll-wrap を参照 */
    }
  }
  :root[data-theme="dark"]{
    --paper:#15171b; --panel:#1d2026; --panel-2:#1a1d22; --panel-3:#242830;
    --ink:#e9e6e0; --ink-2:#a3a9b1; --ink-3:#898f96;
    --rule:#31353c; --rule-2:#24272d; --rule-strong:#697180;
    --ai:#7fadf0;      --ai-soft:#17243a;
    --hi:#f18c7f;      --hi-soft:#311d1a;
    --ki:#e0b063;      --ki-soft:#2c2214;
    --midori:#5fc79c;  --midori-soft:#112c24;
    --murasaki:#a294d8;
    --botan:#e59ad2;   --sora:#5ccbe8; --sora-text:var(--panel);
    --grid:#2d3138; --ghost:#888f99;
    --shadow-card:0 1px 2px rgba(0,0,0,.3), 0 8px 22px -14px rgba(0,0,0,.7);
    --edge-shade:rgba(255,255,255,.14);
  }

  *{ box-sizing:border-box; }
  html{ background:var(--paper); }
  body{
    background:var(--paper); color:var(--ink); margin:0;
    font-family:"BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Hiragino Sans","Meiryo",sans-serif;
    /* 🔴 本文 14px の判断（2026-09-22）
       UI/UX の規約は「本文は最低 16px」だが、原文は "Minimum 16px body text
       **on mobile**" で、**スマートフォンを前提にした規約**。
       この画面は毎朝PCで見るもので、③は14列の表を横に並べる。
       16px にすると1画面に収まる列が減り、横スクロールが増えて読みにくくなる。
       行間を 1.85 と広めに取って可読性を補っている。
       代わりに「いちばん小さい文字」の下限は 11px に上げた（軸ラベル・タグ）。
       スマートフォンで常用することになったら、ここは見直すこと。 */
    font-size:14px; line-height:1.85; letter-spacing:.008em;
    -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  }
  /* 見出しだけ明朝にして、図と本文の境目を目で分かるようにする */
  .mincho{ font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN","MS PMincho",serif; }
  .wrap{ max-width:1560px; margin:0 auto; padding:0 26px 120px; }

  /* ---------------- 紙の上端 ----------------
     M-1（2026-09-28 診断、fixture 1440×900）: 題字 27px の行が 75px、その下に鮮度の帯 65px・色と印の意味 40px・
     上のメニュー 45px・母集団 40px・操作列 40px と積んで、本題の見出しが y≈357（400px では 1 画面目がほぼ共通枠）。
     題字を 18px の 1 行にし、鮮度（緑のとき）と「色と印の意味」の畳みを同じ行に並べる。
     🔴 鮮度が黄・赤のときは 2 行の帯を題字の下に戻す（flex-basis:100% で次の行へ）。消さない（規律「いつのデータか」） */
  .masthead{ border-bottom:1px solid var(--ink); margin:0 0 var(--space-1); padding:var(--space-3) 0 var(--space-2);
             display:flex; align-items:center; justify-content:flex-start;
             gap:var(--space-1) var(--space-4); flex-wrap:wrap; }
  .masthead h1{ font-size:18px; margin:0; font-weight:600; letter-spacing:.06em;
                line-height:1.3; }
  .masthead .stamp{ margin-left:auto; }
  /* データの鮮度。毎朝見る画面なので、題字と同じ行（緑）か、そのすぐ下（黄・赤）に固定で出す */
  .fresh{ font-size:12.5px; line-height:1.7; padding:7px 11px; margin:0 0 var(--space-2);
    border:1px solid var(--rule); border-left-width:3px; background:var(--panel);
    color:var(--ink-2); font-variant-numeric:tabular-nums; }
  .fresh:empty{ display:none; }
  .masthead .fresh{ margin:0; }
  .masthead .fresh.ok{ flex:0 1 auto; padding:3px 10px; }
  .masthead .fresh.warn, .masthead .fresh.bad{ flex:1 1 100%; order:5; }
  /* 「色と印の意味」は題字の行の 1 語のリンク（定義と検証へ。M-1 の (3)）。折り返さない */
  .masthead > a.golink{ flex:0 0 auto; font-size:12.5px; }
  .fresh b{ color:var(--ink); font-weight:600; }
  .fresh.ok{ border-left-color:var(--midori); }
  .fresh.warn{ border-left-color:var(--ki); }
  .fresh.bad{ border-left-color:var(--hi); }
  .fresh.bad b{ color:var(--hi); }
  /* 絞り込みの結果。何件中の何件を見ているか */
  .count-line{ font-size:12.5px; padding:6px 10px; margin:0 0 var(--space-2);
    background:var(--panel); border:1px solid var(--rule);
    color:var(--ink-2); font-variant-numeric:tabular-nums; }
  .count-line.on{ border-left:3px solid var(--ai); }
  /* 案件のチェック。既定は全部入り。外すと図・表・KPI がぜんぶ追従する */
  /* 🔴 min(330px,100%): 固定の 330px だと 400px幅で枠からはみ出し、ページが 621px に広がった（V17） */
  .pickbox{ display:grid; gap:2px; grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));
    background:var(--panel); border:1px solid var(--rule); border-radius:var(--radius-lg);
    padding:var(--space-2); max-height:260px; overflow:auto; margin:var(--space-2) 0; }
  /* 当たり判定は 24px 以上（WCAG 2.2 AA / web は 24 CSS px） */
  .pick{ display:flex; align-items:center; gap:7px; min-height:28px;
         padding:2px var(--space-2); border-radius:var(--radius-md);
         font-size:12.5px; cursor:pointer; }
  .pick:hover{ background:var(--panel-2); }
  .pick input{ width:16px; height:16px; margin:0; accent-color:var(--ai); cursor:pointer; }
  .pick input:focus-visible{ outline:2px solid var(--ai); outline-offset:2px; }
  .pick span{ min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .count-line b{ color:var(--ink); }
  .stamp{ font-size:11.5px; color:var(--ink-2); text-align:right; line-height:1.7;
          font-variant-numeric:tabular-nums; }
  .stamp b{ color:var(--ink); font-weight:600; }
  .rule-thin{ height:3px; border-top:1px solid var(--ink); border-bottom:1px solid var(--rule);
              margin:0 0 var(--space-2); }   /* 18px → 8px（M-1。共通枠を詰める） */

  /* ---------------- 凡例 ---------------- */
  .legend{ display:flex; gap:18px; flex-wrap:wrap; align-items:center;
           font-size:11.5px; color:var(--ink-2); margin:0 0 var(--space-1); padding:0 0 var(--space-gap); }
  .legend i{ font-style:normal; display:inline-flex; align-items:center; gap:6px; }
  .legend b{ width:10px; height:10px; border-radius:2px; display:inline-block; flex:none; }
  /* 色の粒を持たない注記は1行まるごと使う（.figlegend i.full と同じ）。
     2026-09-24 検証: 「色と印の意味」の ▲▼ の注記に効く定義が無く、他の項目と横に並んでいた */
  .legend i.full{ flex:1 0 100%; display:block; line-height:1.7; }

  /* ---------------- タブ ---------------- */
  /* 下の余白 26px → 12px、押せる範囲 11/10px → 8/7px（M-1。約 36px で WCAG 2.2 AA の 24px は満たす） */
  .tabs{ display:flex; gap:0; flex-wrap:wrap; margin:0 0 var(--space-3);
         border-bottom:1px solid var(--rule); }
  .tabs button{ background:none; border:none; border-bottom:2px solid transparent;
    padding:8px 16px 7px; font-size:13.5px; color:var(--ink-2); cursor:pointer;
    font-family:inherit; margin-bottom:-1px; letter-spacing:.03em; }
  .tabs button:hover{ color:var(--ink); background:var(--panel-2); }
  .tabs button:focus-visible{ outline:2px solid var(--ai); outline-offset:-2px; }
  .tabs button.on{ color:var(--ink); border-bottom-color:var(--ai); font-weight:700; }
  /* 上のメニューの丸数字（.tabs button .no）は 2026-09-28 に外した（S-7）。番号は本文で参照しない */
  .pane{ display:none; } .pane.on{ display:block; animation:fade .18s ease-out; }
  @keyframes fade{ from{ opacity:0; transform:translateY(3px); } to{ opacity:1; } }

  /* ---------------- 上のメニュー1つ ＋ 左のサイドバー ----------------
     上で「案件 / コンサルタント / 集計」を選び、左で中の項目を選ぶ。
     一度に見せる選択肢を減らして、どこを見ているかを分かりやすくする。 */
  /* 側柱 212px → 160px（M-12）。項目はいちばん長い「担当者ごとの案件」（8 字、約 127px）で、160px に入る。本文が 52px 広がる */
  .layout{ display:grid; grid-template-columns:160px minmax(0,1fr); gap:26px;
           align-items:start; }
  /* 🔴 **position:fixed を使わない。** fixed だと本文に重なって先頭の節が隠れる。
     sticky なら grid の列の中に居座るので、本文の幅を食うだけで重ならない。
     余白の打ち消し（padding-top を足す等）も要らなくなる。 */
  .side{ position:sticky; top:var(--space-3); align-self:start;
         max-height:calc(100vh - 2 * var(--space-3)); overflow-y:auto;
         border-right:1px solid var(--rule); padding-right:var(--space-3); }
  .side h2{ font-size:11px; letter-spacing:.14em; color:var(--ink-3);
            margin:0 0 var(--space-2); font-weight:700; border:none; padding:0; }
  .side ul{ list-style:none; margin:0; padding:0; }
  .side li{ margin:0 0 2px; }
  .side button{ all:unset; box-sizing:border-box; display:block; width:100%;
    min-height:34px; line-height:1.45; padding:8px var(--space-3);
    border-radius:var(--radius-md); cursor:pointer;
    font-family:inherit; font-size:12.5px; color:var(--ink-2);
    border-left:3px solid transparent; }
  .side button:hover{ background:var(--panel-2); color:var(--ink); }
  .side button:focus-visible{ outline:2px solid var(--ai); outline-offset:-2px; }
  /* いまどこを見ているか。色だけでなく**太さと左の帯**でも示す */
  .side button[aria-current="page"]{ background:var(--ai-soft); color:var(--ai);
    font-weight:700; border-left-color:var(--ai); }
  /* 項目の末尾の番号（.side .n）は 2026-09-28 に外した（S-7）。件数に見えていた */
  /* 区切り（毎日 / 調べる / 月1・確かめる。2026-09-29 組み替え 段A）。区切りの間は 12px あけ、見出しは押せない小さな字 */
  .sidegrp + .sidegrp{ margin-top:var(--space-3); }
  /* 画面の頭の目次（toc()）。押すと同じ画面の節へ。1 行に並べ、狭い画面では折り返す */
  .toc{ display:flex; flex-wrap:wrap; align-items:baseline; gap:var(--space-1) var(--space-3);
        font-size:12.5px; color:var(--ink-2); margin:var(--space-2) 0; }
  /* 旧ハッシュから来たときの帯（showMoved）。hidden の間は場所を取らない */
  #cs-moved[hidden]{ display:none; }

  /* 🔴 狭い画面ではサイドバーを本文の上に回して横に並べる（畳まない）。
     集計は項目が9つあり、開閉の一手間を挟むと「毎朝いちばん見るもの」が
     1タップ遠くなる。横に流して**全部たどれる状態のまま**にした。 */
  @media (max-width:900px){
    .layout{ grid-template-columns:minmax(0,1fr); gap:var(--space-3); }
    /* 🔴 S-12（2026-09-28 診断）: static だと本文を下へ送った後、項目を切り替えるのに先頭まで戻るしかなかった。
       上に貼り付ける（sticky、top:0）。PC（>900px）は左の列に居座る今までどおり。
       地の色を持たせないと、下を流れる本文が透けて読めない */
    .side{ position:sticky; top:0; z-index:5; background:var(--paper);
           max-height:none; overflow:visible;
           border-right:none; border-bottom:1px solid var(--rule);
           padding:0 0 var(--space-2); }
    .side ul{ display:flex; gap:var(--space-1); overflow-x:auto;
              padding-bottom:var(--space-1); }
    .side li{ margin:0; }
    .side button{ white-space:nowrap; width:auto; border-left:none;
                  border-bottom:3px solid transparent; border-radius:0; }
    .side button[aria-current="page"]{ border-left-color:transparent;
                  border-bottom-color:var(--ai); background:none; }
    /* 段1レビュー C（2026-09-28 検証 400px）: 貼り付けた側柱が 125px（項目が 2〜3 行に折れる）で、本文を読む間ずっと画面を
       占めていた。下へ送っている間は上へ引き上げて隠し、上へ戻したら出す（sideAwayOnScroll が side-away を付け外し）。
       項目は消さない。キーボードで側柱に入っているときは隠さない */
    .side.side-away{ transform:translateY(-100%); transition:transform .18s ease; }
    .side.side-away:focus-within{ transform:none; }
    /* 区切りは 1 行ずつ: 見出しを左に置き、同じ行に項目を並べる（見出しを別の行にすると 3 行ぶん高くなる） */
    .sidegrp{ display:flex; align-items:baseline; gap:var(--space-2); }
    .sidegrp + .sidegrp{ margin-top:0; }
    .sidegrp h2{ flex:none; margin:0; min-width:5.5em; }
    .sidegrp ul{ flex:1; min-width:0; }
  }

  /* ---------------- 見出し ---------------- */
  h2.sec{ font-size:19px; font-weight:600; margin:var(--space-6) 0 var(--space-1); letter-spacing:.05em;
          display:flex; align-items:baseline; gap:var(--space-3); }
  h2.sec .no{ font-size:12px; letter-spacing:.14em; color:var(--ink-3);
              font-family:"BIZ UDPGothic","Yu Gothic UI",sans-serif; flex:none; }
  h2.sec::after{ content:""; flex:1; height:1px; background:var(--rule); }
  /* 見出しの階層（M-5、2026-09-28 診断）: 問いと個々の図・表が同じ 19px 明朝で、主題と部品が同格に見えていた。
     問い（画面の題。1 画面に 1 つ）は 24px 明朝、図・表（部品の題）は 15px ゴシック太字＋藍の縦棒（h3.sub と同じ書式）。
     sec() の第 1 引数で分ける。タグは h2 のまま（見出しの並びを見る見張り・枠の読み上げ名 scrollName は H2/H3 を見る） */
  h2.sec.mincho{ font-size:24px; line-height:1.3; }
  h2.sec.part{ font-size:15px; font-weight:700; letter-spacing:.03em; line-height:1.4; margin:24px 0 var(--space-2); }
  h2.sec.part::before{ content:""; width:4px; height:15px; background:var(--ai); border-radius:1px; flex:none; align-self:center; }
  h2.sec.part::after{ display:none; }   /* 罫線は問いだけ。部品の題には引かない */
  /* 節（複数の画面を 1 つにした画面の、前の画面の問い。partSec）。画面の問い（24px）と部品（15px）の間の 19px。
     左の小さな字（.no）は前の画面の名前 */
  h2.sec.mincho.mid{ font-size:19px; margin-top:var(--space-6); }
  h2.sec + .lede{ color:var(--ink-2); font-size:12.5px; margin:0 0 var(--space-4); max-width:76ch; }
  h3.sub{ font-size:14.5px; font-weight:700; margin:30px 0 10px; letter-spacing:.03em;
          display:flex; align-items:baseline; gap:9px; flex-wrap:wrap; }
  h3.sub::before{ content:""; width:4px; height:15px; background:var(--ai);
                  border-radius:1px; flex:none; align-self:center; }
  h3.sub .hint{ font-weight:400; font-size:12px; color:var(--ink-2); letter-spacing:0; }

  /* ---------------- 注記ブロック ---------------- */
  .note{ border:1px solid var(--rule); border-left:3px solid var(--ink-3);
         border-radius:0 var(--radius-lg) var(--radius-lg) 0; background:var(--panel);
         padding:var(--space-3) var(--space-4); margin:var(--space-gap) 0; font-size:13px; }
  .note .hd{ display:block; font-weight:700; margin-bottom:3px; letter-spacing:.02em; }
  .note .hd::before{ font-size:11px; margin-right:7px; vertical-align:1px;
                     letter-spacing:.1em; font-weight:700; }
  .note.bad{ border-left-color:var(--hi); background:var(--hi-soft);
             border-color:color-mix(in srgb, var(--hi) 28%, transparent); }
  .note.bad .hd{ color:var(--hi); } .note.bad .hd::before{ content:"■ まずい"; }
  .note.warn{ border-left-color:var(--ki); }
  .note.warn .hd{ color:var(--ki); } .note.warn .hd::before{ content:"▲ 注意"; }
  .note.good{ border-left-color:var(--midori); }
  .note.good .hd{ color:var(--midori); } .note.good .hd::before{ content:"● 良い"; }
  .note.info{ border-left-color:var(--ai); }
  .note.info .hd::before{ content:"— 読み方"; color:var(--ai); }
  .note p{ margin:5px 0 0; }

  /* ---------------- KPI ---------------- */
  .kpis{ display:grid; gap:var(--space-3); margin:var(--space-4) 0 var(--space-1);
         grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); }
  .kpi{ background:var(--panel); border:1px solid var(--rule); border-radius:var(--radius-lg);
        border-top:3px solid var(--rule); padding:var(--space-3) var(--space-4);
        box-shadow:var(--shadow-card); }
  /* 🔴 2026-09-23 統合後の実測（400px）: team の KPI「接触率がいちばん低い」の担当名（英数字の続き
     h9821a39368fe、29px）が箱（中身 144px）に収まらず 263px まで伸び、ページ本体が 486px に広がっていた
     （はみ出し 86px）。箱は中身の最小幅で広がらないようにし（min-width:0）、切れ目の無い長い語も
     箱の幅で折り返す。数字は1行に収まる幅なので折り返されない。日付（is-date）は nowrap のまま */
  .kpi{ min-width:0; }
  .kpi .lbl, .kpi .big, .kpi .fine{ overflow-wrap:anywhere; }
  /* 🔴 button の中身は span なので、block にしないと1行に流れる */
  .kpi .lbl, .kpi .big, .kpi .fine, .kpi .act{ display:block; }
  /* 🔴 2026-09-24 実機（400px）: 「MTG の記録がどちらも無い」の最後の「い」だけが次の行に落ちていた。
     折り返すときは行の長さをそろえる（対応していないブラウザでは今までどおり折り返すだけ） */
  .kpi .lbl{ color:var(--ink-2); font-size:11.5px; line-height:1.55; letter-spacing:.02em;
             min-height:2ex; text-wrap:balance; }
  .kpi .big{ font-size:29px; font-weight:700; line-height:1.24; letter-spacing:-.018em;
             font-variant-numeric:tabular-nums; margin-top:2px; }
  .kpi .big .u{ display:inline; }
  .kpi .big .u{ font-size:14px; font-weight:600; color:var(--ink-2); margin-left:2px;
                letter-spacing:0; }
  .kpi .fine{ color:var(--ink-2); font-size:11.5px; line-height:1.6; margin-top:3px;
              min-height:1.6em; }
  .kpi .big.sm{ font-size:19px; letter-spacing:0; }
  /* 日付の KPI。29px のままだと 178px の枠で「2027-02-」「28」と折り返す（2026-09-23 実機） */
  .kpi.is-date .big{ font-size:21px; letter-spacing:0; white-space:nowrap; }
  .kpi.is-bad{ border-top-color:var(--hi); } .kpi.is-bad .big{ color:var(--hi); }
  .kpi.is-warn{ border-top-color:var(--ki); } .kpi.is-warn .big{ color:var(--ki); }
  .kpi.is-good{ border-top-color:var(--midori); } .kpi.is-good .big{ color:var(--midori); }
  .kpi.is-ai{ border-top-color:var(--ai); }
  /* 押せる KPI は絞り込みボタン。押せることが分かる形にする */
  button.kpi{ font:inherit; text-align:left; cursor:pointer; width:100%; color:inherit; }
  button.kpi:hover{ border-color:var(--ai); transform:translateY(-1px); }
  button.kpi:focus-visible{ outline:2px solid var(--ai); outline-offset:2px; }
  /* KPI から Enter で飛んだ先の見出し（sec() の tabindex=-1）。2026-09-28 検証: 定義が無く UA 既定の黒い太枠が出て、
     この画面で唯一の黒枠だった。他の focus-visible と同じ藍の 2px に揃える */
  h2.sec:focus-visible{ outline:2px solid var(--ai); outline-offset:2px; }
  /* 見出しでない行き先（電話の「文字起こしの状況」の枠。段2 S-2）も同じ藍の枠で止まったことを見せる */
  .kpi-target:focus-visible{ outline:2px solid var(--ai); outline-offset:2px; }
  button.kpi{ transition:transform .12s ease, border-color .12s ease; }
  button.kpi[aria-pressed="true"]{ border-color:var(--ai); background:var(--ai-soft);
                                   box-shadow:inset 0 0 0 1px var(--ai); }
  button.kpi .act{ display:block; font-size:11px; color:var(--ai); margin-top:5px;
                   letter-spacing:.02em; }

  /* ---------------- 図 ---------------- */
  figure.fig{ margin:var(--space-gap) 0 6px; background:var(--panel); border:1px solid var(--rule);
              border-radius:var(--radius-lg);
              padding:var(--space-3) var(--space-4); box-shadow:var(--shadow-card); }
  figure.fig > figcaption{ font-size:12.5px; font-weight:700; letter-spacing:.03em;
              margin:0 0 2px; display:flex; align-items:baseline; gap:var(--space-2); flex-wrap:wrap; }
  figure.fig > figcaption .hint{ font-weight:400; color:var(--ink-2); font-size:11.5px;
              letter-spacing:0; }
  /* 数字と単位（「6.7倍」「12 件」）を行の途中で割らない（fig() の keepNum が包む） */
  figure.fig > figcaption .hint .nw{ white-space:nowrap; }
  /* 🔴 2026-09-23 実機（400px 幅）: 図が縮むだけで文字が 4〜5px になっていた。
     図の最小幅を「描いた幅（--fw）の .92 倍」にして、11px の文字を 10px より小さくしない。
     入り切らない分は枠の中で横にスクロールする（ページ本体は広げない, V17）。
     枠の左右の影は「まだ続きがある側」にだけ出る（背景の local / scroll の重ね。JS は使わない） */
  figure.fig .figbody{ overflow-x:auto; overflow-y:hidden; margin-top:var(--space-2);
    background:
      linear-gradient(to right, var(--panel) 40%, transparent) left center / 28px 100% no-repeat local,
      linear-gradient(to left, var(--panel) 40%, transparent) right center / 28px 100% no-repeat local,
      linear-gradient(to right, color-mix(in srgb, var(--ink) 16%, transparent), transparent) left center / 12px 100% no-repeat scroll,
      linear-gradient(to left, color-mix(in srgb, var(--ink) 16%, transparent), transparent) right center / 12px 100% no-repeat scroll; }
  figure.fig svg{ display:block; max-width:100%; height:auto; }
  /* min-width は max-width より強い。狭い画面ではここで止まり、枠がスクロールする */
  figure.fig .figbody > svg{ min-width:calc(var(--fw, 0px) * .92); }
  /* 横に動かせることの文での案内。**枠の幅が図の最小幅（--minw）より狭いときだけ**出す。
     🔴 2026-09-23 検証: @media (max-width:600px) でだけ出していたので、601〜1000px 前後の
     画面（1列になった本文・横欄ありの 1024px）でも図はスクロールするのに案内が無かった。
     図ごとに最小幅が違うので画面幅では決められない。figure を問い合わせの入れ物にして、
     枠の幅（100cqw）と --minw の差で高さを 0 か 1 行にする（差が正なら 999 倍して上限で止まる）。
     cqw を読めないブラウザでは高さの指定ごと無効になり、案内は常に出る（出ないよりよい） */
  figure.fig{ container-type:inline-size; }
  .figscroll{ font-size:11px; line-height:20px; color:var(--ink-2); overflow:hidden;
              height:clamp(0px, calc((var(--minw, 0px) - 100cqw) * 999), 20px); }
  /* 🔴 2026-09-23 レビュー F1: 描いた後は、枠が実際にはみ出しているか（scrollWidth > clientWidth）で
     決め直す（markFig が fig-measured / fig-over を付け外しする）。tabindex・読み上げ名と同じ条件にそろえる。
     上の cqw の式は、測る前（JS が走る前）の見え方だけを受け持つ */
  figure.fig.fig-measured .figscroll{ height:0; }
  figure.fig.fig-measured.fig-over .figscroll{ height:20px; }
  /* 横にスクロールする枠にキーボードで止まったとき、どこにいるか見えるようにする */
  figure.fig .figbody:focus-visible{ outline:2px solid var(--ai); outline-offset:2px; }
  /* 切った左のラベルの全文（fig の <details class="fold figfull">）。ふだんは1行に畳む。
     枠付きの details（既定）にすると図の下に大きな箱が出て本文より目立つので、fold（枠なし）に乗せる */
  details.fold.figfull{ margin:var(--space-1) 0 0; }
  details.fold.figfull > summary{ font-weight:400; font-size:11.5px; }
  .figfull ul{ margin:var(--space-1) 0 0; padding-left:1.4em; line-height:1.7; font-size:11.5px; color:var(--ink-2); }
  /* 図の数値の一覧（fig の figSay。段2 M-11）。読み上げ用は ul.sr（面積を取らない）、目で見る用は畳み「数字で読む」。
     省略した名前の全文（figfull）と同じ見え方。長い一覧（横棒 30 本・月 24 か月）は 22em の段に流す */
  details.fold.figsay{ margin:var(--space-1) 0 0; }
  details.fold.figsay > summary{ font-weight:400; font-size:11.5px; }
  .figsay ul{ margin:var(--space-1) 0 0; padding-left:1.4em; line-height:1.7; font-size:11.5px; color:var(--ink-2);
              columns:auto 22em; column-gap:var(--space-gap); }
  .figsay li{ break-inside:avoid; overflow-wrap:anywhere; }
  /* 帯を縦に積む図・時間軸の図の左のラベルを、横にスクロールしても左に残す（stickyLabels）。
     🔴 2026-09-23 検証: 400px で約 2.6 画面ぶん横に動かすと、ラベルも一緒に流れて
     右側でどの帯の点か分からなくなっていた。ラベルだけを描いた SVG を重ねて左に貼り付ける。
     スクロールしていないときは下の図のラベルとぴったり重なる（同じ位置・同じ縮尺） */
  .stickwrap{ display:flex; align-items:flex-start; min-width:calc(var(--fw) * .92); max-width:var(--fw); }
  figure.fig .stickwrap > svg{ flex:0 0 auto; max-width:none; }
  figure.fig .stickwrap > svg.sticklab{ position:sticky; left:0; z-index:1; width:var(--lw); pointer-events:none; }
  .sticklab text{ paint-order:stroke; stroke:var(--panel); stroke-width:4px; stroke-linejoin:round; }
  figure.fig .stickwrap > svg.stickmain{ width:100%; margin-left:calc(-1 * var(--lw)); }
  .figlegend{ display:flex; gap:var(--space-gap); flex-wrap:wrap; font-size:11px; color:var(--ink-2);
              margin-top:7px; padding-top:7px; border-top:1px solid var(--rule-2); }
  .figlegend i{ font-style:normal; display:inline-flex; align-items:center; gap:5px; }
  /* 色の粒を持たない「注記」は、列に混ぜると途中で折れて読めない。1行まるごと使わせる */
  .figlegend i.full{ flex:1 0 100%; display:block; line-height:1.7; }
  .figlegend svg{ display:inline-block; vertical-align:-2px; }
  /* 図の中の文字。SVG は fill でしか色が付かないので style で var() を渡す */
  /* 🔴 2026-09-22: 10px だった。軸のラベルは読ませる情報（月・件数・母数）なので、
     いちばん小さい文字の下限を 11px に上げた。本文14px・表12.5px は据え置き
     （理由は body の注記に書いた）。 */
  .ax{ font-size:11px; fill:var(--ink-3); font-variant-numeric:tabular-nums; }
  .axl{ font-size:11px; fill:var(--ink-2); }
  .vl{ font-size:11px; fill:var(--ink); font-variant-numeric:tabular-nums;
       font-weight:600; }
  .gridline{ stroke:var(--grid); stroke-width:1; }
  .axisline{ stroke:var(--rule); stroke-width:1; }

  /* ---------------- 表 ---------------- */
  .scroll{ overflow:auto; margin:var(--space-3) 0; max-height:70vh;
           border:1px solid var(--rule); border-radius:var(--radius-lg); background:var(--panel);
           box-shadow:var(--shadow-card); }
  table{ border-collapse:separate; border-spacing:0; width:max-content; max-width:none;
         font-size:12.5px; }
  /* 枠より表が狭いときは枠いっぱいに伸ばす（右に地が余ると別の箱に見える）。
     枠より広いときは max-content のまま横スクロールさせる */
  .scroll>table{ width:100%; min-width:max-content; }
  th,td{ padding:var(--space-2) var(--space-3); text-align:left; white-space:nowrap;
         border-bottom:1px solid var(--rule-2); }
  th{ background:var(--panel-3); font-weight:700; font-size:11.5px; color:var(--ink-2);
      position:sticky; top:0; z-index:2; letter-spacing:.03em;
      border-bottom:1px solid var(--rule); }
  /* 🔴 2026-09-22 実測: 並び替えを th の onclick でやっていたので、キーボードでは
     一切さわれなかった（tabIndex -1 / focus できない）。中に button を入れて、
     Tab で来られて Enter・Space で並び替わるようにした。
     button は見た目を持たず th いっぱいに広がるので、押せる範囲は変わらない。 */
  th.sortable{ padding:0; }
  th button.sort{ all:unset; display:block; width:100%; box-sizing:border-box;
      padding:var(--space-2) var(--space-3); cursor:pointer; text-align:left;
      font:inherit; color:inherit; letter-spacing:inherit; white-space:nowrap; }
  th.n button.sort{ text-align:right; }
  th button.sort:hover{ color:var(--ai); }
  th button.sort:focus-visible{ outline:2px solid var(--ai); outline-offset:-2px; }
  th.n,td.n{ text-align:right; font-variant-numeric:tabular-nums; }
  tbody tr:nth-child(even){ background:var(--panel-2); }
  tbody tr:hover{ background:var(--ai-soft); }
  tbody tr:last-child td{ border-bottom:none; }
  td:first-child{ font-weight:600; }
  /* 1列目（案件名・担当者名など、行を特定する列）を横に送っても左に残す（S-12）。
     2026-09-28 診断（400px）: 表を横に送ると案件名が消え、どの行の数字か分からなくなっていた。
     PC でも横に続く表（案件そのもの 15列）で同じ。はみ出していない表では見え方は変わらない。
     行の地の色（縞・ホバー）を貼り付けた列にも持たせる。透明のままだと下を流れる列が透けて読めない。
     th は上（top:0、z-index:2）にも貼り付いているので、左上の角はその上（z-index:3）に置く */
  th:first-child, td:first-child{ position:sticky; left:0; z-index:1; background:var(--panel); }
  th:first-child{ z-index:3; background:var(--panel-3); }
  tbody tr:nth-child(even) td:first-child{ background:var(--panel-2); }
  tbody tr:hover td:first-child{ background:var(--ai-soft); }
  /* 横に送っている間（more-l）は貼り付けた列の右端に影を落とし、その下に列が隠れていることを示す */
  .scroll-wrap.more-l th:first-child, .scroll-wrap.more-l td:first-child{
    box-shadow:4px 0 8px -4px var(--edge-shade); }
  /* 表の枠にキーボードで止まったとき（markScroll がはみ出す枠だけに tabindex を付ける）、どこにいるか見えるようにする */
  .scroll:focus-visible{ outline:2px solid var(--ai); outline-offset:2px; }
  td.t{ white-space:normal; min-width:180px; max-width:330px; line-height:1.6; }
  /* 折り返す列（table() の列の w）。幅は字数で決める（本文 12.5px） */
  td.wl{ white-space:normal; min-width:12em; max-width:22em; line-height:1.6; overflow-wrap:anywhere; }
  td.ws{ white-space:normal; min-width:6em; max-width:11em; line-height:1.6; overflow-wrap:anywhere; }
  /* 今日動く先の名札の列（w:"f"。段2 A）。名札は 4〜5 本つく行がほとんどで（fixture 24 行中 22 行が 4 本、2 行が 5 本）、
     22em の wl では長い名札が 1 本ずつ折れて 1 行が 79〜100px、24 行で 2,252px、1440×900 の 1 画面目に完全な行が 0 行だった
     （2026-09-28 段1レビュー A、fixture 1440px 実測）。短い書き方（tagsShort）を詰めた枡（.tag.c）で並べ、列を 24em（のちに 25.5em）まで取って
     1 行に 2〜3 本入れる。行の高さは line-height 1.5（wl の 1.6 より詰める）。8 列で 1440px の本文幅（1,149px）に入る。
     🔴 25.5em: 短い名札「満了90日前MTG30日以上途絶」（前は「満了前MTG30日途絶」で範囲が落ちていた。2026-09-29 検証）が
     24em では 24 行中 11 行を 3 段に折り、1 行 54px → 73px に戻った。25.5em で先頭行 73px・残り 54px（直す前と同じ）、
     表の幅は 1,149px のまま枠に収まる。26em では 1,153px になり枠から 4px はみ出す（いずれも fixture 1440px 実測） */
  td.wf{ white-space:normal; min-width:14em; max-width:25.5em; line-height:1.5; overflow-wrap:anywhere; }
  .tag.c{ padding:0 5px; margin-right:2px; line-height:1.4; }
  /* 短い名札は <abbr>（正式な名札を title に）。UA の点線の下線は枡の枠と重なるので消す */
  abbr.tag{ text-decoration:none; }
  /* 契約の系列の表（custBlocks の deals）は11列あり、1440px の本文 1,117px にちょうど収まるだけで余白が無かった。
     取引名・拠点名・ステージが長い法人では右端（状態）が切れた（2026-09-24 検証: 40字・20字・15字で 47px 超）。
     この表だけ折り返しの幅を詰める */
  table.ser td.wl{ max-width:15em; }
  table.ser td.ws{ max-width:8em; }
  tr.clickable{ cursor:pointer; }
  caption{ caption-side:bottom; text-align:left; padding:var(--space-2) var(--space-3); font-size:11.5px;
           color:var(--ink-2); }

  /* ---------------- 小物 ---------------- */
  .ctl{ display:flex; gap:var(--space-4); flex-wrap:wrap; align-items:center; margin:var(--space-gap) 0;
        background:var(--panel); border:1px solid var(--rule); border-radius:var(--radius-lg);
        padding:var(--space-3) var(--space-4); box-shadow:var(--shadow-card); }
  .ctl label{ display:flex; align-items:center; gap:7px; font-size:12.5px; cursor:pointer; }
  .ctl input[type=search], .ctl select{ padding:7px 11px; border:1px solid var(--rule);
    border-radius:var(--radius-md); background:var(--panel-2); color:var(--ink); font-family:inherit;
    font-size:12.5px; }
  .ctl input[type=search]{ min-width:230px; }
  .ctl input:focus-visible, .ctl select:focus-visible{ outline:2px solid var(--ai);
    outline-offset:1px; }
  .tag{ display:inline-block; font-size:11px; padding:1px var(--space-2); border-radius:var(--radius-pill);
        border:1px solid var(--rule); margin-right:var(--space-1); white-space:nowrap;
        color:var(--ink-2); letter-spacing:.02em; }
  .tag.m{ color:var(--midori); border-color:var(--midori); }
  .tag.s{ color:var(--ki); border-color:var(--ki); }
  .tag.e{ background:var(--ai-soft); color:var(--ai); border-color:var(--ai); }
  .tag.d{ color:var(--ghost); border-style:dashed; }
  .muted{ color:var(--ink-2); } .small{ font-size:12px; }
  /* 原文の引用。読ませるが、こちらの主張ではないので一段落とす */
  .quote{ color:var(--ink-2); font-size:12px; line-height:1.7; }
  /* 表の行から③顧客詳細へ。セル全体を押せるようにすると誤爆するのでボタンで */
  .lnk{ font:inherit; font-size:11.5px; color:var(--ai); background:var(--ai-soft);
        border:1px solid var(--ai); border-radius:var(--radius-pill);
        padding:1px var(--space-2); cursor:pointer; white-space:nowrap; }
  .lnk:hover{ background:var(--ai); color:var(--panel); }
  .lnk:focus-visible{ outline:2px solid var(--ai); outline-offset:1px; }
  /* 🔴 2026-09-22 実測: 担当者名から③へ飛ぶリンクが 42.1 x 13px しかなく、
     WCAG 2.2 AA の 24 CSS px に届いていなかった。
     行の高さを増やさずに当たり判定だけ広げる。 */
  a.drill{ display:inline-block; min-height:24px; line-height:24px; padding:0 3px;
           color:var(--ai); text-decoration:underline; text-underline-offset:2px; }
  a.drill:hover{ background:var(--ai-soft); }
  a.drill:focus-visible{ outline:2px solid var(--ai); outline-offset:1px; }
  /* 本文の中の「別の画面へ」のリンク（goLink）。文の中なので行の高さは変えない */
  a.golink{ color:var(--ai); text-decoration:underline; text-underline-offset:2px; white-space:nowrap; }
  a.golink:hover{ background:var(--ai-soft); }
  a.golink:focus-visible{ outline:2px solid var(--ai); outline-offset:1px; }
  .n0{ color:var(--ghost); }                    /* 値が無い。0 ではない */
  .up{ color:var(--hi); font-weight:700; }      /* 悪化 */
  .dn{ color:var(--midori); font-weight:700; }  /* 改善 */
  /* 🔴 inline のままだと枠が 10.5px の em ボックスに張り付き、日本語グリフが
     はみ出して取り消し線のように見える。inline-block + 行高で箱を作る */
  .dummy{ display:inline-block; color:var(--ghost); font-size:11px;
          border:1px dashed var(--ghost); border-radius:3px;
          padding:0 5px; line-height:1.6; vertical-align:baseline;
          white-space:nowrap; }
  code{ background:var(--panel-3); padding:1px 5px; border-radius:3px; font-size:.88em;
        font-family:Consolas,"Courier New",monospace; }
  /* 上下が 0 なのは意図的。中身の余白は summary と本文が持つ。
     横だけ他のカードと同じ space-4 に揃えている */
  details{ margin:var(--space-3) 0; border:1px solid var(--rule); border-radius:var(--radius-lg);
           padding:0 var(--space-4); background:var(--panel); }
  details[open]{ padding-bottom:var(--space-3); }
  summary{ cursor:pointer; color:var(--ai); padding:10px 0; font-size:12.5px;
           font-weight:600; letter-spacing:.02em; }
  summary:focus-visible{ outline:2px solid var(--ai); outline-offset:2px; }
  textarea{ width:100%; font-family:inherit; font-size:12.5px; line-height:1.9;
    border:1px solid var(--rule); border-radius:var(--radius-lg); padding:var(--space-3);
    background:var(--panel-2); color:var(--ink); resize:vertical; }
  textarea:focus-visible{ outline:2px solid var(--ai); outline-offset:1px; }
  .stack{ display:grid; gap:var(--space-gap); }
  .two{ display:grid; gap:var(--space-gap); align-items:start;
        grid-template-columns:repeat(auto-fit,minmax(min(430px,100%),1fr)); }
  .empty{ color:var(--ink-2); font-size:12.5px; border:1px dashed var(--rule);
          border-radius:var(--radius-lg); padding:var(--space-4); text-align:center; }
  .sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0);
       white-space:nowrap; }
  @media (prefers-reduced-motion:reduce){ *{ animation:none !important;
       transition:none !important; } }
  /* 強制カラー（Windows のハイコントラスト。M-12）: 地の色・枠の色・上の帯の色が消えるので、
     「いま見ている項目」には下線と枠、「まずい KPI」には ▲（色と印の意味と同じ印）と太い上の罫を足す */
  @media (forced-colors:active){
    .side button[aria-current="page"], .tabs button.on{ text-decoration:underline; outline:2px solid CanvasText; outline-offset:-2px; }
    .kpi.is-bad{ border-top-width:6px; }
    .kpi.is-bad .big::after{ content:" \25B2"; font-size:14px; }
  }
/* ---------------------------------------------------------------- 本番用の小物
   モックには無いもの（戻り導線・読み直し・取得失敗の表示）だけをここに足す。
   色と間隔は上のトークンから引く。新しい値を持ち込まない。 */
a.backlink{ color:var(--ink-2); font-size:12px; text-decoration:none; margin-left:var(--space-3); }
a.backlink:hover{ color:var(--ai); text-decoration:underline; }
/* 他の押せるものと同じ見え方で、Tab で止まったことが分かるようにする（S-12。ここだけ抜けていた） */
a.backlink:focus-visible{ outline:2px solid var(--ai); outline-offset:1px; }
.ctlbar{ display:flex; align-items:center; gap:var(--space-3);
         flex-wrap:wrap; margin:var(--space-2) 0; }
/* 母集団の 1 行（popline）を操作列の先頭に入れて同じ行にする（M-1。前は別の行で 40px）。
   開いたら内訳が全幅を取り、部品は次の行へ回る。1 行目（稼働中 N 件）は畳まない（規律「母集団を黙って隠さない」） */
.ctlbar > details.popnote.fold{ margin:0; flex:0 1 auto; max-width:100%; }
.ctlbar > details.popnote.fold[open]{ flex-basis:100%; }
/* 操作列の部品。いままで素の見た目のままで、枠が 1.20:1 しかなかった。
   高さは 28px（WCAG 2.2 AA の web 基準 24px を満たす。iOS の 44pt は
   この画面の前提ではない＝毎朝PCで見るもの）。 */
.ctlbar .act{ display:inline-flex; align-items:center; gap:6px;
              font-size:12.5px; color:var(--ink-2); }
.ctlbar select, .ctlbar input, .ctlbar button.act{
  font-family:inherit; font-size:12.5px; color:var(--ink); background:var(--panel-2);
  border:1px solid var(--rule-strong); border-radius:var(--radius-md);
  padding:4px 9px; min-height:28px; }
.ctlbar input[type=search]{ min-width:160px; max-width:100%; }
.ctlbar button.act{ cursor:pointer; color:var(--ai); }
.ctlbar button.act:hover{ background:var(--ai-soft); }
/* 切り替えの押している側（担当者ごとの接触の 月ごと / 週ごと）。色だけでなく太字と枠の太さでも示す */
.ctlbar button.act[aria-pressed="true"]{ background:var(--ai-soft); border:2px solid var(--ai); font-weight:700; }
/* 小さな図を並べる（担当者ごとの接触。1人1枚）。1枚の最小幅は 12点の折れ線が読める 360px */
.multi{ display:grid; gap:0 var(--space-gap); align-items:start;
        grid-template-columns:repeat(auto-fill,minmax(min(360px,100%),1fr)); }
/* 小さな図の見出し: 1行目は担当者の名前、2行目に持ち案件（名前と数字が1行に続くと、伏字の名前が数字の一部に見えた。ループ5） */
.multi figure.fig > figcaption .hint{ flex-basis:100%; }
.ctlbar select:focus-visible, .ctlbar input:focus-visible,
.ctlbar button.act:focus-visible{ outline:2px solid var(--ai); outline-offset:1px; }
/* 表の下の「残りも出す」（案件そのもの。段2 M-8）。枠の直下に寄せ、説明は同じ行に流す */
.ctlbar.board-more{ margin:var(--space-2) 0 var(--space-3); }
/* 「読み直す」は右端に寄せ、文字リンク程度にする（S-11）。鮮度が緑でないとき（.urge）だけ元の枡の見た目に戻して目立たせる */
.ctlbar .reload{ margin-left:auto; display:inline-flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.ctlbar .reload button.act.link{ border-color:transparent; background:none; text-decoration:underline; text-underline-offset:2px;
  color:var(--ink-2); padding-left:4px; padding-right:4px; }
.ctlbar .reload button.act.link:hover{ color:var(--ai); background:var(--ai-soft); }
.ctlbar .reload button.act.link:disabled{ cursor:wait; text-decoration:none; color:var(--ink-3); }
.ctlbar .reload.urge button.act.link{ border-color:var(--ki); background:var(--panel); text-decoration:none; color:var(--ink); font-weight:700; }
@media (max-width:600px){ .ctlbar .reload{ margin-left:0; width:100%; justify-content:flex-start; } }
/* PC（マウス・キーボード）にしか当てはまらない案内（今日動く先の Ctrl+クリック）。≤600px はタッチ前提なので出さない。
   400px で1画面目の2行を使っていた（2026-09-28 実測）。データや母数の注記には使わない（黙って隠さない） */
@media (max-width:600px){ .pconly{ display:none; } }
/* 母集団の注記。全部の項目の頭に、同じ文言で出る。
   数字は本文と同じ濃さ、内訳は一段落として読ませる。 */
.popnote{ margin:0 0 var(--space-3); padding:7px var(--space-4);
          border-left:3px solid var(--ink-3); background:var(--panel-2);
          border-radius:0 var(--radius-md) var(--radius-md) 0;
          color:var(--ink); font-size:12.5px; line-height:1.7; }
.popnote b{ font-weight:700; }
.err{ background:var(--hi-soft); border-left:3px solid var(--hi);
      padding:var(--space-3) var(--space-4); border-radius:0 var(--radius-md) var(--radius-md) 0;
      color:var(--ink); font-size:13px; white-space:pre-wrap; margin:var(--space-3) 0; }
.loading{ color:var(--ink-3); font-size:12px; }
/* 待ち時間の見せ方（M-7、2026-09-28 UI/UX 改善 段2）。「読み込み中…」の 12px 1 行だけで、見込み時間・打ち切り・再試行が
   無かった（デプロイ直後や TTL 切れは実測 18.7〜24.4 秒）。3 秒で見込み（.waitmore）、30 秒で「もう一度読み込む」の押し釦 */
.loading .waitmore{ display:block; margin-top:var(--space-2); color:var(--ink-2); }
.loading button.act, .err button.act{ font-family:inherit; font-size:12.5px; color:var(--ai); background:var(--panel-2);
  border:1px solid var(--rule-strong); border-radius:var(--radius-md); padding:4px 9px; min-height:28px; cursor:pointer;
  margin-left:var(--space-2); }
.loading button.act:hover, .err button.act:hover{ background:var(--ai-soft); }
.loading button.act:focus-visible, .err button.act:focus-visible{ outline:2px solid var(--ai); outline-offset:1px; }
/* 読み込み中の骨組み（M-7）。見出し（画面名）と KPI・表の空箱を先に出し、本題がどこに来るかを予告する。
   数字は入れない（空箱に 0 を出すと「0 件」と読まれる）。aria-hidden で読み上げには出さない。
   高さ 96px は KPI の札（見出し 18 ＋ 数字 36 ＋ 補足 18 ＋ 余白 24）に合わせた値、240px は表の 6 行ぶん */
.skel{ margin-top:var(--space-4); }
.skel .skel-kpis{ display:grid; gap:var(--space-3); grid-template-columns:repeat(auto-fit,minmax(178px,1fr)); }
.skel .skel-kpis i{ display:block; height:96px; border:1px solid var(--rule); border-top:3px solid var(--rule);
  border-radius:var(--radius-lg); background:var(--panel-2); }
.skel .skel-tbl{ height:240px; margin-top:var(--space-4); border:1px solid var(--rule); border-radius:var(--radius-lg);
  background:var(--panel-2); }
@keyframes skel-pulse{ 50%{ opacity:.55; } }
/* 動きを減らす設定（prefers-reduced-motion）は上の *{ animation:none } が止める */
.skel .skel-kpis i, .skel .skel-tbl{ animation:skel-pulse 1.6s ease-in-out infinite; }
/* 本文へ飛ぶ（M-6）。見えないが、Tab でフォーカスが当たったときだけ左上に出る */
a.skip{ position:absolute; left:var(--space-4); top:-60px; z-index:20; font-size:12.5px; color:var(--ai); background:var(--panel);
  border:2px solid var(--ai); border-radius:var(--radius-md); padding:6px 12px; text-decoration:none; }
a.skip:focus{ top:var(--space-2); outline:none; }
/* 移動の直後は本文（#cs-main、tabindex=-1）へフォーカスを移す（M-6）。マウスでは枡を出さず、キーボードのときだけ藍の枡。
   取得の失敗（#cs-error）も同じ */
#cs-main:focus, #cs-error:focus{ outline:none; }
#cs-main:focus-visible, #cs-error:focus-visible{ outline:2px solid var(--ai); outline-offset:4px; }

/* ---------------------------------------------------------------- 共通部を畳む（V1）
   🔴 2026-09-23 実測: 鮮度2行・色の凡例・母集団の3行ボックスが全画面の頭に並び、
   本題の見出しが 1440px幅で y≈440、**400px幅では y=837（1画面目 800px の外）**だった。
   消すと規律（鮮度・母集団を黙って隠さない）に反するので、**1行目は残して内訳だけ畳む**。
   開けば全文が読める。 */
details.fold{ margin:0 0 var(--space-2); border:none; border-radius:0; padding:0; background:none; }
details.fold[open]{ padding-bottom:0; }
details.fold > summary{ padding:3px 0; font-size:12px; font-weight:600; color:var(--ai); }
details.fold > summary b{ color:var(--ink); }
/* summary の文を開閉で切り替える（「表を開く」→「表を閉じる」）。2026-09-28 検証: 開いた後も「表を開く」のままで、
   状態は▸の向きだけで伝わっていた。JS で書き換えず、[open] で見せる方を替える（描き直しても崩れない） */
summary .when-open{ display:none; }
details[open] > summary .when-open{ display:inline; }
details[open] > summary .when-closed{ display:none; }
/* 母集団の注記は1行目（稼働中 N 件）だけを summary に出す。内訳は開いたときだけ */
details.popnote.fold{ padding:4px var(--space-4); margin:0 0 var(--space-2);
  border-left:3px solid var(--ink-3); background:var(--panel-2);
  border-radius:0 var(--radius-md) var(--radius-md) 0; }
details.popnote > summary{ color:var(--ink); font-weight:400; padding:2px 0; }
details.popnote > summary b{ font-weight:700; }
.fresh details.fold{ margin:2px 0 0; }
.fresh details.fold > summary{ font-weight:400; font-size:12px; }
/* 緑（今日／昨日）のときは内訳の畳みを1行目の続きに置き、帯を1行にする（S-9）。
   2026-09-28 実測（1440px）: 帯は2行で 65px、全画面の頭で本題を下へ押していた。
   開くと内訳は次の行に出る（Chromium では details の中身（::details-content）が block のまま。
   2026-09-28 実測: summary top=109 / 内訳 top=130）。黄・赤のときは今までどおり2行目に畳みが出る。
   summary は inline-block にし、上下 6px・左右 4px の余白を負の margin で打ち消す。行の高さは変えずに
   押せる範囲だけ広げる（inline のままだと 72×12px で、S-12 で 40px に広げた側柱・操作列と釣り合わなかった） */
.fresh details.fold.inl{ display:inline; margin:0 0 0 var(--space-3); }
.fresh details.fold.inl > summary{ display:inline-block; padding:6px var(--space-1); margin:-6px calc(-1 * var(--space-1)); }
.fresh details.fold.inl > summary::-webkit-details-marker{ display:none; }
.fresh details.fold.inl > summary::before{ content:"\25B8 "; }
.fresh details.fold.inl[open] > summary::before{ content:"\25BE "; }
.fresh details.fold.inl > .muted{ margin-left:var(--space-2); }
/* 凡例は折りたたみの中。開いたときに summary との間を空けすぎない */
details.fold .legend{ padding:var(--space-1) 0 var(--space-2); }
/* 決まりごと・読み方の箱の畳み（M-5、foldNote）。summary の keep は畳まない 1 文（本文と同じ濃さ・太さ）。
   開いた箱は見出しを持たない（summary が見出し） */
details.fold.notefold{ margin:var(--space-2) 0 var(--space-3); }
details.fold.notefold > summary .keep{ color:var(--ink); font-weight:400; margin-left:var(--space-3); }
details.fold.notefold > .note{ margin:var(--space-2) 0 0; }
/* 見出し（.hd）を持たない箱。本文の上の 5px（見出しとの間）は要らない。
   🔴 定義が無いクラス名は tests/css_classes_exist.rs が落とす（2026-09-28 に nohd で落ちた） */
.note.nohd > p{ margin:0; }

/* 「決まりごと」の枠（V21）。
   info の見出しには「— 読み方」が付くが、中身が**読み方ではなく取り決め・条件**の枠
   （絞った条件・並びの決まり・数えていないもの）まで「読み方」と名乗っていて、
   見出しと中身が合っていなかった。色は info と同じで、頭の言葉だけ分ける。 */
.note.def{ border-left-color:var(--ai); }
.note.def .hd::before{ content:"— 決まりごと"; color:var(--ai); }

/* 表の残りを見せる（V12）。
   🔴 2026-09-23 実測: 表は高さ 624px の枠の中で縦にスクロールし、
   「案件そのもの」は表の幅 2,944px ÷ 枠 1,119px で横にも続く。なのに
   **残りがあることを示すものが何も無く**、右端の列が切れて見えていた。
   枠の上に「全 N 行 × M 列・枠の中でスクロール」を必ず出す。 */
.scroll-cap{ font-size:11.5px; color:var(--ink-2); margin:var(--space-3) 0 calc(-1 * var(--space-2));
             font-variant-numeric:tabular-nums; }
.scroll-cap b{ color:var(--ink); }
/* 枠の案内（scroll-cap）と決まりごとの畳みを 1 行に並べる（今日動く先。scroll() の side）。
   2026-09-28 検証（fixture 1440×900）: 畳みの summary（706-735）と scroll-cap（747-765）が同じ「243 件から 24 件」を
   40px の間に 2 回言い、その分だけ表の見出し行（772）が下がって 1 画面目に完全な行が 0 行だった。
   畳みを開いたときは畳みが 1 行を取り、案内は表の直上（次の行）へ下がる */
.caprow{ display:flex; flex-wrap:wrap; align-items:baseline; gap:0 var(--space-4); margin:var(--space-3) 0 calc(-1 * var(--space-2)); }
.caprow > .scroll-cap{ flex:1 1 auto; margin:0; }
.caprow > details.fold{ flex:0 1 auto; margin:0; }
.caprow > details.fold[open]{ flex-basis:100%; margin-bottom:var(--space-2); }
/* 600px 以下用の文（cap-sp）は PC では出さない（@media (max-width:600px) で入れ替える。S-12） */
.scroll-cap .cap-sp{ display:none; }
/* 枠がはみ出していないとき（markScroll が測って .fit を付ける）はスクロールの文を出さない。件数の文は残る（段1レビュー F。
   2026-09-28 検証: 1440px で担当者の一覧・沈黙している取引などがはみ出さないのに「入り切らない分は…」を常に出していた） */
.scroll-cap.fit .cap-pc, .scroll-cap.fit .cap-sp, .scroll-cap.fit .cap-x{ display:none; }
/* 先頭 RC_CAP 行だけ出す仕組み（rowCap。段1レビュー B）は 600px 以下だけ。PC では文もボタンも出さない */
.scroll-cap .cap-rc{ display:none; }
.rc-more{ display:none; }
/* 枠の端の影（V12 の残り、2026-09-23 実機）。文で「スクロールします」と書いても、
   右端の列が切れて見えるだけで続きがあると分からなかった。
   横にまだ続きがある側にだけ影を出す（more-r / more-l は markScroll が付け外しする）。
   影は枠（.scroll）の外側の包み（.scroll-wrap）に描く。.scroll の中に描くと表と一緒に流れる。
   🔴 影の色を rgba(0,0,0,.2) の固定にしていて、暗い表示の枠の地 #1d2026 の上では
      20% の黒を重ねても約 rgb(23,26,30) で、地との差がほとんど無かった（2026-09-23 検証、
      prefers-color-scheme: dark の Playwright）。色は --edge-shade にして、暗い表示では
      14% の白（重ねると約 rgb(61,63,68)）にする
   🔴 左端の帯（::before）は S-12 で1列目を貼り付けたときに外した。貼り付いた列は隠れていないのに、
      その上に「下に列が隠れている」印が乗り、しかも見出しのセル（z-index:3）にだけ乗らなかった
      （2026-09-28 検証: 1440px・400px とも scrollLeft=300 で td の左端の画素 (221,221,221)、同じ列の th は地のまま）。
      左に隠れている列は、貼り付けた列の右端の影（上の .more-l td:first-child の box-shadow）で示す。右端はそのまま */
.scroll-wrap{ position:relative; margin:var(--space-3) 0; }
.scroll-wrap > .scroll{ margin:0; }
.scroll-wrap::after{ content:""; position:absolute; top:1px; bottom:1px; right:1px; width:28px;
  pointer-events:none; opacity:0; transition:opacity .15s; z-index:3;
  border-radius:0 var(--radius-lg) var(--radius-lg) 0;
  background:linear-gradient(to left, var(--edge-shade), transparent); }
.scroll-wrap.more-r::after{ opacity:1; }

       古い側で、要（新しい契約・最新の累計・直近の月）が横スクロールの奥にあった。
       x0（最初にデータがある位置）より優先する */
    const xr = sv.getAttribute("data-xr");
    if (xr != null && xr !== "") {
      const r = +xr * k;
      if (r > b.clientWidth) b.scrollLeft = Math.min(r - b.clientWidth, b.scrollWidth - b.clientWidth);
      return;
    }
    const x = +sv.getAttribute("data-x0") * k;
    /* 開いた直後に左半分より右にデータが始まる図だけ動かす。左にも見えているなら動かさない */
    if (x > b.clientWidth * 0.5) b.scrollLeft = Math.min(x, b.scrollWidth - b.clientWidth);
  });
}
/** 左のラベル列を、横にスクロールしても左に残す（CSS の .stickwrap / .sticklab）。
    labs はラベルだけを集めた SVG 断片（labText の出力）、labH はラベル列の高さ（下の月の軸は入れない）。
    svg は図そのもの（ラベルも含む）。重ねる側はラベルの複製なので読み上げから外し、data-full も外す
    （全文の一覧の元は下の図のラベルだけにする）。
    🔴 重ねる側に地の色の四角を敷かない。400px ではラベル欄が見えている幅の 2/3（約 220px / 334px）を
    占め、敷くとスクロールした先の図がほとんど隠れた（2026-09-23 chromium で確かめた）。
    文字の縁取り（地の色の太い線を文字の下に敷く）だけで、線や点の上でも読めるようにする。
    bgW: 縦軸の目盛りだけを貼り付ける図（折れ線・積み上げ縦棒）で、目盛りの欄（0〜bgW）にだけ地の色の四角を敷く。
    🔴 2026-09-24 検証（385px, ループ4 の後）: 右端で開くようにした折れ線・LTV で、貼り付けた目盛りの字
    （「50%」「2,000」「0」）の上にデータの点や棒が重なって読みにくかった。目盛りの欄は 40〜60px
    （見えている幅の 1/6 ほど）なので、敷いても図はほとんど隠れない。欄は pad.l までにして、
    スクロールしていないとき（左端）に最初の点・棒を隠さない */
/** 目盛りを左に貼り付けるときの欄の幅。軸の題名（x=2 から書く「累計金額（万円）」）が目盛りの欄より長いと、
    貼った側で題名が「累計金額（万」と切れた（2026-09-24 ループ4 実機, houjin の LTV）。題名が入る幅まで広げる */
const stickW = (padL, yLab) => Math.max(padL, yLab ? Math.ceil(2 + textW(yLab) + 4) : 0);
function stickyLabels(w, padL, labH, labs, svg, bgW) {
  const dup = (bgW > 0 ? `<rect data-stickbg="1" x="0" y="0" width="${Math.round(bgW)}" height="${Math.round(labH)}" style="fill:var(--panel)" opacity=".92"/>` : "") +
    labs.replace(/<text class="axl"/g, '<text data-sticky="1" class="axl"')
    .replace(/ data-full="[^"]*"/g, "");
  return `<div class="stickwrap" style="--fw:${Math.round(w)}px;--lw:${(padL / w * 100).toFixed(4)}%">` +
    `<svg ${SVGNS} class="sticklab" viewBox="0 0 ${padL} ${labH}" width="${padL}" height="${labH}" aria-hidden="true" focusable="false">` +
    dup + `</svg>` + svg.replace("<svg ", '<svg class="stickmain" ') + `</div>`;
}

const esc = s => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");

/* 内部名 → 画面に出す名前（V3）。**対応表はここ1か所だけ。**
   🔴 2026-09-23 実機: 継続回数×成果・データ品質の図に oubo / mensetu / syoudaku /
   saiyomokuhyou / keisaisu、法人番号の出どころに deal / company、担当の決まりごとに
   consultant / hubspot_owner_id がそのまま出ていた。HubSpot の内部名は現場の人には読めない。
   サーバの応答（キーや文言）は変えない。**出す直前にここで置き換える。** */
const DISPLAY_NAME = {
  oubo: "応募数", mensetu: "面接数", syoudaku: "承諾数（採用数）",
  saiyomokuhyou: "採用目標数", keisaisu: "掲載求人数",
  deal: "取引に入っていた法人番号", company: "会社に入っていた法人番号",
  /* 🔴 HubSpot 画面のラベルそのままにする。画面の案内どおりに HubSpot で欄を探せるように
     （V3 検証: 「担当コンサル」「求人の掲載数」は HubSpot に無い名前だった。
     platform-data-quirks/references/hubspot-deals.md: consultant＝「コンサル担当」、keisaisu＝「掲載求人数」） */
  consultant: "HubSpot の「コンサル担当」欄",
  hubspot_owner_id: "HubSpot の「取引担当者」欄",
};
/** 1語まるごとが内部名なら置き換える。知らない語はそのまま返す（黙って消さない） */
const dispName = (k) => (Object.prototype.hasOwnProperty.call(DISPLAY_NAME, k) ? DISPLAY_NAME[k] : k);
/** サーバが書いた文の中に混ざった内部名を置き換える。英単語の一部には当てない */
const dispText = (s) => String(s == null ? "" : s).replace(
  new RegExp("(^|[^A-Za-z0-9_])(" + Object.keys(DISPLAY_NAME).join("|") + ")(?![A-Za-z0-9_])", "g"),
  (m, pre, k) => pre + DISPLAY_NAME[k]);

/** 目盛りを人が読める刻みにする。
    minStep: 件数・人数のように整数しか無い軸は 1 を渡す。
    🔴 2026-09-23: 採用数 0〜2 の軸で刻みが 0.5 になり、整数に丸めて出すので
    目盛りが「2, 2, 1, 1, 0」と重複していた（V10） */
function ticks(lo, hi, want, minStep) {
  want = want || 4;
  if (!isFinite(lo) || !isFinite(hi)) return [0];
  if (hi <= lo) hi = lo + (Math.abs(lo) || 1);
  const raw = (hi - lo) / want;
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const n = raw / mag;
  let step = Math.max(minStep || 0,
    (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag);
  /* 🔴 整数しか無い軸で刻みが 2.5 になると、整数に丸めて出すので目盛りが
     「0, 3, 5, 8, 10」と不等間隔に見えた（2026-09-23 実機）。
     最小の刻みで割り切れない刻みは 2 倍（2.5 → 5）にする */
  if (minStep && Math.abs(step / minStep - Math.round(step / minStep)) > 1e-9) step *= 2;
  const out = [];
  for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + step * 1e-6; v += step)
    out.push(Number(v.toFixed(10)));
  return out.length ? out : [lo];
}
/** 最大値が最上段の目盛りを超えるとき、覆うところまで目盛りを1段足す（tk を書き換えて返す）。
    🔴 整数の軸は刻み 2.5 を 5 にする（ticks）ので、最大 7〜9 の軸は目盛りが [0,5] で止まり、
    棒・点が最上段の目盛りより上へ伸びていた（2026-09-23 検証: ticks(0,9,4,1) → [0,5]）。
    svgLine / svgBarH だけで足していたのを、縦軸を持つ図すべて（colstack / hist / scatter）で使う */
function coverTicks(tk, top) {
  if (tk.length > 1 && tk[tk.length - 1] < top - 1e-9)
    tk.push(Number((tk[tk.length - 1] + (tk[1] - tk[0])).toFixed(10)));
  return tk;
}

/* 目盛りの書式。単位は軸のラベルに1回だけ書いて、数字自体は素で出す */
const F = {
  int: v => Math.round(v).toLocaleString("ja-JP"),
  man: v => Math.round(v / 10000).toLocaleString("ja-JP"),
  pct: v => (v * 100).toFixed(0) + "%",
  pct1: v => (v * 100).toFixed(1) + "%",
  d1: v => v.toFixed(1),
  d2: v => v.toFixed(2),
  d3: v => (v >= 0 ? "+" : "") + v.toFixed(3),
  /* 値がすでに「%の数字」（50.1 のような 0〜100）で来るもの。
     🔴 F.d1 で出すと目盛りが「10.0 20.0」になり、率なのか件数なのか読めなかった（V20） */
  pp: v => (Math.round(v * 10) / 10) + "%",
};
/** 軸の最小の刻み。件数は 1、万円は 1万（それより細かい刻みは丸めると重複する） */
const minStepOf = (fmt) => (fmt === F.int ? 1 : fmt === F.man ? 10000 : 0);

/** 図の外枠。figcaption と凡例をまとめて面倒をみる */
/** 数字と単位を折れない塊（<span class="nw">）で包む。html はタグ・文字参照を含んでよい（中は触らない）。
    🔴 2026-09-24 実機（ループ5）: 図の見出しの補足（.hint）は幅で折り返すので、houjin の
    「拠点3 / 取引6 / 開き 6.7倍」が「6.7 / 倍」、rampup の「母数 12 件」が「12 / 件」と数字と単位の間で
    折れうる（日本語は字の間どこでも折れる。数字と「倍」「件」の間も折れる）。
    呼び出し側ごとに包むと新しい補足で漏れるので、fig() の入口でまとめて包む */
const KEEP_NUM = /\d[\d,.]*[ \u00a0]?(?:法人|万円|ヶ月|か月|[%％倍件人社日秒円万回年月])/g;
function keepNum(html) {
  return String(html).split(/(<[^>]*>|&[#\w]+;)/)
    .map((seg, i) => (i % 2 ? seg : seg.replace(KEEP_NUM, (m) => `<span class="nw">${m}</span>`))).join("");
}
function fig(caption, hint, body, legend) {
  /* 🔴 図の読み上げ名が「横棒」「構成比」のような既定値のままだった（V20）。
     呼び出し側で alt を渡していない図は、図の見出しを読み上げ名にする */
  body = String(body).replace(
    /aria-label="(折れ線|箱ひげ図|横棒|系列を縦に積んだ図|構成比|充足率|分布|散布図|接触の時系列|割合|ファネル)"/g,
    /* 関数で置き換える。文字列のままだと、拠点名・契約名の「$&」「$'」が置き換えの
       特殊パターンとして解釈され、属性が壊れる（V20 検証。esc は $ を逃がさない） */
    () => 'aria-label="' + esc(caption) + '"');
  /* 狭い画面では図を縮めずに横スクロールにした（svgHead）。影だけでは気づきにくいので、
     400px 幅の枠（約 330px）に入らない図には文でも添える。
     🔴 2026-09-23 検証: 前は @media (max-width:600px) でだけ出していて、601〜1000px 前後の画面でも
     最小幅 865〜920px の図は枠の中でスクロールするのに、文の案内が無かった。
     いまは「枠の幅 < 図の最小幅」のときだけ出す（CSS の .figscroll。--minw と枠の幅 100cqw を比べる） */
  /* 枠の幅で描いた図（data-fit。小さな図を並べる画面）は横スクロールにならないので数えない（ループ5） */
  const minW = Math.max(0, ...[...String(body).matchAll(/<[^>]*--fw:(\d+)px[^>]*>/g)]
    .filter((m) => m[0].indexOf(' data-fit="1"') < 0).map((m) => +m[1] * .92));
  const scroll = minW > 330;
  /* 切った左のラベルの全文（labText の data-full）。title はホバーでしか出ないので、
     タップと読み上げで読めるよう図の外に並べる */
  const fulls = [], seen = new Set();
  /* 2行に折り返したラベル（labText の lines。<tspan> が2つ）も、見えている字をつないで並べる */
  for (const m of String(body).matchAll(/<text class="axl"[^>]*? data-full="([^"]*)"[^>]*>((?:<tspan[^>]*>[^<]*<\/tspan>)+|[^<]*)/g)) {
    if (seen.has(m[1])) continue;
    seen.add(m[1]); fulls.push(`<li><span class="muted">${m[2].replace(/<[^>]*>/g, "")}</span> … ${m[1]}</li>`);
  }
  /* 図の中の「値が無い」の見せ方を凡例で説明する（svgHead の marks）。
     🔴 値はあるが点を打たない月（継続率の n<30）がある図では、途切れの理由が「値が無い」だけではない。
     その図は凡例に data-gapwhy="1" の段落で自分の理由を書くので、ここの決まり文句は出さない
     （2026-09-24 検証: 「値が無いところです」と「n<30 は点を打っていません」が食い違っていた） */
  const gapNote = /<svg [^>]*data-gap="1"/.test(body) && !/data-gapwhy="1"/.test(legend || "")
    ? '<i class="full">線が途切れているところは、その月の値が無いところです（0 ではありません）。</i>' : "";
  const noneNote = /<svg [^>]*data-none="1"/.test(body)
    ? lg("none", C.ghost, "灰色の短い線＝その月の記録が無い（0 の棒ではありません）") : "";
  /* 重なる線をずらして描いた（svgLine の data-shift）。ずらしたことを黙らない */
  const shiftM = /<svg [^>]*data-shift="(1|edge)"/.exec(body);
  const shiftNote = shiftM
    ? '<i class="full">同じ月に同じ値の線は重なって隠れるので、どの線も見えるよう上下に少し（4px ずつ）ずらして描いています。値は変えていません。' +
      /* 軸の端（0・いちばん上）では片側にしかずらせない。0 の線が 0 より上に見えるので、それも断る。
         🔴 2026-09-24 検証: 上端（軸の最大）で重なった線は下へずらすのに、断りは 0 のことしか書いていなかった */
      (shiftM[1] === "edge" ? "軸の端（0 やいちばん上）で重なった線は、軸の内側へずらしているので、0 の線も軸より少し上に、いちばん上の線は少し下に見えます。" : "") +
      /* ずらすのは重なった月の点だけ。前後の月との間の線が傾いて、値が動いたように見えることを断る */
      "ずらすのは重なった月の点だけなので、その前後の線が少し傾いて見えることがあります。" +
      /* 本当の値の在りかは、ホバー（title）だけでなくタップで開ける「数字で読む」も言う（段2 M-11。タッチでは title が出ない）。
         吹き出しは PC だけの話なので .pconly に入れる（段1レビュー F。タッチでは「図の下の「数字で読む」」だけが読める） */
      '本当の値は<span class="pconly">点の吹き出しと、</span>図の下の「数字で読む」にあります。</i>' : "";
  /* 箱ひげの印（svgBoxH の marks）。◇ と途切れの印は呼び出し側の凡例に無かった（ループ4, 2026-09-24 実機） */
  const boxNote = (/<svg [^>]*data-mean="1"/.test(body) ? lg("mean", C.ink3, "平均（中央値とずれるほど、裾に大きな値がある）") : "") +
    (/<svg [^>]*data-boxmax="1"/.test(body) ? lg("boxmax", C.ink3, "最大値（ひげの先より外。印は本当の位置）") : "") +
    (/<svg [^>]*data-boxout="1"/.test(body) ? lg("boxout", C.ink3, "最大値が軸の右の外（軸の端で切っています。値は「最大 N（軸の外）」の文字）") : "");
  /* 箱ひげの印は、呼び出し側の「四分位 / 中央値」の粒のすぐ後ろ（最初の1行まるごとの注記 i.full の手前）に置く。
     🔴 2026-09-24 検証（385px / 1440px, outcome「応募数 ÷ 掲載数」・renewal「応募数の散らばり」）: 前は凡例の最後に
     つないでいて、「四分位 / 中央値」→ 説明の段落2つ →「◇ 平均」「// 軸の外」と、段落をはさんで離れていた */
  legend = legend || "";
  const para = legend.indexOf('<i class="full"');
  legend = (para > 0 ? legend.slice(0, para) + boxNote + legend.slice(para) : legend + boxNote) +
    noneNote + gapNote + shiftNote;
  /* 図の数値の一覧（段2 M-11）。読み上げ用（ul.sr）と、タップで開ける「数字で読む」の畳みに同じ一覧を出す */
  const say = figSay(body, legend);
  const sayHtml = say.n
    ? '<ul class="sr">' + say.li + "</ul>" +
      '<details class="fold figsay"><summary>数字で読む（' + num(say.n) + " 件）</summary><ul>" + say.li + "</ul></details>"
    : "";
  return `<figure class="fig"><figcaption>${esc(caption)}` +
    (hint ? `<span class="hint">${keepNum(hint)}</span>` : "") + `</figcaption>` +
    (scroll ? `<div class="figscroll" style="--minw:${Math.ceil(minW)}px">← 図を横にスクロールできます →</div>` : "") +
    /* 🔴 横にスクロールする枠は Tab で止まれるようにする（キーボードの矢印で動かせる）。
       tabindex が無いと、枠に自動でフォーカスが当たるブラウザでしか動かせなかった（2026-09-23 検証）。
       🔴 2026-09-23 レビュー F1: 前は minW > 330 だけで tabindex と「横にスクロールできる枠」の名前を
       付けていたので、1440px で横に動かない図まで全部 Tab で止まっていた。ここでは候補の印（data-cap）だけ
       付け、描いた後・窓の幅が変わったときに markFig が実際のはみ出しを測って付け外しする */
    (scroll ? `<div class="figbody" data-cap="${esc(caption)}">`
            : `<div class="figbody">`) + `${body}</div>` + sayHtml +
    (fulls.length ? `<details class="fold figfull"><summary>省略した名前の全文（${fulls.length} 件）</summary>` +
                    `<ul>${fulls.join("")}</ul></details>` : "") +
    (legend ? `<div class="figlegend">${legend}</div>` : "") + `</figure>`;
}
/* 図の数値を読み上げとタップに届く形にする（段2 M-11）。
   🔴 図の部品（svgBarH / svgLine / svgStack / svgBoxH …13 種）は値を <title>（マウスの吹き出し）にしか書かず、SVG は
   role="img" aria-label="見出し" なので中の値が読み上げに出ず、タッチでは吹き出しも出なかった（2026-09-28 診断: 実機で SVG 224 個）。
   部品が書いた <title> をそのまま一覧にする（部品の側は変えない。値の書き方は吹き出しと同じ）。
   - 省略したラベルの全文（labText の <text> の title）は、別の畳み「省略した名前の全文」にあるので混ぜない
   - 折れ線・散布図の点（circle）は title に系列の名前が無い。凡例の粒（lg）の色から名前を引いて頭に添え、系列ごとに 1 行にまとめる
     （同じ色に 2 つの名前があるときは引かない）。同じ文が続く点（svgDots の群）は「×N」にまとめる
   - 帯を縦に積む図（svgStackLanes）・時間軸の図（svgTimeline）は、系列の名前が凡例ではなく左のラベル（data-lane の <text>）にある。
     直前の行ラベルの名前を値の頭に付ける。🔴 2026-09-29 検証（fixture deal/series）: 前は「25-09: 19 || 25-09: 3 || 25-09: 1」と
     名前の無い月と値だけが並び、応募・面接・採用のどれか分からなかった
   - 前の値（svgBarH の中空の棒「前回: 」、法人番号で見る図の「月割り: 」）は、直前の棒の行に括弧で添える。
     独立した行にすると、どの行の前回か分からなかった（2026-09-29 検証「初回: 58.1% / n=1,650 || 前回: 46.8%」）
   - 重なった点をずらした断り（「/ 重なるので上へ 4px ずらして表示」）は描き方の話で数値ではないので、一覧からは除く（吹き出しには残す）
   返り値: { n: 行数, li: <li> の並び }。title が無い図（値の無い .empty など）は n=0 */
function figSay(body, legend) {
  const s = String(body);
  if (s.indexOf("<title>") < 0) return { n: 0, li: "" };
  const names = {};
  for (const m of String(legend || "").matchAll(/<i><svg [^>]*>([\s\S]*?)<\/svg>([\s\S]*?)<\/i>/g)) {
    const cols = [...m[1].matchAll(/(?:fill|stroke):([^;"]+)/g)].map((x) => x[1]).filter((c) => c !== "var(--panel)");
    const label = m[2].replace(/<[^>]*>/g, "").replace(/\s+/g, " ").trim();
    if (!cols.length || !label) continue;
    names[cols[0]] = names[cols[0]] === undefined || names[cols[0]] === label ? label : null;
  }

  });

}

    /* 中空・実線の丸。散布図の p.open（outcome の「契約開始日が空」）と同じ描き方。破線の ring（未確定）とは分ける */

    up / down = 点から枠の上端・下端（軸）までの余り。候補 0, -step, +step, -2step, +2step, … のうち
    枠の中に収まるものだけを数えて r 番目を返すので、r が違えば必ず別の位置になる。
    枠の外に出る候補を飛ばした（＝軸の端で片側にだけ積んだ）とき、または点が枠の端（軸の 0・上端）に
    あってずらしたときは onEdge() を呼ぶ。
    🔴 2026-09-24 検証: 前は「飛ばした候補がある」ときだけ呼んでいた。0 で重なった線が2本だけだと、
    2本目（r=1）の候補 -4 は上に収まるので飛ばさず、0 の線が軸より 4px 上に描かれるのに
    凡例に「0 の線も軸より少し上に見えます」が出なかった（series の「面接と採用がどちらも 0 の月」） */
function lineShift(r, up, down, step, onEdge) {
  let seen = 0, skipped = false;
  const atEdge = up <= .5 || down <= .5;
  for (let k = 1; k < 4 * r + 4; k++) {
    const d = (k % 2 === 1 ? -1 : 1) * Math.ceil(k / 2) * step;
    if (-d > up + .5 || d > down + .5) { skipped = true; continue; }
    if (++seen === r) { if ((skipped || atEdge) && onEdge) onEdge(); return d; }
  }
  /* 上下どちらにも収まらない（枠の高さが足りない）。ずらさずに重ねる */
  return 0;

      /* ずらした点は、ずらしたこと・向き・幅を title に書く（値は変えていない。凡例の断りと同じ） */
      const dy = offs[si][i];
      const sh = dy ? ` / 重なるので${dy < 0 ? "上" : "下"}へ ${Math.abs(dy)}px ずらして表示` : "";
      const t = `<title>${esc(o.x[i])}${sub}: ${esc(fmt(p.v))}${p.note ? " / " + esc(p.note) : ""}${p.censored ? " / 未確定" : ""}${sh}</title>`;
      const shA = dy ? ` data-shifted="${dy}"` : "";
      g += (p.censored || p.carry)
        ? `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.6"${shA} style="fill:var(--panel);stroke:${col}" stroke-width="2" stroke-dasharray="2.4 2">${t}</circle>`
        : `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4.2"${shA} style="fill:${col}">${t}</circle>`;
      if (o.labelPts && n <= 14 && !p.carry) {
        const flip = y < pad.t + 18;
        /* 🔴 端の点のラベルを中央ぞろえにすると、縦軸の目盛りに重なって両方読めなくなる。
           左端は左ぞろえ、右端は右ぞろえにして、必ず描画領域の内側に収める。 */
        const anc = i === 0 ? "start" : i === n - 1 ? "end" : "middle";
        const lx = i === 0 ? x - 2 : i === n - 1 ? x + 2 : x;
        g += `<text class="vl" x="${lx.toFixed(1)}" y="${(flip ? y + 16 : y - 9).toFixed(1)}" text-anchor="${anc}">${esc(fmt(p.v))}</text>`;
        if (p.note) g += `<text class="ax" x="${lx.toFixed(1)}" y="${(flip ? y + 26 : y - 20).toFixed(1)}" text-anchor="${anc}">${esc(p.note)}</text>`;
      }
    });
  });
  /* 横にスクロールするとき、開いた直後の位置を最初にデータがある月に合わせる（figToData） */
  let first = n;
  o.series.forEach((s) => s.pts.forEach((p, i) => { if (p && p.v != null && i < first) first = i; }));
  const x0 = first < n ? X(first) - 30 : 0;
  /* 開いた直後は最新の側（値がある最後の月と、その右の余白）を右端に見せる（figToData の data-xr。x0 より優先）。
     🔴 2026-09-24 実機（ループ4, renewal の月次の継続率）: 開いた直後が古い側で、右端の 26 年が奥にあった */
  let last = -1;
  o.series.forEach((s) => s.pts.forEach((p, i) => { if (p && p.v != null && i > last) last = i; }));
  const xr = last >= 0 ? Math.min(w, X(last) + pad.r) : 0;
  const svg = svgHead(w, h, o.alt || o.yLab || "折れ線",
    { gap: gapped, shift: shiftedEdge ? "edge" : shifted, fk: slot.k, x0, xr, fit: !!o.fit }) + `${g}</svg>`;
  /* 枠より広く描いて（横スクロール）、開いた直後の位置をデータのある側へ動かす図は、縦軸の目盛りも
     一緒に流れて見えなくなる。そのときだけ目盛りを左に貼り付ける（stickyLabels。帯を縦に積む図と同じ）。
     x0 は貼り付けた目盛りの欄のぶん手前にする */
  if (slot.avail && slot.avail < w * .92 && (x0 * .92 > slot.avail * .5 || xr * .92 > slot.avail))
    return stickyLabels(w, stickW(pad.l, o.yLab), pad.t + ih + 4, yl,
      svg.replace(`data-x0="${Math.round(x0)}"`, `data-x0="${Math.round(Math.max(1, x0 - pad.l))}"`), pad.l - 2);
  return svg;
}

/* -------------------------------------------------------------- 箱ひげ図 */
/** 狭い枠で描くときに、箱を描く欄として最低限残す幅（これより狭くなるなら狭めずに横スクロール） */
const BOX_MIN_IW = 150;
/** 狭い枠でラベル欄を詰めるときの下限（これより狭くなるなら詰めずに横スクロール） */
const BOX_MIN_LAB = 72;
/** ばらつきを見る。中央値だけでは分からない「幅」を出す */
function svgBoxH(o) {
  const rows = o.rows.filter(r => r && r.med != null);
  if (!rows.length) return `<div class="empty">出せる行がありません。</div>`;
  const slot = figSlot();
  const rh = o.rh || 27;
  const fmt = o.xFmt || F.int;
  /* 🔴 最大値までひげを伸ばすと、外れ値のせいで箱が1本の線に潰れて読めない。
     Tukey の内境界 (q3 + 1.5×四分位範囲) でひげを止める。 */
  rows.forEach(r => {
    const iqr = r.q3 - r.q1;
    r._wl = Math.max(r.min, r.q1 - 1.5 * iqr);
    r._wh = Math.min(r.max, r.q3 + 1.5 * iqr);
    r._over = r.max > r._wh + 1e-9;
  });
  /* 🔴 軸の上限は「読める行」だけから決める。n=2 の行のばらつきに軸を合わせると、
     n=973 の行が1本の線に潰れて何も読めなくなる。
     はみ出した行は軸の端で止めて印を出す（隠してはいない）。 */
  const base = rows.filter(r => !r.dim);
  let hi = 0;
  (base.length ? base : rows).forEach(r => { hi = Math.max(hi, r._wh, r.med); });
  /* 軸の右端を目盛りに合わせる（coverTicks）。端が目盛りの途中だと、軸の外の印（//）がどこにあるのか読みにくい。
     🔴 2026-09-24 検証（1440px, rampup「初回MTGまでの日数の散らばり」）: 刻み 50 のまま 1段足すと、ひげの先 約100 の軸が
     0〜150 になり、箱とひげが図の左 2/3 に縮んだ。目盛りを細かくしても字が詰まらない幅（広い枠）なら、
     刻みを細かくした中から軸の端がいちばん手前で止まるもの（0〜120）を選ぶ */
  const nColW = Math.max(...rows.map(q => textW("n=" + q.n)));
  /* ラベル欄の上限。🔴 2026-09-24 実機（ループ5, 1440px, outcome「応募数 ÷ 掲載数」）: 上限 120px のままだと、
     枠が 1,000px を超えていても「充足（採れて終わった）」（約 140px）が「充足（採…わった）」と省略された。
     ラベル欄を 210px（横棒と同じ）まで取っても箱の欄が BOX_MIN_IW 残る広い枠では、省略しない幅を取る。
     枠が分からない1回目と狭い枠は 120px のまま（狭い枠は下で詰めて2行に折り返す。その動きは変えない） */
  const labCap = slot.avail && slot.avail >= labW(rows, 210) + Math.max(64, Math.ceil(nColW + 40)) + BOX_MIN_IW ? 210 : 120;
  const w0Est = slot.avail ? Math.min(slot.avail, Math.max(o.w || 680, FIT_MAX)) : (o.w || 680);
  const iwEst = w0Est - (o.padL || labW(rows, labCap)) - Math.max(64, Math.ceil(nColW + 40));
  let tk = null;
  [4, 6, 8].forEach((want) => {
    const t = coverTicks(ticks(0, hi, want, minStepOf(fmt)), hi);
    const roomy = iwEst / Math.max(1, t.length - 1) >= textW(fmt(t[t.length - 1])) + 16;
    if (!tk || (roomy && t[t.length - 1] < tk[tk.length - 1] - 1e-9)) tk = t;
  });
  hi = Math.max(hi, tk[tk.length - 1]);
  /* 最大値が軸の外にある行（箱は軸に収まる）。
     🔴 2026-09-24 実機（ループ4, renewal の採用数・応募数）: 前は「▶ 最大 491」をひげの先（軸の途中）に
     置いていて、そこが最大値の位置に見えた。いまは ひげを軸の右端まで伸ばして端に途切れの印（//）と
     矢印を置き、文字は「最大 491（軸の外）」としてひげの下の行に書く（行の高さを 12px 足す）。
     右端の「n=」と続けて読めないよう、n= の欄との間を空ける（pad.r） */
  const outOf = (r) => r.q3 <= hi + 1e-9 && r.max > hi + 1e-9;
  const padR = rows.some(outOf) ? Math.max(64, Math.ceil(nColW + 40)) : 64;
  /* 枠に合わせる（paintFigs）。🔴 400px で「最大 N」と n= が右端（横スクロールの奥）にあり、
     開いた直後に見えなかった（2026-09-24 実機, renewal）。箱を描く欄が BOX_MIN_IW 残るなら枠の幅で描く。
     🔴 2026-09-24 実機（ループ4, outcome の応募効率）: 枠が 319px（縦のスクロールバーのぶん狭い）だと
     ラベル欄 120 + 右の欄 64 + 箱の欄 150 に届かず、680px のまま横スクロールになって「充足」の箱と n= が
     奥に隠れた。届かないときはラベル欄を詰め（BOX_MIN_LAB まで）、入らないラベルは2行に折り返す */
  let padL = o.padL || labW(rows, labCap), narrow = false;
  const w0 = o.w || 680;
  let w = w0;
  if (slot.avail) {
    if (slot.avail >= padL + padR + BOX_MIN_IW) w = Math.min(slot.avail, Math.max(w0, FIT_MAX));
    else if (!o.padL && slot.avail - padR - BOX_MIN_IW >= BOX_MIN_LAB) {
      padL = slot.avail - padR - BOX_MIN_IW; w = slot.avail; narrow = true;
    }
  }
  const pad = { l: padL, r: padR, t: 22, b: 26 };
  const labLines = rows.map(r => (narrow ? labWrap(r.label, pad.l - 12) : null));
  const rowH = rows.map((r, i) => Math.max(labLines[i] ? 32 : 0, rh + (outOf(r) ? 12 : 0)));
  const rowTop = []; rowH.reduce((a, hh, i) => (rowTop[i] = a, a + hh), pad.t);
  const h = pad.t + pad.b + rowH.reduce((a, b) => a + b, 0);
  const iw = w - pad.l - pad.r;
  const cl = v => Math.max(0, Math.min(v, hi));
  const X = v => pad.l + iw * cl(v) / (hi || 1);
  const marks = { fk: slot.k };
  let g = "";
  tk.forEach(t => {
    g += `<line class="gridline" x1="${X(t).toFixed(1)}" y1="${pad.t - 6}" x2="${X(t).toFixed(1)}" y2="${h - pad.b + 2}"/>` +
         `<text class="ax" x="${X(t).toFixed(1)}" y="${h - pad.b + 15}" text-anchor="middle">${esc(fmt(t))}</text>`;
  });
  if (o.xLab) g += `<text class="ax" x="${w - pad.r}" y="${pad.t - 10}" text-anchor="end">${esc(o.xLab)}</text>`;
  rows.forEach((r, i) => {
    const y = rowTop[i] + rh / 2, bh = Math.min(15, rh - 10);
    const col = r.color || C.ai;
    const dim = r.dim ? ` opacity=".5"` : "";
    g += `<g${dim}>`;
    g += labText(pad.l - 9, (y + 4).toFixed(1), r.label, pad.l - 12, "", r.full, labLines[i]);
    /* 🔴 箱が軸に収まらない行は、潰れた箱を描かない。
       軸いっぱいに伸びた箱は「ばらつきが大きい」ではなく「はみ出した」だけで、嘘になる。
       位置だけ印で示し、値は文字で出す。 */
    if (r.q3 > hi + 1e-9) {
      const xm = X(r.med);
      g += `<line x1="${xm.toFixed(1)}" y1="${(y - bh / 2).toFixed(1)}" x2="${xm.toFixed(1)}" y2="${(y + bh / 2).toFixed(1)}" style="stroke:${col}" stroke-width="2.4"/>` +
           `<path d="M${(xm + 5).toFixed(1)} ${(y - 3.2).toFixed(1)}l4.4 3.2-4.4 3.2z" style="fill:${col}" opacity=".7"/>` +
           `<text class="ax" x="${Math.min(xm + 13, w - 150).toFixed(1)}" y="${(y + 3.5).toFixed(1)}" style="fill:var(--ink-3)">四分位 ${esc(fmt(r.q1))}–${esc(fmt(r.q3))}（軸外）</text>` +
           `<title>${esc(r.label)}: 中央値 ${esc(fmt(r.med))} / 四分位 ${esc(fmt(r.q1))}–${esc(fmt(r.q3))} / n=${r.n}。ばらつきが軸に収まらないため箱は描いていません</title>` +
           `<text class="ax" x="${w - 4}" y="${(y + 4).toFixed(1)}" text-anchor="end">n=${esc(String(r.n))}</text></g>`;
      return;
    }
    /* ひげ（Tukey の内境界まで。軸の外に出るところは軸の右端で止める。軸の端では止めの縦線を描かない） */
    const whEnd = X(r._wh);
    g += `<line x1="${X(r._wl).toFixed(1)}" y1="${y.toFixed(1)}" x2="${whEnd.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:${col}" stroke-width="1" opacity=".55"/>`;
    [X(r._wl)].concat(r._wh <= hi + 1e-9 ? [whEnd] : []).forEach(xv =>
      g += `<line x1="${xv.toFixed(1)}" y1="${(y - 4).toFixed(1)}" x2="${xv.toFixed(1)}" y2="${(y + 4).toFixed(1)}" style="stroke:${col}" stroke-width="1" opacity=".55"/>`);
    if (outOf(r)) {
      /* 最大値が軸の外。ひげの先から軸の右端までを細い線でつなぎ、端に途切れの印（//）と矢印を置く */
      const xa = X(hi);
      marks.boxout = true;
      if (r._wh < hi - 1e-9)
        g += `<line x1="${whEnd.toFixed(1)}" y1="${y.toFixed(1)}" x2="${xa.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:${col}" stroke-width="1" opacity=".3"/>`;
      const t = "最大 " + fmt(r.max) + "（軸の外）";
      const tx = Math.max(pad.l + textW(t), xa + 14);
      g += `<path data-boxout="1" d="M${(xa + 1).toFixed(1)} ${(y + 4.5).toFixed(1)}l3-9M${(xa + 4.5).toFixed(1)} ${(y + 4.5).toFixed(1)}l3-9" style="stroke:${col}" stroke-width="1.3"/>` +
           `<path d="M${(xa + 9).toFixed(1)} ${(y - 3.2).toFixed(1)}l4.4 3.2-4.4 3.2z" style="fill:${col}" opacity=".7"/>` +
           `<text class="ax" x="${tx.toFixed(1)}" y="${(y + bh / 2 + 11).toFixed(1)}" text-anchor="end" style="fill:var(--ink-3)">${esc(t)}</text>`;
    } else if (r._over) {
      /* ひげの先より外にある最大値（軸の中）。本当の位置に中空の小さな丸を置く */
      marks.boxmax = true;
      g += `<circle data-boxmax="1" cx="${X(r.max).toFixed(1)}" cy="${y.toFixed(1)}" r="2.6" style="fill:var(--panel);stroke:${col}" stroke-width="1.2"><title>最大 ${esc(fmt(r.max))}</title></circle>`;
    }
    // 箱
    g += `<rect x="${X(r.q1).toFixed(1)}" y="${(y - bh / 2).toFixed(1)}" width="${Math.max(1.5, X(r.q3) - X(r.q1)).toFixed(1)}" height="${bh}" rx="2" style="fill:${col}" opacity=".26"/>` +
         `<rect x="${X(r.q1).toFixed(1)}" y="${(y - bh / 2).toFixed(1)}" width="${Math.max(1.5, X(r.q3) - X(r.q1)).toFixed(1)}" height="${bh}" rx="2" fill="none" style="stroke:${col}" stroke-width="1"/>`;
    // 中央値
    g += `<line x1="${X(r.med).toFixed(1)}" y1="${(y - bh / 2 - 2).toFixed(1)}" x2="${X(r.med).toFixed(1)}" y2="${(y + bh / 2 + 2).toFixed(1)}" style="stroke:${col}" stroke-width="2.6"/>`;
    // 平均（中央値とずれる＝裾が重い、が見えるように）。◇ の意味は fig() が凡例に足す（data-mean）
    if (r.mean != null) {
      marks.mean = true;
      g += `<path d="M${X(r.mean).toFixed(1)} ${(y - 3.4).toFixed(1)}l3.4 3.4-3.4 3.4-3.4-3.4z" style="fill:var(--panel);stroke:${col}" stroke-width="1.2"/>`;
    }
    g += `<title>${esc(r.label)}: 中央値 ${esc(fmt(r.med))} / 四分位 ${esc(fmt(r.q1))}–${esc(fmt(r.q3))} / 最小 ${esc(fmt(r.min))} 最大 ${esc(fmt(r.max))}${r.mean != null ? " / 平均 " + esc(fmt(r.mean)) : ""} / n=${r.n}</title>`;
    g += `<text class="ax" x="${w - 4}" y="${(y + 4).toFixed(1)}" text-anchor="end">n=${esc(String(r.n))}</text>`;
    g += `</g>`;
  });
  return svgHead(w, h, o.alt || "箱ひげ図", marks) + `${g}</svg>`;
}

/* ---------------------------------------------------------------- 横棒 */
/** 大小を一目で。diverging を立てると 0 を中心に左右へ伸ばす */
function svgBarH(o) {
  const rows = o.rows || [];
  if (!rows.length) return `<div class="empty">出せる行がありません。</div>`;
  const slot = figSlot();
  const w0 = o.w || 660, rh = o.rh || 24;
  /* 🔴 ラベル欄と注記欄は文字幅から決める。固定値にするとラベルが切れ、値と注記が重なる。
     値ラベル（棒の先に出る文字）のぶんも必ず空けておく。
     🔴 前は注記を全部全角（1字 10.6px）と数えていて、「33/125 か月　案件28」のような
     半角の多い注記で右の欄が広がりすぎ、率と母数が棒から約 200px 離れていた（team, 2026-09-23 実機） */
  const noteW = Math.max(0, ...rows.map(r => textW(r.note || "")));
  const valW = Math.max(0, ...rows.map(r => textW(r.txt || "") * 1.06)) + 14;
  const padL0 = o.padL || labW(rows, 210);
  const padR0 = o.padR || Math.ceil(noteW + valW + 10);
  /* 枠に合わせる（paintFigs）。
     🔴 2026-09-24 実機（400px）: 棒の先の値（解約率 58.1%）・注記（n=・「解約・充足 100%」）が
     横スクロールの奥にあり、開いた直後に見えなかった。
     - 棒の欄が 160px 残るなら、枠の幅でそのまま描く（広い枠では広げる）
     - 残らない狭い枠では、注記を棒の下の行に回し（compact）、値の欄だけを右に残して枠の幅に収める。
       それでも棒の欄が BAR_MIN_IW 残らないときだけ、これまでどおり横スクロール */
  let w = w0, compact = false, padL = padL0;
  if (slot.avail) {
    if (slot.avail >= padL0 + 160 + padR0 || slot.avail > w0) w = Math.min(slot.avail, Math.max(w0, FIT_MAX));
    else if (slot.avail < w0 * .92) {
      const pl = o.padL || Math.min(padL0, Math.round(slot.avail * .36));
      if (slot.avail - pl - valW - 4 >= BAR_MIN_IW) { compact = true; w = slot.avail; padL = pl; }
    }
  }
  /* 🔴 右の欄の上限を「棒の欄を 160px 残すところまで」にする。前の上限 max(320, w×.5) では、
     長い注記（「63/65 か月　案件22　担当交代あり 2 回（直近 2026-08）」, 幅 326px）で欄が足りず、
     注記を右端に寄せた位置が値ラベル（96.9%）の上に重なっていた（2026-09-23 検証, w=720） */
  /* 軸の題名（xLab）を出すときは、目盛りの下にもう1段空ける。
     🔴 2026-09-24（ループ4）: 呼び出し側は「採用単価（万円）」を渡していたのに、この部品が xLab を描かず
     軸に単位が出ていなかった（houjin の3つの出し方・事業所どうし、focus の採用単価） */
  const pad = { l: padL, t: 8, b: o.xLab ? 36 : 22,
                r: compact ? Math.ceil(valW + 4)
                           : o.padR || Math.max(0, Math.min(w - padL - 160, padR0)) };
  const iw = Math.max(60, w - pad.l - pad.r);
  /* 注記は右端ぞろえにせず、値ラベルの欄のすぐ右に左ぞろえで並べる。
     棒が短い行は値ラベルから注記まで細い線でつなぎ、どの行の注記か目で追えるようにする。
     🔴 つなぐ線は**実線**（薄い色）。このダッシュボードでは破線・点線は「未確定・持ち越し」の意味なので、
     点線にすると短い棒の行が未確定に見える（2026-09-23 検証。前は stroke-dasharray="1 3"） */
  let xNote = Math.max(pad.l + iw + 4, Math.min(pad.l + iw + valW, w - 2 - noteW));
  /* 🔴 2026-09-25 本番実測（担当の交代「交代ごとの接触の変化」）: 右の欄が注記より狭いと、注記が SVG の右端から
     はみ出して切れていた（1440px で SVG 幅 1104 に対し右端 1117〜1131、400px でも 21 か所）。
     右の欄に入らない注記は、値の欄の右（xFull）から右端までの幅で折り返す。その幅が NOTE_MIN_W に満たないときは、
     その行の注記を棒の下の行に回す（compact と同じ置き方）。入る注記しか無い図は、これまでと同じ描き方 */
  const xFull = pad.l + iw + valW;
  const over = !compact && rows.some(r => r.note && xNote + textW(r.note) > w - 2);
  const wrapRight = over && w - 2 - xFull >= NOTE_MIN_W;
  if (wrapRight) xNote = xFull;
  const under = rows.map(r => compact || (over && !wrapRight && !!r.note && xNote + textW(r.note) > w - 2));

         棒の左に置くと、ラベル欄（左の交代日と案件名）に重なっていた。ラベル欄にかかるときは 0 の線の右に置く */
      /* 🔴 2026-09-24 検証（1440px）: 棒の左に 90px ほど空いているのに「−7.00 減った」だけが 0 の線の右に出て、
         ほかの負の値（棒の左）と置き方が揃わなかった。判定に余裕をとりすぎていた（幅の見積もり ×1.06 と、
         ラベル欄の右端＝pad.l − 9 ではなく pad.l + 2 で比べていた）。

      const right = X(r.v) >= x0 || X(r.v) - 6 - textW(r.txt || fmt(r.v)) < pad.l - 4;
      const tx = X(r.v) >= x0 ? X(r.v) + 6 : right ? x0 + 6 : X(r.v) - 6;

    その語だけの1行として幅を超えたまま出していた。空白の無い日本語の注記（「進捗帯「後半にさしかかり

  const parts0 = [];

     括弧の途中で折れていた。開いた括弧が閉じるまでの語は1つの語として扱う（それでも幅を超えれば下で字の境目で切る） */

    while (textW(cur.replace(/[ 　]+$/, "")) > maxW) {

      for (let j = k; j > 1; j--) {

        if (NO_TAIL.test(ch[j]) && textW(ch.slice(0, j).join("").replace(/[ 　]+$/, "")) > 0) { k = j; break; }
