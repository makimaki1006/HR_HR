      : tooFew(lt ? lt.n : 0, "LTV"),
    lg("box", C.ai, "四分位") + lg("line", C.ink, "中央値") +
    '<i class="full">法人 ' + num(sh.n_all) + "（表示対象 " + num(sh.n_display) +
    "）／ 拠点が2つ以上ある法人 " + num(sh.multi_site) + "。" + esc(sh.multi_site_note) + "</i>");

  return h + foot(D.meta);
}

function foot(meta) {
  return '<div class="note info"><span class="hd">この画面で数えていないもの</span><p>' +
    esc(meta.not_counted || "") +
    (meta.today ? "<br>基準日 " + esc(meta.today) : "") +
    (meta.n_deals ? "　取引 " + num(meta.n_deals) + " 件" : "") +
    (meta.n_active ? "（稼働中 " + num(meta.n_active) + " 件）" : "") + "</p></div>";
}

/* ================================================================ 2 継続回数 × 成果 */
function renderRenewal(D) {
  const mr = D.monthly_retention, br = D.by_renewal;
  const label = (r) => (r.renewal_no === 0 ? "初回" : "継続" + r.renewal_no);
  const big = br.filter((r) => r.n >= MIN_N);
  let h = sec("問い", "継続を重ねると、成果は落ちるのか");

  h += sec("図", "月次の継続率（満了月ベース・本体契約のみ）");
  h += fig("継続率 ＝ 継続済 ÷（継続済 ＋ 解約 ＋ 充足）",
    "<b>充足も分母に入れています</b>",
    svgLine({ w: 680, h: 240, labelPts: true,
      x: mr.rows.map((r) => r.month.slice(2)),
      xSub: mr.rows.map((r) => "n=" + r.denom),
      series: [{ color: C.ai, pts: mr.rows.map((r) => ({
        v: r.rate == null ? null : r.rate / 100,
        censored: r.pending > 5 })) }],
      yFmt: F.pct, yLab: "継続率", alt: "月次の継続率" }),
    lg("dot", C.ai, "確定した月") + lg("ring", C.ai, "結果待ちが多い月") +
    '<i class="full">充足（採れて終わった契約）も分母に入れます。採用できて終わったのも' +
    "「継続しなかった」という結果だからです。オプション契約 " + num(mr.excluded_option) +
    " 件は母数から外しています（月ごとの偏りが大きく、含めると月次比較が歪むため）。</i>");

  h += sec("表", "満了月ごとの内訳");
  h += table([{ t: "満了月" }, { t: "継続", n: 1 }, { t: "解約", n: 1 }, { t: "充足", n: 1 },
              { t: "母数", n: 1 }, { t: "継続率", n: 1 }, { t: "結果待ち", n: 1 }],
    mr.rows.map((r) => [esc(r.month), num(r.keep), num(r.cancel), num(r.fill),
      num(r.denom), "<b>" + pct1(r.rate) + "</b>", num(r.pending)]));

  h += sec("図", "継続回数ごとの解約率");
  h += fig("分子は「解約 ＋ 充足」", "初回を乗り切れれば、あとは残ります",
    svgBarH({ w: 660, fmt: F.d1, rh: 26,
      rows: big.map((r) => ({
        label: label(r), v: r.cancel_rate, v0: r.cancel_rate_excl_fill,
        txt: pct1(r.cancel_rate), note: "n=" + num(r.n),
        color: r.cancel_rate >= 40 ? C.hi : C.ai })) }),
    lg("box", C.hi, "40%以上") + lg("box", C.ai, "40%未満") +
    lg("dash", C.ghost, "充足を外すと") +
    '<i class="full">n が ' + MIN_N + " 件未満の継続回数は図に載せていません（下の表には出しています）。" +
    "上の「月次の継続率」とは分母が違います。あちらは満了して結果が出た契約だけ、" +
    "こちらはその継続回数の全取引（稼働中も含む）です。</i>");

  h += sec("図", "継続回数ごとの成果のばらつき");
  for (const [key, name, fmt] of [["oubo", "応募数", F.int], ["syoudaku", "採用数", F.int],
                                  ["oubo_per_posting", "求人票あたり応募", F.d1]]) {
    const rows = big.filter((r) => r[key] && r[key].n >= MIN_N).map((r, i) => ({
      label: label(r), med: r[key].median, q1: r[key].q1, q3: r[key].q3,
      min: r[key].min, max: r[key].max, mean: r[key].mean, n: r[key].n,
      color: SERIES[i % 5] }));
    h += fig(name + "の散らばり（継続回数ごと）",
      "中央値だけでは分からない「幅」を出す",
      rows.length ? svgBoxH({ w: 680, xFmt: fmt, rows: rows })
                  : tooFew(0, name),
      lg("line", C.ink, "中央値") +
      '<i class="full">n は値が入っている契約の数で、件数そのものではありません。' +
      (D.meta.exclude_right_censored
        ? "右側打ち切りを外しています。"
        : "右側打ち切り " + num(D.meta.right_censored_n) +
          " 件を含んでいます（直近の契約は結果が確定しておらず、成果が低く出ます）。") + "</i>");
  }

  h += sec("表", "継続回数ごとの代表値");
  h += table([{ t: "継続回数" }, { t: "件数", n: 1 }, { t: "稼働中", n: 1 },
              { t: "解約率", n: 1 }, { t: "（充足を外すと）", n: 1 },
              { t: "応募数", n: 1 }, { t: "面接数", n: 1 }, { t: "承諾数", n: 1 },
              { t: "求人票あたり応募", n: 1 }, { t: "契約額", n: 1 }],
    br.map((r) => [label(r), num(r.n), num(r.n_active),
      "<b>" + pct1(r.cancel_rate) + "</b>",
      '<span class="muted">' + pct1(r.cancel_rate_excl_fill) + "</span>",
      med(r.oubo), med(r.mensetu), med(r.syoudaku), med(r.oubo_per_posting, 1),
      med(r.amount, 0, 1)]));

  h += sec("図", "欠測の偏り");
  const groups = ["継続済", "解約", "充足", "結果待ち"];
  const fields = [...new Set(D.missingness.map((r) => r.field))];
  h += fig("結果ごとの記入率", "色が濃いほど埋まっている",
    svgMatrix({ padL: 150, cw: 120, cols: groups,
      rows: fields.map((f) => ({ label: f, cells: groups.map((g) => {
        const r = D.missingness.find((x) => x.group === g && x.field === f);
        if (!r || r.fill_rate == null) return { v: null, txt: "—", n: 0 };
        return { v: r.fill_rate / 100, txt: pct1(r.fill_rate), n: r.filled, color: C.ai };
      }) })) }),
    '<i class="full">うまくいかなかった契約ほど数字が記録されていない可能性があります。</i>');
  h += note("bad", "この偏りは相関を押し上げる方向に効きます",
    "「継続するほど成果が良い」という見え方が強く出ます。上の図を読むときは踏まえてください。");
  return h + foot(D.meta);
}

function med(o, d, isMan) {
  if (!o || !o.n) return DASH;
  return (isMan ? yen(o.median) : num(o.median, d || 0)) +
    ' <span class="muted small">(n=' + num(o.n) + ")</span>";
}

/* ================================================================ 3 顧客詳細 */
/* 🔴 描画中に DOM を触らない。返した HTML が差し込まれるのは render の**後**なので、
   ここで $("#cs-houjin") を引いても null になる（実際にそれで③が落ちた）。
   一覧は持っておいて、差し込んだ後の wire() で流し込む。 */
let customerIndex = null;
let customerHoujin = "";
let customerReason = "";
/* 法人を選んでいないときの入口。①の「継続を追いかける」「法人番号で見る」で共通 */
function custIndex(D, question, lede) {
  customerIndex = D.index;
  /* 🔴 開いた瞬間に空の画面を出さない。既定の法人を1社開く */
  if (D.default_houjin && !customerHoujin) {
    customerHoujin = D.default_houjin;
    customerReason = D.default_reason || "";
    setTimeout(() => load(false), 0);
    return '<div class="loading">既定の顧客を開いています…</div>';
  }
  return sec("問い", question) +
    '<div class="lede">' + lede + " LTV の大きい順に " + num(D.index.length) +
    " 法人。上の選択から選ぶと明細が出ます。</div>" +
    scroll(table([{ t: "法人" }, { t: "取引", n: 1 }, { t: "拠点", n: 1 },
                  { t: "稼働中", n: 1 }, { t: "LTV", n: 1 }, { t: "最終満了" }],
      D.index.slice(0, 200).map((r) => [esc(r.name || r.houjin), num(r.deals),
        num(r.sites), num(r.active), yen(r.ltv), esc(r.last_expiration)])), 460);
}

/* 選んだ案件だけの D を作る。
   🔴 **画面の全部が選択に追従する**ようにするため、図・表・KPI・合計を
      ここで一度に絞る。どこか1つでも全件のまま残ると画面の中で数字が食い違う。 */
function custFilter(D, ids) {
  const keep = (x) => ids.has(x.deal_id);
  const ds = (D.deals || []).filter(keep);
  const sum = (f) => {
    let s = null;
    for (const d of ds) if (d[f] != null) s = (s || 0) + d[f];
    /* 🔴 1件も値が無ければ null。0 と「値が無い」を分ける */
    return s;
  };
  return Object.assign({}, D, {
    deals: ds,
    monthly: (D.monthly || []).filter(keep),
    contacts: (D.contacts || []).filter(keep),
    cpa3: (D.cpa3 || []).filter(keep),
    handover: (D.handover || []).filter(keep),
    cpa_by_site: (D.cpa_by_site || [])
      .map((st) => ({ site: st.site, points: (st.points || []).filter(keep) }))
      .filter((st) => st.points.length),
    funnel: { oubo: sum("oubo"), mensetu: sum("mensetu"), syoudaku: sum("syoudaku") },
    customer: D.customer && Object.assign({}, D.customer, {
      deals: ds.length,
      active: ds.filter((d) => d.is_active).length,
      ltv: sum("amount"),
      sites: new Set(ds.map((d) => d.site)).size,
      max_renewal_no: ds.reduce((m, d) => Math.max(m, d.renewal_no || 0), 0),
    }),
  });
}

/* 顧客1件の中身。`want` に入れた節だけを出す。
   節の中身はいままでのまま。粒度ごとに要る節が違うので、出し分けだけを足した。 */
function custBlocks(D, want) {
  if (!D.meta.found) return note("warn", "見つかりません", "この法人の取引がありません。");
  const c = D.customer;
  let h = "";
  if (want.has("head")) h += sec("顧客", c && c.name ? c.name : D.meta.houjin) +
    (customerReason
      ? note("info", "この顧客を既定で開いています", esc(customerReason) +
             "　上の選択から別の法人に切り替えられます。")
      : "") +
    '<div class="kpis">' +
    kpi("取引", num(c.deals) + '<span class="u">件</span>', "稼働中 " + num(c.active)) +
    kpi("拠点", num(c.sites) + '<span class="u">拠点</span>', "") +
    kpi("LTV", yen(c.ltv), "") +
    kpi("継続回数（最大）", num(c.max_renewal_no), "") +
    kpi("最終満了", esc(c.last_expiration || "—"), "") + "</div>";

  /* ---- 顧客に説明する数字 ---- */
  if (want.has("funnel")) {
  h += sec("図", "顧客に説明する数字");
  const fn_ = D.funnel;
  h += fig("応募 → 面接 → 採用 の落ち方", "取引をまたいだ合計",
    svgFunnel({ steps: [
      { label: "応募", v: fn_.oubo, color: C.ai },
      { label: "面接", v: fn_.mensetu, color: C.ki },
      { label: "採用", v: fn_.syoudaku, color: C.midori },
    ], alt: "応募から採用までの落ち方" }),
    '<i class="full">値が入っている契約だけを足しています。' +
    "<b>入っていないものを 0 として足していません</b>（母数が変わるため）。</i>");
  }

  /* ---- 採用単価を3つの出し方で ---- */
  if (want.has("cpa3")) {
  h += sec("図", "採用単価を3つの出し方で見る");
  const c3 = D.cpa3.filter((x) => x.total != null);
  h += fig("同じ契約でも、出し方で値が変わります",
    "顧客が見ているのは「1人採るのにいくらかかったか」",
    c3.length
      ? svgBarH({ w: 700, fmt: F.man, rh: 26,
          rows: c3.map((x) => ({
            label: shortName(x.name || x.deal_id, 20),
            v: x.total, v0: x.monthly,
            txt: yen(x.total),
            note: (x.band ? x.band + "帯 中央値 " + yen(x.band_median) : "") +
                  (x.syoudaku != null ? "　" + num(x.syoudaku) + "人" : ""),
            color: x.censored ? C.ghost : C.hi,
            faint: !!x.censored,
          })) })
      : '<div class="empty">採用数が入っている契約がありません（0で割っていません）。</div>',
    lg("box", C.hi, "総額 ÷ 採用数（確定）") + lg("box", C.ghost, "同（未確定・稼働中）") +
    lg("dash", C.ghost, "月割り") +
    '<i class="full">稼働中の契約は<b>金額が丸ごと乗っているのに採用がまだ伸びていない</b>ので、' +
    "総額での単価は必ず高く出ます。月割り（金額 ÷ 契約期間 × 経過月数 ÷ 採用数）と、" +
    "<b>同じ進捗帯の契約の中央値</b>を並べています。3つが食い違うときは、進捗帯の中央値を見てください。</i>");
  }

  /* ---- 拠点ごとの推移 ---- */
  if (want.has("cpasite")) {
  h += sec("図", "採用単価の推移（拠点ごと）");
  h += note("info", "1本の線にまとめない理由",
    "決裁は<b>事業所単位</b>です。拠点をまたいで1本につなぐと、拠点間のばらつきが" +
    "「時間の悪化」に見えてしまいます。");
  for (const st of D.cpa_by_site) {
    const pts = st.points.map((p) => ({ v: p.cpa, censored: !!p.censored }));
    h += fig("採用単価の推移 — " + shortName(st.site, 28), "点の下は採れた人数",
      pts.length >= 2
        ? svgLine({ w: 660, h: 200,
            x: st.points.map((p) => (p.start || "").slice(2, 7)),
            xSub: st.points.map((p) => (p.syoudaku == null ? "" : num(p.syoudaku) + "人")),
            series: [{ color: C.hi, pts: pts }],
            yFmt: F.man, yLab: "採用単価", alt: "採用単価の推移" })
        : '<div class="empty">点が1つしかないので線にしていません（' +
          st.points.map((p) => yen(p.cpa)).join(" / ") + "）。</div>",
      lg("dot", C.hi, "確定した契約") + lg("ring", C.hi, "未確定（右側打ち切り）"));
  }
  }

  /* ---- 応募・面接・採用の推移 ---- */
  if (want.has("monthly")) {
  h += sec("図", "応募・面接・採用の推移");
  h += note("info", "現在値ではなく、プロパティの変更履歴を使っています",
    "HubSpot のプロパティは上書きで履歴が残らないため、現在値を時系列に並べると" +
    "<b>決着後に入力された値が契約中に伸びたように見えます</b>" +
    "（実測で応募数の変更の 30.4%・採用数の 35.2% が決着日より後）。<br>" +
    "値が変わらなかった月は<b>前の値を持ち越し</b>、中空・破線で描いています。" +
    "実線・塗りつぶしはその月に書き換えがあった印です。");
  for (const mm of D.monthly) {
    const ser = mm.series || {};
    const any = ["oubo", "mensetu", "syoudaku"].some((k) => (ser[k] || []).length);
    if (!any) {
      h += fig(shortName(mm.name || mm.deal_id, 28) + " の推移", "",
        '<div class="empty">この契約には応募・面接・採用の変更履歴がありません' +
        "（記録が無いだけで、0 ではありません）。</div>");
      continue;
    }
    const months = [...new Set([].concat(...["oubo", "mensetu", "syoudaku"]
      .map((k) => (ser[k] || []).map((x) => x.m))))].sort((a, b) => a - b);
    const mk = (k) => months.map((mi) => {
      const f = (ser[k] || []).find((x) => x.m === mi);
      return f ? { v: f.v, carry: f.carry } : { v: null };
    });
    h += fig(shortName(mm.name || mm.deal_id, 28) + " の推移",
      "横軸は契約の何ヶ月目か" + (mm.period ? "（契約 " + num(mm.period) + "ヶ月）" : ""),
      svgLine({ w: 680, h: 220,
        x: months.map((m) => m + "ヶ月"),
        series: [
          { color: C.ai, pts: mk("oubo") },
          { color: C.ki, pts: mk("mensetu") },
          { color: C.midori, pts: mk("syoudaku") },
        ], yFmt: F.int, yLab: "件", alt: "応募・面接・採用の推移" }),
      lg("line", C.ai, "応募") + lg("line", C.ki, "面接") + lg("line", C.midori, "採用") +
      lg("dash", C.ghost, "持ち越し（その月に書き換えが無い）"));

    /* ---- 系列を縦に積む ---- */
    const npsSer = mm.nps || {};
    const npsPts = months.map((mi) => {
      let hit = null;
      for (const k of Object.keys(npsSer)) {
        const f = (npsSer[k] || []).find((x) => x.m === mi);
        if (f && (hit == null || !f.carry)) hit = f;
      }
      return hit ? { v: hit.v, carry: hit.carry } : { v: null };
    });
    const ct = (D.contacts || []).find((x) => x.deal_id === mm.deal_id);
    const ctPts = months.map((mi) => {
      if (!ct) return { v: null };
      const n = ct.dates.filter((d) => monthIdx(mm.start, d.slice(0, 7)) === mi).length;
      return { v: n };
    });
    const lane = (label, color, pts, type, noneLabel) => {
      const has = pts.some((p) => p.v != null);
      return { label: label, color: color, type: type || "line",
               pts: pts, empty: !has, noneLabel: noneLabel || "記録がありません" };
    };
    h += fig(shortName(mm.name || mm.deal_id, 28) + " — 系列を縦に並べる",
      "縦に目を落とすと「NPS が落ちた月に接触が切れていて、応募も止まっていた」が読めます",
      svgStackLanes({ w: 940, months: months.map((m) => m + "ヶ月"), lanes: [
        lane("応募", C.ai, mk("oubo")),
        lane("面接", C.ki, mk("mensetu")),
        lane("採用", C.midori, mk("syoudaku")),
        lane("定期NPS", C.murasaki, npsPts, "dots", "回答がありません"),
        lane("接触（MTG・60秒超の通話）", C.hi, ctPts, "bars", "接触の記録がありません"),
      ] }),
      '<i class="full"><b>1つの縦軸に重ねていません。二軸も使っていません。</b>' +
      "値の幅が違いすぎる（応募 0〜200 / NPS 0〜10 / 接触 0〜数十）ので、" +
      "重ねると応募だけが動いて NPS が底に張り付きます。" +
      "目盛りの取り方しだいで「相関して見える絵」を作れてしまうため、" +
      "<b>横軸だけを共有して、系列ごとに自分の縦軸を持たせています</b>。</i>");
  }
  }

  /* ---- 接触と担当交代 ---- */
  if (want.has("timeline") &&
      ((D.handover || []).length || (D.contacts || []).some((x) => x.dates.length))) {
    h += sec("図", "こちらの動き（接触と担当交代）");
    const lanes = [];
    for (const ct of (D.contacts || [])) {
      if (!ct.dates.length) continue;
      const d = D.deals.find((x) => x.deal_id === ct.deal_id);
      lanes.push({ label: shortName((d && d.name) || ct.deal_id, 16), color: C.ai,
        marks: ct.dates.map((x) => ({ d: x })) });
    }
    if ((D.handover || []).length) {
      lanes.push({ label: "担当交代", color: C.hi,
        marks: D.handover.map((x) => ({ d: x.date, thick: true })),
        note: D.handover.length + "件" });
    }
    h += fig("接触と担当交代の時系列", "交代の前後で間隔が開いたかを目で見る",
      svgTimeline({ w: 940, lanes: lanes, alt: "接触と担当交代" }),
      lg("dot", C.ai, "接触（MTG・60秒超の通話）") + lg("dot", C.hi, "担当交代") +
      '<i class="full">交代の「反映なし」には、新しい担当の MTG が1回しか無く' +
      "<b>引き継ぎか代理出席か区別が付かないもの</b>が混ざります。未反映と決めつけていません。</i>");
  }

  /* ---- 表（個別の行を特定したいときだけ）---- */
  if (want.has("deals")) {
  h += sec("表", "契約の系列（" + num(D.deals.length) + " 件）");
  h += scroll(table([{ t: "取引" }, { t: "ステージ" }, { t: "拠点" }, { t: "種別" },
                     { t: "開始" }, { t: "満了" }, { t: "継続", n: 1 }, { t: "金額", n: 1 },
                     { t: "応募", n: 1 }, { t: "面接", n: 1 }, { t: "承諾", n: 1 }, { t: "状態" }],
    D.deals.map((d) => [esc(d.name || d.deal_id),
      '<span class="muted small">' + esc(d.stage) + "</span>",
      '<span class="muted small">' + esc(d.site) + "</span>",
      '<span class="muted small">' + esc(d.kind) + "</span>",
      esc(d.start), esc(d.expiration), nz(d.renewal_no), yen(d.amount),
      nz(d.oubo), nz(d.mensetu), nz(d.syoudaku),
      (d.is_active ? "稼働中" : "") +
      (d.right_censored ? ' <span class="tag">未確定</span>' : "")])), 420);
  }

  if (want.has("mtgs")) {
  h += sec("表", "MTG の履歴（" + num(D.mtgs.length) + " 件）");
  h += note("info", "中身が空なのは「まだ抽出していない」です",
    "記録が無いのとは違います。抽出は日次の枠で止まっており、全件には届いていません。");
  h += scroll(table([{ t: "開催日" }, { t: "リスク" }, { t: "やること" },
                     { t: "顧客の懸念" }, { t: "抽出" }],
    D.mtgs.map((m) => [esc(m.date), esc(m.risk) || DASH, esc(m.todo) || DASH,
      esc(m.concern) || DASH, m.extracted ? "済" : '<span class="n0">未</span>'])), 420);
  }
  return h;
}

/* ================================================================ 継続を追いかける（事業所）

   🔴 粒度は**事業所（拠点）**。決裁は事業所単位なので、ふだん見るのはこちら。
      同じ事業所が契約を重ねてきた流れ（サブスク継続①②③…）を時系列で追う。
*/
let seriesSite = "";          /* 選んでいる拠点。空なら全部 */

function siteLabel(D, key) {
  if (!key) return "すべての拠点";
  const n = (D.deals || []).filter((d) => d.site === key).length;
  return shortName(key, 28) + "（契約 " + num(n) + " 件）";
}

function renderSeries(D) {
  if (D.index) {
    return custIndex(D, "この事業所は契約を重ねてこられたか",
      "<b>粒度は事業所です。</b>決裁は事業所単位なので、ふだん見るのはこちらです。");
  }
  const sites = [...new Set((D.deals || []).map((d) => d.site))].sort();
  if (seriesSite && !sites.includes(seriesSite)) seriesSite = "";
  const ids = new Set((D.deals || [])
    .filter((d) => !seriesSite || d.site === seriesSite)
    .map((d) => d.deal_id));
  const F2 = custFilter(D, ids);

  let h = sec("問い", "この事業所は契約を重ねてこられたか");
  h += note("info", "いま見ている粒度は「事業所」です",
    "<b>拠点をまたいでいません。</b>決裁は事業所単位なので、" +
    "同じ法人でも拠点が違えば別の契約の流れとして見ます。" +
    "拠点をまたいで比べたいときは、左の「法人番号で見る」を使ってください。");

  /* 拠点の選択。件数が多いので選択式にする */
  h += '<div class="ctlbar"><label class="act">拠点 <select id="cs-site">' +
    '<option value=""' + (seriesSite ? "" : " selected") + ">" +
    esc(siteLabel(D, "")) + "（" + num((D.deals || []).length) + " 件）</option>" +
    sites.map((k) => '<option value="' + esc(k) + '"' +
      (k === seriesSite ? " selected" : "") + ">" + esc(siteLabel(D, k)) +
      "</option>").join("") + "</select></label></div>";
  h += '<div class="count-line' + (seriesSite ? " on" : "") + '">' +
    "<b>" + num((D.deals || []).length) + " 件中 " + num(F2.deals.length) +
    " 件</b>を表示" + (seriesSite ? "（拠点 " + esc(shortName(seriesSite, 28)) + "）"
                                  : "（拠点で絞っていません）") + "</div>";

  /* 契約の連なり。何回目か・間が空いていないか */
  h += sec("図", "契約の連なり");
  const ordered = F2.deals.slice().sort((a, b) =>
    String(a.start || "").localeCompare(String(b.start || "")));
  h += fig("契約を古い順に並べる", "横は開始日。空きがあれば間が空いている",
    ordered.length
      ? svgTimeline({ w: 940, alt: "契約の連なり", lanes: ordered.map((d) => ({
          label: shortName(d.name || d.deal_id, 18),
          color: d.is_active ? C.ai : C.ghost,
          note: (d.renewal_no ? num(d.renewal_no) + "回目" : "初回") +
                (d.amount != null ? "　" + yen(d.amount) : ""),
          marks: [d.start, d.expiration].filter(Boolean).map((x) => ({ d: x, thick: true })),
        })) })
      : '<div class="empty">この拠点に契約がありません。</div>',
    lg("dot", C.ai, "稼働中") + lg("dot", C.ghost, "決着済") +
    '<i class="full">印は契約の開始日と満了日です。' +
    "<b>間が空いていれば、その分だけ契約が途切れています。</b></i>");

  h += custBlocks(F2, new Set(["monthly", "timeline", "deals", "mtgs"]));
  return h + foot(D.meta);
}

/* ================================================================ 法人番号で見る（法人）

   🔴 粒度は**法人**。拠点をまたいで並べる。本部に持っていく話のとき用。
   🔴 案件はチェックで出し入れできる。**既定は全表示**。
      チェックを外したら図・表・KPI・合計の**全部**が追従する。
*/
let houjinPick = null;        /* deal_id -> true。null なら「まだ決めていない＝全部」 */
let houjinFor = "";           /* どの法人ぶんの選択か */

function houjinIds(D) {
  const all = (D.deals || []).map((d) => d.deal_id);
  if (houjinFor !== customerHoujin || !houjinPick) {
    houjinFor = customerHoujin;
    houjinPick = {};
    all.forEach((id) => { houjinPick[id] = true; });   /* 既定は全部 */
  }
  return new Set(all.filter((id) => houjinPick[id]));
}

/* 月ごとに畳む。key は "YYYY-MM" */
function byMonth(pairs) {
  const m = {};
  for (const [k, v] of pairs) {
    if (!k || v == null) continue;
    m[k] = (m[k] || 0) + v;
  }
  return m;
}

function renderHoujin(D) {
  if (D.index) {
    return custIndex(D, "この法人は拠点ごとにどう違うか",
      "<b>粒度は法人です。</b>拠点をまたいで並べます。本部に持っていく話のとき用です。");
  }
  const ids = houjinIds(D);
  const F2 = custFilter(D, ids);
  const all = D.deals || [];

  let h = sec("問い", "この法人は拠点ごとにどう違うか");
  h += note("info", "いま見ている粒度は「法人」です",
    "<b>拠点をまたいで並べています。</b>ふだんの判断は事業所単位なので、" +
    "1つの事業所の流れを追うときは左の「継続を追いかける」を使ってください。" +
    "<b>拠点をまたいで1本の線にはしていません</b>（拠点差が時間の悪化に見えるため）。");

  /* ---- 案件のチェック ---- */
  h += sec("表", "見る案件を選ぶ");
  h += '<div class="ctlbar" id="hj-ctl">' +
    '<button type="button" class="act" id="hj-all">全部選ぶ</button>' +
    '<button type="button" class="act" id="hj-none">全部外す</button></div>';
  h += '<div class="pickbox" id="hj-pick">' + all.map((d) =>
    '<label class="pick"><input type="checkbox" data-d="' + esc(d.deal_id) + '"' +
    (houjinPick[d.deal_id] ? " checked" : "") + ">" +
    "<span>" + esc(shortName(d.name || d.deal_id, 34)) +
    '<span class="muted small">　' + esc(shortName(d.site, 14)) +
    (d.amount != null ? "　" + yen(d.amount) : "") +
    (d.is_active ? '　<span class="tag e">稼働中</span>' : "") +
    "</span></span></label>").join("") + "</div>";
  /* 🔴 絞ったことを忘れて全体だと読むのが、この種の画面でいちばん起きる事故 */
  /* class の中に式を書かない（CSS の静的検査がクラス名と読み違える） */
  const picked = ids.size < all.length;
  h += '<div class="count-line' + (picked ? " on" : "") + '" id="hj-count">' +
    "<b>" + num(all.length) + " 件中 " + num(ids.size) + " 件</b>を表示" +
    (picked ? "（チェックを外している案件があります）" : "（全部出しています）") +
    "</div>";

  if (!ids.size) {
    h += note("warn", "案件が1つも選ばれていません",
      "上のチェックを1つ以上入れてください。「全部選ぶ」で戻せます。");
    return h + foot(D.meta);
  }

  h += custBlocks(F2, new Set(["head", "funnel", "cpa3"]));

  /* ---- 案件ごとの推移 ---- */
  /* 案件ごとに契約開始日が違うので、月番号を暦の月に直してから横軸をそろえる */
  const mkMonths = () => {
    const set = new Set();
    for (const mm of F2.monthly) {
      const ser = (mm.series || {}).syoudaku || [];
      for (const x of ser) {
        const mi = monthAdd(mm.start, x.m);
        if (mi) set.add(mi);
      }
    }
    return [...set].sort();
  };
  const ms = mkMonths();

  h += sec("図", "案件ごとの採用数の推移");
  /* 🔴 **記録が無い契約は線にしない。** 0 として描くと「採れていない」に見えるが、
     実際は「プロパティの変更履歴が残っていない」だけ（古い契約ほど残っていない）。
     新しい順に、記録のあるものだけを最大12本描く。 */
  const withSer = F2.monthly
    .filter((mm) => (((mm.series || {}).syoudaku) || []).length)
    .sort((a, b) => String(b.start || "").localeCompare(String(a.start || "")));
  /* 🔴 **色は4役＋紫の5つしかない。** 6本目からは色を使い回すことになり、
     凡例を見ても線が見分けられなくなる（色だけで意味を伝えないという規律に反する）。
     線は5本までにして、それ以上見たいときは**チェックで案件を絞ってもらう**。
     チェックはそのために付けてある。 */
  const MAX_LINE = 5;
  const drawn = withSer.slice(0, MAX_LINE);
  h += fig("選んだ案件それぞれの線", "横は暦の月。1本＝1案件",
    ms.length >= 2 && drawn.length
      ? svgLine({ w: 940, h: 260, x: ms.map((m) => m.slice(2)),
          series: drawn.map((mm, i) => ({
            color: [C.ai, C.hi, C.ki, C.midori, C.murasaki][i],
            /* 🔴 記録は**書き換えのあった月だけ**。間の月は前の値を持ち越す
               （サーバ側の fill_forward と同じ読み方）。持ち越した点は
               carry を立てて中空・破線で描く。契約期間の外までは伸ばさない。 */
            pts: ms.map((mo) => {
              const ser = ((mm.series || {}).syoudaku || [])
                .map((x) => ({ mo: monthAdd(mm.start, x.m), v: x.v }))
                .filter((x) => x.mo);
              const st = String(mm.start || "").slice(0, 7);
              const dl = F2.deals.find((d) => d.deal_id === mm.deal_id) || {};
              const en = String(dl.expiration || "9999-12").slice(0, 7);
              if (!st || mo < st || mo > en) return { v: null };
              let last = null;
              for (const x of ser) { if (x.mo <= mo) last = x; }
              if (!last) return { v: null };
              return { v: last.v, carry: last.mo !== mo };
            }),
          })), yFmt: F.int, yLab: "採用数", alt: "案件ごとの採用数の推移" })
      : '<div class="empty">線にできる月次の記録がありません（記録が無いだけで 0 ではありません）。</div>',
    drawn.map((mm, i) =>
      lg("line", [C.ai, C.hi, C.ki, C.midori, C.murasaki][i],
         shortName(mm.name || mm.deal_id, 18))).join("") +
    '<i class="full"><b>拠点をまたいで1本にしていません。</b>1本が1案件です。' +
    "選んだ " + num(F2.monthly.length) + " 件のうち、採用数の変更履歴があるのは " +
    num(withSer.length) + " 件です。" +
    "<b>履歴が無いのは「採れていない」ではなく「記録が残っていない」です</b>" +
    "（古い契約ほど残っていません）。</i>" +
    (withSer.length > MAX_LINE
      ? '<i class="full"><b>線は新しい ' + MAX_LINE + " 本だけです。</b>" +
        "色は4役＋紫の5つしかなく、6本目から色を使い回すと線が見分けられなくなるためです。" +
        "<b>見たい案件だけチェックを残すと、その案件が線になります。</b></i>"
      : ""));

  /* ---- 全体（合算）---- */
  h += sec("図", "全体（選んだ案件の合算）");
  const sumM = byMonth(F2.monthly.flatMap((mm) =>
    (((mm.series || {}).syoudaku) || []).map((x) => [monthAdd(mm.start, x.m), x.v])));
  const smKeys = Object.keys(sumM).sort();
  h += fig("採用数の月ごとの合計", "この法人として月にどれだけ採れたか",
    smKeys.length >= 2
      ? svgLine({ w: 940, h: 220, x: smKeys.map((m) => m.slice(2)),
          series: [{ color: C.midori, pts: smKeys.map((k) => ({ v: sumM[k] })) }],
          yFmt: F.int, yLab: "採用数", alt: "採用数の合計の推移" })
      : '<div class="empty">合算できる月次の記録がありません。</div>',
    lg("line", C.midori, "選んだ案件の合計") +
    '<i class="full"><b>これは合算です。</b>拠点をまたいで足しています。' +
    "拠点ごとの違いを見るときは1つ上の図か、下の「採用単価の推移（拠点ごと）」を見てください。</i>");

  /* LTV の累計。金額の入っている案件を開始日の順に足していく */
  const lt = F2.deals.filter((d) => d.amount != null && d.start)
    .sort((a, b) => String(a.start).localeCompare(String(b.start)));
  let acc = 0;
  const ltPts = lt.map((d) => { acc += d.amount; return { v: acc }; });
  h += fig("LTV の推移（契約金額の累計）", "契約が増えるたびに積み上がる",
    ltPts.length >= 2
      ? svgLine({ w: 940, h: 220, labelPts: true,
          x: lt.map((d) => String(d.start).slice(2, 7)),
          series: [{ color: C.ai, pts: ltPts }],
          yFmt: F.man, yLab: "累計金額", alt: "LTV の推移" })
      : '<div class="empty">金額が入っている契約が ' + num(lt.length) +
        " 件しかないので線にしていません。</div>",
    lg("line", C.ai, "契約金額の累計") +
    '<i class="full"><b>これも合算です。</b>金額が入っていない契約は足していません' +
    "（0 として足すと母数が変わるため）。横軸は契約の開始月で、" +
    "どの拠点のぶんかは下の「契約の系列」の表にあります。</i>");

  h += custBlocks(F2, new Set(["cpasite", "deals"]));

  /* ---- 他の法人と比べる（本部アプローチ）---- */
  h += sec("図", "他の法人と比べる");
  h += '<div id="hq-box"><span class="loading">読み込み中…</span></div>';
  return h + foot(D.meta);
}

/** 契約開始からの月番号 `m` を暦の "YYYY-MM" に直す。
    🔴 サーバ側と同じ数え方（始月を1ヶ月目とする）。 */
function monthAdd(start, m) {
  if (!start || String(start).length < 7 || m == null) return null;
  const y = +String(start).slice(0, 4);
  const mo = +String(start).slice(5, 7);
  const t = (y * 12 + (mo - 1)) + (m - 1);
  const yy = Math.floor(t / 12);
  const mm = (t % 12) + 1;
  return yy + "-" + String(mm).padStart(2, "0");
}

/** 契約開始からの「何ヶ月目か」。🔴 始月は含めない（サーバ側と同じ数え方） */
function monthIdx(start, month) {
  if (!start || start.length < 7 || !month || month.length < 7) return null;
  return (+month.slice(0, 4) - +start.slice(0, 4)) * 12 +
         (+month.slice(5, 7) - +start.slice(5, 7)) + 1;
}

  }

  /* ---- 表は最後。個別の行を特定したいときだけ ---- */

    "</summary>" +
    table([{ t: "拠点" }, { t: "取引", n: 1 }, { t: "稼働中", n: 1 }, { t: "解約", n: 1 },
           { t: "解約率", n: 1 }, { t: "金額", n: 1 }, { t: "採用数", n: 1 }, { t: "採用単価", n: 1 }],

/* ================================================================ 5 MTG の品質 */
function renderMtgQ(D) {
  let h = sec("問い", "MTG に何が記録されているか") +
    note("info", "MTG の良し悪しを採点していません",
      "何が記録されているかだけを出しています。<b>埋まっていないのは「記録していない」ではなく" +

    svgBarH({ w: 680, fmt: F.int, rh: 22,

}

/* ================================================================ 7 立ち上がり */

  let h = sec("問い", "最初の契約を乗り切れているか") +
    note("info", "この画面で数えていないもの",
      "成約率・売上・担当者の評価ではありません。<b>契約が始まってから最初の MTG までに" +
      "何日かかったか</b>だけを見ています。良し悪しの判断は人がします。<br>" +
      "ここの「初回MTG」は<b>MTG だけ</b>で、電話は入っていません" +
      "（MTGと電話を束ねた最終接触は⑧成果にあります）。");

  h += sec("図", "いま、どのフェーズにいるか");
  const pparts = ph.rows.map((r, i) => ({
    label: r.label, v: r.n,

    svgStack({ w: 680, parts: pparts }), stackLegend(pparts) +
    '<i class="full">同じ「3ヶ月目」でも、3ヶ月契約なら満了、12ヶ月契約なら序盤です。' +
    "契約期間が入っていないものは「出せない」に置いています（0として満了超過に落としていません）。</i>");

  h += sec("図", "立ち上がりの速さ（契約開始 → 初回MTG）");
  h += fig("初回MTGまでの日数の散らばり",
    "母数 " + num(f.n) + " 件。契約前のMTG " + num(f.pre_contract) + " 件は混ぜていません",
    f.stats && f.stats.n >= MIN_N
      ? svgBoxH({ w: 680, xFmt: F.int, rows: [{
          label: "初回MTGまで", med: f.stats.median, q1: f.stats.q1, q3: f.stats.q3,
          min: f.stats.min, max: f.stats.max, mean: f.stats.mean, n: f.stats.n, color: C.ai }] })

    lg("box", C.ai, "四分位") + lg("line", C.ink, "中央値"));

  h += fig("帯ごとの、その後の解約率", "遅い群が悪いことだけが読めます",
    svgBarH({ w: 660, fmt: F.d1, rh: 26,
      rows: f.buckets.filter((b) => b.n >= MIN_N).map((b) => ({
        label: b.label, v: b.cancel_rate, txt: pct1(b.cancel_rate),
        note: "n=" + num(b.n),
        color: b.label === "61日超" ? C.hi : C.ai })) }),
    lg("box", C.hi, "61日超") + lg("box", C.ai, "それ以外") +
    '<i class="full"><b>単調ではありません。</b>14日以内も解約しています。' +
    "「早ければ良い」とは言えず、<b>遅い群が悪い</b>ことだけが読めます。" +
    "61日超には関係が薄い顧客が混じっている可能性があり、" +
    "<b>遅れが原因とは決められません（相関であって因果ではない）</b>。</i>");

  h += sec("表", "まだ MTG が結べていない初回契約（" + num(nm.n) + " 件）");
  h += '<div class="lede">稼働中の初回契約 ' + num(nm.first_active) + " 件のうち " +
    pct1(nm.rate) + "。" + esc(nm.note) + "</div>";
  h += scroll(table([{ t: "取引" }, { t: "ステージ" }, { t: "金額", n: 1 }, { t: "契約開始から", n: 1 }],

  return h + foot(D.meta);
}

/* ================================================================ 8 成果とリスク */

  const ga = D.goal_act, gl = D.goal_all, ef = D.efficiency, R = D.risk, cs = D.contact_source;
  let h = sec("問い", "成果は出ているか、どこが危ないか") +
    note("info", "この画面で数えていないもの",
      "成約率・継続率・MTG件数・メール件数ではありません。<b>接触 ＝ MTG または60秒超の通話</b>で、" +
      "メールは数えていません。<b>接触は検知にだけ使っています。処方には使いません。</b>" +
      "中盤に接触が増えるのは「火消し」で、結果が原因より後に来ています。");

  h += sec("図", "目標に対する進捗");
  const gparts = ga.bands.map((b, i) => ({
    label: b.label, v: b.n,
    color: b.label === "100%以上" ? C.midori : b.label === "0%（実績ゼロ）" ? C.hi :
           b.label.startsWith("未記入") ? C.ghost : SERIES[i % 5],
    faint: b.label.startsWith("未記入") }));
  h += fig("達成率 ＝ 承諾数 ÷ 採用目標数", "目標が入っている契約だけが母数",
    svgStack({ w: 680, parts: gparts }),
    stackLegend(gparts) +
    '<i class="full"><b>目標が入っているのは稼働中の ' + pct1(ga.fill_rate) + "（" +
    num(ga.has_goal) + " / " + num(ga.pop) + "）だけです。</b>全件では " + pct1(gl.fill_rate) +
    "。入っていない取引は「達成率0%」ではなく、母数に入っていません。" +
    "　中央値（稼働中）" + (ga.median == null ? DASH : pct1(ga.median * 100)) + "</i>");

  h += sec("図", "求人票あたりの応募効率");
  h += fig("応募数 ÷ 掲載数", "結果ごとのばらつき",
    svgBoxH({ w: 680, xFmt: F.d1,
      rows: ef.groups.filter((g) => g.box && g.box.n >= MIN_N).map((g, i) => ({
        label: g.label, med: g.box.median, q1: g.box.q1, q3: g.box.q3,
        min: g.box.min, max: g.box.max, mean: g.box.mean, n: g.box.n,
        color: SERIES[i % 5] })) }),
    lg("line", C.ink, "中央値") +
    '<i class="full">' + esc(ef.caveat) + "　掲載数が入っているのは 稼働中 " +
    num(ef.has_keisaisu_act) + " / " + num(ef.n_act) + "。</i>");
  h += note("bad", "資料の「8.1 ≪ 14.5」は、今あるデータでは再現しません",
    "向き（解約 ＜ 継続）は合っていますが、中央値で見ると差はほとんどありません。" +
    "<b>単独で解約を見分けられる指標ではない</b>と読んでください。");

  h += sec("図", "リスクは2軸だけで見る");
  h += note("info", "4軸のうち2軸を意図的に外しています。手抜きではありません",
    "<b>関係性の軸（NPS）</b>：稼働中の半分にしか値が無く、<b>構造的に発火しません</b>。" +
    "常に非赤の軸を並べると「問題ない」と読まれますが、実際は<b>測れていないだけ</b>です" +
    "（NPS は①で独立した指標として出しています）。<br>" +
    "<b>モデルの軸（churn予測）</b>：本番が StratifiedKFold のままで、同じ顧客が継続契約で" +
    "複数の取引を持つため <b>AUC が上振れします</b>。説明できない順位を現場に出せません。");
  const rparts = R.bands.map((b) => ({
    label: b.label, v: b.n,
    color: b.label.startsWith("2") ? C.hi : b.label.startsWith("1") ? C.ki : C.midori }));
  h += fig("稼働中 " + num(R.n_act) + " 件の帯", "2軸とも赤 ＝ 最優先",
    svgStack({ w: 680, parts: rparts }),
    stackLegend(rparts) +
    '<i class="full">③放置: 赤 ' + num(R.ax3["赤"]) + " / 白 " + num(R.ax3["白"]) +
    " / 未測定 " + num(R.ax3["未測定"]) + "（" + esc(R.ax3.rule) + "）<br>" +
    "④収益: 赤 " + num(R.ax4["赤"]) + " / 白 " + num(R.ax4["白"]) +
    " / 未測定 " + num(R.ax4["未測定"]) + "（" + esc(R.ax4.rule) + "）<br>" +
    "接触の記録が1つも無い " + num(R.ax3["未測定"]) +
    " 件は<b>赤にせず「未測定」として分けています</b>。記録が無いことと放置は別です。" +
    "数えた接触: 60秒超の通話 " + num(cs.calls_over_threshold) + " / MTG " +
    num(cs.mtgs_linked) + " / 接触のある取引 " + num(cs.deals_with_contact) + "</i>");

  h += sec("図", "最優先の広がり（金額 × 満了まで）");
  h += fig("2軸とも赤の " + num(R.top.length) + " 件", "右上ほど金額が大きく満了が遠い",
    R.top.length
      ? svgScatter({ w: 680, h: 260,
          pts: R.top.filter((r) => r.amount != null && r.days_to_expiry != null)
            .map((r) => ({ x: r.days_to_expiry, y: r.amount,
                           color: r.never_after_start ? C.hi : C.ki,
                           label: r.name || r.deal_id })),
          xFmt: F.int, yFmt: F.man, xLab: "満了まで（日）", yLab: "金額",
          alt: "最優先の広がり" })
      : '<div class="empty">最優先に当たる取引がありません。</div>',
    lg("dot", C.hi, "契約後に一度も接触していない") + lg("dot", C.ki, "接触から30日超") +
    '<i class="full">' + esc(R.order_note) + "</i>");

  h += sec("表", "最優先（2軸とも赤・" + num(R.top.length) + " 件）");
  h += '<div class="lede">金額が大きい順。' + esc(R.order_note) + "</div>";
  h += scroll(table([{ t: "取引" }, { t: "ステージ" }, { t: "金額", n: 1 },
                     { t: "満了まで", n: 1 }, { t: "③ 放置" }, { t: "接触の記録", n: 1 }],
    R.top.map((r) => [esc(r.name || r.deal_id),
      '<span class="muted small">' + esc(r.stage) + "</span>", yen(r.amount),
      r.days_to_expiry == null ? DASH : num(r.days_to_expiry) + "日",
      (r.never_after_start ? '<b style="color:var(--hi)">' : "<span>") + esc(r.ax3w) +
        (r.never_after_start ? " &#9650;</b>" : "</span>"),
      r.n_contact ? num(r.n_contact) + "件" : DASH])), 420);
  return h + foot(D.meta);
}

/* ================================================================ 9 データ品質 */
function renderDq(D) {
  let h = sec("問い", "この画面の数字を、どこまで信じてよいか") +
    '<div class="lede">取引 ' + num(D.meta.n_deals) + " 件（稼働中 " +
    num(D.meta.n_active) + " 件）。</div>";

  /* ---- 法人番号の出どころ ---- */
  h += sec("図", "法人番号の出どころ");
  const hp = D.houjin_source.rows.map((r, i) => ({
    label: r.label, v: r.n,
    color: r.label === "deal" ? C.ai : r.label === "company" ? C.ki : C.ghost,
    faint: r.label.indexOf("無") >= 0 || r.label === "none" }));
  h += fig("どこから取れたか", "",
    svgStack({ w: 680, parts: hp }), stackLegend(hp) +
    '<i class="full">' + esc(D.houjin_source.note) + "</i>");

  /* ---- 記入率の偏り（面で見る）---- */
  h += sec("図", "成果系の記入率が結果で偏っている");
  const groups = ["継続済", "解約", "充足", "結果待ち"];
  const fields = [...new Set(D.outcome_bias.rows.map((r) => r.field))];
  h += fig("結果ごとの記入率", "色が濃いほど埋まっている",
    svgMatrix({ padL: 150, cw: 120,
      cols: groups,
      rows: fields.map((f) => ({
        label: f,
        cells: groups.map((g) => {
          const r = D.outcome_bias.rows.find((x) => x.group === g && x.field === f);
          if (!r || r.fill_rate == null) return { v: null, txt: "—", n: 0 };
          return { v: r.fill_rate / 100, txt: pct1(r.fill_rate),
                   n: r.filled, color: C.ai };
        }),
      })) }),
    '<i class="full">' + esc(D.outcome_bias.note) + "</i>");
  h += note("bad", "この偏りは相関を押し上げる方向に効きます",
    "うまくいかなかった契約ほど数字が残っていないので、" +
    "「継続するほど成果が良い」という見え方が強く出ます。");

  /* ---- 欠測 ---- */
  h += sec("図", "何がどれだけ欠けているか");
  h += fig("欠測の件数", "0 で埋めていません",
    svgBarH({ w: 700, fmt: F.int, rh: 26,
      rows: D.missing.map((m) => ({
        label: tail(m.label, 30), v: m.n, txt: num(m.n) + "件",
        note: pct1(m.rate), color: m.rate >= 20 ? C.ki : C.ai })) }),
    lg("box", C.ki, "20%以上") + lg("box", C.ai, "20%未満") +
    '<i class="full">' + D.missing.map((m) => esc(m.label) + "：" + esc(m.note)).join(" ／ ") +
    "</i>");

  /* ---- 読んでいるシート ---- */
  h += sec("表", "読んでいるシート");
  h += '<div class="lede">スプレッドシートを直接読んでいます。件数はいま読めた行数です。</div>';
  h += table([{ t: "シート" }, { t: "行数", n: 1 }],
    D.sheets.map((x) => [esc(x.name), num(x.rows)]));
  return h + foot(D.meta);
}


/* ================================================================ 案件の立ち位置 / 今日動く先 */

/* 名札。🔴 これの本数で並べる。スコアは出さない */
function tags(fs) {
  if (!fs || !fs.length) return '<span class="n0">—</span>';
  return fs.map((f) => {
    const col = f.indexOf("NPS") >= 0 || f.indexOf("退職") >= 0 ? "hi" :
                f.indexOf("満了") >= 0 || f.indexOf("接触") >= 0 ? "ki" : "murasaki";
    return '<span class="tag" style="border-color:var(--' + col +
      ');color:var(--' + col + ')">' + esc(f) + "</span>";
  }).join(" ");
}
/* 履歴から取った値。🔴 その月に書き換えが無ければ「持越」と出す */
function numCarry(v, carry) {
  if (v == null) return DASH;
  return num(v) + (carry
    ? ' <span class="n0" title="その月に書き換えが無く、前の値を引き継いだ">持越</span>' : "");
}

/* 何ヶ月目か。分母は契約期間 */
function pos(r) {
  /* 🔴 契約開始がまだ先のものは「-1 か月目」ではなく「開始前」と出す */
  if (r.not_started)
    return '<span class="muted">開始前</span>' +
      (r.start ? '<span class="muted small"> ' + esc(r.start) + " から</span>" : "");
  if (r.months == null) return DASH;
  return num(r.months) + (r.period ? " / " + num(r.period) : "") +
    '<span class="muted small"> か月目</span>' +
    (r.band ? ' <span class="muted small">' + esc(r.band) + "</span>" : "");
}
function npsCell(r) {
  if (r.nps == null) return '<span class="n0">未回答</span>';
  const col = r.nps <= 4 ? "hi" : r.nps >= 9 ? "midori" : "ink-2";
  return '<b style="color:var(--' + col + ')">' + num(r.nps) + "</b>" +
    '<span class="muted small"> ' + esc(r.nps_month || "") + "</span>";
}
function touchCell(r) {
  if (r.n_contact === 0) return '<b style="color:var(--hi)">記録なし</b>';
  if (r.days_since_contact == null) return DASH;
  const col = r.days_since_contact > 30 ? "hi" : r.days_since_contact > 14 ? "ki" : "ink-2";
  return '<b style="color:var(--' + col + ')">' + num(r.days_since_contact) +
    "日</b>" + '<span class="muted small"> 前</span>';
}
function goalCell(r) {
  if (r.saiyomokuhyou == null || r.saiyomokuhyou <= 0)
    return '<span class="n0">目標なし</span>';
  if (r.rate_tassei == null) return DASH;
  const col = r.rate_tassei >= 1 ? "midori" : r.rate_tassei < 0.5 ? "hi" : "ki";
  return '<b style="color:var(--' + col + ')">' + pct1(r.rate_tassei * 100, 0) + "</b>" +
    '<span class="muted small"> ' + nz(r.syoudaku) + "/" + nz(r.saiyomokuhyou) + "</span>";
}
function cpaCell(r) {
  /* 🔴 金額が入っていない（0を含む）と採用単価は出せない。0万 と書かない */
  if (r.amount == null) return '<span class="n0">金額なし</span>';
  if (r.cpa == null) return '<span class="n0">採用0</span>';
  const col = r.cpa_vs_band != null && r.cpa_vs_band >= 1.5 ? "hi" : "ink-2";
  return '<b style="color:var(--' + col + ')">' + yen(r.cpa) + "</b>" +
    (r.cpa_band_median == null ? "" :
      '<span class="muted small"> 帯中央 ' + yen(r.cpa_band_median) + "</span>");
}

const BOARD_COLS = [
  { k: "name",       t: "案件",        n: 0, fmt: (r) => esc(r.name || r.deal_id) +
      (r.focus ? ' <span class="tag">注力</span>' : "") },
  { k: "consultant", t: "担当",        n: 0, fmt: (r) => esc(r.consultant) || DASH },
  { k: "months",     t: "何ヶ月目",    n: 1, fmt: pos },
  /* 🔴 マイナスは「満了を過ぎている」。そのまま -329日 と出すと読めない */
  { k: "days_left",  t: "満了まで",    n: 1, fmt: (r) => {
      if (r.days_left == null) return DASH;
      if (r.days_left < 0)
        return '<b style="color:var(--hi)">満了を' + num(-r.days_left) + "日過ぎている</b>";
      return r.days_left <= 60
        ? '<b style="color:var(--ki)">' + num(r.days_left) + "日</b>"
        : num(r.days_left) + "日";
    } },
  { k: "nps",        t: "定期NPS",     n: 1, fmt: npsCell },
  { k: "days_since_contact", t: "最後の接触", n: 1, fmt: touchCell },
  /* 🔴 応募 → 面接 → 採用 を横に並べる。どこで詰まっているかが1行で読めるように */
  { k: "oubo",       t: "応募",        n: 1, fmt: (r) => numCarry(r.oubo, r.oubo_carry) },
  { k: "mensetu",    t: "面接",        n: 1, fmt: (r) => numCarry(r.mensetu, r.mensetu_carry) },
  { k: "syoudaku",   t: "採用",        n: 1, fmt: (r) => numCarry(r.syoudaku, r.syoudaku_carry) },
  { k: "rate_tassei", t: "採用目標に対して", n: 1, fmt: goalCell },
  /* 🔴 接触率は②コンサルタント一覧と同じ定義。必ず分母つき */
  { k: "contact_rate", t: "接触率",    n: 1, fmt: (r) => {
      /* 開始前は分母（経過月）が0。「0%」ではなく理由を出す */
      if (r.not_started) return '<span class="muted small">開始前</span>';
      if (r.contact_rate == null) return DASH;
      const col = r.contact_rate < 40 ? "hi" : r.contact_rate < 70 ? "ki" : "midori";
      return '<b style="color:var(--' + col + ')">' + pct1(r.contact_rate, 0) + "</b>" +
        '<span class="muted small"> ' + num(r.contact_touched) + "/" +
        num(r.contact_months) + " か月</span>";
    } },
  { k: "cpa",        t: "採用単価",    n: 1, fmt: cpaCell },
  { k: "amount",     t: "金額",        n: 1, fmt: (r) => yen(r.amount) },
  { k: "n_flags",    t: "名札",        n: 0, fmt: (r) => tags(r.flags) },
];

let boardSort = { key: "n_flags", asc: false };

/* ③の絞り込み。②から担当者を押して来たときも、ここに入る。
   🔴 絞ったら必ず「◯件中 N件を表示」を出す（全件を見ていると誤認させない）。 */
let boardFilter = { consultant: "", flag: "", expiry: "", q: "" };

/* 満了までの帯。値は days_left（null は「満了日が入っていない」） */
const EXPIRY_BANDS = [
  { k: "over", t: "満了を過ぎている",     hit: (d) => d != null && d < 0 },
  { k: "d30",  t: "30日以内",             hit: (d) => d != null && d >= 0 && d <= 30 },
  { k: "d60",  t: "60日以内",             hit: (d) => d != null && d >= 0 && d <= 60 },
  { k: "d90",  t: "90日以内",             hit: (d) => d != null && d >= 0 && d <= 90 },
  { k: "far",  t: "90日より先",           hit: (d) => d != null && d > 90 },
  { k: "none", t: "満了日が入っていない", hit: (d) => d == null },
];

/* 絞り込みを当てる。**行を落とすのはここだけ** */
function boardApply(rows) {
  const f = boardFilter;
  const band = EXPIRY_BANDS.find((b) => b.k === f.expiry);
  const q = f.q.trim().toLowerCase();
  return rows.filter((r) => {
    if (f.consultant && (r.consultant || "") !== f.consultant) return false;
    if (f.flag && !(r.flags || []).some((x) => x === f.flag)) return false;
    if (band && !band.hit(r.days_left)) return false;
    if (q && String(r.name || r.deal_id || "").toLowerCase().indexOf(q) < 0) return false;
    return true;
  });
}

function boardFilterOn() {
  const f = boardFilter;
  return !!(f.consultant || f.flag || f.expiry || f.q.trim());
}

/* いま何で絞っているかを日本語で並べる */
function boardFilterWords() {
  const f = boardFilter, w = [];
  if (f.consultant) w.push("担当 " + f.consultant);
  if (f.flag) w.push("名札 " + f.flag);
  if (f.expiry) {
    const b = EXPIRY_BANDS.find((x) => x.k === f.expiry);
    if (b) w.push("満了まで " + b.t);
  }
  if (f.q.trim()) w.push("案件名に " + f.q.trim());
  return w.join(" / ");
}

/* 絞り込みの操作列 */
function boardFilterBar(D) {
  const names = Array.from(new Set(D.rows.map((r) => r.consultant).filter(Boolean)))
    .sort((a, b) => a.localeCompare(b, "ja"));
  const flags = (D.meta.flag_counts || []).slice().sort((a, b) => b.n - a.n);
  const opt = (v, t, cur) =>
    '<option value="' + esc(v) + '"' + (cur === v ? " selected" : "") + ">" + esc(t) + "</option>";
  let h = '<div class="ctlbar" id="board-filter">';
  h += '<label class="act">担当 <select id="bf-consultant">' +
    opt("", "すべて", boardFilter.consultant) +
    names.map((n) => opt(n, n, boardFilter.consultant)).join("") + "</select></label>";
  h += '<label class="act">名札 <select id="bf-flag">' +
    opt("", "すべて", boardFilter.flag) +
    flags.map((x) => opt(x.label, x.label + "（" + num(x.n) + "）", boardFilter.flag)).join("") +
    "</select></label>";
  h += '<label class="act">満了まで <select id="bf-expiry">' +
    opt("", "すべて", boardFilter.expiry) +
    EXPIRY_BANDS.map((b) => opt(b.k, b.t, boardFilter.expiry)).join("") + "</select></label>";
  /* 幅は CSS の min-width / max-width で決める。ここに px を書かない */
  h += '<label class="act">案件名 <input type="search" id="bf-q" placeholder="部分一致" ' +
    'value="' + esc(boardFilter.q) + '"></label>';
  h += '<button type="button" class="act" id="bf-clear">絞り込みを外す</button>';
  return h + "</div>";
}

/* ②のコンサルタント名から③へ飛ぶ。担当で絞った状態で開く */
function drillToBoard(name) {
  boardFilter = { consultant: name, flag: "", expiry: "", q: "" };
  go("consultant", "byowner");
}

/* いま開いている項目を描き直す（並び替え・絞り込みのたびに使う）。
   取り直しはしない。手元のデータで組み直すだけ */
function redrawMain(D) {
  const v = viewOf(cur.menu, cur.view);
  const main = document.getElementById("cs-main");
  main.innerHTML = ctlbar(v, D) + v.render(D);
  wire(v);
}

function boardTable(rows, sort, id) {
  const rs = rows.slice();
  const k = sort.key, asc = sort.asc;
  rs.sort((a, b) => {
    const x = a[k], y = b[k];
    if (x == null && y == null) return 0;
    if (x == null) return 1;   // 値が無いものは常に末尾。0 として並べない
    if (y == null) return -1;
    const c = typeof x === "string" ? x.localeCompare(y, "ja") : x - y;
    return asc ? c : -c;
  });
  let t = '<table id="' + id + '"><thead><tr>';
  for (const c of BOARD_COLS) t += sortTh(c, k, asc);
  t += "</tr></thead><tbody>";
  for (const r of rs) {
    t += "<tr>";
    for (const c of BOARD_COLS) t += '<td' + (c.n ? ' class="n"' : "") + ">" + c.fmt(r) + "</td>";
    t += "</tr>";
  }
  return t + "</tbody></table>";
}

/* 名札を3つの意味に分ける。
   🔴 **色だけで分類を伝えない。** 色覚によっては緋・山吹・紫が見分けられない。
      棒の右に分類の言葉も書くので、白黒に印刷しても読める。
   分類の規則をここ1か所に置いているのは、①と③で食い違わないようにするため。 */
function flagGroup(label) {
  if (label.indexOf("NPS") >= 0 || label.indexOf("退職") >= 0)
    return { color: C.hi, word: "関係が危ない" };
  if (label.indexOf("満了") >= 0 || label.indexOf("接触") >= 0)
    return { color: C.ki, word: "時間が迫っている" };
  return { color: C.murasaki, word: "成果が出ていない" };
}

function flagFig(D, subset) {
  /* subset を渡すと、絞り込んだ後の件数で数え直す。
     🔴 絞り込み中に全件の図を出すと、表と図で件数が食い違って読めなくなる。 */
  let fc = D.meta.flag_counts || [];
  if (subset) {
    const m = {};
    for (const r of subset) for (const f of (r.flags || [])) m[f] = (m[f] || 0) + 1;
    fc = Object.entries(m).map((e) => ({ label: e[0], n: e[1] }));
  }
  return fig("名札ごとの件数" + (subset ? "（絞り込んだ " + num(subset.length) + " 件）" : ""),
    "1つの案件に複数つきます",
    fc.length
      ? svgBarH({ w: 700, fmt: F.int, rh: 24,
          rows: fc.slice().sort((a, b) => b.n - a.n).map((x) => ({
            label: tail(x.label, 26), v: x.n, txt: num(x.n) + "件",
            note: flagGroup(x.label).word, color: flagGroup(x.label).color })) })
      : '<div class="empty">名札の付いた案件がありません。</div>',
    lg("box", C.hi, "関係が危ない") + lg("box", C.ki, "時間が迫っている") +
    lg("box", C.murasaki, "成果が出ていない") +
    '<i class="full">棒の右に分類の言葉も書いています。' +
    "<b>色が見分けられなくても読めます。</b></i>" +
    '<i class="full">' + esc(D.meta.order_rule) + "</i>");
}

/* ---------------------------------------------------------------- 3 今日動く先 */
function renderToday(D) {
  let h = sec("問い", "今日・今週、どこに連絡するか") +
    '<div class="lede">毎朝ここだけ見れば動ける長さに絞っています。' +
    "上から順に潰していってください。</div>";

  h += note("info", "絞った条件", esc(D.meta.filter_rule));

  const soon = D.expiring_this_week || [];
  h += '<div class="kpis">' +
    kpi("今日出す先", num(D.meta.n_shown) + '<span class="u">件</span>',
        "名札が2本以上ついた " + num(D.meta.n_hit) + " 件から", "bad") +
    kpi("今週満了する", num(soon.length) + '<span class="u">件</span>',
        "名札の本数に関わらず落としていません", "warn") +
    kpi("稼働中の全件", num(D.meta.n_active) + '<span class="u">件</span>',
        "全件は左の「案件の立ち位置」で") + "</div>";

  if (soon.length) {
    h += sec("表", "今週満了（" + num(soon.length) + " 件）");
    h += '<div class="lede">残り7日以内。名札の本数に関わらず出しています。</div>';
    h += scroll(boardTable(soon, { key: "days_left", asc: true }, "soon-tbl"), 320);
  }

  /* 🔴 図はこれ1つだけ。毎朝の画面なので、表が主役のままにする。
     件数の推移は作らない（スナップショットが無いので、作ると嘘になる）。 */
  h += sec("図", "何で上がってきたか（今日出す先 " + num(D.rows.length) + " 件の名札）");
  const fc = {};
  for (const r of D.rows) for (const f of (r.flags || [])) fc[f] = (fc[f] || 0) + 1;
  const fr = Object.entries(fc).sort((a, b) => b[1] - a[1]);
  h += fig("名札ごとの件数", "1つの案件に複数つきます",
    fr.length
      ? svgBarH({ w: 700, fmt: F.int, rh: 24,
          rows: fr.map(([label, n]) => ({
            label: tail(label, 26), v: n, txt: num(n) + "件",
            note: flagGroup(label).word, color: flagGroup(label).color })) })
      : '<div class="empty">名札の付いた案件がありません。</div>',
    lg("box", C.hi, "関係が危ない") + lg("box", C.ki, "時間が迫っている") +
    lg("box", C.murasaki, "成果が出ていない") +
    '<i class="full">棒の右に分類の言葉も書いています。' +
    "<b>色が見分けられなくても読めます。</b></i>" +
    '<i class="full">この24件だけの内訳です。稼働中の全件の内訳は' +
    "「案件」の中の「案件の立ち位置」にあります。" +
    "<b>件数の推移は出していません。</b>日ごとの記録を持っていないので、" +
    "作ると嘘になります。</i>");

  h += sec("表", "今日動く先（" + num(D.rows.length) + " 件）");
  h += scroll(boardTable(D.rows, { key: "n_flags", asc: false }, "today-tbl"), 640);
  h += note("info", "この並びについて", esc(D.meta.order_rule));
  return h + foot(D.meta);
}

/* ---------------------------------------------------------------- 2 案件の立ち位置 */
function renderBoard(D) {
  const shown = boardApply(D.rows);
  const on = boardFilterOn();
  /* 同じ表を①と②の両方で使う。問いだけ変える */
  const byOwner = cur.view === "byowner";
  if (byOwner) {
    let h = sec("問い", "この担当者は、どの案件を持っているか") +
      '<div class="lede">下の「担当」で選ぶと、その人の案件だけになります。' +
      "「②担当者の一覧」で名前を押しても同じところに来ます。</div>";
    h += boardFilterBar(D);
    if (!boardFilter.consultant) {
      h += note("info", "担当者を選んでください",
        "まだ誰も選んでいないので、稼働中 " + num(D.rows.length) +
        " 件をすべて出しています。担当者で絞ると、その人の持ち方が見えます。");
    }
    h += '<div class="count-line' + (on ? " on" : "") + '" id="board-count">' +
      "<b>" + num(D.rows.length) + " 件中 " + num(shown.length) + " 件</b>を表示" +
      (on ? "（絞り込み中: " + esc(boardFilterWords()) + "）" : "（絞り込みなし）") + "</div>";
    h += sec("図", "名札の分布");
    h += flagFig(D, on ? shown : null);
    h += sec("表", "この担当者の案件");
    h += shown.length
      ? scroll(boardTable(shown, boardSort, "board-tbl"), 640)
      : '<div class="empty">この条件に当てはまる案件はありません。' +
        "「絞り込みを外す」で戻せます。</div>";
    return h + foot(D.meta);
  }
  let h = sec("問い", "いま、それぞれの案件はどこにいるか") +
    '<div class="lede">稼働中 ' + num(D.rows.length) +
    " 件。<b>列の見出しを押すと並び替わります。</b>既定は名札の本数が多い順。" +
    "<b>担当・名札・満了までの期間・案件名で絞り込めます。</b></div>";
  h += note("info", "この並びについて", esc(D.meta.order_rule));

  h += boardFilterBar(D);
  /* 🔴 絞り込んだら、何件中の何件を見ているのかを必ず出す。
     絞ったことを忘れて「全件がこう見える」と読み違えるのを防ぐ。 */
  h += '<div class="count-line' + (on ? " on" : "") + '" id="board-count">' +
    "<b>" + num(D.rows.length) + " 件中 " + num(shown.length) + " 件</b>を表示" +
    (on ? "（絞り込み中: " + esc(boardFilterWords()) + "）" : "（絞り込みなし）") + "</div>";

  h += sec("図", "名札の分布");
  h += flagFig(D, on ? shown : null);
  h += sec("表", "案件の立ち位置");
  /* 🔴 14列あるので、枠に入れないと**ページ全体が横に流れる**
     （2026-09-22 実測: 1440px幅で document が 2640px になっていた）。
     表は枠の中だけで横スクロールさせる。 */
  h += shown.length
    ? scroll(boardTable(shown, boardSort, "board-tbl"), 640)
    : '<div class="empty">この条件に当てはまる案件はありません。' +
      "「絞り込みを外す」で戻せます。</div>";
  return h + foot(D.meta);
}

function wireBoard() {
  const redraw = () => {
    redrawMain(boardCache);
  };
  const pick = (id, key) => {
    const e = document.getElementById(id);
    if (e) e.onchange = () => { boardFilter[key] = e.value; redraw(); };
  };
  pick("bf-consultant", "consultant");
  pick("bf-flag", "flag");
  pick("bf-expiry", "expiry");
  const q = document.getElementById("bf-q");
  if (q) {
    /* 1文字ごとに 703 行を組み直すと重い。打ち終わってから当てる */
    let t = null;
    q.oninput = () => {
      clearTimeout(t);
      t = setTimeout(() => {
        boardFilter.q = q.value;
        redraw();
        const e = document.getElementById("bf-q");
        if (e) { e.focus(); e.setSelectionRange(e.value.length, e.value.length); }
      }, 260);
    };
  }
  const cl = document.getElementById("bf-clear");
  if (cl) cl.onclick = () => {
    boardFilter = { consultant: "", flag: "", expiry: "", q: "" };
    redraw();
  };
  document.querySelectorAll("#board-tbl th.sortable button.sort").forEach((th) => {
    th.onclick = () => {
      const kk = th.dataset.k;
      if (boardSort.key === kk) boardSort.asc = !boardSort.asc;
      else boardSort = { key: kk, asc: kk === "name" || kk === "consultant" ||
                                       kk === "days_left" || kk === "days_since_contact" };
      redrawMain(boardCache);
    };
  });
}
let boardCache = null;

/* ---------------------------------------------------------------- 5 調査と定義 */
/* 🔴 調査の成果は一度読めば済む。毎朝の動線から外して、ここに畳む。消さない。 */
/* ---------------------------------------------------------------- 担当の交代 */
/* 🔴 交代が良かったか悪かったかは判定しない。記録を並べるだけ。
   🔴 「誰から誰へ」でまとめない（`from`/`to` は読めば分かる列で、
      テスト用データでは1行1人に伏せてある。まとめると処理が素通りする）。 */
function renderHandover(D) {
  let h = sec("問い", "担当はいつ、どう替わったか") +
    '<div class="lede">1行1回の交代。<b>新しい順</b>に並べています。</div>';
  h += note("info", "この一覧の決まりごと",
    esc(D.source_rule) + "<br>" + esc(D.gap_rule));

  h += '<div class="kpis">' +
    kpi("記録された交代", num(D.meta.n) + '<span class="u">件</span>',
        "うち稼働中の案件 " + num(D.meta.n_active) + " 件") +
    kpi("退職者へ渡っている", num(D.to_retired) + '<span class="u">件</span>',
        "交代先が退職者だったもの", D.to_retired ? "bad" : "") +
    kpi("記録の遅れ（中央値）",
        D.median_gap_days == null ? DASH : num(D.median_gap_days) + '<span class="u">日</span>',
        "差が取れた " + num(D.n_gap) + " 件で") +
    "</div>";

  const rd = D.reflected_dist || [];
  h += sec("図", "HubSpot の担当者欄に反映されたか");
  h += fig("反映のされ方ごとの件数", "欄が直された経緯の内訳",
    rd.length
      ? svgBarH({ w: 680, fmt: F.int, rh: 24,
          rows: rd.slice().sort((a, b) => b.n - a.n).map((x) => ({
            label: tail(x.label, 26), v: x.n, txt: num(x.n) + "件",
            color: x.label.indexOf("なし") >= 0 ? C.hi : C.ai })) })
      : '<div class="empty">記録がありません。</div>',
    lg("box", C.hi, "反映されていない") + lg("box", C.ai, "反映されている") +
    '<i class="full">棒の左に経緯の言葉が書いてあります。' +
    "<b>色が見分けられなくても読めます。</b></i>");

  h += sec("表", "交代の記録（" + num(D.rows.length) + " 件）");
  h += scroll(table(
    [{ t: "交代日" }, { t: "案件" }, { t: "前の担当" }, { t: "次の担当" },
     { t: "いまの担当" }, { t: "記録の遅れ", n: 1 }, { t: "反映" }, { t: "状態" }],
    D.rows.map((r) => [
      esc(r.date) || DASH,
      esc(r.name || r.deal_id),
      esc(r.from) || DASH,
      esc(r.to) + (r.to_retired ? ' <span class="tag" style="color:var(--hi)">退職者</span>' : ""),
      esc(r.consultant) || DASH,
      r.record_gap_days == null ? DASH : num(r.record_gap_days) + "日",
      esc(r.reflected),
      r.is_active ? '<span class="tag e">稼働中</span>' : '<span class="tag d">決着済</span>',
    ])), 640);
  return h + foot(D.meta);
}

/* ---------------------------------------------------------------- 定義と検証 */
/* 🔴 ここに新しい主張を書かない。画面の他の場所に既に出ている決まりごとを、
   1か所で読めるようにまとめただけ。数字は出さない（数字は各画面が母数つきで出す）。 */
function renderDefs() {
  let h = sec("問い", "この画面の数字は、どうやって作っているか") +
    '<div class="lede">一度読めば済む話をここに置いています。' +
    "各画面にも同じ説明が母数つきで出ます。</div>";

  h += sec("表", "色と印の意味");
  h += table([{ t: "見た目" }, { t: "意味" }],
    [['<b style="display:inline-block;width:26px;height:10px;background:var(--ai)"></b>',
      "触れるところ・主系列"],
     ['<b style="display:inline-block;width:26px;height:10px;background:var(--hi)"></b> &#9650;',
      "まずい / 悪化"],
     ['<b style="display:inline-block;width:26px;height:10px;background:var(--ki)"></b>',
      "読むのに注意が要る"],
     ['<b style="display:inline-block;width:26px;height:10px;background:var(--midori)"></b> &#9660;',
      "良い / 改善"],
     ['<span class="n0">&#8212;</span>', "値が無い。<b>0 ではない</b>"],
     ["&#9675;", "未確定（右側打ち切り）。結果がまだ出ていない"]]);

  h += sec("表", "この画面が守っていること");
  h += table([{ t: "決まりごと" }, { t: "なぜ" }],
    [["分母が 0 のときは <b>0% と書かない</b>",
      "「1件中0件」と「0件中0件」は別のこと。後者は率が出せない"],
     ["すべての数字に<b>母数を添える</b>",
      "中央値だけ見せると、何件で作った値か分からない"],
     ["<b>n が 30 未満のものは図に載せない</b>",
      "少ない件数の差は、たまたまでも大きく振れる。表には残して印を添える"],
     ["未確定は<b>中空の印と破線</b>",
      "結果が出ていない契約を、出たものと同じ形で描かない"],
     ["<b>スコアや確率を出さない</b>",
      "契約開始時点の当たり具合は AUC 0.583。順位付けの根拠にならない"],
     ["<b>事業所をまたいで1本につながない</b>",
      "決裁が事業所単位なので、まとめると拠点差が時間の変化に見える"],
     ["<b>色だけで意味を伝えない</b>",
      "記号か文字を必ず添える。白黒に印刷しても読めるようにする"]]);

  h += sec("表", "3つの「いつ」は別物");
  h += table([{ t: "名前" }, { t: "何の時刻か" }],
    [["計算の基準日", "画面が「今日」として使う日付。サーバがその場で決める。<b>データの新しさとは無関係</b>"],
     ["シートの生成時刻", "スプレッドシートを作り直した時刻"],
     ["<b>元データの取得時刻</b>",
      "HubSpot / Zoom から落とした時刻。<b>画面の上に出ている「N日前」はこれで数えています</b>"]]);
  h += note("info", "なぜ3つ要るのか",
    "古い元データのままシートを作り直すと、<b>生成時刻だけが新しくなって中身は古いまま</b>に" +
    "なります。生成時刻を「データの新しさ」として出すと嘘になるので、分けています。");
  return h;
}

/* ================================================================ データの鮮度 */
/* 🔴 この画面は毎朝見るもの。**古いデータを新しいものと誤認させないのは画面の責任**。
   meta.today は「計算に使った基準日」で、シートを作り直した日時とは**別物**。
   シートは今のところ手で作り直しているので、基準日だけ今日になっていて
   中身は何日も前、ということが実際に起きる。だから作成日時のほうを主に出す。
   取れないときは「分かりません」と書く。推測で埋めない。 */
function setFresh(meta) {
  const box = document.getElementById("cs-fresh");
  if (!box) return;
  const src = meta && meta.source_as_of;      /* HubSpot から落とした時刻 */
  const srcAge = meta && meta.source_age_days;
  const gen = meta && meta.generated_at;      /* シートを作り直した時刻 */
  const base = meta && meta.today;            /* 計算に使った今日 */

  /* 🔴 取れないときは「分かりません」と書く。推測で埋めない */
  if (!src && !gen) {
    box.className = "fresh bad";
    box.innerHTML = "<b>このデータがいつのものか分かりません。</b>" +
      "作成日時を記録したシート（CS_メタ）が読めていません。" +
      "画面の数字が今日のものだと思わないでください。" +
      (base ? '　<span class="muted">計算の基準日 ' + esc(base) + "</span>" : "");
    return;
  }

  /* 何日前かは**元データを落とした時刻**で数える。
     古いデータを詰め直すとシートの生成時刻だけ新しくなるため。 */
  const age = srcAge != null ? srcAge : null;
  let word, cls;
  if (age == null)    { word = "";           cls = "warn"; }
  else if (age <= 0)  { word = "今日";       cls = "ok"; }
  else if (age === 1) { word = "昨日";       cls = "ok"; }
  else if (age <= 3)  { word = age + "日前"; cls = "warn"; }
  else                { word = age + "日前"; cls = "bad"; }
  box.className = "fresh " + cls;

  let h = "このデータは <b>" + (word ? word + "　" : "") +
    (src ? esc(src) : esc(gen)) + "</b> 時点のものです";
  h += src ? "（HubSpot から落とした時刻）。" : "（シートを作った時刻）。";
  if (age != null && age >= 4) {
    h += "<b>" + age + "日分の動きが入っていません。</b>";
  }
  h += '<br><span class="muted">';
  if (gen && src && gen.slice(0, 10) !== src.slice(0, 10)) {
    /* 🔴 3つの時刻は別物。混ぜないで並べる */
    h += "シートを作り直したのは " + esc(gen) + "（元データはそれより前のもの）。";
  } else if (gen) {
    h += "シートを作り直したのは " + esc(gen) + "。";
  }
  if (base) h += "計算の基準日は " + esc(base) + "（データの新しさとは別物）。";
  h += "更新は手で回しています（自動ではありません）。</span>";
  box.innerHTML = h;
}

/* ================================================================ 画面の並び

   上で3つ（案件 / コンサルタント / 集計）を選び、左のサイドバーで中の項目を選ぶ。
   1画面に出す選択肢を減らして、いまどこを見ているかを分かりやすくするため。

   🔴 **開いた項目だけ取りに行く。** 並べ替えただけで全部読むと重くなる。
   🔴 **折りたたみは使わない。** 左に並べば一望できるので、箱に隠す理由が無い。
   🔴 中身（図・表・数字）は前のまま。置き場所だけ変えている。
*/
const MENUS = [
  /* 🔴 ①の中は**粒度で分けてある**。同じ「顧客」でも、
     取引1件で見るのか / 事業所の契約の連なりで見るのか / 法人で拠点をまたいで見るのか で
     数字の意味が変わる。取り違えると読み間違えるので、画面を分けて粒度を明示する。 */
  { key: "deal", no: "\u2460", label: "案件",
    lead: "案件そのものを見る画面です。",
    views: [
      { key: "today",    label: "今日動く先",       path: "/api/consulting/today",
        render: (D) => renderToday(D) },
      { key: "board",    label: "案件そのもの",     path: "/api/consulting/deals",
        render: (D) => renderBoard(D) },
      { key: "series",   label: "継続を追いかける", path: "/api/consulting/customer",
        render: (D) => renderSeries(D) },
      { key: "houjin",   label: "法人番号で見る",   path: "/api/consulting/customer",
        render: (D) => renderHoujin(D) },
    ] },
  { key: "consultant", no: "\u2461", label: "コンサルタント",
    lead: "人の側から見る画面です。担当者の評価ではありません。",
    views: [
      { key: "team",     label: "担当者の一覧",     path: "/api/consulting/consultants",
        render: (D) => renderTeam(D) },
      { key: "byowner",  label: "担当者ごとの案件", path: "/api/consulting/deals",
        render: (D) => renderBoard(D) },
      { key: "handover", label: "担当の交代",       path: "/api/consulting/handover",
        render: (D) => renderHandover(D) },
    ] },
  { key: "study", no: "\u2462", label: "集計",
    lead: "調べた結果と定義です。一度読めば済む話をここに置いています。",
    views: [
      { key: "renewal", label: "継続回数 × 成果", path: "/api/consulting/renewal",
        render: (D) => renderRenewal(D) },
      { key: "outcome", label: "成果とリスク",     path: "/api/consulting/outcome",
        render: (D) => renderOutcome(D) },
      { key: "focus",   label: "いま見るべき顧客", path: "/api/consulting/focus",
        render: (D) => renderFocus(D) },
      { key: "rampup",  label: "立ち上がり",       path: "/api/consulting/rampup",
        render: (D) => renderRampup(D) },
      { key: "phone",   label: "電話",             path: "/api/consulting/phone",
        render: (D) => renderPhone(D) },
      { key: "mtgq",    label: "MTG の品質",       path: "/api/consulting/mtg-quality",
        render: (D) => renderMtgQ(D) },
      { key: "dq",      label: "データ品質",       path: "/api/consulting/data-quality",
        render: (D) => renderDq(D) },
      { key: "defs",    label: "定義と検証",       path: null,
        render: () => renderDefs() },
    ] },
];

/* いま見ているところ。既定は「案件 → 今日動く先」。毎朝いちばん見るもの */
let cur = { menu: "deal", view: "today" };
const loaded = {};
/* いま出している項目のデータ。チェックや絞り込みで描き直すときに使う */
let lastPayload = null;

const menuOf = (k) => MENUS.find((m) => m.key === k);
/* 法人を選んで見る項目。🔴 2つあるので、片方だけ直して取りこぼさないよう1か所で判定する */
const isCustView = (k) => k === "series" || k === "houjin";
const viewOf = (m, v) => (menuOf(m) || MENUS[0]).views.find((x) => x.key === v);

/* ---------------------------------------------------------------- 上のメニュー */
function drawMenu() {
  const nav = document.getElementById("cs-menu");
  nav.innerHTML = MENUS.map((m) =>
    '<button type="button" data-m="' + m.key + '"' +
    (m.key === cur.menu ? ' class="on" aria-current="page"' : "") + ">" +
    '<span class="no">' + m.no + "</span>" + esc(m.label) + "</button>").join("");
  nav.querySelectorAll("button").forEach((b) => {
    b.onclick = () => go(b.dataset.m, null);
  });
}

/* ---------------------------------------------------------------- 左のサイドバー */
function drawSide() {
  const m = menuOf(cur.menu);
  const box = document.getElementById("cs-side");
  box.innerHTML = "<h2>" + esc(m.label) + "の中</h2><ul>" +
    m.views.map((v, i) =>
      "<li><button type=\"button\" data-v=\"" + v.key + "\"" +
      (v.key === cur.view ? ' aria-current="page"' : "") + ">" +
      esc(v.label) + '<span class="n" aria-hidden="true">' + (i + 1) +
      "</span></button></li>").join("") +
    "</ul>";
  box.querySelectorAll("button").forEach((b) => {
    b.onclick = () => go(cur.menu, b.dataset.v);
  });
}

/* ---------------------------------------------------------------- 移動
   view を省いたら、そのメニューの先頭（＝既定）を開く */
function go(menu, view, refresh) {
  const m = menuOf(menu) || MENUS[0];
  const v = (view && viewOf(m.key, view)) || m.views[0];
  /* 🔴 ①「案件の立ち位置」は全件を見る場所。②から担当で絞った状態を
     持ち越すと、絞っていることに気づかないまま全件だと思い込む。
     ①へ入るときは担当の絞り込みだけ外す（名札・期間・検索は残す）。 */
  if (m.key === "deal" && v.key === "board") boardFilter.consultant = "";
  cur = { menu: m.key, view: v.key };
  /* URL に残す。共有と戻るボタンのため */
  const hash = "#" + m.key + "/" + v.key;
  if (location.hash !== hash) history.replaceState(null, "", hash);
  drawMenu();
  drawSide();
  window.scrollTo(0, 0);
  load(refresh);
}

/* 開いたときの位置を URL から決める。無ければ既定 */
function fromHash() {
  const p = (location.hash || "").replace(/^#/, "").split("/");
  const m = menuOf(p[0]);
  if (!m) return { menu: "deal", view: "today" };
  const v = viewOf(m.key, p[1]);
  return { menu: m.key, view: (v || m.views[0]).key };
}

/* ================================================================ 取得 */
function showError(e) {
  const box = document.getElementById("cs-error");
  box.style.display = "";
  box.innerHTML = '<div class="err">データを取得できませんでした。\n' + esc(e.message) + "</div>";
}

async function load(refresh) {
  const v = viewOf(cur.menu, cur.view);
  const main = document.getElementById("cs-main");
  document.getElementById("cs-error").style.display = "none";

  /* API を持たない項目（定義と検証）はその場で描く */
  if (!v.path) {
    main.innerHTML = ctlbar(v, {}) + v.render();
    wire(v);
    return;
  }

  const q = new URLSearchParams();
  if (refresh) q.set("refresh", "1");
  const censor = document.getElementById("cs-censor");
  if (cur.view === "renewal" && censor && censor.checked) q.set("exclude_right_censored", "1");
  if (isCustView(cur.view) && customerHoujin) q.set("houjin", customerHoujin);

  main.innerHTML = '<div class="loading">読み込み中…</div>';
  try {
    const res = await fetch(v.path + "?" + q.toString(), { credentials: "same-origin" });
    const body = await res.json();
    /* サーバは失敗を空配列にすり替えない。error が立っていれば中身を出す */
    if (!res.ok || body.error) throw new Error(body.message || "HTTP " + res.status);
    if (cur.view === "team") teamCache = body;
    if (cur.view === "board" || cur.view === "byowner") boardCache = body;
    lastPayload = body;   /* 絞り込みで描き直すときに使う。取り直しはしない */
    setFresh(body.meta || {});
    main.innerHTML = ctlbar(v, body) + v.render(body);
    wire(v);
    loaded[cur.menu + "/" + cur.view] = true;
  } catch (e) {
    main.innerHTML = "";
    showError(e);
  }
}

/* 項目ごとの操作列。「継続回数 × 成果」は右側打ち切りの切り替え、
   「顧客ごとに見る」は法人の選択 */
function ctlbar(v, D) {
  let h = '<div class="ctlbar">';
  if (v.key === "renewal") {
    h += '<label class="act"><input type="checkbox" id="cs-censor">' +
      "右側打ち切りを代表値から外す（結果がまだ確定していない直近の契約）</label>";
  }
  if (isCustView(v.key)) h += '<select id="cs-houjin" class="act"></select>';
  if (v.path) h += '<button type="button" class="act" id="cs-reload">読み直す</button>';
  if (D && D.meta && D.meta.all_cached) h += '<span class="muted small">キャッシュから表示</span>';
  return h + "</div>";
}

function wire(v) {
  if (v.key === "team") wireTeam();
  if (v.key === "board" || v.key === "byowner") wireBoard();
  if (v.key === "series") wireSeries();
  if (v.key === "houjin") wireHoujin();
  const rl = document.getElementById("cs-reload");
  if (rl) rl.onclick = () => load(true);
  const sel = document.getElementById("cs-houjin");
  if (sel && customerIndex) {
    sel.innerHTML = '<option value="">法人を選ぶ…</option>' + customerIndex.slice(0, 400).map((r) =>
      '<option value="' + esc(r.houjin) + '">' + esc(r.name || r.houjin) +
      "（取引" + num(r.deals) + " / 拠点" + num(r.sites) + "）</option>").join("");
    /* 差し込み直しでも選んだ法人が残るようにする */
    if (customerHoujin) sel.value = customerHoujin;
  }
  const cz = document.getElementById("cs-censor");
  if (cz) cz.onchange = () => load(false);
  const hj = document.getElementById("cs-houjin");
  if (hj) hj.onchange = () => { customerHoujin = hj.value; load(false); };
}

/* 「継続を追いかける」の拠点選択 */
function wireSeries() {
  const st = document.getElementById("cs-site");
  if (st) st.onchange = () => { seriesSite = st.value; redrawMain(lastPayload); };
}

/* 「法人番号で見る」のチェックと、本部アプローチの遅延読み */
function wireHoujin() {
  const redraw = () => redrawMain(lastPayload);
  document.querySelectorAll("#hj-pick input[type=checkbox]").forEach((cb) => {
    cb.onchange = () => { houjinPick[cb.dataset.d] = cb.checked; redraw(); };
  });
  const setAll = (on) => {
    (lastPayload.deals || []).forEach((d) => { houjinPick[d.deal_id] = on; });
    redraw();
  };
  const a = document.getElementById("hj-all");
  if (a) a.onclick = () => setAll(true);
  const n = document.getElementById("hj-none");
  if (n) n.onclick = () => setAll(false);

  /* 本部アプローチは別のデータ。この項目を開いたときだけ取りに行く */
  const box = document.getElementById("hq-box");
  if (!box) return;
  if (hqCache) { box.innerHTML = renderHq(hqCache); return; }
  fetch("/api/consulting/headquarters", { credentials: "same-origin" })
    .then((r) => r.json())
    .then((body) => {
      if (body.error) throw new Error(body.message || "取得できません");
      hqCache = body;
      const b2 = document.getElementById("hq-box");
      if (b2) b2.innerHTML = renderHq(body);
    })
    .catch((e) => {
      const b2 = document.getElementById("hq-box");
      if (b2) b2.innerHTML = '<div class="err">' + esc(e.message) + "</div>";
    });
}
let hqCache = null;

/* 戻る・進むでも同じところへ */
window.addEventListener("hashchange", () => {
  const h = fromHash();
  if (h.menu !== cur.menu || h.view !== cur.view) go(h.menu, h.view);
});

/* 開いた時点で URL にも位置を残す。そのまま貼れば同じ場所が開く */
(() => { const h = fromHash(); go(h.menu, h.view); })();
</script>
