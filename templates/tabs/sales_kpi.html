<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>営業KPI 現場版</title>
<script>
// 前に「暗い画面」を選んだ人だけ、描画される前に暗くする。
// 🔴 CSS より先・body より先に置くこと。後ろに置くと、明るい画面が一瞬映ってから
//    暗くなる（ちらつく）。既定は明るいので、選んでいない人はここで何もしない。
var THEME_KEY='salesKpi.theme.v1';
try{ if(localStorage.getItem(THEME_KEY)==='dark'){
  document.documentElement.setAttribute('data-theme','dark'); } }catch(e){}

// 切り替えボタンの配線もここでやる。
// 🔴 データを読む処理の中に置かない。シートが読めないと 503 で処理が止まり、
//    ボタンが死ぬ（実際そうなっていた。エラー画面のまま明暗も変えられない）。
//    表示の切り替えはデータと関係ないので、データの成否に巻き込まれない場所に置く。
document.addEventListener('DOMContentLoaded',function(){
  var b=document.getElementById('tt');
  if(!b) return;
  b.onclick=function(){
    var dark=document.documentElement.getAttribute('data-theme')==='dark';
    var next=dark?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem(THEME_KEY,next);}catch(e){}
  };
});
</script>
<style>
:root{
  color-scheme:light;
  --bg:#f4f5f7; --card:#fff; --border:#e4e7eb;
  --text:#1b2330; --sub:#707a89; --faint:#9aa3af;
  --accent:#2f6df6; --accent-soft:#ecf2ff;
  --alert:#e0473e; --alert-soft:#fdeceb;
  --warn:#e08a1e; --warn-soft:#fdf4e6;
  --ok:#18a957; --ok-soft:#eaf7ef;
  --shadow:0 1px 3px rgba(20,30,50,.07),0 1px 2px rgba(20,30,50,.04);
}
/* 🔴 明るい画面が既定。OSがダークでも、この画面は明るいまま開く。
   （2026-09-10 ユーザー指示「標準は明るくしてほしい」）
   暗くしたい人は右上のボタンで切り替える。選択はブラウザに残るので、
   一度押せば次からその人の画面だけ暗いまま開く。
   ここに @media (prefers-color-scheme:dark) を足すと、OSの設定が既定に戻る。 */
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#12141a; --card:#1a1d24; --border:#2b2f38;
  --text:#e8ebef; --sub:#9aa3af; --faint:#6d7684;
  --accent:#5b8dff; --accent-soft:#1c2740;
  --alert:#ef5f56; --alert-soft:#3a1f1d;
  --warn:#eda63c; --warn-soft:#33280f;
  --ok:#2fbd6d; --ok-soft:#12291c;
  --shadow:0 1px 3px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg); color:var(--text);
  font-family:system-ui,-apple-system,"Segoe UI","Yu Gothic UI","Hiragino Sans",Meiryo,sans-serif;
  font-size:15px; line-height:1.7; -webkit-font-smoothing:antialiased}
.wrap{max-width:920px; margin:0 auto; padding:20px 16px 90px; min-width:0; overflow-x:hidden}
header{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; flex-wrap:wrap}
h1{font-size:21px; margin:0 0 3px; font-weight:700}
.range{font-size:13px; color:var(--sub); margin:0}
.hbtn{background:var(--card); color:var(--sub); border:1px solid var(--border);
  border-radius:8px; padding:6px 12px; font-size:13px; cursor:pointer; font-family:inherit}
.hbtn:hover{border-color:var(--accent); color:var(--accent)}
.filters{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin:16px 0 4px}
.chiprow{display:flex; gap:7px; flex-wrap:wrap}
.chip{background:var(--card); border:1px solid var(--border); color:var(--sub);
  border-radius:999px; padding:7px 15px; font-size:14px; cursor:pointer; font-family:inherit}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
select{background:var(--card); color:var(--text); border:1px solid var(--border);
  border-radius:8px; padding:7px 11px; font-size:14px; font-family:inherit; max-width:100%}
select:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.scope{font-size:12.5px; color:var(--faint); margin:0 0 20px}
h2{font-size:17px; margin:30px 0 3px; font-weight:700}
.lead{font-size:13.5px; color:var(--sub); margin:0 0 12px}
.cards{display:grid; grid-template-columns:repeat(auto-fit,minmax(168px,1fr)); gap:11px}
.c{background:var(--card); border:1px solid var(--border); border-radius:10px;
  padding:14px 16px; box-shadow:var(--shadow); text-align:left; font-family:inherit;
  color:inherit; width:100%}
button.c{cursor:pointer; transition:border-color .12s}
button.c:hover{border-color:var(--accent)}
button.c:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.c .lab{font-size:13px; color:var(--sub)}
.c .v{font-size:32px; font-weight:700; line-height:1.2; margin:1px 0 0; font-variant-numeric:tabular-nums}
.c .v small{font-size:15px; font-weight:500; color:var(--sub); margin-left:2px}
.c .hint{font-size:12.5px; color:var(--faint); margin-top:1px}
.c .sub2{font-size:12px; color:var(--sub); margin-top:3px}
/* 「1人あたり」。主役の数字を邪魔しないよう、いちばん薄く小さく置く */
.c .avg{font-size:11.5px; color:var(--faint); margin-top:3px; font-variant-numeric:tabular-nums}
.c .open{font-size:12.5px; color:var(--accent); font-weight:600; margin-top:5px}
.c.alert{border-color:var(--alert); background:var(--alert-soft)}
.c.alert .lab,.c.alert .v{color:var(--alert)}
.c.warn{border-color:var(--warn); background:var(--warn-soft)}
.c.warn .lab{color:var(--warn)}
.c.ok{border-color:var(--ok); background:var(--ok-soft)}
.c.ok .lab,.c.ok .v{color:var(--ok)}
.wow{font-size:12px; font-variant-numeric:tabular-nums; margin-top:3px}
.bar{display:flex; height:30px; border-radius:6px; overflow:hidden; margin:4px 0 8px}
.blegend{display:flex; flex-wrap:wrap; gap:14px; font-size:12.5px; color:var(--sub)}
.blegend i{display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; font-style:normal}
.list{display:flex; flex-direction:column; gap:8px; margin-top:10px}
.item{display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit;
  background:var(--card); border:1px solid var(--border); border-radius:10px;
  padding:12px 15px; box-shadow:var(--shadow); transition:border-color .12s}
.item:hover{border-color:var(--accent)}
.item:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.item .d{font-size:12.5px; color:var(--sub); white-space:nowrap; min-width:86px; font-variant-numeric:tabular-nums}
.item .d b{display:block; font-size:14.5px; color:var(--text); font-weight:700}
.item .nm{flex:1; min-width:0; font-size:14.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.item .who{font-size:12.5px; color:var(--sub); white-space:nowrap}
.item .go{font-size:12.5px; color:var(--accent); white-space:nowrap; font-weight:600}
.item.stale{border-left:4px solid var(--alert)}
.item.done{opacity:.5}
.item.done .nm{text-decoration:line-through; text-decoration-color:var(--faint)}
.day{font-size:12.5px; color:var(--sub); font-weight:700; margin:14px 0 6px}
.empty{background:var(--card); border:1px dashed var(--border); border-radius:10px;
  padding:20px; text-align:center; color:var(--sub); font-size:14px}
.empty b{color:var(--ok)}
.more{background:none; border:0; color:var(--accent); font-size:14px; cursor:pointer;
  padding:10px 0; font-family:inherit; font-weight:600}
.panel{margin-top:12px}
.panel.hide{display:none}
.ph{display:flex; align-items:center; justify-content:space-between; gap:12px}
.ph b{font-size:15px}
.close{background:none; border:0; color:var(--sub); font-size:13px; cursor:pointer; font-family:inherit}
table{border-collapse:collapse; width:100%; font-size:13.5px; margin-top:6px}
th,td{padding:7px 10px; text-align:left; border-bottom:1px solid var(--border)}
th{font-size:12px; color:var(--sub); font-weight:600; white-space:nowrap}
td.n,th.n{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
/* 列が何を数えたものかを、見出しの下に小さく添える */
.sm{display:block; font-size:11px; font-weight:400; color:var(--faint)}
th.grp{text-align:center; color:var(--accent); background:var(--accent-soft)}
/* 担当者のチェックボックス。110名を出すので、詰めて置く */
.pick{background:var(--card); border:1px solid var(--border); border-radius:10px;
  padding:14px 16px; box-shadow:var(--shadow); margin-top:10px}
.pick .grp2{margin-top:12px}
.pick .grp2:first-of-type{margin-top:4px}
.pick .gh{display:flex; align-items:center; gap:10px; margin-bottom:5px}
.pick .gh b{font-size:13.5px}
.pick .gh .n{font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums}
.pick .who2{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:2px 14px}
.pick label{display:flex; align-items:center; gap:7px; font-size:13px; cursor:pointer;
  padding:2px 0; min-width:0}
.pick label span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.pick label.off span{color:var(--faint); text-decoration:line-through}
.pick input{accent-color:var(--accent); flex:none}
.pick .mini{background:none; border:0; color:var(--accent); font-size:12px; cursor:pointer;
  font-family:inherit; padding:0}
.tw{overflow:auto; max-height:420px; max-width:100%}
.c{min-width:0}
.cards{min-width:0}
.tip{position:fixed; pointer-events:none; z-index:99; background:var(--card); color:var(--text);
  border:1px solid var(--border); border-radius:6px; padding:7px 10px; font-size:12.5px;
  box-shadow:var(--shadow); opacity:0; transition:opacity .1s; max-width:260px}
.tip b{display:block; margin-bottom:3px}
.tip .row{display:flex; justify-content:space-between; gap:14px; font-variant-numeric:tabular-nums}
.axis-l{font-size:10px; fill:var(--faint)}
.chartbox{overflow-x:auto; max-width:100%}
.chartbox>svg{min-width:620px}
@media(min-width:900px){.chartbox>svg{min-width:0}}
.foot{margin-top:36px; padding-top:16px; border-top:1px solid var(--border);
  font-size:12px; color:var(--faint); line-height:1.9}
@media(max-width:540px){
  .item{flex-wrap:wrap; gap:5px 12px}
  .item .nm{flex-basis:100%; order:3}
  .item .go{margin-left:auto}
}
.loadstate{background:var(--card); border:1px solid var(--border); border-radius:10px;
  padding:16px 18px; margin:16px 0; color:var(--sub); font-size:14px; box-shadow:var(--shadow)}
.loadstate.err{border-color:var(--alert); background:var(--alert-soft); color:var(--alert)}
.loadstate.err b{display:block; margin-bottom:4px}
.loadstate .hint{color:var(--sub); font-size:12.5px}
.backlink{font-size:13px; color:var(--sub); text-decoration:none}
.backlink:hover{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
<div class="loadstate" id="loadstate">データを読み込んでいます…</div>

<header>
  <div>
    <h1>営業KPI</h1>
    <p class="range" id="range"></p>
  </div>
  <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap">
    <a class="backlink" href="/">← ダッシュボードへ戻る</a>
    <button class="hbtn" id="tt">◐ 表示切替</button>
  </div>
</header>

<div class="filters">
  <div class="chiprow" id="teams"></div>
  <select id="person"><option value="">個人で見る…</option></select>
  <button class="hbtn" id="pickbtn">担当者を選ぶ</button>
  <span id="pickcount" style="font-size:12.5px"></span>
</div>
<div class="pick" id="pickpanel" hidden></div>
<p class="scope" id="scope"></p>

<h2>今月の成績</h2>
<p class="lead">商談の予定日が過ぎたものだけで数えています（今日の商談はまだ終わっていないので入れません）。<br><span id="bporule"></span></p>
<p class="scope" id="scope2" style="margin:-8px 0 12px"></p>
<div class="cards" id="cards1"></div>

<h2>いま手を打てること</h2>
<p class="lead">数字を押すと、中身の一覧が開きます。そのままHubSpotを開けます。</p>
<div class="cards" id="cards2"></div>
<div class="panel hide" id="panel"></div>

<h2>架電</h2>
<p class="lead" id="lead3"></p>
<div class="chiprow" id="callperiod" style="margin-bottom:11px"></div>
<div class="cards" id="cards3"></div>
<div id="kadenbar"></div>

<h2>架電リストの残り</h2>
<p class="lead" id="lead3b"></p>
<div class="cards" id="cards3b"></div>
<div id="listbar"></div>

<h2>先週との比べ方</h2>
<p class="lead" id="lead4"></p>
<div class="chiprow" id="snapmode" style="margin-bottom:11px"></div>
<div id="snapbox"></div>

<div class="foot" id="foot"></div>
</div>


<script>
(async function(){
const box=document.getElementById('loadstate');
let D;
try{
  const url='/api/sales-kpi/data'+(location.search.includes('refresh=1')?'?refresh=1':'');
  const res=await fetch(url,{headers:{Accept:'application/json'},credentials:'same-origin'});
  const text=await res.text();
  if(!res.ok){
    let why=text.slice(0,400);
    try{const j=JSON.parse(text); why=(j.message||why)+(j.sheet?'（シート: '+j.sheet+'）':'');}catch(e){}
    throw new Error('サーバが '+res.status+' を返しました。'+why);
  }
  D=JSON.parse(text);
}catch(err){
  box.className='loadstate err';
  box.innerHTML='<b>データを読み込めませんでした。</b><br>'+String(err.message||err)+
    '<br><span class="hint">スプレッドシートの KPI営業_ シートが揃っているか、'+
    'GAS の sales_kpi_sync が動いているかを確認してください。</span>';
  return;
}
box.remove();
const $=id=>document.getElementById(id);
const WD=['日','月','火','水','木','金','土'];
const fmt=n=>(n==null?'—':n.toLocaleString('ja-JP'));
const pct=n=>(n==null?'—':n.toFixed(1)+'%');
let team='すべて', person='', openKey=null, weekOpen=false, callPeriod='this_week';
// 週次表をどちらの数え方で見るか。既定は「その週の商談」（週次表として自然なので）。
// 'month' は当月の累積で、月初にゼロから数え直しになる。
let snapMode='week';

// 明暗の切り替えはここには無い。<head> の先頭で配線している。
// データが読めなくてもボタンは効く必要があるため（→ head のコメント）。

const md=s=>{const d=new Date(s+'T00:00:00+09:00');return (d.getMonth()+1)+'/'+d.getDate();};
const wd=s=>WD[new Date(s+'T00:00:00+09:00').getDay()];
const ago=s=>Math.round((new Date(D.generated_at+'T00:00:00+09:00')-new Date(s+'T00:00:00+09:00'))/86400000);

$('bporule').innerHTML='<b>内 BPO</b> は「BPOアポ取得日」がその期間にあるものです。'+
  'このプロパティは<b>過去のBPOアポの日付が残り続ける</b>ため、値の有無では判定できません'+
  '（今月の商談で言うと、値があるのは200件ですが、そのうち当月・前月に取ったものは129件です）。';
$('range').textContent='2026年9月　／　今週 '+md(D.week.start)+'（'+wd(D.week.start)+'）〜'+
  md(D.week.end)+'（'+wd(D.week.end)+'）　※'+D.generated_at+' 時点';

['すべて'].concat(D.teams).forEach(t=>{
  const b=document.createElement('button');
  b.className='chip'+(t===team?' on':''); b.textContent=t;
  b.onclick=()=>{team=t;person='';openKey=null;syncPerson();
    [...$('teams').children].forEach(c=>c.classList.toggle('on',c.textContent===t));render();};
  $('teams').appendChild(b);
});
// ---- 担当者を外す（この画面だけの絞り込み）---------------------------------
//
// 🔴 スプレッドシートの `KPI営業_集計除外` とは**別物**。
//    あちらは全員の画面に効く恒久的な設定。こちらは見ている人の手元だけの
//    一時的な絞り込みで、サーバには送らない（localStorage に置く）。
//    混ざらないよう、画面でも別の場所・別の言い方にしてある。
const HIDE_KEY='salesKpi.hidden.v1';
let hidden=new Set();
try{hidden=new Set(JSON.parse(localStorage.getItem(HIDE_KEY)||'[]'));}catch(e){}
function saveHidden(){
  // プライベートモード等で localStorage が使えなくても画面は動く（保存されないだけ）
  try{localStorage.setItem(HIDE_KEY,JSON.stringify([...hidden]));}catch(e){}
}
// ownerId → チーム。by_person を足し直すのに何度も引くので先に作る。
const TEAM_OF={}; D.people.forEach(p=>{TEAM_OF[p.id]=p.team;});
const isSalesTeam=t=>!!t&&t!=='チーム未設定';

// 🔴 チーム別の合計はサーバも返しているが、**使わずに by_person から足し直す**。
//    そうしないとチェックを外した人がチームの合計に残ってしまう。
//    足し直した値がサーバの by_team と完全に一致することは実データで確認済み
//    （商談・架電リスト・架電の全期間で差 0。2026-09-08）。
function sumIf(byPerson, ok){
  const o={};
  for(const id in (byPerson||{})){
    if(hidden.has(id)||!ok(id)) continue;
    const v=byPerson[id];
    for(const k in v) o[k]=(o[k]||0)+v[k];
  }
  return o;
}
// いま選んでいる範囲（チップ・プルダウン・チェックボックス）で足す。
const sumScope=byPerson=>sumIf(byPerson,
  id=>person? id===person : (team==='すべて'||TEAM_OF[id]===team));
// チーム（全社なら全チーム）で足す。個人の選択は見ない（平均の分子に使う）。
const sumTeam=(byPerson,teamName)=>sumIf(byPerson,
  id=>!teamName||TEAM_OF[id]===teamName);

// 所属の見せ方。営業の名簿に載っていない人（BPO・他部署）は「チーム未設定」に
// なるが、それだけでは誰なのか分からないので HubSpot 側のチーム名を添える。
const teamLabel=p=>(!p?'':p.team+((p.team==='チーム未設定'&&p.hsTeam)?'・'+p.hsTeam:''));
function syncPerson(){
  const sel=$('person'); sel.innerHTML='<option value="">個人で見る…</option>';
  D.people.filter(p=>!hidden.has(p.id)&&(team==='すべて'||p.team===team)).forEach(p=>{
    const o=document.createElement('option'); o.value=p.id;
    o.textContent=p.name+(team==='すべて'?'（'+teamLabel(p)+'）':'');
    sel.appendChild(o);});
  sel.value=person;
}
syncPerson();
$('person').onchange=e=>{person=e.target.value;openKey=null;render();};

// ---- 担当者のチェックボックス ---------------------------------------------
//
// 110名いるので、たたんでおいてチームごとにまとめる。
// チームの見出しのチェックでそのチームをまとめて入り切りできる。
function drawPick(){
  const box=$('pickpanel'); box.innerHTML='';
  const head=document.createElement('div'); head.className='ph';
  head.innerHTML='<b>数字に入れる担当者</b>';
  const rst=document.createElement('button'); rst.className='close'; rst.textContent='全部戻す';
  rst.onclick=()=>{hidden.clear();saveHidden();syncPerson();drawPick();render();};
  head.appendChild(rst); box.appendChild(head);
  const note=document.createElement('p'); note.className='lead';
  note.innerHTML='チェックを外した人は、この画面の数字から抜けます。'+
    '<b>あなたのブラウザにだけ残ります</b>（他の人の画面は変わりません）。'+
    '<br><span style="color:var(--faint)">全員に効かせたいときは、'+
    'スプレッドシートの KPI営業_集計除外 を使ってください。</span>';
  box.appendChild(note);

  const byTeam={};
  D.people.forEach(p=>{(byTeam[p.team]=byTeam[p.team]||[]).push(p);});
  // 営業チームを先に、「チーム未設定」（77名と長い）を最後に。
  // そうしないと、よく使う営業チームが画面の下に押し出される。
  const order=Object.keys(byTeam).sort((a,b)=>
    (isSalesTeam(b)-isSalesTeam(a))||a.localeCompare(b,'ja'));
  order.forEach(t=>{
    const list=byTeam[t].slice().sort((a,b)=>a.name.localeCompare(b.name,'ja'));
    const on=list.filter(p=>!hidden.has(p.id)).length;
    const g=document.createElement('div'); g.className='grp2';
    const gh=document.createElement('div'); gh.className='gh';
    const all=document.createElement('input'); all.type='checkbox';
    all.checked=on>0; all.indeterminate=on>0&&on<list.length;
    all.onchange=()=>{list.forEach(p=>{if(all.checked)hidden.delete(p.id);else hidden.add(p.id);});
      if(person&&hidden.has(person)){person='';}
      saveHidden();syncPerson();drawPick();render();};
    const lb=document.createElement('b'); lb.textContent=t;
    const cnt=document.createElement('span'); cnt.className='n';
    cnt.textContent=on+' / '+list.length+'名';
    gh.appendChild(all); gh.appendChild(lb); gh.appendChild(cnt); g.appendChild(gh);
    const w=document.createElement('div'); w.className='who2';
    list.forEach(p=>{
      const l=document.createElement('label');
      if(hidden.has(p.id)) l.className='off';
      const cb=document.createElement('input'); cb.type='checkbox'; cb.checked=!hidden.has(p.id);
      cb.onchange=()=>{if(cb.checked)hidden.delete(p.id);else hidden.add(p.id);
        if(person===p.id&&!cb.checked)person='';
        saveHidden();syncPerson();drawPick();render();};
      const sp=document.createElement('span'); sp.textContent=p.name;
      sp.title=p.name+'（'+teamLabel(p)+'）';
      l.appendChild(cb); l.appendChild(sp); w.appendChild(l);});
    g.appendChild(w); box.appendChild(g);});
}

function agg(){ return sumScope(D.by_person); }
const pick=rows=>rows.filter(r=>
  !hidden.has(r.owner)&&
  (person? r.owner===person : (team==='すべて'||r.team===team)));

// ---- 「1人あたり」の出し方 -------------------------------------------------
//
// 分母は**画面に出ている人数**（そのチームで選べる人の数）にしている。
// 🔴 名簿の人数で割るのと同じ結果になることを実データで確かめた（2026-09-07）。
//    伊壺 7/7・平田 9/9・櫻井 8/8・野中 5/5・野口 4/4 で完全に一致する。
//    一致しないのは「チーム未設定」だけで、名簿側は 376名（退職者271名を含む）
//    なのに対し画面に出るのは 77名。名簿で割ると意味を成さないので、
//    どちらでも同じになる方＝画面に出ている人数を採る。
//    分母が分かるよう、人数はそのまま画面に出す。
// チェックを外した人は分母からも抜く（見ていない人を頭数に入れない）。
const headOf=t=>D.people.filter(p=>p.team===t&&!hidden.has(p.id)).length;

// 誰と比べるか。個人を選んでいるときは「その人のチーム」を相手にする
// （自分の数字と並べて見られるようにするため）。
function avgBase(){
  if(person){
    const p=D.people.find(x=>x.id===person);
    if(!p) return null;
    return {label:p.team+' の平均', team:p.team, n:headOf(p.team)};
  }
  if(team!=='すべて') return {label:'1人あたり', team:team, n:headOf(team)};
  return {label:'1人あたり', team:null, n:D.people.filter(p=>!hidden.has(p.id)).length};
}
// 平均の1行。件数のカードにだけ付ける（率のカードに平均は意味を成さない）。
function avgLine(ab, total, unit){
  if(!ab||!ab.n) return '';
  return ab.label+' '+(total/ab.n).toFixed(1)+(unit||'件')+
         '<span style="opacity:.75">（'+ab.n+'名）</span>';
}

function itemEl(r,opt){
  opt=opt||{};
  const a=document.createElement('a');
  a.className='item'+(opt.stale?' stale':'')+(opt.done?' done':'');
  a.href=r.url; a.target='_blank'; a.rel='noopener noreferrer';
  const d=document.createElement('div'); d.className='d';
  const sub=opt.stale?(ago(r.date)+'日前'):(opt.days?(r.days+'日'):(r.time||''));
  d.innerHTML='<b>'+(r.date?md(r.date)+'（'+wd(r.date)+'）':'—')+'</b>'+(sub?'<span>'+sub+'</span>':'');
  const nm=document.createElement('div'); nm.className='nm'; nm.textContent=r.name;
  const who=document.createElement('div'); who.className='who'; who.textContent=r.ownerName;
  const go=document.createElement('div'); go.className='go'; go.textContent='HubSpotを開く ›';
  a.appendChild(d);a.appendChild(nm);a.appendChild(who);a.appendChild(go);
  return a;
}
const listOf=(rows,opt)=>{const w=document.createElement('div');w.className='list';
  rows.forEach(r=>w.appendChild(itemEl(r,opt)));return w;};

function cardEl(o){
  const c=document.createElement(o.onClick?'button':'div');
  c.className='c'+(o.tone?' '+o.tone:'');
  let h='<div class="lab">'+o.lab+'</div><div class="v">'+
    (o.pct?pct(o.val):fmt(o.val))+(o.unit?'<small>'+o.unit+'</small>':'')+'</div>';
  if(o.hint)h+='<div class="hint">'+o.hint+'</div>';
  if(o.sub2)h+='<div class="sub2">'+o.sub2+'</div>';
  if(o.avg)h+='<div class="avg">'+o.avg+'</div>';
  if(o.wow)h+=o.wow;
  if(o.onClick)h+='<div class="open">'+(openKey===o.key?'閉じる ▲':'一覧を見る ▾')+'</div>';
  c.innerHTML=h;
  if(o.onClick)c.onclick=o.onClick;
  return c;
}
function wowEl(now,prev,unit,invert){
  if(prev==null) return '';
  const d=now-prev; if(!d) return '<div class="wow" style="color:var(--faint)">先週と同じ</div>';
  const good=invert?d<0:d>0;
  const col=good?'var(--ok)':'var(--alert)';
  return '<div class="wow" style="color:'+col+'">'+(d>0?'▲':'▼')+Math.abs(d).toLocaleString('ja-JP')+
    (unit||'')+' <span style="color:var(--faint)">先週 '+fmt(prev)+(unit||'')+'</span></div>';
}

// SVG要素の生成（日別グラフで使う）
const NS='http://www.w3.org/2000/svg';
const mk=(t,a)=>{const e=document.createElementNS(NS,t);
  for(const k in (a||{}))e.setAttribute(k,a[k]);return e;};

// グラフのホバー説明
const tipEl=document.createElement('div'); tipEl.className='tip'; document.body.appendChild(tipEl);
function showTip(html,x,y){
  tipEl.innerHTML=html; tipEl.style.opacity=1;
  const r=tipEl.getBoundingClientRect();
  let l=x-r.width/2, t=y-r.height-12;
  l=Math.max(8,Math.min(l,innerWidth-r.width-8));
  if(t<8)t=y+18;
  tipEl.style.left=l+'px'; tipEl.style.top=t+'px';
}
const hideTip=()=>{tipEl.style.opacity=0;};
function bindTip(e,html){
  e.addEventListener('pointerenter',()=>{const r=e.getBoundingClientRect();
    showTip(html,r.left+r.width/2,r.top);});
  e.addEventListener('pointerleave',hideTip);
  e.setAttribute('tabindex','0');
  e.addEventListener('focus',()=>{const r=e.getBoundingClientRect();
    showTip(html,r.left+r.width/2,r.top);});
  e.addEventListener('blur',hideTip);
}
addEventListener('scroll',hideTip,{passive:true});

function render(){
  syncPickCount();
  // チェックを外している人がいるか。効かない場所に注記を出すのに使う。
  const hid=D.people.some(p=>hidden.has(p.id));

      '<span style="color:var(--faint)">（誰を除くかは スプレッドシートの '+
      'KPI営業_集計除外 で変えられます。架電と架電リストは除いていません）。</span>'
    : '';
  const c1=$('cards1'); c1.innerHTML='';
  const anqDen=a.anq_den||0, anqNum=a.anq_num||0;
  // 「1人あたり」の相手と、その合計。率のカードには付けない。
  const AB=avgBase(), TT=sumTeam(D.by_person, AB&&AB.team);
  const tden=(TT['実施']||0)+(TT['未実施']||0)+(TT['未処理']||0)+(TT['要判定']||0);
  [
    {lab:'① 取ったアポ',val:a.apo||0,unit:'件',hint:'今月アポ日が確定した数',sub2:oi('apo'),
     avg:avgLine(AB,TT.apo||0)},
    {lab:'③ 商談の予定',val:a.pool||0,unit:'件',hint:'今月に商談日が入っている数',sub2:oi('pool'),
     avg:avgLine(AB,TT.pool||0)},
    {lab:'④ 日が過ぎた分',val:den,unit:'件',hint:'このうち下の率を計算',
     avg:avgLine(AB,tden)},
    {lab:'② やった商談',val:a['実施']||0,unit:'件',hint:'ステージが先へ進んだ数',sub2:oi('実施'),
     avg:avgLine(AB,TT['実施']||0)},
    {lab:'⑥ 商談化率',val:rate,pct:true,hint:fmt(a['実施']||0)+' ÷ '+fmt(den)+' 件'},
    {lab:'⑤ アンケート回収率',val:anqDen?anqNum/anqDen*100:null,pct:true,
     hint:fmt(anqNum)+' ÷ '+fmt(anqDen)+' 件（今日までに商談日が来た分）'},
    {lab:'⑨ 持っているCヨミ',val:a.cyomi||0,unit:'件',hint:'決定者と合意できた案件',sub2:oi('cyomi'),
     avg:avgLine(AB,TT.cyomi||0)},
  ].forEach(o=>c1.appendChild(cardEl(o)));

  // ---- いま手を打てること ----
  const stale=pick(D.stale), anq=pick(D.anq_missing), cys=pick(D.cyomi_stale),
        wk=pick(D.week_deals), nx=pick(D.next_week_deals);
  const c2=$('cards2'); c2.innerHTML='';
  const toggle=k=>()=>{openKey=openKey===k?null:k;render();
    if(openKey)setTimeout(()=>$('panel').scrollIntoView({behavior:'smooth',block:'nearest'}),50);};
  [
    {key:'stale',lab:'⑦ ステージが止まっている',val:stale.length,unit:'件',

    {key:'anq',lab:'⑤ アンケート未回収',val:anq.length,unit:'件',

    {key:'cyomi',lab:'⑨ Cヨミで止まっている',val:cys.length,unit:'件',

    {key:'week',lab:'③ 今週の商談',val:wk.length,unit:'件',

    {key:'next',lab:'③ 来週の商談',val:nx.length,unit:'件',
     hint:md(D.next_week.start)+'〜'+md(D.next_week.end)+' の予定',onClick:toggle('next')},
  ].forEach(o=>c2.appendChild(cardEl(o)));

  const P=$('panel'); P.innerHTML=''; P.classList.toggle('hide',!openKey);

      anq:{t:'アンケートが未回収の商談',rows:anq,opt:{},
        d:'今週・来週これから商談するもののうち、事前アンケートがまだ返ってきていないものです。商談前に催促してください。'},
      cyomi:{t:'Cヨミで30日以上動いていない取引',rows:cys,opt:{days:true},
        d:'決定者と価値合意ができてから30日以上、ステージが動いていません。次の一手を決めてください。'},
      week:{t:'今週の商談',rows:wk,opt:{},d:'日付の早い順です。終わった日はうすく表示しています。',byDay:true},
      next:{t:'来週の商談',rows:nx,opt:{},d:'来週の予定です。',byDay:true},

  // ---- 架電（Zoomのコール数を架電数として扱う）----

      const bw=iw/dd.length,bar=Math.min(46,bw*0.64);
      dd.forEach((x,ix)=>{
        const cx=ml+bw*ix+bw/2,h=ih*x.calls/mx,y=mt+ih-h,hc=ih*(x.connected||0)/mx;
        const g=mk('g');
        g.appendChild(mk('rect',{x:cx-bar/2,y,width:bar,height:Math.max(h,2),rx:3,fill:'var(--border)'}));
        g.appendChild(mk('rect',{x:cx-bar/2,y:mt+ih-hc,width:bar,height:Math.max(hc,2),rx:3,fill:'var(--accent)'}));
        sv.appendChild(g);
        bindTip(g,'<b>'+md(x.date)+'（'+wd(x.date)+'）</b>'+
          '<div class="row"><span>架電</span><span>'+fmt(x.calls)+'件</span></div>'+
          '<div class="row"><span>つながった</span><span>'+fmt(x.connected)+'件</span></div>'+
          '<div class="row"><span>5分超</span><span>'+fmt(x.long)+'件</span></div>');
        const t=mk('text',{x:cx,y:H-10,'text-anchor':'middle',class:'axis-l'});
        t.textContent=md(x.date);sv.appendChild(t);});
      const bx=document.createElement('div'); bx.className='chartbox'; bx.appendChild(sv);
      box.appendChild(bx);
      box.innerHTML+='<div class="blegend" style="margin-top:6px">'+
        '<span><i style="background:var(--accent)"></i>つながった</span>'+
        '<span><i style="background:var(--border)"></i>つながらず</span></div>';
    }
    kb.appendChild(box);

    const rows=Object.entries(per.by_person||{})
      .filter(function(e){const oid=e[0];const pp=(C_.people||[]).find(x=>x.id===oid);
        if(hidden.has(oid)) return false;
        if(person) return oid===person;
        if(team==='すべて') return true;
        return pp&&pp.team===team;})
      .map(function(e){const oid=e[0],v=e[1];
        const pp=(C_.people||[]).find(x=>x.id===oid)||{};
        const pv=prevP?((prevP.by_person||{})[oid]||{}):null;
        return {name:pp.name||('owner_'+oid),team:teamLabel(pp)||'—',
                calls:v.calls||0,conn:v.connected||0,lng:v.long||0,prev:pv?(pv.connected||0):null};})
      .sort((x,y)=>y.conn-x.conn).slice(0,40);
    if(rows.length){
      const b2=document.createElement('div'); b2.className='c'; b2.style.marginTop='11px';
      b2.innerHTML='<div class="lab">'+PL[callPeriod]+'の架電数（人別・上位'+rows.length+'名）</div>';
      const tw=document.createElement('div'); tw.className='tw';
      const tb=document.createElement('table');
      tb.innerHTML='<thead><tr><th>担当</th><th>チーム</th><th class="n">架電数</th>'+
        '<th class="n">発信回数</th><th class="n">つながった率</th><th class="n">5分超</th>'+
        (prevP?'<th class="n">前週比</th>':'')+'</tr></thead>';
      const bd=document.createElement('tbody');
      rows.forEach(function(r){const tr=document.createElement('tr');
        const d2=(r.prev==null)?null:r.conn-r.prev;
        tr.innerHTML='<td>'+r.name+'</td><td style="color:var(--sub)">'+r.team+'</td>'+
          '<td class="n"><b>'+fmt(r.conn)+'</b></td><td class="n" style="color:var(--sub)">'+fmt(r.calls)+'</td>'+
          '<td class="n">'+pct(r.calls?r.conn/r.calls*100:null)+'</td>'+
          '<td class="n">'+fmt(r.lng)+'</td>'+
          (prevP?('<td class="n" style="color:'+(d2>0?'var(--ok)':(d2<0?'var(--alert)':'var(--faint)'))+'">'+
            (d2>0?'+':'')+fmt(d2)+'</td>'):'');
        bd.appendChild(tr);});
      tb.appendChild(bd); tw.appendChild(tb); b2.appendChild(tw);
      const um=C_.unmatched_by_dept||{};
      b2.innerHTML+='<div class="hint" style="margin-top:8px">'+
        '担当者に紐づいた発信は '+fmt(cur.calls||0)+'件'+
        (hid?'（チェックを外した人を除いた数）':'')+
        ' ／ 全体 '+fmt((per.total||{}).calls||0)+'件'+
        (hid?'（こちらは<b>絞り込み前</b>）':'')+'。'+
        '紐づかない分は他部署の発信です（'+
        Object.keys(um).slice(0,3).map(k=>k+' '+fmt(um[k])+'件').join(' ／ ')+'）。</div>';
      kb.appendChild(b2);
    }
  }else{
    $('lead3').textContent='架電データがありません。';
  }

  // ---- 架電リストの残り ----
  //
  // 🔴 「すべて」で出すのは**営業チームの合計**であって、アポ前パイプライン全体
  //    ではない（2026-09-08 ユーザー判断）。全体で数えると「74.5%が未着手」に
  //    なるが、それは名簿に載っていない人が持っている在庫に引きずられた数字だった。
  //    営業チームだけで数えると 72.8% が着手済み。現場が見たいのは後者。
  //    配られていない在庫は下の「まだ配られていないリスト」に別枠で出す。
  const ALL=K.all||{};
  const nTeams=Object.keys(K.by_team||{}).filter(t=>t!=='チーム未設定').length;
  // 🔴 サーバの cls/base をそのまま使わず by_person から足し直す。
  //    チェックを外した人をここでも抜くため。
  //    「すべて」は営業チームぶんだけ（在庫は下の別枠）。
  const salesCls=sumIf(K.by_person, id=>isSalesTeam(TEAM_OF[id]));
  const unCls=sumIf(K.by_person, id=>!isSalesTeam(TEAM_OF[id]));
  // 担当者が入っていない分は「人」ではないのでチェックで外せない。常に在庫側。
  const noOwn=(K.no_owner||{}).base||0;
  ['未架電','未接触','接触済み','base'].forEach(k=>{
    unCls[k]=(unCls[k]||0)+((K.no_owner||{})[k]||0);});
  const scope=(function(){
    if(!K.has_by_owner)
      return (!person&&team==='すべて')?{c:kc,base:K.base,who:'会社全体',whole:true}:null;
    if(!person&&team==='すべて')
      return {c:salesCls,base:salesCls.base||0,who:'営業'+nTeams+'チームの合計',whole:true};
    const c=sumScope(K.by_person);
    const who=person?((D.people.find(x=>x.id===person)||{}).name||'この担当者')+' が持っている分'
                    :team+' が持っている分';
    return {c:c,base:c.base||0,who:who};
  })();
  const c3b=$('cards3b'); c3b.innerHTML='';
  const lb=$('listbar'); lb.innerHTML='';
  if(!scope){
    $('lead3b').innerHTML='<b style="color:var(--warn)">担当者ごとの内訳がまだ集計されていません。</b>'+
      '<span style="color:var(--faint)">（日次同期が KPI営業_架電リスト_担当別 を作ると出ます）</span>';
  }else if(!scope.base){
    $('lead3b').textContent=scope.who+'：架電リストに取引がありません。';
  }else{
    const sb=scope.base, sc=scope.c;
    const g=k=>sc[k]||0;
    // 母数の動き。KPI営業_週次 に記録されているのは**アポ前パイプライン全体**の
    // 母数なので、営業チームの合計と比べると桁が合わない。全体の数字と並べて出す。
    const tr=scope.whole?D.kaden.base_trend:null;
    const sign=n=>(n>0?'＋':'−')+fmt(Math.abs(n));
    $('lead3b').innerHTML='リストのどこまで手がついているか。<b>'+scope.who+'</b>の数字です。'+
      (scope.whole
        ? (K.has_by_owner
            ? '<br><span style="color:var(--faint)">名簿でチームが決まっている人が持っている分だけを数えています。'+
              'まだ誰にも配られていない分は下に別枠で出しています。</span>'
            : '')
        : '<br><span style="color:var(--faint)">チームや個人を選ぶと、'+
          'その担当者が持っている取引だけで数え直します。</span>');
    [
      {lab:'まだかけていない',val:g('未架電'),unit:'件',hint:pct(g('未架電')/sb*100)+' を占めます'},
      {lab:'つながらず',val:g('未接触'),unit:'件',hint:'受付ブロック・不在・不通'},
      {lab:'話せた',val:g('接触済み'),unit:'件',hint:'担当者と接触できた'},
      {lab:'手をつけた割合',val:(g('未接触')+g('接触済み'))/sb*100,pct:true,
       hint:fmt(g('未接触')+g('接触済み'))+' ÷ '+fmt(sb)+' 件',
       sub2:'<span style="color:var(--sub)">母数 '+fmt(sb)+'件</span>'},
    ].forEach(o=>c3b.appendChild(cardEl(o)));
    const cols={'未架電':'var(--warn)','未接触':'var(--alert)','接触済み':'var(--accent)'};
    const wrapB=document.createElement('div'); wrapB.className='c'; wrapB.style.marginTop='11px';
    const bar2=document.createElement('div'); bar2.className='bar';
    ['未架電','未接触','接触済み'].forEach(k=>{const sp=document.createElement('span');
      sp.style.cssText='width:'+(g(k)/sb*100)+'%;background:'+cols[k];bar2.appendChild(sp);});
    wrapB.appendChild(bar2);
    const lg2=document.createElement('div'); lg2.className='blegend';
    ['未架電','未接触','接触済み'].forEach(k=>{
      lg2.innerHTML+='<span><i style="background:'+cols[k]+'"></i>'+k+' '+fmt(g(k))+'件</span>';});
    wrapB.appendChild(lg2);
    // 決定者・決裁者は全社でしか数えていない。担当者ごとに数えると
    // リクエストが4倍になるわりに、全社で 0.1〜0.2% しか入っておらず差が出ないため。
    wrapB.innerHTML+='<div class="hint" style="margin-top:10px">決定者・決裁者の入力状況'+
      '（<b>アポ前リスト全体</b> '+fmt(K.total)+'件・チームや個人では出せません。'+
      (hid?'<b style="color:var(--warn)">チェックの絞り込みは効きません</b>）: ':'）: ')+
      Object.keys(K.fill).map(k=>k+' '+pct(K.fill[k]/K.total*100)).join(' ／ ')+
      '　<b style="color:var(--alert)">ほぼ入っていません。</b></div>';
    lb.appendChild(wrapB);

    // ---- まだ配られていないリスト（全社のときだけ）----
    //
    // 上のカードは「営業チームが持っている分」なので、誰にも配られていない在庫は
    // そこに入らない。配る判断に使えるよう、誰が抱えているかまで出す。
    if(scope.whole&&K.has_by_owner&&unCls.base){
      const un=document.createElement('div'); un.className='c'; un.style.marginTop='11px';
      const ug=k=>unCls[k]||0;
      un.innerHTML='<div class="lab">まだ配られていないリスト</div>'+
        '<div class="v">'+fmt(unCls.base)+'<small>件</small></div>'+
        '<div class="hint">名簿でチームが決まっていない人が持っている分と、担当者が'+
        '入っていない分。<b>上の「'+scope.who+'」には入っていません。</b></div>'+
        '<div class="sub2">まだかけていない '+fmt(ug('未架電'))+'件 ／ つながらず '+
        fmt(ug('未接触'))+'件 ／ 話せた '+fmt(ug('接触済み'))+'件</div>';
      const rows=((K.unassigned||{}).people||[])
        .filter(p=>p.base>0&&!hidden.has(p.id)).slice(0,8);
      if(rows.length||noOwn){
        const tw=document.createElement('div'); tw.className='tw'; tw.style.marginTop='8px';
        const tb=document.createElement('table');
        tb.innerHTML='<thead><tr><th>誰が持っているか</th><th>所属</th>'+
          '<th class="n">件数</th><th class="n">まだかけていない</th></tr></thead>';
        const bd=document.createElement('tbody');
        rows.forEach(p=>{const tr2=document.createElement('tr');
          tr2.innerHTML='<td>'+p.name+'</td>'+
            '<td style="color:var(--sub)">'+(p.hsTeam||'—')+'</td>'+
            '<td class="n"><b>'+fmt(p.base)+'</b></td>'+
            '<td class="n">'+fmt(p['未架電'])+'</td>';
          bd.appendChild(tr2);});
        if(noOwn){
          const tr2=document.createElement('tr');
          tr2.innerHTML='<td>（担当者が入っていない）<span class="sm">'+
            '担当者が居ないのでチェックでは外せません</span></td>'+
            '<td style="color:var(--sub)">—</td>'+
            '<td class="n"><b>'+fmt(noOwn)+'</b></td><td class="n">—</td>';
          bd.appendChild(tr2);}
        tb.appendChild(bd); tw.appendChild(tb); un.appendChild(tw);
      }
      // 母数が動くことの説明。率の増減を「進んだ／戻った」と読ませないための注記。
      // 週次に残っているのはアポ前リスト全体の母数なので、ここで並べて出す。
      un.innerHTML+='<div class="hint" style="margin-top:10px">'+
        'アポ前リスト全体では <b>'+fmt(ALL.base)+'件</b>'+
        (tr?'（'+tr.week+' の記録 '+fmt(tr.base)+'件 より <b>'+sign(tr.diff)+'</b>）':'')+'。'+
        '<b>この母数そのものが動きます。</b>アポ前リストと BPO リストの間で毎月まとまった'+
        '件数が行き来しています（リスト管理の通常の運用です）。そのため'+
        '<b>率が動いても、そのまま「進んだ／戻った」とは限りません</b>。'+
        'この画面では増減の理由までは判定できないので、'+
        '大きく動いた月はリストを動かした人に確認してください。</div>';
      lb.appendChild(un);
    }
  }

  // ---- 週次スナップショット ----
  //
  // 🔴 商談の数え方が2つある。取り違えると必ず誤読されるので、どちらを見ているかを
  //    見出しにも注記にも出す。
  //      week  その週（月〜日）に予定されていた商談。週どうしを比べられる
  //      month 当月に予定されている商談を月初から積み上げたもの。月初にリセットされる
  //    当月ぶんだけを並べると、月初の行で 1,064 → 537 と半減して見える
  //    （8月と9月を比べているだけで、減ってはいない）。
  const S=D.snapshots||[];
  const SNAP={
    week:{chip:'その週の商談', head:'その週に予定された商談',
          note:'その週（月〜日）に予定されていた商談だけを数えたもの。'+
               '毎週おなじ長さの窓なので、<b>週どうしを比べられます</b>。'},
    month:{chip:'当月の累積', head:'当月に予定された商談（月初からの累積）',
           note:'その月に予定されている商談を月初から積み上げたもの。'+
                '<b style="color:var(--warn)">月が変わるとゼロから数え直しになります。</b>'+
                '月初の週が前の週より小さいのは、減ったのではなく別の月を見ているためです。'}};
  const sm=$('snapmode');
  if(!sm.dataset.done){
    Object.keys(SNAP).forEach(k=>{
      const b=document.createElement('button');
      b.className='chip'; b.textContent=SNAP[k].chip;
      b.onclick=()=>{snapMode=k;render();};
      sm.appendChild(b);});
    sm.dataset.done='1';
  }
  [...sm.children].forEach((b,ix)=>b.classList.toggle('on',Object.keys(SNAP)[ix]===snapMode));

  $('lead4').innerHTML=(S.length<2
    ? '週ごとの記録をこれから貯めていきます。今週が1週目なので、比較は来週から出せます。<br>'
    : '')+
    '<b>商談の数え方を2つ持っています。下のボタンで切り替えてください。</b><br>'+
    '<b>'+SNAP.week.chip+'</b>＝'+SNAP.week.note+'<br>'+
    '<b>'+SNAP.month.chip+'</b>＝'+SNAP.month.note+
    '<br><span style="color:var(--faint)">この表は<b>全社</b>の記録です。'+
    '上のチーム・個人の絞り込みには連動しません。'+
    (hid?'<b style="color:var(--warn)">担当者のチェックも効きません</b>'+
         '（記録した時点の値をそのまま出しているため）。':'')+'</span>';

  const sb=$('snapbox'); sb.innerHTML='';
  const box=document.createElement('div'); box.className='c';
  const t=document.createElement('table');
  t.innerHTML='<thead><tr><th rowspan="2">週</th>'+
    '<th class="n grp" colspan="3">'+SNAP[snapMode].head+'</th>'+
    '<th class="n" rowspan="2">架電数<span class="sm">その週の合計</span></th>'+
    '<th class="n" rowspan="2">取ったアポ<span class="sm">当月の累計</span></th>'+
    '<th class="n" rowspan="2">止まっている<span class="sm">記録した時点</span></th>'+
    '<th class="n" rowspan="2">架電リスト母数<span class="sm">記録した時点</span></th></tr>'+
    '<tr><th class="n">商談</th><th class="n">やった</th><th class="n">商談化率</th></tr></thead>';
  const tb=document.createElement('tbody');
  let missing=0;
  const shown=S.slice(-8);
  shown.forEach((s,ix)=>{
    const tt=s.totals||{};
    // 架電リストの母数は前の行との差も出す。動いたこと自体が
    // 「リストを入れ替えた」という事実で、率の比較が成り立たない合図になる。
    const pb=ix?shown[ix-1].kaden_base:null;
    const bd=(pb&&s.kaden_base)?s.kaden_base-pb:null;
    // 週ベースの列は 2026-09-07 に足したもの。それより前に記録した行には入っていない。
    // 0 で埋めると「その週は0件だった」と嘘になるので「—」を出す。
    const src=(snapMode==='week')?s.week_totals:tt;
    let cells;
    if(src){
      const dn=(src['実施']||0)+(src['未実施']||0)+(src['未処理']||0)+(src['要判定']||0);
      const half=(snapMode==='week')&&s.week_partial;
      cells='<td class="n">'+fmt(src.pool)+
        (half?'<span class="sm">週の途中（集計中）</span>':'')+'</td>'+
        '<td class="n">'+fmt(src['実施'])+'</td>'+
        '<td class="n">'+(dn?pct((src['実施']||0)/dn*100):'—')+'</td>';
    }else{
      missing++;
      cells='<td class="n" colspan="3"><span style="color:var(--faint)">'+
        'この数え方で記録する前の週です</span></td>';
    }
    const tr=document.createElement('tr');
    tr.innerHTML='<td>'+s.week+'<br><span style="color:var(--faint);font-size:11.5px">'+
      md(s.week_start)+' の週</span></td>'+cells+
      '<td class="n">'+(s.zoom_called==null?'<span style="color:var(--faint)">—</span>'
        :fmt(s.zoom_called)+(s.zoom_partial
          ?'<span class="sm">'+s.zoom_days+'日目まで（集計中）</span>':''))+'</td>'+
      '<td class="n">'+fmt(tt.apo)+'</td>'+
      '<td class="n">'+fmt(s.stale)+'</td>'+
      '<td class="n">'+(s.kaden_base?fmt(s.kaden_base):'<span style="color:var(--faint)">—</span>')+
        (bd?'<span class="sm">'+(bd>0?'＋':'−')+fmt(Math.abs(bd))+'</span>':'')+'</td>';
    tb.appendChild(tr);});
  t.appendChild(tb);
  const stw=document.createElement('div'); stw.className='tw'; stw.appendChild(t);
  box.appendChild(stw);
  box.innerHTML+='<div class="hint" style="margin-top:8px">'+
    'いま出しているのは<b>「'+SNAP[snapMode].head+'」</b>です。'+SNAP[snapMode].note+'<br>'+
    (snapMode==='week'
      ? 'その週の数字は<b>週が終わるまで確定しません</b>（残りの日ぶんが「これから」に入るため）。'+
        '週が終わったあと、翌週の取り直しで実施・未実施を入れ直します。'
      : '「取ったアポ」も当月の累計なので、この列も月初にリセットされます。')+'<br>'+
    (missing?'「この数え方で記録する前の週です」と出ている行は、'+
      '週ごとの数え方を足した 2026-09-07 より前に記録したものです。'+
      '当月の累積なら見られます。<br>':'')+
    'この画面を開いたときではなく、データを取り直したときに1週ぶんが記録されます。'+
    '週の途中で取り直すと、その週の行が上書きされます。'+
    '架電数はZoomでつながった通話の数です。<br>'+
    '<b>架電リスト母数</b>はアポ前リストの件数です。BPOリストとの間で件数が'+
    '行き来するため週ごとに動きます。<b>母数が動いた週は、率の比較が成り立ちません。</b></div>';
  sb.appendChild(box);
}
render();

$('foot').innerHTML=
  'カードの下の小さい「1人あたり」は、選んでいるチームの合計を<b>そのチームの人数</b>'+
  '（個人プルダウンに出る人数）で割ったものです。個人を選んだときは、'+
  'その人が所属するチームの平均を出しています。'+
  '率のカード（商談化率・アンケート回収率・つながった率）には付けていません。<br>'+
  '⑧ 決定者以上の割合は、判定できる材料が足りないためまだ出せません（事前アンケートの回収が必要です）。<br>'+
  '「ステージが止まっている」は商談予定日を過ぎてもステージが「アポ日確定」のままのもの（直近'+D.stale_days+'日ぶん）。'+
  'ステージが止まっているだけで、商談をしたかどうかは分かりません。<br>'+
  '架電数は Zoom のログで「つながった通話」を数えたものです。'+
  '相手が出る前に切った発信・失敗した発信は「発信した回数」にだけ入ります。<br>'+
  '誰がかけたかは、Zoomのメールアドレスと HubSpot 担当者のメールアドレスで突き合わせています'+
  ((D.calls&&D.calls.periods&&D.calls.periods.this_week)?
    ('（今週の発信 '+fmt(D.calls.periods.this_week.total.calls)+'件のうち '+
     fmt(D.calls.periods.this_week.matched)+'件が突合できました。残りは medica事業部など他部署の発信です）'):'')+'。<br>'+
  'データ取得: '+D.generated_at+' ／ HubSpot・Zoom（読み取りのみ）。自動更新はまだ行っていません。';
})();
</script>
